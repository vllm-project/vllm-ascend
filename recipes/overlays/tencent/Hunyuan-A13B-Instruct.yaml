guide_sections:
  ascend: |
    ### Ascend Atlas 800 A3 (910C)

    Verified single-node TP=4 BF16 on Atlas 800 A3 (4 Ascend910 dies) with vLLM Ascend
    `v0.23.0-a3`. Static weight load logged `Loading model weights took 37.4562 GB` per
    NPU (tutorial KPI ~37.46 GB/NPU). Tutorial chat curl PASS. AISBench PERF gsm8k
    MaxConc=16 PASS (TTFT≈247.7ms, TPOT≈44.8ms).

    ```bash
    export HCCL_INTRA_ROCE_ENABLE=1
    export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
    export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
    export HCCL_BUFFSIZE=512

    vllm serve Tencent-Hunyuan/Hunyuan-A13B-Instruct \
      --trust-remote-code \
      --host 0.0.0.0 \
      --port 8000 \
      --served-model-name Hunyuan \
      --tensor-parallel-size 4 \
      --max-model-len 32768 \
      --gpu-memory-utilization 0.90
    ```

    Downstream Ascend recipes mirror:
    https://github.com/vllm-ascend/vllm-ascend-recipes/pull/169
