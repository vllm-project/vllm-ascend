    ### A2 document parsing with native Paddle NPU layout

    PP-DocLayoutV2 uses Paddle custom-NPU on A2 and must remain separate from the vLLM environment. The historical run used a real 910B3; it does not validate 910B2. The following immutable CANN 8.0 layout image preserves that compiler/runtime boundary.

    ```bash
    export IMAGE=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/device/paddle-npu:cann800-ubuntu20-npu-910b-base-aarch64-gcc84@sha256:9bbc08c1bed9c064f0775da4a7bd1c857fa33d0d51bcd705e6829f4cbcf86911
    docker run --rm -it --name paddleocr-layout-a2 --net=host --shm-size=1g \
        --device /dev/davinci0 --device /dev/davinci_manager \
        --device /dev/devmm_svm --device /dev/hisi_hdc \
        -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/dcmi:/usr/local/dcmi -v "$PWD":/work -w /work \
        -e ASCEND_RT_VISIBLE_DEVICES=0 "$IMAGE" bash
    # Inside the Paddle container (Python 3.10, aarch64):
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    source /usr/local/Ascend/nnal/atb/set_env.sh --cxx_abi=0
    python -m pip install 'numpy<2' 'setuptools<81' 'protobuf==3.20.3' decorator sympy scipy attrs psutil paddlepaddle==3.2.0
    python -m pip install https://paddle-whl.bj.bcebos.com/stable/npu/paddle-custom-npu/paddle_custom_npu-3.2.0-cp310-cp310-linux_aarch64.whl
    python -m pip install 'paddleocr[doc-parser]==3.3.2' safetensors modelscope
    python - <<'PY'
    import sys
    import sysconfig
    import paddle

    sys.path.insert(0, sysconfig.get_path('stdlib'))
    assert 'npu' in paddle.device.get_all_custom_device_type()
    paddle.utils.run_check()
    PY
    modelscope download --model PaddlePaddle/PP-DocLayoutV2 --local_dir PP-DocLayoutV2
    ```

    Use the shared parse_document.py above with the native A2 layout device:

    ```bash
    python parse_document.py --input https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png --layout-model PP-DocLayoutV2 --layout-device npu --page-batch-size 16 --server-url http://127.0.0.1:8000/v1 --output document-output
    ```

    Both layout paths use 16-page batches with preprocessing queues disabled on a 32 GiB host. Earlier queue-enabled A2 attempts hit that quota; their failures remain recorded. This memory setting changes the document-processing configuration and must be included in timing comparisons. It does not change Golden annotations or metric definitions.

    ### Accuracy and performance acceptance boundaries

    The historical tutorial delegates accuracy and performance to the [ModelZoo PP-DocLayoutV2 guide](https://gitcode.com/Ascend/ModelZoo-PyTorch/tree/master/ACL_PyTorch/built-in/ocr/PP-DocLayoutV2). Its published 300I DUO single-chip reference is Overall 92.43%, a cited official 92.86%, and performance 12.10 seconds per input file. Its test.py starts timing after pipeline initialization, includes prediction and Markdown saving, and divides elapsed time by the original input-file count. PDFs may contain several pages per file. These are reference values, not new measurements. Warmup, concurrency, token limits and the permitted accuracy tolerance are not fully specified by the reference table. No A2-specific numeric target is published there.

    Use unchanged OmniDocBench v1.5 inputs and annotations and evaluator commit 523fd1d529c3e9d0088c662e983aa70fb9585c9a. Compute original text edit distance, table TEDS and rendered formula CDM; retain empty/truncated outputs and renderer failures. Keep model, layout model, precision, image digest, page/region batching, queues, concurrency, token cap, warmup, timing scope and peak memory with each result. The historical 1355-page scores belong to their recorded old images and are not replacement-image acceptance evidence.
