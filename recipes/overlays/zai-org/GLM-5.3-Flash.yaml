# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/zai-org/GLM-5.3-Flash.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
meta:
  hardware:
    ascend_950pr_8x: verified
    ascend_910b: supported
hardware_overrides:
  npu:
    extra_args:
      - '--trust-remote-code'
      - '--block-size'
      - '512'
      - '--max-model-len'
      - '131072'
      - '--max-num-seqs'
      - '16'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '512'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_CONNECT_TIMEOUT: '7200'
hardware_notes:
  ascend_950pr_8x:
    title: vLLM Ascend A5 image required
    body: Single-node TP8 on 8×950PR. Pin quay.io/ascend/vllm-ascend:nightly-main-a5 and overlay vLLM#53906 / vllm-ascend#15127. Do not pass --quantization ascend. --block-size 512 is required (kpool indexer). EP is not available on this interconnect.
  ascend_910b:
    title: W8A8 prefill/decode disaggregation on Atlas 800I A2 (910B4)
    body: >-
      Validated on 4 nodes x 8 NPU (32x Ascend 910B4, 64 GB HBM each): prefill
      pool 2 nodes at DP2 x TP1 x PCP8 with --enforce-eager and
      --max-num-batched-tokens 8192; decode pool 2 nodes at DP8 x TP2 with
      --max-num-batched-tokens 240 and FULL_DECODE_ONLY cudagraphs; KV transfer
      via MooncakeConnectorV2 with use_ascend_direct (prefill dp_size=2
      tp_size=1, decode dp_size=8 tp_size=2); int8 KV cache plus int8 indexer
      KV; MTP drafts (deepseek_mtp, 3 tokens) on both pools; 1M-token context.
      --quantization ascend is required for the W8A8 checkpoint. Evidence was
      collected on an internal nightly build of the v0.32.0rc line; this recipe
      pins the closest public tag quay.io/ascend/vllm-ascend:v0.32.0rc1
      (verified to exist) - re-validate on that tag before upgrading supported
      to verified. HCCL interface/IP/rank values (HCCL_SOCKET_IFNAME,
      HCCL_IF_IP, VLLM_HOST_IP, --data-parallel-address) are environment-bound
      and must be set per deployment.
    link:
      label: vLLM Ascend GLM-5.3-Flash tutorial
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/GLM5.3-Flash.html
strategy_hardware:
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910b: supported
features:
  spec_decoding:
    modes:
      mtp:
        hardware_overrides:
          ascend_910b:
            args:
              - '--speculative-config'
              - '{"method": "deepseek_mtp", "num_speculative_tokens": 3, "enforce_eager": false}'
variants:
  default:
    hardware_overrides:
      ascend_950pr_8x:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
        install:
          pip: false
  ascend_w8a8:
    model_id: Eco-Tech/GLM-5.3-Flash-w8a8
    label: W8A8 (A2 PD)
    precision: int8
    vram_minimum_gb: 386
    supported_hardware:
      - ascend_910b
    tp:
      ascend_910b: 2
    default_modes:
      spec_decoding: mtp
    min_vllm_version: '0.32.0'
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-expert-parallel'
      - '--max-model-len'
      - '1048576'
      - '--max-num-seqs'
      - '40'
      - '--max-num-batched-tokens'
      - '240'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--safetensors-load-strategy'
      - prefetch
      - '--kv-cache-dtype'
      - int8
      - '--attention-config'
      - '{"indexer_kv_dtype": "int8"}'
      - '--enable-prefix-caching'
      - '--compilation-config'
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_shared_expert_dp": true, "recompute_scheduler_enable": true, "enable_flashcomm1": false, "ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false, "enable_super_kernel": false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True,pin_memory_expandable_segments:True
      HCCL_BUFFSIZE: '1024'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_INTRA_ROCE_ENABLE: '1'
      TASK_QUEUE_ENABLE: '1'
      OMP_NUM_THREADS: '1'
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false
presets:
  ascend_a2_w8a8_pd:
    label: A2 W8A8 PD (2P + 2D)
    hardware: ascend_910b
    strategy: pd_cluster
    variants: [ascend_w8a8]
    workload: Prefill/decode disaggregation, 1M context
    roles:
      prefill:
        nodes: 2
        parallelism: dep
        args:
          - '--enforce-eager'
          - '--max-num-seqs'
          - '32'
          - '--max-num-batched-tokens'
          - '8192'
          - '--prefill-context-parallel-size'
          - '8'
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_connector_extra_config:
              use_ascend_direct: true
              prefill:
                dp_size: 2
                tp_size: 1
              decode:
                dp_size: 8
                tp_size: 2
      decode:
        nodes: 2
        parallelism: dep
        args:
          - '--max-num-seqs'
          - '40'
          - '--max-num-batched-tokens'
          - '240'
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_connector_extra_config:
              use_ascend_direct: true
              prefill:
                dp_size: 2
                tp_size: 1
              decode:
                dp_size: 8
                tp_size: 2
