    extra_args:
      - '--trust-remote-code'
      - '--block-size'
      - '512'
      - '--max-model-len'
      - '131072'
      - '--max-num-seqs'
      - '16'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '512'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_CONNECT_TIMEOUT: '7200'
  ascend_910b:
    extra_args:
      - '--enable-expert-parallel'
      - '--safetensors-load-strategy'
      - prefetch
      - '--max-num-seqs'
      - '32'
      - '--max-model-len'
      - '1048576'
      - '--max-num-batched-tokens'
      - '8192'
      - '--trust-remote-code'
      - '--quantization'
      - ascend
      - '--limit-mm-per-prompt'
      - '{"image":7,"video":0}'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--kv-cache-dtype'
      - int8
      - '--attention-config.indexer_kv_dtype'
      - int8
      - '--enforce-eager'
      - '--enable-prefix-caching'
      - '--additional-config'
      - '{"enable_flashcomm1":false,"enable_shared_expert_dp":true}'
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '1024'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_INTRA_ROCE_ENABLE: '1'
      TASK_QUEUE_ENABLE: '1'
      OMP_NUM_THREADS: '1'
      HCCL_SOCKET_IFNAME: '$IFACE_NAME'
      GLOO_SOCKET_IFNAME: '$IFACE_NAME'
      TP_SOCKET_IFNAME: '$IFACE_NAME'
hardware_notes:
  ascend_950pr_8x:
    title: vLLM Ascend A5 image required
    body: Single-node TP8 on 8×950PR. Pin quay.io/ascend/vllm-ascend:nightly-main-a5 and overlay vLLM#53906 / vllm-ascend#15127. Do not pass --quantization ascend. --block-size 512 is required (kpool indexer). EP is not available on this interconnect.
  ascend_910b:
    title: vLLM Ascend A2 image required
    body: |-
      Pin quay.io/ascend/vllm-ascend:v0.32.0rc1 - the NVIDIA pip wheel cannot run on Ascend NPU.
      PD roles = prefill + decode; TP/DP per role: prefill dp=2/tp=1/pcp=8, decode dp=8/tp=2; total NPUs = 32.
      Before declaring PD ready: every backend process healthy, requests via the router/proxy succeed, KV transfer completes.
      stop/cleanup: stop prefill/decode processes and the proxy on every node before restart.
      Set HCCL_BUFFSIZE=1024 before launch.
strategy_hardware:
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910b: supported
variants:
  default:
    hardware_overrides:
      ascend_950pr_8x:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
        install:
          pip: false
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false
  ascend_w8a8:
    model_id: Eco-Tech/GLM-5.3-Flash-w8a8
    label: W8A8 (Ascend A2)
    precision: int8
    vram_minimum_gb: 386
    description: 'ModelSlim INT8 W8A8 checkpoint measured on a 4-node Atlas 800I A2 (Ascend 910B) prefill/decode cluster: prefill DP2+TP1+PCP8 across 2 node(s), decode DP8+TP2 across 2 node(s). Requires --quantization ascend. Published at https://modelscope.cn/models/Eco-Tech/GLM-5.3-Flash-w8a8.'
    supported_hardware: [ascend_910b]
    tp:
      ascend_910b: 1
    min_vllm_version: 0.29.0
    extra_args:
      - '--quantization'
      - ascend
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false

strategy_min_gpus:
  ascend_910b: 32
strategy_overrides:
