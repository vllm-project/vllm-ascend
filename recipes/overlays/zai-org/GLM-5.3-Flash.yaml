# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/zai-org/GLM-5.3-Flash.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
meta:
  hardware:
    ascend_950pr_8x: verified
    ascend_910c: supported
    ascend_950dt_8x: supported
hardware_overrides:
  npu:
    extra_args:
      - '--trust-remote-code'
      - '--block-size'
      - '512'
      - '--max-model-len'
      - '131072'
      - '--max-num-seqs'
      - '16'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '512'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_CONNECT_TIMEOUT: '7200'
hardware_notes:
  ascend_950pr_8x:
    title: vLLM Ascend A5 image required
    body: Single-node TP8 on 8×950PR. Pin quay.io/ascend/vllm-ascend:nightly-main-a5 and overlay vLLM#53906 / vllm-ascend#15127. Do not pass --quantization ascend. --block-size 512 is required (kpool indexer). EP is not available on this interconnect.
strategy_hardware:
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910c: supported
    ascend_950dt_8x: supported
variants:
  default:
    hardware_overrides:
      ascend_950pr_8x:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
        install:
          pip: false
  ascend_w8a8:
    model_id: Eco-Tech/GLM-5.3-Flash-w8a8
    label: W8A8 (ASCEND A3)
    precision: int8
    vram_minimum_gb: 386
    description: Quantized ModelScope checkpoint for the release-branch PD preset; 386 GB is a capacity estimate,
      not measured HBM usage.
    supported_hardware:
    - ascend_910c
    supported_frontends:
    - python
    supported_features:
    - tool_calling
    - reasoning
    - spec_decoding
    min_vllm_version: 0.32.0
    nightly_required: true
    extra_args:
    - --quantization
    - ascend
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:nightly-releases-v0.32.0rc-a3
        docker_serve_command: vllm serve
        docker_shm_size: 100g
        install:
          pip: false
  ascend_w8a8_mxfp8:
    model_id: Eco-Tech/GLM-5.3-Flash-w8a8-mxfp8
    label: W8A8 MXFP8 (ASCEND 950DT)
    precision: mxfp8
    vram_minimum_gb: 386
    description: Quantized ModelScope checkpoint for the release-branch PD preset; 386 GB is a capacity estimate,
      not measured HBM usage.
    supported_hardware:
    - ascend_950dt_8x
    supported_frontends:
    - python
    supported_features:
    - tool_calling
    - reasoning
    - spec_decoding
    min_vllm_version: 0.32.0
    nightly_required: true
    extra_args:
    - --quantization
    - ascend
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
    hardware_overrides:
      ascend_950dt_8x:
        docker_image: quay.io/ascend/vllm-ascend:nightly-releases-v0.32.0rc-a5
        docker_serve_command: vllm serve
        docker_shm_size: 1g
        install:
          pip: false
# PCP is intentionally retained as a pending renderer dependency (Draft).
presets:
  ascend_a3_pd:
    label: A3 W8A8 PD (v0.32.0rc, PCP pending)
    hardware: ascend_910c
    strategy: pd_cluster
    variants:
    - ascend_w8a8
    image: quay.io/ascend/vllm-ascend:nightly-releases-v0.32.0rc-a3
    description: Direct MooncakeConnectorV2 transfer with PCP8 Prefill. Pending PCP-aware renderer and native DP
      device placement; not a runnable baseline.
    select:
      frontend: python
      pd_router: ascend
      pd_connector: mooncake_ascend
      kv_offload: 'off'
      features:
        tool_calling: true
        reasoning: true
        spec_decoding: mtp
    remove_args:
    - --block-size
    - --tokenizer-mode
    - --data-parallel-hybrid-lb
    env:
      GLOO_SOCKET_IFNAME: $IFACE_NAME
      TP_SOCKET_IFNAME: $IFACE_NAME
      HCCL_SOCKET_IFNAME: $IFACE_NAME
      ASCEND_GLOBAL_RESOURCE_CONFIG: $ASCEND_GLOBAL_RESOURCE_CONFIG
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        pcp: 8
        remove_args:
        - --compilation-config
        args:
        - --host
        - 0.0.0.0
        - --enable-eplb
        - --seed
        - '1024'
        - --safetensors-load-strategy
        - prefetch
        - --max-num-seqs
        - '32'
        - --max-model-len
        - '1048576'
        - --max-num-batched-tokens
        - '16384'
        - --trust-remote-code
        - --limit-mm-per-prompt
        - '{"image":1}'
        - --gpu-memory-utilization
        - '0.92'
        - --kv-cache-dtype
        - int8
        - --attention-config.indexer_kv_dtype
        - int8
        - --prefix-cache-retention-interval
        - None
        - --enforce-eager
        - --use-replayssm
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --port
        - '9081'
        - --data-parallel-rpc-port
        - '12325'
        env:
          HCCL_IF_IP: $PREFILL_NODE_1
          HCCL_BUFFSIZE: '1024'
        json_args:
          --eplb-config:
            window_size: 3000
            step_interval: 3000
            num_redundant_experts: 0
            use_async: true
            policy: stair
            communicator: hixl
          --speculative-config:
            num_speculative_tokens: 3
            method: deepseek_mtp
            enforce_eager: false
          --additional-config:
            enable_shared_expert_dp: true
            enable_fused_mc2: 2
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_role: kv_producer
            engine_id: '0'
            kv_port: '36680'
            kv_connector_extra_config: null
      decode:
        nodes: 1
        parallelism: dep
        tp: 2
        pp: 1
        args:
        - --host
        - 0.0.0.0
        - --seed
        - '1024'
        - --safetensors-load-strategy
        - prefetch
        - --max-num-seqs
        - '40'
        - --max-model-len
        - '1048576'
        - --max-num-batched-tokens
        - '240'
        - --trust-remote-code
        - --limit-mm-per-prompt
        - '{"image":1}'
        - --gpu-memory-utilization
        - '0.92'
        - --kv-cache-dtype
        - int8
        - --attention-config.indexer_kv_dtype
        - int8
        - --use-replayssm
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --port
        - '9900'
        - --data-parallel-rpc-port
        - '12325'
        env:
          HCCL_IF_IP: $DECODE_NODE_1
          HCCL_BUFFSIZE: '1024'
        json_args:
          --compilation-config:
            cudagraph_mode: FULL_DECODE_ONLY
          --speculative-config:
            num_speculative_tokens: 3
            method: deepseek_mtp
            enforce_eager: false
          --additional-config:
            multistream_overlap_shared_expert: true
            scheduler_config:
              recompute_scheduler_enable: true
            enable_shared_expert_dp: true
            enable_flashcomm1: true
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_role: kv_consumer
            engine_id: '1'
            kv_port: '36580'
            kv_connector_extra_config: null
    source:
      label: GLM-5.3-Flash v0.32.0rc ordinary PD tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/GLM5.3-Flash.md#glm53-flash-5-3-a3
      key: ascend_a3_pd
      revision: 49007fd8cbcf597d9a1a4e2ebc968c69257045ed
    runbook: Requires PCP-aware role sizing in recipes and PCP-aware device slicing in the native vLLM external-DP
      supervisor. The tutorial uses one process per DP rank via launch_online_dp.py; this preset describes the native
      supervisor migration and has not been NPU-validated. Start Decode, then Prefill, wait for every backend /health,
      then start the Ascend proxy. The proxy routes requests; it does not launch workers. Use the generated endpoint
      and port lists together. Baseline, other routers, KV pooling and altered topologies are outside this preset.
