guide_sections:
  ascend_pd: |
    ## Ascend release-branch PD reference

    The A3 and 950DT presets migrate ordinary PD from the
    [v0.32.0rc branch tutorial](https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/GLM5.3-Flash.md#53-1p1d-pd-disaggregated-deployment).
    They are reference designs, not production recommendations. PCP8 requires
    [recipes PR 1272](https://github.com/vllm-project/recipes/pull/1272) before
    these presets can be rendered and used. Do not replace PCP8 with TP8 or drop
    PCP to make validation pass. The original tutorial launcher remains the
    reference until those dependencies are available.

    | Preset | Checkpoint | Physical topology |
    | --- | --- | --- |
    | A3 W8A8 PD | [Eco-Tech/GLM-5.3-Flash-w8a8](https://www.modelscope.cn/models/Eco-Tech/GLM-5.3-Flash-w8a8) | Two 16-device, 64 GB/device A3 nodes: P DP2/TP1/PCP8, D DP8/TP2 |
    | 950DT W8A8 MXFP8 PD | [Eco-Tech/GLM-5.3-Flash-w8a8-mxfp8](https://www.modelscope.cn/models/Eco-Tech/GLM-5.3-Flash-w8a8-mxfp8) | Two 8-device, 96 GB/device 950DT nodes: P DP1/TP1/PCP8, D DP8/TP1 |

    The two weight formats are not interchangeable. Both configurations use
    MRV2, 1M context and MooncakeConnectorV2 without KV pooling. A3 uses INT8
    main/indexer KV caches, ReplaySSM, BF16 SSM state and MTP3; 950DT uses FP8
    main/indexer KV caches and MTP5. Cache quantization needs no separate C8
    checkpoint. The 386 GB weight budget is the base model's 321B x 1 byte x 1.2
    capacity estimate; it does not establish KV capacity or measured peak memory.

    Use matching release-branch images on both nodes: the source tutorial names
    `nightly-releases-v0.32.0rc-a3` and `nightly-releases-v0.32.0rc-a5`.
    These are mutable tags, not immutable release validation records. Record the
    resolved image digest and checkpoint revision for a deployment. ModelScope
    download is enabled for the quantized IDs; predownload and mount the exact
    checkpoint if the serving nodes cannot access ModelScope.

    Follow the linked tutorial's container prerequisites: A3 uses 100 GB shared
    memory and HCCS device communication with device RoCE ports down; 950DT uses
    1 GB shared memory and its URMA/HIXL devices and resource-file mounts.
    Before using the commands, export `ASCEND_GLOBAL_RESOURCE_CONFIG` on A3
    with the tutorial's `{"comm_resource_config.protocol_desc":["hccs:device"]}`
    value, or `ASCEND_LOCAL_COMM_RES` on 950DT with `{"version":"1.3"}`.
    These variables must be set in every role's shell (and in the invoking
    host shell for Docker). The preset references the prepared variables so
    shell copying preserves the JSON quotes; resolve them when using argv
    exports without a shell, just like the node-IP and interface placeholders.
    The generic Docker command does not supply all of the 950DT-specific mounts;
    prepare its container using the source Installation section before running
    the generated in-container commands. Set each node's IP and network interface
    and permit the API, DP RPC, HCCL and Mooncake ports.

    With [recipes PR #1272](https://github.com/vllm-project/recipes/pull/1272),
    A3 Prefill launches each external-DP rank with its own eight-device slice;
    950DT Prefill is one PCP8 service. Decode uses the native multi-port
    supervisor. The Ascend proxy routes requests. The expected endpoint counts are P2/D8 on A3 and P1/D8 on 950DT.
    Check every endpoint before starting the proxy. On 950DT, use a separate
    proxy host because the backend and proxy both use port 8000. Client requests
    must use the generated proxy endpoint and quantized model ID; the tutorial's
    `glm` alias is intentionally omitted so Serve, Verify and Bench stay aligned.

    Only the matching hardware, quantized variant and named PD preset describe
    these scenarios. Baseline and inherited variants/features remain reachable
    under the current renderer and are not qualified by this migration. No
    NPU smoke, accuracy or performance measurement was rerun for the generated
    launcher adaptation; the tutorial's older TP8 accuracy results are not
    evidence for this PCP8 deployment.
