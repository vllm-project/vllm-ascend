# Source: https://github.com/vllm-project/vllm/blob/9e6c6b007ae698bd8604620b17d5720a89169da8/recipes/models/deepseek-ai/DeepSeek-V3.1.yaml
# Extracted with vllm-project/recipes@8509229176ba2d1837339ffc4cbb4f34c1bf5e66.
variants:
  # The base recipe's default / nvfp4 variants carry no Ascend image; without
  # these blocks the renderer falls back to the NVIDIA default image and
  # emits an unrunnable `vllm serve` for ascend_910c. They are pinned for
  # installability only — these are GPU-only checkpoints that do not run on
  # Ascend; the verified Ascend deployment is the ascend_w8a8 variant below
  # (see notes).
  default:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  nvfp4:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_w8a8:
    model_id: Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot
    precision: int8
    label: W8A8 MTP QuaRot (ASCEND)
    vram_minimum_gb: 833
    supported_hardware:
      - ascend_910c
    tp: 4
    extra_args:
      - '--data-parallel-size'
      - '4'
      - '--speculative-config'
      - '{"num_speculative_tokens": 3, "method": "mtp"}'
      - '--quantization'
      - ascend
      - '--no-enable-prefix-caching'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '16384'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--served-model-name'
      - deepseek_v3
      - '--seed'
      - '1024'
      - '--compilation-config'
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"scheduler_config":{"enable_balance_scheduling":true}}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
          docker: true
    description: "ModelSlim W8A8 MTP QuaRot (weights on ModelScope: Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot) — 1 Atlas 800 A3 (16 die), TP4×DP4 + MTP."
strategy_hardware:
  single_node_tep:
    # TEP pins TP to the full node (16 NPUs on one Atlas 800 A3); combined
    # with this variant's static --data-parallel-size 4 the commands would
    # request 64 NPUs from a 16-NPU node, so the strategy is not offered
    # here. The verified single-node deployment is TP4×DP4 under
    # single_node_tp.
    ascend_910c: unsupported
  single_node_dep:
    # The DEP emitter renders --data-parallel-size 16 with no
    # --tensor-parallel-size, overriding the variant's static
    # --data-parallel-size 4 — 16 full replicas of this ~694 GB checkpoint
    # cannot fit on 64 GB devices. Not offered on ascend_910c.
    ascend_910c: unsupported
  multi_node_tp:
    # The multi-node TP/TP+PP/TEP emitters size TP across the whole cluster
    # (per node for TP+PP) and leave no room for this variant's static
    # --data-parallel-size 4, so these strategies are not offered on
    # Ascend 910C.
    ascend_910c: unsupported
  multi_node_tp_pp:
    ascend_910c: unsupported
  multi_node_tep:
    ascend_910c: unsupported
  multi_node_dep:
    # Renders --data-parallel-size 32 --data-parallel-size-local 16 with no
    # TP across two nodes — 32 full replicas of the checkpoint. Not offered;
    # the tutorial §5.2 handwritten two-node commands (DP4×TP4) are the
    # supported route (see notes).
    ascend_910c: unsupported
  pd_cluster:
    # The supported PD route on ascend_910c is the opt-in `ascend_a3_w8a8_pd`
    # preset below (tutorial §5.3: 2P1D Layerwise on four Atlas 800 A3 nodes
    # with Mooncake). Schema caveat: without the preset, the plain pd_cluster
    # pool is still selectable — strategy_min_gpus gates only the GPU floor,
    # and marking the strategy unsupported would disable the preset as well —
    # so it renders the base recipe's generic reference topology rather than
    # a validated Ascend deployment. The notes ask users to pick the preset.
    ascend_910c: supported

strategy_min_gpus:
  # The official PD topology is 2P1D Layerwise on four 16-NPU Atlas 800 A3
  # nodes (tutorial §5.3); a pd_cluster pool below that floor drops out.
  ascend_910c:
    pd_cluster: 64

presets:
  ascend_a3_w8a8_pd:
    label: W8A8 PD (2P1D Layerwise)
    hardware: ascend_910c
    strategy: pd_cluster
    variants: [ascend_w8a8]
    default: false
    remove_args:
      # Guard: drop --data-parallel-hybrid-lb; the builder emits it on
      # multi-node DEP pools, and the tutorial lane does not use it.
      - '--data-parallel-hybrid-lb'
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
    workload: 'Prefill/decode separation (2P1D Layerwise), 4 nodes x 16-die Atlas 800 A3, Mooncake'
    source:
      label: "DeepSeek-V3.1 tutorial, section 5.3 (v0.23.0 docs)"
      href: https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/DeepSeek-V3.1.html
      key: dsv31-a3-w8a8-pd-2p1d
      revision: "2026-11-26"
    image:
      vllm: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
      model_revision: master
    runbook: |
      ## Evidence and versions

      - Source: tutorial §5.3 (v0.23.0 docs), transcribed value-by-value
      - Image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
      - Checkpoint: Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot (ModelScope, master)
      - Validation status: not validated end-to-end; rendering verified
        against the official builder (DP4 prefill pool / DP32 decode pool)

      ## Transcription notes

      Transcribed from tutorial §5.3 (Multi-Node PD Separation Deployment):
      2P1D Layerwise on four Atlas 800 A3 (64GB x 16) nodes — 2 prefill
      nodes (DP2 x TP8 each) and one decode pool of DP32 x TP1 spanning 2
      nodes. 2P1D is recommended over 1P1D (2 nodes) there, because 1P1D
      lacks the NPU memory to serve high concurrency. The tutorial
      orchestrates per-node DP ranks with launch_online_dp.py /
      run_dp_template.sh and forwards requests through proxy.sh on the
      prefill master node; Mooncake is a prerequisite. Two simplifications
      against the tutorial scripts: the builder renders one prefill pool
      and one decode pool where the tutorial runs the prefill nodes as
      independent replica groups (each starting at DP rank 0), and per-node
      KV ports are folded to their first values (prefill 30000, decode
      30200; the tutorial also uses 30100).
    roles:
      prefill:
        nodes: 2
        # DEP renders one merged prefill pool: DP4 total at TP8 (two TP8
        # replicas per node, pool starting at DP rank 0, no --nnodes). The
        # TP emitter would stack the variant's static --data-parallel-size 4
        # on top of per-node TP8 (DP4xTP8 per node = 32 die), which does not
        # match the tutorial lane.
        parallelism: dep
        tp: 8
        args:
          - '--max-model-len'
          - '65536'
          - '--max-num-batched-tokens'
          - '16384'
          - '--max-num-seqs'
          - '8'
          - '--gpu-memory-utilization'
          - '0.9'
          - '--enforce-eager'
          - '--speculative-config'
          - '{"num_speculative_tokens": 1, "method": "mtp"}'
        remove_args:
          # The tutorial prefill lane runs neither a compilation config nor
          # an additional-config; the variant's two flags are dropped in
          # this role only (the decode role overrides theirs via its own
          # args). Serving values differ per role and travel in role args —
          # the last-wins dedupe keeps the role value over the variant's.
          - '--compilation-config'
          - '--additional-config'
        env:
          VLLM_RPC_TIMEOUT: '3600000'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
          HCCL_EXEC_TIMEOUT: '204'
          HCCL_CONNECT_TIMEOUT: '120'
          HCCL_BUFFSIZE: '256'
          TASK_QUEUE_ENABLE: '1'
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '10'
          VLLM_ASCEND_ENABLE_FLASHCOMM1: '1'
          VLLM_USE_V1: '1'
          HCCL_IF_IP: $PREFILL_NODE_1
          VLLM_HOST_IP: $PREFILL_NODE_1
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_producer
            kv_port: '30000'
            kv_connector_extra_config:
              # The builder renders one prefill pool, so the KV metadata
              # describes the whole pool (the tutorial's two prefill nodes
              # are independent replica groups, each declaring its own
              # dp_size 2); placeholders resolve to the rendered pool sizes.
              prefill:
                dp_size: '{prefill_dp_size}'
                tp_size: 8
              decode:
                dp_size: '{decode_dp_size}'
                tp_size: 1
      decode:
        nodes: 2
        parallelism: dep
        tp: 1
        args:
          - '--max-model-len'
          - '65536'
          - '--max-num-batched-tokens'
          - '256'
          - '--max-num-seqs'
          - '28'
          - '--gpu-memory-utilization'
          - '0.92'
          - '--speculative-config'
          - '{"num_speculative_tokens": 1, "method": "mtp"}'
          - '--compilation-config'
          - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert": true,"finegrained_tp_config": {"lmhead_tensor_parallel_size":16}}'
        env:
          VLLM_RPC_TIMEOUT: '3600000'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
          HCCL_EXEC_TIMEOUT: '204'
          HCCL_CONNECT_TIMEOUT: '120'
          HCCL_BUFFSIZE: '1100'
          TASK_QUEUE_ENABLE: '1'
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '10'
          VLLM_USE_V1: '1'
          HCCL_IF_IP: $DECODE_NODE_1
          VLLM_HOST_IP: $DECODE_NODE_1
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_consumer
            kv_port: '30200'
            kv_connector_extra_config:
              prefill:
                dp_size: '{prefill_dp_size}'
                tp_size: 8
              decode:
                dp_size: '{decode_dp_size}'
                tp_size: 1

notes:
  - title: "Multi-node data-parallel on Ascend 910C"
    when: { hardware: [ascend_910c] }
    body: |
      The builder's `*_dep` renderings are not offered on this hardware.
      For two-node data-parallel deployments the tutorial §5.2 carries
      handwritten per-node commands (DP4×TP4, documented on Atlas 800 A2);
      the PD preset below covers the disaggregated route.
  - title: "Ascend 910C: use the W8A8 MTP QuaRot (ASCEND) variant"
    when: { hardware: [ascend_910c] }
    body: |
      The `default` / `nvfp4` checkpoints above are pinned to an Ascend image
      so the commands are runnable, but these are GPU-only checkpoints that
      do not run on Ascend 910C. The verified deployment on one Atlas 800 A3
      is the **W8A8 MTP QuaRot (ASCEND)** variant (TP4×DP4 + MTP).
  - title: "Prefill/decode separation on Ascend 910C"
    when: { hardware: [ascend_910c] }
    body: |
      PD separation is offered as the opt-in **W8A8 PD (2P1D Layerwise)**
      preset: four Atlas 800 A3 nodes (2 prefill nodes + one DP32×TP1
      decode pool spanning 2 nodes) with Mooncake, per tutorial §5.3 —
      2P1D is recommended over 1P1D there. **Select the preset when
      deploying PD**: without it, the plain `pd_cluster` pool renders the
      base recipe's generic topology (NixlConnector KV transfer behind a
      vLLM router), which is not the validated Ascend route. The tutorial
      additionally uses per-node launcher scripts (launch_online_dp.py /
      run_dp_template.sh) and a request proxy on the prefill master node.

meta:
  date_updated: "2026-11-26"
  hardware:
    # First-party bring-up 2026-10-28 (single-node TP4/DP4 + MTP, benchmarked
    # repeatedly without engine errors); official runner-CI end-to-end
    # verification still pending (weights confirmed fetchable from
    # ModelScope; companion Ascend recipe
    # vllm-ascend/vllm-ascend-recipes#102).
    ascend_910c: supported
