meta:
  hardware:
    ascend_910c: verified
hardware_overrides:
  npu:
    extra_args:
      []
    extra_env:
      {}
hardware_notes:
  ascend_910c:
    title: "vLLM Ascend image required"
    body: |-
      Pin quay.io/ascend/vllm-ascend:v0.26.0rc1-a3 - the NVIDIA pip wheel cannot run on Ascend NPU.
      PD declaration (D01/PD01): roles = prefill + decode; total NPUs = 16.
      PD readiness (PD10): every backend process healthy; requests via the router/proxy succeed; KV transfer completes before declaring PD ready.
      stop/cleanup: stop prefill/decode processes and the proxy on every node before restart.
strategy_hardware:
  multi_node_dep:
    npu: supported
  single_node_tp:
    npu: unsupported
variants:
  default:
    hardware_overrides:
      ascend_910c:
        docker_image: 'quay.io/ascend/vllm-ascend:v0.26.0rc1-a3'
        install:
          pip: false
  ascend_w8a8:
    model_id: 'deepseek-ai/DeepSeek-V4-Flash'
    label: 'W8A8 (A3)'
    precision: int8
    vram_minimum_gb: 341
    description: 'W8A8 quantized serving on Ascend NPU. Requires --quantization ascend and the matching W8A8 checkpoint.'
    supported_hardware: [ascend_910c]
    tp:
      ascend_910c: 1
guide_sections:
  ascend: |-
    ### Running on Ascend NPU

    Serve this checkpoint with the vLLM Ascend image; the NVIDIA pip wheel cannot run on NPU:

    ```bash
    docker pull quay.io/ascend/vllm-ascend:v0.26.0rc1-a3
    ```

    Keep `--quantization ascend` and load the W8A8 checkpoint; an unquantized checkpoint will not serve with this flag.
