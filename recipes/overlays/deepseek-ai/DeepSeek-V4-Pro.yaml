# Source: https://github.com/vllm-project/vllm/blob/9e6c6b007ae698bd8604620b17d5720a89169da8/recipes/models/deepseek-ai/DeepSeek-V4-Pro.yaml
# Extracted with vllm-project/recipes@8509229176ba2d1837339ffc4cbb4f34c1bf5e66.
variants:
  ascend_w4a8:
    model_id: Eco-Tech/DeepSeek-V4-Pro-w4a8-mtp
    precision: int4
    label: W4A8-MTP (Ascend)
    vram_minimum_gb: 790
    supported_hardware:
      - ascend_910c
    tp: 16
    extra_args:
      - '--quantization'
      - ascend
      - '--speculative-config'
      - '{"num_speculative_tokens": 1,"method": "mtp","enforce_eager": true}'
      - '--kv-cache-dtype'
      - auto
      - '--enable-expert-parallel'
      - '--served-model-name'
      - dsv4
      - '--max-model-len'
      - '135000'
      - '--max-num-batched-tokens'
      - '4096'
      - '--max-num-seqs'
      - '32'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--block-size'
      - '128'
      - '--tokenizer-mode'
      - deepseek_v4
      - '--tool-call-parser'
      - deepseek_v4
      - '--enable-auto-tool-choice'
      - '--reasoning-parser'
      - deepseek_v4
      - '--model-loader-extra-config'
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding": true,"enable_flashcomm1": true,"multistream_overlap_shared_expert":true}'
    extra_env:
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_BUFFSIZE: '2048'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.23.0rc1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
          docker: true
    description: "ModelSlim W4A8+MTP (weights on ModelScope: Eco-Tech/DeepSeek-V4-Pro-w4a8-mtp) — 2x Atlas 800 A3 multi-node DP2xTP16 + MTP (first-party verified 2026-10-28, 390 tok/s; also fits 2x A3 128G / 4x A2 per the upstream tutorial). Node orchestration args (--data-parallel-address / --data-parallel-rpc-port / --data-parallel-start-rank) are per-node; see the companion Ascend recipe."
meta:
  hardware:
    # Performance first-party verified 2026-10-28 (multi-node DP2/TP16 + MTP,
    # 390 tok/s, TPOT 90.5 ms); accuracy run planned for December
    # (companion Ascend recipe vllm-ascend/vllm-ascend-recipes#130).
    ascend_910c: supported
