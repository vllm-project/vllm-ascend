# Source: https://github.com/vllm-project/vllm/blob/601066c91ca20f07975c344af5b4e63bf7e4b026/recipes/models/deepseek-ai/DeepSeek-V4-Pro.yaml
# Extracted with vllm-project/recipes@cb7c0e949bcb2bf580fcbd0d1d4e2e69ebf502ee.

meta:
  date_updated: "2026-11-27"
  hardware:
    # verified: the four-node DP4/TP8 pool came up completely, /health returned
    # 200, and both a single request and 8 concurrent requests returned 200.
    ascend_910b: verified
    # 910C: performance first-party verified 2026-10-28 (2-node DP2/TP16 + MTP,
    # 390 tok/s, TPOT 90.5 ms) on the v0.23.0rc1 pre-release from the same
    # v0.23.0 line the stable tag below pins; accuracy run planned for
    # December (companion Ascend recipe vllm-ascend/vllm-ascend-recipes#130).
    ascend_910c: supported

hardware_notes:
  ascend_910b:
    title: W4A8 multi-node co-located deployment on Atlas 800I A2 (910B4)
    body: |
      Four Atlas 800I A2 nodes, 8x Ascend 910B4 (64 GB) each, DP4 / TP8 / EP32.
      Each node runs one local DP rank over all eight devices.

      **Node 0 (DP master)** — serves the API:

      - `--data-parallel-size 4 --data-parallel-size-local 1`
      - No `--data-parallel-start-rank` (implicitly 0)
      - **`--api-server-count 1`** — required. Without it vLLM defaults
        `api_server_count` to `data_parallel_size` (4) and starts four API
        servers on node 0 that try to bind four DP ranks; but ranks 1-3 live on
        other hosts in headless mode, so `/health` and `/v1/models` still return
        200 while **every real completion request hangs until timeout**, after
        which the API server exits.

      **Nodes 1-3 (DP workers)** — headless:

      - `--data-parallel-start-rank <N>` with N = 1, 2, 3 respectively
      - **`--headless`** — required by vLLM; otherwise node 0 aborts with
        `RuntimeError: Remote engine N must use --headless unless in external or
        hybrid dp lb mode`

      **All nodes**

      - add `--ipc=host`
      - mount the weight directory read-only
    link:
      label: vLLM Ascend DeepSeek-V4-Pro tutorial
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Pro.html

  ascend_910c:
    title: "Verified topology is 2-node DP2×TP16"
    body: |
      First-party verified 2026-10-28 on 2x Atlas 800 A3 with the v0.23.0rc1
      pre-release image: DP2xTP16 + MTP with a FULL_DECODE_ONLY compilation
      config (390 tok/s). On ascend_910c the builder offers the W4A8-MTP
      variant through `multi_node_tp_dp` (two 16-NPU nodes, per
      `strategy_min_gpus`). The builder emits `--data-parallel-address` and
      `--data-parallel-start-rank` per node; the verified launcher
      additionally sets `--data-parallel-rpc-port` (default 12321, must be
      reachable between nodes) and appends `--headless` on the follower —
      see the companion Ascend recipe for the launcher. The pinned v0.23.0.post1 stable tag has not been re-run yet;
      single-node and multi-node TEP/DEP renderings remain builder defaults
      not run on NPU.

strategy_hardware:
  single_node_tp:
    npu: unsupported
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  single_node_dpa_tp:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_dp:
    npu: unsupported
    # 910C: the verified topology — two 16-NPU Atlas 800 A3 nodes forming
    # DP2 x TP16; strategy_min_gpus below sets the two-node floor.
    ascend_910c: supported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  pd_cluster:
    # npu: unsupported keeps the brand-level default off (the base lists
    # pd_cluster, so absence would fail open); the specific ascend_910b key
    # overrides it for the A2 preset lane.
    npu: unsupported
    # The A2 4P+4D lane is offered through the `ascend_pd_a2` preset below
    # (tutorial §5.2 "A2 series" tab); the plain pools stay selectable on
    # ascend_910b without a preset (schema caveat: the floor does not gate
    # connector choice and `unsupported` would disable the preset too), so
    # the notes direct users to the preset.
    # ascend_910c PD stays with the tutorial for now: the external-DP PCP
    # preset shape renders, but the vLLM v0.32.0 supervisor in the pinned
    # image splits devices by TP x PP only, so a multi-port PCP pool cannot
    # actually start (fixed upstream in 0.34.0) — see the PD note.
    ascend_910b: supported
  # Validated topology is a co-located multi-node pool, not prefill/decode
  # disaggregation: all four nodes form one DP group with one local DP rank
  # each, so this declares the cross-node DEP combination.
  multi_node_dep:
    npu: unsupported
    ascend_910b: supported

strategy_min_gpus:
  # On ascend_910c the verified deployment needs two 16-NPU nodes; single-node
  # strategies cannot clear this floor and drop out on that hardware. The
  # A2 PD lane (ascend_910b) needs four nodes per pool.
  ascend_910c:
    multi_node_tp_dp: 32
  ascend_910b:
    pd_cluster: 64

variants:
  # Variants inherited from the base recipe (default / fp8 / dspark) are also
  # visible on Ascend and must pin an Ascend installation explicitly on both
  # A2 (910B) and A3 (910C); leaving any Ascend hardware unpinned makes the
  # renderer fall back to model.docker_image and the generic pip default,
  # which the Ascend configuration check reports as ASC001 (NVIDIA image)
  # and ASC002 (generic pip fallback).
  default:
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  fp8:
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  dspark:
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_w4a8:
    model_id: Eco-Tech/DeepSeek-V4-Pro-0813-w4a8
    label: W4A8 (ASCEND A2)
    precision: int4
    # Measured checkpoint footprint 811.48 GiB = 871 GB; with a 1.2x headroom,
    # 871 x 1.2 ~= 1045 GB. This is a capacity hint, not a hardware gate.
    vram_minimum_gb: 1045
    description: >-
      ModelSlim INT4 W4A8 (4-bit weights, 8-bit activations) for a four-node
      Atlas 800I A2 pool, 8x Ascend 910B4 (64 GB) each, running DP4 x TP8 with
      expert parallelism (EP32). Model has 61 layers x 384 routed experts
      (23,424 experts); routed-expert weights are sharded across all 32 devices
      while attention/embed/mtp weights are replicated per DP rank and sharded
      by TP. Requires --quantization ascend.
    supported_hardware:
      - ascend_910b
      # tutorial §3.1 lists the 0813-w4a8 checkpoint for 2x A3 (128GB x 8)
      # as well.
      - ascend_910c
    # supported_features is declared without spec_decoding on purpose: the
    # base recipe gates spec_decoding.modes.mtp / dspark behind a variant
    # allowlist (mtp: fp8/nvfp4/redhat_nvfp4, dspark: default/dspark) that an
    # overlay may not modify. Declaring the list makes
    # isFeatureAllowedForVariant return false for this variant, so the feature
    # is not validated here and the flags travel in extra_args instead.
    supported_features:
      - tool_calling
      - reasoning
    # The verified lane runs the Python frontend (the preset's select pins
    # it); the rust default renders commands this checkpoint was not
    # validated with.
    supported_frontends:
      - python
    # No `tp:` here. A multi_node_dep command gets its TP from the preset args;
    # a variant-level tp map only feeds the single-node TP resolver. Keeping it
    # would document a number the renderer ignores.
    min_vllm_version: '0.32.0'
    extra_args:
      - '--quantization'
      - ascend
      # DSpark speculative decoding: the 0813 checkpoint ships its own draft
      # layer and drafts 7 tokens. Carried in extra_args rather than
      # features.spec_decoding because the base recipe's modes.mtp /
      # modes.dspark allowlists name the checkpoints they accept and an overlay
      # may not change them (OVERLAY_RULES only opens modes.*.hardware_overrides
      # and modes.*.hardware). The tested command also passes enforce_eager.
      - '--speculative-config'
      - '{"num_speculative_tokens":7,"method":"dspark","enforce_eager":true}'
      - '--trust-remote-code'
      - '--block-size'
      - '128'
      - '--max-model-len'
      - '135000'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--enable-expert-parallel'
      - '--seed'
      - '1024'
      - '--host'
      - 0.0.0.0
      - '--tokenizer-mode'
      - deepseek_v4
      - '--reasoning-parser'
      - deepseek_v4
      - '--tool-call-parser'
      - deepseek_v4
      - '--enable-auto-tool-choice'
      - '--attention_config.indexer_kv_dtype'
      - int8
      - '--model-loader-extra-config'
      - '{"enable_multithread_load": true, "num_threads": 128}'
    extra_env:
      HCCL_BUFFSIZE: '512'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_CONNECT_TIMEOUT: '7200'
      ASCEND_CONNECT_TIMEOUT: '10000'
      ASCEND_TRANSFER_TIMEOUT: '10000'
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      ACL_OP_INIT_MODE: '1'
      TASK_QUEUE_ENABLE: '1'
      # Quoted on purpose: unquoted `expandable_segments: True` parses as a
      # nested mapping, and even the space-free form relies on the parser
      # treating the colon and True as plain text. The value is a string.
      PYTORCH_NPU_ALLOC_CONF: 'expandable_segments:True'
      # Pinned in the validated commands, matching the renderer's own
      # guidance for any block-addressed cache: NONE_HASH reseeds per
      # process and stored block filenames change on every restart.
      PYTHONHASHSEED: '0'
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '10'
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_shm_size: "512g"
        docker_serve_command: "vllm serve"
        install:
          pip: false
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false

  ascend_w4a8_mtp:
    model_id: Eco-Tech/DeepSeek-V4-Pro-w4a8-mtp
    precision: int4
    label: W4A8-MTP (ASCEND)
    vram_minimum_gb: 790
    supported_hardware:
      - ascend_910c
    supported_features:
      # This variant pins the checkpoint's speculative config statically
      # (see extra_args), so the spec_decoding toggle is not offered for it —
      # enabling the toggle would duplicate --speculative-config.
      - tool_calling
      - reasoning
    tp: 16
    min_vllm_version: 0.23.0
    supported_frontends:
      - python
    extra_args:
      - '--quantization'
      - ascend
      - '--speculative-config'
      - '{"num_speculative_tokens": 1,"method": "mtp","enforce_eager": true}'
      - '--kv-cache-dtype'
      - auto
      - '--enable-expert-parallel'
      - '--max-model-len'
      - '135000'
      - '--max-num-batched-tokens'
      - '4096'
      - '--max-num-seqs'
      - '32'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--block-size'
      - '128'
      - '--tokenizer-mode'
      - deepseek_v4
      - '--tool-call-parser'
      - deepseek_v4
      - '--enable-auto-tool-choice'
      - '--reasoning-parser'
      - deepseek_v4
      - '--model-loader-extra-config'
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding": true,"enable_flashcomm1": true,"multistream_overlap_shared_expert":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_BUFFSIZE: '2048'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    install:
      pip: false
      docker:
        command: docker pull quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
    description: "ModelSlim W4A8+MTP (weights on ModelScope: Eco-Tech/DeepSeek-V4-Pro-w4a8-mtp) — 2x Atlas 800 A3 multi-node DP2xTP16 + MTP (first-party verified 2026-10-28 on the v0.23.0rc1 pre-release from this line, 390 tok/s; pinned to the v0.23.0.post1 stable tag; also fits 2x A3 128G / 4x A2 per the upstream tutorial). Node orchestration args (--data-parallel-address / --data-parallel-rpc-port / --data-parallel-start-rank) are per-node; see the companion Ascend recipe."

presets:
  ascend_a2_w4a8_multinode_dep:
    label: Ascend A2 W4A8 multi-node DP4/TP8 (4 nodes)
    hardware: ascend_910b
    strategy: multi_node_dep
    variants: [ascend_w4a8]
    # default: true — this preset IS the verified deployment on this
    # hardware; the bare multi_node_dep baseline (rust frontend, local DP 8,
    # fp8 KV cache, hybrid LB) is not the validated topology.
    default: true
    select:
      # Co-located multi-node pool, not PD disaggregation: the node count is
      # set by select.nodes, and pd_router / pd_connector are omitted because
      # they only apply to pd_cluster.
      nodes: 4
      frontend: python
      kv_offload: false
      features:
        # spec_decoding is carried by the variant's extra_args; enabling the
        # base feature as well would emit a second --speculative-config.
        spec_decoding: false
    source:
      label: vLLM Ascend DeepSeek-V4-Pro tutorial
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Pro.html
      key: dsv4pro-a2-w4a8-multinode-dep
      revision: '2026-11-19'
    runbook: |
      ## Topology

      Four Atlas 800I A2 nodes, eight Ascend 910B4 (64 GB) each, 32 devices in
      total. Global parallelism is **DP4 / TP8**, and with
      `--enable-expert-parallel` the expert-parallel size is **EP32**
      (DP4 x TP8). Every node carries exactly one local DP rank spanning all
      eight devices; node 0 is the DP master and the only API endpoint.

      Expert weights (733 GiB, 90% of the checkpoint) are sharded across all 32
      devices — about 22.9 GiB of routed-expert weights per device. Attention,
      embedding, lm_head and the DSpark/MTP draft layers are replicated once per
      DP rank and sharded by TP inside the rank. Measured per-device footprint:
      **37.72 GiB weights + 12.88 GiB KV cache**, i.e. 90% of 64 GB as set by
      `--gpu-memory-utilization 0.9`.

      ## Environment

      Set the node IP and NIC per host. All four nodes must use the **same**
      `--data-parallel-address` (node 0's service IP). The DP RPC port defaults
      to 12321 and must be reachable between nodes.

      Start node 0 first so the DP coordinator is listening, then nodes 1-3.

      ## Launch order and flags

      1. Node 0: no `--headless`, no `--data-parallel-start-rank`;
         `--api-server-count 1` travels with the preset args.
      2. Nodes 1-3: append `--headless` and set
         `--data-parallel-start-rank 1|2|3` manually — the builder emits the
         same command skeleton for every node and cannot carry these
         per-node follower flags yet.

      Omitting `--api-server-count 1` on node 0 is the most damaging mistake:
      health checks pass while inference hangs. Always verify with a real
      completion request, not just `/health`.
    # No roles: schema roles only carry prefill / decode (pd_cluster
    # semantics), while these four nodes form one group with no P/D split.
    # Per-node differences are described in hardware_notes. The args and env
    # below are the ones every node carries, matching the tested commands.
    args:
      # Topology is stated explicitly rather than left to the renderer. The
      # multi_node_dep strategy defaults local DP to the whole node (8), which
      # rendered DP32 / local8 with no TP for this recipe; the validated
      # commands run DP4 / local1 / TP8 with one DP rank per node.
      #
      # Both flags have to live here rather than in `tp:` fields: a preset-level
      # `tp` is only valid for single_node_tp (recipe-presets.js rejects any
      # other strategy), and `variants.<key>.tp` does not reach a multi_node
      # command at all. Global DP follows from node count x local DP.
      - '--data-parallel-size-local'
      - '1'
      - '--tensor-parallel-size'
      - '8'
      # --api-server-count 1 keeps a single API server on the DP master;
      # without it vLLM defaults the count to the DP size (4) and node 0
      # answers /health while every completion hangs (see the 910B hardware
      # note).
      - '--api-server-count'
      - '1'
      - '--max-num-batched-tokens'
      - '4096'
      - '--max-num-seqs'
      - '16'
      - '--no-enable-prefix-caching'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true}'
    # The base recipe's base_args carry --kv-cache-dtype fp8 and the strategy
    # adds --data-parallel-hybrid-lb; the validated W4A8 commands pass neither.
    # Boolean flags like the hybrid-lb one can only be dropped, not negated by
    # writing an opposite value.
    remove_args:
      - '--kv-cache-dtype'
      - '--data-parallel-hybrid-lb'
    env:
      HCCL_IF_IP: $NODE_IP
      VLLM_HOST_IP: $NODE_IP
      HCCL_SOCKET_IFNAME: $IFACE_NAME
      GLOO_SOCKET_IFNAME: $IFACE_NAME
      TP_SOCKET_IFNAME: $IFACE_NAME

  ascend_pd_a2:
    label: "0813-W4A8 PD (A2, 4P+4D)"
    hardware: ascend_910b
    strategy: pd_cluster
    variants: [ascend_w4a8]
    default: false
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
    remove_args:
      # Guard: drop --data-parallel-hybrid-lb; the builder emits it on
      # multi-node DEP pools and the tutorial PD commands do not carry it
      # (MooncakeHybridConnector here is the KV connector, unrelated).
      - '--data-parallel-hybrid-lb'
      # The base_args carry --kv-cache-dtype fp8; the validated W4A8 PD
      # commands pass no kv-cache-dtype flag.
      - '--kv-cache-dtype'
    workload: 'Prefill/decode separation (4P+4D), 4+4 Atlas 800I A2 (64GB x 8) nodes, Mooncake'
    source:
      label: "DeepSeek-V4-Pro tutorial, section 5.2 (A2 series tab)"
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Pro.html
      key: dsv4pro-a2-w4a8-pd-4p4d
      revision: "2026-11-26"
    image:
      vllm: quay.io/ascend/vllm-ascend:v0.32.0rc1
      model_revision: master
    runbook: |
      ## Evidence and versions

      - Source: tutorial §5.2 "A2 series" tab, transcribed value-by-value
        (4 Prefill nodes + 4 Decode nodes, each pool DP4/TP8 with one DP
        rank per node; weights DeepSeek-V4-Pro-0813-w4a8, DSpark draft
        included in the checkpoint, 7 speculative tokens)
      - Image: quay.io/ascend/vllm-ascend:v0.32.0rc1 (the 0813-w4a8 + DSpark
        lane is first-party verified on this image on Atlas 800I A2 for the
        co-located lane; the PD lane end-to-end run is pending)
      - Checkpoint: Eco-Tech/DeepSeek-V4-Pro-0813-w4a8 (ModelScope, master)
      - Validation status: not validated end-to-end; rendering verified
        against the official builder

      ## Transcription notes

      Flags and env injected by the builder's strategy/base layers (and the
      variant's own extra_env) are builder defaults, not part of the
      transcription.

      Transcribed from tutorial §5.2 (Multi-Node PD Separation Deployment,
      A2 series tab). Differences against the tutorial commands: the
      --served-model-name dsv4 rename is omitted (page curls use the
      variant model_id), matching the recipe family treatment. The tutorial
      deploys Mooncake and the PD proxy outside the engine commands. This
      lane uses MooncakeHybridConnector per the tutorial. Note that the
      tutorial §5.1 A2 tab currently shows the w4a8-mtp checkpoint for the
      co-located lane, while this PD lane (and the co-located preset above)
      documents the 0813-w4a8 checkpoint. The 950DT PD lane of §5.2 and the
      §5.3 KV-Cache-Pool variants are outside this overlay's hardware scope
      and are not preset-rendered here.

      ## Startup order

      Fill the rendered $PREFILL_NODE_n / $DECODE_NODE_n / $IFACE_NAME /
      $ROUTER_PORT addresses, start the four Prefill ranks and then the four
      Decode ranks, and finally run the Ascend Router proxy command on the
      proxy host; verify /health on every rank before sending requests.
    roles:
      prefill:
        nodes: 4
        parallelism: dep
        tp: 8
        args:
          - '--enable-expert-parallel'
          - '--max-model-len'
          - '150000'
          - '--max-num-batched-tokens'
          - '4096'
          - '--max-num-seqs'
          - '16'
          - '--gpu-memory-utilization'
          - '0.92'
          - '--block-size'
          - '32'
          - '--no-enable-prefix-caching'
          - '--no-disable-hybrid-kv-cache-manager'
          - '--tokenizer-mode'
          - deepseek_v4
          - '--tool-call-parser'
          - deepseek_v4
          - '--enable-auto-tool-choice'
          - '--reasoning-parser'
          - deepseek_v4
          - '--trust-remote-code'
          - '--seed'
          - '1024'
          - '--enforce-eager'
          - '--model-loader-extra-config'
          - '{"enable_multithread_load": true, "num_threads": 128}'
          - '--speculative-config'
          - '{"num_speculative_tokens": 7, "method":"dspark", "enforce_eager": true}'
          - '--additional-config'
          - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_fused_mc2":1}'
        env:
          VLLM_USE_V2_MODEL_RUNNER: '1'
          HCCL_OP_EXPANSION_MODE: AIV
          TASK_QUEUE_ENABLE: '1'
          VLLM_RPC_TIMEOUT: '3600000'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
          HCCL_EXEC_TIMEOUT: '3600'
          HCCL_CONNECT_TIMEOUT: '6000'
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '10'
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          HCCL_BUFFSIZE: '1024'
          HCCL_IF_IP: $PREFILL_NODE_1
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeHybridConnector
            kv_role: kv_producer
            kv_port: '30000'
            kv_connector_extra_config:
              prefill:
                dp_size: '{prefill_dp_size}'
                tp_size: 8
              decode:
                dp_size: '{decode_dp_size}'
                tp_size: 8
      decode:
        nodes: 4
        parallelism: dep
        tp: 8
        args:
          - '--enable-expert-parallel'
          - '--max-model-len'
          - '150000'
          - '--max-num-batched-tokens'
          - '256'
          - '--max-num-seqs'
          - '32'
          - '--async-scheduling'
          - '--gpu-memory-utilization'
          - '0.92'
          - '--block-size'
          - '32'
          - '--no-enable-prefix-caching'
          - '--compilation-config'
          - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
          - '--tokenizer-mode'
          - deepseek_v4
          - '--tool-call-parser'
          - deepseek_v4
          - '--enable-auto-tool-choice'
          - '--reasoning-parser'
          - deepseek_v4
          - '--trust-remote-code'
          - '--seed'
          - '1024'
          - '--model-loader-extra-config'
          - '{"enable_multithread_load": true, "num_threads": 128}'
          - '--speculative-config'
          - '{"num_speculative_tokens": 7, "method":"dspark", "enforce_eager": true}'
          - '--additional-config'
          - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false}, "enable_cpu_binding":true, "multistream_overlap_shared_expert":true, "scheduler_config":{"recompute_scheduler_enable":true}}'
        env:
          VLLM_USE_V2_MODEL_RUNNER: '1'
          HCCL_OP_EXPANSION_MODE: AIV
          TASK_QUEUE_ENABLE: '1'
          VLLM_RPC_TIMEOUT: '3600000'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
          HCCL_EXEC_TIMEOUT: '3600'
          HCCL_CONNECT_TIMEOUT: '1200'
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '10'
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          HCCL_BUFFSIZE: '1800'
          HCCL_IF_IP: $DECODE_NODE_1
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeHybridConnector
            kv_role: kv_consumer
            kv_port: '30100'
            kv_connector_extra_config:
              prefill:
                dp_size: '{prefill_dp_size}'
                tp_size: 8
              decode:
                dp_size: '{decode_dp_size}'
                tp_size: 8

notes:
  - title: "Ascend 910C: use the W4A8-MTP (ASCEND) variant"
    when: { hardware: [ascend_910c] }
    body: |
      The `default` / `fp8` / `dspark` checkpoints are NVIDIA FP8/FP4 builds
      that are not validated on Ascend 910C; the Ascend image and pip pins
      only make the commands runnable. The first-party verified deployment on
      2x Atlas 800 A3 is the **W4A8-MTP (ASCEND)** variant (DP2xTP16 + MTP).

  - title: "Atlas 800 A2 (910B): use the A2 W4A8 preset"
    when: { hardware: [ascend_910b] }
    body: |
      The **Ascend A2 W4A8 multi-node DP4/TP8 (4 nodes)** preset is the
      verified configuration on this hardware and is selected by default; it
      renders the DP4 x local1 x TP8 (EP32) pool with `--api-server-count 1`
      on the DP master. The baseline without it carries the base recipe's
      NVIDIA FP8 checkpoint with strategy defaults (local DP 8, fp8 KV cache,
      hybrid LB) that are not the validated topology — and the three follower
      nodes still need `--headless` appended by hand (see the hardware note).
  - title: "Prefill/decode separation on Ascend"
    when: { hardware: [ascend_910b, ascend_910c] }
    body: |
      On Atlas 800I A2 (`ascend_910b`), PD separation is offered as the
      opt-in **0813-W4A8 PD (A2, 4P+4D)** preset transcribed from tutorial
      §5.2 — select the preset when deploying PD, since the plain
      `pd_cluster` pool renders the base recipe's generic topology, which
      is not the validated Ascend route.

      On Atlas 800 A3 (`ascend_910c`), follow the tutorial's §5.2
      "A3 series" commands for now (2P+2D, one PP2 engine with PCP8 over
      two nodes, Mooncake). A preset for this lane was prepared and
      renders through the official builder (external-DP Prefill ranks
      with `--prefill-context-parallel-size 8`, recipes PR #1276), but it
      is **held back**: the vLLM v0.32.0 supervisor in the pinned image
      splits devices by TP x PP only and cannot start a multi-port PCP
      pool (fixed upstream in vLLM 0.34.0). The preset will be restored
      once a 0.34.0-based image is available.

      The tutorial also documents a 950DT PD lane (outside this overlay's
      hardware scope) and §5.3 KV-cache-pool variants.
