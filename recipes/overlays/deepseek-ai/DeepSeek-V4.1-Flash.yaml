presets:
  ascend_a3_w4a8:
    label: "Ascend A3 W4A8 (TP4/DP4)"
    hardware: ascend_910c
    strategy: single_node_tp
    variants: [ascend_w4a8_a3]
    default: true
    description: "Single-node colocated serving from RC tutorial section 5.1; 150K maximum total sequence length, without speculative decoding by default."
    workload: "Text and image serving on one 16-NPU Atlas 800 A3 node."
    source:
      label: "DeepSeek-V4.1-Flash RC tutorial, section 5.1 (A3)"
      href: "https://github.com/vllm-project/vllm-ascend/blob/24487f4f48ee99cf45d86d1c504e645549b8c1ef/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#51-single-node-colocated-deployment"
      key: "dsv41flash-w4a8-a3-colocated"
      revision: "24487f4f48ee99cf45d86d1c504e645549b8c1ef"
    image:
      vllm: "quay.io/ascend/vllm-ascend:v0.32.0rc1-a3@sha256:0ab8c92a89d36bbf33eb7bbf3d5bbfe661f520e8fcecaf3823e80b48d3a80afc"
      model_revision: "2701ad74996ab465759ea37e2e7df132709716e9"
    select:
      frontend: python
      features: { spec_decoding: false }
      kv_offload: off

  ascend_a2_w4a8:
    label: "Ascend A2 W4A8 (2 nodes, TP8/DP2)"
    hardware: ascend_910b
    strategy: multi_node_tp_dp
    variants: [ascend_w4a8_a2]
    default: true
    description: "Two-node colocated serving from RC tutorial section 5.5: TP8 inside each node, DP2 across nodes, EP16 and DSpark with five tokens."
    workload: "Source-documented startup, text/image smoke requests and 16K-input serving; long-context and high-concurrency performance remain unqualified."
    source:
      label: "DeepSeek-V4.1-Flash RC tutorial, section 5.5 (A2)"
      href: "https://github.com/vllm-project/vllm-ascend/blob/24487f4f48ee99cf45d86d1c504e645549b8c1ef/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#55-multi-node-colocated-deployment"
      key: "dsv41flash-w4a8-a2-tp8-dp2"
      revision: "24487f4f48ee99cf45d86d1c504e645549b8c1ef"
    image:
      vllm: "quay.io/ascend/vllm-ascend:v0.32.0rc1@sha256:ff6d1ea57df08dd9382c51d202d0dd2d9acc35d53a65bcb0dfd906886e674912"
      model_revision: "2701ad74996ab465759ea37e2e7df132709716e9"
    select:
      nodes: 2
      frontend: python
      features: { spec_decoding: true }
      kv_offload: off
    json_args:
      --speculative-config:
        enforce_eager: true

  ascend_a5_mxfp:
    label: "Ascend A5 MXFP (TP1/DP8)"
    hardware: ascend_950dt
    strategy: single_node_tp
    variants: [ascend_mxfp_a5]
    default: true
    description: "Single-node colocated serving from RC tutorial section 5.1: TP1/DP8/EP8, DSpark with five tokens and 1M maximum model length."
    workload: "Text and image serving on one eight-NPU Ascend 950DT node."
    source:
      label: "DeepSeek-V4.1-Flash RC tutorial, section 5.1 (950DT)"
      href: "https://github.com/vllm-project/vllm-ascend/blob/24487f4f48ee99cf45d86d1c504e645549b8c1ef/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#51-single-node-colocated-deployment"
      key: "dsv41flash-mxfp-a5-colocated"
      revision: "24487f4f48ee99cf45d86d1c504e645549b8c1ef"
    image:
      vllm: "quay.io/ascend/vllm-ascend:v0.32.0rc1-a5@sha256:0e088e7f39429a1852936738f65bc62be3a3104dbeac30429cbcb2b80efc8050"
      model_revision: "08c8657f02291e11b6f6b63e0e16014f8e748518"
    select:
      frontend: python
      features: { spec_decoding: true }
      kv_offload: off

  ascend_a5_pd:
    label: "Ascend A5 MXFP PD (1P1D, DP8/TP1)"
    hardware: ascend_950dt
    strategy: pd_cluster
    variants: [ascend_mxfp_a5]
    default: false
    description: "Reference 1P1D deployment from RC tutorial section 5.2. Native vLLM external-DP workers replace the tutorial's custom per-rank launcher; Ascend Router and MooncakeHybridConnector are selected explicitly."
    workload: "Two dedicated eight-NPU nodes, one Prefill and one Decode. The tutorial marks this PD design as a reference rather than a production recommendation."
    source:
      label: "DeepSeek-V4.1-Flash RC tutorial, section 5.2 (950DT)"
      href: "https://github.com/vllm-project/vllm-ascend/blob/24487f4f48ee99cf45d86d1c504e645549b8c1ef/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#52-1p1d-pd-disaggregated-deployment"
      key: "dsv41flash-mxfp-a5-1p1d-dp8"
      revision: "24487f4f48ee99cf45d86d1c504e645549b8c1ef"
    image:
      vllm: "quay.io/ascend/vllm-ascend:v0.32.0rc1-a5@sha256:0e088e7f39429a1852936738f65bc62be3a3104dbeac30429cbcb2b80efc8050"
      model_revision: "08c8657f02291e11b6f6b63e0e16014f8e748518"
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      features: { spec_decoding: true }
      kv_offload: off
    remove_args: ["--data-parallel-hybrid-lb"]
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        args:
          - "--port"
          - "7100"
          - "--data-parallel-rpc-port"
          - "12321"
          - "--max-num-batched-tokens"
          - "5120"
          - "--max-num-seqs"
          - "16"
          - "--enable-prefix-caching"
          - "--swa-bounded-replay"
          - "--enforce-eager"
          - "--additional-config"
          - '{"multistream_engram_overlap":false,"multistream_overlap_shared_expert":true}'
        env:
          VLLM_HOST_IP: "$PREFILL_NODE_1"
          HCCL_IF_IP: "$PREFILL_NODE_1"
          GLOO_SOCKET_IFNAME: "$IFACE_NAME"
          TP_SOCKET_IFNAME: "$IFACE_NAME"
          HCCL_SOCKET_IFNAME: "$IFACE_NAME"
          HCCL_BUFFSIZE: "1024"
        json_args:
          --speculative-config:
            enforce_eager: true
          --kv-transfer-config:
            MooncakeConnectorV2:
              kv_connector: MooncakeHybridConnector
              kv_port: "26010"
      decode:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        args:
          - "--port"
          - "7100"
          - "--data-parallel-rpc-port"
          - "12321"
          - "--max-num-batched-tokens"
          - "1024"
          - "--max-num-seqs"
          - "64"
          - "--gpu-memory-utilization"
          - "0.92"
          - "--enable-prefix-caching"
          - "--no-swa-bounded-replay"
          - "--additional-config"
          - '{"multistream_overlap_shared_expert":true,"combine_quant_mode":4,"scheduler_config":{"recompute_scheduler_enable":true}}'
        env:
          VLLM_HOST_IP: "$DECODE_NODE_1"
          HCCL_IF_IP: "$DECODE_NODE_1"
          GLOO_SOCKET_IFNAME: "$IFACE_NAME"
          TP_SOCKET_IFNAME: "$IFACE_NAME"
          HCCL_SOCKET_IFNAME: "$IFACE_NAME"
          HCCL_BUFFSIZE: "1600"
        json_args:
          --kv-transfer-config:
            MooncakeConnectorV2:
              kv_connector: MooncakeHybridConnector
              kv_port: "27010"
    runbook: |
      ## Evidence and runtime

      - Tutorial revision: `24487f4f48ee99cf45d86d1c504e645549b8c1ef`, section 5.2 (950DT DP8 Prefill and DP8 Decode).
      - Checkpoint: `deepseek-ai/DeepSeek-V4.1-Flash-1017@08c8657f02291e11b6f6b63e0e16014f8e748518`.
      - Image: `quay.io/ascend/vllm-ascend:v0.32.0rc1-a5@sha256:0e088e7f39429a1852936738f65bc62be3a3104dbeac30429cbcb2b80efc8050`.
      - Physical topology: one dedicated Prefill node and one dedicated Decode node, eight 950DT NPUs per node; each role is global DP8, local DP8, TP1, PP1 and EP8.
      - Migration validation is static only. No new NPU inference, KV-transfer, accuracy or performance run is claimed by this overlay.

      ## Deployment contract

      Native vLLM launches and supervises external-DP workers, replacing the tutorial's custom `launch_online_dp.py`. Ascend Router is the HTTP proxy and endpoint router, not the worker launcher. Set all node address variables, `IFACE_NAME`, `ROUTER_HOST` and `ROUTER_PORT` before launch. Worker HTTP ports are 7100–7107 on each role; Prefill KV ports start at 26010 and Decode KV ports at 27010. Keep DP RPC port 12321, KV ports and the supervisor health port (9256 by default) reachable and non-conflicting.

      Check every worker/rank `/health`, then the Router `/v1/models` and a generation through the Router. Confirm Mooncake KV transfer in the logs. Do not mark this preset verified without those runtime checks and the exact image/checkpoint fingerprints above.

      ## Limits

      The source tutorial labels this PD deployment a reference design, not its production recommendation. Each role has one pool; independent replica groups, A2/A3 PCP layouts, Memcache pooling and wide-EP Decode extensions are not represented. Baseline and other Router/Connector choices are outside this preset's validation scope.
notes:
  - title: "Use the qualified Ascend PD preset"
    when:
      hardware: [ascend_950dt]
      strategies: [pd_cluster]
      variants: [ascend_mxfp_a5]
    body: |
      Only the `ascend_a5_pd` preset describes the source-documented Ascend path. It selects Ascend Router and Mooncake (Ascend), then changes the implementation to MooncakeHybridConnector. Baseline and other Router/Connector combinations are not covered by this overlay. The tutorial presents PD as a reference design, not a production recommendation.

hardware_notes:
  ascend_910b:
    title: "Two A2 nodes required"
    body: "Use the ascend_w4a8_a2 variant and two Atlas 800I A2 nodes. The generated multi_node_tp_dp command preserves TP8/DP2/EP16 and per-node DP ranks. Set LOCAL_IP and IFACE_NAME on each node. The source validates startup, text/image smoke requests and 16K-input serving only. Follower API exposure differs from the tutorial: this strategy does not emit --headless for TP+DP followers."
    link:
      href: "https://docs.vllm.ai/projects/ascend/en/v0.32.0rc/tutorials/models/DeepSeek-V4.1-Flash.html"
      label: "DeepSeek-V4.1-Flash RC tutorial"
  ascend_910c:
    title: "A3 W4A8 single-node layout"
    body: "Use ascend_w4a8_a3 for the documented TP4/DP4 layout on all 16 logical devices. The command keeps Engram tables in shared host memory and requires an IPC/shared-memory configuration that lets four local DP ranks share them. W8A8, PCP-based PD and external KV pools are not emitted by this overlay."
    link:
      href: "https://docs.vllm.ai/projects/ascend/en/v0.32.0rc/tutorials/models/DeepSeek-V4.1-Flash.html"
      label: "DeepSeek-V4.1-Flash RC tutorial"
  ascend_950dt:
    title: "950DT MXFP single-node and reference PD"
    body: "Use ascend_mxfp_a5 with the official 1017 checkpoint and the A5 image. The single-node preset runs TP1/DP8/EP8. The opt-in PD preset runs one DP8/TP1 role per node through native external-DP and Ascend Router; it remains a source-documented reference design until NPU and KV-transfer checks are attached."
    link:
      href: "https://docs.vllm.ai/projects/ascend/en/v0.32.0rc/tutorials/models/DeepSeek-V4.1-Flash.html"
      label: "DeepSeek-V4.1-Flash RC tutorial"

guide_sections:
  ascend: |
    ## Ascend overview

    This overlay contributes four source-documented configurations from the
    [DeepSeek-V4.1-Flash v0.32.0rc tutorial](https://docs.vllm.ai/projects/ascend/en/v0.32.0rc/tutorials/models/DeepSeek-V4.1-Flash.html).
    Hardware status is **supported**, not a new migration-time verification claim.
    Pick an `ascend_*` variant explicitly: inherited `default` and `fp8` variants
    remain reachable but are not Ascend validation claims.

    | Hardware | Variant and preset | Generated scope |
    | --- | --- | --- |
    | Atlas 800 A3, 16× 910C | [ascend_w4a8_a3](https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash?hardware=ascend_910c&variant=ascend_w4a8_a3&strategy=single_node_tp&preset=ascend_a3_w4a8) | One node, TP4/DP4 + EP, 150K maximum total sequence length |
    | Atlas 800I A2, 2× 8× 910B | [ascend_w4a8_a2](https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash?hardware=ascend_910b&variant=ascend_w4a8_a2&strategy=multi_node_tp_dp&nodes=2&preset=ascend_a2_w4a8) | Two nodes, node-local TP8, global DP2 + EP16, DSpark |
    | Ascend 950DT, 8 NPUs | [ascend_mxfp_a5](https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash?hardware=ascend_950dt&variant=ascend_mxfp_a5&strategy=single_node_tp&preset=ascend_a5_mxfp) | One node, TP1/DP8 + EP8, DSpark, 1M maximum model length |
    | Ascend 950DT, 2× 8 NPUs | [ascend_a5_pd](https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4.1-Flash?hardware=ascend_950dt&variant=ascend_mxfp_a5&strategy=pd_cluster&preset=ascend_a5_pd) | Reference 1P1D, DP8/TP1 per role, Ascend Router + MooncakeHybridConnector |

    ## Ascend prerequisites

    - Runtime: vLLM `0.32.0` and vLLM Ascend `0.32.0rc1`; source builds use the
      `releases/v0.32.0rc` branch and its recorded vLLM release tag.
    - Published images: `quay.io/ascend/vllm-ascend:v0.32.0rc1` (A2),
      `v0.32.0rc1-a3` (A3), and `v0.32.0rc1-a5` (950DT). Structured variants pin
      their registry-observed digests.
    - Release software stack documented by the RC: Python 3.12, CANN 9.2.1,
      HDK 26.1.1, PyTorch 2.10.0, torch-npu 2.10.0.post7 and
      triton-ascend 3.6.0.post2. Use the matching host driver/firmware.
    - W4A8 checkpoint: `Eco-Tech/DeepSeek-V4.1-Flash-1017-w4a8` at ModelScope
      revision `2701ad74996ab465759ea37e2e7df132709716e9`.
    - Official MXFP checkpoint: `deepseek-ai/DeepSeek-V4.1-Flash-1017` at
      revision `08c8657f02291e11b6f6b63e0e16014f8e748518` on Hugging Face or
      ModelScope.
    - Keep the same absolute checkpoint path on every node. Reserve host DRAM
      and shared memory for Engram offload and local-DP sharing. Multi-node and
      PD deployments additionally need reachable HCCL, DP RPC, HTTP and KV ports.

    ## Client usage

    No variant sets `--served-model-name`; set `SERVED_MODEL_ID` to the selected
    checkpoint id returned by `/v1/models`.

    ```python
    import os
    from openai import OpenAI

    client = OpenAI(
        base_url=os.environ.get("SERVICE_URL", "http://127.0.0.1:8000/v1"),
        api_key="EMPTY",
    )
    response = client.chat.completions.create(
        model=os.environ["SERVED_MODEL_ID"],
        messages=[{"role": "user", "content": "Hello"}],
    )
    print(response.choices[0].message.content)
    ```

    ## Scope limits and follow-up

    - W8A8 is listed by the tutorial, but this minimal migration does not add a
      W8A8 variant without a dedicated rendered-command and runtime evidence set.
    - A2/A3 PD uses TP1+PCP4 Prefill layouts. Current PD DEP topology derives
      local DP only from `devices_per_node / tp`, so these layouts are linked to
      the tutorial rather than emitted incorrectly. Memcache and Mooncake KV
      Cache Pool deployments also remain tutorial-only.
    - The 950DT PD preset replaces the custom per-rank launcher with native
      external-DP supervision. It is an opt-in reference design; production
      deployment should follow the tutorial's MindIE Motor recommendation.
    - The RC tutorial publishes GPQA scores 89.9 (A3 W4A8) and 90.4 (950DT MXFP),
      but explicitly publishes no production throughput/TTFT/TPOT baseline.
      This overlay adds no performance claim or synthetic concurrency points.

