# Source: https://github.com/vllm-project/vllm/blob/2b635e9014c3914b3e881e02ee88b4ddc4d6989d/recipes/models/deepseek-ai/DeepSeek-V4.1-Flash.yaml
# Extracted with vllm-project/recipes@afa74b7acb2a1ce7372115807e9fe45f2b168171.
meta:
  hardware:
    ascend_910b: verified
    ascend_950dt: supported
    ascend_910c: verified
hardware_notes:
  ascend_910b:
    title: W4A8 prefill/decode disaggregation on Atlas 800I A2 (910B4)
    body: |
      Apply the edits below to the rendered commands before launch.

      **Prefill node**
      - replace `--tensor-parallel-size 4` with `--tensor-parallel-size 1 --prefill-context-parallel-size 4`

      **Both nodes**
      - add `--ipc=host`
    link:
      label: vLLM Ascend DeepSeek-V4.1-Flash tutorial
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4.1-Flash.html
  ascend_950dt:
    title: Docker setup for Ascend 950DT
    body: |-
      Use the vLLM Ascend `v0.32.0rc1-a5` image shown in the Docker tab. The Install header displays the model's general minimum vLLM version.
      Before running the Prefill and Decode commands, add the UMMU and UBURMA devices, the urma_admin bind mount, and the model directory mount as shown in the tutorial. Use the same mounted checkpoint path in both serving commands.
    link:
      label: vLLM Ascend v0.32 RC tutorial for 950DT Docker setup
      href: https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#L183-L222
  ascend_910c:
    title: W8A8 prefill/decode disaggregation on Ascend 910C
    body: |-
      Pin quay.io/ascend/vllm-ascend:v0.30.0-a3 - the NVIDIA pip wheel cannot run on Ascend NPU.
      Validated on 1 nodes x 32 NPU (32x Ascend 910C, 32 GB HBM each).
      PD roles = prefill + decode; TP/DP per role: prefill dp=4/tp=4, decode dp=8/tp=2; total NPUs = 32.
      In the case of prefill pool at DP4 x TP4, data-parallel-size 4, tensor-parallel-size 4 of P Node are required.
      If `--data-parallel-multi-port-external-lb` is present, delete it.
      Before declaring PD ready: every backend process healthy, requests via the router/proxy succeed, KV transfer completes.
      stop/cleanup: stop prefill/decode processes and the proxy on every node before restart.
      Weights come from ModelScope (set VLLM_USE_MODELSCOPE=true, or pre-download the checkpoint and serve a local path).
      Set HCCL_BUFFSIZE=1024 before launch.
