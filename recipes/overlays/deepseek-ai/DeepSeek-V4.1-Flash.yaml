presets:
  ascend_a2_w4a8_pd:
    label: Ascend A2 W4A8 PD (1P + 1D)
    hardware: ascend_910b
    strategy: pd_cluster
    variants:
    - ascend_w4a8
    default: false
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      kv_offload: false
      features:
        spec_decoding: true
        encoder_parallel: false
    source:
      label: vLLM Ascend DeepSeek-V4.1-Flash tutorial
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4.1-Flash.html
      key: dsv41-a2-w4a8-pd
      revision: '2026-11-13'
    runbook: |
      ## Topology

      One prefill node and one decode node, eight Ascend 910B4 (64 GB) each,
      fronted by the Ascend proxy. Validated lane: prefill DP2 x TP1 x PCP4,
      decode DP8 x TP1, KV transfer over MooncakeHybridConnector, DSpark
      drafts five tokens. The hardware note lists the manual edits each node
      needs before launch.

      ## Environment

      Set the node IP and NIC per host, and give each DP rank its own device
      slice.
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        data_parallel_lb: internal
        tp: 4
        pp: 1
        args:
        - --max-num-batched-tokens
        - '4096'
        - --max-num-seqs
        - '16'
        - --enforce-eager
        - --swa-bounded-replay
        - --enable-prefix-caching
        - --additional-config
        - '{"enable_cpu_binding":true,"enable_fused_mc2":2,"enable_flashcomm1":false,"enable_shared_expert_dp":true}'
        env:
          HCCL_BUFFSIZE: '1024'
          HCCL_IF_IP: $PREFILL_NODE_1
          VLLM_HOST_IP: $PREFILL_NODE_1
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeHybridConnector
            kv_role: kv_producer
            kv_port: '30000'
            kv_connector_extra_config:
              connectors: null
              prefill:
                dp_size: 2
                tp_size: 1
                pcp_size: 4
              decode:
                dp_size: 8
                tp_size: 1
      decode:
        nodes: 1
        parallelism: dep
        data_parallel_lb: internal
        tp: 1
        pp: 1
        args:
        - --prefill-context-parallel-size
        - '1'
        - --max-num-batched-tokens
        - '512'
        - --max-num-seqs
        - '72'
        - --async-scheduling
        - --no-enable-prefix-caching
        - --no-swa-bounded-replay
        - --kv-cache-memory-bytes
        - '4600000000'
        - --additional-config
        - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_flashcomm1":false,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"recompute_scheduler_enable":true}'
        env:
          HCCL_BUFFSIZE: '1800'
          HCCL_IF_IP: $DECODE_NODE_1
          VLLM_HOST_IP: $DECODE_NODE_1
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --speculative-config:
            enforce_eager: false
          --compilation-config:
            cudagraph_mode: FULL_DECODE_ONLY
          --kv-transfer-config:
            kv_connector: MooncakeHybridConnector
            kv_role: kv_consumer
            kv_port: '30100'
            kv_connector_extra_config:
              prefill:
                dp_size: 2
                tp_size: 1
                pcp_size: 4
              decode:
                dp_size: 8
                tp_size: 1
  ascend_a5_pd:
    label: 950DT MXFP 1P1D (DP8/TP1 per role)
    hardware: ascend_950dt
    strategy: pd_cluster
    variants:
    - default
    default: true
    description: Direct KV transfer between two eight-NPU nodes, with eager Prefill and graph-mode Decode.
    image:
      model_revision: 08c8657f02291e11b6f6b63e0e16014f8e748518
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      features:
        spec_decoding: true
        encoder_parallel: false
      kv_offload: 'off'
    args:
    - --port
    - '7100'
    - --data-parallel-rpc-port
    - '12321'
    - --enable-prefix-caching
    env:
      GLOO_SOCKET_IFNAME: $IFACE_NAME
      TP_SOCKET_IFNAME: $IFACE_NAME
      HCCL_SOCKET_IFNAME: $IFACE_NAME
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        data_parallel_lb: external
        tp: 1
        pp: 1
        args:
        - --host
        - $PREFILL_NODE_1
        - --max-num-batched-tokens
        - '5120'
        - --max-num-seqs
        - '16'
        - --swa-bounded-replay
        - --enforce-eager
        env:
          VLLM_HOST_IP: $PREFILL_NODE_1
          HCCL_IF_IP: $PREFILL_NODE_1
          HCCL_BUFFSIZE: '1024'
        json_args:
          --speculative-config:
            enforce_eager: true
          --additional-config:
            multistream_engram_overlap: false
            multistream_overlap_shared_expert: true
          --kv-transfer-config:
            MooncakeConnectorV2:
              kv_connector: MooncakeHybridConnector
              kv_port: 26010
      decode:
        nodes: 1
        parallelism: dep
        data_parallel_lb: external
        tp: 1
        pp: 1
        args:
        - --host
        - $DECODE_NODE_1
        - --max-num-batched-tokens
        - '1024'
        - --max-num-seqs
        - '64'
        - --gpu-memory-utilization
        - '0.92'
        - --no-swa-bounded-replay
        env:
          VLLM_HOST_IP: $DECODE_NODE_1
          HCCL_IF_IP: $DECODE_NODE_1
        json_args:
          --compilation-config:
            cudagraph_mode: FULL_DECODE_ONLY
          --additional-config:
            multistream_overlap_shared_expert: true
            combine_quant_mode: 4
            scheduler_config:
              recompute_scheduler_enable: true
          --kv-transfer-config:
            MooncakeConnectorV2:
              kv_connector: MooncakeHybridConnector
              kv_port: 27010
    source:
      label: v0.32.0rc 950DT PD tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#950dt-dp8-prefill-and-dp8-decode
      revision: 49007fd8cbcf597d9a1a4e2ebc968c69257045ed
    runbook: Set PREFILL_NODE_1, DECODE_NODE_1 and IFACE_NAME for your hosts. The native vLLM supervisor starts eight HTTP endpoints per role on ports 7100–7107. The separate DP groups each use RPC port 12321. Prefill and Decode start KV transfer at ports 26010 and 27010, respectively. Check every worker's /health endpoint before starting the Ascend proxy with ROUTER_PORT=30000. Verify /v1/models and send a request for dsv41 through the proxy, then confirm KV transfer in the worker logs.
  pd_measured:
    label: PD 分离(实测配置)
    hardware: ascend_910c
    strategy: pd_cluster
    default: true
    select:
      pd_connector: mooncake_ascend
      pd_router: ascend
    points:
      measured:
        label: 实测拓扑(PD 分离,角色 TP 各 4)
        default: true
        roles:
          prefill:
            tp: 4
            nodes: 1
          decode:
            tp: 4
            nodes: 1
guide_sections:
  ascend: |
    ## Ascend 950DT PD deployment

    Use the [official MXFP checkpoint](https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017)
    on two dedicated eight-NPU nodes for 1P1D. Before serving, follow the
    [release tutorial's 950DT container setup](https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#41-docker-image-installation)
    for the host driver, URMA devices and mount, and local checkpoint storage.
    Keep 512 GiB of container shared memory for Engram. Replace the model ID
    in the serving command with the absolute path of the mounted checkpoint
    on your data volume. Use the same path on both nodes.

    The 1P1D preset uses MooncakeHybridConnector for direct KV transfer and
    launches both DP groups with `--data-parallel-multi-port-external-lb`.
    This native launcher has been checked by rendering the commands.
strategy_min_gpus:
  ascend_910c:
    pd_cluster: 32
strategy_overrides:
  pd_cluster:
    prefill:
      tp:
        ascend_910c: 4
    decode:
      tp:
        ascend_910c: 2
hardware_opt_in_features:
  ascend_910c:
  - reasoning
  - tool_calling
