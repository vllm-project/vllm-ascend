# Source: https://github.com/vllm-project/vllm-ascend/blob/eb22e2cdcc1fecb7fc67ebfc94f3db8e03f26299/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#52-1p1d-pd-disaggregated-deployment
# Migrated from vllm-project/vllm#62794 with vllm-project/recipes@63a12c0cf8e9e94af9e14fb8dcc4f4c516bd5ea6.
variants:
  ascend_w4a8:
    model_id: Eco-Tech/DeepSeek-V4.1-Flash-1017-w4a8
    label: W4A8 (Ascend A3)
    precision: int4
    # Capacity estimate (552B x 0.5 x 1.2), not a measured HBM requirement.
    vram_minimum_gb: 332
    description: 'W4A8 with Engram host offload on two Atlas 800 A3 servers: P DP4/PCP4/TP1 and D DP16/TP1.'
    supported_hardware:
      - ascend_910c
    min_vllm_version: 0.32.0rc
    tp:
      ascend_910c: 1
    extra_args:
      - '--host'
      - 0.0.0.0
      - '--enable-expert-parallel'
      - '--seed'
      - '1024'
      - '--served-model-name'
      - dsv41
      - '--max-model-len'
      - '1048576'
      - '--speculative-config'
      - '{"num_speculative_tokens":5,"method":"dspark"}'
      - '--trust-remote-code'
      - '--block-size'
      - '128'
      - '--tokenizer-mode'
      - deepseek_v41
      - '--reasoning-parser'
      - deepseek_v41
      - '--tool-call-parser'
      - deepseek_v41
      - '--enable-auto-tool-choice'
      - '--safetensors-load-strategy'
      - lazy
      - '--quantization'
      - ascend
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_ENGINE_READY_TIMEOUT_S: '36000'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc-a3
        docker_serve_command: vllm serve
        install:
          pip: false
  ascend_mxfp_a5:
    model_id: deepseek-ai/DeepSeek-V4.1-Flash-1017
    label: MXFP (Ascend 950DT)
    precision: fp8
    # Capacity estimate inherited from the upstream 1017 checkpoint recipe.
    vram_minimum_gb: 614
    description: Mixed MXFP4/MXFP8 checkpoint with Engram host offload for eight-NPU Ascend 950DT nodes.
    supported_hardware: [ascend_950dt]
    supported_features: [tool_calling, reasoning, spec_decoding]
    supported_frontends: [python]
    min_vllm_version: '0.32.0'
    tp: 1
    extra_args:
      - '--served-model-name'
      - dsv41
      - '--max-model-len'
      - '1048576'
      - '--max-num-seqs'
      - '64'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--block-size'
      - '128'
      - '--quantization'
      - deepseek_v4_fp8
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":true}'
      - '--trust-remote-code'
    extra_env:
      VLLM_USE_V2_MODEL_RUNNER: '1'
      HCCL_OP_EXPANSION_MODE: CCU_SCHED
      HCCL_BUFFSIZE: '1600'
      HCCL_CONNECT_TIMEOUT: '1200'
      HCCL_EXEC_TIMEOUT: '2040'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '10'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5@sha256:0e088e7f39429a1852936738f65bc62be3a3104dbeac30429cbcb2b80efc8050
        docker_shm_size: 512g
        docker_serve_command: vllm serve
        install:
          pip: false
meta:
  hardware:
    ascend_910c: supported
    ascend_950dt: supported
strategy_hardware:
  single_node_tp:
    npu: unsupported
    ascend_950dt: supported
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    ascend_910c: supported
    ascend_950dt: supported
strategy_overrides:
  single_node_tp:
    hardware_overrides:
      ascend_950dt:
        extra_args:
          - '--host'
          - 0.0.0.0
          - '--port'
          - '8000'
          - '--data-parallel-size'
          - '8'
          - '--enable-expert-parallel'
          - '--max-num-batched-tokens'
          - '4096'
          - '--no-swa-bounded-replay'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"multistream_overlap_shared_expert":true,"combine_quant_mode":4}'
presets:
  ascend_pd:
    label: A3 W4A8 PD (v0.32.0rc)
    hardware: ascend_910c
    strategy: pd_cluster
    variants:
      - ascend_w4a8
    image: quay.io/ascend/vllm-ascend:v0.32.0rc-a3
    description: 'Non-pooling PD: P DP4/PCP4/TP1 with MegaMoE and SWA bounded replay; D DP16/TP1 with DSpark graph execution.'
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      features:
        spec_decoding: true
    env:
      GLOO_SOCKET_IFNAME: $IFACE_NAME
      TP_SOCKET_IFNAME: $IFACE_NAME
      HCCL_SOCKET_IFNAME: $IFACE_NAME
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:/usr/local/lib/
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        # Requires PCP-aware role sizing in the recipes renderer.
        pcp: 4
        args:
          - '--max-num-batched-tokens'
          - '8192'
          - '--max-num-seqs'
          - '16'
          - '--gpu-memory-utilization'
          - '0.9'
          - '--enforce-eager'
          - '--swa-bounded-replay'
          - '--enable-prefix-caching'
        env:
          HCCL_IF_IP: $PREFILL_NODE_1
          HCCL_BUFFSIZE: '1024'
          HCCL_OP_EXPANSION_MODE: AIV
          VLLM_SERVER_DEV_MODE: '1'
        json_args:
          '--additional-config':
            enable_cpu_binding: true
            enable_fused_mc2: 2
            enable_flashcomm1: false
            multistream_overlap_shared_expert: false
          '--kv-transfer-config':
            kv_connector: MooncakeHybridConnector
            kv_role: kv_producer
            kv_port: '30000'
      decode:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        args:
          - '--max-num-batched-tokens'
          - '512'
          - '--max-num-seqs'
          - '72'
          - '--gpu-memory-utilization'
          - '0.95'
          - '--async-scheduling'
          - '--no-enable-prefix-caching'
          - '--no-swa-bounded-replay'
        env:
          HCCL_IF_IP: $DECODE_NODE_1
          HCCL_BUFFSIZE: '4096'
        json_args:
          '--compilation-config':
            cudagraph_mode: FULL_DECODE_ONLY
          '--additional-config':
            ascend_compilation_config:
              enable_npugraph_ex: true
              enable_static_kernel: false
            enable_cpu_binding: true
            multistream_overlap_shared_expert: true
            recompute_scheduler_enable: true
          '--kv-transfer-config':
            kv_connector: MooncakeHybridConnector
            kv_role: kv_consumer
            kv_port: '30100'
    source:
      label: v0.32.0rc A3 PD tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/eb22e2cdcc1fecb7fc67ebfc94f3db8e03f26299/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#52-1p1d-pd-disaggregated-deployment
      revision: eb22e2cdcc1fecb7fc67ebfc94f3db8e03f26299
    runbook: >-
      This preset requires PCP-aware DEP sizing in the recipes renderer and
      PCP-aware device assignment in the vLLM multi-port DP supervisor.
      P uses four local DP ranks with four devices per rank; D uses sixteen
      local DP ranks with one device per rank. Start P and D on their dedicated
      nodes in parallel, then start the proxy after all engines are ready.
  ascend_a5_mxfp:
    label: 950DT MXFP colocated (DP8/TP1)
    hardware: ascend_950dt
    strategy: single_node_tp
    variants: [ascend_mxfp_a5]
    default: true
    image:
      model_revision: 08c8657f02291e11b6f6b63e0e16014f8e748518
    select:
      frontend: python
      features: { spec_decoding: true }
      kv_offload: 'off'
    source:
      label: v0.32.0rc 950DT colocated tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#51-single-node-colocated-deployment
      revision: 49007fd8cbcf597d9a1a4e2ebc968c69257045ed
  ascend_a5_pd:
    label: 950DT MXFP 1P1D (DP8/TP1 per role)
    hardware: ascend_950dt
    strategy: pd_cluster
    variants: [ascend_mxfp_a5]
    default: true
    description: Direct KV transfer between two eight-NPU nodes, with eager Prefill and graph-mode Decode.
    image:
      model_revision: 08c8657f02291e11b6f6b63e0e16014f8e748518
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      features: { spec_decoding: true }
      kv_offload: 'off'
    args:
      - '--port'
      - '7100'
      - '--data-parallel-rpc-port'
      - '12321'
      - '--enable-prefix-caching'
    env:
      GLOO_SOCKET_IFNAME: $IFACE_NAME
      TP_SOCKET_IFNAME: $IFACE_NAME
      HCCL_SOCKET_IFNAME: $IFACE_NAME
      ASCEND_LOCAL_COMM_RES: $ASCEND_LOCAL_COMM_RES
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        data_parallel_lb: external
        tp: 1
        pp: 1
        args:
          - '--host'
          - $PREFILL_NODE_1
          - '--max-num-batched-tokens'
          - '5120'
          - '--max-num-seqs'
          - '16'
          - '--swa-bounded-replay'
          - '--enforce-eager'
        env:
          VLLM_HOST_IP: $PREFILL_NODE_1
          HCCL_IF_IP: $PREFILL_NODE_1
          HCCL_BUFFSIZE: '1024'
        json_args:
          '--speculative-config':
            enforce_eager: true
          '--additional-config':
            multistream_engram_overlap: false
            multistream_overlap_shared_expert: true
          '--kv-transfer-config':
            MooncakeConnectorV2:
              kv_connector: MooncakeHybridConnector
              kv_port: 26010
      decode:
        nodes: 1
        parallelism: dep
        data_parallel_lb: external
        tp: 1
        pp: 1
        args:
          - '--host'
          - $DECODE_NODE_1
          - '--max-num-batched-tokens'
          - '1024'
          - '--max-num-seqs'
          - '64'
          - '--gpu-memory-utilization'
          - '0.92'
          - '--no-swa-bounded-replay'
        env:
          VLLM_HOST_IP: $DECODE_NODE_1
          HCCL_IF_IP: $DECODE_NODE_1
        json_args:
          '--compilation-config':
            cudagraph_mode: FULL_DECODE_ONLY
          '--additional-config':
            multistream_overlap_shared_expert: true
            combine_quant_mode: 4
            scheduler_config:
              recompute_scheduler_enable: true
          '--kv-transfer-config':
            MooncakeConnectorV2:
              kv_connector: MooncakeHybridConnector
              kv_port: 27010
    source:
      label: v0.32.0rc 950DT PD tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#950dt-dp8-prefill-and-dp8-decode
      revision: 49007fd8cbcf597d9a1a4e2ebc968c69257045ed
    runbook: >-
      Set PREFILL_NODE_1, DECODE_NODE_1 and IFACE_NAME for your hosts. Before
      launching either worker, run `export ASCEND_LOCAL_COMM_RES='{"version":"1.3"}'`
      so the Docker shell command passes the JSON value intact.
      The native vLLM supervisor starts eight HTTP endpoints per role on
      ports 7100–7107. The separate DP groups each use RPC port 12321.
      Prefill and Decode start KV transfer at ports 26010 and 27010,
      respectively. Check every worker's /health endpoint before starting the
      Ascend proxy with ROUTER_PORT=1999. Verify /v1/models and send a request
      for dsv41 through the proxy, then confirm KV transfer in the worker logs.
features:
  spec_decoding:
    hardware_overrides:
      npu:
        args:
          - '--speculative-config'
          - '{"num_speculative_tokens":5,"method":"dspark"}'
guide_sections:
  ascend: |
    ## Ascend A3 PD deployment

    Select **A3 W4A8 PD (v0.32.0rc)** with two dedicated Atlas 800 A3 servers
    (16 logical devices per node) and the
    [W4A8 checkpoint](https://www.modelscope.cn/models/Eco-Tech/DeepSeek-V4.1-Flash-1017-w4a8).
    Keep `--net=host` and `--ipc=host` for communication and Engram host offload.
    Provide sufficient host RAM and use the Engram shared-memory/huge-page setup
    described in the [release tutorial](https://github.com/vllm-project/vllm-ascend/blob/eb22e2cdcc1fecb7fc67ebfc94f3db8e03f26299/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md).

    This preset uses native multi-port external DP load balancing instead of
    `launch_online_dp.py`. PCP-aware renderer sizing and vLLM supervisor device
    assignment are prerequisites; the migrated launcher has not been NPU-validated.
    The preset covers direct PD transfer without KV pooling.

    ## Ascend 950DT deployment

    Use the [official MXFP checkpoint](https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017)
    on one eight-NPU node for colocated serving or on two dedicated eight-NPU
    nodes for 1P1D. Before serving, follow the
    [release tutorial's 950DT container setup](https://github.com/vllm-project/vllm-ascend/blob/49007fd8cbcf597d9a1a4e2ebc968c69257045ed/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#41-docker-image-installation)
    for the host driver, URMA devices and mount, and local checkpoint storage.
    Keep 512 GiB of container shared memory for Engram. Replace the model ID
    in the serving command with the absolute path of the mounted checkpoint
    on your data volume. Use the same path on both nodes.

    The 1P1D preset uses MooncakeHybridConnector for direct KV transfer and
    launches both DP groups with `--data-parallel-multi-port-external-lb`.
    This native launcher has been checked by rendering the commands.
