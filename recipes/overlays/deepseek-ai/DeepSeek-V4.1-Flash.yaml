      TP_SOCKET_IFNAME: $IFACE_NAME
      HCCL_SOCKET_IFNAME: $IFACE_NAME
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:/usr/local/lib/
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        pcp: 4
        args:
          - '--max-num-batched-tokens'
          - '8192'
          - '--max-num-seqs'
          - '16'
          - '--gpu-memory-utilization'
          - '0.9'
          - '--enforce-eager'
          - '--swa-bounded-replay'
          - '--enable-prefix-caching'
        env:
          HCCL_IF_IP: $PREFILL_NODE_1
          HCCL_BUFFSIZE: '1024'
          HCCL_OP_EXPANSION_MODE: AIV
          VLLM_SERVER_DEV_MODE: '1'
        json_args:
          '--additional-config':
            enable_cpu_binding: true
            enable_fused_mc2: 2
            enable_flashcomm1: false
            multistream_overlap_shared_expert: false
          '--kv-transfer-config':
            kv_connector: MooncakeHybridConnector
            kv_role: kv_producer
            kv_port: '30000'
      decode:
        nodes: 1
        parallelism: dep
        tp: 1
        pp: 1
        args:
          - '--max-num-batched-tokens'
          - '512'
          - '--max-num-seqs'
          - '72'
          - '--gpu-memory-utilization'
          - '0.95'
          - '--async-scheduling'
          - '--no-enable-prefix-caching'
          - '--no-swa-bounded-replay'
        env:
          HCCL_IF_IP: $DECODE_NODE_1
          HCCL_BUFFSIZE: '4096'
        json_args:
          '--compilation-config':
            cudagraph_mode: FULL_DECODE_ONLY
          '--additional-config':
            ascend_compilation_config:
              enable_npugraph_ex: true
              enable_static_kernel: false
            enable_cpu_binding: true
            multistream_overlap_shared_expert: true
            recompute_scheduler_enable: true
          '--kv-transfer-config':
            kv_connector: MooncakeHybridConnector
            kv_role: kv_consumer
            kv_port: '30100'
    source:
      label: v0.32.0rc A3 PD tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/eb22e2cdcc1fecb7fc67ebfc94f3db8e03f26299/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md#52-1p1d-pd-disaggregated-deployment
      revision: eb22e2cdcc1fecb7fc67ebfc94f3db8e03f26299
    runbook: >-
      With PCP support in the recipes renderer, Prefill starts one process per
      DP rank; Decode uses native multi-port external DP load balancing.
      P uses four local DP ranks with four devices per rank; D uses sixteen
      local DP ranks with one device per rank. Start P and D on their dedicated
      nodes in parallel, then start the proxy after all engines are ready.
  ascend_a5_pd:
    label: 950DT MXFP 1P1D (DP8/TP1 per role)
    hardware: ascend_950dt
    strategy: pd_cluster
    variants: [ascend_mxfp_a5]
    default: true
    description: Direct KV transfer between two eight-NPU nodes, with eager Prefill and graph-mode Decode.
    image:
