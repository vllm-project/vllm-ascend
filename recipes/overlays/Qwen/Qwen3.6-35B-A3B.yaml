# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/Qwen/Qwen3.6-35B-A3B.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
meta:
  date_updated: 2026-11-28
  hardware:
    ascend_910b: verified
    ascend_910c: verified
    ascend_950dt: supported
# single_node_tp + variant.tp: 2 (single_node_tep forces TP = GPU count).
strategy_hardware:
  single_node_tp:
    ascend_910b: supported
  single_node_tep:
    ascend_910b: unsupported
  single_node_dep:
    ascend_910b: unsupported
  multi_node_tp:
    ascend_910b: unsupported
  multi_node_tp_pp:
    ascend_910b: unsupported
  multi_node_dep:
    ascend_910b: unsupported
  multi_node_tep:
    ascend_910b: unsupported
# These core-default features become opt-in (unchecked by default).
hardware_opt_in_features:
  ascend_910b:
    - reasoning
    - tool_calling
    - encoder_parallel
features:
  spec_decoding:
    modes:
      mtp:
        hardware_overrides:
          ascend_910b:
            args:
              - '--speculative-config'
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
          ascend_910c:
            args:
              - '--speculative-config'
              - '{"method":"mtp","num_speculative_tokens":3}'
          ascend_950dt:
            args:
              - '--speculative-config'
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
variants:
  # The base recipe's BF16 `default` variant carries no Ascend image; without
  # this block the renderer falls back to the NVIDIA default image and emits
  # an unrunnable `vllm serve` for ascend_910c / ascend_950dt / ascend_910b.
  default:
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_serve_command: "vllm serve"
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a5
        docker_serve_command: "vllm serve"
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'

  ascend_w8a8_a2:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8
    precision: int8
    label: W8A8 (Ascend A2)
    vram_minimum_gb: 42
    supported_hardware:
      - ascend_910b
    supported_frontends:
      - python
    tp: 2
    min_vllm_version: 0.32.0rc1
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8000'
      - '--enable-expert-parallel'
      - '--quantization'
      - ascend
      - '--max-num-seqs'
      - '128'
      - '--max-model-len'
      - '135168'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--safetensors-load-strategy'
      - lazy
      - '--enable-prefix-caching'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      HCCL_BUFFSIZE: '1024'
      HCCL_OP_EXPANSION_MODE: AIV
      ASCEND_RT_VISIBLE_DEVICES: '0,1'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_serve_command: "vllm serve"
        docker_shm_size: 1g
        install:
          pip: false

  ascend_w8a8_a3:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8
    precision: int8
    label: W8A8 (Ascend A3)
    vram_minimum_gb: 42
    supported_hardware:
      - ascend_910c
    tp: 2
    min_vllm_version: 0.30.0
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8000'
      - '--quantization'
      - ascend
      - '--max-num-seqs'
      - '128'
      - '--max-model-len'
      - '135168'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--trust-remote-code'
      - '--safetensors-load-strategy'
      - lazy
      - '--dtype'
      - bfloat16
      - '--enable-prefix-caching'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      HCCL_BUFFSIZE: '1024'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        docker_shm_size: 1g
        install:
          pip: false

  ascend_w8a8_mxfp8_a5:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8
    precision: mxfp8
    label: W8A8 MXFP8
    vram_minimum_gb: 80
    supported_hardware:
      - ascend_950dt
    tp: 1
    min_vllm_version: 0.30.0
    default_modes:
      spec_decoding: mtp
    extra_args: &mx_serving_args
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8000'
      - '--quantization'
      - ascend
      - '--max-model-len'
      - '135168'
      - '--max-num-seqs'
      - '128'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--trust-remote-code'
      - '--safetensors-load-strategy'
      - lazy
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
      - '--enable-prefix-caching'
    extra_env: &mx_serving_env
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a5
        docker_serve_command: "vllm serve"
        docker_shm_size: 500g
        install:
          pip: false

  ascend_w8a8c8_mxfp8_a5:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8
    precision: mxfp8
    label: W8A8C8 MXFP8 (950DT)
    vram_minimum_gb: 80
    supported_hardware: [ascend_950dt]
    supported_frontends: [python]
    tp: 1
    min_vllm_version: 0.30.0
    default_modes:
      spec_decoding: mtp
    extra_args: *mx_serving_args
    extra_env: *mx_serving_env
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a5
        docker_serve_command: "vllm serve"
        docker_shm_size: 500g
        install:
          pip: false
        extra_args: ['--kv-cache-dtype', mxfp8]

presets:
  ascend_a2_w8a8_tp2_ep:
    label: A2 tutorial, TP2 with expert parallelism (4096 tokens)
    hardware: ascend_910b
    strategy: single_node_tp
    variants:
      - ascend_w8a8_a2
    source:
      label: Qwen3.6-35B-A3B single-node deployment on A2
      href: https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#51-single-node-online-deployment
      key: A2 Series / A3 Series
      revision: 638d7184045f149b07bd904690772a6544126200
    select:
      frontend: python
      features:
        spec_decoding: mtp
        tool_calling: false
        reasoning: false
        encoder_parallel: false
    json_args:
      --speculative-config: {method: mtp}
    args:
      - '--data-parallel-size'
      - '1'
      - '--max-num-batched-tokens'
      - '4096'
      - '--trust-remote-code'
      - '--served-model-name'
      - qwen3.6
      # The builder's Verify and Benchmark commands send the checkpoint ID.
      - Eco-Tech/Qwen3.6-35B-A3B-w8a8
    runbook: >-
      Select this preset for the tutorial's 4096-token batch. Baseline retains
      the 8192-token A2 launch. Both use the recipe's v0.32.0rc1 A2 image.
      Apply the host CPU and NUMA settings from section 5.1 when appropriate.

  ascend_a3_w8a8_tp2_ep:
    label: A3 W8A8 TP2 with expert parallelism
    hardware: ascend_910c
    strategy: single_node_tp
    variants:
      - ascend_w8a8_a3
    default: true
    source:
      label: Qwen3.6-35B-A3B single-node deployment on A3
      href: https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#51-single-node-online-deployment
      key: A2 Series / A3 Series
      revision: 638d7184045f149b07bd904690772a6544126200
    select:
      frontend: python
      features:
        spec_decoding: mtp
        tool_calling: false
        reasoning: false
        encoder_parallel: false
    env:
      ASCEND_RT_VISIBLE_DEVICES: '0,1'
    args:
      - '--data-parallel-size'
      - '1'
      - '--enable-expert-parallel'
      - '--served-model-name'
      - qwen3.6
      # The builder's Verify and Benchmark commands send the checkpoint ID.
      - Eco-Tech/Qwen3.6-35B-A3B-w8a8
    remove_args:
      - '--dtype'
    runbook: >-
      Use the A3 container from section 4.1 of the tutorial. If the weights are
      already in the host's ModelScope cache, mount that cache at the same path
      inside the container. Section 5.1 also lists the host CPU and NUMA settings.

  ascend_950dt_w8a8_mxfp8_tp1:
    label: 950DT W8A8 MXFP8, single NPU
    hardware: ascend_950dt
    strategy: single_node_tp
    variants: [ascend_w8a8_mxfp8_a5]
    default: true
    source:
      label: Qwen3.6-35B-A3B single-node deployment on 950DT
      href: https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#51-single-node-online-deployment
      key: 950DT Products
      revision: 638d7184045f149b07bd904690772a6544126200
    select:
      frontend: python
      features:
        spec_decoding: mtp
        tool_calling: false
        reasoning: false
        encoder_parallel: false
    env:
      ASCEND_RT_VISIBLE_DEVICES: '0'
    json_args:
      --speculative-config: {method: mtp}
    args:
      - '--data-parallel-size'
      - '1'
      - '--served-model-name'
      - qwen3.6
      - Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8
    runbook: >-
      Use the A5 container from section 4.1. Wait for static kernel compilation
      and graph capture to finish before sending the health check.

  ascend_950dt_w8a8c8_mxfp8_tp1:
    label: 950DT W8A8C8 MXFP8, single NPU
    hardware: ascend_950dt
    strategy: single_node_tp
    variants: [ascend_w8a8c8_mxfp8_a5]
    default: true
    source:
      label: Qwen3.6-35B-A3B single-node deployment on 950DT
      href: https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#51-single-node-online-deployment
      key: 950DT Products
      revision: 638d7184045f149b07bd904690772a6544126200
    select:
      frontend: python
      features:
        spec_decoding: mtp
        tool_calling: false
        reasoning: false
        encoder_parallel: false
    env:
      ASCEND_RT_VISIBLE_DEVICES: '0'
    json_args:
      --speculative-config: {method: mtp}
    args:
      - '--data-parallel-size'
      - '1'
      - '--served-model-name'
      - qwen3.6
      - Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8
    runbook: >-
      Use the A5 container from section 4.1. Wait for static kernel compilation
      and graph capture to finish before sending the health check.

hardware_notes:
  ascend_910b:
    title: A2 runs on two NPUs with v0.32.0rc1
    body: >-
      The A2 config uses quay.io/ascend/vllm-ascend:v0.32.0rc1 and runs the
      ModelSlim W8A8 checkpoint as TP2 with expert parallelism on two NPUs.
      The "Ascend A2 deployment" section of the guide covers the feature
      toggles.
    link:
      label: Ascend A2 deployment
      href: '#ascend-a2-deployment'

  ascend_910c:
    title: A3 W8A8 on two NPUs
    body: Select W8A8 (Ascend A3) and single-node TP to run TP2 with EP on devices 0 and 1.
    link:
      label: A3 and 950DT deployment
      href: '#ascend-a3-and-950dt-deployment'
  ascend_950dt:
    title: 950DT MXFP8 on one NPU
    body: Select the W8A8 or W8A8C8 MXFP8 checkpoint. The C8 checkpoint also uses MXFP8 KV cache.
    link:
      label: A3 and 950DT deployment
      href: '#ascend-a3-and-950dt-deployment'

guide_sections:
  ascend: |
    ## Ascend A2 deployment

    The rendered default for A2 is the verified flag set — only MTP is on. The
    Qwen tool-call, reasoning and encoder-parallel features are opt-in on
    ascend_910b because they were not part of the verified launch; turn them on
    in the Features row when you need them (`--enable-auto-tool-choice
    --tool-call-parser qwen3_coder`, `--reasoning-parser qwen3`,
    `--mm-encoder-tp-mode data`).

    The A2 tutorial preset uses a batch budget of 4096. Select Baseline for
    the verified 8192-token configuration. Both run the
    [W8A8 weights](https://www.modelscope.cn/models/Eco-Tech/Qwen3.6-35B-A3B-w8a8).

    ## Ascend A3 and 950DT deployment

    On A3, choose W8A8 and single-node TP for two-device TP2 with EP. On
    950DT, single-node TP serves the
    [W8A8 MXFP8 weights](https://www.modelscope.cn/models/Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8)
    on device 0. Select [W8A8C8 MXFP8](https://www.modelscope.cn/models/Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8)
    to use the C8 checkpoint with `--kv-cache-dtype mxfp8`. These presets
    enable MTP with three speculative tokens and accept the API name `qwen3.6`.

    Follow the [container setup](https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#41-docker-image-installation)
    for host mounts, including the ModelScope cache for pre-downloaded weights.
    For Atlas 300I Duo, follow the two-device TP2 launch in the
    [single-node tutorial](https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#51-single-node-online-deployment).
    The Recipes 310P3 profile represents one logical NPU. The same tutorial
    lists BF16 and 950DT W4A8-MXFP weights in its prerequisites.

    After startup, check `/health` and run the
    [completion request](https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#6-functional-verification).
    The tutorial includes [accuracy evaluation](https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#7-accuracy-evaluation),
    [benchmark instructions](https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#8-performance-evaluation) and
    [throughput and latency tuning](https://github.com/vllm-project/vllm-ascend/blob/638d7184045f149b07bd904690772a6544126200/docs/source/tutorials/models/Qwen3.6-35B-A3B.md#91-recommended-configurations).
