meta:
  date_updated: 2026-10-28
  hardware:
    ascend_910c: verified
    ascend_950dt: supported

variants:
  ascend_w8a8:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8
    precision: int8
    label: W8A8 (Ascend A3)
    vram_minimum_gb: 48
    supported_hardware:
      - ascend_910c
    tp: 2
    min_vllm_version: 0.32.0
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--quantization'
      - ascend
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend@sha256:943b63f8f634f09e3f8ca810f0d8c7a8c68a8e5312dfcb241caf0b0a48487c73
        docker_serve_command: vllm serve
        install:
          pip: false
    description: ModelSlim W8A8 checkpoint, verified on two 64 GB Ascend 910C NPUs with BF16 execution.
  ascend_w8a8_mxfp8:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8
    precision: mxfp8
    label: W8A8 MXFP8 (Ascend)
    vram_minimum_gb: 48
    supported_hardware:
      - ascend_950dt
    tp: 1
    min_vllm_version: 0.30.0
    nightly_required: true
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--quantization'
      - ascend
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
        docker_serve_command: vllm serve
        install:
          pip: false
    description: Tutorial configuration for one 96 GB Ascend 950DT NPU.
  ascend_w8a8c8_mxfp8:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8
    precision: mxfp8
    label: W8A8C8 MXFP8 (Ascend)
    vram_minimum_gb: 48
    supported_hardware:
      - ascend_950dt
    tp: 1
    min_vllm_version: 0.30.0
    nightly_required: true
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--quantization'
      - ascend
      - '--kv-cache-dtype'
      - mxfp8
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
        docker_serve_command: vllm serve
        install:
          pip: false
    description: Tutorial C8 checkpoint with MXFP8 KV cache on Ascend 950DT.

features:
  spec_decoding:
    modes:
      mtp:
        hardware_overrides:
          npu:
            args:
              - '--speculative-config'
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'

hardware_opt_in_features:
  ascend_910c:
    - tool_calling
    - reasoning
    - encoder_parallel
  ascend_950dt:
    - tool_calling
    - reasoning
    - encoder_parallel

presets:
  ascend_a3_w8a8:
    label: A3 W8A8 TP2
    hardware: ascend_910c
    strategy: single_node_tp
    variants:
      - ascend_w8a8
    default: true
    source:
      label: vLLM Ascend tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/deca4670c4f654e06ca802fb000e260f2ab98232/docs/source/tutorials/models/Qwen3.6-35B-A3B.md
      revision: deca4670c4f654e06ca802fb000e260f2ab98232
    select:
      frontend: python
      features:
        spec_decoding: mtp
        tool_calling: false
        reasoning: false
        encoder_parallel: false
    args:
      - '--host'
      - 0.0.0.0
      - '--port'
      - '8000'
      - '--data-parallel-size'
      - '1'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '128'
      - '--max-model-len'
      - '135168'
      - '--max-num-batched-tokens'
      - '4096'
      - '--safetensors-load-strategy'
      - lazy
      - '--gpu-memory-utilization'
      - '0.90'
      - '--dtype'
      - bfloat16
      - '--enable-prefix-caching'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
    env:
      HCCL_BUFFSIZE: '1024'
      ASCEND_RT_VISIBLE_DEVICES: '0,1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    runbook: |
      Verified with W8A8 weights on two 64 GB Ascend 910C NPUs, vLLM 0.32.0,
      vLLM Ascend bd42eea01, and CANN 9.2. Health, completions, chat, concurrent
      requests, and MTP graph replay passed. The configured context limit is
      135168; validation used short text requests.

      BF16 execution resolves the FP16 GroupedMatmul error 161002 observed
      with this image. Provide at least 16 GB of container shared memory.
  ascend_950dt_mxfp8:
    label: 950DT MXFP8 TP1
    hardware: ascend_950dt
    strategy: single_node_tp
    variants:
      - ascend_w8a8_mxfp8
      - ascend_w8a8c8_mxfp8
    default: true
    source:
      label: vLLM Ascend tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/deca4670c4f654e06ca802fb000e260f2ab98232/docs/source/tutorials/models/Qwen3.6-35B-A3B.md
      revision: deca4670c4f654e06ca802fb000e260f2ab98232
    select:
      frontend: python
      features:
        spec_decoding: mtp
        tool_calling: false
        reasoning: false
        encoder_parallel: false
    args:
      - '--host'
      - 0.0.0.0
      - '--port'
      - '8000'
      - '--safetensors-load-strategy'
      - lazy
      - '--data-parallel-size'
      - '1'
      - '--max-model-len'
      - '135168'
      - '--max-num-seqs'
      - '128'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
      - '--enable-prefix-caching'
    env:
      ASCEND_RT_VISIBLE_DEVICES: '0'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    runbook: |
      Configuration from the official tutorial; hardware validation is pending.
      Static kernel generation increases startup time. Wait for graph capture
      and service readiness before sending requests.

guide_sections:
  ascend: |
    ## Huawei Ascend

    The Ascend variants use ModelScope checkpoints and hardware-specific
    vLLM Ascend images. See the [installation guide](https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html)
    for driver and firmware requirements.

    A3 verification covers the [W8A8 checkpoint](https://modelscope.cn/models/Eco-Tech/Qwen3.6-35B-A3B-w8a8)
    with TP2, DP1, expert parallelism, BF16 execution, and three-token MTP.
    The 950DT configurations use [W8A8 MXFP8](https://modelscope.cn/models/Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8)
    or [W8A8C8 MXFP8](https://modelscope.cn/models/Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8)
    on one NPU; hardware validation is pending.

    The API model name matches the selected checkpoint ID. For a short chat
    check, send `2+2` with `chat_template_kwargs: {"enable_thinking": false}`
    and verify that the response contains `4` with `finish_reason: stop`.

    See the [model tutorial](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3.6-35B-A3B.html)
    for container setup, A2 and Atlas 300I DUO deployment, accuracy evaluation,
    and performance testing.
