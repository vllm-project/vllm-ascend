# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/Qwen/Qwen3.6-35B-A3B.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
meta:
  hardware:
    ascend_910c: verified
    ascend_950dt: verified
features:
  spec_decoding:
    modes:
      mtp:
        hardware_overrides:
          ascend_910c:
            args:
              - '--speculative-config'
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
          ascend_950dt:
            args:
              - '--speculative-config'
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
variants:
  ascend_w8a8_a3:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8
    precision: int8
    label: W8A8 (Ascend A3)
    vram_minimum_gb: 42
    supported_hardware:
      - ascend_910c
    tp: 2
    min_vllm_version: 0.30.0
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--data-parallel-size'
      - '1'
      - '--tensor-parallel-size'
      - '2'
      - '--quantization'
      - ascend
      - '--served-model-name'
      - qwen3.6
      - '--max-num-seqs'
      - '128'
      - '--max-model-len'
      - '135168'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--trust-remote-code'
      - '--safetensors-load-strategy'
      - lazy
      - '--dtype'
      - bfloat16
      - '--enable-prefix-caching'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
    extra_env:
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      HCCL_BUFFSIZE: '1024'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip:
            command: |-
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then
                source /usr/local/Ascend/nnal/atb/set_env.sh
              fi
              curl -LsSf https://astral.sh/uv/install.sh | sed 's/verify_checksum "$_file"/true/' | INSTALLER_DOWNLOAD_URL=https://wheelnext.astral.sh sh
              source "$HOME/.local/bin/env"
              python3 -m pip install --extra-index-url https://download.pytorch.org/whl/cpu/ "vllm==0.30.0"
              uv pip install --system \
                --extra-index-url https://mirrors.huaweicloud.com/ascend/repos/pypi/variant \
                --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
                --find-links https://mirrors.huaweicloud.com/ascend/repos/pypi/triton-ascend/ \
                "vllm-ascend==0.30.0"
              python3 -m pip uninstall -y triton triton-ascend
              python3 -m pip install --extra-index-url https://mirrors.huaweicloud.com/ascend/repos/pypi "triton-ascend==3.6.0.post2"
            note: >-
              For Ascend A3/950DT, use this official WheelNext uv flow in an existing compatible CANN + NNAL environment. Ordinary pip prebuilt wheels target A2. See https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html

  ascend_w8a8_mxfp8_a5:
    model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8
    precision: mxfp8
    label: W8A8 MXFP8 (Ascend 950DT)
    vram_minimum_gb: 80
    supported_hardware:
      - ascend_950dt
    tp: 1
    min_vllm_version: 0.30.0
    default_modes:
      spec_decoding: mtp
    extra_args:
      - '--data-parallel-size'
      - '1'
      - '--tensor-parallel-size'
      - '1'
      - '--quantization'
      - ascend
      - '--served-model-name'
      - qwen3.6
      - '--max-model-len'
      - '135168'
      - '--max-num-seqs'
      - '128'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--trust-remote-code'
      - '--safetensors-load-strategy'
      - lazy
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
      - '--enable-prefix-caching'
    extra_env:
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a5
        docker_serve_command: "vllm serve"
        install:
          pip:
            command: |-
              source /usr/local/Ascend/ascend-toolkit/set_env.sh
              if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then
                source /usr/local/Ascend/nnal/atb/set_env.sh
              fi
              curl -LsSf https://astral.sh/uv/install.sh | sed 's/verify_checksum "$_file"/true/' | INSTALLER_DOWNLOAD_URL=https://wheelnext.astral.sh sh
              source "$HOME/.local/bin/env"
              python3 -m pip install --extra-index-url https://download.pytorch.org/whl/cpu/ "vllm==0.30.0"
              uv pip install --system \
                --extra-index-url https://mirrors.huaweicloud.com/ascend/repos/pypi/variant \
                --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
                --find-links https://mirrors.huaweicloud.com/ascend/repos/pypi/triton-ascend/ \
                "vllm-ascend==0.30.0"
              python3 -m pip uninstall -y triton triton-ascend
              python3 -m pip install --extra-index-url https://mirrors.huaweicloud.com/ascend/repos/pypi "triton-ascend==3.6.0.post2"
            note: >-
              For Ascend A3/950DT, use this official WheelNext uv flow in an existing compatible CANN + NNAL environment. Ordinary pip prebuilt wheels target A2. See https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html
