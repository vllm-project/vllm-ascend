# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/Qwen/Qwen3.8-27B.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
variants:
  ascend_w8a8:
    model_id: Eco-Tech/Qwen3.8-27B-w8a8
    precision: int8
    label: W8A8 (Ascend)
    vram_minimum_gb: 39
    supported_hardware:
      - ascend_950pr
      - ascend_910b
    # TP2 on Atlas 800I A2 (the layout verified in the vLLM Ascend tutorial);
    # 950PR keeps the single-NPU auto fit.
    tp:
      ascend_910b: 2
    default_modes:
      spec_decoding: qwen3_5_mtp
    extra_args:
      - '--quantization'
      - ascend
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true}'
      - '--max-num-batched-tokens'
      - '16384'
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '512'
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
    hardware_overrides:
      ascend_950pr:
        docker_image: quay.io/ascend/vllm-ascend:qwen3.8-a5
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        install:
          pip: false
        docker_serve_command: vllm serve
        extra_args:
          - '--served-model-name'
          - qwen3.8
          - '--max-num-seqs'
          - '32'
          - '--max-model-len'
          - '133120'
          - '--trust-remote-code'
          - '--dtype'
          - bfloat16
          - '--mm-processor-cache-gb'
          - '0'
          - '--mm-processor-cache-type'
          - shm
          - '--gpu-memory-utilization'
          - '0.85'
          - '--compilation-config'
          - '{"cudagraph_capture_sizes": [1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"cudagraph_mode": "FULL_DECODE_ONLY"}'
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
    description: 'ModelSlim INT8 W8A8 for Ascend NPU — 32.1 GB: 1 NPU. Requires --quantization ascend.'
  fp8:
    hardware_overrides:
      ascend_950pr:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
    supported_hardware:
      - ascend_950pr
  # C8 checkpoint from the tutorial's 950DT tab: same ModelSlim W8A8 MXFP8
  # weights plus an MXFP8 KV cache (--kv-cache-dtype mxfp8), which is why it
  # is a separate variant from ascend_w8a8 rather than a hardware override.
  ascend_w8a8c8_mxfp8:
    model_id: Eco-Tech/Qwen3.8-27B-w8a8c8-mxfp8
    precision: mxfp8
    label: W8A8C8 MXFP8 (Ascend)
    vram_minimum_gb: 39
    supported_hardware:
      - ascend_950dt
    # spec_decoding is deliberately absent: the MTP line lives in extra_args
    # (the base's qwen3_5_mtp mode is variant-filtered and an overlay cannot
    # add this variant to that list), so the toggle is disabled rather than
    # left pointing at a mode it cannot use — the DeepSeek-V4-Pro W4A8 lane
    # shapes this the same way.
    supported_features:
      - tool_calling
      - reasoning
      - encoder_parallel
    tp: 1
    min_vllm_version: 0.23.0
    extra_args:
      - '--quantization'
      - ascend
      - '--kv-cache-dtype'
      - mxfp8
      - '--served-model-name'
      - qwen3.8
      - '--max-num-seqs'
      - '32'
      - '--max-model-len'
      - '133120'
      - '--max-num-batched-tokens'
      - '16384'
      - '--trust-remote-code'
      - '--mm-processor-cache-gb'
      - '0'
      - '--mm-processor-cache-type'
      - shm
      - '--gpu-memory-utilization'
      - '0.85'
      # The base recipe's qwen3_5_mtp spec-decoding mode is variant-filtered
      # to [ascend_w8a8, fp8] and an overlay cannot extend that list or add a
      # new mode, so the tutorial's MTP line is baked into extra_args instead
      # (the approach the DeepSeek-V4-Pro A3 variant takes for DSpark). Like
      # 910B, the 950DT draft head replays the aclgraph, so no enforce_eager.
      - '--speculative-config'
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      - '--compilation-config'
      - '{"cudagraph_capture_sizes": [1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding": true, "enable_flashcomm1": true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '512'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:qwen3.8-a5
        # No pip path for this lane: the ModelScope checkpoint needs the
        # model-specific a5 image (same as the 910B override below).
        install:
          pip: false
    description: 'ModelSlim W8A8 MXFP8 build with C8 MXFP8 KV cache for Ascend 950DT — 32.1 GB of weights on one NPU (96 GB). Requires --quantization ascend and --kv-cache-dtype mxfp8.'
# The Ascend images ship no vllm-rs binary, so the Rust frontend aborts at
# startup (FileNotFoundError: vllm-rs). The preset below pins the Python
# frontend on 910B only — presets match their hardware exactly, so 950PR
# renderings keep whatever the core recipe selects for them.
presets:
  ascend_910b_python:
    label: Python frontend (no vllm-rs in the A2 image)
    hardware: ascend_910b
    default: true
    variants: [ascend_w8a8]
    source:
      label: vLLM Ascend tutorial — Qwen3.8-27B on Atlas 800I A2
      href: https://docs.vllm.ai/projects/ascend/zh-cn/main/tutorials/models/Qwen3.8-27B.html
    select:
      frontend: python
features:
  spec_decoding:
    modes:
      qwen3_5_mtp:
        hardware_overrides:
          # On 910B the draft head replays the aclgraph too — the tutorial's
          # Atlas 800I A2 launch line carries no enforce_eager.
          ascend_910b:
            args:
              - '--speculative-config'
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
meta:
  date_updated: 2026-11-26
  hardware:
    ascend_950pr: verified
    ascend_910b: verified
    ascend_950dt: verified
guide_sections:
  ascend: |
    ### Huawei Ascend 950PR-w8a8 (vLLM Ascend)

    Verified on a single 950PR, TP1, vLLM Ascend 0.23.0 from the
    `quay.io/ascend/vllm-ascend:qwen3.8-a5` image.

    The ModelSlim INT8 build is the checkpoint to use here. `--quantization ascend` is what
    selects the ModelSlim scheme — without it the loader treats the weights as float. The MTP
    head inside the checkpoint works and is spelled `qwen3_5_mtp` on this backend.

    Both the weight and the image come from ModelScope, not HuggingFace: set
    `VLLM_USE_MODELSCOPE=True` or pass a local path.

    ```bash
    export VLLM_USE_MODELSCOPE=True
    export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
    export HCCL_BUFFSIZE=512
    export OMP_PROC_BIND=false
    export OMP_NUM_THREADS=1

    vllm serve Eco-Tech/Qwen3.8-27B-w8a8 \
      --tensor-parallel-size 1 \
      --quantization ascend \
      --max-num-batched-tokens 16384 \
      --enable-prefix-caching \
      --reasoning-parser qwen3 \
      --tool-call-parser qwen3_coder \
      --mm-encoder-tp-mode data \
      --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}' \
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
      --additional-config '{"enable_cpu_binding":true}'
    ```

    `--reasoning-parser qwen3` is not optional in practice: the chat template opens every
    assistant turn with `<think>`, so without it the entire reasoning block lands in
    `message.content` and a 2048-token budget can be spent before the answer starts.

    Measured single-stream decode: 64 tok/s (2048-token completion, one request, MTP on).
    Read MTP acceptance from `vllm:spec_decode_num_{accepted,draft}_tokens_total` before
    tuning `num_speculative_tokens` — throughput alone cannot tell a working drafter from
    one that loaded and was ignored.

    ### Huawei Ascend 950PR-Native block-scaled FP8 (vLLM Ascend)

    Verified on a single 950PR, TP1, vLLM Ascend 0.23.0 from the
    `quay.io/ascend/vllm-ascend:nightly-main-a5` image.

    The official `Qwen/Qwen3.8-27B-FP8` checkpoint serves directly on a 950PR — no offline
    re-quantization and **no `--quantization ascend`**. vLLM Ascend reads `quant_method: fp8`
    and `weight_block_size` straight from the checkpoint, expands the `weight_scale_inv`
    tiles at load time and re-quantizes to MXFP8 on 950.

    Requires a vLLM Ascend build that includes
    [vllm-ascend#14852](https://github.com/vllm-project/vllm-ascend/pull/14852) (merged
    2026-08-26); no tagged release carries it yet. The W8A8 path above is unaffected.

    ```bash
    vllm serve Qwen/Qwen3.8-27B-FP8 \
      --tensor-parallel-size 1 \
      --max-model-len 128000 \
      --max-num-seqs 16 \
      --gpu-memory-utilization 0.85 \
      --trust-remote-code \
      --enable-prefix-caching \
      --reasoning-parser qwen3 \
      --tool-call-parser qwen3_coder \
      --mm-encoder-tp-mode data \
      --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3, "enforce_eager": true}'
    ```

    ### Huawei Ascend 910B-w8a8 (vLLM Ascend)

    Verified on Atlas 800I A2 (8x Ascend 910B, 64 GB each), TP2, vLLM Ascend from the
    `quay.io/ascend/vllm-ascend:v0.32.0rc1` image.

    The same ModelSlim INT8 build as on 950PR serves here at TP2. `--dtype bfloat16` is
    required on 910B (the 950PR default auto-selection picks a dtype the A2 tutorial
    explicitly pins). The MTP head works the same way, spelled `qwen3_5_mtp` with three
    draft tokens and no `enforce_eager` on this generation.

    Both the weight and the image come from ModelScope, not HuggingFace: set
    `VLLM_USE_MODELSCOPE=True` or pass a local path.

    ```bash
    export VLLM_USE_MODELSCOPE=True
    export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
    export HCCL_BUFFSIZE=512
    export OMP_PROC_BIND=false
    export OMP_NUM_THREADS=1

    vllm serve Eco-Tech/Qwen3.8-27B-w8a8 \
      --tensor-parallel-size 2 \
      --quantization ascend \
      --served-model-name qwen3.8 \
      --max-num-seqs 32 \
      --max-model-len 133120 \
      --max-num-batched-tokens 16384 \
      --trust-remote-code \
      --dtype bfloat16 \
      --reasoning-parser qwen3 \
      --mm-processor-cache-gb 0 \
      --mm-encoder-tp-mode data \
      --mm-processor-cache-type shm \
      --enable-prefix-caching \
      --gpu-memory-utilization 0.85 \
      --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}' \
      --compilation-config '{"cudagraph_capture_sizes": [1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"cudagraph_mode": "FULL_DECODE_ONLY"}' \
      --additional-config '{"enable_cpu_binding":true}'
    ```

    `--reasoning-parser qwen3` is not optional in practice: the chat template opens every
    assistant turn with `<think>`, so without it the entire reasoning block lands in
    `message.content` and a 2048-token budget can be spent before the answer starts.

    ### Huawei Ascend 950DT-w8a8c8 (vLLM Ascend)

    Verified on 950DT products (8x 96 GB HBM per node), TP1, vLLM Ascend 0.23.0 from the
    `quay.io/ascend/vllm-ascend:qwen3.8-a5` image.

    The C8 checkpoint `Eco-Tech/Qwen3.8-27B-w8a8c8-mxfp8` pairs the ModelSlim W8A8 MXFP8
    weights with an MXFP8 KV cache: it needs both `--quantization ascend` and
    `--kv-cache-dtype mxfp8`, which stores the full-attention KV cache as FP8 (E4M3) with
    E8M0 scales on the QFA kernel and brings the long-sequence gains. With C8,
    `--block-size` must stay a multiple of 512 (it defaults to 512). For short sequences
    (e.g. 16K input) serve `Eco-Tech/Qwen3.8-27B-w8a8-mxfp8` instead and drop
    `--kv-cache-dtype mxfp8`. The C8 KV cache is documented for 950PR & 950DT products,
    but this lane is 950DT only: it mirrors the tutorial's 950DT tab, the one place the
    C8 checkpoint gets a validated launch line — the tutorial's 950PR tab keeps the W8A8
    weights as its recommended path there, which the `ascend_w8a8` lane above covers.

    Both the weight and the image come from ModelScope, not HuggingFace: set
    `VLLM_USE_MODELSCOPE=True` or pass a local path.

    ```bash
    export VLLM_USE_MODELSCOPE=True
    export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
    export HCCL_BUFFSIZE=512

    vllm serve Eco-Tech/Qwen3.8-27B-w8a8c8-mxfp8 \
      --tensor-parallel-size 1 \
      --quantization ascend \
      --kv-cache-dtype mxfp8 \
      --served-model-name qwen3.8 \
      --max-num-seqs 32 \
      --max-model-len 133120 \
      --max-num-batched-tokens 16384 \
      --trust-remote-code \
      --reasoning-parser qwen3 \
      --tool-call-parser qwen3_coder \
      --mm-processor-cache-gb 0 \
      --mm-encoder-tp-mode data \
      --mm-processor-cache-type shm \
      --enable-prefix-caching \
      --gpu-memory-utilization 0.85 \
      --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
      --compilation-config '{"cudagraph_capture_sizes": [1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128],"cudagraph_mode": "FULL_DECODE_ONLY"}' \
      --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
    ```

    Like 910B, the 950DT draft head replays the aclgraph, so the `qwen3_5_mtp`
    speculative config carries no `enforce_eager`. Read MTP acceptance from
    `vllm:spec_decode_num_{accepted,draft}_tokens_total` before tuning
    `num_speculative_tokens` — throughput alone cannot tell a working drafter from
    one that loaded and was ignored.

    The checkpoint fits a single 950DT NPU (96 GB): follow the DP-first principle —
    TP1 is the recommended default and the remaining NPUs should be allocated to DP for
    parallel request batches. The tutorial supports `--max-model-len` up to 262144 in
    the same TP1 + DP8 layout. `--reasoning-parser qwen3` is not optional in practice:
    the chat template opens every assistant turn with `<think>`, so without it the entire
    reasoning block lands in `message.content` and a 2048-token budget can be spent
    before the answer starts.
