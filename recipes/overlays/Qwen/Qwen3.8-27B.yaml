variants:
  ascend_w8a8:
    model_id: Eco-Tech/Qwen3.8-27B-w8a8
    precision: int8
    label: W8A8 (Ascend)
    vram_minimum_gb: 39
    supported_hardware:
      - ascend_950pr
    default_modes:
      spec_decoding: qwen3_5_mtp
    extra_args:
      - '--quantization'
      - ascend
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true}'
      - '--max-num-batched-tokens'
      - '16384'
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '512'
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
    hardware_overrides:
      ascend_950pr:
        docker_image: quay.io/ascend/vllm-ascend:qwen3.8-a5
    description: 'ModelSlim INT8 W8A8 for Ascend NPU — 32.1 GB: 1 NPU. Requires --quantization ascend.'
  fp8:
    hardware_overrides:
      ascend_950pr:
        docker_image: quay.io/ascend/vllm-ascend:nightly-main-a5
    supported_hardware:
      - ascend_950pr
meta:
