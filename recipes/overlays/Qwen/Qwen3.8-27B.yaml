        install:
          pip: false
        docker_serve_command: vllm serve
        extra_args:
          - '--served-model-name'
          - qwen3.8
          - '--max-num-seqs'
          - '32'
          - '--max-model-len'
          - '133120'
          - '--trust-remote-code'
          - '--dtype'
          - bfloat16
          - '--mm-processor-cache-gb'
          - '0'
          - '--mm-processor-cache-type'
          - shm
          - '--gpu-memory-utilization'
          - '0.85'
          - '--compilation-config'
