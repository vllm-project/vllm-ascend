# Ascend 310P overlay for Qwen/Qwen3.5-2B.
# Provenance: vllm-ascend-recipes PR #131 + 310P3 gsm8k on v0.30.0rc1-310p
#   (2026-10-29 Asia/Shanghai). Additive Huawei-scoped keys only.
# Requires taxonomy id `ascend_310p` in vllm-project/recipes.
meta:
  hardware:
    ascend_310p: verified

variants:
  ascend_310p_fp16:
    label: "FP16 (Ascend 310P)"
    precision: fp16
    vram_minimum_gb: 8
    description: "FP16 on Ascend 310P (*-310p image). Measured PASS + gsm8k 80.06 on ~21GB 310P3 / v0.30.0rc1-310p (2026-10-29 Asia/Shanghai). Serve with --dtype float16 and qwen3_5_mtp."
    supported_hardware: [ascend_310p]
    tp: 1
    min_vllm_version: "0.23.0"
    extra_args:
      - "--dtype"
      - "float16"
      - "--mamba-ssm-cache-dtype"
      - "float16"
      - "--served-model-name"
      - "qwen3.5"
      - "--max-num-seqs"
      - "32"
      - "--max-model-len"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--speculative-config"
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":1}'
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[2,16]}'
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: "True"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    hardware_overrides:
      ascend_310p:
        docker_image: "quay.io/ascend/vllm-ascend:v0.30.0rc1-310p"
        docker_serve_command: "vllm serve"
        install:
          pip: false

hardware_notes:
  ascend_310p:
    title: Ascend 310P measured lane (2B)
    body: |
      Image: `quay.io/ascend/vllm-ascend:v0.30.0rc1-310p` (also passed `v0.23.0-310p`).
      Community recipe: https://github.com/vllm-ascend/vllm-ascend-recipes/pull/131
      Replace `your_model_path` with local weights or Hub/ModelScope id.
      
      ```bash
      export VLLM_USE_MODELSCOPE=True
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      vllm serve your_model_path \
        --host 127.0.0.1 --port 8080 \
        --tensor-parallel-size 1 \
        --served-model-name qwen3.5 \
        --max-num-seqs 32 --max-model-len 16384 \
        --trust-remote-code --gpu-memory-utilization 0.90 \
        --mamba-ssm-cache-dtype float16 --dtype float16 \
        --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":1}' \
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[2,16]}' \
        --additional-config '{"ascend_compilation_config":{"enable_npugraph_ex":false}}'
      ```
      
      AISBench gsm8k (2026-10-29 Asia/Shanghai): **80.06** (FAIL=0; tutorial ref 77.71).
      textvqa / perf not measured — do not invent numbers. Keep `enable_npugraph_ex: false`.
