# Source: https://github.com/vllm-project/vllm/blob/405a6ce941cbdaf8dc8c7f4a64857b48c4694ac0/recipes/models/Qwen/Qwen3.5-122B-A10B.yaml
# Ascend lane extracted from a measured vLLM-Ascend deployment (hardware-scoped overrides only).
meta:
  hardware:
    ascend_910b: verified
hardware_notes:
  ascend_910b:
    title: vLLM Ascend A2 image required
    body: |-
      Pin quay.io/ascend/vllm-ascend:v0.32.0rc1 - the NVIDIA pip wheel cannot run on Ascend NPU.
      total NPUs = 8.
      Set HCCL_BUFFSIZE=1024 before launch.
      Verified end-to-end with the official BF16 checkpoint.
strategy_hardware:
  pd_cluster:
    npu: unsupported
    ascend_910b: unsupported
strategy_min_gpus:
  ascend_910b: 8
features:
  spec_decoding:
    hardware_overrides:
      ascend_910b:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
variants:
  default:
    hardware_overrides:
      ascend_910b:
        extra_args:
          - '--max-model-len'
          - '200000'
          - '--max-num-batched-tokens'
          - '16384'
          - '--block-size'
          - '128'
          - '--max-num-seqs'
          - '46'
          - '--gpu-memory-utilization'
          - '0.88'
          - '--trust-remote-code'
          - '--async-scheduling'
          - '--allowed-local-media-path'
          - /
          - '--mm-processor-cache-gb'
          - '0'
          - '--additional-config'
          - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
          - '--enable-expert-parallel'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--enable-chunked-prefill'
          - '--enable-prefix-caching'
        extra_env:
          HCCL_CONNECT_TIMEOUT: '7200'
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          HCCL_BUFFSIZE: '1024'
          HCCL_OP_EXPANSION_MODE: AIV
          TASK_QUEUE_ENABLE: '1'
          OMP_NUM_THREADS: '1'
          HCCL_SOCKET_IFNAME: '$IFACE_NAME'
          GLOO_SOCKET_IFNAME: '$IFACE_NAME'
          TP_SOCKET_IFNAME: '$IFACE_NAME'
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_serve_command: vllm serve
        install:
          pip: false
presets:
  ascend_910b_measured:
    label: "Measured (BF16, TP8, MTP)"
    hardware: ascend_910b
    strategy: single_node_tp
    variants: [default]
    default: true
    image: quay.io/ascend/vllm-ascend:v0.32.0rc1
    tp: 8
    source:
      label: "vLLM-Ascend measured deployment (2026-11-04)"
      href: "https://github.com/vllm-project/vllm-ascend/pull/22690"
      key: "ascend-recipe"
      revision: "v0.32.0rc1"
    runbook: |-
      End-to-end measured on an 8-NPU Atlas 800I A2 (Ascend 910B) deployment:
      TP8, MTP speculative decoding (qwen3_5_mtp x3), async scheduling,
      FULL_DECODE_ONLY cudagraphs. Full launch command in the guide section above.
guide_sections:
  ascend: |-
    ### Huawei Atlas 800I A2 (Ascend 910B)  (vLLM Ascend)

    Verified with `quay.io/ascend/vllm-ascend:v0.32.0rc1` on Atlas 800I A2 (Ascend 910B).

    ```bash
    export IFACE_NAME=<cluster-nic-name>   # e.g. eth7 / bond0 of the RoCE plan
    export HCCL_CONNECT_TIMEOUT=7200
    export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
    export HCCL_BUFFSIZE=1024
    export HCCL_OP_EXPANSION_MODE=AIV
    export TASK_QUEUE_ENABLE=1
    export OMP_NUM_THREADS=1
    export HCCL_SOCKET_IFNAME="$IFACE_NAME"
    export GLOO_SOCKET_IFNAME="$IFACE_NAME"
    export TP_SOCKET_IFNAME="$IFACE_NAME"
    vllm serve Qwen/Qwen3.5-122B-A10B \
      --served-model-name qwen3.5-122b-a10b \
      --data-parallel-size 1 \
      --data-parallel-size-local 1 \
      --tensor-parallel-size 8 \
      --max-model-len 200000 \
      --max-num-batched-tokens 16384 \
      --block-size 128 \
      --max-num-seqs 46 \
      --gpu-memory-utilization 0.88 \
      --trust-remote-code \
      --async-scheduling \
      --allowed-local-media-path / \
      --mm-processor-cache-gb 0 \
      --additional-config '{"enable_cpu_binding":true, "multistream_overlap_shared_expert": true}' \
      --enable-expert-parallel \
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}'
    ```
