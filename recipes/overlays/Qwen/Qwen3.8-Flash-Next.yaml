              lookup_rpc_port: '0'
        - id: decode
          role: decode
          container: p
          devices: [4, 5, 6, 7]
          launch:
            argv:
              - vllm
              - serve
              - '{{weights_dir}}'
              - --host
              - 0.0.0.0
              - --port
              - '8248'
              - --served-model-name
              - qwen38-megamoe-sp-pd
              - --trust-remote-code
              - --quantization
              - ascend
              - --tensor-parallel-size
              - '2'
              - --data-parallel-size
              - '2'
              - --max-model-len
              - '262144'
              - --max-num-seqs
              - '64'
              - --max-num-batched-tokens
              - '4096'
              - --gpu-memory-utilization
              - '0.9'
              - --enable-prefix-caching
              - --mamba-cache-mode
              - align
              - --mamba-ssm-cache-dtype
              - bfloat16
              - --async-scheduling
              - --enable-expert-parallel
              - --engram-config
              - '{"cpu_offload":true,"dp_shared_memory":true}'
              - --compilation-config
              - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
              - --additional-config
              - '{"enable_flashcomm1":true,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
              - --speculative-config
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
              - --enable-auto-tool-choice
              - --tool-call-parser
              - qwen3_coder
              - --reasoning-parser
              - qwen3
              - --data-parallel-address
              - '{{address}}'
              - --data-parallel-rpc-port
              - '29780'
            env:
              ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
              VLLM_HOST_IP: '{{address}}'
              HCCL_IF_IP: '{{address}}'
              GLOO_SOCKET_IFNAME: '{{nic}}'
              TP_SOCKET_IFNAME: '{{nic}}'
              HCCL_SOCKET_IFNAME: '{{nic}}'
              NO_PROXY: localhost,127.0.0.1,{{address}}
              no_proxy: localhost,127.0.0.1,{{address}}
              PYTHONHASHSEED: '0'
              VLLM_USE_MODELSCOPE: 'True'
              VLLM_USE_V2_MODEL_RUNNER: '1'
              VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
              VLLM_ENGINE_READY_TIMEOUT_S: '4800'
              HCCL_BUFFSIZE: '512'
              MMC_LOCAL_CONFIG_PATH: '{{config_dir}}/{{decode_config}}'
              ASCEND_RT_VISIBLE_DEVICES: 4,5,6,7
              HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599
            setup: |-
              set -e
              if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then source /usr/local/Ascend/ascend-toolkit/set_env.sh; fi
              if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then source /usr/local/Ascend/nnal/atb/set_env.sh; fi
              unset ftp_proxy FTP_PROXY https_proxy HTTPS_PROXY http_proxy HTTP_PROXY ALL_PROXY all_proxy
              unset HCCL_INTRA_ROCE_ENABLE ASCEND_ENABLE_USE_FABRIC_MEM ASCEND_GLOBAL_RESOURCE_CONFIG
              unset ASCEND_RT_VISIBLE_DEVICES CUDA_VISIBLE_DEVICES MMC_LOCAL_CONFIG_PATH MMC_META_CONFIG_PATH
              ulimit -l unlimited
              ulimit -s 65536
              export PYTHONPATH="/vllm-workspace/vllm-ascend:${PYTHONPATH:-}"
              op=/vllm-workspace/vllm-ascend/vllm_ascend/_cann_ops_custom/vendors/custom_transformer/bin/set_env.bash
              if [ -f "$op" ]; then source "$op"; fi
              libdirs=$(python -c 'from pathlib import Path; from importlib.util import find_spec; print(":".join(str(Path(next(iter(find_spec(p).submodule_search_locations)),"lib")) for p in ("torch","torch_npu")))')
              export LD_LIBRARY_PATH="$libdirs:${LD_LIBRARY_PATH:-}"
              libs=$(python -c 'import importlib.util as u, pathlib, sysconfig; print(":".join([str(pathlib.Path(next(iter(u.find_spec(p).submodule_search_locations)), "lib")) for p in ("memcache_hybrid","memfabric_hybrid")]+[sysconfig.get_config_var("LIBDIR"),next(iter(u.find_spec("mooncake").submodule_search_locations))]))')
              export LD_LIBRARY_PATH="$libs:${LD_LIBRARY_PATH:-}"
            transfer:
              kv_connector: MooncakeConnectorV2
              kv_role: kv_consumer
              kv_port: '32480'
              kv_connector_extra_config:
                prefill:
                  dp_size: 2
                  tp_size: 2
                decode:
                  dp_size: 2
                  tp_size: 2
            store:
              lookup_rpc_port: '1'
        - id: proxy
          role: proxy
          container: p
          launch:
            argv:
              - python3
              - /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
              - --host
              - 0.0.0.0
              - --port
              - '8249'
              - --prefiller-hosts
              - '{{hosts.p.address}}'
              - --prefiller-ports
              - '8247'
              - --decoder-hosts
              - '{{hosts.p.address}}'
              - --decoder-ports
              - '8248'
              - --workers
              - '1'
            env:
              NO_PROXY: localhost,127.0.0.1,{{hosts.p.address}}
              no_proxy: localhost,127.0.0.1,{{hosts.p.address}}
            setup: |-
              set -e
              test -r /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
      constants:
        prefill_config: mmc-local-p.conf
        decode_config: mmc-local-d.conf
      defaults:
        hosts.p.protocol: device_urma
        hosts.p.local_services: 8
        meta_port: 25250
        config_port: 25251
        metrics_port: 25252
      steps:
        - id: hardware
          title: Confirm the selected hardware and communication environment
          stage: storage
          target: hosts
          command: npu-smi info
          check: Check the 950DT Device UB runtime, /etc/hixlep and its transport-specific communication devices/files.
            Confirm host HDK/CANN compatibility and any required site-specific route configuration from the release
            tutorial.
        - id: start-prefill
          title: Start Prefill
          stage: serve
          target: placement:prefill
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - endpoints
        - id: prefill-ready
          title: Wait for the Prefill API
          stage: serve
          target: placement:prefill
          command: curl --fail --silent http://127.0.0.1:8247/v1/models
          check: The served model is listed before Decode starts.
          depends_on:
            - start-prefill
        - id: start-decode
          title: Start Decode
          stage: serve
          target: placement:decode
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - prefill-ready
        - id: role-apis
          title: Check model API readiness
          stage: serve
          target: placement:prefill
          command: |-
            set -e
            curl --noproxy '*' --fail --silent http://{{hosts.p.address}}:8247/v1/models
            curl --noproxy '*' --fail --silent http://{{hosts.p.address}}:8248/v1/models
          check: Every published P/D endpoint lists the selected served model; confirm the expected role, device and
            rank layout in its log.
          depends_on:
            - start-prefill
            - start-decode
        - id: start-proxy
          title: Start the Ascend HTTP proxy
          stage: serve
          target: placement:proxy
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - role-apis
        - id: service
          title: Send a request through the proxy
          stage: serve
          target: placement:proxy
          command: 'curl --fail http://127.0.0.1:8249/v1/chat/completions -H ''Content-Type: application/json'' -d
            ''{"model":"qwen38-megamoe-sp-pd","messages":[{"role":"user","content":"Hello!"}],"temperature":0,"max_tokens":32}'''
          check: Confirm the response and P-to-D transfer in the model logs before checking external pool reuse.
          depends_on:
            - start-proxy
        - id: shared-prefix
          title: Warm the pool and replay a shared prefix
          stage: serve
          target: placement:proxy
          command: |-
            python - 8249 qwen38-megamoe-sp-pd <<'PY'
            import json, sys, urllib.request
            port, model = sys.argv[1:]
            prefix = "The KV cache stores repeated prefixes so later inference can reuse model state. " * 256
            for question in ("Summarize the passage.", "Give the purpose in one sentence."):
                body = {"model":model, "messages":[{"role":"user","content":prefix + question}], "temperature":0,"max_tokens":32}
                request = urllib.request.Request("http://127.0.0.1:"+port+"/v1/chat/completions",
                                                 json.dumps(body).encode(), {"Content-Type":"application/json"})
                with urllib.request.urlopen(request, timeout=300) as response:
                    print(json.load(response)["choices"][0]["message"]["content"])
            PY
          check: Correlate the second request with backend lookup/get evidence on Prefill. Local prefix hits alone
            do not establish external reuse.
          depends_on:
            - service
  ascend_a2_w4a8_pd:
    label: A2 W4A8 PD Separation (1P1D)
    hardware: ascend_910b
    strategy: pd_cluster
    variants:
      - ascend_w4a8
    workload: Prefill/decode disaggregation, 141312 context, MTP
    default: true
    description: >-
      One node per pool. The prefill role overrides the pool's whole-node TP8 sizing with
      tp 4 and pp 2, which renders the verified TP4 x PP2 prefill layout; the decode role
      is DEP with TP2 x DP4 over the multi-port external load balancer, so one supervisor
      process on the decode node runs four child API servers (one per DP rank) and the
      Ascend Router fans decode requests across them, exactly as verified.
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
    roles:
      prefill:
        nodes: 1
        parallelism: tep
        tp: 4
        pp: 2
        args:
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":false}'
          - '--compilation-config'
          - '{"cudagraph_mode":"NONE"}'
          - '--additional-config'
          - '{"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_role: kv_producer
            kv_load_failure_policy: null
            kv_port: '55220'
            kv_connector_extra_config:
              prefill:
                dp_size: 1
                tp_size: 4
                pp_size: 2
              decode:
                dp_size: 4
                tp_size: 2
        env:
          HCCL_BUFFSIZE: '8192'
          HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
      decode:
        nodes: 1
        parallelism: dep
        tp: 2
        args:
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
        json_args:
          --speculative-config:
            enforce_eager: false
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_role: kv_consumer
            kv_load_failure_policy: null
            kv_port: '56010'
            kv_connector_extra_config:
              prefill:
                dp_size: 1
                tp_size: 4
                pp_size: 2
              decode:
                dp_size: 4
                tp_size: 2
        env:
          HCCL_BUFFSIZE: '512'
          HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599

