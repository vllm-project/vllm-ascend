# Overlay for Qwen/Qwen3.8-Flash-Next on Huawei Ascend.
# Verified on two Atlas A2 servers (800T A2 with 8 x Ascend 910B3, 800I A2 with
# 8 x Ascend 910B4-1; 64 GB HBM per NPU), vLLM Ascend v0.32.0rc1.
# 1P1D disaggregation, MooncakeConnectorV2 p2p KV transfer (no KV pool), MTP on both pools:
#   prefill  TP4 x PP2 x DP1 x EP4         (node 1)
#   decode   TP2 x DP4 x EP8               (node 2)
# Topology: one prefill node and one decode node, 8 NPUs each.
meta:
  hardware:
    ascend_910b: verified
    ascend_910c: supported
    ascend_950dt: supported

strategy_hardware:
  single_node_tp:
    npu: unsupported
    ascend_910c: supported
    ascend_950dt: supported
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  single_node_dpa_tp:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_dp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910b: supported

features:
  tool_calling:
    hardware_overrides:
      ascend_910b:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - qwen3_xml
      ascend_950dt:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - 'qwen3_xml'
      ascend_910c:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - 'qwen3_xml'
  spec_decoding:
    hardware_overrides:
      ascend_910b:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
      ascend_950dt:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
      ascend_910c:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'

variants:
  ascend_w4a8:
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8
    label: W4A8 (Ascend A2/A3)
    precision: int4
    # 180.9 GiB on disk = 194.3 GB, x 1.2 headroom (same convention as the DeepSeek recipes)
    vram_minimum_gb: 234
    description: >-
      A2 and A3 use the same ModelSlim W4A8 checkpoint (181 GiB, 48 shards). In the
      two-node A2 1P1D deployment, Engram keeps the 51B N-gram embedding table in
      host memory on both nodes so the weights fit on eight 64 GB NPUs per node.
    supported_hardware:
      - ascend_910b
      - ascend_910c
    tp: {ascend_910c: 8}
    min_vllm_version: 0.32.0
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_serve_command: vllm serve
        # Engram keeps ~95 GiB in /dev/shm on the decode node.
        docker_shm_size: 128g
        install:
          pip: false
        extra_args:
          - '--host'
          - 0.0.0.0
          - '--served-model-name'
          - qwen38-flash-next-a2-pd
          - '--trust-remote-code'
          - '--quantization'
          - ascend
          - '--max-model-len'
          - '141312'
          - '--max-num-seqs'
          - '32'
          - '--max-num-batched-tokens'
          - '8192'
          - '--gpu-memory-utilization'
          - '0.90'
          - '--enable-prefix-caching'
          - '--mamba-cache-mode'
          - align
          - '--async-scheduling'
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
          VLLM_ENGINE_READY_TIMEOUT_S: '4800'
          HCCL_CONNECT_TIMEOUT: '600'
          ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
          PYTHONUNBUFFERED: '1'
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
        extra_args:
          - '--host'
          - '0.0.0.0'
          - '--port'
          - '8088'
          - '--served-model-name'
          - 'qwen3.8-flash-next'
          - '--trust-remote-code'
          - '--quantization'
          - 'ascend'
          - '--data-parallel-size'
          - '1'
          - '--enable-expert-parallel'
          - '--max-model-len'
          - '131072'
          - '--max-num-seqs'
          - '8'
          - '--max-num-batched-tokens'
          - '4096'
          - '--gpu-memory-utilization'
          - '0.93'
          - '--enable-prefix-caching'
          - '--mamba-cache-mode'
          - 'align'
          - '--async-scheduling'
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":false}'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          VLLM_ENGINE_READY_TIMEOUT_S: '4800'

  # These inherited variants are also selectable on Huawei in the base recipe.
  # Give them the platform installer. The PD presets below target W4A8 only.
  fp8:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false
  bf16:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false

  ascend_a5_w4a8_mxfp:
    label: W4A8-MXFP (ASCEND 950DT)
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8-mxfp
    precision: mxfp4
    # 48 ModelScope weight shards total 193.26 GB, with 20% headroom.
    vram_minimum_gb: 232
    supported_hardware: [ascend_950dt]
    min_vllm_version: 0.32.0
    tp: 4
    extra_args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8087'
      - '--served-model-name'
      - 'qwen3.8-flash-next-950-dt'
      - '--trust-remote-code'
      - '--quantization'
      - 'ascend'
      - '--data-parallel-size'
      - '1'
      - '--max-model-len'
      - '141312'
      - '--max-num-seqs'
      - '32'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--enable-prefix-caching'
      - '--async-scheduling'
      - '--enable-expert-parallel'
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":false}'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false

presets:
  ascend_a2_w4a8_pd:
    label: A2 W4A8 PD Separation (1P1D)
    hardware: ascend_910b
    strategy: pd_cluster
    variants:
      - ascend_w4a8
    workload: Prefill/decode disaggregation, 141312 context, MTP
    default: true
    description: >-
      One node per pool. The prefill role overrides the pool's whole-node TP8 sizing with
      tp 4 and pp 2, which renders the verified TP4 x PP2 prefill layout; the decode role
      is DEP with TP2 x DP4 over the multi-port external load balancer, so one supervisor
      process on the decode node runs four child API servers (one per DP rank) and the
      Ascend Router fans decode requests across them, exactly as verified.
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
    roles:
      prefill:
        nodes: 1
        parallelism: tep
        tp: 4
        pp: 2
        args:
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":false}'
          - '--compilation-config'
          - '{"cudagraph_mode":"NONE"}'
          - '--additional-config'
          - '{"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_role: kv_producer
            kv_load_failure_policy: null
            kv_port: '55220'
            kv_connector_extra_config:
              prefill:
                dp_size: 1
                tp_size: 4
                pp_size: 2
              decode:
                dp_size: 4
                tp_size: 2
        env:
          HCCL_BUFFSIZE: '8192'
          HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
      decode:
        nodes: 1
        parallelism: dep
        tp: 2
        args:
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
        json_args:
          --speculative-config:
            enforce_eager: false
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV2
            kv_role: kv_consumer
            kv_load_failure_policy: null
            kv_port: '56010'
            kv_connector_extra_config:
              prefill:
                dp_size: 1
                tp_size: 4
                pp_size: 2
              decode:
                dp_size: 4
                tp_size: 2
        env:
          HCCL_BUFFSIZE: '512'
          HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599

  a3_single_node:
    label: A3 single service, TP8
    hardware: ascend_910c
    strategy: single_node_tp
    variants: [ascend_w4a8]
    default: true
    select:
      frontend: python
    env:
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7

  a5_single_node:
    label: 950DT single service, TP4
    hardware: ascend_950dt
    strategy: single_node_tp
    variants: [ascend_a5_w4a8_mxfp]
    default: true
    select:
      frontend: python
    env:
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3
      VLLM_ENGINE_READY_TIMEOUT_S: '4800'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '1024'
      HCCL_NPU_SOCKET_PORT_RANGE: auto

  a3_single_host_pd:
    label: Single-host PD (A3)
    hardware: ascend_910c
    strategy: single_node_tp
    variants:
      - ascend_w4a8
    source:
      label: Qwen3.8-Flash-Next deployment tutorial
      href: >-
        https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md
      revision: a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee
    select:
      frontend: python
      features:
        tool_calling: false
        reasoning: false
        spec_decoding: true
    runbook: >-
      Run Prefill on devices 0–7 and Decode on devices 8–15 in the same container. Start the proxy for the
      selected workload after both roles are ready.
    env:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      VLLM_HOST_IP: $LOCAL_SERVICE_IP
      HCCL_IF_IP: $LOCAL_SERVICE_IP
      GLOO_SOCKET_IFNAME: $SERVICE_NIC
      TP_SOCKET_IFNAME: $SERVICE_NIC
      HCCL_SOCKET_IFNAME: $SERVICE_NIC
      no_proxy: localhost,127.0.0.1,$LOCAL_SERVICE_IP
      NO_PROXY: localhost,127.0.0.1,$LOCAL_SERVICE_IP
    args:
      - '--served-model-name'
      - qwen38-flash-next-a3-pd
      - '--max-num-seqs'
      - '32'
      - '--gpu-memory-utilization'
      - '0.90'
    points:
      basic_prefill:
        label: Basic PD / Prefill
        default: true
        tp: 2
        args:
          - '--port'
          - '25568'
          - '--max-num-batched-tokens'
          - '8192'
          - '--mamba-ssm-cache-dtype'
          - bfloat16
          - '--enforce-eager'
          - '--additional-config'
          - >-
            {"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}
          - '--pipeline-parallel-size'
          - '4'
          - '--max-model-len'
          - '262144'
          - '--kv-transfer-config'
          - >-
            {"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":32600,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
        remove_args:
          - '--compilation-config'
        json_args:
          '--speculative-config':
            enforce_eager: true
        env:
          ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
          HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
          HCCL_BUFFSIZE: '8192'
      basic_decode:
        label: Basic PD / Decode
        tp: 2
        args:
          - '--port'
          - '25569'
          - '--data-parallel-size'
          - '4'
          - '--max-num-batched-tokens'
          - '8192'
          - '--mamba-ssm-cache-dtype'
          - bfloat16
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--additional-config'
          - >-
            {"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}
          - '--max-model-len'
          - '262144'
          - '--kv-transfer-config'
          - >-
            {"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":32700,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
        json_args:
          '--speculative-config':
            enforce_eager: false
        env:
          ASCEND_RT_VISIBLE_DEVICES: 8,9,10,11,12,13,14,15
          HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599
          HCCL_BUFFSIZE: '512'
      long_context_prefill:
        label: Long context (1M) / Prefill
        tp: 2
        args:
          - '--port'
          - '25568'
          - '--max-num-batched-tokens'
          - '8192'
          - '--mamba-ssm-cache-dtype'
          - bfloat16
          - '--enforce-eager'
          - '--additional-config'
          - >-
            {"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}
          - '--pipeline-parallel-size'
          - '4'
          - '--max-model-len'
          - '1010000'
          - '--hf-overrides'
          - >-
            {"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}
          - '--kv-transfer-config'
          - >-
            {"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":32600,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
        remove_args:
          - '--compilation-config'
        json_args:
          '--speculative-config':
            enforce_eager: true
        env:
          ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
          HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
          HCCL_BUFFSIZE: '8192'
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
      long_context_decode:
        label: Long context (1M) / Decode
        tp: 2
        args:
          - '--port'
          - '25569'
          - '--data-parallel-size'
          - '4'
          - '--max-num-batched-tokens'
          - '8192'
          - '--mamba-ssm-cache-dtype'
          - bfloat16
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--additional-config'
          - >-
            {"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}
          - '--max-model-len'
          - '1010000'
          - '--hf-overrides'
          - >-
            {"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}
          - '--kv-transfer-config'
          - >-
            {"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":32700,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
        json_args:
          '--speculative-config':
            enforce_eager: false
        env:
          ASCEND_RT_VISIBLE_DEVICES: 8,9,10,11,12,13,14,15
          HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599
          HCCL_BUFFSIZE: '512'
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
      image_10k_prefill:
        label: Image and text (10K) / Prefill
        tp: 4
        args:
          - '--port'
          - '25568'
          - '--max-num-batched-tokens'
          - '8192'
          - '--mm-encoder-tp-mode'
          - data
          - '--pipeline-parallel-size'
          - '2'
          - '--data-parallel-size-local'
          - '1'
          - '--max-model-len'
          - '262144'
          - '--no-enable-prefix-caching'
          - '--compilation-config'
          - '{"cudagraph_mode":"NONE"}'
          - '--additional-config'
          - >-
            {"enable_shared_expert_dp":false,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}
          - '--kv-transfer-config'
          - >-
            {"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":"34600","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":4,"pp_size":2,"pp_layer_partition":"24,24"},"decode":{"dp_size":4,"tp_size":2}}}
        remove_args:
          - '--enable-prefix-caching'
          - '--mamba-cache-mode'
          - '--mamba-ssm-cache-dtype'
          - '--enforce-eager'
        json_args:
          '--speculative-config':
            enforce_eager: true
        env:
          ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
          HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
          HCCL_BUFFSIZE: '4096'
          VLLM_SERVER_DEV_MODE: '1'
          VLLM_ENGINE_READY_TIMEOUT_S: '2400'
          VLLM_ASCEND_PLE_BACKEND: torch
          VLLM_PP_LAYER_PARTITION: 24,24
      image_10k_decode:
        label: Image and text (10K) / Decode
        description: >-
          This command runs one Decode rank. Run the four-rank loop in the A3 image-and-text 10K launch scripts
          above the command to set the device pair, API port and Mooncake configuration for each rank.
        tp: 2
        args:
          - '--data-parallel-size'
          - '4'
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--additional-config'
          - >-
            {"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}
          - '--port'
          - $DECODE_HTTP_PORT
          - '--data-parallel-size-local'
          - '1'
          - '--data-parallel-rank'
          - $DECODE_RANK
