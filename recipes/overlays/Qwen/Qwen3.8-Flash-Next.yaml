# Overlay for Qwen/Qwen3.8-Flash-Next on Huawei Ascend.
# Verified on two Atlas A2 servers (800T A2 with 8 x Ascend 910B3, 800I A2 with
# 8 x Ascend 910B4-1; 64 GB HBM per NPU), vLLM Ascend v0.32.0rc1.
# 1P1D disaggregation, MooncakeConnectorV2 p2p KV transfer (no KV pool), MTP on both pools:
#   prefill  TP4 x PP2 x DP1 x EP4         (node 1)
#   decode   TP2 x DP4 x EP8               (node 2)
# Topology: one prefill node and one decode node, 8 NPUs each.
meta:
  hardware:
    ascend_910b: verified
    ascend_910c: supported
    ascend_950dt: supported

strategy_hardware:
  single_node_tp:
    npu: unsupported
    ascend_910c: supported
    ascend_950dt: supported
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  single_node_dpa_tp:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_dp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910b: supported

features:
  tool_calling:
    hardware_overrides:
      ascend_910b:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - qwen3_xml
      ascend_950dt:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - 'qwen3_xml'
      ascend_910c:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - 'qwen3_xml'
  spec_decoding:
    hardware_overrides:
      ascend_910b:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
      ascend_950dt:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
      ascend_910c:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'

variants:
  ascend_w4a8:
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8
    label: W4A8 (Ascend A2/A3)
    precision: int4
    # 180.9 GiB on disk = 194.3 GB, x 1.2 headroom (same convention as the DeepSeek recipes)
    vram_minimum_gb: 234
    description: >-
      A2 and A3 use the same ModelSlim W4A8 checkpoint (181 GiB, 48 shards). In the
      two-node A2 1P1D deployment, Engram keeps the 51B N-gram embedding table in
      host memory on both nodes so the weights fit on eight 64 GB NPUs per node.
    supported_hardware:
      - ascend_910b
      - ascend_910c
    tp: {ascend_910c: 8}
    min_vllm_version: 0.32.0
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_serve_command: vllm serve
        # Engram keeps ~95 GiB in /dev/shm on the decode node.
        docker_shm_size: 128g
        install:
          pip: false
        extra_args:
          - '--host'
          - 0.0.0.0
          - '--served-model-name'
          - qwen38-flash-next-a2-pd
          - '--trust-remote-code'
          - '--quantization'
          - ascend
          - '--max-model-len'
          - '141312'
          - '--max-num-seqs'
          - '32'
          - '--max-num-batched-tokens'
          - '8192'
          - '--gpu-memory-utilization'
          - '0.90'
          - '--enable-prefix-caching'
          - '--mamba-cache-mode'
          - align
          - '--async-scheduling'
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
          VLLM_ENGINE_READY_TIMEOUT_S: '4800'
          HCCL_CONNECT_TIMEOUT: '600'
          ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
          PYTHONUNBUFFERED: '1'
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
        extra_args:
          - '--host'
          - '0.0.0.0'
          - '--port'
          - '8088'
          - '--served-model-name'
          - 'qwen3.8-flash-next'
          - '--trust-remote-code'
          - '--quantization'
          - 'ascend'
          - '--data-parallel-size'
          - '1'
          - '--enable-expert-parallel'
          - '--max-model-len'
          - '131072'
          - '--max-num-seqs'
          - '8'
          - '--max-num-batched-tokens'
          - '4096'
          - '--gpu-memory-utilization'
          - '0.93'
          - '--enable-prefix-caching'
          - '--mamba-cache-mode'
          - 'align'
          - '--async-scheduling'
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":false}'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          VLLM_ENGINE_READY_TIMEOUT_S: '4800'

  # These inherited variants are also selectable on Huawei in the base recipe.
  # Give them the platform installer. The PD presets below target W4A8 only.
  fp8:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false
  bf16:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false

  ascend_a5_w4a8_mxfp:
    label: W4A8-MXFP (ASCEND 950DT)
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8-mxfp
    precision: mxfp4
    # 48 ModelScope weight shards total 193.26 GB, with 20% headroom.
    vram_minimum_gb: 232
    supported_hardware: [ascend_950dt]
    min_vllm_version: 0.32.0
    tp: 4
    extra_args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8087'
      - '--served-model-name'
      - 'qwen3.8-flash-next-950-dt'
      - '--trust-remote-code'
      - '--quantization'
      - 'ascend'
      - '--data-parallel-size'
      - '1'
      - '--max-model-len'
      - '141312'
      - '--max-num-seqs'
      - '32'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--enable-prefix-caching'
      - '--async-scheduling'
      - '--enable-expert-parallel'
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":false}'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false

presets:
  ascend_a2_memcache_pool:
    label: A2 · Memcache three-tier PD
    hardware: ascend_910b
    strategy: pd_cluster
    variants:
      - ascend_w4a8
    workload: Prefill/decode with external prefix reuse and SSD offload
    description: One Prefill and one Decode host with independent SSDs. Follow the versioned deployment steps to create
      a pool or reuse a running one.
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      kv_offload: vllm-ascend/memcache
      frontend: python
      features:
        tool_calling: false
        reasoning: false
        spec_decoding: true
    source:
      label: Qwen3.8-Flash-Next, A2 pooled serving
      href: https://docs.vllm.ai/projects/ascend/en/v0.32.0rc/tutorials/models/Qwen3.8-Flash-Next.html#55-pd-separation-with-memcache-three-tier-kv-cache-pool
      key: qwen3.8-flash-next-a2-pool
      revision: 355fb06e9a616e563a7643fa8fa3db2b03dd69d3
    image:
      vllm: quay.io/ascend/vllm-ascend:v0.32.0rc1-a2
    roles:
      prefill:
        nodes: 1
        parallelism: tep
        tp: 4
        pp: 2
      decode:
        nodes: 1
        parallelism: dep
        tp: 2
        pp: 1
    deployment:
      ascend_version: v0.32.0rc
      tutorial: https://docs.vllm.ai/projects/ascend/en/v0.32.0rc/tutorials/models/Qwen3.8-Flash-Next.html#55-pd-separation-with-memcache-three-tier-kv-cache-pool
      hosts: [p, d]
      containers:
        p:
          host: p
          docker_args: &a2_memcache_pool_docker [--net=host, --privileged=true, --shm-size=128g, --device, /dev/davinci0, --device,
            /dev/davinci1, --device, /dev/davinci2, --device, /dev/davinci3, --device, /dev/davinci4, --device, /dev/davinci5,
            --device, /dev/davinci6, --device, /dev/davinci7, --device, /dev/davinci_manager, --device, /dev/devmm_svm,
            --device, /dev/hisi_hdc, -v, '/usr/local/dcmi:/usr/local/dcmi', -v, '/usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool',
            -v, '/usr/local/bin/npu-smi:/usr/local/bin/npu-smi', -v, '/usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/',
            -v, '/usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info', -v, '/etc/ascend_install.info:/etc/ascend_install.info',
            -v, '/etc/hccn.conf:/etc/hccn.conf:ro', -v, '/root/.cache:/root/.cache']
        d:
          host: d
          docker_args: *a2_memcache_pool_docker
      placements:
        - id: control
          role: meta
          container: p
          mode: new
        - id: prefill
          role: prefill
          container: p
          devices: [0, 1, 2, 3, 4, 5, 6, 7]
          launch:
            argv:
              - vllm
              - serve
              - '{{weights_dir}}'
              - --host
              - 0.0.0.0
              - --port
              - '25568'
              - --served-model-name
              - qwen38-flash-next-a2-pd
              - --trust-remote-code
              - --quantization
              - ascend
              - --tensor-parallel-size
              - '4'
              - --pipeline-parallel-size
              - '2'
              - --data-parallel-size
              - '1'
              - --max-model-len
              - '141312'
              - --max-num-seqs
              - '32'
              - --max-num-batched-tokens
              - '8192'
              - --gpu-memory-utilization
              - '0.90'
              - --enable-prefix-caching
              - --async-scheduling
              - --enable-expert-parallel
              - --mamba-cache-mode
              - align
              - --mamba-ssm-cache-dtype
              - bfloat16
              - --engram-config
              - '{"cpu_offload":true,"dp_shared_memory":false}'
              - --enforce-eager
              - --additional-config
              - '{"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
              - --speculative-config
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
            env:
              VLLM_USE_V2_MODEL_RUNNER: '1'
              VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
              VLLM_ENGINE_READY_TIMEOUT_S: '4800'
              VLLM_HOST_IP: '{{hosts.p.address}}'
              HCCL_IF_IP: '{{hosts.p.address}}'
              GLOO_SOCKET_IFNAME: '{{nic}}'
              TP_SOCKET_IFNAME: '{{nic}}'
              HCCL_SOCKET_IFNAME: '{{nic}}'
              no_proxy: localhost,127.0.0.1,{{hosts.p.address}},{{hosts.d.address}}
              NO_PROXY: localhost,127.0.0.1,{{hosts.p.address}},{{hosts.d.address}}
              VLLM_USE_MODELSCOPE: 'True'
              ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
              HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
              HCCL_BUFFSIZE: '8192'
              PYTHONHASHSEED: '0'
              MMC_LOCAL_CONFIG_PATH: '{{config_dir}}/{{prefill_config}}'
              HCCL_INTRA_ROCE_ENABLE: '1'
            setup: |-
              set -e
              if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then source /usr/local/Ascend/ascend-toolkit/set_env.sh; fi
              if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then source /usr/local/Ascend/nnal/atb/set_env.sh; fi
              unset ftp_proxy FTP_PROXY https_proxy HTTPS_PROXY http_proxy HTTP_PROXY
              unset VLLM_PP_LAYER_PARTITION
              unset ASCEND_ENABLE_USE_FABRIC_MEM ASCEND_GLOBAL_RESOURCE_CONFIG ASCEND_LOCAL_COMM_RES
              libs=$(python -c 'import importlib.util as u, pathlib, sysconfig; print(":".join([str(pathlib.Path(next(iter(u.find_spec(p).submodule_search_locations)), "lib")) for p in ("memcache_hybrid","memfabric_hybrid")]+[sysconfig.get_config_var("LIBDIR"),next(iter(u.find_spec("mooncake").submodule_search_locations))]))')
              export LD_LIBRARY_PATH="$libs:${LD_LIBRARY_PATH:-}"
            transfer:
              kv_connector: MooncakeConnectorV2
              kv_role: kv_producer
              kv_port: 32600
              kv_connector_extra_config:
                prefill:
                  dp_size: 1
                  tp_size: 4
                  pp_size: 2
                decode:
                  dp_size: 4
                  tp_size: 2
            store:
              lookup_rpc_port: qwen38_pool_p
        - id: decode
          role: decode
          container: d
          devices: [0, 1, 2, 3, 4, 5, 6, 7]
          launch:
            argv:
              - vllm
              - serve
              - '{{weights_dir}}'
              - --host
              - 0.0.0.0
              - --port
              - '25569'
              - --served-model-name
              - qwen38-flash-next-a2-pd
              - --trust-remote-code
              - --quantization
              - ascend
              - --tensor-parallel-size
              - '2'
              - --data-parallel-size
              - '4'
              - --max-model-len
              - '141312'
              - --max-num-seqs
              - '32'
              - --max-num-batched-tokens
              - '8192'
              - --gpu-memory-utilization
              - '0.90'
              - --enable-prefix-caching
              - --async-scheduling
              - --enable-expert-parallel
              - --mamba-cache-mode
              - align
              - --mamba-ssm-cache-dtype
              - bfloat16
              - --engram-config
              - '{"cpu_offload":true,"dp_shared_memory":true}'
              - --compilation-config
              - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
              - --additional-config
              - '{"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
              - --speculative-config
              - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
            env:
              VLLM_USE_V2_MODEL_RUNNER: '1'
              VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
              VLLM_ENGINE_READY_TIMEOUT_S: '4800'
              VLLM_HOST_IP: '{{hosts.d.address}}'
              HCCL_IF_IP: '{{hosts.d.address}}'
              GLOO_SOCKET_IFNAME: '{{nic}}'
              TP_SOCKET_IFNAME: '{{nic}}'
              HCCL_SOCKET_IFNAME: '{{nic}}'
              no_proxy: localhost,127.0.0.1,{{hosts.p.address}},{{hosts.d.address}}
              NO_PROXY: localhost,127.0.0.1,{{hosts.p.address}},{{hosts.d.address}}
              VLLM_USE_MODELSCOPE: 'True'
              ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
              HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599
              HCCL_BUFFSIZE: '512'
              PYTHONHASHSEED: '0'
              MMC_LOCAL_CONFIG_PATH: '{{config_dir}}/{{decode_config}}'
              HCCL_INTRA_ROCE_ENABLE: '1'
            setup: |-
              set -e
              if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then source /usr/local/Ascend/ascend-toolkit/set_env.sh; fi
              if [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then source /usr/local/Ascend/nnal/atb/set_env.sh; fi
              unset ftp_proxy FTP_PROXY https_proxy HTTPS_PROXY http_proxy HTTP_PROXY
              unset VLLM_PP_LAYER_PARTITION
              unset ASCEND_ENABLE_USE_FABRIC_MEM ASCEND_GLOBAL_RESOURCE_CONFIG ASCEND_LOCAL_COMM_RES
              libs=$(python -c 'import importlib.util as u, pathlib, sysconfig; print(":".join([str(pathlib.Path(next(iter(u.find_spec(p).submodule_search_locations)), "lib")) for p in ("memcache_hybrid","memfabric_hybrid")]+[sysconfig.get_config_var("LIBDIR"),next(iter(u.find_spec("mooncake").submodule_search_locations))]))')
              export LD_LIBRARY_PATH="$libs:${LD_LIBRARY_PATH:-}"
            transfer:
              kv_connector: MooncakeConnectorV2
              kv_role: kv_consumer
              kv_port: 32700
              kv_connector_extra_config:
                prefill:
                  dp_size: 1
                  tp_size: 4
                  pp_size: 2
                decode:
                  dp_size: 4
                  tp_size: 2
            store:
              lookup_rpc_port: qwen38_pool_d
        - id: proxy
          role: proxy
          container: p
          launch:
            argv:
              - python3
              - /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
              - --host
              - 0.0.0.0
              - --port
              - '25570'
              - --prefiller-hosts
              - '{{hosts.p.address}}'
              - --prefiller-ports
              - '25568'
              - --decoder-hosts
              - '{{hosts.d.address}}'
              - --decoder-ports
              - '25569'
            env:
              NO_PROXY: localhost,127.0.0.1,{{hosts.p.address}},{{hosts.d.address}}
              no_proxy: localhost,127.0.0.1,{{hosts.p.address}},{{hosts.d.address}}
            setup: |-
              set -e
              test -r /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
      constants:
        prefill_config: mmc-local.conf
        decode_config: mmc-local.conf
      defaults:
        hosts.p.protocol: device_rdma
        hosts.p.local_services: 8
        hosts.d.protocol: device_rdma
        hosts.d.local_services: 8
      steps:
        - id: hardware
          title: Confirm the selected hardware and communication environment
          stage: storage
          target: hosts
          command: npu-smi info
          check: Check npu-smi info on both hosts. A2 three-tier pooling requires host HDK 25.5.1 or later and device_rdma.
        - id: start-prefill
          title: Start Prefill
          stage: serve
          target: placement:prefill
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - endpoints
        - id: start-decode
          title: Start Decode
          stage: serve
          target: placement:decode
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - endpoints
        - id: role-apis
          title: Check model API readiness
          stage: serve
          target: placement:prefill
          command: |-
            set -e
            curl --noproxy '*' --fail --silent http://{{hosts.p.address}}:25568/v1/models
            curl --noproxy '*' --fail --silent http://{{hosts.d.address}}:25569/v1/models
          check: Every published P/D endpoint lists the selected served model; confirm the expected role, device and
            rank layout in its log.
          depends_on:
            - start-prefill
            - start-decode
        - id: start-proxy
          title: Start the Ascend HTTP proxy
          stage: serve
          target: placement:proxy
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - role-apis
        - id: service
          title: Send a request through the proxy
          stage: serve
          target: placement:proxy
          command: 'curl --fail http://127.0.0.1:25570/v1/chat/completions -H ''Content-Type: application/json'' -d
            ''{"model":"qwen38-flash-next-a2-pd","messages":[{"role":"user","content":"Hello!"}],"temperature":0,"max_tokens":32}'''
          check: Confirm the response and P-to-D transfer in the model logs before checking external pool reuse.
          depends_on:
            - start-proxy
        - id: shared-prefix
          title: Warm the pool and replay a shared prefix
          stage: serve
          target: placement:proxy
          command: |-
            python - 25570 qwen38-flash-next-a2-pd <<'PY'
            import json, sys, urllib.request
            port, model = sys.argv[1:]
            prefix = "The KV cache stores repeated prefixes so later inference can reuse model state. " * 256
            for question in ("Summarize the passage.", "Give the purpose in one sentence."):
                body = {"model":model, "messages":[{"role":"user","content":prefix + question}], "temperature":0,"max_tokens":32}
                request = urllib.request.Request("http://127.0.0.1:"+port+"/v1/chat/completions",
                                                 json.dumps(body).encode(), {"Content-Type":"application/json"})
                with urllib.request.urlopen(request, timeout=300) as response:
