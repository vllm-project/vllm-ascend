        - id: hardware
          title: Confirm the selected hardware and communication environment
          stage: storage
          target: hosts
          command: npu-smi info
          check: Verify the A3 HCCS network and LingQu Computing Network 1.5 or later for device_sdma. The serving
            container must expose all 16 logical devices and both dedicated cache devices. Compare usable host DRAM
            to the budget for 16 LocalServices.
          depends_on:
            - second-disk
        - id: second-disk
          title: Identify and check the second A3 device
          stage: storage
          target: hosts
          mode: new
          command: |-
            set -e
            device={{device_2}}
            test -b "$device" && test "$(stat -Lc %t:%T "$device")" != "$(stat -Lc %t:%T {{device}})"
            test "$(lsblk -nrpo NAME -- "$device" | wc -l)" -eq 1
            test -z "$(lsblk -nrpo MOUNTPOINTS -- "$device" | tr -d '[:space:]')"
            sudo blkid -p -- "$device" && { echo "Device contains a signature"; exit 1; }
            test "$?" -eq 2
          check: Confirm that this second device is dedicated, blank and unmounted. Each SSD is mapped once in this
            single physical container.
        - id: start-prefill
          title: Start Prefill
          stage: serve
          target: placement:prefill
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - endpoints
        - id: start-decode
          title: Start Decode
          stage: serve
          target: placement:decode
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - endpoints
        - id: role-apis
          title: Check model API readiness
          stage: serve
          target: placement:prefill
          command: |-
            set -e
            curl --noproxy '*' --fail --silent http://{{hosts.p.address}}:25568/v1/models
            curl --noproxy '*' --fail --silent http://{{hosts.p.address}}:25569/v1/models
          check: Every published P/D endpoint lists the selected served model; confirm the expected role, device and
            rank layout in its log.
          depends_on:
            - start-prefill
            - start-decode
        - id: start-proxy
          title: Start the Ascend HTTP proxy
          stage: serve
          target: placement:proxy
          action: launch
          check: Keep this process running in its own terminal.
          depends_on:
            - role-apis
        - id: service
          title: Send a request through the proxy
          stage: serve
          target: placement:proxy
          command: 'curl --fail http://127.0.0.1:25570/v1/chat/completions -H ''Content-Type: application/json'' -d
            ''{"model":"qwen38-flash-next-a3-pd","messages":[{"role":"user","content":"Hello!"}],"temperature":0,"max_tokens":32}'''
          check: Confirm the response and P-to-D transfer in the model logs before checking external pool reuse.
          depends_on:
            - start-proxy
        - id: shared-prefix
          title: Warm the pool and replay a shared prefix
          stage: serve
          target: placement:proxy
          command: |-
            python - 25570 qwen38-flash-next-a3-pd <<'PY'
            import json, sys, urllib.request
            port, model = sys.argv[1:]
            prefix = "The KV cache stores repeated prefixes so later inference can reuse model state. " * 256
            for question in ("Summarize the passage.", "Give the purpose in one sentence."):
                body = {"model":model, "messages":[{"role":"user","content":prefix + question}], "temperature":0,"max_tokens":32}
                request = urllib.request.Request("http://127.0.0.1:"+port+"/v1/chat/completions",
                                                 json.dumps(body).encode(), {"Content-Type":"application/json"})
                with urllib.request.urlopen(request, timeout=300) as response:
                    print(json.load(response)["choices"][0]["message"]["content"])
            PY
          check: Correlate the second request with backend lookup/get evidence on Prefill. Local prefix hits alone
            do not establish external reuse.
          depends_on:
            - service
