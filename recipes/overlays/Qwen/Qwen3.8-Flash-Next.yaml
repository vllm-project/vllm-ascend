# Overlay for Qwen/Qwen3.8-Flash-Next on Huawei Ascend.
# Deployment commands follow the Qwen3.8-Flash-Next tutorial.
meta:
  hardware:
    ascend_910b: supported
    ascend_910c: supported
    ascend_950dt: supported

strategy_hardware:
  single_node_tp:
    npu: unsupported
    ascend_910c: supported
    ascend_950dt: supported
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  single_node_dpa_tp:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_dp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910b: supported
    # Each PD pool in a preset owns at least one node. The A3 and 950DT
    # examples split a single host between pools (see Ascend deployment).

features:
  tool_calling:
    hardware_overrides:
      ascend_950dt:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - 'qwen3_xml'
      ascend_910c:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - 'qwen3_xml'
      ascend_910b:
        args:
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - qwen3_xml
  spec_decoding:
    hardware_overrides:
      ascend_950dt:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
      ascend_910c:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
      ascend_910b:
        args:
          - '--speculative-config'
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'

variants:
  # These inherited variants are also selectable on Huawei in the base recipe.
  # Give them the platform installer. The PD presets below target W4A8 only.
  fp8:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false
  bf16:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false
  ascend_w4a8:
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8
    label: W4A8 (Ascend A2)
    precision: int4
    # 180.9 GiB on disk = 194.3 GB, x 1.2 headroom (same convention as the DeepSeek recipes)
    vram_minimum_gb: 234
    description: >-
      ModelSlim W4A8 checkpoint (181 GiB, 48 shards) for one two-node 1P1D pool on A2.
      Engram keeps the 51B N-gram embedding table in host memory on both pools, so the
      weights fit in 8 x 64 GB per node. Requires --quantization ascend.
    supported_hardware:
      - ascend_910b
    min_vllm_version: 0.32.0rc1
    extra_args:
      - '--host'
      - 0.0.0.0
      - '--served-model-name'
      - qwen38-flash-next-a2-pd
      - '--trust-remote-code'
      - '--quantization'
      - ascend
      - '--max-model-len'
      - '141312'
      - '--max-num-seqs'
      - '32'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--enable-prefix-caching'
      - '--mamba-cache-mode'
      - align
      - '--mamba-ssm-cache-dtype'
      - bfloat16
      - '--async-scheduling'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      VLLM_ENGINE_READY_TIMEOUT_S: '4800'
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
    install:
      docker:
        note: Use the official Ascend image.
    hardware_overrides:
      ascend_910b:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1
        docker_serve_command: vllm serve
        # Engram keeps ~95 GiB in /dev/shm on the decode node.
        docker_shm_size: 128g
        install:
          pip: false

  ascend_a3_w4a8:
    label: W4A8 (ASCEND A3)
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8
    precision: int4
    # Same W4A8 checkpoint estimate as the A2 variant.
    vram_minimum_gb: 234
    supported_hardware: [ascend_910c]
    min_vllm_version: 0.32.0rc1
    tp: 8
    extra_args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8088'
      - '--served-model-name'
      - 'qwen3.8-flash-next'
      - '--trust-remote-code'
      - '--quantization'
      - 'ascend'
      - '--data-parallel-size'
      - '1'
      - '--enable-expert-parallel'
      - '--max-model-len'
      - '131072'
      - '--max-num-seqs'
      - '8'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.93'
      - '--enable-prefix-caching'
      - '--mamba-cache-mode'
      - 'align'
      - '--async-scheduling'
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":false}'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_ENGINE_READY_TIMEOUT_S: '4800'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        docker_serve_command: vllm serve
        docker_shm_size: 128g
        install:
          pip: false

  ascend_a5_w4a8_mxfp:
    label: W4A8-MXFP (ASCEND 950DT)
    model_id: Eco-Tech/Qwen3.8-Flash-Next-w4a8-mxfp
    precision: mxfp4
    # 48 ModelScope weight shards total 193.26 GB, with the A2 estimate's 20% headroom.
    vram_minimum_gb: 232
    supported_hardware: [ascend_950dt]
    min_vllm_version: 0.32.0rc1
    tp: 4
    extra_args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8087'
      - '--served-model-name'
      - 'qwen3.8-flash-next-950-dt'
      - '--trust-remote-code'
      - '--quantization'
      - 'ascend'
      - '--data-parallel-size'
      - '1'
      - '--max-model-len'
      - '141312'
      - '--max-num-seqs'
      - '32'
      - '--max-num-batched-tokens'
      - '4096'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--enable-prefix-caching'
      - '--async-scheduling'
      - '--enable-expert-parallel'
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":false}'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
        docker_shm_size: 500g
        install:
          pip: false

presets:
  a3_single_node:
    label: A3 single service, TP8
    hardware: ascend_910c
    strategy: single_node_tp
    variants: [ascend_a3_w4a8]
    default: true
    select:
      frontend: python
    env:
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7

  a5_single_node:
    label: 950DT single service, TP4
    hardware: ascend_950dt
    strategy: single_node_tp
    variants: [ascend_a5_w4a8_mxfp]
    default: true
    select:
      frontend: python
    env:
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3
      VLLM_ENGINE_READY_TIMEOUT_S: '4800'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '1024'
      HCCL_NPU_SOCKET_PORT_RANGE: auto

  a3_pd_prefill:
    label: PD / Prefill worker (A3)
    source:
      label: Qwen3.8-Flash-Next deployment tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md
      revision: a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee
    runbook: >-
      Run Prefill on devices 0–7 and select the same workload point for the
      A3 Decode worker on devices 8–15 of this host. Start the proxy
      for that workload after both roles respond at `/v1/models`.
    hardware: ascend_910c
    strategy: single_node_tp
    variants:
      - ascend_a3_w4a8
    select:
      frontend: python
      features:
        tool_calling: false
        reasoning: false
        spec_decoding: true
    tp: 2
    args:
      - '--port'
      - '25568'
      - '--served-model-name'
      - qwen38-flash-next-a3-pd
      - '--max-num-seqs'
      - '32'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--mamba-ssm-cache-dtype'
      - bfloat16
      - '--enforce-eager'
      - '--additional-config'
      - '{"enable_shared_expert_dp":true,"enable_flashcomm1":true,"enable_prefill_mc2":true,"enable_fused_mc2":0,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
    remove_args:
      - '--compilation-config'
    json_args:
      '--speculative-config':
        enforce_eager: true
    env:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      VLLM_HOST_IP: $LOCAL_SERVICE_IP
      HCCL_IF_IP: $LOCAL_SERVICE_IP
      GLOO_SOCKET_IFNAME: $SERVICE_NIC
      TP_SOCKET_IFNAME: $SERVICE_NIC
      HCCL_SOCKET_IFNAME: $SERVICE_NIC
      no_proxy: localhost,127.0.0.1,$LOCAL_SERVICE_IP
      NO_PROXY: localhost,127.0.0.1,$LOCAL_SERVICE_IP
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
      HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
      HCCL_BUFFSIZE: '8192'
    points:
      basic:
        label: Basic PD
        default: true
        args:
          - '--pipeline-parallel-size'
          - '4'
          - '--max-model-len'
          - '262144'
          - '--kv-transfer-config'
          - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":32600,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}'
      pooling:
        label: MemCache three-tier pooling
        args:
          - '--pipeline-parallel-size'
          - '2'
          - '--data-parallel-size'
          - '2'
          - '--max-model-len'
          - '262144'
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--kv-transfer-config'
          - '{"kv_connector":"MultiConnector","kv_role":"kv_producer","kv_connector_extra_config":{"connectors":[{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":32600,"kv_connector_extra_config":{"prefill":{"dp_size":2,"tp_size":2,"pp_size":2},"decode":{"dp_size":4,"tp_size":2}}},{"kv_connector":"AscendStoreConnector","kv_role":"kv_producer","kv_connector_extra_config":{"backend":"memcache","lookup_rpc_port":"qwen38_pool_p","use_layerwise":false}}]}}'
        env:
          PYTHONHASHSEED: '0'
          MMC_LOCAL_CONFIG_PATH: ${MEMCACHE_CONFIG_DIR}/mmc-local.conf
          ACL_OP_INIT_MODE: '1'
          ASCEND_ENABLE_USE_FABRIC_MEM: '1'
      long_context:
        label: Long context (1M)
        args:
          - '--pipeline-parallel-size'
          - '4'
          - '--max-model-len'
          - '1010000'
          - '--hf-overrides'
          - '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
          - '--kv-transfer-config'
          - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":32600,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}'
        env:
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  a3_pd_decode:
    label: PD / Decode worker (A3)
    source:
      label: Qwen3.8-Flash-Next deployment tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md
      revision: a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee
    runbook: >-
      Run Decode on devices 8–15 and select the same workload point for the
      A3 Prefill worker on devices 0–7 of this host. Start the proxy
      for that workload after both roles respond at `/v1/models`.
    hardware: ascend_910c
    strategy: single_node_tp
    variants:
      - ascend_a3_w4a8
    select:
      frontend: python
      features:
        tool_calling: false
        reasoning: false
        spec_decoding: true
    tp: 2
    args:
      - '--port'
      - '25569'
      - '--served-model-name'
      - qwen38-flash-next-a3-pd
      - '--data-parallel-size'
      - '4'
      - '--max-num-seqs'
      - '32'
      - '--max-num-batched-tokens'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.90'
      - '--mamba-ssm-cache-dtype'
      - bfloat16
      - '--engram-config'
      - '{"cpu_offload":true,"dp_shared_memory":true}'
      - '--additional-config'
      - '{"enable_flashcomm1":true,"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true},"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
    json_args:
      '--speculative-config':
        enforce_eager: false
    env:
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
      VLLM_HOST_IP: $LOCAL_SERVICE_IP
      HCCL_IF_IP: $LOCAL_SERVICE_IP
      GLOO_SOCKET_IFNAME: $SERVICE_NIC
      TP_SOCKET_IFNAME: $SERVICE_NIC
      HCCL_SOCKET_IFNAME: $SERVICE_NIC
      no_proxy: localhost,127.0.0.1,$LOCAL_SERVICE_IP
      NO_PROXY: localhost,127.0.0.1,$LOCAL_SERVICE_IP
      ASCEND_RT_VISIBLE_DEVICES: 8,9,10,11,12,13,14,15
      HCCL_NPU_SOCKET_PORT_RANGE: 61500-61599
      HCCL_BUFFSIZE: '512'
    points:
      basic:
        label: Basic PD
        default: true
        args:
          - '--max-model-len'
          - '262144'
          - '--kv-transfer-config'
          - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":32700,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}'
      pooling:
        label: MemCache three-tier pooling
        args:
          - '--max-model-len'
          - '262144'
          - '--kv-transfer-config'
          - '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":32700,"kv_connector_extra_config":{"prefill":{"dp_size":2,"tp_size":2,"pp_size":2},"decode":{"dp_size":4,"tp_size":2}}},{"kv_connector":"AscendStoreConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"backend":"memcache","lookup_rpc_port":"qwen38_pool_d","use_layerwise":false}}]}}'
        env:
          PYTHONHASHSEED: '0'
          MMC_LOCAL_CONFIG_PATH: ${MEMCACHE_CONFIG_DIR}/mmc-local.conf
          ACL_OP_INIT_MODE: '1'
          ASCEND_ENABLE_USE_FABRIC_MEM: '1'
      long_context:
        label: Long context (1M)
        args:
          - '--max-model-len'
          - '1010000'
          - '--hf-overrides'
          - '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
          - '--kv-transfer-config'
          - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":32700,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}'
        env:
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  a5_pd_prefill:
    label: PD / Prefill worker (950DT)
    source:
      label: Qwen3.8-Flash-Next deployment tutorial
      href: https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md
      revision: a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee
    runbook: >-
      Run Prefill on devices 0–3 and select the same workload point for the
      950DT Decode worker on devices 4–7 of this host. Start the proxy
      for that workload after both roles respond at `/v1/models`.
    hardware: ascend_950dt
    strategy: single_node_tp
    variants:
      - ascend_a5_w4a8_mxfp
    select:
      frontend: python
      features:
        tool_calling: false
        reasoning: false
        spec_decoding: true
    args:
      - '--compilation-config'
      - '{"cudagraph_mode":"NONE"}'
    env:
      ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3
      HCCL_NPU_SOCKET_PORT_RANGE: 61400-61499
    points:
      basic:
        label: Basic PD
        default: true
        tp: 2
        args:
          - '--api-server-count'
          - '1'
          - '--port'
          - '8088'
          - '--served-model-name'
          - qwen38-flash-next-950-dt-pd
          - '--data-parallel-size'
          - '2'
          - '--data-parallel-address'
          - $LOCAL_SERVICE_IP
          - '--data-parallel-rpc-port'
          - '13388'
          - '--max-model-len'
          - '143360'
          - '--max-num-seqs'
          - '64'
          - '--engram-config'
          - '{"cpu_offload":true,"dp_shared_memory":true}'
          - '--mamba-cache-mode'
          - align
          - '--mamba-ssm-cache-dtype'
          - bfloat16
          - '--additional-config'
          - '{"enable_cpu_binding":true,"enable_shared_expert_dp":true,"enable_fused_mc2":0,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":false,"enable_super_kernel":false}}'
          - '--kv-transfer-config'
          - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":30000,"kv_connector_extra_config":{"prefill":{"dp_size":2,"tp_size":2},"decode":{"dp_size":2,"tp_size":2}}}'
        json_args:
          '--speculative-config':
            enforce_eager: null
        env:
          VLLM_HOST_IP: $LOCAL_SERVICE_IP
          HCCL_IF_IP: $LOCAL_SERVICE_IP
          GLOO_SOCKET_IFNAME: $SERVICE_NIC
          TP_SOCKET_IFNAME: $SERVICE_NIC
          HCCL_SOCKET_IFNAME: $SERVICE_NIC
          VLLM_VERSION: 0.32.0
          VLLM_USE_V1: '1'
          VLLM_RPC_TIMEOUT: '3600000'
          HCCL_EXEC_TIMEOUT: '204'
          HCCL_CONNECT_TIMEOUT: '120'
          VLLM_ASCEND_ENABLE_MLAPO: '1'
          VLLM_ENGINE_READY_TIMEOUT_S: '4800'
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          TASK_QUEUE_ENABLE: '1'
          HCCL_BUFFSIZE: '8192'
          HCCL_OP_EXPANSION_MODE: AIV
          ASCEND_BUFFER_POOL: '0:0'
          HCCL_IF_BASE_PORT: '62000'
          no_proxy: localhost,127.0.0.1,$LOCAL_SERVICE_IP
          NO_PROXY: localhost,127.0.0.1,$LOCAL_SERVICE_IP
      pooling:
        label: MemCache three-tier pooling
        tp: 2
        args:
          - '--enable-auto-tool-choice'
          - '--reasoning-parser'
          - qwen3
          - '--port'
          - '8247'
          - '--served-model-name'
          - qwen38-megamoe-sp-pd
