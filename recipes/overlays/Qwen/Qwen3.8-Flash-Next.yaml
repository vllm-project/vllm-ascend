          scope: host
          type: device
          label: Second dedicated host cache device
        cache_device_2:
          scope: host
          type: device
          label: Second block device inside the container
          default: /dev/recipe-cache1
      devices:
        - source: '{{device_2}}'
          target: '{{cache_device_2}}'
