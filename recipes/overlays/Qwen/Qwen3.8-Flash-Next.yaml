guide_sections:
  ascend: |
    ### Ascend deployment

    #### Single-host PD configurations

    A3 uses devices 0–7 for Prefill and 8–15 for Decode with 128g of container shared memory.
    950DT uses devices 0–3 for Prefill and 4–7 for Decode with 500g of container shared memory.
    The PD presets use the W4A8 checkpoints below. FP8 and BF16 have no
    documented Ascend PD configuration here. Select hardware and variant together:

    - [A2 W4A8 PD](?hardware=ascend_910b&variant=ascend_w4a8&strategy=pd_cluster&preset=ascend_a2_w4a8_pd)
    - [A3 W4A8 Prefill](?hardware=ascend_910c&variant=ascend_a3_w4a8&strategy=single_node_tp&preset=a3_pd_prefill) and [Decode](?hardware=ascend_910c&variant=ascend_a3_w4a8&strategy=single_node_tp&preset=a3_pd_decode)
    - [950DT W4A8-MXFP Prefill](?hardware=ascend_950dt&variant=ascend_a5_w4a8_mxfp&strategy=single_node_tp&preset=a5_pd_prefill) and [Decode](?hardware=ascend_950dt&variant=ascend_a5_w4a8_mxfp&strategy=single_node_tp&preset=a5_pd_decode)

    For shared-host PD,
    choose the Prefill worker and Decode worker presets under Tensor Parallel.
    Set the same workload point on both. Each preset starts one role. The A2 preset runs each role on a dedicated host.
    The hardware tabs below include Docker setup, role commands, proxy and request checks. Run the three-tier storage setup before
    starting either role for pooling.

    | Procedure | A3 Prefill | A3 Decode | 950DT Prefill | 950DT Decode |
    | --- | --- | --- | --- | --- |
    | [Basic PD](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#52-basic-pd-separation-deployment) | TP2 PP4 DP1 (EP2) | TP2 DP4 (EP8) | TP2 DP2 (EP4) | TP2 DP2 (EP4) |
    | [Image-and-text 10K](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#53-image-and-text-10k-pd-separation-deployment) | TP4 PP2 DP1 (EP4) | TP2 DP4 (EP8) | TP2 PP2 DP1 (EP2) | TP2 DP2 (EP4) |
    | [Long context](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#54-long-context-pd-separation-deployment) | TP2 PP4 DP1 (EP2) | TP2 DP4 (EP8) | TP4 DP1 (EP4) | TP4 DP1 (EP4) |
    | [MemCache three-tier pooling](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#55-pd-separation-with-memcache-three-tier-kv-cache-pool) | TP2 PP2 DP2 (EP4) | TP2 DP4 (EP8) | TP2 DP2 (EP4) | TP2 DP2 (EP4) |

    The 950DT Basic PD presets use the tutorial's `VLLM_VERSION=0.32.0` override with the
    `v0.32.0rc1-a5` image. If you switch images, unset this override so vLLM Ascend
    detects the installed vLLM version.

    For basic, image or long-context serving, prepare the hardware-specific container
    from Section 4.1. Set `LOCAL_SERVICE_IP` and `SERVICE_NIC` to the service address
    and interface. In each role shell, initialize CANN/ATB, unset proxy variables
    and any inherited `VLLM_PP_LAYER_PARTITION`, and add Mooncake to the library path:

    ```bash
    export LD_LIBRARY_PATH="$(python -c 'import mooncake; print(next(iter(mooncake.__path__)))'):${LD_LIBRARY_PATH:-}"
    ```

    Run the two generated serve commands with their respective environments in separate
    shells inside that container. Start the proxy from the vLLM-Ascend repository
    root once both role endpoints respond at `/v1/models`.

    | Basic PD | Prefill HTTP | Decode HTTP | Proxy HTTP |
    | --- | --- | --- | --- |
    | A3 | 25568 | 25569 | 25570 |
    | 950DT | 8088 | 8092 | 8087 |

    ```bash
    # A3. For 950DT, set these ports to 8088, 8092 and 8087.
    PREFILL_PORT=25568
    DECODE_PORT=25569
    PROXY_PORT=25570
    python examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py \
        --host 0.0.0.0 --port "${PROXY_PORT}" \
        --prefiller-hosts "${LOCAL_SERVICE_IP}" --prefiller-ports "${PREFILL_PORT}" \
        --decoder-hosts "${LOCAL_SERVICE_IP}" --decoder-ports "${DECODE_PORT}"
    ```

    Use the proxy ports in the linked procedure for each workload point.
    For A3 image-and-text, use the linked Prefill and Decode scripts together.
    Decode starts four rank-specific processes with separate HTTP and KV ports.
    Register all four Decode HTTP ports with the proxy.
    Both long-context roles use YaRN and a 1,010,000-token service limit. For
    A3 pooling, both Mooncake peers declare Prefill DP2/TP2/PP2 and Decode
    DP4/TP2. Both roles enable Engram DP shared memory.

    #### Two-node A2 PD preset

    Follow [Section 4.1](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#41-docker-image-installation) on both hosts, including
    the `/etc/hccn.conf` mount and 128g of shared memory. On each host set
    `PREFILL_NODE_1` and `DECODE_NODE_1` to the service IPs and `SERVICE_NIC` to
    the interface for the local service IP. The published A2 image for this recipe
    is `quay.io/ascend/vllm-ascend:v0.32.0rc1`. Inside each prepared container,
    apply the role's generated environment and initialize the shell as in
    [Section 5.2](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#52-basic-pd-separation-deployment):

    ```bash
    unset ftp_proxy FTP_PROXY https_proxy HTTPS_PROXY http_proxy HTTP_PROXY
    unset VLLM_PP_LAYER_PARTITION
    export LD_LIBRARY_PATH="$(python -c 'import mooncake; print(next(iter(mooncake.__path__)))'):${LD_LIBRARY_PATH:-}"
    ```

    Prefill serves port 25568 (TP4 × PP2 × DP1) and Decode serves port 25569
    (TP2 × DP4). The builder explicitly renders all four Decode ranks as local.
    Both roles use three-token MTP and bfloat16 Mamba SSM cache. Once both
    endpoints respond at `/v1/models`, run the tutorial proxy on the Prefill host.
    For the generated proxy command, change the builder's default `ROUTER_PORT`
    from 30000 to 25570. The tutorial command below already uses 25570.

    ```bash
    PREFILL_HOST="<PREFILL_LOCAL_IP>"
    DECODE_HOST="<DECODE_LOCAL_IP>"

    unset ftp_proxy FTP_PROXY https_proxy HTTPS_PROXY http_proxy HTTP_PROXY
    export no_proxy="localhost,127.0.0.1,${PREFILL_HOST},${DECODE_HOST}"
    export NO_PROXY="${no_proxy}"

    python examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py \
        --host 0.0.0.0 --port 25570 \
        --prefiller-hosts "${PREFILL_HOST}" --prefiller-ports 25568 \
        --decoder-hosts "${DECODE_HOST}" --decoder-ports 25569
    ```

    #### Not covered by this page

    **MemCache three-tier pool setup.** On A3 and 950DT, the pooling presets generate the Prefill and Decode worker commands. To set up the full pool on A2, A3, or 950DT, follow [Section 4.3](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#43-docker-for-three-tier-pd-pooling) to prepare the container and mount the storage devices. Then follow the steps for your hardware in [Section 5.5](https://github.com/vllm-project/vllm-ascend/blob/a41e2ff8ba274328f9ef2ff27d15653df1d2e8ee/docs/source/tutorials/models/Qwen3.8-Flash-Next.md#55-pd-separation-with-memcache-three-tier-kv-cache-pool) to configure MemCache, start or reuse MetaService, and verify cache reuse.
