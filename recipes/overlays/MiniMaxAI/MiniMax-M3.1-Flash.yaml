      the 32-sequence limit and the node-local ports the tutorial uses.
    source:
      label: vLLM Ascend MiniMax-M3.1-Flash tutorial, single-node A3
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/MiniMax-M3.1-Flash.html
