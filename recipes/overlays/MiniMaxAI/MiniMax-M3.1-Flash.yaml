      - '--data-parallel-size'
      - '4'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '32'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--enable-chunked-prefill'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true,"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true,"weight_nz_mode":1}'
      - '--safetensors-load-strategy'
      - prefetch
    env:
      HCCL_BUFFSIZE: '1024'
      HCCL_IF_BASE_PORT: '61000'
    runbook: |
      ## Topology

      One Atlas 800I A3 host with 16 Ascend 910C (64 GB each), one `vllm serve`
      process at DP4 x TP4 x EP16. The full W8A8 checkpoint is replicated four
      times, one replica per DP rank, TP4 within a replica.

      ## Environment

      `HCCL_IF_BASE_PORT=61000` keeps this lane's HCCL ports clear of the PD
      presets, which can run on the same host. Set `HCCL_IF_IP` to this host's
      communication address when the host is multi-homed; on a single node the
