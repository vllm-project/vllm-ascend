      ## Limits

      Vision input is enabled (`--limit-mm-per-prompt` keeps one image per
      prompt). Tool calling and the MiniMax reasoning parser are on. The 133K
      context limit leaves room for a 128K prompt plus 1K generated tokens.
  ascend_a5_w8a8_mxfp8_agg:
    label: 950DT MXFP8 single node (DP2 x TP4)
