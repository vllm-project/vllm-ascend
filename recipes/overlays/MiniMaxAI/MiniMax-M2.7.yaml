    label: Ascend W8A8 QuaRot
    model_id: vllm-ascend/MiniMax-M2.7-w8a8-QuaRot
    precision: int8
    description: W8A8-QuaRot with EAGLE3 on Atlas 800I A3. The automatic Docker and Serve cards cover single-node short context.
    vram_minimum_gb: 276
    nightly_required: false
    supported_frontends: [python]
    supported_hardware:
      - ascend_910c
    extra_args:
      - --quantization
      - ascend
      - --max-model-len
      - "40690"
      - --max-num-seqs
      - "48"
      - --max-num-batched-tokens
      - "16384"
      - --gpu-memory-utilization
      - "0.85"
      - --async-scheduling
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --additional-config
      - '{"enable_cpu_binding":true,"enable_fused_mc2":1,"enable_flashcomm1":true,"weight_nz_mode":1}'
      - --speculative-config
      - '{"method":"eagle3","model":"Eco-Tech/MiniMax-M2.7-eagle-model-short","num_speculative_tokens":3,"enforce_eager":true}'
      - --served-model-name
      - MiniMax-M2.7
      - vllm-ascend/MiniMax-M2.7-w8a8-QuaRot
      - --host
      - 127.0.0.1
    extra_env:
      HCCL_OP_EXPANSION_MODE: AIV
      HCCL_BUFFSIZE: "1024"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      VLLM_USE_MODELSCOPE: "true"
      MODELSCOPE_CACHE: /root/.cache/huggingface/modelscope
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
        docker_serve_command: env --chdir=/root/.cache/huggingface/modelscope/models vllm serve
        install:
          pip: false
          docker: true
