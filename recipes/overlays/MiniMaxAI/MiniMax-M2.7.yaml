    ### 6. Verify inference and cross-host KV transfer

    Run on the Prefill host. Check the response and confirm that the Decode external-KV token counter increases.

    ```bash
    (
      : "${PD_OUT:?Load the session.env from step 1}" "${DECODE_NODE_0_IP:?Missing Decode IP}" "${GATEWAY_NODE_0_IP:?Missing gateway IP}"
      kv_metrics() {
        local rank
        for rank in 7100 7101; do
          curl --noproxy '*' -fsS --max-time 15 "http://$DECODE_NODE_0_IP:$rank/metrics" \
            -o "$PD_OUT/08-decode-$rank.$1.prom" || return
        done
      }
      curl --noproxy '*' -fsS --max-time 15 "http://$GATEWAY_NODE_0_IP:8009/healthcheck" -o "$PD_OUT/08-health.json" || exit 1
      cat "$PD_OUT/08-health.json"
      python3 -c 'import json,sys; h=json.load(open(sys.argv[1])); assert h["prefill_instances"] == h["decode_instances"] == 2, h' "$PD_OUT/08-health.json" || exit 1
      kv_metrics before || exit 1
      id="release-pd-$(date -u +%s)-$$"
      printf '%s\n' "$id" > "$PD_OUT/08-request-id.txt" || exit 1
      cat "$PD_OUT/08-request-id.txt"
      python3 - <<'PY' > "$PD_OUT/08-request.json" || exit 1
    import json
    context = 'This context is a geography reference. Tokyo is the capital of Japan.\n' * 128
    prompt = context + '\nQuestion: What is the capital of Japan? Answer in a complete sentence.\nAnswer: The capital of Japan is'
    print(json.dumps(dict(model='minimax', temperature=0, max_tokens=96, prompt=prompt)))
    PY
      curl --noproxy '*' -fsS --max-time 180 "http://$GATEWAY_NODE_0_IP:8009/v1/completions" \
        -H 'Content-Type: application/json' -H "X-Request-Id: $id" \
        --data-binary "@$PD_OUT/08-request.json" -o "$PD_OUT/08-response.json" || exit 1
      cat "$PD_OUT/08-response.json"
      python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["model"] == "minimax"; assert "tokyo" in r["choices"][0]["text"].lower(); assert r["usage"]["prompt_tokens"] > 1024' "$PD_OUT/08-response.json" || exit 1
      kv_metrics after || exit 1
      awk '/^vllm:prompt_tokens_by_source_total\{/ && /source="external_kv_transfer"/ {print FILENAME, $0}' "$PD_OUT"/08-decode-*.prom
    )
    ```

    ## Single-node A3 short context

    [Historical section 5.1](https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/MiniMax-M2.html#a3-single-node)

    ### 1. Start the release container

    Run on the A3 host. Set WEIGHTS_ROOT to the directory containing both checkpoints if it differs from /models.

    ```bash
    export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
    export MINIMAX_CONTAINER=${MINIMAX_CONTAINER:-minimax-single-a3}
    export WEIGHTS_ROOT=${WEIGHTS_ROOT:-/models}
    devices=()
    for id in {0..15}; do devices+=(--device "/dev/davinci$id"); done
    docker run -d --name "$MINIMAX_CONTAINER" --network host --ipc host \
      "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
      -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
      -v /usr/local/dcmi:/usr/local/dcmi:ro \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
      -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
      -v /etc/hccn.conf:/etc/hccn.conf:ro \
      -v "$WEIGHTS_ROOT:/models:ro" -w /models --entrypoint bash "$IMAGE" -lc 'exec sleep infinity'
    ```

    ### 2. Start MiniMax

    Enter the container and run the startup block there.

    ```bash
    docker exec -it "$MINIMAX_CONTAINER" bash
    ```

