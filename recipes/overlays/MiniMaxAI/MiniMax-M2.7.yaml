    ```bash
    python3 - <<'PY'
    import json
    from urllib.request import ProxyHandler, Request, build_opener
    prefix = "The access word for this exercise is ORCHID.\n"
    body = "".join(f"Archive entry {i:06d}: The museum opens each morning and overlooks the river.\n" for i in range(8248))
    suffix = "\nQuestion: What is the access word? Answer with the access word only.\nAnswer:"
    prompt = prefix + body + suffix
    payload = dict(model="MiniMax-M2.7", prompt=prompt, max_tokens=16, temperature=0, stop=["\n"])
    request = Request("http://127.0.0.1:8000/v1/completions", json.dumps(payload).encode())
    request.add_header("Content-Type", "application/json")
    with build_opener(ProxyHandler({})).open(request, timeout=900) as response:
        result = json.load(response)
    answer = result["choices"][0]["text"].strip()
    assert result["usage"]["prompt_tokens"] >= 131072, result["usage"]
    assert answer.casefold() == "orchid", answer
    print(result["id"], result["usage"], answer)
    PY
