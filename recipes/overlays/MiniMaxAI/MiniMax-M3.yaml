# Source: https://github.com/vllm-project/vllm/blob/c5d1d77d2bd50c985c16bc11bcacd0dabab52024/recipes/models/MiniMaxAI/MiniMax-M3.yaml
# Extracted with vllm-project/recipes@8509229176ba2d1837339ffc4cbb4f34c1bf5e66.
variants:
  ascend_bf16:
    model_id: MiniMax/MiniMax-M3
    label: BF16 (Ascend A3)
    precision: bf16
    # 427B BF16 weights are 854 GB. The params x bytes x 1.2 rule of thumb (1025)
    # would fail the single-node fit check on a 1024 GB Atlas 800 A3 node.
    vram_minimum_gb: 854
    description: Native MiniMax/MiniMax-M3 BF16 on Atlas 800 A3 (16x Ascend 910C) - tutorial layout TP8 + DP2 + EP. Single-node works, but the tutorial recommends two nodes for BF16.
    tp:
      ascend_910c: 8
    supported_hardware:
      - ascend_910c
    extra_args:
      - '--enable-expert-parallel'
      - '--data-parallel-size'
      - '2'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--max-model-len'
      - '133000'
      - '--max-num-seqs'
      - '16'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--enable-chunked-prefill'
      - '--enable-prefix-caching'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true,"ascend_compilation_config":{"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"weight_nz_mode":2}'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_w8a8:
    model_id: Eco-Tech/MiniMax-M3-w8a8-0626
    label: W8A8 (Ascend A3)
    precision: int8
    vram_minimum_gb: 513
    description: ModelSlim INT8 W8A8 for one Atlas 800 A3 node (16x Ascend 910C) - tutorial layout TP4 + DP4 + EP with the Eagle3 GQA head. Requires --quantization ascend; weights come from ModelScope.
    tp:
      ascend_910c: 4
    supported_hardware:
      - ascend_910c
    default_modes:
      spec_decoding: eagle3_gqa
    extra_args:
      - '--enable-expert-parallel'
      - '--data-parallel-size'
      - '4'
      - '--quantization'
      - ascend
      - '--api-server-count'
      - '1'
      - '--max-num-batched-tokens'
      - '32768'
      - '--long-prefill-token-threshold'
      - '4096'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--max-model-len'
      - '133000'
      - '--max-num-seqs'
      - '32'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--enable-chunked-prefill'
      - '--enable-prefix-caching'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true,"ascend_compilation_config":{"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true,"weight_nz_mode":2}'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_mxfp8:
    model_id: MiniMax/MiniMax-M3-MXFP8
    label: MXFP8 (Ascend A5)
    precision: mxfp8
    vram_minimum_gb: 513
    description: NPU MXFP8 (W8A8C8, where C8 is dynamic KV-cache quantization) for one 950DT node (8x Ascend 950DT) - tutorial layout TP4 + DP2 + EP with the Eagle3 GQA head. Requires --quantization mxfp8 and --kv-cache-dtype fp8.
    tp:
      ascend_950dt_8x: 4
    supported_hardware:
      - ascend_950dt_8x
    default_modes:
      spec_decoding: eagle3_gqa
    extra_args:
      - '--enable-expert-parallel'
      - '--data-parallel-size'
      - '2'
      - '--dtype'
      - bfloat16
      - '--quantization'
      - mxfp8
      - '--kv-cache-dtype'
      - fp8
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--max-model-len'
      - '133000'
      - '--max-num-batched-tokens'
      - '16384'
      - '--max-num-seqs'
      - '500'
      - '--async-scheduling'
      - '--safetensors-load-strategy'
      - prefetch
      - '--enable-chunked-prefill'
      - '--enable-prefix-caching'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_qknorm_rope":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true,"enable_flashcomm1":true}'
    extra_env:
      HCCL_BUFFSIZE: '512'
    hardware_overrides:
      ascend_950dt_8x:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a5
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_w8a8_1m:
    model_id: Eco-Tech/MiniMax-M3-w8a8-0626
    label: W8A8 1M (Ascend A3)
    precision: int8
    # Weight-only figure, same checkpoint as ascend_w8a8. The 1M KV cache is not
    # accounted for here - the tutorial's layout, not this number, is the source
    # of truth for whether the node fits.
    vram_minimum_gb: 513
    description: Same W8A8 checkpoint at the tutorial's 1M layout - TP4 + PP4 + DP1 with --max-model-len 1049600. Text-only (--language-model-only) with a 8192 long-prefill threshold; prefix caching, async scheduling and speculative decoding are off.
    tp:
      ascend_910c: 4
    supported_hardware:
      - ascend_910c
    extra_args:
      - '--pipeline-parallel-size'
      - '4'
      - '--data-parallel-size'
      - '1'
      - '--enable-expert-parallel'
      - '--quantization'
      - ascend
      - '--max-model-len'
      - '1049600'
      - '--max-num-seqs'
      - '1'
      - '--max-num-batched-tokens'
      - '8192'
      - '--long-prefill-token-threshold'
      - '8192'
      - '--gpu-memory-utilization'
      - '0.95'
      - '--language-model-only'
      - '--no-enable-prefix-caching'
      - '--no-async-scheduling'
      - '--enable-chunked-prefill'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_static_kernel":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":false,"weight_nz_mode":2,"enable_flashcomm1":true,"enable_reduce_sample":false}'
    extra_env:
      VLLM_PP_LAYER_PARTITION: '15,15,15,15'
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '7200'
      HCCL_BUFFSIZE: '256'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_mxfp8_1m_tp8:
    model_id: MiniMax/MiniMax-M3-MXFP8
    label: MXFP8 1M TP8 (Ascend A5)
    precision: mxfp8
    vram_minimum_gb: 513
    description: 950DT 1M layout - TP8 + PP1 + DP1 with --max-model-len 1048576. FP8 KV cache with layers 0-2 skipped, multimodal inputs disabled; no speculative model, prefix caching or async scheduling.
    tp:
      ascend_950dt_8x: 8
    supported_hardware:
      - ascend_950dt_8x
    extra_args:
      - '--data-parallel-size'
      - '1'
      - '--dtype'
      - bfloat16
      - '--quantization'
      - mxfp8
      - '--kv-cache-dtype'
      - fp8
      - '--kv-cache-dtype-skip-layers'
      - '0'
      - '1'
      - '2'
      - '--limit-mm-per-prompt'
      - '{"image":0,"video":0}'
      - '--max-model-len'
      - '1048576'
      - '--max-num-seqs'
      - '1'
      - '--max-num-batched-tokens'
      - '2048'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--safetensors-load-strategy'
      - prefetch
      - '--no-enable-prefix-caching'
      - '--no-async-scheduling'
      - '--enable-chunked-prefill'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_qknorm_rope":false,"fuse_norm_quant":false,"enable_static_kernel":false},"multistream_overlap_shared_expert":false,"enable_shared_expert_dp":false,"enable_flashcomm1":false}'
    extra_env:
      HCCL_BUFFSIZE: '256'
    hardware_overrides:
      ascend_950dt_8x:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a5
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_mxfp8_1m_pp2:
    model_id: MiniMax/MiniMax-M3-MXFP8
    label: MXFP8 1M TP4/PP2 (Ascend A5)
    precision: mxfp8
    vram_minimum_gb: 513
    description: 950DT 1M layout - TP4 + PP2 + DP1 with --max-model-len 1048576. Same FP8 KV settings as the TP8 layout, split across two pipeline stages.
    tp:
      ascend_950dt_8x: 4
    supported_hardware:
