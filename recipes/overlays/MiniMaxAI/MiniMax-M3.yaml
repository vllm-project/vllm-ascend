# Source: https://github.com/vllm-project/vllm/blob/c5d1d77d2bd50c985c16bc11bcacd0dabab52024/recipes/models/MiniMaxAI/MiniMax-M3.yaml
# Extracted with vllm-project/recipes@8509229176ba2d1837339ffc4cbb4f34c1bf5e66.
variants:
  ascend_bf16:
    label: BF16 (Ascend A3)
    precision: bf16
    # 427B BF16 weights are 854 GB. The params x bytes x 1.2 rule of thumb (1025)
    # would fail the single-node fit check on a 1024 GB Atlas 800 A3 node.
    vram_minimum_gb: 854
    description: Native MiniMaxAI/MiniMax-M3 BF16 on Atlas 800 A3 (16x Ascend 910C) - tutorial layout TP8 + DP2 + EP. Single-node works, but the tutorial recommends two nodes for BF16.
    tp:
      ascend_910c: 8
    supported_hardware:
      - ascend_910c
    extra_args:
      - '--enable-expert-parallel'
      - '--data-parallel-size'
      - '2'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--max-model-len'
      - '133000'
      - '--max-num-seqs'
      - '16'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--enable-chunked-prefill'
      - '--enable-prefix-caching'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true,"ascend_compilation_config":{"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"weight_nz_mode":2}'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0rc2-a3
        install:
          pip: false
  ascend_w8a8:
    model_id: Eco-Tech/MiniMax-M3-w8a8-0626
    label: W8A8 (Ascend A3)
    precision: int8
    vram_minimum_gb: 513
    description: ModelSlim INT8 W8A8 for one Atlas 800 A3 node (16x Ascend 910C) - tutorial layout TP4 + DP4 + EP with the Eagle3 GQA head. Requires --quantization ascend; weights come from ModelScope.
    tp:
      ascend_910c: 4
    supported_hardware:
      - ascend_910c
    default_modes:
      spec_decoding: eagle3_gqa
    extra_args:
      - '--enable-expert-parallel'
      - '--data-parallel-size'
      - '4'
      - '--quantization'
      - ascend
      - '--api-server-count'
      - '1'
      - '--max-num-batched-tokens'
      - '32768'
      - '--long-prefill-token-threshold'
      - '4096'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--max-model-len'
      - '133000'
      - '--max-num-seqs'
      - '32'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--enable-chunked-prefill'
      - '--enable-prefix-caching'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true,"ascend_compilation_config":{"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true,"weight_nz_mode":2}'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0rc2-a3
        install:
          pip: false
  ascend_mxfp8:
    model_id: MiniMaxAI/MiniMax-M3-MXFP8
    label: MXFP8 (Ascend A5)
    precision: mxfp8
    vram_minimum_gb: 513
    description: NPU MXFP8 (W8A8C8, where C8 is dynamic KV-cache quantization) for one 950DT node (8x Ascend 950DT) - tutorial layout TP4 + DP2 + EP with the Eagle3 GQA head. Requires --quantization mxfp8 and --kv-cache-dtype fp8.
    tp:
      ascend_950dt_8x: 4
    supported_hardware:
      - ascend_950dt_8x
    default_modes:
      spec_decoding: eagle3_gqa
    extra_args:
      - '--enable-expert-parallel'
      - '--data-parallel-size'
      - '2'
      - '--dtype'
      - bfloat16
      - '--quantization'
      - mxfp8
      - '--kv-cache-dtype'
      - fp8
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--max-model-len'
      - '133000'
      - '--max-num-batched-tokens'
      - '16384'
      - '--max-num-seqs'
      - '500'
      - '--async-scheduling'
      - '--safetensors-load-strategy'
      - prefetch
      - '--enable-chunked-prefill'
      - '--enable-prefix-caching'
      - '--gpu-memory-utilization'
      - '0.92'
      - '--limit-mm-per-prompt'
      - '{"image":1,"video":0}'
      - '--additional-config'
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_qknorm_rope":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true,"enable_flashcomm1":true}'
    extra_env:
      HCCL_BUFFSIZE: '512'
    hardware_overrides:
      ascend_950dt_8x:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0rc2-a5
        install:
          pip: false
meta:
  hardware:
    ascend_910c: verified
    ascend_950dt_8x: verified
guide_sections:
  ascend: |
    ### Huawei Ascend (vLLM Ascend)

    The three variants reproduce the tutorial's single-node commands on Atlas 800
    A3 (16 x 64 GB Ascend 910C) and 950DT products (8 x 96 GB Ascend 950DT), using
    the `v0.30.0rc2-a3` / `v0.30.0rc2-a5` release images.

    | Weights | Hardware | Layout |
    | --- | --- | --- |
    | `MiniMaxAI/MiniMax-M3` (BF16) | 1-2 Atlas 800 A3 | TP8 / DP2 / EP |
    | `Eco-Tech/MiniMax-M3-w8a8-0626` (W8A8) | 1 Atlas 800 A3 | TP4 / DP4 / EP + Eagle3 |
    | `MiniMaxAI/MiniMax-M3-MXFP8` (MXFP8) | 1 950DT | TP4 / DP2 / EP + Eagle3 |

    The overview and the weight table also list BF16 and W8A8 on Atlas 800 A2
    (64 GB x 8); this page has no A2 sizing profile, so follow the tutorial's A2
    layouts there.

    Weights and the draft head (`Inferact/MiniMax-M3-EAGLE3-GQA`) come from
    ModelScope, not Hugging Face:

    - https://www.modelscope.cn/collections/MiniMax/MiniMax-M3
    - https://www.modelscope.cn/models/Eco-Tech/MiniMax-M3-w8a8-0626
    - https://www.modelscope.cn/models/MiniMax/MiniMax-M3-MXFP8
    - https://www.modelscope.cn/models/Inferact/MiniMax-M3-EAGLE3-GQA

    `VLLM_USE_MODELSCOPE=True` is preset for every variant; pass a local weight
    directory instead if the files are already on disk. `--quantization` only
    applies to quantized weights and has to match the checkpoint - `ascend` for
    W8A8, `mxfp8` for MXFP8, and nothing for BF16, where a stray quant method
    makes the load fail.

    Layouts this generator does not render, all of them in the tutorial:

    - 1M-token context: A3 W8A8 TP4 / PP4 / DP1 at `--max-model-len 1049600`, and
      950DT MXFP8 TP8 / PP1 / DP1 or TP4 / PP2 / DP1 at 1048576. They add
      `--pipeline-parallel-size`, `VLLM_PP_LAYER_PARTITION` and
      `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1` on A3, and the
      `experimental_950_transformer` vendor package on 950DT.
    - Prefill/decode disaggregation: `MooncakeConnectorV1` moves KV from prefill
      to decode, and `MultiConnector` wraps it with `AscendStoreConnector` for the
      Mooncake KV cache pool.
    - Dual-node BF16: the tutorial runs TP8 / DP4 with `enable_shared_expert_dp`
      and the Eagle3 head; TP stays inside a node here, so two nodes render as
      TP16 / DP2.

    Source: https://github.com/vllm-project/vllm-ascend/blob/91db901e4716f2de54608c210a79694a0327e2b4/docs/source/tutorials/models/MiniMax-M3.md
hardware_overrides:
  npu:
    extra_args:
      - '--trust-remote-code'
      - '--distributed-executor-backend'
      - mp
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
hardware_notes:
  ascend_910c:
    title: vLLM Ascend A3 image required
    body: Single-node layouts fill all 16 NPUs - BF16 at TP8 + DP2, W8A8 at TP4 + DP4. Pin quay.io/ascend/vllm-ascend:v0.30.0rc2-a3; the NVIDIA pip wheel cannot run here. Each variant carries one --additional-config, and the W8A8 checkpoint takes --quantization ascend while the BF16 one takes no quant flag at all - a second or wrong value aborts the load.
    link:
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/MiniMax-M3.html
      label: MiniMax-M3 on vLLM-Ascend
  ascend_950dt_8x:
    title: vLLM Ascend A5 image required
    body: This profile is the tutorial's 950DT products - MXFP8 at TP4 + DP2 on one 8-card node, with --kv-cache-dtype fp8 for the W8A8C8 checkpoint. Pin quay.io/ascend/vllm-ascend:v0.30.0rc2-a5 and set HCCL_BUFFSIZE=512 before launch.
    link:
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/MiniMax-M3.html
      label: MiniMax-M3 on vLLM-Ascend
features:
  spec_decoding:
    modes:
      eagle3:
        hardware:
          npu: unsupported
      eagle3_gqa:
        hardware:
          npu: supported
        hardware_overrides:
          ascend_910c:
            args:
              - '--speculative-config'
              - '{"model":"Inferact/MiniMax-M3-EAGLE3-GQA","method":"eagle3","num_speculative_tokens":3}'
          ascend_950dt_8x:
            args:
              - '--speculative-config'
              - '{"model":"Inferact/MiniMax-M3-EAGLE3-GQA","method":"eagle3","num_speculative_tokens":3,"kv_cache_dtype":"bfloat16"}'
  encoder_parallel:
    hardware_overrides:
      npu:
        args:
          - '--mm-encoder-tp-mode'
          - data
strategy_hardware:
  # The variants already carry the tutorial's DP size, so every strategy that
  # would add its own DP or PP on top is opted out; only the layouts the tutorial
  # renders as plain TP + DP are left on.
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp_dp:
    npu: supported
  multi_node_tp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  pd_cluster:
    npu: unsupported
strategy_overrides:
  multi_node_tp_dp:
    hardware_overrides:
      npu:
        # strategy_overrides replaces the npu generation block, so the shared
        # Ascend flags are restated here next to the HCCL rendezvous settings.
        extra_args:
          - '--trust-remote-code'
          - '--distributed-executor-backend'
          - mp
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          HCCL_OP_EXPANSION_MODE: AIV
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          HCCL_IF_IP: $LOCAL_IP
          HCCL_SOCKET_IFNAME: $IFACE_NAME
