          - --kv-cache-memory-bytes
          - '47620449894'
        env:
          HCCL_IF_IP: $DECODE_NODE_1
          HCCL_BUFFSIZE: '64'
          HCCL_OP_EXPANSION_MODE: AIV
        json_args:
          --additional-config: {multistream_overlap_shared_expert: false}
          --kv-transfer-config: *ascend_a3_1m_pd_link
strategy_overrides:
  multi_node_tp_dp:
    hardware_overrides:
      ascend_910c:
        extra_env:
          HCCL_IF_IP: $LOCAL_IP
          HCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_cluster:
    hardware_overrides:
      npu:
        # Generation-level strategy overrides replace the shared NPU block.
        extra_args: [--trust-remote-code, --distributed-executor-backend, mp]
        extra_env:
          VLLM_USE_MODELSCOPE: 'True'
          VLLM_USE_V2_MODEL_RUNNER: '1'
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
# Exact hardware profiles override the npu fallback for distributed strategies.
strategy_hardware:
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp_dp:
    npu: unsupported
    ascend_910c: supported
  multi_node_tp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  pd_cluster:
    npu: unsupported
    ascend_910c: supported
    ascend_950dt_8x: supported
