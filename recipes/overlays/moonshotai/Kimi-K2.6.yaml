    model_id: Eco-Tech/Kimi-K2.6-w4a8
    precision: int4
    label: W4A8 (Ascend)
    vram_minimum_gb: 714
    description: Ascend W4A8 checkpoint on ModelScope, documented and validated on Atlas 800 A3 (16 x 64 GB NPUs) in the vLLM-Ascend Kimi-K2.6 tutorial. The 714 GB VRAM requirement remains an estimate.
