# Source: https://github.com/vllm-project/vllm/blob/9e6c6b007ae698bd8604620b17d5720a89169da8/recipes/models/moonshotai/Kimi-K2.6.yaml
# Extracted with vllm-project/recipes@8509229176ba2d1837339ffc4cbb4f34c1bf5e66.
variants:
  # The base recipe's default / fp8 / nvfp4 / redhat_nvfp4 variants carry no
  # Ascend image; without these blocks the renderer falls back to the NVIDIA
  # default image and emits an unrunnable `vllm serve` for ascend_910c. They
  # are pinned for installability only — these checkpoints are not validated
  # on Ascend; the verified Ascend deployment is the ascend_w4a8 variant
  # below (see notes).
  default:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  fp8:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  nvfp4:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  redhat_nvfp4:
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
  ascend_w4a8:
    model_id: Eco-Tech/Kimi-K2.6-W4A8
    precision: int4
    label: W4A8 (Ascend)
    vram_minimum_gb: 600
    supported_hardware:
      - ascend_910c
    supported_features:
      # The checkpoint's speculative config is pinned statically (DFlash, see
      # extra_args); the upstream eagle3 spec_decoding toggle would override
      # it on this variant, so the toggle is not offered here.
      - tool_calling
      - reasoning
      - text_only
      - encoder_parallel
    tp: 4
    extra_args:
      - '--quantization'
      - ascend
      - '--data-parallel-size'
      - '4'
      - '--speculative-config'
      - '{"method": "dflash","model": "z-lab/Kimi-K2.5-DFlash", "num_speculative_tokens": 15}'
      - '--no-enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '4'
      - '--max-model-len'
      - '34816'
      - '--max-num-batched-tokens'
      - '16384'
      - '--gpu-memory-utilization'
      - '0.87'
      - '--seed'
      - '42'
      - '--async-scheduling'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-encoder-tp-mode'
      - data
      - '--additional-config'
      - '{"scheduler_config":{"enable_balance_scheduling":true},"enable_mlapo":true,"enable_flashcomm1":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '600'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
        docker_serve_command: "vllm serve"
        install:
          pip: false
          docker: true
    description: "ModelSlim W4A8 (weights on ModelScope: Eco-Tech/Kimi-K2.6-W4A8) — 1 Atlas 800 A3 (64G x 16), TP4xDP4 + DFlash; first-party verified 2026-10-28 on a nightly build (release-tag re-verify pending). System-level tuning (cpufreq governor, sysctl) from the companion Ascend recipe is host-side and skipped in unprivileged environments."
strategy_hardware:
  single_node_tep:
    # TEP pins TP to the full node (16 NPUs on one Atlas 800 A3); combined
    # with this variant's static --data-parallel-size 4 the commands would
    # request 64 NPUs from a 16-NPU node, so the strategy is not offered
    # here. The verified single-node deployment is TP4×DP4 under
    # single_node_tp.
    ascend_910c: unsupported
  single_node_dep:
    # The DEP emitter sizes local DP to the whole node and drops this
    # variant's static --data-parallel-size 4 / tp: 4 placement, rendering an
    # unverified DP16 single node behind vLLM Router. Not offered on 910C;
    # the verified single-node deployment is TP4×DP4 under single_node_tp.
    ascend_910c: unsupported
  multi_node_tp:
    # The multi-node TP/TP+PP/TEP emitters size TP across the whole cluster
    # (per node for TP+PP) and leave no room for this variant's static
    # --data-parallel-size 4, so these strategies are not offered on
    # Ascend 910C.
    ascend_910c: unsupported
  multi_node_tp_pp:
    ascend_910c: unsupported
  multi_node_tep:
    ascend_910c: unsupported
  multi_node_dep:
    # Renders a two-node DP32 cluster with the variant's TP4 placement
    # dropped — a topology that has not been run on Ascend. Not offered on
    # 910C.
    ascend_910c: unsupported
  pd_cluster:
    # Offered on ascend_910c only through the opt-in `ascend_a3_w4a8_pd`
    # preset below (tutorial §5.2: 2P1D on four Atlas 800 A3 nodes with
    # Mooncake); the default pd_cluster pools render one full node per role
    # and are not offered.
    ascend_910c: supported

strategy_min_gpus:
  # The verified PD topology is 2P1D on four 16-NPU Atlas 800 A3 nodes
  # (tutorial §5.2); a pd_cluster pool below that floor drops out.
  ascend_910c:
    pd_cluster: 64

presets:
  ascend_a3_w4a8_pd:
    label: W4A8 PD (2P1D)
    hardware: ascend_910c
    strategy: pd_cluster
    variants: [ascend_w4a8]
    default: false
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
    remove_args:
      # The tutorial PD lane runs no async scheduling anywhere, so the
      # variant's flag is dropped globally here. Everything else the variant
      # pins is handled per role: values the tutorial changes travel in the
      # roles' args (applied after the variant layer, so the last-wins
      # dedupe keeps them), flags a role omits are dropped in that role's
      # own remove_args, and --data-parallel-size is never listed anywhere —
      # the pd_cluster pool emits it from the role topology, and a preset-
      # level drop would strip the pool's own flag and fail the check.
      - '--async-scheduling'
    workload: 'Prefill/decode separation (2P1D), 4 nodes x 16-die Atlas 800 A3, Mooncake'
    image:
      vllm: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
    runbook: |
      Transcribed from tutorial §5.2 (Multi-Node PD Separation Deployment):
      2P1D on four Atlas 800 A3 (64GB x 16) nodes — 2 prefill nodes and one
      decode instance spanning 2 nodes. 2P1D is recommended over 1P1D (2
      nodes) because 1P1D lacks the NPU memory to serve high concurrency.
      The tutorial orchestrates per-node DP ranks with launch_online_dp.py /
      run_dp_template.sh and forwards requests through proxy.sh on the
      prefill master node; Mooncake is a prerequisite. Host-side tuning
      (cpufreq governor, sysctl) is applied outside the container. Two
      simplifications against the tutorial scripts: the builder renders one
      prefill pool and one decode pool where the tutorial runs the prefill
      nodes as independent replica groups (each starting at DP rank 0), and
      per-node KV ports are folded to their first values (prefill 30000,
      decode 30200; the tutorial also uses 30100/30300).
    roles:
      prefill:
        nodes: 2
        parallelism: tp
        tp: 4
        args:
          - '--max-model-len'
          - '133120'
          - '--max-num-batched-tokens'
          - '16384'
          - '--max-num-seqs'
          - '1'
          - '--gpu-memory-utilization'
          - '0.92'
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - kimi_k2
          - '--reasoning-parser'
          - kimi_k2
          - '--enforce-eager'
          - '--seed'
          - '1024'
          - '--additional-config'
          - '{"recompute_scheduler_enable":true,"enable_shared_expert_dp": true}'
        remove_args:
          # The tutorial prefill lane runs neither speculative decoding nor
          # a compilation config; the variant's two flags are dropped in
          # this role only (the decode role overrides/keeps its own via its
          # args).
          - '--speculative-config'
          - '--compilation-config'
        env:
          VLLM_RPC_TIMEOUT: '3600000'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
          HCCL_EXEC_TIMEOUT: '204'
          HCCL_CONNECT_TIMEOUT: '120'
          HCCL_BUFFSIZE: '1536'
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '1'
          TASK_QUEUE_ENABLE: '1'
          HCCL_IF_IP: $PREFILL_NODE_1
          VLLM_HOST_IP: $PREFILL_NODE_1
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_producer
            kv_port: '30000'
            kv_connector_extra_config:
              use_ascend_direct: true
              # The builder renders one prefill pool, so the KV metadata
              # describes the whole pool (the tutorial's two prefill nodes
              # are independent replica groups, each declaring its own
              # dp_size 4); placeholders resolve to the rendered pool sizes.
              prefill:
                dp_size: '{prefill_dp_size}'
                tp_size: 4
              decode:
                dp_size: '{decode_dp_size}'
                tp_size: 4
      decode:
        nodes: 2
        parallelism: dep
        tp: 4
        args:
          - '--max-model-len'
          - '133120'
          - '--max-num-batched-tokens'
          - '32'
          - '--max-num-seqs'
          - '8'
          - '--gpu-memory-utilization'
          - '0.91'
          - '--enable-auto-tool-choice'
          - '--tool-call-parser'
          - kimi_k2
          - '--reasoning-parser'
          - kimi_k2
          - '--seed'
          - '1024'
          - '--compilation-config'
          - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert":true,"enable_mlapo":true}'
          - '--speculative-config'
          - '{"method": "eagle3", "model":"lightseekorg/kimi-k2.6-eagle3", "num_speculative_tokens": 3}'
        remove_args:
          # The tutorial decode lane runs without the multimodal encoder TP
          # mode (prefill-only in the tutorial); the variant's flag is
          # dropped in this role only.
          - '--mm-encoder-tp-mode'
        env:
          VLLM_RPC_TIMEOUT: '3600000'
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
          HCCL_EXEC_TIMEOUT: '204'
          HCCL_CONNECT_TIMEOUT: '120'
          HCCL_BUFFSIZE: '800'
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: '1'
          TASK_QUEUE_ENABLE: '1'
          HCCL_IF_IP: $DECODE_NODE_1
          VLLM_HOST_IP: $DECODE_NODE_1
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
        json_args:
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_consumer
            kv_port: '30200'
            kv_connector_extra_config:
              use_ascend_direct: true
              prefill:
                dp_size: '{prefill_dp_size}'
                tp_size: 4
              decode:
                dp_size: '{decode_dp_size}'
                tp_size: 4

notes:
  - title: "Ascend 910C: use the W4A8 (Ascend) variant"
    when: { hardware: [ascend_910c] }
    body: |
      The `default` / `fp8` / `nvfp4` / `redhat_nvfp4` checkpoints above are
      pinned to an Ascend image so the commands are runnable, but these
      checkpoints are not validated on Ascend 910C. The first-party verified
      deployment on one Atlas 800 A3 is the **W4A8 (Ascend)** variant
      (TP4×DP4 + DFlash).
  - title: "Prefill/decode separation on Ascend 910C"
    when: { hardware: [ascend_910c] }
    body: |
      PD separation is offered as the opt-in **W4A8 PD (2P1D)** preset:
      four Atlas 800 A3 nodes (2 prefill + 1 decode instance spanning 2
      nodes) with Mooncake, per tutorial §5.2 — 2P1D is recommended over
      1P1D there. The preset is a transcription of the tutorial lane, which
      additionally uses per-node launcher scripts (launch_online_dp.py /
      run_dp_template.sh) and a request proxy on the prefill master.

meta:
  hardware:
    # First-party verification 2026-10-28 plus official runner-CI end-to-end
    # verification passed (companion Ascend recipe merged as
    # vllm-ascend/vllm-ascend-recipes#100, 2026-11-05).
    ascend_910c: verified
