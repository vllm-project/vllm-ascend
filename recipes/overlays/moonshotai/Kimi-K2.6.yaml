guide_sections:
  ascend: "### Huawei Ascend 910C\n\nThe [official 910C example](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Kimi-K2.6.html#51-single-node-online-deployment)\nuses one Atlas 800 A3 node\
    \ (16 x 64 GB NPUs) with TP=4, DP=4 and EP.\nSelect **W4A8 (Ascend)** in the builder. Other inherited variants are not\nvalidated for Ascend. Download the W4A8 checkpoint and use its local path if needed.\n\
    \n- **Ports:** the standalone command below serves on 8000; the DEP builder uses\n  service port 8100 behind a router on 8000.\n- **Spec Decoding:** off by default. On 910C, enabling it selects DFlash;\n\
    \  confirm draft compatibility first. On 950DT, the contributor tested Eagle3\n  with one speculative token. Replace the draft placeholder\n  `/path/to/kimi-k2.6-w4a8` with the actual Eagle3 draft directory.\n\
    \  The 950DT result does not validate 910C draft compatibility.\n- **Tuning:** CPU/sysctl tuning and profiling are Guide-only; host tuning\n  requires appropriate permissions. Generated commands were\
    \ not rerun on NPUs\n  for this update.\n\nWhen using the shared Client Usage example, set `model` to\n`Eco-Tech/Kimi-K2.6-w4a8` to match this recipe's served model name.\n\n#### Launch command\n\n\
    ```bash\n#!/bin/sh\nexport VLLM_USE_MODELSCOPE=True\nexport HCCL_OP_EXPANSION_MODE=\"AIV\"\nexport PYTORCH_NPU_ALLOC_CONF=expandable_segments:True\nexport OMP_PROC_BIND=false\nexport OMP_NUM_THREADS=1\n\
    export TASK_QUEUE_ENABLE=1\n\necho performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor\nsysctl -w vm.swappiness=0\nsysctl -w kernel.numa_balancing=0\nsysctl -w kernel.sched_migration_cost_ns=50000\n\
    \nexport HCCL_BUFFSIZE=600\n\n# Ensure the model path matches the directory recorded during download\nvllm serve Eco-Tech/Kimi-K2.6-w4a8 \\\n    --quantization ascend \\\n    --enable-auto-tool-choice\
    \ \\\n    --tool-call-parser kimi_k2 \\\n    --reasoning-parser kimi_k2 \\\n    --allowed-local-media-path /data/media \\\n    --served-model-name Eco-Tech/Kimi-K2.6-w4a8 \\\n    --trust-remote-code\
    \ \\\n    --tensor-parallel-size 4 \\\n    --data-parallel-size 4 \\\n    --no-enable-prefix-caching \\\n    --enable-expert-parallel \\\n    --port 8000 \\\n    --max-num-seqs 4 \\\n    --max-model-len\
    \ 15000 \\\n    --max-num-batched-tokens 16384 \\\n    --gpu-memory-utilization 0.87 \\\n    --seed 42 \\\n    --compilation-config '{\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}' \\\n    --profiler-config\
    \ '{\"profiler\": \"torch\", \"torch_profiler_dir\": \"./vllm_profile\", \"torch_profiler_with_stack\": true}' \\\n    --mm-processor-cache-gb 0 \\\n    --mm-encoder-tp-mode data \\\n    --additional-config\
    \ '{\"scheduler_config\":{\"enable_balance_scheduling\":false},\"enable_mlapo\":true}'\n```\n#### Ascend PD presets\n\nOn A3 W4A8, the `ascend_pd` preset explicitly enables Ascend Router and\nMooncake\
    \ (Ascend). It offers 1P1D TP8/DP2, one-node internal-DP, and\ntwo-node-per-role TP4/DP8 adaptations. See the preset runbook for startup\norder and validation limits. These are reference designs; the\
    \ current\nrenderer cannot represent the tutorial's two independent Prefill pools.\nThe proxy listens on 1999, and native multi-port DP uses health port 8290.\nThe container-local shared-memory setting\
    \ follows the tutorial's 1g;\nhost IPC is not required by that example and is not enabled here.\n"
  huawei_prerequisites: '- **Huawei support:** 1 Atlas 800 A3 node (16 x 64 GB NPUs, Ascend 910C). Official reference environment: vLLM 0.30.0 and vLLM-Ascend 0.30.0; host Ascend HDK 26.1.1.

    '
  ascend_references: '- [Kimi-K2.6 on ModelScope](https://www.modelscope.cn/models/moonshotai/Kimi-K2.6)

    - [Eco-Tech Kimi-K2.6-W4A8 on ModelScope](https://www.modelscope.cn/models/Eco-Tech/Kimi-K2.6-w4a8)

    - [vLLM-Ascend Kimi-K2.6 tutorial](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Kimi-K2.6.html)

    '
