  ascend_w4a8:
    model_id: Eco-Tech/Kimi-K2.6-W4A8
    precision: int4
    label: W4A8 (ASCEND)
    vram_minimum_gb: 600
    supported_hardware:
    - ascend_910c
    supported_features:
    - tool_calling
    - reasoning
    - text_only
    - encoder_parallel
    tp: 4
    extra_args:
    - --quantization
    - ascend
    - --data-parallel-size
    - '4'
    - --speculative-config
    - '{"method": "dflash","model": "z-lab/Kimi-K2.5-DFlash", "num_speculative_tokens": 15}'
    - --no-enable-prefix-caching
    - --enable-expert-parallel
    - --max-num-seqs
    - '4'
    - --max-model-len
    - '34816'
    - --max-num-batched-tokens
    - '16384'
    - --gpu-memory-utilization
    - '0.87'
    - --seed
    - '42'
    - --async-scheduling
    - --compilation-config
    - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
    - --mm-encoder-tp-mode
    - data
    - --additional-config
    - '{"scheduler_config":{"enable_balance_scheduling":true},"enable_mlapo":true,"enable_flashcomm1":true}'
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '600'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
        docker_serve_command: vllm serve
        install:
          pip: false
          docker: true
    description: 'ModelSlim W4A8 (weights on ModelScope: Eco-Tech/Kimi-K2.6-W4A8) — 1 Atlas 800 A3 (64G x 16), TP4xDP4 + DFlash; first-party verified 2026-10-28 on a nightly build (release-tag re-verify
      pending). System-level tuning (cpufreq governor, sysctl) from the companion Ascend recipe is host-side and skipped in unprivileged environments. Single-node values document the first-party verified
      configuration from the merged companion recipe (vllm-ascend/vllm-ascend-recipes#100); the current tutorial §5.1 example differs (max-model-len 15000, no --async-scheduling).'
