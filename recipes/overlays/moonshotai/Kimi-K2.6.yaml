strategy_min_gpus:
  ascend_910c:
    pd_cluster: 64
notes:
- title: 'Ascend 910C: use the W4A8 (ASCEND) variant'
  when:
    hardware:
    - ascend_910c
  body: 'The `default` / `fp8` / `nvfp4` / `redhat_nvfp4` checkpoints above are

    pinned to an Ascend image so the commands are runnable, but these

    checkpoints are not validated on Ascend 910C. The first-party verified

    deployment on one Atlas 800 A3 is the **W4A8 (ASCEND)** variant

    (TP4×DP4 + DFlash).

    '
- title: Prefill/decode separation on Ascend 910C
  when:
    hardware:
    - ascend_910c
  body: 'PD separation is offered as the opt-in **W4A8 PD (2P1D)** preset:

    four Atlas 800 A3 nodes (2 prefill + 1 decode instance spanning 2

    nodes) with Mooncake, per tutorial §5.2 — 2P1D is recommended over

    1P1D there. The preset decodes with eagle3 (3 tokens), matching the

    tutorial''s decode lane. **Select a preset when deploying PD**:

    without one, the plain `pd_cluster` pool renders the base recipe''s

    generic topology — NixlConnector KV transfer, the flashinfer

    all-to-all backend, and DFlash speculative decoding on a DP16 pool.

    (That DFlash mention describes what the builder emits **without a

    preset**; it is not the tutorial''s decode lane, and neither preset

    uses the plain pool.) A second preset, **W4A8 PD (2P1D, DFlash

    decode)**, swaps the decode speculative config for the co-located

    DFlash setup (tutorial §5.1 / vllm-ascend-recipes#100) with an

    identical pool topology for a head-to-head decode comparison; that

    combination is not validated end-to-end. Both

    presets transcribe the tutorial lane, which additionally uses

    per-node launcher scripts (launch_online_dp.py / run_dp_template.sh)

    and a request proxy on the prefill master.

    '
