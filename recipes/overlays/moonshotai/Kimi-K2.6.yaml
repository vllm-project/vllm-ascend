          - '--served-model-name'
          - Eco-Tech/Kimi-K2.6-w4a8
          - '--no-enable-prefix-caching'
          - '--max-num-seqs'
          - '4'
          - '--max-model-len'
          - '15000'
          - '--max-num-batched-tokens'
          - '16384'
          - '--gpu-memory-utilization'
          - '0.87'
          - '--seed'
          - '42'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--mm-processor-cache-gb'
          - '0'
          - '--additional-config'
          - '{"scheduler_config":{"enable_balance_scheduling":false},"enable_mlapo":true}'
        extra_env:
