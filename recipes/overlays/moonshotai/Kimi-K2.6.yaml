presets:
  ascend_pd:
    label: A3 W4A8 PD (native DP)
    hardware: ascend_910c
    strategy: pd_cluster
    variants:
    - w4a8_ascend
    default: true
    description: Tutorial-derived 1P1D TP8/DP2 baseline plus internal-DP and distributed-pool adaptations. Command generation is checked; native DP on Kimi-K2.6 has not been rerun on NPUs. Reference deployment
      only, not production guidance.
    source:
      label: Official Kimi-K2.6 tutorial (Sections 5.2 and 9.1)
      href: https://github.com/vllm-project/vllm-ascend/blob/8744aa967ceaefcba563b5d27e39c1f6fe882587/docs/source/tutorials/models/Kimi-K2.6.md
      revision: 8744aa967ceaefcba563b5d27e39c1f6fe882587
    image: quay.io/ascend/vllm-ascend:v0.30.0-a3
    router_port: 1999
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      features:
        spec_decoding: false
      kv_offload: false
    args:
    - --served-model-name
    - Eco-Tech/Kimi-K2.6-w4a8
    - --seed
    - '1024'
    - --max-model-len
    - '17000'
    - --no-enable-prefix-caching
    - --mm-processor-cache-gb
    - '0'
    - --mm-encoder-tp-mode
    - data
    - --data-parallel-supervisor-port
    - '8290'
    env:
      HCCL_OP_EXPANSION_MODE: AIV
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      VLLM_RPC_TIMEOUT: '3600000'
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
      HCCL_EXEC_TIMEOUT: '3600'
      HCCL_CONNECT_TIMEOUT: '120'
      LD_LIBRARY_PATH: /usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
    remove_args:
    - --data-parallel-hybrid-lb
    - --all2all-backend
    - --block-size
    roles:
      prefill:
        nodes: 1
        parallelism: dep
        tp: 8
        pp: 1
        data_parallel_lb: external
        args:
        - --max-num-seqs
        - '1'
        - --max-num-batched-tokens
        - '16384'
        - --gpu-memory-utilization
        - '0.92'
        - --enforce-eager
        - --additional-config
        - '{"recompute_scheduler_enable":true,"enable_shared_expert_dp":true}'
        env:
          HCCL_IF_IP: $PREFILL_NODE_1
          HCCL_BUFFSIZE: '1536'
        remove_args:
        - --speculative-config
        - --compilation-config
        json_args:
          --kv-transfer-config:
            MooncakeConnectorV2:
              kv_connector: MooncakeConnectorV1
              kv_connector_extra_config:
                use_ascend_direct: true
                prefill:
                  pp_size: null
                decode:
                  pp_size: null
      decode:
        nodes: 1
        parallelism: dep
        tp: 8
        pp: 1
        data_parallel_lb: external
        args:
        - --max-num-seqs
        - '8'
        - --max-num-batched-tokens
        - '32'
        - --gpu-memory-utilization
        - '0.91'
        - --compilation-config
        - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        - --additional-config
        - '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert":true,"enable_mlapo":true}'
        env:
          HCCL_IF_IP: $DECODE_NODE_1
          HCCL_BUFFSIZE: '800'
        json_args:
          --kv-transfer-config:
            MooncakeConnectorV2:
              kv_connector: MooncakeConnectorV1
              kv_connector_extra_config:
                use_ascend_direct: true
                prefill:
                  pp_size: null
                decode:
                  pp_size: null
          --speculative-config:
            method: eagle3
            model: lightseekorg/kimi-k2.6-eagle3
            num_speculative_tokens: 3
    points:
      one_p_one_d:
        label: 1P1D - TP8 / local DP2 per node
        default: true
      internal_dp:
        label: 1P1D - internal DP, one HTTP endpoint per node
        description: One dedicated node per role; native internal load balancing replaces the per-rank HTTP endpoints. This is an unvalidated adaptation.
        roles:
          prefill:
            data_parallel_lb: internal
          decode:
            data_parallel_lb: internal
      distributed_dp:
        label: Two-node pools - TP4 / global DP8 per role
        description: 'Four A3 nodes total: one two-node Prefill pool and one two-node Decode pool, each TP4/local DP4/global DP8. Unlike the tutorial''s independent Prefill replicas, all Prefill ranks here
          join one DP group. This topology adaptation requires separate end-to-end validation.'
        roles:
          prefill:
            nodes: 2
            tp: 4
            data_parallel_lb: external
          decode:
            nodes: 2
            tp: 4
            data_parallel_lb: external
    runbook: "## Scope and prerequisites\n\nReference design only. The official tutorial recommends MindIE Motor\nplus vLLM-Ascend for production. Its 1P1D tuning example uses TP8/DP2 on\neach 16-NPU A3\
      \ node. Native external/internal DP and the distributed-pool\npoint are adaptations, not Kimi-K2.6 runtime-validation claims.\n\nUse dedicated Prefill and Decode hosts, the W4A8 checkpoint, matching\n\
      vLLM/vLLM-Ascend 0.30.0 environments, Mooncake and the proxy script from\nthat same runtime. Check `vllm serve --help` for the multi-port and\nsupervisor flags. Configure each node's NIC variables\
      \ (GLOO_SOCKET_IFNAME,\nTP_SOCKET_IFNAME and HCCL_SOCKET_IFNAME) for its own interconnect.\n\n## Start workers, then the proxy\n\n1. Fill the generated node addresses and DP RPC / worker ports; use\
      \ each\n   node's distinct exported command, including start ranks 0 and 4 for\n   the two-node pools. Do not repeat the first node's command everywhere.\n2. Run the native `vllm serve` commands on\
      \ every node. No\n   `launch_online_dp.py` or `run_dp_template.sh` is needed. External local\n   DP>1 uses `--data-parallel-multi-port-external-lb`; each local rank\n   listens on base_port + local_rank.\
      \ Internal DP uses one HTTP endpoint\n   per role and is offered only for the one-node pools.\n3. Keep supervisor health port 8290 free on each host. Multi-port mode\n   starts it automatically; it\
      \ is not a model-serving port. Keep it\n   distinct from worker HTTP, DP RPC and KV ports. Dedicated hosts allow\n   the same supervisor port on different nodes.\n4. Once every worker/rank is healthy,\
      \ start the generated Ascend Router\n   command. Its preset port is 1999; send client, verification and\n   benchmark requests through that port, not through the supervisor.\n5. Verify /v1/models\
      \ and an actual completion through the Router, then\n   confirm Mooncake KV transfer in logs. Repeat for each topology before\n   declaring it verified. No accuracy or performance result is implied.\n\
      \nSpeculative decoding is off by default. If enabled, Prefill remains\nnon-speculative and Decode uses the tutorial's Eagle3 draft with three\ntokens; download that separate draft checkpoint first.\
      \ That path also\nneeds a compatible runtime and Kimi-K2.6 validation.\n"
  ascend_a3_w4a8_pd:
    label: W4A8 PD (2P1D)
    hardware: ascend_910c
    strategy: pd_cluster
    variants:
    - ascend_w4a8
    default: false
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
    remove_args:
    - --async-scheduling
    - --data-parallel-hybrid-lb
    workload: Prefill/decode separation (2P1D), 4 nodes x 16-die Atlas 800 A3, Mooncake
    source:
      label: Kimi-K2.6 tutorial, section 5.2
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Kimi-K2.6.html
      key: k26-a3-w4a8-pd-2p1d
      revision: '2026-11-26'
    image:
      vllm: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
      model_revision: master
    runbook: "## Evidence and versions\n\n- Source: tutorial §5.2 (Multi-Node PD Separation Deployment),\n  transcribed value-by-value\n- Image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3\n- Checkpoint: Eco-Tech/Kimi-K2.6-W4A8\
      \ (ModelScope, master)\n- Validation status: not validated end-to-end; rendering verified\n  against the official builder (DP8 prefill pool / DP8 decode pool)\n\n## Transcription notes\n\nTranscribed\
