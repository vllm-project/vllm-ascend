# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/moonshotai/Kimi-K3.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
kv_offload_hardware:
  ascend_910c: unsupported
  ascend_950dt: unsupported

variants:
  ascend_w4a8:
    # https://www.modelscope.cn/models/Eco-Tech/Kimi-K3-w4a8
    model_id: Eco-Tech/Kimi-K3-w4a8
    precision: int4
    label: W4A8 (Ascend)
    vram_minimum_gb: 1711
    supported_hardware:
      - ascend_910c
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '131072'
      - '--max-num-batched-tokens'
      - '24576'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-processor-cache-gb'
      - '0'
      - '--additional-config'
      - '{"enable_cpu_binding":true, "enable_flashcomm1":true}'
      - '--mm-encoder-tp-mode'
      - data
      - '--limit-mm-per-prompt'
      - '{"vision_chunk": 2}'
      - '--allowed-local-media-path'
      - /
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '800'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:kimi-k3-a3
    description: ModelSlim INT4 W4A8 for Ascend NPU. Requires --quantization ascend. Validated on 4× 910C mixed P/D.

  ascend_mxfp4:
    # https://www.modelscope.cn/models/Eco-Tech/Kimi-K3-w4a8-mxfp-quarot
    model_id: Eco-Tech/Kimi-K3-w4a8-mxfp-quarot
    precision: mxfp4
    label: MXFP4(ASCEND)
    supported_hardware:
      - ascend_950dt
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '131072'
      - '--max-num-batched-tokens'
      - '24576'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-processor-cache-gb'
      - '0'
      - '--additional-config'
      - '{"enable_cpu_binding":true, "enable_flashcomm1":true}'
      - '--mm-encoder-tp-mode'
      - data
      - '--limit-mm-per-prompt'
      - '{"vision_chunk": 2}'
      - '--allowed-local-media-path'
      - /
    extra_env:
      VLLM_USE_MODELSCOPE: 'true'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '800'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:kimi-k3-a5
    description: ModelSlim MXFP4 with QuaRot for Ascend 950DT (A5). Requires --quantization ascend. Checkpoint not yet public.

hardware_overrides:
  ascend_910c:
    extra_env:
      VLLM_USE_MODELSCOPE: 'true'

meta:
  hardware:
    ascend_910c: verified
    ascend_950dt: verified
strategy_hardware:
  single_node_tp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp_dp:
    ascend_910c: supported
    # A5 mixed serving: 4 nodes, DP4 / TP8 / EP32.
    ascend_950dt: supported
  multi_node_dep:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tep:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp_pp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  pd_cluster:
    ascend_910c: unsupported
    # PD separation is disabled on both Ascend profiles.
    ascend_950dt: unsupported
strategy_min_gpus:
  ascend_910c: 64
  ascend_950dt: 32
features:
  spec_decoding:
    hardware_overrides:
      npu:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"RedHatAI/Kimi-K3-speculator.dspark","num_speculative_tokens":7,"enforce_eager":true}'
      ascend_950dt:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark-Block5","num_speculative_tokens":7,"draft_sample_method":"greedy","enforce_eager":true}'

strategy_overrides:
  multi_node_tp_dp:
    hardware_overrides:
      ascend_910c:
        worker_args: ["--headless"]
      ascend_950dt:
        worker_args: ["--headless"]

guide_sections:
  section1: |
    ## Ascend mixed Prefill/Decode deployment

    KV Offload supports only **Off** on Ascend 910C (A3) and 950DT (A5).
    Simple, CPU offloading, Mooncake Store, and LMCache are unavailable for
    these recipe profiles.

    In the four-node A3/A5 mixed deployment, node 0 runs the API server and
    Nodes 1-3 join with `--headless` and their respective
    `--data-parallel-start-rank` values of 1, 2, and 3.
    Follow the [official mixed deployment reference](https://docs.vllm.ai/projects/vllm-ascend-cn/zh-cn/latest/tutorials/models/Kimi-K3.html#51-prefilldecode)
    for the per-node communication settings and startup order.

    PD separation is unavailable on Ascend 910C (A3) and 950DT (A5) in this recipe.
