# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/moonshotai/Kimi-K3.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
variants:
  ascend_w4a8:
    model_id: Eco-Tech/Kimi-K3-w4a8
    precision: int4
    label: W4A8 (Ascend)
    vram_minimum_gb: 1711
    supported_hardware:
      - ascend_910c
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '131072'
      - '--max-num-batched-tokens'
      - '24576'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-processor-cache-gb'
      - '0'
      - '--additional-config'
      - '{"enable_cpu_binding":true, "enable_flashcomm1":true}'
      - '--mm-encoder-tp-mode'
      - data
      - '--limit-mm-per-prompt'
      - '{"vision_chunk": 2}'
      - '--allowed-local-media-path'
      - /
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '800'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:kimi-k3-a3
    description: ModelSlim INT4 W4A8 for Ascend NPU. Requires --quantization ascend. Validated on 4× 910C mixed P/D.
meta:
  hardware:
    ascend_910c: verified
strategy_hardware:
  multi_node_tp_dp:
    ascend_910c: supported
  multi_node_dep:
    ascend_910c: unsupported
  multi_node_tp:
    ascend_910c: unsupported
  multi_node_tep:
    ascend_910c: unsupported
  multi_node_tp_pp:
    ascend_910c: unsupported
  pd_cluster:
    ascend_910c: unsupported
strategy_min_gpus:
  ascend_910c: 64
features:
  spec_decoding:
    hardware_overrides:
      npu:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"RedHatAI/Kimi-K3-speculator.dspark","num_speculative_tokens":7,"enforce_eager":true}'
