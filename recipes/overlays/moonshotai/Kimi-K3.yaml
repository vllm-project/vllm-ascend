# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/moonshotai/Kimi-K3.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
variants:
  ascend_w4a8:
    # https://www.modelscope.cn/models/Eco-Tech/Kimi-K3-w4a8
    model_id: Eco-Tech/Kimi-K3-w4a8
    precision: int4
    label: W4A8 (Ascend)
    vram_minimum_gb: 1711
    supported_hardware:
      - ascend_910c
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '131072'
      - '--max-num-batched-tokens'
      - '24576'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-processor-cache-gb'
      - '0'
      - '--additional-config'
      - '{"enable_cpu_binding":true, "enable_flashcomm1":true}'
      - '--mm-encoder-tp-mode'
      - data
      - '--limit-mm-per-prompt'
      - '{"vision_chunk": 2}'
      - '--allowed-local-media-path'
      - /
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '800'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:kimi-k3-a3
        docker_serve_command: vllm serve
    description: ModelSlim INT4 W4A8 for Ascend NPU. Requires --quantization ascend. Validated on 4× 910C mixed P/D.

  ascend_mxfp:
    # https://www.modelscope.cn/models/Eco-Tech/Kimi-K3-w4a8-mxfp-QuaRot
    model_id: Eco-Tech/Kimi-K3-w4a8-mxfp-QuaRot
    precision: mxfp4
    label: MXFP (Ascend)
    # Size from the checkpoint index: ceil(1519.133 GB of tensors x 1.2).
    vram_minimum_gb: 1823
    supported_hardware:
      - ascend_950dt
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '131072'
      - '--max-num-batched-tokens'
      - '24576'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-processor-cache-gb'
      - '0'
      - '--additional-config'
      - '{"enable_cpu_binding":true, "enable_flashcomm1":true}'
      - '--mm-encoder-tp-mode'
      - data
      - '--limit-mm-per-prompt'
      - '{"vision_chunk": 2}'
      - '--allowed-local-media-path'
      - /
    extra_env:
      VLLM_USE_MODELSCOPE: 'True'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '800'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    install:
      docker:
        command: docker pull quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        note: Pull this vLLM Ascend image on each Ascend 950DT host.
      pip: false
    hardware_overrides:
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:v0.32.0rc1-a5
        docker_serve_command: vllm serve
    description: ModelSlim MXFP with QuaRot for Ascend 950DT (A5). Requires --quantization ascend. The checkpoint is available on ModelScope.

meta:
  hardware:
    ascend_910c: verified
    ascend_950dt: supported
strategy_hardware:
  single_node_tp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp_dp:
    ascend_910c: supported
    # A5 mixed serving: 4 nodes, DP4 / TP8 / EP32.
    ascend_950dt: supported
  multi_node_dep:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tep:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp_pp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  pd_cluster:
    ascend_910c: unsupported
    ascend_950dt: supported
strategy_min_gpus:
  ascend_910c: 64
  ascend_950dt: 32
features:
  spec_decoding:
    hardware_overrides:
      npu:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"RedHatAI/Kimi-K3-speculator.dspark","num_speculative_tokens":7,"enforce_eager":true}'
      ascend_950dt:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark-Block5","num_speculative_tokens":7,"draft_sample_method":"greedy","enforce_eager":true}'

presets:
  ascend_a5_mxfp_4p4d:
    label: 950DT MXFP 4P4D 1M (PP4 Prefill / DP4 Decode)
    hardware: ascend_950dt
    strategy: pd_cluster
    router_port: 1999
    variants: [ascend_mxfp]
    default: true
    description: >-
      Four Prefill and four Decode hosts with eight NPUs per host. Prefill uses
      DP1 / TP8 / PP4 with one HTTP endpoint. Decode uses DP4 / TP8 / DCP8
      with one external DP rank and one HTTP endpoint per host.
    source:
      label: vLLM Ascend Kimi-K3 deployment tutorial
      href: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Kimi-K3.html#53-long-context-and-1m-pd-separation-deployment
    select:
      pd_router: ascend
      pd_connector: mooncake_ascend
      frontend: python
      kv_offload: 'off'
      features:
        tool_calling: true
        reasoning: true
        spec_decoding: true
    args:
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8000'
      - '--served-model-name'
      - kimi-k3
      - '--seed'
      - '1024'
      - '--max-model-len'
      - '1048576'
      - '--max-num-seqs'
      - '32'
      - '--tokenizer-mode'
      - kimi_k3
      - '--mm-processor-cache-gb'
      - '1'
      - '--skip-mm-profiling'
    remove_args:
      - '--allowed-local-media-path'
      - '--no-disable-hybrid-kv-cache-manager'
    env:
      GLOO_SOCKET_IFNAME: $IFACE_NAME
      HCCL_SOCKET_IFNAME: $IFACE_NAME
      HCCL_OP_EXPANSION_MODE: CCU_SCHED
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
    json_args:
      '--speculative-config':
        num_speculative_tokens: 7
        draft_tensor_parallel_size: 8
        enforce_eager: false
    roles:
      prefill:
        nodes: 4
        parallelism: tep
        tp: 8
        pp: 4
        args:
          - '--data-parallel-size'
          - '1'
          - '--distributed-executor-backend'
          - mp
          - '--master-port'
          - '41000'
          - '--enforce-eager'
          - '--max-num-batched-tokens'
          - '16384'
          - '--gpu-memory-utilization'
          - '0.80'
          - '--additional-config'
          - '{"enable_flashcomm1":true,"multistream_overlap_shared_expert":false,"enable_fused_mc2":2,"enable_shared_expert_dp":true}'
        remove_args:
          - '--compilation-config'
          - '--disable-flashinfer-autotune'
        env:
          HCCL_IF_IP: $PREFILL_NODE_1
          VLLM_HOST_IP: $PREFILL_NODE_1
          VLLM_PP_LAYER_PARTITION: '24,24,24,21'
          PYTHONHASHSEED: '0'
        json_args:
          '--speculative-config':
            enforce_eager: true
          '--kv-transfer-config':
            MooncakeConnectorV2:
              kv_port: 30100
      decode:
        nodes: 4
        parallelism: dep
        tp: 8
        pp: 1
        args:
          - '--data-parallel-rpc-port'
          - '12321'
          - '--decode-context-parallel-size'
          - '8'
          - '--block-size'
          - '768'
          - '--cp-kv-cache-interleave-size'
          - '768'
          - '--max-num-batched-tokens'
          - '768'
          - '--gpu-memory-utilization'
          - '0.90'
          - '--compilation-config'
          - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          - '--additional-config'
          - '{"enable_mlapo":true,"multistream_overlap_shared_expert":true,"scheduler_config":{"recompute_scheduler_enable":true}}'
        remove_args:
          - '--data-parallel-hybrid-lb'
          - '--no-enable-prefix-caching'
        env:
          HCCL_IF_IP: $DECODE_NODE_1
          VLLM_HOST_IP: $DECODE_NODE_1
        json_args:
          '--kv-transfer-config':
            MooncakeConnectorV2:
              kv_port: 30300
    runbook: |
      Assign `PREFILL_NODE_1` through `PREFILL_NODE_4` and `DECODE_NODE_1` through
      `DECODE_NODE_4` to the hosts' data-network IPs. Set `IFACE_NAME` to the
      data interface.

      Before starting vLLM manually, add the Mooncake library directory
      inside each worker container.

      ```bash
      export LD_LIBRARY_PATH="/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      ```

      If an HTTP proxy is configured, include the worker and Router addresses
      in both `NO_PROXY` and `no_proxy` for direct HTTP traffic between hosts.

      Start all four Prefill pipeline stages with the shared rendezvous at
      `PREFILL_NODE_1:41000`. Only the rank-0 Prefill node serves HTTP on port
      8000. Start one Decode DP rank per host with `DECODE_NODE_1:12321` as the
      DP coordinator. All four Decode ranks serve HTTP on port 8000. Mooncake
      KV port bases are 30100 for Prefill and 30300 for Decode.

      Stage the Kimi-K3 MXFP checkpoint and the Kimi-K3 DSpark draft on every
      host. If serving from disk, mount both directories at the same container
      paths on every host and substitute those paths for the model IDs in the
      worker commands. Once all eight workers are healthy, start the Ascend
      Router on port `1999`, then send a request with model `kimi-k3` and
      confirm KV transfer.

      Section 5.3 of the linked tutorial configures 1,048,576 tokens for input
      and output combined and enables DCP8 on Decode. Reserve space for the
      generated response when validating long-context requests.

hardware_notes:
  ascend_950dt:
    title: Checkpoint memory estimate
    body: The 1823 GB estimate uses the indexed MXFP checkpoint tensor size plus 20% headroom, rounded up.

guide_sections:
  section1: |
    ## Ascend mixed Prefill/Decode deployment

    For the four-node A3/A5 mixed deployment, follow the
    [official mixed deployment reference](https://docs.vllm.ai/projects/vllm-ascend-cn/zh-cn/latest/tutorials/models/Kimi-K3.html#51-prefilldecode)
    for the per-node launch commands, communication settings, and startup order.
    Only node 0 serves HTTP. Append `--headless` to the generated commands for
    nodes 1–3.

    Download the [A3 W4A8](https://www.modelscope.cn/models/Eco-Tech/Kimi-K3-w4a8)
    or [950DT MXFP](https://www.modelscope.cn/models/Eco-Tech/Kimi-K3-w4a8-mxfp-QuaRot)
    checkpoint from ModelScope. The worker environment uses ModelScope for
    model IDs, including the draft model when speculative decoding is enabled.

    The 950DT MXFP 4P4D preset provides a separate eight-node configuration
    with direct Mooncake KV transfer. See the preset runbook for startup and
    verification steps.
