# Source: https://github.com/vllm-project/vllm/blob/52a65d7b19e9e3ad86bf1e3b6954e4e11eeec7da/recipes/models/moonshotai/Kimi-K3.yaml
# Extracted with vllm-project/recipes@b08ad73889f9e33319d8ac9c887dec6a0975c55d.
# A5 profile: https://github.com/vllm-project/vllm/pull/62668
variants:
  ascend_w4a8:
    model_id: Eco-Tech/Kimi-K3-w4a8
    precision: int4
    label: W4A8 (Ascend)
    vram_minimum_gb: 1711
    supported_hardware:
      - ascend_910c
      - ascend_950dt
    extra_args:
      - '--quantization'
      - ascend
      - '--enable-prefix-caching'
      - '--enable-expert-parallel'
      - '--max-num-seqs'
      - '16'
      - '--max-model-len'
      - '131072'
      - '--max-num-batched-tokens'
      - '24576'
      - '--gpu-memory-utilization'
      - '0.9'
      - '--compilation-config'
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - '--mm-processor-cache-gb'
      - '0'
      - '--additional-config'
      - '{"enable_cpu_binding":true, "enable_flashcomm1":true}'
      - '--mm-encoder-tp-mode'
      - data
      - '--limit-mm-per-prompt'
      - '{"vision_chunk": 2}'
      - '--allowed-local-media-path'
      - /
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      TASK_QUEUE_ENABLE: '1'
      HCCL_BUFFSIZE: '800'
      VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    hardware_overrides:
      ascend_910c:
        docker_image: quay.io/ascend/vllm-ascend:kimi-k3-a3
      ascend_950dt:
        docker_image: quay.io/ascend/vllm-ascend:kimi-k3-a5
    description: ModelSlim INT4 W4A8 for Ascend NPU. Requires --quantization ascend. Validated on 4× 910C mixed P/D.
meta:
  hardware:
    ascend_910c: verified
    ascend_950dt: verified
strategy_hardware:
  single_node_tp:
    ascend_950dt: unsupported
  multi_node_tp_dp:
    ascend_910c: supported
    # A5 mixed serving: 4 nodes, DP4 / TP8 / EP32.
    ascend_950dt: supported
  multi_node_dep:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tep:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  multi_node_tp_pp:
    ascend_910c: unsupported
    ascend_950dt: unsupported
  pd_cluster:
    ascend_910c: unsupported
    # A5 target: P DP1/TP8/PP4/EP8; D DP4/TP8/EP32 (4 nodes per role).
    # Role-specific PD command generation will be adapted separately.
    ascend_950dt: supported
strategy_min_gpus:
  ascend_910c: 64
  ascend_950dt: 32
features:
  spec_decoding:
    hardware_overrides:
      npu:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"RedHatAI/Kimi-K3-speculator.dspark","num_speculative_tokens":7,"enforce_eager":true}'
      ascend_950dt:
        args:
          - '--speculative-config'
          - '{"method":"dspark","model":"Inferact/Kimi-K3-DSpark-Block5","num_speculative_tokens":7,"draft_sample_method":"greedy","enforce_eager":true}'
