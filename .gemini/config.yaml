# https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github
have_fun: false
memory_config:
  disabled: false
code_review:
  comment_severity_threshold: HIGH  # Reduce quantity of comments
  max_review_comments: 10           # Avoid comment flooding on large PRs
  pull_request_opened:
    summary: false  # PR descriptions are agent-generated and follow the template already
ignore_patterns:
  - "tests/e2e/**"  # Requires NPU hardware; CI validates
