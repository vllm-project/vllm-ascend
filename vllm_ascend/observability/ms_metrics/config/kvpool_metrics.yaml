# KV Pool. Per-key put results returned by the Ascend store backends, plus the
# blocks that failed to load back into the engine.

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.backend.memcache_backend:MemcacheBackend.put
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_pool_put_failure_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.backend.mooncake_backend:MooncakeBackend.put
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_pool_put_failure_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.backend.yuanrong_backend:YuanrongBackend.put
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_pool_put_failure_handler

- symbol: vllm_ascend.distributed.kv_transfer.kv_pool.ascend_store.pool_worker:KVPoolWorker.get_block_ids_with_load_errors
  handler: vllm_ascend.observability.ms_metrics.handlers:kv_pool_load_error_handler
