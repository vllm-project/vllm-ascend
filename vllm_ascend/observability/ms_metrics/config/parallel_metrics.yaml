# Sequence parallelism. sp_padding_mask is called once per model forward, so the
# ratio is a per-step sample.
# MoE comm selection is exposed by the upstream platform hook, which runs once
# per forward context; select_moe_comm_method is not mounted (no per-step V2 call).

- symbol: vllm_ascend.models.common.ops.sequence_parallel:sp_padding_mask
  handler: vllm_ascend.observability.ms_metrics.handlers:sp_padding_handler

- symbol: vllm_ascend.platform:NPUPlatform.set_additional_forward_context
  handler: vllm_ascend.observability.ms_metrics.handlers:moe_comm_selection_handler
