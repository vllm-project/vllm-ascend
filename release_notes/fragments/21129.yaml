pr: 21129
entries:
  - category: feature
    text: Added DeepSeek V4.1 decoder bounded replay with sequence parallelism on Model Runner V2 and PCP size 1, redistributing only retained rows between the original and compact SP layouts. Active replay batches run eagerly while ordinary decode keeps full model compilation; adaptive verification remains unsupported on this path.
    model: deepseek-v4.1
  - category: bugfix
    text: Fixed non-SP DeepSeek V4.1 bounded replay being skipped after torch.compile warmup. Active replay batches use the current replay state through eager execution, while ordinary decode retains full model compilation.
    model: deepseek-v4.1
