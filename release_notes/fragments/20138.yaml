pr: 20138
entries:
  - category: performance
    text: >-
      rare_chars collects top-1 and chosen logprobs without a host sync before
      the sampler returns. Sampled ids stay on device, the pair is copied with
      the token ids, and one rc4 step scores every live request together.
  - category: performance
    text: >-
      rare_chars pair D2H and rc4 feed run on a dedicated wait queue by default
      so get_output does not block on the pair copy. Request finish flushes
      look-ahead only after those jobs drain (set VLLM_ASCEND_RARE_PAIR_SYNC=1
      to force the old inline path).
