pr: 22489
entries:
  - category: performance
    text: >-
      Added an integrated Qwen3.5-family GDN optimization path for A3, including
      per-forward MRoPE lookup reuse and fused attention output gating.
      Corrected duplicate beta sigmoid in chunk GDN and disabled recurrent
      preprocessing fusion pending numerical validation. Recurrent calls retain
      external preprocessing and contiguous QKV with the installed FLA kernel.
    hardware: [A3]
