pr: 22489
entries:
  - category: performance
    text: >-
      Added an integrated Qwen3.5-family GDN optimization path for A3, including
      per-forward MRoPE lookup reuse and fused attention output gating.
      Corrected duplicate beta sigmoid in chunk GDN and enabled recurrent
      preprocessing fusion for the verified A3 FLA 0058bb4 wheel with input
      contract checks and compatibility fallbacks. Rebuilds npugraph_ex cached
      callables to preserve AOT runtime semantics.
    hardware: [A3]
  - category: performance
    text: >-
      Avoided redundant output clones around fused GDN preparation in
      AOT-compiled prefill by using a functional custom operator. Added bounded
      full-row Triton tiles for large preparation batches while preserving
      the small-batch and caller-supplied output-buffer paths.
    hardware: [A3]
