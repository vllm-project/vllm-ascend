pr: 21901
entries:
  - category: performance
    text: Qwen4Exp HyperConnection gate-mix now processes eight rows per Triton program for prefill batches of at least 1024 rows, reducing the number of launched programs by up to 8x and amortizing scheduling overhead while preserving the original FP32 accumulation order. Smaller batches retain the one-row path, and the row-block path is enabled on Ascend A2, A3, and A5.
    model: qwen4exp
    hardware: [A2, A3, A5]
