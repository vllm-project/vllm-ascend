pr: 22747
entries:
  - category: feature
    text: >-
      External DP deployments can now combine `--pcp-size` and `--pp-size`,
      with device allocation accounting for TP, PCP, and PP; omitted PCP/PP
      options default to 1 in the launcher.
      Shell templates now receive nine arguments, with PCP at argument 8 and PP
      at argument 9; append `1 1` to direct seven-argument template calls.
      Ctrl+C, SIGTERM, or a launch exception now stops the started rank process
      groups, with a 10-second cleanup period before remaining processes are
      forcibly stopped.
