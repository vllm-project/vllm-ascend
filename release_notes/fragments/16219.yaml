pr: 16219
entries:
  - category: feature
    text: Added NPU graph writeback and per-rank fused-overlap membership staging for the Mooncake sparse KV offload backend.
  - category: performance
    text: >-
      Fused-overlap sparse decode combines current-token K and RoPE hot-buffer
      writes into one Triton kernel for supported layouts with either
      MemFabric or Mooncake. Unsupported layouts fall back to native scatter.
