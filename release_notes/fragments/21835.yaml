pr: 21835
entries:
  - category: feature
    text: >-
      Added GLM-5.3-Flash decode context parallel execution for A3/A5, with
      sharded MLA and pooled indexer caches and candidate-only exchange.
      Supports joint PCP and DCP with DCP=PCP or DCP=TP*PCP, including MTP,
      decode graph replay and prefix reuse. Reduces local indexer heads before
      PCP communication to exchange one FP32 weighted query instead of separate
      multi-head queries and weights. RecoverSSM retains its existing
      PCP execution restrictions.
    model: GLM-5.3-Flash
    hardware: [A3, A5]
