pr: 23065
entries:
  # category: feature | hardware | performance | dependency | breaking | config | documentation | bugfix | other
  - category: bugfix
    text: >-
      vLLM Ascend now refuses to start when cudagraph_mode=FULL is combined
      with a head-major KV cache layout (VLLM_KV_CACHE_LAYOUT=HND, LBHNC
      or BLHNC). Previously the engine started and then crashed the NPU stream
      with device error 507011 at the first replayed prefill graph. Users
      hitting the new startup error should switch to
      cudagraph_mode=FULL_DECODE_ONLY (the supported graph mode for this
      layout) or unset VLLM_KV_CACHE_LAYOUT to keep the default layout.
