pr: 23065
entries:
  # category: feature | hardware | performance | dependency | breaking | config | documentation | bugfix | other
  - category: bugfix
    text: >-
      vLLM Ascend now refuses to start when cudagraph_mode=FULL is combined
      with the KV cache layout VLLM_KV_CACHE_LAYOUT=HND or LBHNC instead of
      failing later, with device error 507011 on a build that includes the
      head-major KV cache read fix of vllm-ascend #22649, or with attention
      error 561002 in every graph mode without it. Keep the default layout
      (unset VLLM_KV_CACHE_LAYOUT; LBNHC or NHD) to use cudagraph_mode=FULL;
      the head-major layout works only together with that fix, and then with
      cudagraph_mode=FULL_DECODE_ONLY. BLHNC is refused with
      cudagraph_mode=FULL as a validation restriction because its storage
      layout depends on the attention backend and the combination is
      unvalidated, not because it was shown to crash.
