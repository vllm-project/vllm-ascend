pr: 22505
entries:
  - category: bugfix
    text: >-
      Fixed DeepSeek V4 LoRA adapters for the main and indexer compressor wkv/wgate
      projections and grouped wo_a projection being silently ignored. These adapters
      now affect their selected requests, including batches mixed with base-model requests.
      DSA multi-stream overlap is automatically disabled with --enable-lora for
      correctness, which can reduce throughput.
  - category: breaking
    text: >-
      DeepSeek V4 with LoRA now fails at initialization for unsupported context-parallel
      or fine-grained output-projection exchanges that could misapply adapter mappings.
      Set --prefill-context-parallel-size and --decode-context-parallel-size to 1 and keep
      finegrained_tp_config.oproj_tensor_parallel_size=1 in --additional-config (the defaults);
      configurations with these exchanges enabled must be changed before restarting.
