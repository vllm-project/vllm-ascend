entries:
  - category: performance
    text: >-
      Eligible GLM-5.3-Flash PCP prefill automatically overlaps KPool and main KV
      communication and uses KDA output ReduceScatter. MoE AllGather paths
      gather row-local routes across DP, PCP and sequence-parallel layouts,
      with lossless route packing, and overlap DP/PCP hidden communication
      with the gate during eager execution. End-to-end text equivalence
      remains under validation.
