# Release note fragment. See release_notes/README.md.
pr: 19776
entries:
  - category: config
    text: >
      Ascend-owned MS Service Metrics follow runtime_config.json metrics.level
      (off, basic, detail, or debug; default basic). Hot-reload updates the
      level in each process. The default still records the EPLB hotness
      metrics shipped today.
  - category: feature
    text: >
      Add the lifecycle:sleep:freed_gb histogram so each sleep level reports
      the memory released by NPUWorker.sleep.
  - category: feature
    text: >
      Add the kvpool:put_failure_keys_total counter so the Ascend store
      backends report how many keys failed to be written.
  - category: feature
    text: >
      Add the kvpool:load_error_blocks_total counter so KV Pool load failures
      are reported, and cover the Yuanrong backend in the put failure counter.
  - category: feature
    text: >
      Add the parallel:sp_padding_ratio histogram so the tokens padded away by
      sequence-parallel sharding are visible per step, and the
      parallel:moe_comm_selection_total counter for the MoE communication
      method chosen each forward context.
