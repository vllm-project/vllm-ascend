pr: 20361
entries:
  - category: bugfix
    text: Added a DSpark adaptive GDN verification path that reuses vLLM's strided recurrent implementation, preserves accepted-state offsets and device query boundaries, and avoids redundant gathers for pure speculative batches. Registered the initialization capabilities, handled empty logical graph batches, and removed unused native query-length metadata from adaptive steps. The 310P recurrent backend remains unsupported for adaptive verification.
