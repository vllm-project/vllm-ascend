pr: 23335
entries:
  - category: performance
    text: GDN RecoverSSM users can opt into grouped recovery graph replay and Qwen4Exp MTP overlap through gdn_recoverssm_execution_config. Recovery graphs are prepared at startup, with measured memory reserved before KV allocation. Both execution options are disabled by default; async overlap currently requires PP=PCP=DCP=1 and decode without prefix caching.
