pr: 21668
entries:
  - category: feature
    text: >-
      Added online quantization of the drafter's LM head for speculative
      decoding on Model Runner V2 (EAGLE/EAGLE3/MTP/DSpark drafters that
      share the target model's LM head): set "draft_lm_head_quantization"
      to "mxfp8" on A5 or "int8" on A2/A3 inside --speculative-config;
      off by default. The quantized draft head stores its weights in
      8-bit, roughly halving its memory footprint and per-step GEMM cost,
      with acceptance-length loss under 0.1% and zero score regressions
      in 100-question GSM8K A/B runs on both device classes. The upstream
      "fp8"/"nvfp4" formats are rejected with an error pointing to the
      Ascend formats; 310P is not supported.
    hardware: [A2, A3, A5]
