pr: 22569
entries:
  - category: performance
    text: >-
      Added a fused MLA prologue for eligible DeepSeek-V4.1-Flash batches on
      Atlas A3. Eligible batches use it automatically with framework KV writes
      for eager prefill or fused KV writes for pure decode in eager and full
      decode-only ACL Graph modes. The fusion requires weight_nz_mode=1.
    model: DeepSeek-V4.1-Flash
    hardware: [A3]
