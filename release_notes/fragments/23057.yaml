pr: 23057
entries:
  - category: feature
    text: >-
      Requests waiting on asynchronous KV cache loads are now throttled and
      scheduled to completion instead of stalling in the waiting queue when
      `--max-num-inflight-kv-loads` is set with `enable_balance_scheduling`,
      `dyntra_lb_config`, or `recompute_scheduler_enable`.
  - category: bugfix
    text: >-
      Fixed prompts being unexpectedly split by `--long-prefill-token-threshold`
      or encoder cache pressure when chunked prefill is disabled
      (`enable_chunked_prefill=False`) with `enable_balance_scheduling`,
      `dyntra_lb_config`, or `recompute_scheduler_enable` enabled.
