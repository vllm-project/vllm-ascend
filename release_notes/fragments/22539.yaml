pr: 22539
entries:
  - category: performance
    text: Improved A3 W4A8/W8A8 All2AllV MoE dispatch for batches of 1024 rows or more by fusing token routing with INT8 activation quantization. Native-operator probes on 1024-8192 rows show 1.314x to 2.456x speedups; the official Qwen3.8-Flash-Next W4A8 TP2 serving A/B with 1024/128 input/output tokens recorded 1.33% higher output throughput and 1.42% lower mean TPOT. Smaller batches, FP8/MXFP, LoRA, and other hardware are unchanged.
    hardware: [A3]
