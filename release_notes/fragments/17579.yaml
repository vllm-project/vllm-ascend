pr: 17579
entries:
  - category: performance
    text: >-
      With asynchronous EPLB enabled, DeepSeek-V4.1-Flash W8A8 on Atlas A3
      (DP2/TP8/EP16) served GSM8K at concurrency 16 with output throughput
      increasing from 188.11 to 201.95 tokens/s (+7.36%).
      Across 28 graph-replay shapes, the EPLB expert-mapping kernel achieved
      a mean speedup of 3.28x on A3 and 1.25x on A5 (950DT).
    model: deepseek-v4.1-flash
    hardware: [A3, A5]
