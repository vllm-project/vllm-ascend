pr: 23310
entries:
  - category: feature
    text: >-
      Qwen4Exp models can opt into RecoverSSM with --use-replayssm. The
      gdn_recoverssm_backend additional configuration selects Triton, TileLang,
      or AscendC with the required optional operators installed. PLE keeps its
      ordinary convolution state, and Mooncake V2 transfers only persistent
      convolution/checkpoint state so a prefill worker without RecoverSSM can
      feed a compatible RecoverSSM decoder while replay records stay local.
