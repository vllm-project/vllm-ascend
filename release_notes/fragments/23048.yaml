pr: 23048
entries:
  - category: feature
    text: >-
      Added native Messages and synchronous Responses forwarding to the PD
      example proxy, including prefiller cache usage reporting and whole-request
      retries when the backend exposes a recomputed stop reason. Native SSE is
      buffered until decoding finishes to avoid duplicate output on retries.
      Responses requires explicit history, does not support background mode or
      previous_response_id, and needs backend stop-reason exposure for recompute
      retries.
