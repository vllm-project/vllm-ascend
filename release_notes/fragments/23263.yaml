pr: 23142
entries:
  - category: feature
    text: Added opt-in HiSparse for single-node GLM-5.3-Flash inference on Ascend 950DT with FP8 KV cache. The existing HiSparse configuration also recognizes compatible native SFA and recurrent-state layouts when speculative decoding is disabled. Both layouts require the verified vLLM main pin with Mamba cache fitting.
