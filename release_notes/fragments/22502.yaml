pr: 22502
entries:
  - category: feature
    text: >-
      Added an opt-in owner-sharded KV cache for DeepSeek V4.1 Flash prefill context parallelism on
      A3. Each PCP rank keeps only its share of the KV cache while attention addresses the full
      logical range, cutting per-rank KV HBM by about 70% in the validated configuration with
      prefill TTFT within roughly 3% of the replicated baseline.
    model: deepseek-v4.1
    hardware: [A3]
  - category: config
    text: >-
      Added `additional_config.pcp_config` (a typed sub-config) to select owner-sharded PCP KV
      placement, local index placement, local KV writes, prefill staging, capacity planning, and
      device-time attribution for DeepSeek V4.1. `pcp_config.kv_sharing` defaults to
      `"replicated"` and every other switch defaults to `false`, so omitting the key preserves the
      previous behavior. Configure it as
      `"pcp_config": {"kv_sharing": "owner", "owner_capacity": true, "owner_stage": true}`.
      MIGRATION: the untyped `VLLM_ASCEND_PCP_KV_SHARING`, `VLLM_ASCEND_PCP_OWNER_*`,
      `VLLM_ASCEND_PCP_LOCAL_*`, and `VLLM_ASCEND_PCP_TIMING` environment variables and the
      top-level `pcp_kv_sharing` / `pcp_owner_placement` keys were removed; move each to the
      matching `pcp_config` field (`owner_capacity`, `local_index`, `local_kv_write`,
      `local_kv_write_source`, `owner_stage`, `owner_stage_bytes`, `owner_stage_swa_chunk`,
      `owner_stage_swa_chunk_bytes`, `owner_placement`, `enable_timing`). The diagnostic-only
      `VLLM_ASCEND_PCP_OWNER_STAGE_SWA`, `_CPUPLAN`, `_SWA_CHUNK_DEBUG`, `_MAX_SLABS`, and
      `_LOCAL_VMM` switches were removed without a replacement. Decode is unchanged.
