pr: 16335
entries:
  - category: performance
    text: >-
      Reduced MRoPE preparation cost for eligible multi-axis Qwen3-VL and
      Qwen3.5 calls by eliminating per-token cos/sin cache gathering. In a
      Qwen3.5 BF16 single-token decode benchmark on Ascend 910B3 using
      warmed-up ACLGraph replay, median preparation-chain device time fell
      from 15.621 µs to 7.616 µs (51.2% lower) across three rounds of
      1,500 calls each. The inline path is selected automatically for
      eligible calls, with no configuration required.
