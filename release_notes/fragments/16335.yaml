pr: 16335
entries:
  - category: performance
    text: >-
      Reduced MRoPE preparation time during decode for Qwen3-VL and Qwen3.5.
      In an Ascend 910B3 benchmark over 490 steady-state calls, device time
      per call for the full MRoPE preparation chain fell from 24.999 µs to
      6.637 µs (73.5% lower). The optimization applies automatically and
      requires no configuration change.
