pr: 21294
entries:
  - category: feature
    text: Added shared-layer KV offload for full/shared sparse attention models with native CPU-worker Decode graph replay, independent TopK and hot-cache capacity, and rank-local pinned Host KV pools. In disaggregated serving, shared-layer KV goes through the Decode device before a local Host copy.
    hardware: [A3, A5]
  - category: performance
    text: Reduced selective KV Decode overhead with persistent free slots and timestamp LRU, lazy selected-page validation, reuse of validated hot slots and per-request token markers, stable request metadata, CPU-precomputed tail slots, and independent Host staging for each TP rank and shared layer.
    hardware: [A3]
