pr: 21820
entries:
  - category: performance
    text: >-
      Fused Qwen GDN QKVZ and BA projection unpacking with output-buffer
      initialization to remove three Slice launches and one ZerosLike launch
      from the decode path, and taught gated RMSNorm to consume the strided Z
      view directly to remove its post-recurrent Slice launch.
  - category: performance
    text: >-
      Removed Qwen QSA output TensorMove launches by writing GBSA directly into
      the graph-owned attention buffer and keeping the output projection outside
      the eager multi-stream core.
