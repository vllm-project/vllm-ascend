pr: 20400
entries:
  - category: feature
    text: The `enable_flashcomm1` switch now enables dense sequence parallelism for every dense decoder family (Llama, Qwen2/Qwen3 dense, GLM dense, dense Qwen3.5 with GDN linear-attention layers, and others) instead of only the Qwen3.5 family. Hidden states and the residual stay token-sharded across the decoder stack through generic projection gather/scatter wiring, with no per-model switches. Requires `tensor_parallel_size > 1` and `pipeline_parallel_size == 1`; the runner pads each step's token count to the TP multiple so padding rows flow like graph-bucket padding. MTP speculative decoding (`qwen3_5_mtp`) coexists with dense SP under the V2 model runner (the drafter restores full rows from the shared embedding's token shard). Numerics are equivalent to the all-reduce layout.
    hardware: [A3, A5]
