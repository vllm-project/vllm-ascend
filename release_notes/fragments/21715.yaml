pr: 21715
entries:
  - category: feature
    text: >-
      Fused matmul-collective ops (AllGather+Matmul, Matmul+ReduceScatter) for
      dense sequence parallelism on Qwen3.5 family attention projections and
      dense MLP. Extends the fusion to the MoE shared-expert path: the
      shared expert's gate_up_proj AllGather and down_proj ReduceScatter are
      folded into their GEMMs, with the Qwen3-Next output gate reordered to
      run on the SP shard before the fused AG and after the fused RS.
    model: qwen3.5, qwen3.6
    hardware: [A2, A3]
