pr: 17715
entries:
  - category: feature
    text: >-
      Added native Messages and synchronous Responses API forwarding to the
      disaggregated prefill proxy example, including prefiller cache usage reporting.
      Use these routes for evaluation and testing; Responses requires explicit
      conversation history and does not support background mode or previous_response_id.
  - category: feature
    text: >-
      With matching Ascend backends, native Messages and Responses requests in the
      example proxy can retry decode recomputation through the load balancer.
      Text replies can continue from visible output with the remaining token
      budget. Interrupted tool-call and thinking fragments are discarded;
      only visible text is used to continue generation. Retries retain the original tool configuration,
      so a server-side tool may run again.
