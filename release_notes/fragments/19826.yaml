pr: 19826
entries:
  - category: bugfix
    text: >-
      Fixed NPU selection in Mooncake layerwise and SFA Remote D2H sender
      threads when using --device-ids. Mooncake sender initialization failures
      now propagate instead of hanging. Fixed overlapping CPU cache
      partitions in non-replicated native tiering offload with non-contiguous
      or reordered device IDs.
