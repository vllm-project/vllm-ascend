pr: 22609
entries:
  - category: feature
    text: >-
      DeepSeek V4.1 on A3 can offload independent BF16 input embeddings to
      pinned host memory to free device memory for KV cache. Enable
      input_embedding_host_vmm in --additional-config with Model Runner V2
      for Prefill, Decode, or colocated serving.
    model: DeepSeek V4.1
    hardware: [A3]
