entries:
  - category: hardware
    text: >-
      Added an Ascend 910C recipe variant for DeepSeek-V3.1 W8A8 MTP QuaRot
      with TP4xDP4 on one Atlas 800 A3, plus an opt-in W8A8 PD (2P1D
      Layerwise) preset for four-node Mooncake separation per the tutorial.
      Balance scheduling is enabled through `--additional-config
      '{"scheduler_config":{"enable_balance_scheduling":true}}'`.
