pr: 21116
entries:
  - category: feature
    text: >-
      The existing use_layerwise option now automatically selects the experimental
      cross_layer strategy for compatible shared-source models such as
      DeepSeek-V4.1 on Model Runner V2, while DS4 retains the physical-layer path.
      Explicit V1 and PIECEWISE configurations are rejected for cross-layer KV;
      use --enforce-eager.
    model: deepseek-v4.1
  - category: feature
    text: >-
      Experimental cross-layer target KV loads and ready-layer saves can overlap
      computation with DeepSeek-V4.1 DSpark on Model Runner V2.
      Draft and replay-cut saves plus GVA publication retain the final-step fence.
    model: deepseek-v4.1
  - category: other
    text: >-
      Shared-source scheduling reuses Memcache GVA keys, hit queries,
      descriptor builders and layerwise transfer threads, including ranged
      saves with final-step publication and standard connector interfaces for
      mixed or nested MultiConnector deployments.
      Source layers derive from model parameters without a new public switch;
      Mooncake retains its block-key path.
