pr: 21116
entries:
  - category: feature
    text: >-
      The existing use_layerwise option now automatically selects experimental
      cross-layer KV prefetch for compatible shared-source models such as
      DeepSeek-V4.1, while DS4 retains the physical-layer path.
    model: deepseek-v4.1
  - category: feature
    text: >-
      Experimental cross-layer target KV loads can run with DeepSeek-V4.1
      DSpark on the V2 model runner. Draft cache groups restore synchronously,
      and speculative saves retain bulk publication after draft preparation.
    model: deepseek-v4.1
  - category: other
    text: >-
      Memcache 1.3 retains atomic bulk saves because incremental saves require
      exclusive allocation. Source layers derive from model parameters, and
      registered consumer hooks are validated before enabling pipelined loads.
