pr: 21116
entries:
  - category: feature
    text: >-
      The existing use_layerwise option now automatically selects experimental
      cross-layer KV prefetch for compatible shared-source models such as
      DeepSeek-V4.1, while DS4 retains the physical-layer path.
    model: deepseek-v4.1
  - category: feature
    text: >-
      Experimental cross-layer target KV loads can run with DeepSeek-V4.1
      DSpark on the V2 model runner. Draft cache groups restore synchronously,
      and speculative saves use final-step GVA publication after draft preparation.
    model: deepseek-v4.1
  - category: other
    text: >-
      Experimental cross-layer target loads support PIECEWISE as well as eager
      execution, reusing ordinary layerwise graph boundaries. V2 Engram inputs
      refresh before replay, and bounded replay uses stable output buffers.
    model: deepseek-v4.1
  - category: other
    text: >-
      Shared-source scheduling reuses Memcache GVA keys, hit queries,
      descriptor builders and layerwise transfer threads, including ranged
      saves with final-step publication. Mooncake retains its block-key path.
      Source layers derive from model parameters; no new public switch is added.
