pr: 21508
entries:
  - category: feature
    text: >-
      Added opt-in INT8 quantized all-reduce on Atlas A5 with the same
      payload, dtype, shape and group-size routing as A2, including
      mixed prefill/decode batches.
    hardware: [A5]
  - category: feature
    text: >-
      Added MXFP8 AllToAll/AllGather with BF16 staging as the default
      quantized all-reduce backend on Atlas A5. Atlas A2 defaults to INT8;
      quantized_all_reduce_config.quant_dtype can override the hardware default.
    hardware: [A5]
  - category: feature
    text: >-
      Added optional two- or four-chunk MXFP8 communication pipelining on Atlas
      A5, configured with pipeline_chunks and a separate pipeline_min_numel
      threshold. Eager calls can overlap computation and communication while
      graph capture retains the existing whole-tensor path.
    hardware: [A5]
