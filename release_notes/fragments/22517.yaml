entries:
  - category: performance
    text: >-
      Qwen3.8-Flash-Next on A3 now uses fused HC execution; measured 128K-input,
      1K-output inference reduced median end-to-end latency by about 4% at
      concurrency 1 and 8 in the validated configuration. Install the matching
      TextGatedResidual CANN package and Torch extension before serving the model.
    model: Qwen3.8-Flash-Next
    hardware: [A3]
