pr: 1
entries:
  - category: feature
    text: >-
      Added experimental HiSparse P/D Pull over MemFabric, allowing Decode to load KV directly from Prefill.
      To enable this off-by-default feature, set `transfer_backend=memfabric` in `MooncakeConnectorV2`'s
      `kv_connector_extra_config`.
      Prefill and Decode may use different TP sizes, with PCP=1 on Decode and DCP=1 on Prefill.
