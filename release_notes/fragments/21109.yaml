pr: 21109
entries:
  - category: config
    text: >-
      AscendStore now reports async-loadable requests through the connector
      `may_load_async` hook, so the upstream `--max-num-inflight-kv-loads` cap
      applies to KV-pool async loads: hit requests can start loading while the
      running batch is full, and the number of loads holding KV blocks is
      bounded.
