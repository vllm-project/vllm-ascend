pr: 22330
entries:
  - category: bugfix
    text: >-
      DFlash and DFlash2 can select HND, LBHNC, NHD, or LBNHC through
      VLLM_KV_CACHE_LAYOUT without a target-model whitelist, subject to backend
      support. Fixed mixed-page cache planning for these layouts and added
      full-token dense draft KV storage for compatible DCP targets while
      keeping the draft at DCP=1. Compatible eager DFlash2 drafts can select the optional
      A2/A3 FA3 backend without a target-model whitelist.
