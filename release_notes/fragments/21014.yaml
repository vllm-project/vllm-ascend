pr: 21014
entries:
  - category: feature
    text: Enabled Mistral Large 4 Model Runner V2 graph execution and DSpark speculative decoding on Ascend.
    model: mistral-large-4
    hardware: [Ascend 950]
  - category: feature
    text: >-
      Mistral Large 4 now supports expert-parallelism load balancing (EPLB) on Ascend, which
      the adapter previously refused at startup.
    model: mistral-large-4
    hardware: [Ascend 950]
  - category: bugfix
    text: >-
      Corrected Mistral Large 4 sparse indexer rotary embeddings and aligned DSpark draft attention with its cache writer.
    model: mistral-large-4
    hardware: [Ascend 950]
  - category: bugfix
    text: >-
      Fixed Mistral Large 4 DSpark draft RoPE and BF16 weight loading, and enforced its
      sliding attention window in eager and graph decode without decode context parallelism.
      Fixed a draft graph replay crash when data-parallel synchronization reduces a dummy batch.
    model: mistral-large-4
    hardware: [Ascend 950]
  - category: performance
    text: >-
      Block-wise FP8 checkpoints now requantize to MXFP8 one row band at a time, so loading a
      MoE layer no longer holds a dense model-dtype copy of each expert. For a Mistral Large 4
      expert that staging buffer drops from 151 MB to 13 MB.
    hardware: [Ascend 950]
