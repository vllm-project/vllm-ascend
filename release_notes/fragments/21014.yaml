pr: 21014
entries:
  - category: feature
    text: Enabled Mistral Large 4 Model Runner V2 graph execution and DSpark speculative decoding on Ascend.
    model: mistral-large-4
    hardware: [Ascend 950]
  - category: bugfix
    text: >-
      Corrected Mistral Large 4 sparse indexer rotary embeddings and aligned DSpark draft attention with its cache writer.
    model: mistral-large-4
    hardware: [Ascend 950]
  - category: performance
    text: >-
      Block-wise FP8 checkpoints now requantize to MXFP8 one row band at a time, so loading a
      MoE layer no longer holds a dense model-dtype copy of each expert. For a Mistral Large 4
      expert that staging buffer drops from 151 MB to 13 MB.
    hardware: [Ascend 950]
