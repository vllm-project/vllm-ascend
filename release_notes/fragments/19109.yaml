pr: 19109
entries:
  - category: feature
    text: >-
      Added the platform-selected Ascend HiSparse backend and an explicit,
      source-checked A5 C8 optimization profile with reproducible source builds.
      Final P/D, accuracy and rebased-head model qualification remain pending.
  - category: performance
    text: >-
      Installed the A5 Host-writeback, descriptor, Resident-update, lazy-MTP,
      invalidation, metadata-view and group-prefetch implementation. Selection
      preserves the baseline by default and requires the reviewed Core sources.
  - category: bugfix
    text: >-
      Preserved external KV byte-allocation ownership and alignment, resolved
      native A5 FP8 operand types separately from byte storage, and isolated
      optional QSA requirements through backend capabilities. Prolog weight
      preparation retains its source Parameters and final NZ operands.
  - category: performance
    text: >-
      Reduced A5 HiSparse resolver submission ownership and current-metadata
      preparation, added exact large-write slot membership, and pinned
      reproduction to merged vLLM main. Component gains and matched-output
      model limitations are documented. The paired C4/32K-input/8K-output
      zero-miss run meets the 3% TPOT target; C8 miss optimization remains under
      evaluation. Existing Attention compute kernels are unchanged.
  - category: bugfix
    text: >-
      Kept unqualified MTP and graph layouts on the original preparation path,
      excluded packed C8 from the BF16-only eager shortcut, and accepted
      documentation or formatting changes to reviewed Core source contracts.
      New fallback configurations still require device/model qualification.
