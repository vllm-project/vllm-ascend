pr: 19000
entries:
  - category: feature
    text: >-
      Added opt-in INT8 quantized all-reduce on Atlas A5 with the same
      payload, dtype, shape and group-size routing as A2/A3, including
      mixed prefill/decode batches.
    hardware: [A5]
  - category: feature
    text: >-
      Added an optional MXFP8 AllToAll/AllGather backend on Atlas A5 alongside
      INT8, selected with quantized_all_reduce_config.quant_dtype. It uses
      BF16 dequantization and local SUM output on the existing process group.
    hardware: [A5]
  - category: feature
    text: >-
      Added optional two- or four-chunk MXFP8 communication pipelining on Atlas
      A5, configured with pipeline_chunks and a separate pipeline_min_numel
      threshold. Eager calls can overlap computation and communication while
      graph capture retains the existing whole-tensor path.
    hardware: [A5]
  - category: feature
    text: >-
      Added opt-in two- or four-chunk pipelining for shared-scale INT8 all-reduce
      through pipeline_chunks and pipeline_min_numel. Eager calls reuse one
      whole-input scale and overlap INT8 SUM with computation; graph capture
      retains the original whole-tensor INT8 path.
