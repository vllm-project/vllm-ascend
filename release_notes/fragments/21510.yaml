pr: 21510
entries:
  - category: feature
    text: >-
      GLM-5.3-Flash now supports joint tensor parallelism (TP) and prefill context
      parallelism (PCP), reducing per-device KDA weight and recurrent-state memory.
      This takes effect automatically when `--tensor-parallel-size` and
      `--prefill-context-parallel-size` are both greater than 1.
      The KDA head count must be divisible by TP x PCP.
    model: glm-5.3-flash
  - category: feature
    text: >-
      Experimental GLM-5.3-Flash RecoverSSM now supports TP > 1 with PCP > 1 on
      prefill producers.
      Enable it with `--use-replayssm` (off by default) alongside speculative
      decoding, keeping `--pipeline-parallel-size` and
      `--decode-context-parallel-size` at 1.
      PCP decode consumers and colocated PCP execution remain unsupported.
    model: glm-5.3-flash
