pr: 22606
entries:
  - category: hardware
    text: >-
      Extended the DeepSeek-V4-Pro Ascend overlay with a 910C W4A8-MTP variant
      for two-node DP2xTP16 on Atlas 800 A3, offered through the
      multi_node_tp_dp strategy (32-NPU floor, python frontend) and pinned to
      the v0.23.0.post1 stable images. The builder does not emit the per-node
      data-parallel address, RPC port, or start-rank arguments; use the
      companion Ascend recipe's launcher for the verified setup.
    model: DeepSeek-V4-Pro
    hardware: [A3]
