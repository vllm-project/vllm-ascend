pr: 21196
entries:
  - category: performance
    text: >-
      Fused the mamba "align" block-table gather, shared by the GDN and KDA
      metadata builders, into a single Triton kernel on Ascend, removing six
      kernel launches per step (910B probe: -42% device / -51% host time on
      the utility). Port of vLLM #58737, whose fused path is CUDA-gated
      upstream and therefore never engages on NPU.
