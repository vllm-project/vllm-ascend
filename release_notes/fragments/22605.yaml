pr: 22605
entries:
  - category: hardware
    text: >-
      Added an Ascend 910C recipe variant for Kimi-K2.6 W4A8 DFlash with
      TP4xDP4 on one Atlas 800 A3, plus an opt-in W4A8 PD (2P1D) preset for
      four-node Mooncake separation per the tutorial. Balance scheduling,
      MLAPO, and FlashComm1 are enabled through `--additional-config`
      instead of legacy environment variables.
    model: Kimi-K2.6
    hardware: [A3]
