pr: 20168
entries:
  - category: feature
    text: Added original Torch QSA metadata capture inside the existing Qwen3.8 Flash Next Model Runner V2 target FULL graph, without a fused metadata kernel or changes to vLLM source.
  - category: config
    text: Enabled FP32 stable-partition keys and eligible text and completed-multimodal decode submission by default. Each of the three environment switches accepts an explicit value of 0 to disable its behavior.
  - category: feature
    text: Removed the TP8-only gate from eligible text and completed-multimodal decode submission and original target QSA metadata capture. Other configuration, dependency, and replay-layout guards remain in place.
  - category: feature
    text: Allowed stable decode submission with prefix caching, Mamba cache modes, either scheduling setting, and configurable static MTP lengths. Target QSA metadata capture follows K+1 and existing buffer capacity instead of fixed K3 and 32-token limits; cache-transition and replay dependency guards remain enforced.
  - category: feature
    text: Removed blanket DP, PP, SP, and weight-offload exclusions from eligible rank-local decode submission. DP/SP metadata padding and unsupported capture layouts keep the original producer before graph capture, while incompatible batches retain synchronized submission; underlying model and runtime restrictions still apply.
