  - category: feature
    text: >-
      HY4 Flash Decode and Draft optimizations now select supported paths
      automatically. Only hy4flash_dfly_dp_graph remains as an optimization
      boolean and defaults to false. Remove former HY4 per-operator flags and
      optimization environment exports before restarting; obsolete
      additional-config keys are rejected. Supported Draft input preparation
      uses fused kernels outside the graph; the Draft model body is captured.
      This candidate
      requires hardware correctness and performance validation.
