pr: 22346
entries:
  - category: performance
    text: Kimi K3.1 decode on A3 skips padded and empty rank-local indexer rows during DCP packing, avoiding redundant initialization and candidate normalization. Eligible BF16 output projections write directly into the attention output buffer.
  - category: breaking
    text: >-
      A3 QuantLightningIndexer scores with return_value=1 now use BF16 instead of FP32,
      matching A5; return_value=2 local candidate scores remain FP32 on A3.
      Callers requiring an FP32 tensor must cast the returned scores, which does not restore FP32 precision.
    hardware: [A3]
