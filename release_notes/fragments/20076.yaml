pr: 20076
entries:
  - category: performance
    text: >-
      Reduced prefill time-to-first-token by 37-47% on NPU deployments that use the
      emulated UVA path, by tracking host-shadow dirty rows in O(1) instead of
      calling a Python callback once per row.
  - category: bugfix
    text: >-
      Fixed the emulated UVA host shadow for empty index lists and
      multi-dimensional boolean keys, made a failed host-to-device copy keep the
      unrefreshed rows dirty so the next sync retries them instead of leaving
      stale device data, and fixed stale device data when a host-shadow alias
      (for example ``np.asarray(buf.cpu)`` or ``buf.cpu.view(...)``) was written
      after a sync.
