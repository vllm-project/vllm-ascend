pr: 21542
entries:
  - category: performance
    text: >-
      Enabled eligible Kimi K3.1 DSpark drafts to use FlashMLA on A5 and avoid
      redundant CPU sequence-length synchronization during colocated decoding,
      including configurations with decode context parallelism.
    model: kimi-k3.1
    hardware: [A5]
  - category: bugfix
    text: >-
      Fixed PROLOG V3 initialization with FlashMLA history pages larger than 1024
      tokens by bounding the private writer block size independently of the
      history KV-cache page size.
    model: kimi-k3.1
    hardware: [A5]
