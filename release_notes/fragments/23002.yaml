pr: 23002
entries:
  - category: feature
    text: >-
      Kimi K3.1 disaggregated decode workers on Ascend 950 can opt into the
      experimental MegaKDA backend using kda_backend_config in --additional-config
      and an Ascend 950 wheel for the upstream MegaRecurrentKda operator with
      MXFP8 QKV and a fused output projection.
