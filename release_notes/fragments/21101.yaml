pr: 21101
entries:
  - category: performance
    text: >-
      Native CPU KV-cache offloading with `TieringOffloadingSpec` supports
      pinned shared memory for direct batched CPU-NPU transfers; enable it
      by setting `pin_shared_mmap` to `true` in
      `kv_connector_extra_config` (default: `false`) on supported Ascend runtimes.
      User-reported GLM-5.2 validation showed a 6.8% reduction in mean time to
      first token (TTFT), from 209,937 ms to 195,638 ms, compared with pinning
      disabled.
  - category: performance
    text: >-
      Native multi-tier KV-cache startup now reuses upstream worker barriers and,
      on supported vLLM versions, segmented shared files and disjoint MLA
      pre-fault shards to avoid populating the entire region on every worker.
