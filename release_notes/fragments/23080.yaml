pr: 23080
entries:
  - category: feature
    text: >-
      Added GLM5.3-Flash LoRA support for text projections, input embeddings,
      the LM head, and expert adapters through `--enable-lora`. The supported
      path preserves BF16/FP8/INT8 indexer cache choices and TP query-row sharding.
      PCP/DCP sizes of 1, fully sharded LoRA disabled, and sequence parallelism
      disabled are required.
    model: glm5.3-flash
