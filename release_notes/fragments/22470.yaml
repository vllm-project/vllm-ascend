pr: 22470
entries:
  - category: performance
    text: >-
      DeepSeek V4.1 on Ascend A3 can overlap SAS and QLI metadata preparation
      with independent model computation in Model Runner V2. Enable the
      experimental option with
      --additional-config '{"dsv41_metadata_overlap_A3_config":{"enabled":true}}';
      it is disabled by default and supports eager and FULL graph execution.
    model: deepseek-v4.1
    hardware: [A3]
