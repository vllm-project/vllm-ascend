pr: 23446
entries:
  - category: feature
    text: >-
      Added layerwise KV transfer from a separate Prefill node with AscendStore
      offload to HiSparse Decode, including GLM SFA Prefill with replicated PCP
      KV. Set `hisparse_target` on both SFA endpoints to receive Main KV in Host
      memory and the Indexer in device memory.
