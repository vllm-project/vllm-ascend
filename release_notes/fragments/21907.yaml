entries:
  - category: performance
    text: All2AllV MoE dispatch now overlaps split D2H copies with the local token permutation and waits for both copies through a single NPU event, using reusable pinned CPU staging buffers. It also passes an explicit repeat_interleave output size and removes full-device synchronization for the single-local-expert path.
