pr: 21907
entries:
  - category: performance
    text: Before this change, All2AllV dispatch blocked on separate split D2H transfers, inferred repeat_interleave output length from device values, and used a full-device synchronization for the single-local-expert path. This change reuses pinned split staging buffers with non-blocking copies and one event, enqueues token permutation before waiting for that event, and passes an explicit output_size, reducing A3 host dispatch latency from 0.4015 ms to 0.3697 ms (7.9%) and mean TTFT from 1088.13 ms to 1081.25 ms (0.63%) on Qwen3.8-Flash-Next.
    model: Qwen3.8-Flash-Next
    hardware: [A3]
