pr: 21253
entries:
  - category: feature
    text: >-
      Mooncake layerwise KV pooling now supports PCP together with KVPP for
      non-hybrid MLA/SFA models. Each target layer is persisted by a single
      TP x PCP owner, so pool capacity and read traffic no longer scale with
      PCP. Producer and consumer must use matching TP, PP, and PCP sizes.
  - category: breaking
    text: >-
      KV pooling with KVPP now fails at startup when a PP stage has fewer target
      layers than TP x PCP owners, for both Mooncake layerwise and Memcache
      whole-block pooling. Reduce TP, PCP, or PP so that every owner holds at
      least one layer.
