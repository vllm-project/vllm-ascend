pr: 23056
entries:
  - category: performance
    text: On Ascend A3 with Model Runner V2, EPLB load recording for supported W8A8, W4A8, and BF16 fused MC2 MoE paths now runs within the fused operator, removing a separate Record operator launch. No configuration change is needed; other paths retain their existing recording behavior.
  - category: bugfix
    text: With W8A8 or W4A8 fused MC2 MoE, EPLB now attributes expert load to the DP rank that supplied the active tokens, including when another rank executes their expert computation. This prevents an idle DP rank's dummy step from hiding those tokens from load statistics.
