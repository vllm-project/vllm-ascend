pr: 22355
entries:
  - category: performance
    text: >-
      GLM-5.3 HiSparse prefill on Ascend 950 avoids the CPU fallback for
      representative-page selection and reuses its padding mask across layers.
      No configuration changes are required.
  - category: bugfix
    text: >-
      Fixed HiSparse service startup failures with the verified vLLM main
      worker and residency-resolver interfaces. Existing AscendC binaries
      remain compatible; no native rebuild is required.
