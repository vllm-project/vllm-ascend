pr: 21281
entries:
  - category: performance
    text: Enabled device-length CANN FlashAttn for supported GLM DFlash2 full-graph drafts on A5, avoiding draft length transfers to Python lists and host FIA task updates during replay. Each FlashAttn attention group generates one plan during replay and writes it to a preallocated buffer shared by its layers. The backend's draft metadata update interface also skips eager metadata construction in propose() before full-graph replay.
    hardware: [A5]
