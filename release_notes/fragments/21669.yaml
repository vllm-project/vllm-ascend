pr: 21669
entries:
  - category: performance
    text: Added optional MiniMax-M3 indexer DCP decode overlap that hides query AllGather behind independent main QKV preparation and consumes gathered queries without a reorder copy. Enable enable_minimax_m3_indexer_dcp_overlap alongside indexer DCP for separate-projection BF16 decode; the default remains disabled.
    model: MiniMax-M3.1-Flash
    hardware: [A3]
  - category: feature
    text: Added opt-in experimental MiniMax-M3.1-Flash index-key cache sharding with bounded compact-pool GEMM scoring, FP16 MAX reduce-scatter, and shard-aware fused cache writes for BF16 KV caches on TP2/TP4. Configure enable_minimax_m3_indexer_dcp in additional_config; PD deployments require matching TP and MooncakeConnectorV2 on both roles.
    model: MiniMax-M3.1-Flash
    hardware: [A3]
  - category: feature
    text: Extended MiniMax-M3 fused Norm/RoPE cache writes with optional index shard ownership and decode TopK with read-only FP16 score inputs widened to FP32 before forced candidate priorities. Preserved existing unsharded defaults and FP32 workspace behavior.
    model: MiniMax-M3.1-Flash
  - category: bugfix
    text: Fixed batched MiniMax-M3 CANN index scores for block-table widths not divisible by 16 by padding a private table while preserving caller inputs.
    model: MiniMax-M3.1-Flash

