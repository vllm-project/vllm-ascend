  - category: feature
    text: >-
      Added native C8 support for Qwen3.8-Flash-Next ModelSlim W4A8 checkpoints
      with dynamic INT8 Q/K and calibrated static per-channel INT8 V. Use
      --quantization ascend --kv-cache-dtype auto with Model Runner V2 on
