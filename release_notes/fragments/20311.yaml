pr: 20311
entries:
  - category: feature
    text: >-
      Added pipeline-parallel and FlashComm1 sequence-parallel serving for
      Qwen3.8 Flash Next, including PP-stage-local packed QSA, GDN, and PLE
      cache ownership and MRV2 token handling.
  - category: bugfix
    text: >-
      Fixed Qwen3.8 Flash Next PP+MTP draft QSA routing so draft layers use the
      graph-safe projection path instead of the target fused RMSNorm + MRoPE
      path, avoiding Q/K NaNs and restoring draft acceptance.
  - category: bugfix
    text: >-
      Fixed Mamba state copies in reordered or sparse PP+SP request batches by
      using persistent request-slot indexing and rebuilding the cache context
      after profiling, preventing cross-request SSM and convolution state
      corruption.
