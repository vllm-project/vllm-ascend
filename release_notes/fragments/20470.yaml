pr: 20470
entries:
  - category: bugfix
    text: >-
      Fixed wait-mode pause and sleep hangs while draining requests
      with asynchronous KV loads.
  - category: bugfix
    text: >-
      Fixed DyntraLB and Balance exceeding the batch input limit
      when drafting requires extra slots.
  - category: bugfix
    text: >-
      Fixed Balance failing to freeze admission across DP ranks
      when max_num_active_seqs is lower than max_num_seqs.
  - category: bugfix
    text: >-
      Aligned Ascend scheduler overrides with vLLM v0.33.0
      and upstream revision 24420b7a.
