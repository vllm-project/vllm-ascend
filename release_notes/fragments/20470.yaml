pr: 20470
entries:
  - category: bugfix
    text: >-
      Fixed wait-mode pauses and sleeps hanging when Ascend-specific schedulers
      had requests holding KV blocks for asynchronous loads.
  - category: bugfix
    text: >-
      Fixed DyntraLB and Balance scheduling exceeding the batch input limit
      when speculative decoding requires additional drafting slots.
  - category: bugfix
    text: >-
      Aligned Ascend scheduler overrides with vLLM v0.33.0 and the verified
      main revision, including asynchronous KV-load admission, encoder cache
      handling, speculative decoding boundaries, and model-runner metadata.
