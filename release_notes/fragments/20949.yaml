  - category: feature
    text: Added opt-in Qwen4Exp main KV, GDN state, and compressed-indexer layerwise reuse on the GVA cache-pool path. Enabled and disabled reuse use a common layout with independent per-layer raw state; capacity planning uses actual physical storage to increase block capacity within the same HBM budget.
