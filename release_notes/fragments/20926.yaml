pr: 20926
entries:
  - category: feature
    text: >-
      Added experimental Ascend HiSparse BF16 and native C8 sparse MLA/SFA
      support using a fused AscendC residency resolver, existing Attention
      operators and Core lifecycle interfaces. The native resolver requires
      its compiled extension and does not fall back to Triton.
