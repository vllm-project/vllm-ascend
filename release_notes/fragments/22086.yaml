pr: 22086
entries:
  - category: performance
    text: >-
      Improved Qwen3.8-Flash-Next QSA serving performance on Ascend A3 by fusing the
      attention preparation paths (Q/K RMSNorm+MRoPE, compressed-key preparation and
      LightningIndexer input preparation) into single Triton kernels, cutting kernel
      launches and intermediate tensor traffic. Eligible shapes use the fused paths
      automatically; unsupported layouts keep the previous fallback, so no configuration
      change is needed.
    model: Qwen3.8-Flash-Next
