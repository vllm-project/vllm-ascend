pr: 22755
entries:
  - category: feature
    text: >-
      Added experimental A8C4 sparse decode for MiniMax-M3/M3.1 on Ascend 950.
      Enable sparse_attention_quant_config.enable_a8c4 with FP8 KV and compatible
      CANN GBSA mode-8 operators and PyTorch bridge. Pipeline parallelism and
      MooncakeConnectorV1 PD use the complete dual-format pages; configure the
      option identically on P and D with matching TP sizes. CP is not supported.
      This mode retains FP8 for prefill and reserves more cache memory than native FP8.
    model: minimax-m3.1
    hardware: [A5]
