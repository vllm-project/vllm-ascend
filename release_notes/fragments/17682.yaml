pr: 17682
entries:
  - category: performance
    text: Optimized eager FIA decode paths by skipping redundant attention mask construction for genuine single-token decode-only batches, improving end-to-end decode performance by ~10% on A2/A3.
  - category: bugfix
    text: Kept the causal mask and sparse_mode=3 in FULL-graph FIA capture and for multi-token batches labeled decode-only (speculative-decode verification and draft expansion), fixing spec-decode acceptance-rate regressions on A2/A3; FULL-graph capture dummies are single-token decode batches while the captured graphs also replay multi-token verification batches.
