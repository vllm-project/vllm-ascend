pr: 22024
entries:
  - category: feature
    text: >-
      Added experimental layerwise KV offload for the existing DeepSeek-V4 Flash
      and Pro models through AscendStore and Memcache, including sliding-window
      and compressor-state caches. Cache format v2 excludes overlapping A5
      indexer transfer views and starts a separate namespace from earlier
      experimental cache objects.
      Save preparation batches pool queries and mixed-size allocations across
      cache groups while preserving snapshot ownership and publication fences.
      Ordinary sliding-window continuation saves retained windows and configured
      public checkpoints instead of every live Prefill page. Memcache Prefill
      queues attention before notifying transfer threads, while retaining the
      pre-attention device dependency. End-to-end speedups require hardware
      validation; no latency improvement is claimed from CPU tests.
      Transfer preparation skips disabled debug-list construction and masked
      history entries, reuses immutable layout offsets, and assembles host
      addresses before waiting for device reuse and save dependencies.
    model: deepseek-v4
  - category: bugfix
    text: >-
      Fixed complete-prefix replay with layerwise KV buffer reuse by looking
      up the resumable checkpoint before excluding the final prompt token.
    model: deepseek-v4
