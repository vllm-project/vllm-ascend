pr: 21444
entries:
  - category: performance
    text: >-
      DFlash2 drafts paired with Qwen3.5 dense targets on Model Runner V2
      automatically use device-length attention on A2/A3 when the optional
      flash_attn_npu package provides the flash_attn_npu_3 scheduler API. This
      avoids draft attention length copies on the supported sliding-window
      path and the runner's post-sampling length snapshot and Event wait for
      supported single-stage configurations with unquantized draft KV caches.
      Qwen target full attention also uses FA3 with its default unlimited
      window; linear attention keeps GDN. With FA3 0.5.0, full attention at
      KV capacity >=1024 requires eager execution because graph capture fails
      on synchronous length copies, including in FULL_DECODE_ONLY mode.
      FA3 0.5.1 supports this full-attention graph path with the default window.
    model: qwen3.5-dflash2
    hardware: [A2, A3]
  - category: bugfix
    text: >-
      Fixed FA3 graph replay for MiniMax DSpark when the draft and target use
      different query lengths and the request batch changes.
    model: minimax-m3-dspark
    hardware: [A2, A3]
