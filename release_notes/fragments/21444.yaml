pr: 21444
entries:
  - category: performance
    text: >-
      Qwen3.5 dense targets using DFlash2 on Model Runner V2 automatically use
      device-length attention on A2/A3 when the optional flash_attn_npu package
      provides the flash_attn_npu_3 scheduler API. This removes attention length
      copies and the runner's post-sampling length snapshot and Event wait for
      supported single-stage configurations with unquantized KV caches.
    model: qwen3.5-dflash2
    hardware: [A2, A3]
