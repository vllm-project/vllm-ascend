pr: 20519
entries:
  - category: feature
    text: Added an experimental opt-in DeepInfer MegaMoE backend with fused shared experts for DeepSeek V4.1 on Ascend 950, using TP1 and linear EP8.
  - category: bugfix
    text: Reduced deferred MLA tensor reuse with a same-stream lifetime adjustment, replacing the experimental MegaMoE Prefill host synchronization.
  - category: feature
    text: Load the optional prebuilt Ascend 950 DeepGEMM wheel lazily; when it is unavailable, warn and disable deepgemm_mega_moe before model initialization.
