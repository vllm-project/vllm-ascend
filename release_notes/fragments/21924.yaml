pr: 21924
entries:
  - category: feature
    text: >-
      Added experimental bulk AscendStore prefix reuse with colocated HiSparse
      on A5 using MemCache host_tcp or Mooncake Ascend Direct with a Store-owned
      transfer engine and a DDR pool. Mooncake uses synchronous Ascend Direct
      transfers with timeout limits that fit the Store batch deadline.
      Both backends require asynchronous request loading (load_async=true).
      Whole-block saves require eager_host_mirror=true, including Prefill-only saves. Mooncake uses independent 64 MiB send and receive DDR staging buffers
      per worker for Host Source pages; Indexer pages transfer directly.
      The combination supports single-node colocated Prefill and Decode with
      kv_role=kv_both on MultiConnector and its children. Startup rejects PD
      disaggregation, multi-node deployments, prefill context parallelism, duplicate or additional connectors,
      layerwise transfers, other Store backends and other MemCache protocols. Mooncake FabricMem and
      SSD modes are excluded from this combination. The hisparse-ascendstore-v1
      key namespace separates entries by target and draft checkpoints, resolved revisions,
      dummy-weight mode, effective model configurations and page layout.
    hardware: [A5]
