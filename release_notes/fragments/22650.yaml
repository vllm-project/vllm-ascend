pr: 22650
entries:
  - category: bugfix
    text: Under kv_load_failure_policy='repair', an unsupported KV cache layout
      now fails at startup with an explicit error naming the required layout
      (VLLM_KV_CACHE_LAYOUT=HND or LBHNC), and vLLM builds without the repair
      executor log a visible warning instead of silently skipping the startup
      check.
