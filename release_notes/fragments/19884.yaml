pr: 19884
entries:
  - category: feature
    text: >-
      Added opt-in Decoder Append-Prefill for agentic workloads, routing follow-up
      session requests to their owner Decoder to reuse resident KV cache and
      falling back to the Prefiller when a usable local prefix is unavailable.
      Decoder-local preemption recovery uses CPU KV offload and restoration;
      offload failures do not trigger Prefiller recomputation.
  - category: config
    text: >-
      Use the X-Session-ID header to identify Decoder Append-Prefill sessions.
      The example proxy also supports optional Prefiller endpoint affinity
      through --enable-prefill-affinity for initial P/D requests and fallbacks.
