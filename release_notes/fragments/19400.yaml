pr: 19400
entries:
  - category: feature
    text: Added support for the draft_lm_head_quantization feature with the fp8 method on Ascend NPU, enabling quantized online lm_head weight sharing for EAGLE/EAGLE3/MTP draft models on Model Runner V2. The execution format is selected automatically from the hardware: the native MXFP8 matmul on A5 (Ascend 950) class devices, and the INT8 W8A8 path on A3/A2 devices without native MXFP8 support.
