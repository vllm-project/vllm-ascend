pr: 20235
entries:
  - category: feature
    text: Added experimental retained-state FastEEP with reclaimable PIECEWISE graph memory and HCCL buffers, expert-level migration, and a serialized resize endpoint.
  - category: performance
    text: FastEEP avoids redundant migration setup and routing-table construction during resizing, and overlaps inactive memory reclamation with active communicator initialization.
