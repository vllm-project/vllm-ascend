pr: 21680
entries:
  - category: feature
    text: >-
      Added optional DSpark expert-pool routing for compatible DeepSeek models
      using ModelRunner V2 and single-device expert offload on Ascend 950 (A5).
      The feature is disabled by default. To enable it, set
      `dspark_expert_pool.enabled` to `true` under `--additional-config` and
      provide `protected_positions` and `suffix_experts`.
  - category: bugfix
    text: Fixed redundant expert-weight transfers caused by padding rows during ACL Graph replay with expert offload.
