pr: 46
entries:
  - category: performance
    hardware: [A2, A3]
    text: >-
      Accelerated small-batch AttnResFwd with residual-row parallel scoring,
      full-hidden output ownership, one readiness barrier, UB padding, and
      double-buffered output reads. Larger rows retain the H-split fallback.
  - category: bugfix
    hardware: [A2, A3]
    text: >-
      Fixed broadcast scratch sizing and reduction tail initialization, and
      rejected unsafe metadata, non-finite normalization epsilon, and writable
      bank storage aliases before launching AttnResFwd.
  - category: feature
    hardware: [A5]
    text: >-
      Added a RegBase cooperative AttnResFwd path with residual-row parallel
      scoring, one readiness barrier for full-row outputs, double-buffered
      output reads, and a UB-budgeted H-split fallback.
  - category: bugfix
    hardware: [A5]
    text: >-
      Fixed AttnResFwd softmax handling for large candidate banks, broadcast
      repeat overflow, and extreme-negative score padding in legacy paths.
  - category: performance
    hardware: [A5]
    text: >-
      Fused output RMSNorm conversion and statistics in RegBase for the
      complete-row AttnResFwd path, reducing small-batch kernel latency
      while retaining the BF16 mixture boundary and one readiness barrier.
  - category: performance
    hardware: [A2, A3, A5]
    text: >-
      Extended AttnResFwd cooperative dispatch to batches using at most half
      the available AIV cores, enabling row-parallel scoring for B=16 while
      retaining full-row output ownership and existing UB checks.
  - category: bugfix
    hardware: [A2, A3, A5]
    text: >-
      Reject oversized zero-token bank views before stride arithmetic and
      validate BF16 dtypes before the empty-output fast return in AttnResFwd.
  - category: bugfix
    hardware: [A2, A3, A5]
    text: >-
      Assigned distinct complete-row output owners when AttnResFwd score tasks
      wrap across cores, avoiding token serialization without adding barriers.
  - category: performance
    hardware: [A2, A3, A5]
    text: >-
      Retained token-parallel AttnResFwd for high-occupancy batches whose
      scoring work cannot amortize cooperative synchronization overhead.
  - category: performance
    hardware: [A2, A3, A5]
    text: >-
      Added workload-selected token groups for complete-row AttnResFwd,
      retaining original BF16 candidate rows in UB for output reuse and
      avoiding score workspace and global barriers for single-worker groups.
      Uniform groups use the minimum workers preserving score waves;
      existing global-row and H-split paths remain available.
  - category: performance
    hardware: [A2, A3, A5]
    text: >-
      Write complete-row AttnResFwd outputs directly from their existing UB
      buffer with explicit Vector/MTE3 fences, avoiding a staging copy while
      retaining current core assignment, UB layout and global barrier counts.
