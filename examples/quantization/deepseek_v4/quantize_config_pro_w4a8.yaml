apiversion: modelslim_v1
metadata:
  config_id: deepseek_v4_pro_w4a8
  score: 90
  verified_model_types:
    - DeepSeek-V4-Pro
  verified_tags:
    DeepSeek-V4-Pro:
      - - vLLM-Ascend
        - Atlas_A3_Inference
  label:
    w_bit: 4
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w4a8_dynamic: &default_w4a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int4"
    symmetric: True
    method: "minmax"

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"

spec:
  process:
    # quaRot/smoothQuant are not executed in this script
    # Rule 1: attention layers → W8A8 (same as Flash)
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*attn*"
      exclude:
        - "*attn.wq_a"
        - "*attn.wkv"
        - "*attn.wo_a"
        - "*weights_proj"
        - "*compressor.wgate"
        - "*compressor.wkv"
        - "*indexer.wkv"
        - "*indexer.wgate"
        - "*indexer.weights_proj"
        - "*indexer.compressor.wgate"
        - "*indexer.compressor.wkv"
    # Rule 2: routed experts → W4A8 (int4 weight)
    - type: "linear_quant"
      qconfig: *default_w4a8_dynamic
      include:
        - "*ffn*"
      exclude:
        - "*gate"
        - "*shared_experts*"
    # Rule 3: shared experts → W8A8 (int8 weight, every token executes)
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*ffn.shared_experts*"
    # Rule 4: MTP projections → W8A8 (Pro uses e_proj/h_proj, same as Flash)
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*e_proj"
        - "*h_proj"
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
