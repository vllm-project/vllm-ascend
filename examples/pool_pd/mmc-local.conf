# Dedicated single-host A5 pool; start mmc-meta.conf before P/D.
ock.mmc.meta_service_url = tcp://127.0.0.1:15350
ock.mmc.local_service.config_store_url = tcp://127.0.0.1:15351
ock.mmc.local_service.world_size = 16
ock.mmc.local_service.protocol = device_urma
ock.mmc.local_service.dram.size = 1GB
ock.mmc.local_service.max.dram.size = 16GB
ock.mmc.local_service.storage.enabled = false
ock.mmc.log_level = info
