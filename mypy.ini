[mypy]
; warn_return_any = True
warn_unused_configs = True
; disable errors about unchecked annotations for now. Also disable
; [var-annotated]: numpy 2.x stubs make ordinary ``np.zeros``/``np.ones``
; results un-inferable, which the CI lint image (numpy 1.26.4) does not hit.
disable_error_code = annotation-unchecked, var-annotated

; Suppress all missing import errors from torch_npu for mypy.
[mypy-torch_npu.*]
ignore_missing_imports = True

[mypy-npugraph_ex.*]
ignore_missing_imports = True

[mypy-torchair.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-lm_eval.*]
ignore_missing_imports = True

[mypy-compressed_tensors.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-llmcompressor.*]
ignore_missing_imports = True

[mypy-msprobe.*]
ignore_missing_imports = True

[mypy-xlite.*]
ignore_missing_imports = True

[mypy-ucm.*]
ignore_missing_imports = True

[mypy-msmodelslim.*]
ignore_missing_imports = True

[mypy-lmcache_ascend.*]
ignore_missing_imports = True

[mypy-jiwer]
ignore_missing_imports = True

[mypy-vllm.v1.kv_offload.*]
ignore_missing_imports = True

; Compiled alongside vllm-ascend; absent from lint-only environments.
; follow_imports=skip also tolerates a build that ships no stub at all.
[mypy-vllm_ascend.vllm_ascend_C]
ignore_missing_imports = True
follow_imports = skip

