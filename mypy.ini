[mypy]
; warn_return_any = True
warn_unused_configs = True
; disable errors about unchecked annotations for now.
disable_error_code = annotation-unchecked

; Suppress all missing import errors from torch_npu for mypy.
[mypy-torch_npu.*]
ignore_missing_imports = True

[mypy-fla_npu.*]
ignore_missing_imports = True

[mypy-npugraph_ex.*]
ignore_missing_imports = True

[mypy-torchair.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-lm_eval.*]
ignore_missing_imports = True

[mypy-compressed_tensors.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-llmcompressor.*]
ignore_missing_imports = True

[mypy-msprobe.*]
ignore_missing_imports = True

[mypy-xlite.*]
ignore_missing_imports = True

[mypy-ucm.*]
ignore_missing_imports = True

[mypy-msmodelslim.*]
ignore_missing_imports = True

[mypy-lmcache_ascend.*]
ignore_missing_imports = True

[mypy-jiwer]
ignore_missing_imports = True

[mypy-vllm.v1.kv_offload.*]
ignore_missing_imports = True

[mypy-cann_ops_transformer.*]
ignore_missing_imports = True

; CANN DSL is available only in the operator build/runtime environment.
[mypy-cannbotdsl.*]
ignore_missing_imports = True

; GmIn(I32)/GmOut(I32) describe the AICPU ABI, not Python type expressions.
[mypy-vllm_ascend.ops.pythondsl.quant_lightning_indexer_metadata_dsl,vllm_ascend.ops.pythondsl.quant_sparse_lightning_indexer_metadata_dsl,vllm_ascend.ops.pythondsl.mixed_quant_sparse_flash_mla_metadata]
disable_error_code = valid-type
