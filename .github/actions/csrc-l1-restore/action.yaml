name: Restore csrc incremental cache
description: Restore a persistent snapshot for the content-addressed local csrc cache.

inputs:
  cache-dir:
    required: true
    description: Directory exported as VLLM_ASCEND_BUILD_CACHE_DIR.
  architecture:
    required: true
    description: Build architecture (x64 or arm64; common runner aliases are accepted).
  soc-version:
    required: true
    description: Target SOC or device family, normalized by this action.
  toolchain-image:
    required: false
    default: ''
    description: Compiler image fallback when the action runs outside the CANN container.
  source-root:
    required: false
    default: '.'
  csrc-hash:
    required: false
    default: ''

outputs:
  supported:
    value: ${{ steps.key.outputs.supported }}
  primary-key:
    value: ${{ steps.key.outputs.primary_key }}
  csrc-hash:
    value: ${{ steps.key.outputs.csrc_hash }}
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Prepare L1 key
      id: key
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
        CACHE_ARCHITECTURE: ${{ inputs.architecture }}
        CACHE_SOC_VERSION: ${{ inputs.soc-version }}
        CACHE_TOOLCHAIN_IMAGE: ${{ inputs.toolchain-image }}
        SOURCE_ROOT: ${{ inputs.source-root }}
        CALLER_CSRC_HASH: ${{ inputs.csrc-hash }}
      run: |
        set -euo pipefail

        source_root="$(cd "$SOURCE_ROOT" && pwd)"
        engine="${source_root}/csrc/scripts/build_cache.py"

        rm -rf "$CACHE_DIR"
        mkdir -p "$CACHE_DIR"

        if [ ! -f "$engine" ]; then
          echo "supported=false" >> "$GITHUB_OUTPUT"
          echo "::notice::This source snapshot predates the fine-grained csrc cache; building without L1."
          exit 0
        fi
        echo "supported=true" >> "$GITHUB_OUTPUT"

        if [ -n "$CALLER_CSRC_HASH" ]; then
          csrc_hash="$CALLER_CSRC_HASH"
        else
          git config --global --add safe.directory "$source_root" || true
          manifest="$(git -C "$source_root" ls-files -s -- csrc setup.py CMakeLists.txt cmake)"
          if [ -n "$manifest" ]; then
            csrc_hash="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          else
            csrc_hash="adhoc"
          fi
        fi

        unique_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)-$$-${RANDOM}"
        readarray -t key_parts < <(
          python3 "$engine" snapshot-key \
            --architecture "$CACHE_ARCHITECTURE" \
            --soc-version "$CACHE_SOC_VERSION" \
            --toolchain-image "$CACHE_TOOLCHAIN_IMAGE" \
            --csrc-hash "$csrc_hash" \
            --unique-suffix "$unique_suffix"
        )
        if [ "${#key_parts[@]}" -ne 3 ]; then
          echo "::error::snapshot-key returned an invalid response"
          exit 1
        fi
        primary_key="${key_parts[0]}"
        same_csrc_prefix="${key_parts[1]}"
        compat_prefix="${key_parts[2]}"

        {
          echo "primary_key=$primary_key"
          echo "csrc_hash=$csrc_hash"
          echo "same_csrc_prefix=$same_csrc_prefix"
          echo "compat_prefix=$compat_prefix"
        } >> "$GITHUB_OUTPUT"

        {
          echo "VLLM_ASCEND_BUILD_CACHE_DIR=$CACHE_DIR"
          echo "VLLM_ASCEND_BUILD_CACHE_EVENT_LOG=${RUNNER_TEMP}/csrc-l1-${GITHUB_JOB}.jsonl"
        } >> "$GITHUB_ENV"

    - name: Restore L1 snapshot
      id: restore
      if: steps.key.outputs.supported == 'true'
      continue-on-error: true
      uses: runs-on/cache/restore@v5
      env:
        RUNS_ON_S3_BUCKET_CACHE: ascend-ci-cache-hk
        RUNS_ON_S3_BUCKET_ENDPOINT: https://obs.ap-southeast-1.myhuaweicloud.com
        RUNS_ON_S3_FORCE_PATH_STYLE: "false"
        AWS_S3_FORCE_PATH_STYLE: "false"
        AWS_REGION: ap-southeast-1
        RUNS_ON_RUNNER_NAME: ""
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ steps.key.outputs.primary_key }}
        restore-keys: |
          ${{ steps.key.outputs.same_csrc_prefix }}
          ${{ steps.key.outputs.compat_prefix }}

    - name: Reset L1 update marker
      if: steps.key.outputs.supported == 'true'
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        set -euo pipefail
        rm -f "$CACHE_DIR/.updated"
