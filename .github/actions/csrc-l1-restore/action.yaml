name: Restore csrc incremental cache
description: Restore a persistent snapshot for the content-addressed local csrc cache.

inputs:
  cache-dir:
    required: true
    description: Directory exported as VLLM_ASCEND_BUILD_CACHE_DIR.
  architecture:
    required: true
    description: Build architecture, normalized by this action (for example X64 or ARM64).
  soc-version:
    required: true
    description: Target SOC or device family, normalized by this action.
  toolchain-image:
    required: false
    default: ''
    description: Compiler image fallback when the action runs outside the CANN container.
  source-root:
    required: false
    default: '.'
  csrc-hash:
    required: false
    default: ''

outputs:
  supported:
    value: ${{ steps.key.outputs.supported }}
  primary-key:
    value: ${{ steps.key.outputs.primary_key }}
  csrc-hash:
    value: ${{ steps.key.outputs.csrc_hash }}
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Prepare L1 key
      id: key
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
        CACHE_ARCHITECTURE: ${{ inputs.architecture }}
        CACHE_SOC_VERSION: ${{ inputs.soc-version }}
        CACHE_TOOLCHAIN_IMAGE: ${{ inputs.toolchain-image }}
        SOURCE_ROOT: ${{ inputs.source-root }}
        CALLER_CSRC_HASH: ${{ inputs.csrc-hash }}
      run: |
        set -euo pipefail

        source_root="$(cd "$SOURCE_ROOT" && pwd)"
        engine="${source_root}/csrc/scripts/build_cache.py"

        rm -rf "$CACHE_DIR"
        mkdir -p "$CACHE_DIR"

        if [ ! -f "$engine" ]; then
          echo "supported=false" >> "$GITHUB_OUTPUT"
          echo "::notice::This source snapshot predates the fine-grained csrc cache; building without L1."
          exit 0
        fi
        echo "supported=true" >> "$GITHUB_OUTPUT"

        schema="$(python3 - "$engine" <<'PYCODE'
        import ast
        import sys
        from pathlib import Path

        tree = ast.parse(Path(sys.argv[1]).read_text(encoding="utf-8"))
        for node in tree.body:
            if isinstance(node, ast.Assign):
                for target in node.targets:
                    if isinstance(target, ast.Name) and target.id == "SCHEMA_VERSION":
                        print(ast.literal_eval(node.value))
                        raise SystemExit(0)
        raise SystemExit("SCHEMA_VERSION not found")
        PYCODE
        )"

        if [ -n "$CALLER_CSRC_HASH" ]; then
          csrc_hash="$CALLER_CSRC_HASH"
        else
          git config --global --add safe.directory "$source_root" || true
          manifest="$(git -C "$source_root" ls-files -s -- csrc setup.py CMakeLists.txt cmake)"
          if [ -n "$manifest" ]; then
            csrc_hash="$(printf '%s\n' "$manifest" | sha256sum | awk '{print $1}')"
          else
            csrc_hash="adhoc"
          fi
        fi

        compat_digest="$(python3 - \
          "$CACHE_ARCHITECTURE" \
          "$CACHE_SOC_VERSION" \
          "$CACHE_TOOLCHAIN_IMAGE" <<'PYCODE'
        import hashlib
        import json
        import sys
        from pathlib import Path

        architecture_aliases = {
            "x64": "x64",
            "x86_64": "x64",
            "amd64": "x64",
            "arm64": "arm64",
            "aarch64": "arm64",
        }
        soc_aliases = {
            "a2": "ascend910b1",
            "910b": "ascend910b1",
            "ascend910b1": "ascend910b1",
            "a3": "ascend910_9391",
            "ascend910_9391": "ascend910_9391",
            "310p": "ascend310p1",
            "ascend310p1": "ascend310p1",
            "a5": "ascend950dt_9582",
            "950": "ascend950dt_9582",
            "ascend950dt_9582": "ascend950dt_9582",
        }

        architecture = architecture_aliases.get(sys.argv[1].strip().lower())
        if architecture is None:
            raise SystemExit(f"unsupported cache architecture: {sys.argv[1]!r}")

        soc_input = sys.argv[2].strip().lower()
        soc_version = soc_aliases.get(soc_input, soc_input)
        toolchain_image = sys.argv[3].strip()
        machine = {
            "x64": "x86_64",
            "arm64": "aarch64",
        }[architecture]
        metadata = Path(
            f"/usr/local/Ascend/ascend-toolkit/latest/{machine}-linux/"
            "ascend_toolkit_install.info"
        )
        if metadata.is_file():
            toolchain = {
                "kind": "cann-metadata",
                "sha256": hashlib.sha256(metadata.read_bytes()).hexdigest(),
            }
        elif toolchain_image:
            toolchain = {
                "kind": "container-image",
                "value": toolchain_image,
            }
        else:
            raise SystemExit(
                "CANN metadata is unavailable; toolchain-image fallback is required"
            )
        if not soc_version:
            raise SystemExit("SOC version must be non-empty")

        descriptor = json.dumps(
            {
                "architecture": architecture,
                "soc_version": soc_version,
                "toolchain": toolchain,
            },
            sort_keys=True,
            separators=(",", ":"),
        )
        print(hashlib.sha256(descriptor.encode("utf-8")).hexdigest())
        PYCODE
        )"
        compat_prefix="vllm-ascend-inc-v1-schema${schema}-${compat_digest}-"
        same_csrc_prefix="${compat_prefix}${csrc_hash}-"
        primary_key="${same_csrc_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s%N)-$$-${RANDOM}"

        {
          echo "primary_key=$primary_key"
          echo "csrc_hash=$csrc_hash"
          echo "same_csrc_prefix=$same_csrc_prefix"
          echo "compat_prefix=$compat_prefix"
        } >> "$GITHUB_OUTPUT"

        {
          echo "VLLM_ASCEND_BUILD_CACHE_DIR=$CACHE_DIR"
          echo "VLLM_ASCEND_BUILD_CACHE_EVENT_LOG=${RUNNER_TEMP}/csrc-l1-${GITHUB_JOB}.jsonl"
          echo "VLLM_ASCEND_BUILD_CACHE_ENTRY_LOCK_TIMEOUT_SECONDS=60"
          echo "VLLM_ASCEND_BUILD_CACHE_ACTION_LOCK_TIMEOUT_SECONDS=120"
          echo "VLLM_ASCEND_BUILD_CACHE_PUBLISH_LOCK_TIMEOUT_SECONDS=120"
        } >> "$GITHUB_ENV"

    - name: Restore L1 snapshot
      id: restore
      if: steps.key.outputs.supported == 'true'
      continue-on-error: true
      uses: runs-on/cache/restore@v5
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ steps.key.outputs.primary_key }}
        restore-keys: |
          ${{ steps.key.outputs.same_csrc_prefix }}
          ${{ steps.key.outputs.compat_prefix }}

    - name: Record restored L1 entries
      if: steps.key.outputs.supported == 'true'
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        set -euo pipefail
        baseline="${RUNNER_TEMP}/csrc-l1-${GITHUB_JOB}-baseline.json"
        python3 - "$CACHE_DIR" "$baseline" <<'PYCODE'
        import hashlib
        import json
        import sys
        from pathlib import Path

        cache_root = Path(sys.argv[1])
        records = []
        if cache_root.is_dir():
            for manifest in sorted(cache_root.rglob("manifest.json")):
                records.append(
                    [
                        manifest.relative_to(cache_root).as_posix(),
                        hashlib.sha256(manifest.read_bytes()).hexdigest(),
                    ]
                )
        Path(sys.argv[2]).write_text(
            json.dumps(records, separators=(",", ":")),
            encoding="utf-8",
        )
        PYCODE
        echo "VLLM_ASCEND_BUILD_CACHE_BASELINE=$baseline" >> "$GITHUB_ENV"
