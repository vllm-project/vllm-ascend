name: Recipes Preview

# Reuse vllm-project/recipes for preview builds, cleanup, and production sync.
# Enable only after its receiver routes events by source; the original receiver
# treats every preview-pr event as a vLLM PR, even if a source is supplied.
#
# pull_request_target allows fork PRs to use the dispatch App. Never check out
# or run PR code here. Only a fixed source name and a validated PR number leave
# this workflow. Keep the App key in the main-only recipes-preview environment.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'recipes/**/*.yaml'
  push:
    branches: [main]
    paths:
      - 'recipes/**/*.yaml'

permissions:
  contents: read

concurrency:
  group: recipes-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.repository == 'vllm-project/vllm-ascend' &&
      vars.RECIPES_PREVIEW_ENABLED == 'true'
    runs-on: linux-amd64-cpu-2-hk
    timeout-minutes: 5
    environment:
      name: recipes-preview
      url: >-
        ${{ github.event_name == 'push' && 'https://recipes.vllm.ai' ||
        (github.event.action != 'closed' &&
        format('https://vllm-recipes-git-preview-vllm-ascend-pr-{0}-inferact-inc.vercel.app', github.event.pull_request.number) ||
        '') }}
    steps:
      - name: Create a token for vllm-project/recipes
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          # Enable proxy support for token creation and post-job revocation.
          NODE_USE_ENV_PROXY: '1'
        with:
          app-id: ${{ vars.RECIPES_APP_ID }}
          private-key: ${{ secrets.RECIPES_APP_PRIVATE_KEY }}
          owner: vllm-project
          repositories: recipes
          permission-contents: write

      - name: Dispatch to vllm-project/recipes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const clientPayload = { source: 'vllm-ascend' };
            let eventType = 'recipes-updated';
            if (context.eventName !== 'push') {
              const prNumber = String(context.payload.pull_request?.number ?? '');
              if (!/^[1-9][0-9]*$/.test(prNumber) || !Number.isSafeInteger(Number(prNumber))) {
                throw new Error('Invalid PR number.');
              }
              eventType = 'preview-pr';
              clientPayload.pr = Number(prNumber);
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'vllm-project',
              repo: 'recipes',
              event_type: eventType,
              client_payload: clientPayload,
            });
