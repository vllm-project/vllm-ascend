                mknod "$WSPACE/$b" b "$MAJ" "$MIN" 2>/dev/null && NODE="$WSPACE/$b" && echo "READONLY_PROBE_MKNOD $b $MAJ:$MIN in-workspace-only"
              fi
            fi
            if [ -e "$NODE" ]; then
              H=$(head -c 512 "$NODE" 2>/dev/null | sha256sum | cut -d' ' -f1)
              RC=$?
