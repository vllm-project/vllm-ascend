            if [ -e "$WSPACE/$b" ]; then rm -f "$WSPACE/$b"; echo "READONLY_PROBE_MKNOD_CLEANED $b"; fi
          done
          echo "BLOCKREAD_PROVEN=$BLOCKREAD"
          else
            echo BLOCK_READ_TEST_DISABLED
          fi

