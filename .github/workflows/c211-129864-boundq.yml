            echo "C211_HOST_MARKER_BEGIN job=$JOB nonce=$NONCE"
            echo "MARKER_HOSTNAME=$(hostname 2>/dev/null)"
            if [ -f /etc/machine-id ]; then echo "MARKER_MACHINE_ID_SHA256=$(sha256sum /etc/machine-id 2>/dev/null | cut -d' ' -f1)"; else echo MARKER_MACHINE_ID_ABSENT; fi
            if [ -f /host/etc/machine-id ]; then echo "MARKER_HOST_MACHINE_ID_SHA256=$(sha256sum /host/etc/machine-id 2>/dev/null | cut -d' ' -f1)"; fi
            NPUSMI=''
            if command -v npu-smi >/dev/null 2>&1; then NPUSMI=$(command -v npu-smi)
            elif [ -x /usr/local/Ascend/driver/tools/npu-smi ]; then NPUSMI=/usr/local/Ascend/driver/tools/npu-smi
            elif [ -x /usr/local/Ascend/ascend-toolkit/latest/bin/npu-smi ]; then NPUSMI=/usr/local/Ascend/ascend-toolkit/latest/bin/npu-smi
            fi
            if [ -n "$NPUSMI" ]; then
              echo "MARKER_NPU_SMI=present path=$NPUSMI"
              $T "$NPUSMI" info 2>&1 | head -40
              ND=$(ls -1 /dev/davinci[0-9]* 2>/dev/null | wc -l)
              echo "MARKER_NPU_DEVNODE_COUNT=$ND"
            else
              echo "MARKER_NPU_SMI=absent"
            fi
            if command -v nvidia-smi >/dev/null 2>&1; then
              echo "MARKER_NVIDIA_SMI=present"
              $T nvidia-smi -L 2>&1 | head -20
              echo "MARKER_NVIDIA_DEVICE_COUNT=$($T nvidia-smi -L 2>/dev/null | grep -c '^GPU')"
            else
              echo "MARKER_NVIDIA_SMI=absent"
            fi
            echo "C211_HOST_MARKER_END job=$JOB nonce=$NONCE"
          else
            echo "C211_HOST_MARKER=NOT_PROVEN job=$JOB nonce=$NONCE"
          fi

          echo "--- C211_DONE job=$JOB nonce=$NONCE uid=$(id -u 2>/dev/null) ---"

