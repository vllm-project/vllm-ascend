#
# Pre-start the three main2main E2E runners' environments (A2/A3/310P)
# alongside the main flow.  Runs on the persistent self-hosted runner
# filesystem ($GITHUB_WORKSPACE): vllm + vllm-ascend editable install +
# csrc cache restore/compile + deps.  Re-dispatching with unchanged inputs
# is an idempotent no-op (.ready marker match skips the rebuild).
#
# Dispatched by the main2main flow (e2e_dispatch.py dispatch_prep) at flow
# start with inputs: vllm=TARGET_COMMIT, base_ref=main.
name: main2main E2E env prep

on:
  workflow_dispatch:
    inputs:
      vllm:
        type: string
        required: true
        description: 'The vllm commit hash or tag to test (TARGET_COMMIT).'
      base_ref:
        type: string
        required: false
        default: 'main'
        description: 'The vllm-ascend base ref to prepare.'
      image_tag_a3:
        type: string
        required: false
        default: '9.1.0-a3-ubuntu22.04-py3.12'
        description: 'CANN image tag for the A3 (800i) runner container.'

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  actions: write

jobs:
  prep:
    name: prep-${{ matrix.chip }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: a2
            runner: linux-aarch64-a2b1-8
            image_tag: 9.1.0-910b-ubuntu22.04-py3.12
            max_jobs: '184'
          - chip: a3
            runner: linux-aarch64-a3-800i-16-cn12-001
            image_tag: ${{ inputs.image_tag_a3 }}
            max_jobs: '184'
          - chip: 310p
            runner: linux-aarch64-310p-4
            image_tag: 9.1.0-310p-ubuntu22.04-py3.12
            max_jobs: '92'
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.image_tag }}
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HF_HUB_OFFLINE: 1
        MAX_JOBS: 4
        UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
        UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/"
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
        UV_HTTP_TIMEOUT: 120
        UV_NO_CACHE: 1
        UV_SYSTEM_PYTHON: 1
    steps:
      - name: Check NPU availability
        run: |
          npu-smi info

      - name: Check env freshness
        id: env-check
        run: |
          marker="$GITHUB_WORKSPACE/.ready"
          fresh=false
          if [ -f "$marker" ] \
            && grep -qx "vllm=${{ inputs.vllm }}" "$marker" \
            && grep -qx "base_ref=${{ inputs.base_ref }}" "$marker" \
            && grep -qx "image_tag=${{ matrix.image_tag }}" "$marker" \
            && [ -x "$GITHUB_WORKSPACE/.venv/bin/activate" ] \
            && [ -d "$GITHUB_WORKSPACE/vllm-empty/.git" ] \
            && [ -d "$GITHUB_WORKSPACE/.git" ]; then
            fresh=true
            echo "Reusing prepared env at $GITHUB_WORKSPACE (marker match)"
          else
            echo "Env missing or stale (vllm/base_ref/image_tag changed) - rebuilding"
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: Build env from scratch
        if: steps.env-check.outputs.fresh != 'true'
        uses: ./.github/actions/main2main-e2e-prep/action.yaml
        with:
          vllm: ${{ inputs.vllm }}
          base_ref: ${{ inputs.base_ref }}
          image_tag: ${{ matrix.image_tag }}
          max_jobs: ${{ matrix.max_jobs }}

      - name: Report
        run: |
          if [ "${{ steps.env-check.outputs.fresh }}" = "true" ]; then
            echo "main2main E2E env already prepared and fresh - no-op"
          else
            echo "main2main E2E env prepared"
            ls -la "$GITHUB_WORKSPACE/.ready"
          fi
