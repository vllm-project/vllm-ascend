name: Schedule All E2E Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - 'main'
      - '*-dev'
      - 'releases/v*'
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: 'main'
        type: string
      update_est_times:
        description: 'Update estimated times'
        required: false
        default: false
        type: boolean
# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prebuilt images produced by nightly_image_build.yaml (scheduled at 12:00 UTC).
  A2_IMAGE: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-main-a2'
  A3_IMAGE: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-main-a3'
  DAILY_CONFIG: '.github/workflows/configs/daily_config.yaml'
  
jobs:
  select-all-tests:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      has_tests: ${{ steps.full-scope.outputs.has_tests }}
      test_groups: ${{ steps.full-scope.outputs.test_groups }}
      matched_modules: ${{ steps.full-scope.outputs.matched_modules }}
      csrc_cache_target_ids: ${{ steps.full-scope.outputs.csrc_cache_target_ids }}
      vllm_ascend_ref: ${{ steps.resolve-refs.outputs.vllm_ascend_ref }}
      base_sha: ${{ steps.resolve-refs.outputs.base_sha }}
      base_ref: ${{ steps.resolve-refs.outputs.base_ref }}
      main_commit: ${{ steps.resolve-refs.outputs.main_commit }}
      release_tag: ${{ steps.resolve-refs.outputs.release_tag }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_branch || ''
            }}
          fetch-depth: 0

      - name: Resolve refs
        id: resolve-refs
        env:
          WD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_branch || '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          TARGET_BRANCH="${WD_BRANCH:-$GITHUB_REF_NAME}"
          git fetch origin "$TARGET_BRANCH"
          {
            echo "vllm_ascend_ref=$(git rev-parse HEAD)"
            echo "base_sha=$(git rev-parse FETCH_HEAD)"
            echo "base_ref=${TARGET_BRANCH}"
          } >> "$GITHUB_OUTPUT"
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          release_tag="$(tr -d '[:space:]' < .github/vllm-release-tag.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error file=.github/vllm-main-verified.commit::invalid vLLM main commit: ${main_commit}"
            exit 1
          }
          [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "::error file=.github/vllm-release-tag.commit::invalid vLLM release tag: ${release_tag}"
            exit 1
          }
          {
            echo "main_commit=${main_commit}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Select all tests
        id: full-scope
        run: |
          pip install regex pyyaml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/workflows/scripts/select_tests.py --all-tests

  ensure-csrc-cache:
    needs: select-all-tests
    if: ${{ needs.select-all-tests.outputs.has_tests == 'true' }}
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-all-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ needs.select-all-tests.outputs.vllm_ascend_ref }}
      base_ref: ${{ needs.select-all-tests.outputs.base_ref }}
      base_sha: ${{ needs.select-all-tests.outputs.base_sha }}

  # run-all-tests:
  #   needs: [select-all-tests, ensure-csrc-cache]
  #   if: ${{ needs.select-all-tests.outputs.has_tests == 'true' }}
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       vllm_version:
  #         - ${{ needs.select-all-tests.outputs.main_commit }}
  #         - ${{ needs.select-all-tests.outputs.release_tag }}
  #   uses: ./.github/workflows/_selected_tests.yaml
  #   with:
  #     vllm: ${{ matrix.vllm_version }}
  #     ref: ${{ needs.select-all-tests.outputs.vllm_ascend_ref }}
  #     base_ref: ${{ needs.select-all-tests.outputs.base_ref }}
  #     base_sha: ${{ needs.select-all-tests.outputs.base_sha }}
  #     test_groups: ${{ needs.select-all-tests.outputs.test_groups }}
  #     upload_timing: ${{ inputs.update_est_times }}

  setup-vars:
    name: Resolve daily test matrix
    runs-on: linux-aarch64-a2b3-0
    outputs:
      a2_image: ${{ steps.export.outputs.a2_image }}
      a3_image: ${{ steps.export.outputs.a3_image }}
      a2_nightly_hf: ${{ steps.set-matrix.outputs.a2_nightly_hf }}
      a3_nightly_hf: ${{ steps.set-matrix.outputs.a3_nightly_hf }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export image refs
        id: export
        run: |
          {
            echo "a2_image=${{ env.A2_IMAGE }}"
            echo "a3_image=${{ env.A3_IMAGE }}"
          } >> "$GITHUB_OUTPUT"

      - name: Read daily test matrix config
        id: set-matrix
        env:
          MATRIX_FILE: ${{ env.DAILY_CONFIG }}
          MATRIX_OUTPUTS: '{"a2_nightly_hf":"daily.a2_nightly_hf","a3_nightly_hf":"daily.a3_nightly_hf"}'
        run: |
          python3 -m pip install pyyaml -q
          python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=matrix

  verify-image:
    name: Verify nightly-ci image (build gate)
    needs: [setup-vars]
    runs-on: linux-aarch64-a2b3-1
    timeout-minutes: 10
    container:
      image: ${{ needs.setup-vars.outputs.a2_image }}
    steps:
      - name: Smoke import vllm-ascend and vllm
        run: |
          . /usr/local/Ascend/ascend-toolkit/set_env.sh || true
          python3 -c "import vllm_ascend, vllm; print('import OK ->', vllm_ascend.__file__)"
      - name: Verify custom ops loadable
        run: |
          . /usr/local/Ascend/ascend-toolkit/set_env.sh || true
          python3 -c "import vllm_ascend.vllm_ascend_C; print('custom ops OK -> vllm_ascend_C loaded')"
      - name: Report image build provenance
        run: |
          echo "Image: ${{ needs.setup-vars.outputs.a2_image }}"
          echo "=== vllm-ascend ==="
          (cd /vllm-workspace/vllm-ascend && git log -1 --format='%H %s' 2>/dev/null) || echo "(no git info)"
          echo "=== vllm ==="
          (cd /vllm-workspace/vllm && git log -1 --format='%H %s' 2>/dev/null) || echo "(no git info)"
          
  a2-nightly-hf:
    name: A2 nightly high-freq
    needs: [setup-vars, verify-image]
    if: always() && needs.verify-image.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        test_config: ${{ fromJson(needs.setup-vars.outputs.a2_nightly_hf) }}
    uses: ./.github/workflows/_e2e_daily_tests.yaml
    with:
      runner: ${{ matrix.test_config.os }}
      image: ${{ needs.setup-vars.outputs.a2_image }}
      tests: ${{ matrix.test_config.tests }}
      name: ${{ matrix.test_config.name }}
      vllm_ascend_branch: main
      timeout_minutes: '45'

  a3-nightly-hf:
    name: A3 nightly high-freq
    needs: [setup-vars, verify-image]
    if: always() && needs.verify-image.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        test_config: ${{ fromJson(needs.setup-vars.outputs.a3_nightly_hf) }}
    uses: ./.github/workflows/_e2e_daily_tests.yaml
    with:
      runner: ${{ matrix.test_config.os }}
      image: ${{ needs.setup-vars.outputs.a3_image }}
      tests: ${{ matrix.test_config.tests }}
      name: ${{ matrix.test_config.name }}
      vllm_ascend_branch: main
      timeout_minutes: '45'
      
  update-estimated-times:
    needs: [run-all-tests]
    if: ${{ !cancelled() && inputs.update_est_times }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          pattern: timing-data-*
          path: timing-artifacts/
          merge-multiple: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Update estimated_times from timing data
        run: |
          python3 .github/workflows/scripts/update_estimated_times.py \
            --timing-dir timing-artifacts/ \
            --config .github/workflows/scripts/test_config.yaml

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet .github/workflows/scripts/test_config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to test_config.yaml."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "test_config.yaml has been updated:"
            git diff .github/workflows/scripts/test_config.yaml
          fi

      - name: Setup git remote
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add fork "https://github.com/vllm-ascend-ci/vllm-ascend.git"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="auto/update-estimated-times-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add .github/workflows/scripts/test_config.yaml
          git commit -s -m "[CI] Auto-update estimated test times in test_config.yaml"
          git push -f fork "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Pushed branch: $BRANCH"

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: auto/update-estimated-times-${{ github.run_id }}
          PR_HEAD: vllm-ascend-ci:auto/update-estimated-times-${{ github.run_id }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            try {
              const pr = await github.rest.pulls.create({
                owner: 'vllm-project',
                repo: 'vllm-ascend',
                head: process.env.PR_HEAD,
                base: 'main',
                title: '[CI] Auto-update estimated test times in test_config.yaml',
                body: '## Summary\n\n' +
                  'This PR was auto-generated by the **Update estimated test times** ' +
                  '[workflow](' + process.env.RUN_URL + ').\n\n' +
                  'It updates the `estimated_times` values in ' +
                  '`.github/workflows/scripts/test_config.yaml` based on actual elapsed ' +
                  'times collected from CI workflow runs.\n\n' +
                  '### Methodology\n\n' +
                  '- Each test job uploads its elapsed time as a `timing-data-*` ' +
                  'artifact upon completion.\n' +
                  '- The workflow aggregates all collected timing artifacts across jobs.\n' +
                  '- For each test, the **median** elapsed time is computed to reduce ' +
                  'outlier impact.\n' +
                  '- A **10% safety buffer** is applied and the result is rounded to the ' +
                  'nearest 10 seconds.\n\n' +
                  '### Review Checklist\n\n' +
                  '- [ ] Verify that updated `estimated_time` values are within a ' +
                  'reasonable range.\n' +
                  '- [ ] Confirm no test entries are missing or unexpectedly removed.\n',
              });
              core.info('Created PR #' + pr.data.number);
            } catch (error) {
              if (error.message.includes('A pull request already exists')) {
                core.warning('PR already exists');
              } else { throw error; }
            }
