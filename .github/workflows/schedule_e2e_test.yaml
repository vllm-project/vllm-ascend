name: Schedule All E2E Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - 'main'
      - '*-dev'
      - 'releases/v*'

  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: 'main'
        type: string
      update_est_times:
        description: 'Update estimated times'
        required: false
        default: false
        type: boolean
# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prebuilt images produced by nightly_image_build.yaml (scheduled at 12:00 UTC).
  A2_IMAGE: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-main-a2'
  A3_IMAGE: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-ci-main-a3'
  DAILY_CONFIG: '.github/workflows/configs/daily_config.yaml'
  
jobs:
  select-all-tests:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      has_tests: ${{ steps.full-scope.outputs.has_tests }}
      test_groups: ${{ steps.full-scope.outputs.test_groups }}
      matched_modules: ${{ steps.full-scope.outputs.matched_modules }}
      csrc_cache_target_ids: ${{ steps.full-scope.outputs.csrc_cache_target_ids }}
      vllm_ascend_ref: ${{ steps.resolve-refs.outputs.vllm_ascend_ref }}
      base_sha: ${{ steps.resolve-refs.outputs.base_sha }}
      base_ref: ${{ steps.resolve-refs.outputs.base_ref }}
      main_commit: ${{ steps.resolve-refs.outputs.main_commit }}
      release_tag: ${{ steps.resolve-refs.outputs.release_tag }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_branch || ''
            }}
          fetch-depth: 0
      - name: Resolve refs
        id: resolve-refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_BRANCH_RAW: ${{ inputs.vllm_ascend_branch }}
          PR_SHA_RAW: ${{ github.sha }}
          # 完整event路径，actionlint类型识别
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # pull_request 事件
            git fetch origin "${PR_SHA_RAW}"
            {
              echo "vllm_ascend_ref=${PR_SHA_RAW}"
              echo "base_sha=${PR_EVENT_BASE_SHA}"
              echo "base_ref=${PR_EVENT_BASE_REF}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${WD_BRANCH_RAW}" ]]; then
            # workflow_dispatch 手动触发
            TARGET_BRANCH="${WD_BRANCH_RAW}"
            git fetch origin "$TARGET_BRANCH"
            {
              echo "vllm_ascend_ref=$(git rev-parse HEAD)"
              echo "base_sha=$(git rev-parse FETCH_HEAD)"
              echo "base_ref=${TARGET_BRANCH}"
            } >> "$GITHUB_OUTPUT"
          else
            # schedule(cron) / push
            TARGET_BRANCH="${REF_NAME}"
            git fetch origin "$TARGET_BRANCH"
            {
              echo "vllm_ascend_ref=$(git rev-parse HEAD)"
              echo "base_sha=$(git rev-parse FETCH_HEAD)"
              echo "base_ref=${TARGET_BRANCH}"
            } >> "$GITHUB_OUTPUT"
          fi

          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          release_tag="$(tr -d '[:space:]' < .github/vllm-release-tag.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error file=.github/vllm-main-verified.commit::invalid vLLM main commit: ${main_commit}"
            exit 1
          }
          [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]] || {
            echo "::error file=.github/vllm-release-tag.commit::invalid vLLM release tag: ${release_tag}"
            exit 1
          }
          {
            echo "main_commit=${main_commit}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Select all tests
        id: full-scope
        run: |
          pip install regex pyyaml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/workflows/scripts/select_tests.py --all-tests

  ensure-csrc-cache:
    needs: select-all-tests
    if: ${{ needs.select-all-tests.outputs.has_tests == 'true' }}
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-all-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ needs.select-all-tests.outputs.vllm_ascend_ref }}
      base_ref: ${{ needs.select-all-tests.outputs.base_ref }}
      base_sha: ${{ needs.select-all-tests.outputs.base_sha }}

  # run-all-tests:
  #   needs: [select-all-tests, ensure-csrc-cache]
  #   if: ${{ needs.select-all-tests.outputs.has_tests == 'true' }}
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       vllm_version:
  #         - ${{ needs.select-all-tests.outputs.main_commit }}
  #         - ${{ needs.select-all-tests.outputs.release_tag }}
  #   uses: ./.github/workflows/_selected_tests.yaml
  #   with:
  #     vllm: ${{ matrix.vllm_version }}
  #     ref: ${{ needs.select-all-tests.outputs.vllm_ascend_ref }}
  #     base_ref: ${{ needs.select-all-tests.outputs.base_ref }}
  #     base_sha: ${{ needs.select-all-tests.outputs.base_sha }}
  #     test_groups: ${{ needs.select-all-tests.outputs.test_groups }}
  #     upload_timing: ${{ inputs.update_est_times }}

  setup-vars:
    name: Resolve daily test matrix
    # 重点：移除 needs: [select-all-tests]，不再受select‑all‑tests失败影响
    runs-on: linux-aarch64-a2b3-0
    outputs:
      a2_image: ${{ steps.export.outputs.a2_image }}
      a3_image: ${{ steps.export.outputs.a3_image }}
      vllm_ascend_ref: ${{ steps.resolve-refs-hf.outputs.vllm_ascend_ref }}
      a2_nightly_hf: ${{ steps.set-matrix.outputs.a2_nightly_hf }}
      a3_nightly_hf: ${{ steps.set-matrix.outputs.a3_nightly_hf }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_branch || '' }}
          fetch-depth: 0

      # 新增：setup‑vars内部独立解析ref，不和select‑all‑tests耦合
      - name: Resolve refs for hf nightly
        id: resolve-refs-hf
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_BRANCH_RAW: ${{ inputs.vllm_ascend_branch }}
          PR_SHA_RAW: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # PR场景：直接使用github.sha，不要再git checkout，避免文件版本错乱
            echo "vllm_ascend_ref=${PR_SHA_RAW}" >> "$GITHUB_OUTPUT"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${WD_BRANCH_RAW}" ]]; then
            git fetch origin "${WD_BRANCH_RAW}"
            echo "vllm_ascend_ref=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            TARGET_BRANCH="${REF_NAME}"
            git fetch origin "${TARGET_BRANCH}"
            echo "vllm_ascend_ref=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export image refs
        id: export
        run: |
          {
            echo "a2_image=${{ env.A2_IMAGE }}"
            echo "a3_image=${{ env.A3_IMAGE }}"
          } >> "$GITHUB_OUTPUT"

      - name: Read daily test matrix config
        id: set-matrix
        env:
          MATRIX_FILE: ${{ env.DAILY_CONFIG }}
          MATRIX_OUTPUTS: '{"a2_nightly_hf":"daily.a2_nightly_hf","a3_nightly_hf":"daily.a3_nightly_hf"}'
        run: |
          python3 -m pip install pyyaml -q
          # 捕获python脚本stdout输出，写入GITHUB_OUTPUT
          RAW_OUT=$(python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=matrix)
          echo "$RAW_OUT" >> "$GITHUB_OUTPUT"
          # debug打印，CI日志看输出
          echo "=====DEBUG set‑matrix raw output===="
          echo "$RAW_OUT"
          ls -la "${MATRIX_FILE}"

  verify-image:
    name: Verify nightly-ci image (build gate)
    needs: [setup-vars]
    runs-on: linux-aarch64-a2b3-1
    timeout-minutes: 10
    container:
      image: ${{ needs.setup-vars.outputs.a2_image }}
    steps:
      - name: Smoke import vllm-ascend and vllm
        run: |
          . /usr/local/Ascend/ascend-toolkit/set_env.sh || true
          python3 -c "import vllm_ascend, vllm; print('import OK ->', vllm_ascend.__file__)"
      - name: Verify custom ops loadable
        run: |
          . /usr/local/Ascend/ascend-toolkit/set_env.sh || true
          python3 -c "import vllm_ascend.vllm_ascend_C; print('custom ops OK -> vllm_ascend_C loaded')"
      - name: Report image build provenance
        run: |
          echo "Image: ${{ needs.setup-vars.outputs.a2_image }}"
          echo "=== vllm-ascend ==="
          (cd /vllm-workspace/vllm-ascend && git log -1 --format='%H %s' 2>/dev/null) || echo "(no git info)"
          echo "=== vllm ==="
          (cd /vllm-workspace/vllm && git log -1 --format='%H %s' 2>/dev/null) || echo "(no git info)"

  a2-nightly-hf:
    name: A2 nightly high-freq
    needs: [setup-vars, verify-image]
    if: always() && needs.verify-image.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        test_config: ${{ fromJson(needs.setup-vars.outputs.a2_nightly_hf) }}
    uses: ./.github/workflows/_e2e_nightly_single_node.yaml
    with:
      runner: ${{ matrix.test_config.os }}
      image: ${{ needs.setup-vars.outputs.a2_image }}
      tests: ${{ matrix.test_config.tests }}
      name: ${{ matrix.test_config.name }}
      vllm_ascend_branch: ${{ needs.setup-vars.outputs.vllm_ascend_ref }}
      soc_version: "a2"
      should_run: true
      test_frequency: nightly
      testcase_timeout: "45"

  a3-nightly-hf:
    name: A3 nightly high-freq
    needs: [setup-vars, verify-image]
    if: always() && needs.verify-image.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        test_config: ${{ fromJson(needs.setup-vars.outputs.a3_nightly_hf) }}
    uses: ./.github/workflows/_e2e_nightly_single_node.yaml
    with:
      runner: ${{ matrix.test_config.os }}
      image: ${{ needs.setup-vars.outputs.a3_image }}
      tests: ${{ matrix.test_config.tests }}
      name: ${{ matrix.test_config.name }}
      vllm_ascend_branch: ${{ needs.setup-vars.outputs.vllm_ascend_ref }}
      soc_version: "a3"
      should_run: true
      test_frequency: nightly
      testcase_timeout: "45"

