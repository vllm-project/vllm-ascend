  post-links:
    name: Post workflow links
    needs: [authorize, dispatch-image, dispatch-a2, dispatch-a3, dispatch-a3-560t, dispatch-a5, dispatch-310p]
    if: always() && github.event_name == 'repository_dispatch' && needs.authorize.outputs.is_authorized == 'true' && needs.authorize.outputs.blocked != 'true'
    runs-on: linux-amd64-cpu-2-hk
    steps:
      - name: Build comment body
        id: body
        run: |
          BODY="presmoke command triggered."
          if [[ "${{ needs.dispatch-image.result }}" == "success" ]]; then
            BODY="$BODY
          - Presmoke image build: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.dispatch-image.outputs.image_run_id }})"
          fi
          if [[ "${{ needs.dispatch-a2.result }}" == "success" ]]; then
            BODY="$BODY
          - Nightly-A2: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.dispatch-a2.outputs.a2_run_id }})"
          fi
          if [[ "${{ needs.dispatch-a3.result }}" == "success" ]]; then
            BODY="$BODY
          - Nightly-A3: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.dispatch-a3.outputs.a3_run_id }})"
          fi
          if [[ "${{ needs.dispatch-a3-560t.result }}" == "success" ]]; then
            BODY="$BODY
          - Nightly-A3-560T: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.dispatch-a3-560t.outputs.a3_560t_run_id }})"
          fi
          if [[ "${{ needs.dispatch-a5.result }}" == "success" ]]; then
            BODY="$BODY
          - Nightly-A5: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.dispatch-a5.outputs.a5_run_id }})"
          fi
          if [[ "${{ needs.dispatch-310p.result }}" == "success" ]]; then
            BODY="$BODY
          - Nightly-310P: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ needs.dispatch-310p.outputs._310p_run_id }})"
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post workflow URLs
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: ${{ steps.body.outputs.body }}
          reactions: rocket
