# Handles the /presmoke comment command. It is a CI-only helper used to validate
# CANN-related changes in the root Dockerfiles: the presmoke runtime image is
# rebuilt from the CANN base image and pushed to the isolated *_presmoke SWR
# repositories for issue localization, while the lightweight smoke tests are
# dispatched through the nightly test chain. It never publishes release images
# and does not interfere with the scheduled nightly builds.
name: Handle /presmoke Command

on:
  repository_dispatch:
    types: [presmoke-command]
  # Manual trigger for the presmoke image build only. The /presmoke comment
  # arrives as repository_dispatch, but the reusable build chain must run under
  # workflow_dispatch: _schedule_image_build.yaml only publishes the SWR tag when
  # github.event_name is workflow_dispatch (or pull_request_target). The command
  # path therefore hands the build off to this same workflow file via
  # `gh workflow run`, and the build jobs below are gated on workflow_dispatch.
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch/ref to build (the PR head SHA for /presmoke runs)'
        required: true
        default: 'main'
        type: string
      chips:
        description: 'Chips to build (JSON array: ["a2","a3","310p","a5"]). Default builds all.'
        required: false
        default: '["a2","a3","310p","a5"]'
        type: string
      skip_base:
        description: 'If true, skip the base image build and only build the presmoke image (base image must already exist).'
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  actions: write
  # Needed by the called build workflows to push the presmoke images to SWR.
  packages: write
  pull-requests: write
  issues: write

jobs:
  # ===== Image build path (runs only on the workflow_dispatch hand-off) =====
  # Rebuilds the runtime image from the CANN base image and then the matching
  # presmoke image on top of it, one independent pipeline per (chip, OS) pair.
  # The images are published to SWR under *_presmoke repositories and a
  # '-presmoke' tag suffix, so they never overwrite the nightly images and do
  # not interfere with any other daily build; they are meant for issue
  # localization only (never for release).
  setup-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: linux-amd64-cpu-2-hk
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
    steps:
      - name: Filter build matrix by chips
        id: matrix
        run: |
          CHIPS='${{ inputs.chips || '["a2","a3","310p","a5"]' }}'
          ALL=$(jq -nc '[
            {target:"a2",   os:"ubuntu",    soc:"910b", dockerfile:"Dockerfile",               suffix:""},
            {target:"a3",   os:"ubuntu",    soc:"a3",   dockerfile:"Dockerfile.a3",             suffix:"a3"},
            {target:"310p", os:"ubuntu",    soc:"310p", dockerfile:"Dockerfile.310p",           suffix:"310p"},
            {target:"a5",   os:"ubuntu",    soc:"950",  dockerfile:"Dockerfile.a5",             suffix:"a5"},
            {target:"a2",   os:"openeuler", soc:"910b", dockerfile:"Dockerfile.openEuler",      suffix:"openeuler"},
            {target:"a3",   os:"openeuler", soc:"a3",   dockerfile:"Dockerfile.a3.openEuler",   suffix:"a3-openeuler"},
            {target:"310p", os:"openeuler", soc:"310p", dockerfile:"Dockerfile.310p.openEuler", suffix:"310p-openeuler"},
            {target:"a5",   os:"openeuler", soc:"950",  dockerfile:"Dockerfile.a5.openEuler",   suffix:"a5-openeuler"}
          ]')
          # The presmoke suffix is appended to the matrix suffix so the runtime
          # image tag becomes nightly-<ref>-<suffix>-presmoke; the layered presmoke
          # image in _schedule_nightly_pair_image_build.yaml resolves the same tag
          # via base_tag_suffix='-presmoke'.
          FILTERED=$(echo "$ALL" | jq -c --argjson chips "$CHIPS" \
            '[.[] | select(.target as $t | $chips | index($t))
                 | .presmoke_suffix = (if .suffix == "" then "presmoke" else "\(.suffix)-presmoke" end)]')
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"
          if [ "$FILTERED" = "[]" ]; then
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build presmoke-${{ matrix.target }} (${{ matrix.os }})
    needs: setup-matrix
    if: ${{ github.event_name == 'workflow_dispatch' && needs.setup-matrix.outputs.has_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_schedule_nightly_pair_image_build.yaml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      soc: ${{ matrix.soc }}
      dockerfile: ${{ matrix.dockerfile }}
      suffix: ${{ matrix.presmoke_suffix }}
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch || 'main' }}
      # Build both architectures for every OS, keeping the fixed runner mapping
      # (and therefore the build cache) used by the nightly pipeline.
      build_type: 'full'
      should_push: ${{ github.repository == 'vllm-project/vllm-ascend' }}
      skip_base: ${{ inputs.skip_base || false }}
      # Isolate the presmoke layer into the *_presmoke repositories. The smoke
      # tests are dispatched separately through the nightly test chain, and the
      # base image must not be mirrored to quay.io.
      image_repo_suffix: '_presmoke'
      base_tag_suffix: '-presmoke'
      skip_sync: true
      swr_registry: 'swr.cn-north-12.myhuaweicloud.com'
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}

  # ===== Command path (runs only on the repository_dispatch from the comment) =====
  authorize:
    name: Check user authorization
    if: github.event_name == 'repository_dispatch'
    runs-on: linux-amd64-cpu-4-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    outputs:
      test_cases: ${{ steps.resolve.outputs.test_cases }}
      branch: ${{ steps.resolve.outputs.branch }}
      is_authorized: ${{ steps.auth.outputs.is_authorized }}
      dispatch_a2: ${{ steps.resolve.outputs.dispatch_a2 }}
      dispatch_a3: ${{ steps.resolve.outputs.dispatch_a3 }}
      dispatch_a3_560t: ${{ steps.resolve.outputs.dispatch_a3_560t }}
      dispatch_310p: ${{ steps.resolve.outputs.dispatch_310p }}
      dispatch_a5: ${{ steps.resolve.outputs.dispatch_a5 }}
      vllm_ascend_ref: ${{ steps.resolve.outputs.vllm_ascend_ref }}
      vllm_ref: ${{ steps.resolve.outputs.vllm_ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      blocked: ${{ steps.block_window.outputs.blocked }}
    steps:
      - name: Install system dependencies
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install gh -y

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          sparse-checkout: |
            .github/workflows/scripts/resolve_nightly_tests.py
            .github/workflows/configs/nightly_config.yaml
          sparse-checkout-cone-mode: false

      - name: Check user authorization
        id: auth
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ACTOR: ${{ github.event.client_payload.github.payload.comment.user.login }}
          REPO: ${{ github.event.client_payload.github.payload.repository.full_name }}
        run: |
          ROLE_NAME=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.role_name')
          case "$ROLE_NAME" in
            triage|write|maintain|admin)
              echo "User $ACTOR has $ROLE_NAME role, authorized."
              echo "is_authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::User $ACTOR does not have triage+ permission and is not authorized to trigger presmoke tests."
              echo "is_authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Post unauthorized comment
        if: steps.auth.outputs.is_authorized == 'false'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: |
            [Bot]: presmoke command failed: you do not have permission. Only users with triage+ permission can trigger /presmoke.
          reactions: confused

      - name: Fail if unauthorized
        if: steps.auth.outputs.is_authorized == 'false'
        run: exit 1

      # Maintenance window gate, shared with the /nightly and /weekly commands.
      # Controlled by the repository variable NIGHTLY_COMMAND_BLOCK_WINDOW. The
      # value is an optional switch followed by an HH:MM-HH:MM window in Beijing
      # time (UTC+8, cross-midnight supported), for example "true 22:00-08:00",
      # "false 22:00-08:00" or just "22:00-08:00". Switch aliases: true/1/yes/on
      # and false/0/no/off (case-insensitive); space or comma separators are
      # accepted. When enabled and the current Beijing time falls inside the
      # window, the /presmoke comment trigger is blocked. Unset, explicitly
      # disabled or malformed values disable the gate (fail-open).
      - name: Check command block window
        id: block_window
        if: steps.auth.outputs.is_authorized == 'true'
        env:
          BLOCK_WINDOW: ${{ vars.NIGHTLY_COMMAND_BLOCK_WINDOW }}
          COMMAND: ${{ github.event.action }}
        run: |
          echo "command=${COMMAND%-command}" >> "$GITHUB_OUTPUT"
          BLOCKED="false"
          RAW="$(echo "$BLOCK_WINDOW" | tr ',' ' ' | xargs)"
          ENABLED="auto"
          WINDOW=""
          if [ -n "$RAW" ]; then
            read -r FIRST SECOND _REST <<< "$RAW"
            case "$(echo "$FIRST" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes|on)
                ENABLED="true"
                WINDOW="$SECOND"
                ;;
              false|0|no|off)
                ENABLED="false"
                WINDOW="$SECOND"
                ;;
              *)
                ENABLED="auto"
                WINDOW="$FIRST"
                ;;
            esac
          fi
          if [ "$ENABLED" = "false" ]; then
            echo "NIGHTLY_COMMAND_BLOCK_WINDOW explicitly disabled."
          elif [ -z "$WINDOW" ]; then
            if [ "$ENABLED" = "true" ]; then
              echo "::warning::Gate enabled in NIGHTLY_COMMAND_BLOCK_WINDOW but no window is set (expected HH:MM-HH:MM); block window disabled."
            else
              echo "NIGHTLY_COMMAND_BLOCK_WINDOW is not set; block window disabled."
            fi
          elif [[ ! "$WINDOW" =~ ^([0-9]{2}):([0-9]{2})-([0-9]{2}):([0-9]{2})$ ]]; then
            echo "::warning::Invalid NIGHTLY_COMMAND_BLOCK_WINDOW='$WINDOW' (expected HH:MM-HH:MM); block window disabled."
          else
            SH=${BASH_REMATCH[1]}
            SM=${BASH_REMATCH[2]}
            EH=${BASH_REMATCH[3]}
            EM=${BASH_REMATCH[4]}
            if (( 10#$SH > 23 || 10#$SM > 59 || 10#$EH > 23 || 10#$EM > 59 )); then
              echo "::warning::Out-of-range time in NIGHTLY_COMMAND_BLOCK_WINDOW='$WINDOW'; block window disabled."
            else
              START_MIN=$((10#$SH * 60 + 10#$SM))
              END_MIN=$((10#$EH * 60 + 10#$EM))
              NOW_MIN=$((10#$(date -u -d '+8 hours' +%H) * 60 + 10#$(date -u -d '+8 hours' +%M)))
              if (( START_MIN <= END_MIN )); then
                if (( NOW_MIN >= START_MIN && NOW_MIN < END_MIN )); then
                  BLOCKED="true"
                fi
              else
                if (( NOW_MIN >= START_MIN || NOW_MIN < END_MIN )); then
                  BLOCKED="true"
                fi
              fi
            fi
          fi
          {
            echo "blocked=$BLOCKED"
            echo "window=$WINDOW"
          } >> "$GITHUB_OUTPUT"
          if [ "$BLOCKED" = "true" ]; then
            echo "Command /${COMMAND%-command} is blocked until the maintenance window ends."
          fi

      - name: Post blocked comment
        if: steps.auth.outputs.is_authorized == 'true' && steps.block_window.outputs.blocked == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: |
            [Bot]: `/${{ steps.block_window.outputs.command }}` is temporarily disabled during the maintenance window (Beijing time `${{ steps.block_window.outputs.window }}`). Please retry after the window ends.
          reactions: confused

      - name: Install Python dependencies
        if: steps.auth.outputs.is_authorized == 'true' && steps.block_window.outputs.blocked != 'true'
        run: pip3 install pyyaml -q

      - name: Resolve test cases and branch
        id: resolve
        if: steps.auth.outputs.is_authorized == 'true' && steps.block_window.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ALL_ARGS: ${{ github.event.client_payload.slash_command.args.all }}
          PR_URL: ${{ github.event.client_payload.github.payload.issue.pull_request.url }}
        run: |
          REPO='${{ github.event.client_payload.github.payload.repository.full_name }}'
          COMMENTS_URL="repos/$REPO/issues/${{ github.event.client_payload.github.payload.issue.number }}/comments"

          ALL_ARGS=$(echo "$ALL_ARGS" | xargs)
          if [ -z "$ALL_ARGS" ]; then
            gh api "$COMMENTS_URL" \
              -f body="[Bot]: \`/presmoke\` without test names will not dispatch. Please specify test names, e.g. \`/presmoke all\` or \`/presmoke test_custom_op\`." \
              --silent
            exit 1
          fi

          BRANCH="main"
          VLLM_REF=""
          TEST_CASES=""
          IS_A3_560T="false"
          NEXT_IS_BRANCH=0
          NEXT_IS_VLLM_REF=0
          # Preserve slash-command tokens literally; do not expand '*' or '?'
          # against files in the runner workspace.
          set -f
          for WORD in $ALL_ARGS; do
            if { [ "$NEXT_IS_BRANCH" = "1" ] || [ "$NEXT_IS_VLLM_REF" = "1" ]; } && [[ "$WORD" == --* ]]; then
              echo "ERROR: --branch/--vllm-ref requires a value"
              exit 1
            fi
            case "$WORD" in
              --branch)
                NEXT_IS_BRANCH=1
                ;;
              --vllm-ref)
                NEXT_IS_VLLM_REF=1
                ;;
              --a3-560t)
                IS_A3_560T="true"
                ;;
              --*)
                echo "ERROR: unknown option: $WORD"
                exit 1
                ;;
              *)
                if [ "$NEXT_IS_BRANCH" = "1" ]; then
                  BRANCH="$WORD"
                  NEXT_IS_BRANCH=0
                elif [ "$NEXT_IS_VLLM_REF" = "1" ]; then
                  VLLM_REF="$WORD"
                  NEXT_IS_VLLM_REF=0
                elif [ -z "$TEST_CASES" ]; then
                  TEST_CASES="$WORD"
                else
                  TEST_CASES="$TEST_CASES,$WORD"
                fi
                ;;
            esac
          done

          if [ "$NEXT_IS_BRANCH" = "1" ]; then
            echo "ERROR: --branch requires a value"
            exit 1
          fi
          if [ "$NEXT_IS_VLLM_REF" = "1" ]; then
            echo "ERROR: --vllm-ref requires a value"
            exit 1
          fi
          if [ -n "$VLLM_REF" ] &&
             ! [[ "$VLLM_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "ERROR: --vllm-ref must be a vllm commit SHA, tag (e.g. v0.29.0), or branch name"
            exit 1
          fi

          if [ -z "$TEST_CASES" ]; then
            gh api "$COMMENTS_URL" \
              -f body="[Bot]: \`/presmoke\` without test names will not dispatch. Please specify test names, e.g. \`/presmoke all\` or \`/presmoke test_custom_op\`." \
              --silent
            exit 1
          fi

          {
            echo "test_cases=$TEST_CASES"
            echo "branch=$BRANCH"
            echo "vllm_ref=$VLLM_REF"
          } >> "$GITHUB_OUTPUT"

          PR_SHA=$(gh api "$PR_URL" --jq '.head.sha')
          PR_NUMBER=$(gh api "$PR_URL" --jq '.number')
          echo "vllm_ascend_ref=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$TEST_CASES" = "all" ]; then
            if [ "$IS_A3_560T" = "true" ]; then
              echo "dispatch_a3_560t=true" >> "$GITHUB_OUTPUT"
            else
              {
                echo "dispatch_a2=true"
                echo "dispatch_a3=true"
                echo "dispatch_310p=true"
                echo "dispatch_a5=true"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Fetch the matching test matrix from the PR head ref via pull/<num>/head,
          # which is accessible through the base repo without fork access permission.
          NIGHTLY_MATRIX=$(gh api "repos/$REPO/contents/.github/workflows/configs/nightly_config.yaml?ref=pull/$PR_NUMBER/head" --jq '.content' 2>/dev/null || echo "")
          export NIGHTLY_MATRIX
          export TEST_CASES
          export IS_A3_560T

          python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=dispatch

  dispatch-image:
    name: Build presmoke images
    needs: [authorize]
    if: github.event_name == 'repository_dispatch' && needs.authorize.outputs.is_authorized == 'true' && needs.authorize.outputs.blocked != 'true'
    runs-on: linux-amd64-cpu-4-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    outputs:
      image_run_id: ${{ steps.dispatch_image.outputs.image_run_id }}
    steps:
      - name: Install system dependencies
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install gh -y

      - name: Dispatch presmoke image build
        id: dispatch_image
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO='${{ github.event.client_payload.github.payload.repository.full_name }}'
          # Hand the build off to this same workflow file via workflow_dispatch,
          # so the reusable build chain runs under github.event_name ==
          # 'workflow_dispatch' and _schedule_image_build.yaml publishes the SWR tag.
          gh workflow run pr_presmoke_command.yml \
            --repo "$REPO" \
            --ref main \
            -f vllm_ascend_branch='${{ needs.authorize.outputs.vllm_ascend_ref }}'
          sleep 8
          IMAGE_RUN_ID=$(gh api "repos/$REPO/actions/workflows/pr_presmoke_command.yml/runs?event=workflow_dispatch&per_page=1" \
            --jq '.workflow_runs[0].id')
          echo "image_run_id=$IMAGE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched presmoke image build for ref '${{ needs.authorize.outputs.vllm_ascend_ref }}'"

  dispatch-a2:
    name: Trigger Nightly-A2
    needs: [authorize]
    if: github.event_name == 'repository_dispatch' && needs.authorize.outputs.is_authorized == 'true' && needs.authorize.outputs.blocked != 'true' && needs.authorize.outputs.dispatch_a2 == 'true'
    runs-on: linux-amd64-cpu-4-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    outputs:
      a2_run_id: ${{ steps.dispatch_a2.outputs.a2_run_id }}
    steps:
      - name: Install system dependencies
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install gh -y

      - name: Dispatch presmoke-a2 tests
        id: dispatch_a2
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VLLM_REF: ${{ needs.authorize.outputs.vllm_ref }}
        run: |
          REPO='${{ github.event.client_payload.github.payload.repository.full_name }}'
          gh workflow run schedule_nightly_test_a2.yaml \
            --repo "$REPO" \
            --ref main \
            -f test_cases='${{ needs.authorize.outputs.test_cases }}' \
            -f vllm_ascend_branch='${{ needs.authorize.outputs.branch }}' \
            -f request_id='${{ needs.authorize.outputs.pr_number }}' \
            -f skip_build_image=true \
            -f vllm_ascend_ref='${{ needs.authorize.outputs.vllm_ascend_ref }}' \
            -f vllm_ref="$VLLM_REF"
          sleep 8
          A2_RUN_ID=$(gh api "repos/$REPO/actions/workflows/schedule_nightly_test_a2.yaml/runs?per_page=1" \
            --jq '.workflow_runs[0].id')
          echo "a2_run_id=$A2_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched presmoke tests on Nightly-A2 with test_cases='${{ needs.authorize.outputs.test_cases }}', branch='${{ needs.authorize.outputs.branch }}', vllm_ref='${{ needs.authorize.outputs.vllm_ref }}'"

  dispatch-a3:
    name: Trigger Nightly-A3
    needs: [authorize]
    if: github.event_name == 'repository_dispatch' && needs.authorize.outputs.is_authorized == 'true' && needs.authorize.outputs.blocked != 'true' && needs.authorize.outputs.dispatch_a3 == 'true'
    runs-on: linux-amd64-cpu-4-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    outputs:
      a3_run_id: ${{ steps.dispatch_a3.outputs.a3_run_id }}
    steps:
      - name: Install system dependencies
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install gh -y

      - name: Dispatch presmoke-a3 tests
        id: dispatch_a3
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VLLM_REF: ${{ needs.authorize.outputs.vllm_ref }}
        run: |
          REPO='${{ github.event.client_payload.github.payload.repository.full_name }}'
