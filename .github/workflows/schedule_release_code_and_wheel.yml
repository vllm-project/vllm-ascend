name: Release Code and Wheel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag for build results'
        default: main
        required: true
        type: choice
        options:
          - main
          - v0.26.0rc1
          - v0.23.0
          - v0.23.0rc1
          - v0.22.1rc1
          - v0.21.0rc1
          - v0.20.2rc1

jobs:
  build_and_release_code:
    name: release code
    runs-on: linux-amd64-cpu-8-hk
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: checkout vllm-ascend
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: checkout vllm-ascend ${{ inputs.tag }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}

      - name: Print
        run: |
          lscpu

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install twine setuptools_scm

      - name: Generate tar.gz
        env:
          SOC_VERSION: ascend910b1
        run: |
          python3 setup.py sdist
          ls dist

      - name: Archive tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: vllm-ascend-src
          path: dist/*

      - name: Release
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 -m twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}

  build_and_release_wheel:
    name: build and release wheel
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout vllm-ascend
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: checkout vllm-ascend ${{ inputs.tag }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Build wheel
        run: |
          ls
          docker build -f ./.github/workflows/dockerfiles/Dockerfile.buildwheel.a2 \
          --build-arg PY_VERSION=${{ matrix.python-version }} \
          -t wheel:v1 .
          docker run --rm \
          --entrypoint /bin/bash \
          -u "$(id -u):$(id -g)" \
          -v "$(pwd):/outpwd" \
          wheel:v1 \
          -c "cp -r /workspace/vllm-ascend/dist /outpwd"
          ls dist

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair wheels with auditwheel
        run: |
          python3 -m pip install auditwheel patchelf
          python3 .github/workflows/scripts/wheel/auto_exclude.py dist
          ls dist

      - name: Verify automatic platform tags
        run: |
          cd dist
          for wheel in *.whl; do
            echo "verification file: $wheel"
            auditwheel show "$wheel"
          done

      - name: Generate variant wheels
        env:
          WHEEL_FILE: dist
          PROJECT_TOML: .github/workflows/scripts/wheel/pyproject.toml
          OUTPUT_DIR: dist/variants
          VARIANT_LABEL: 910b
        run: |
          pip install build git+https://github.com/wheelnext/variantlib.git@67a62d53fb8b5a91334d9632bc7d1546ee67349e --quiet
          mkdir -p dist/variants
          python3 .github/workflows/scripts/wheel/make_variant.py \
            -c .github/workflows/scripts/wheel/config.json \
            -l "${VARIANT_LABEL}"
          echo "Generated variant wheels:"
          ls dist/variants/

      - name: Stage per-platform wheels
        env:
          PLATFORM: a2
        run: |
          # Reuse the non-variant wheel built for this platform as the plain wheel
          # published to the per-platform pip directory (platforms/ on the mirror).
          mkdir -p "dist/platforms/${PLATFORM}"
          cp dist/*.whl "dist/platforms/${PLATFORM}/"
          echo "Staged plain wheels for platform ${PLATFORM}:"
          ls "dist/platforms/${PLATFORM}/"

      - name: Archive wheel
        uses: actions/upload-artifact@v7
        with:
          name: vllm-ascend-${{ matrix.os }}-py${{ matrix.python-version }}-wheel
          path: dist/

      - name: Release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 -m pip install twine
          python3 -m twine upload --verbose dist/*.whl -u __token__ -p ${{ secrets.PYPI_TOKEN }}


