  generate_and_upload_variant_index:
    name: generate and upload variant index
    needs: [build_and_release_wheel, build_and_release_wheel_a3, build_and_release_wheel_310p, build_and_release_wheel_a5]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel'
          path: all-wheels/
          merge-multiple: true

      - name: Collect variant wheels
        run: |
          mkdir -p combined-variants
          find all-wheels/ -path '*/variants/*.whl' -exec cp {} combined-variants/ \;
          echo "Combined variant wheels:"
          ls combined-variants/
          echo "Per-platform plain wheels:"
          find all-wheels/platforms -name '*.whl' | sort

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate combined variant index
        run: |
          pip install git+https://github.com/wheelnext/variantlib.git@67a62d53fb8b5a91334d9632bc7d1546ee67349e --quiet
          variantlib generate-index-json -d combined-variants/
          echo "Generated index files:"
          ls combined-variants/

      - name: Install OBS SDK
        run: |
          pip install esdk-obs-python --quiet

      - name: Upload variant wheels and index to OBS
        env:
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY_ID }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'EOF'
          import os, glob
          from obs import ObsClient
          OBS_BUCKET = 'ascend-artifcat-packages'
          OBS_PATH = 'pypi/packages/ascend/repos/pypi/variant/vllm-ascend'
          client = ObsClient(
              access_key_id=os.environ['OBS_ACCESS_KEY'],
              secret_access_key=os.environ['OBS_SECRET_KEY'],
              server='https://obs.cn-north-4.myhuaweicloud.com'
          )
          files = glob.glob('combined-variants/*.whl') + glob.glob('combined-variants/*.json')
          for file in files:
              object_key = f'{OBS_PATH}/{os.path.basename(file)}'
              resp = client.putFile(OBS_BUCKET, object_key, file)
              if resp.status < 300:
                  print(f'Uploaded: {object_key}')
              else:
                  raise Exception(f'Failed to upload {object_key}: {resp.errorMessage}')
          EOF

      - name: Upload per-platform wheels to OBS
        env:
          OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY_ID }}
          OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'EOF'
          import os, glob
          from obs import ObsClient
          OBS_BUCKET = 'ascend-artifcat-packages'
          # Plain (non-variant) wheels consumed by plain pip, e.g.
          #   --index-url https://mirrors.huaweicloud.com/ascend/repos/pypi/platforms/a3
          #   --find-links https://mirrors.huaweicloud.com/ascend/repos/pypi/platforms/a3/vllm-ascend/
          OBS_PLATFORM_ROOT = 'pypi/packages/ascend/repos/pypi/platforms'
          platform_wheels = sorted(glob.glob('all-wheels/platforms/*/*.whl'))
          if not platform_wheels:
              raise Exception('No per-platform wheels found; expected all-wheels/platforms/*/*.whl')
          client = ObsClient(
              access_key_id=os.environ['OBS_ACCESS_KEY'],
              secret_access_key=os.environ['OBS_SECRET_KEY'],
              server='https://obs.cn-north-4.myhuaweicloud.com'
          )
          for file in platform_wheels:
              platform = os.path.basename(os.path.dirname(file))
              object_key = f'{OBS_PLATFORM_ROOT}/{platform}/vllm-ascend/{os.path.basename(file)}'
              resp = client.putFile(OBS_BUCKET, object_key, file)
              if resp.status < 300:
                  print(f'Uploaded: {object_key}')
              else:
                  raise Exception(f'Failed to upload {object_key}: {resp.errorMessage}')
          EOF
