# SPDX-License-Identifier: Apache-2.0
name: Seed release branch version tag

on:
  create:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch needing a version baseline (releases/vX.Y.Z or releases/vX.Y.Zrc)'
        required: true
        type: string

concurrency:
  group: release-version-tag-${{ inputs.release_branch || github.event.ref }}
  cancel-in-progress: false

jobs:
  seed:
    if: >-
      github.repository == 'vllm-project/vllm-ascend' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'releases/')))
    runs-on: linux-amd64-cpu-2-hk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Always execute the maintained helper, even for an older target branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install helper dependency
        run: python3 -m pip install regex

      - name: Seed missing release version baseline
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch || github.event.ref }}
          CREATION_SHA: ${{ github.event_name == 'create' && github.sha || '' }}
        run: |
          args=(--branch "$RELEASE_BRANCH")
          if [ -n "$CREATION_SHA" ]; then
            args+=(--creation-sha "$CREATION_SHA")
          fi
          python3 .github/workflows/scripts/seed_release_branch_tag.py "${args[@]}"
