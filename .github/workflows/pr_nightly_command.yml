name: Handle /nightly Command

on:
  repository_dispatch:
    types: [nightly-command, presmoke-command, weekly-command]

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

jobs:
  authorize:
    name: Check user authorization
    runs-on: linux-amd64-cpu-4-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    outputs:
      test_cases: ${{ steps.resolve.outputs.test_cases }}
      branch: ${{ steps.resolve.outputs.branch }}
      is_authorized: ${{ steps.auth.outputs.is_authorized }}
      dispatch_a2: ${{ steps.resolve.outputs.dispatch_a2 }}
      dispatch_a3: ${{ steps.resolve.outputs.dispatch_a3 }}
      dispatch_a3_560t: ${{ steps.resolve.outputs.dispatch_a3_560t }}
      dispatch_310p: ${{ steps.resolve.outputs.dispatch_310p }}
      dispatch_a5: ${{ steps.resolve.outputs.dispatch_a5 }}
      vllm_ascend_ref: ${{ steps.resolve.outputs.vllm_ascend_ref }}
      aop_enabled: ${{ steps.resolve.outputs.aop_enabled }}
      profile_options_json: ${{ steps.resolve.outputs.profile_options_json }}
      bisect_args_json: ${{ steps.resolve.outputs.bisect_args_json }}
      command: ${{ steps.resolve.outputs.command }}
      presmoke_image: ${{ steps.resolve.outputs.presmoke_image }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      download_path: ${{ steps.resolve.outputs.download_path }}
      blocked: ${{ steps.block_window.outputs.blocked }}
      vllm_ref: ${{ steps.resolve.outputs.vllm_ref }}
      dispatch_matrix: ${{ steps.dispatch_targets.outputs.matrix }}
    steps:
      - name: Install system dependencies
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install gh -y

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          sparse-checkout: |
            .github/workflows/scripts/resolve_nightly_tests.py
            .github/workflows/scripts/collect_download.py
            .github/workflows/configs/nightly_config.yaml
            .github/workflows/configs/weekly_config.yaml
          sparse-checkout-cone-mode: false

      - name: Check user authorization
        id: auth
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ACTOR: ${{ github.event.client_payload.github.payload.comment.user.login }}
          REPO: ${{ github.event.client_payload.github.payload.repository.full_name }}
        run: |
          ROLE_NAME=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.role_name')
          case "$ROLE_NAME" in
            triage|write|maintain|admin)
              echo "User $ACTOR has $ROLE_NAME role, authorized."
              echo "is_authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::User $ACTOR does not have triage+ permission and is not authorized to trigger nightly tests."
              echo "is_authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Post unauthorized comment
        if: steps.auth.outputs.is_authorized == 'false'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: |
            [Bot]: nightly command failed: you do not have permission. Only users with triage+ permission can trigger /nightly.
          reactions: confused

      - name: Fail if unauthorized
        if: steps.auth.outputs.is_authorized == 'false'
        run: exit 1

      # Maintenance window gate. Controlled by the repository variable
      # NIGHTLY_COMMAND_BLOCK_WINDOW. The value is an optional switch followed by
      # an HH:MM-HH:MM window in Beijing time (UTC+8, cross-midnight supported),
      # for example "true 22:00-08:00", "false 22:00-08:00" or just
      # "22:00-08:00". Switch aliases: true/1/yes/on and false/0/no/off
      # (case-insensitive); space or comma separators are accepted. When enabled
      # and the current Beijing time falls inside the window, the /nightly and
      # /weekly comment triggers are blocked. Unset, explicitly disabled or
      # malformed values disable the gate (fail-open).
      - name: Check command block window
        id: block_window
        if: steps.auth.outputs.is_authorized == 'true'
        env:
          BLOCK_WINDOW: ${{ vars.NIGHTLY_COMMAND_BLOCK_WINDOW }}
          COMMAND: ${{ github.event.action }}
        run: |
          echo "command=${COMMAND%-command}" >> "$GITHUB_OUTPUT"
          BLOCKED="false"
          RAW="$(echo "$BLOCK_WINDOW" | tr ',' ' ' | xargs)"
          ENABLED="auto"
          WINDOW=""
          if [ -n "$RAW" ]; then
            read -r FIRST SECOND _REST <<< "$RAW"
            case "$(echo "$FIRST" | tr '[:upper:]' '[:lower:]')" in
              true|1|yes|on)
                ENABLED="true"
                WINDOW="$SECOND"
                ;;
              false|0|no|off)
                ENABLED="false"
                WINDOW="$SECOND"
                ;;
              *)
                ENABLED="auto"
                WINDOW="$FIRST"
                ;;
            esac
          fi
          if [ "$ENABLED" = "false" ]; then
            echo "NIGHTLY_COMMAND_BLOCK_WINDOW explicitly disabled."
          elif [ -z "$WINDOW" ]; then
            if [ "$ENABLED" = "true" ]; then
              echo "::warning::Gate enabled in NIGHTLY_COMMAND_BLOCK_WINDOW but no window is set (expected HH:MM-HH:MM); block window disabled."
            else
              echo "NIGHTLY_COMMAND_BLOCK_WINDOW is not set; block window disabled."
            fi
          elif [[ ! "$WINDOW" =~ ^([0-9]{2}):([0-9]{2})-([0-9]{2}):([0-9]{2})$ ]]; then
            echo "::warning::Invalid NIGHTLY_COMMAND_BLOCK_WINDOW='$WINDOW' (expected HH:MM-HH:MM); block window disabled."
          else
            SH=${BASH_REMATCH[1]}
            SM=${BASH_REMATCH[2]}
            EH=${BASH_REMATCH[3]}
            EM=${BASH_REMATCH[4]}
            if (( 10#$SH > 23 || 10#$SM > 59 || 10#$EH > 23 || 10#$EM > 59 )); then
              echo "::warning::Out-of-range time in NIGHTLY_COMMAND_BLOCK_WINDOW='$WINDOW'; block window disabled."
            else
              START_MIN=$((10#$SH * 60 + 10#$SM))
              END_MIN=$((10#$EH * 60 + 10#$EM))
              NOW_MIN=$((10#$(date -u -d '+8 hours' +%H) * 60 + 10#$(date -u -d '+8 hours' +%M)))
              if (( START_MIN <= END_MIN )); then
                if (( NOW_MIN >= START_MIN && NOW_MIN < END_MIN )); then
                  BLOCKED="true"
                fi
              else
                if (( NOW_MIN >= START_MIN || NOW_MIN < END_MIN )); then
                  BLOCKED="true"
                fi
              fi
            fi
          fi
          {
            echo "blocked=$BLOCKED"
            echo "window=$WINDOW"
          } >> "$GITHUB_OUTPUT"
          if [ "$BLOCKED" = "true" ]; then
            echo "Command /${COMMAND%-command} is blocked until the maintenance window ends."
          fi

      - name: Post blocked comment
        if: steps.auth.outputs.is_authorized == 'true' && steps.block_window.outputs.blocked == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: |
            [Bot]: `/${{ steps.block_window.outputs.command }}` is temporarily disabled during the maintenance window (Beijing time `${{ steps.block_window.outputs.window }}`). Please retry after the window ends.
          reactions: confused

      - name: Install Python dependencies
        if: steps.auth.outputs.is_authorized == 'true' && steps.block_window.outputs.blocked != 'true'
        run: pip3 install pyyaml -q

      - name: Resolve test cases and branch
        id: resolve
        if: steps.auth.outputs.is_authorized == 'true' && steps.block_window.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ALL_ARGS: ${{ github.event.client_payload.slash_command.args.all }}
          PR_URL: ${{ github.event.client_payload.github.payload.issue.pull_request.url }}
          COMMAND: ${{ github.event.action }}
        run: |
          # Derive command type from repository_dispatch action (e.g. nightly-command -> nightly)
          COMMAND="${COMMAND%-command}"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"

          ALL_ARGS=$(echo "$ALL_ARGS" | xargs)
          if [ -z "$ALL_ARGS" ]; then
            gh api "repos/${{ github.event.client_payload.github.payload.repository.full_name }}/issues/${{ github.event.client_payload.github.payload.issue.number }}/comments" \
              -f body="[Bot]: \`/$COMMAND\` without test names will not dispatch. Please specify test names, e.g. \`/$COMMAND all\` or \`/$COMMAND test_custom_op\`." \
              --silent
            exit 1
          fi

          BRANCH="main"
          VLLM_REF=""
          TEST_CASES=""
          AOP_ENABLED="false"
          PROFILE_OPTIONS_JSON='{}'
          IS_A3_560T="false"
          IS_PRESMOKE_IMAGE="false"
          NEXT_IS_BRANCH=0
          NEXT_IS_DOWNLOAD=0
          DOWNLOAD_PATH=""
          NEXT_IS_VLLM_REF=0
          NEXT_IS_GOOD_COMMIT=0
          NEXT_IS_BAD_COMMIT=0
          NEXT_IS_FAIL_CONFIRM_RETRIES=0
          NEXT_IS_TRIAL_TIMEOUT=0
          NEXT_IS_BARRIER_TIMEOUT=0
          BISECT_GOOD_COMMIT=""
          BISECT_BAD_COMMIT="HEAD"
          BISECT_FAIL_CONFIRM_RETRIES=""
          BISECT_TRIAL_TIMEOUT=""
          BISECT_BARRIER_TIMEOUT=""
          BISECT_NO_VERIFY_GOOD="false"
          BISECT_NO_VERIFY_BAD="false"
          BISECT_FORCE_INITIAL_BUILD="false"
          PENDING_OPTION=""
          # Preserve slash-command tokens literally; do not expand '*' or '?'
          # against files in the runner workspace.
          set -f
          for WORD in $ALL_ARGS; do
            case "$WORD" in
              --good-commit|--bad-commit|--fail-confirm-retries|--trial-timeout|--barrier-timeout|\
              --no-verify-good|--no-verify-bad|--force-initial-build)
                if [ "$AOP_ENABLED" != "true" ]; then
                  echo "ERROR: $WORD must appear after --aop_enabled"
                  exit 1
                fi
                ;;
            esac

            if [ -n "$PENDING_OPTION" ] && [[ "$WORD" == --* ]]; then
              echo "ERROR: $PENDING_OPTION requires a value"
              exit 1
            fi

            if [ "$NEXT_IS_BRANCH" = "1" ]; then
              BRANCH="$WORD"
              NEXT_IS_BRANCH=0
            elif [ "$NEXT_IS_DOWNLOAD" = "1" ]; then
              DOWNLOAD_PATH="$WORD"
              NEXT_IS_DOWNLOAD=0
            elif [ "$PENDING_OPTION" = "--profile-start-after" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c --arg value "$WORD" '.start_after = $value' <<< "$PROFILE_OPTIONS_JSON")
              PENDING_OPTION=""
            elif [ "$PENDING_OPTION" = "--profile-start-after-requests" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c --arg value "$WORD" '.start_after_requests = $value' <<< "$PROFILE_OPTIONS_JSON")
              PENDING_OPTION=""
            elif [ "$PENDING_OPTION" = "--profile-duration" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c --arg value "$WORD" '.duration = $value' <<< "$PROFILE_OPTIONS_JSON")
              PENDING_OPTION=""
            elif [ "$PENDING_OPTION" = "--profile-output" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c --arg value "$WORD" '.output = $value' <<< "$PROFILE_OPTIONS_JSON")
              PENDING_OPTION=""
            elif [ "$PENDING_OPTION" = "--profile-benchmark-names" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c --arg value "$WORD" '.benchmark_names = $value' <<< "$PROFILE_OPTIONS_JSON")
              PENDING_OPTION=""
            elif [ "$NEXT_IS_VLLM_REF" = "1" ]; then
              VLLM_REF="$WORD"
              NEXT_IS_VLLM_REF=0
              PENDING_OPTION=""
            elif [ "$NEXT_IS_GOOD_COMMIT" = "1" ]; then
              BISECT_GOOD_COMMIT="$WORD"
              NEXT_IS_GOOD_COMMIT=0
              PENDING_OPTION=""
            elif [ "$NEXT_IS_BAD_COMMIT" = "1" ]; then
              BISECT_BAD_COMMIT="$WORD"
              NEXT_IS_BAD_COMMIT=0
              PENDING_OPTION=""
            elif [ "$NEXT_IS_FAIL_CONFIRM_RETRIES" = "1" ]; then
              BISECT_FAIL_CONFIRM_RETRIES="$WORD"
              NEXT_IS_FAIL_CONFIRM_RETRIES=0
              PENDING_OPTION=""
            elif [ "$NEXT_IS_TRIAL_TIMEOUT" = "1" ]; then
              BISECT_TRIAL_TIMEOUT="$WORD"
              NEXT_IS_TRIAL_TIMEOUT=0
              PENDING_OPTION=""
            elif [ "$NEXT_IS_BARRIER_TIMEOUT" = "1" ]; then
              BISECT_BARRIER_TIMEOUT="$WORD"
              NEXT_IS_BARRIER_TIMEOUT=0
              PENDING_OPTION=""
            elif [ "$WORD" = "--branch" ]; then
              NEXT_IS_BRANCH=1
            elif [ "$WORD" = "--log-path" ]; then
              NEXT_IS_DOWNLOAD=1
            elif [ "$WORD" = "--vllm-ref" ]; then
              NEXT_IS_VLLM_REF=1
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--aop_enabled" ]; then
              if [ -z "$TEST_CASES" ]; then
                echo "ERROR: --aop_enabled must appear after at least one test case"
                exit 1
              fi
              AOP_ENABLED="true"
            elif [ "$WORD" = "--a3-560t" ]; then
              IS_A3_560T="true"
            elif [ "$WORD" = "--presmoke" ]; then
              IS_PRESMOKE_IMAGE="true"
            elif [ "$WORD" = "--profile" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c '.enabled = true' <<< "$PROFILE_OPTIONS_JSON")
            elif [ "$WORD" = "--profile-with-stack" ]; then
              PROFILE_OPTIONS_JSON=$(jq -c '.with_stack = true' <<< "$PROFILE_OPTIONS_JSON")
            elif [[ "$WORD" =~ ^--profile-(start-after|start-after-requests|duration|output|benchmark-names)$ ]]; then
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--good-commit" ]; then
              NEXT_IS_GOOD_COMMIT=1
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--bad-commit" ]; then
              NEXT_IS_BAD_COMMIT=1
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--fail-confirm-retries" ]; then
              NEXT_IS_FAIL_CONFIRM_RETRIES=1
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--trial-timeout" ]; then
              NEXT_IS_TRIAL_TIMEOUT=1
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--barrier-timeout" ]; then
              NEXT_IS_BARRIER_TIMEOUT=1
              PENDING_OPTION="$WORD"
            elif [ "$WORD" = "--no-verify-good" ]; then
              BISECT_NO_VERIFY_GOOD="true"
            elif [ "$WORD" = "--no-verify-bad" ]; then
              BISECT_NO_VERIFY_BAD="true"
            elif [ "$WORD" = "--force-initial-build" ]; then
              BISECT_FORCE_INITIAL_BUILD="true"
            elif [[ "$WORD" == --* ]]; then
              echo "ERROR: unknown option: $WORD"
              exit 1
            else
              if [ -z "$TEST_CASES" ]; then
                TEST_CASES="$WORD"
              else
                TEST_CASES="$TEST_CASES,$WORD"
              fi
            fi
          done

          if [ -n "$PENDING_OPTION" ]; then
            echo "ERROR: $PENDING_OPTION requires a value"
            exit 1
          fi
          if [ "$NEXT_IS_DOWNLOAD" = "1" ]; then
            echo "ERROR: --log-path requires a value"
            exit 1
          fi
          if [ -n "$DOWNLOAD_PATH" ]; then
            python3 .github/workflows/scripts/collect_download.py "$DOWNLOAD_PATH" --list >/dev/null
          fi
          if jq -e '.enabled == true' <<< "$PROFILE_OPTIONS_JSON" >/dev/null && [ "$COMMAND" != "nightly" ]; then
            echo "ERROR: profiling is supported only by Nightly workflows"
            exit 1
          fi
          if [ "$IS_PRESMOKE_IMAGE" = "true" ] && [ "$COMMAND" != "nightly" ]; then
            echo "ERROR: --presmoke is supported only by the /nightly command (use /presmoke to build the image)"
            exit 1
          fi

          if [ -n "$BISECT_GOOD_COMMIT" ] &&
             ! [[ "$BISECT_GOOD_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "ERROR: --good-commit must be a 7-40 character hexadecimal commit SHA"
            exit 1
          fi
          if [ "$BISECT_BAD_COMMIT" != "HEAD" ] &&
             ! [[ "$BISECT_BAD_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "ERROR: --bad-commit must be HEAD or a 7-40 character hexadecimal commit SHA"
            exit 1
          fi
          if [ -n "$BISECT_FAIL_CONFIRM_RETRIES" ] &&
             ! [[ "$BISECT_FAIL_CONFIRM_RETRIES" =~ ^[0-9]+$ ]]; then
            echo "ERROR: --fail-confirm-retries must be a non-negative integer"
            exit 1
          fi
          for TIMEOUT_VALUE in "$BISECT_TRIAL_TIMEOUT" "$BISECT_BARRIER_TIMEOUT"; do
            if [ -n "$TIMEOUT_VALUE" ] &&
               { ! [[ "$TIMEOUT_VALUE" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
                 [[ "$TIMEOUT_VALUE" =~ ^0+([.]0+)?$ ]]; }; then
              echo "ERROR: bisect timeout values must be positive numbers"
              exit 1
            fi
          done

          if [ -n "$VLLM_REF" ] &&
             ! [[ "$VLLM_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "ERROR: --vllm-ref must be a vllm commit SHA, tag (e.g. v0.29.0), or branch name"
            exit 1
          fi

          if [ -z "$TEST_CASES" ]; then
            gh api "repos/${{ github.event.client_payload.github.payload.repository.full_name }}/issues/${{ github.event.client_payload.github.payload.issue.number }}/comments" \
              -f body="[Bot]: \`/$COMMAND\` without test names will not dispatch. Please specify test names, e.g. \`/$COMMAND all\` or \`/$COMMAND test_custom_op\`." \
              --silent
            exit 1
          fi


          printf -v BISECT_ARGS_JSON \
            '{"good_commit":"%s","bad_commit":"%s","fail_confirm_retries":"%s","trial_timeout":"%s","barrier_timeout":"%s","no_verify_good":%s,"no_verify_bad":%s,"force_initial_build":%s}' \
            "$BISECT_GOOD_COMMIT" \
            "$BISECT_BAD_COMMIT" \
            "$BISECT_FAIL_CONFIRM_RETRIES" \
            "$BISECT_TRIAL_TIMEOUT" \
            "$BISECT_BARRIER_TIMEOUT" \
            "$BISECT_NO_VERIFY_GOOD" \
            "$BISECT_NO_VERIFY_BAD" \
            "$BISECT_FORCE_INITIAL_BUILD"
          {
            echo "test_cases=$TEST_CASES"
            echo "branch=$BRANCH"
            echo "download_path=$DOWNLOAD_PATH"
            echo "aop_enabled=$AOP_ENABLED"
            echo "profile_options_json=$PROFILE_OPTIONS_JSON"
            echo "presmoke_image=$IS_PRESMOKE_IMAGE"
            echo "vllm_ref=$VLLM_REF"
            echo "bisect_good_commit=$BISECT_GOOD_COMMIT"
            echo "bisect_bad_commit=$BISECT_BAD_COMMIT"
            echo "bisect_fail_confirm_retries=$BISECT_FAIL_CONFIRM_RETRIES"
            echo "bisect_trial_timeout=$BISECT_TRIAL_TIMEOUT"
            echo "bisect_barrier_timeout=$BISECT_BARRIER_TIMEOUT"
            echo "bisect_no_verify_good=$BISECT_NO_VERIFY_GOOD"
            echo "bisect_no_verify_bad=$BISECT_NO_VERIFY_BAD"
            echo "bisect_force_initial_build=$BISECT_FORCE_INITIAL_BUILD"
            echo "bisect_args_json=$BISECT_ARGS_JSON"
          } >> "$GITHUB_OUTPUT"

          PR_SHA=$(gh api "$PR_URL" --jq '.head.sha')
          PR_NUMBER=$(gh api "$PR_URL" --jq '.number')
          echo "vllm_ascend_ref=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # /presmoke pre-merges the PR: both image layers are built from the PR head
          # ref, so the code, Dockerfiles and dependency versions under test are the
          # ones being reviewed. The branch still decides the published tag, so the
          # tag names stay identical to the standard nightly images.
          SOURCE_REF=""
          if [ "$COMMAND" = "presmoke" ]; then
            SOURCE_REF="refs/pull/$PR_NUMBER/head"
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

          # The /presmoke command takes chip names directly, with no inference
          # from test names: /presmoke all builds every chip, /presmoke a2 a3
          # builds only those. Only a2/a3/310p/a5 are valid.
          if [ "$COMMAND" = "presmoke" ]; then
            CHIP_LIST=""
            if [ "$TEST_CASES" = "all" ]; then
              CHIP_LIST="a2 a3 310p a5"
            else
              for CHIP in $(echo "$TEST_CASES" | tr ',' ' '); do
                case "$CHIP" in
                  a2|a3|310p|a5)
                    CHIP_LIST="$CHIP_LIST $CHIP"
                    ;;
                  *)
                    gh api "repos/${{ github.event.client_payload.github.payload.repository.full_name }}/issues/${{ github.event.client_payload.github.payload.issue.number }}/comments" \
                      -f body="[Bot]: \`/presmoke\` accepts chip names only: a2, a3, 310p, a5 (or \`all\`). Got: \`$CHIP\`." \
                      --silent
                    exit 1
                    ;;
                esac
              done
            fi
            for CHIP in $CHIP_LIST; do
              echo "dispatch_${CHIP}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          if [ "$TEST_CASES" = "all" ]; then
            if [ "$IS_A3_560T" = "true" ]; then
              {
                echo "dispatch_a3_560t=true"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "dispatch_a2=true"
                echo "dispatch_a3=true"
                echo "dispatch_310p=true"
                echo "dispatch_a5=true"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Fetch the matching test matrix from the PR head ref via pull/<num>/head,
          # which is accessible through the base repo without fork access permission.
          # Nightly and presmoke read nightly_config.yaml; weekly reads
          # weekly_config.yaml. resolve_nightly_tests.py picks the non-empty one.
          REPO='${{ github.event.client_payload.github.payload.repository.full_name }}'
          case "$COMMAND" in
            nightly|presmoke)
              NIGHTLY_MATRIX=$(gh api "repos/$REPO/contents/.github/workflows/configs/nightly_config.yaml?ref=pull/$PR_NUMBER/head" --jq '.content' 2>/dev/null || echo "")
              ;;
            weekly)
              WEEKLY_MATRIX=$(gh api "repos/$REPO/contents/.github/workflows/configs/weekly_config.yaml?ref=pull/$PR_NUMBER/head" --jq '.content' 2>/dev/null || echo "")
              ;;
          esac
          export NIGHTLY_MATRIX
          export WEEKLY_MATRIX
          export TEST_CASES
          export IS_A3_560T

          python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=dispatch

      - name: Resolve dispatch targets
        id: dispatch_targets
        env:
          COMMAND: ${{ steps.resolve.outputs.command }}
          DISPATCH_A2: ${{ steps.resolve.outputs.dispatch_a2 }}
          DISPATCH_A3: ${{ steps.resolve.outputs.dispatch_a3 }}
          DISPATCH_A3_560T: ${{ steps.resolve.outputs.dispatch_a3_560t }}
          DISPATCH_310P: ${{ steps.resolve.outputs.dispatch_310p }}
          DISPATCH_A5: ${{ steps.resolve.outputs.dispatch_a5 }}
        run: |
          # Compose the matrix for the dispatch job: one leg per selected
          # target. An empty matrix would fail the job, so emit a noop leg
          # instead; it matches the all-skip behavior of the former per-target
          # dispatch jobs and lets post-links still report the command result.
          INCLUDE='[]'
          add_leg() {
            # The value lands under the "label" matrix key, but the jq
            # variable must not be called $label: jq 1.6 (Ubuntu 22.04)
            # treats label as a reserved keyword and rejects keyword
            # $variable names.
            INCLUDE=$(jq -c --arg target "$1" --arg chip "$2" --arg workflow "$3" --arg text "$4" \
              '. + [{"target": $target, "chip": $chip, "workflow": $workflow, "label": $text}]' <<< "$INCLUDE")
          }
          case "$COMMAND" in
            presmoke)
              # Chip gating happens inside the leg: it fails when no chip was
              # selected (same as the former dispatch-presmoke job).
              add_leg presmoke none schedule_nightly_image_build_with_base.yaml 'Presmoke image build'
              ;;
            nightly)
              if [ "$DISPATCH_A2" = "true" ]; then add_leg a2 a2 schedule_nightly_test_a2.yaml 'Nightly-A2'; fi
              if [ "$DISPATCH_A3" = "true" ]; then add_leg a3 a3 schedule_nightly_test_a3.yaml 'Nightly-A3'; fi
              if [ "$DISPATCH_A3_560T" = "true" ]; then add_leg a3-560t a3_560t schedule_nightly_test_a3_560t.yaml 'Nightly-A3-560T'; fi
              if [ "$DISPATCH_A5" = "true" ]; then add_leg a5 a5 schedule_nightly_test_a5.yaml 'Nightly-A5'; fi
              if [ "$DISPATCH_310P" = "true" ]; then add_leg 310p 310p schedule_nightly_test_310p.yaml 'Nightly-310P'; fi
              ;;
            weekly)
              if [ "$DISPATCH_A2" = "true" ]; then add_leg weekly-a2 a2 schedule_weekly_test_a2.yaml 'Weekly-A2'; fi
              if [ "$DISPATCH_A3" = "true" ]; then add_leg weekly-a3 a3 schedule_weekly_test_a3.yaml 'Weekly-A3'; fi
              if [ "$DISPATCH_A3_560T" = "true" ]; then add_leg weekly-a3-560t a3_560t schedule_weekly_test_a3_560t.yaml 'Weekly-A3-560T'; fi
              if [ "$DISPATCH_310P" = "true" ]; then add_leg weekly-310p 310p schedule_weekly_test_310p.yaml 'Weekly-310P'; fi
              ;;
          esac
          if [ "$INCLUDE" = "[]" ]; then
            INCLUDE='[{"target": "none", "chip": "none", "workflow": "none", "label": "No targets"}]'
          fi
          echo "matrix=$INCLUDE" >> "$GITHUB_OUTPUT"

  dispatch:
    name: Dispatch ${{ matrix.label }}
    # One matrix job replaces the former per-target dispatch-* jobs. authorize
    # composes the matrix so only selected targets become legs, instead of
    # starting ten 4-core runners for every /nightly, /weekly or /presmoke
    # command. Each leg publishes the dispatched run URL as a link artifact
    # consumed by post-links (matrix job outputs are not reliable across legs).
    needs: [authorize]
    if: needs.authorize.outputs.is_authorized == 'true' && needs.authorize.outputs.blocked != 'true'
    runs-on: linux-amd64-cpu-2-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    strategy:
      fail-fast: false
      max-parallel: 2
      # Built by the 'resolve dispatch targets' step in authorize: one leg per
      # selected target, or a single noop leg when nothing was selected.
      matrix:
        include: ${{ fromJSON(needs.authorize.outputs.dispatch_matrix) }}
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      BISECT_ARGS_JSON: ${{ needs.authorize.outputs.bisect_args_json }}
      DOWNLOAD_PATH: ${{ needs.authorize.outputs.download_path }}
      PROFILE_OPTIONS_JSON: ${{ needs.authorize.outputs.profile_options_json }}
      VLLM_REF: ${{ needs.authorize.outputs.vllm_ref }}
    steps:
      - name: Install system dependencies
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -sL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install gh -y

      - name: Dispatch target workflow
        run: |
          REPO='${{ github.event.client_payload.github.payload.repository.full_name }}'
          TARGET='${{ matrix.target }}'
          WORKFLOW='${{ matrix.workflow }}'
          if [ "$TARGET" = "none" ]; then
            echo "No dispatch target selected for this command; nothing to do."
            exit 0
          fi

          case "$TARGET" in
            presmoke)
              # The /presmoke command lists the chips to build directly; the resolved
              # dispatch_<chip> outputs are the single source of truth. isolated_build
              # makes the build full-scale (ubuntu+openEuler on amd64+arm64), keeps
              # the images in the isolated '-presmoke' CI repositories (never
              # atlas_inference) and skips the quay.io and cn-north-4 syncs.
              # source_ref makes both layers build from the triggering PR head
              # ('pre-merge'), so the code and Dockerfiles under review are the ones
              # built.
              CHIPS='[]'
              for CHIP in a2 a3 310p a5; do
                case "$CHIP" in
                  a2) SELECTED='${{ needs.authorize.outputs.dispatch_a2 }}' ;;
                  a3) SELECTED='${{ needs.authorize.outputs.dispatch_a3 }}' ;;
                  310p) SELECTED='${{ needs.authorize.outputs.dispatch_310p }}' ;;
                  a5) SELECTED='${{ needs.authorize.outputs.dispatch_a5 }}' ;;
                esac
                if [ "$SELECTED" = "true" ]; then
                  CHIPS=$(jq -c --arg chip "$CHIP" '. + [$chip]' <<< "$CHIPS")
                fi
              done
              if [ "$CHIPS" = '[]' ]; then
                echo "::error::No chip selected for /presmoke"
                exit 1
              fi
              # Only forward source_ref when set: gh would turn an empty -f value
              # into 'true', which is not a valid ref.
              SOURCE_REF='${{ needs.authorize.outputs.source_ref }}'
              ARGS=(-f vllm_ascend_branch='${{ needs.authorize.outputs.branch }}' -f chips="$CHIPS" -f isolated_build='true')
              if [ -n "$SOURCE_REF" ]; then
                ARGS+=(-f "source_ref=$SOURCE_REF")
              fi
              ;;
            a2|a3|a3-560t|a5)
              ARGS=(
                -f test_cases='${{ needs.authorize.outputs.test_cases }}'
                -f vllm_ascend_branch='${{ needs.authorize.outputs.branch }}'
                -f request_id='${{ needs.authorize.outputs.pr_number }}'
                -f skip_build_image='true'
                -f image_repo_suffix='${{ needs.authorize.outputs.presmoke_image == 'true' && '-presmoke' || '' }}'
                -f vllm_ascend_ref='${{ needs.authorize.outputs.vllm_ascend_ref }}'
                -f aop_enabled='${{ needs.authorize.outputs.aop_enabled }}'
                -f download_path="$DOWNLOAD_PATH"
                -f profile_options_json="$PROFILE_OPTIONS_JSON"
                -f vllm_ref="$VLLM_REF"
                -f bisect_args_json="$BISECT_ARGS_JSON"
              )
              ;;
            310p)
              ARGS=(
                -f test_cases='${{ needs.authorize.outputs.test_cases }}'
                -f vllm_ascend_branch='${{ needs.authorize.outputs.branch }}'
                -f request_id='${{ needs.authorize.outputs.pr_number }}'
                -f download_path="$DOWNLOAD_PATH"
                -f skip_build_image='true'
                -f image_repo_suffix='${{ needs.authorize.outputs.presmoke_image == 'true' && '-presmoke' || '' }}'
                -f vllm_ascend_ref='${{ needs.authorize.outputs.vllm_ascend_ref }}'
                -f aop_enabled='${{ needs.authorize.outputs.aop_enabled }}'
                -f profile_options_json="$PROFILE_OPTIONS_JSON"
                -f vllm_ref="$VLLM_REF"
              )
              ;;
            weekly-a2)
              ARGS=(
                -f test_cases='${{ needs.authorize.outputs.test_cases }}'
                -f vllm_ascend_branch='${{ needs.authorize.outputs.branch }}'
                -f request_id='${{ needs.authorize.outputs.pr_number }}'
                -f skip_build_image=true
                -f vllm_ascend_ref='${{ needs.authorize.outputs.vllm_ascend_ref }}'
                -f aop_enabled='${{ needs.authorize.outputs.aop_enabled }}'
                -f vllm_ref="$VLLM_REF"
              )
              ;;
            weekly-a3|weekly-a3-560t|weekly-310p)
              ARGS=(
                -f test_cases='${{ needs.authorize.outputs.test_cases }}'
                -f vllm_ascend_branch='${{ needs.authorize.outputs.branch }}'
                -f request_id='${{ needs.authorize.outputs.pr_number }}'
                -f skip_build_image=true
                -f vllm_ascend_ref='${{ needs.authorize.outputs.vllm_ascend_ref }}'
                -f aop_enabled='${{ needs.authorize.outputs.aop_enabled }}'
                -f vllm_ref="$VLLM_REF"
                -f bisect_args_json="$BISECT_ARGS_JSON"
              )
              ;;
          esac

          gh workflow run "$WORKFLOW" \
            --repo "$REPO" \
            --ref main \
            "${ARGS[@]}"
          sleep 8
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?per_page=1" \
            --jq '.workflow_runs[0].id')
          mkdir -p /tmp/dispatch-link
          echo "- ${{ matrix.label }}: [workflow run](${{ github.server_url }}/${REPO}/actions/runs/${RUN_ID})" \
            > "/tmp/dispatch-link/link-${TARGET}.md"
          echo "Dispatched ${{ matrix.label }} ($WORKFLOW), run_id=$RUN_ID"

      - name: Upload dispatch link for post-links
        if: matrix.target != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-link-${{ matrix.target }}
          path: /tmp/dispatch-link/link-${{ matrix.target }}.md
          retention-days: 1
          if-no-files-found: error

  post-links:
    name: Post workflow links
    needs: [authorize, dispatch]
    if: always() && needs.authorize.outputs.is_authorized == 'true' && needs.authorize.outputs.blocked != 'true'
    runs-on: linux-amd64-cpu-2-hk
    steps:
      # Legs publish link-<target>.md artifacts. Tolerate download errors so
      # the comment is still posted when no target was dispatched at all.
      - name: Download dispatch links
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: dispatch-link-*
          path: /tmp/dispatch-links
          merge-multiple: true

      - name: Build comment body
        id: body
        run: |
          BODY="${{ needs.authorize.outputs.command }} command triggered."
          # Fixed display order regardless of matrix completion order.
          for target in presmoke a2 a3 a3-560t a5 310p weekly-a2 weekly-a3 weekly-a3-560t weekly-310p; do
            file="/tmp/dispatch-links/link-${target}.md"
            if [ -f "$file" ]; then
              BODY="$BODY
          $(cat "$file")"
            fi
          done
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post workflow URLs
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: ${{ steps.body.outputs.body }}
          reactions: rocket
