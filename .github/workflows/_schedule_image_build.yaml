name: Image_oncall
on:
  workflow_call:
    inputs:
      quay_repo:
        description: 'Quay repository for final images'
        required: false
        type: string
        default: 'quay.io/ascend/vllm-ascend'
      quay_temp_repo:
        description: 'Quay repository for temp images'
        required: false
        type: string
        default: 'quay.io/atlas-ci/vllm-atlas-temp'
      swr_registry:
        description: 'swr repository for temp images'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com'
      swr_temp_repo:
        description: 'swr repository for temp images'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/modelfoundry/buildkit-test'    
      suffix:
        description: 'The tag subfix to use'
        required: true
        type: string
      should_push:
        description: 'Whether to push the image'
        required: false
        type: boolean
        default: False
      dockerfile:
        description: 'The Dockerfile to use'
        required: false
        type: string
      quay_username:
        description: 'Quay username for pushing images'
        required: false
        type: string
      quay_temp_username:
        description: 'Quay username for pushing temp tag digests'
        required: false
        type: string
      workflow_dispatch_tag:
        description: 'The tag to use for workflow dispatch'
        required: false
        type: string
      branch_ref:
        description: 'Branch/ref to check out for non-workflow_dispatch events'
        required: false
        type: string
        default: 'main'
      schedule_tag_pattern:
        description: 'Pattern used for the schedule Docker tag'
        required: false
        type: string
        default: 'main'
      artifact_prefix:
        description: 'Prefix for digest artifact names'
        required: false
        type: string
        default: 'digests'
      vllm_commit:
        description: 'vLLM commit hash to checkout (used when set; mutually exclusive with tag/branch).'
        required: false
        type: string
        default: ''
      vllm_ascend_commit:
        description: 'vllm-ascend commit hash to checkout (used when set; mutually exclusive with tag/branch).'
        required: false
        type: string
        default: ''
      temp_only:
        description: 'If true, push only to QUAY_TEMP_REPO and skip the merge-image job (no push to QUAY_REPO).'
        required: false
        type: boolean
        default: false
      build_type:
        description: 'Build type (release/daily)'
        required: false
        type: string
        default: 'release'
      memcache_version:
        description: 'Memcache version'
        required: false
        type: string
        default: '1.2.0'
      memcache_date:
        description: 'Memcache date'
        required: false
        type: string
        default: '20260725.3'
      memfabric_version:
        description: 'Memfabric version'
        required: false
        type: string
        default: '1.2.0'
      memfabric_date:
        description: 'Memfabric date'
        required: false
        type: string
        default: '20260725.3'
      torch_npu_version:
        description: 'Torch NPU version'
        required: false
        type: string
        default: '26.1.0'
      torch_npu_date:
        description: 'Torch NPU date'
        required: false
        type: string
        default: '20260715.4'
      cann_quay_url:
        description: 'CANN Quay URL'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann'
      cann_version:
        description: 'CANN version'
        required: false
        type: string
        default: '2026.08.03'
      triton_ascend_version:
        description: 'Triton Ascend version'
        required: false
        type: string
        default: ''
      triton_ascend_package_version:
        description: 'Triton Ascend package version'
        required: false
        type: string
        default: '3.2.2'
      build_args:
        description: 'Additional build arguments for Docker build'
        required: false
        type: string
        default: ''
    secrets:
        QUAY_PASSWORD:
            description: 'Quay password for pushing images'
            required: false
        QUAY_TEMP_PASSWORD:
            description: 'Quay password for pushing temp tag digests'
            required: false
        SWR_USERNAME:
            description: 'SWR username for pulling and pushing CANN base images'
            required: false
        SWR_PASSWORD:
            description: 'SWR password for pulling and pushing CANN base images'
            required: false

defaults:
  run:
    shell: bash -el {0}

env:
  QUAY_REPO: ${{ inputs.quay_repo }}
  QUAY_TEMP_REPO: ${{ inputs.quay_temp_repo }}

jobs:
  build-push-digest:
    name: build
    runs-on: ${{ matrix.runner_info.runner }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-a3-ubuntu22.04-py3.12
    permissions:
      packages: write
      contents: read

    strategy:
      max-parallel: 2
      matrix:
        runner_info:
          - {runner: linux-aarch64-cpu-4, tag: arm64}
          - {runner: linux-amd64-cpu-4, tag: amd64}

    steps:

    - name: Validate inputs (workflow_dispatch only)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        tag="${{ inputs.workflow_dispatch_tag }}"
        branch="${{ inputs.branch_ref }}"
        vllm_commit="${{ inputs.vllm_commit }}"
        vllm_ascend_commit="${{ inputs.vllm_ascend_commit }}"

        commit_mode="false"
        if [[ -n "$vllm_commit" || -n "$vllm_ascend_commit" ]]; then
          if [[ -z "$vllm_commit" || -z "$vllm_ascend_commit" ]]; then
            echo "Error: 'vllm_commit' and 'vllm_ascend_commit' must be specified together."
            exit 1
          fi
          for c in "$vllm_commit" "$vllm_ascend_commit"; do
            if ! echo "$c" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "Error: invalid commit format: $c (expected 7-40 hex chars)."
              exit 1
            fi
          done
          commit_mode="true"
        fi

        if [[ "$commit_mode" == "true" ]]; then
          if [[ -n "$tag" || -n "$branch" ]]; then
            echo "Error: commit mode is mutually exclusive with 'tag'/'branch'."
            exit 1
          fi
        else
          if [[ -n "$tag" && -n "$branch" ]]; then
            echo "Error: 'tag' and 'branch' are mutually exclusive. Please specify only one."
            exit 1
          fi
          if [[ -z "$tag" && -z "$branch" ]]; then
            echo "Error: Either 'tag', 'branch', or (vllm_commit + vllm_ascend_commit) must be specified."
            exit 1
          fi
        fi

    - uses: actions/checkout@v7
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_commit != '' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.vllm_ascend_commit }}

    - uses: actions/checkout@v7
      if: ${{ github.event_name != 'workflow_dispatch' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.branch_ref }}

    - uses: actions/checkout@v7
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag != '' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.workflow_dispatch_tag }}

    - uses: actions/checkout@v7
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag == '' && inputs.vllm_ascend_commit == '' }}
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.branch_ref }}

    - name: Compute cache tag
      id: cache-tag
      run: |
        if [ -n "${{ inputs.suffix }}" ]; then
          echo "value=buildcache-${{ inputs.suffix }}-${{ matrix.runner_info.tag }}" >> $GITHUB_OUTPUT
        else
          echo "value=buildcache-${{ matrix.runner_info.tag }}" >> $GITHUB_OUTPUT
        fi

    - name: Get Dockerfile base image tag
      id: get_base_image_tag
      run: |
        DOCKERFILE="${{ inputs.dockerfile || 'Dockerfile' }}"
        BASE_IMAGE_TAG=$(grep -m1 '^FROM' "$DOCKERFILE" | awk -F: '{print $NF}')
        echo "BASE_IMAGE_TAG=$BASE_IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Get csrc hash
      id: get_csrc_hash
      run: |
        # Fail closed so a git error cannot silently produce sha256(empty).
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cd "$GITHUB_WORKSPACE"

        # Match the standalone cache producer's tracked csrc build inputs.
        CSRC_MANIFEST=$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)
        if [ -z "$CSRC_MANIFEST" ]; then
          echo "::error::No tracked csrc inputs found."
          exit 1
        fi

        CSRC_HASH=$(printf '%s\n' "$CSRC_MANIFEST" | sha256sum | awk '{print $1}')
        echo "CSRC_HASH=$CSRC_HASH" >> "$GITHUB_OUTPUT"

    - name: Get architecture
      id: get_arch
      run: |
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) echo "arch=X64" >> "$GITHUB_OUTPUT" ;;
          aarch64) echo "arch=ARM64" >> "$GITHUB_OUTPUT" ;;
          *) echo "arch=$ARCH" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Install csrc cache dependencies
      run: |
        apt-get update -y
        apt-get install -y zstd

    - name: Restore vllm-ascend csrc cache
      id: cache-csrc
      uses: runs-on/cache/restore@v5
      with:
        path: |
          vllm_ascend/_cann_ops_custom
          vllm_ascend/*.so
          vllm_ascend/lib
          vllm_ascend/include
        key: vllm-ascend-build-v2-${{ steps.get_arch.outputs.arch }}-${{ steps.get_base_image_tag.outputs.BASE_IMAGE_TAG }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

    - name: Login to SWR
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.swr_registry }}
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v7
      id: build
      with:
        # use the current repo path as the build context, ensure .git is contained
        context: .
        file: ${{ inputs.dockerfile || 'Dockerfile' }}
        # only trigger when tag, branch/main push
        push: ${{ inputs.should_push }}
        outputs: type=image,name=${{ inputs.swr_temp_repo }},push-by-digest=true,name-canonical=true,push=${{ inputs.should_push }}
        # Image builds can compile inside Docker and therefore keep a fallback;
        # NPU test jobs use fail-on-cache-miss instead.
        build-args: |
          CANN_QUAY_URL=${{ inputs.cann_quay_url }}
          APTMIRROR=http://cache-service.nginx-pypi-cache.svc.cluster.local:8081
          PIP_INDEX_URL=http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          PIP_TRUSTED_HOST=cache-service.nginx-pypi-cache.svc.cluster.local
          PYTORCH_INDEX_URL=http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu
          ASCEND_INDEX_URL=http://cache-service.nginx-pypi-cache.svc.cluster.local/ascend/repos/pypi
          GIT_PROXY=https://gh-proxy.test.osinfra.cn/
          COMPILE_CUSTOM_KERNELS=${{ steps.cache-csrc.outputs.cache-hit == 'true' && '0' || '1' }}
          VLLM_COMMIT=${{ inputs.vllm_commit }}
          BUILD_TYPE=${{ inputs.build_type || 'release' }}
          MEMCACHE_VERSION=${{ inputs.memcache_version || '1.2.0' }}
          MEMCACHE_DATE=${{ inputs.memcache_date || '20260725.3' }}
          MEMFABRIC_VERSION=${{ inputs.memfabric_version || '1.2.0' }}
          MEMFABRIC_DATE=${{ inputs.memfabric_date || '20260725.3' }}
          TORCH_NPU_VERSION=${{ inputs.torch_npu_version || '26.1.0' }}
          TORCH_NPU_DATE=${{ inputs.torch_npu_date || '20260715.4' }}
          TRITON_ASCEND_VERSION=${{ inputs.triton_ascend_version || '' }}
          TRITON_ASCEND_PACKAGE_VERSION=${{ inputs.triton_ascend_package_version || '3.2.2' }}
          ${{ inputs.build_args }}
        provenance: false
        # To speed up the build, we use registry cache. The cache tag is determined by the suffix and architecture, and shared across different workflow runs.
        # For example, the cache tag for arm64 image with suffix "openeuler" will be "buildcache-openeuler-arm64".
        # When a new image is built and pushed, the cache will also be updated in the registry, so that next build can benefit from it.
        cache-from: type=registry,ref=${{ inputs.swr_temp_repo }}:${{ steps.cache-tag.outputs.value }}
        cache-to: ${{ inputs.should_push && format('type=registry,ref={0}:{1},mode=max', inputs.swr_temp_repo, steps.cache-tag.outputs.value) || '' }}

    # Quay.io/swr automatically cleans up untagged digests on a regular basis, with a cycle of approximately one hour. 
    # Add temporary tags to digests to prevent them from being removed.
    - name: Tag digest to prevent GC
      if: ${{ inputs.should_push }}
      run: |
        SUFFIX=""
        if [ -n "${{ inputs.suffix }}" ]; then
          SUFFIX="-${{ inputs.suffix }}"
        fi
        if [ "${{ inputs.temp_only }}" = "true" ]; then
          VLLM_SHORT=$(echo "${{ inputs.vllm_commit }}" | cut -c1-7)
          ASCEND_SHORT=$(echo "${{ inputs.vllm_ascend_commit }}" | cut -c1-7)
          TAG="vllm-ascend-${VLLM_SHORT}-${ASCEND_SHORT}${SUFFIX}-${{ matrix.runner_info.tag }}-temp"
        else
          TAG="nightly-${{ inputs.schedule_tag_pattern }}${SUFFIX}-${{ matrix.runner_info.tag }}-temp"
          if [ "${{ inputs.build_type }}" = "daily" ]; then
            DATE=$(date +'%Y%m%d')
            TAG="nightly-${{ inputs.schedule_tag_pattern }}${SUFFIX}-${{ matrix.runner_info.tag }}-${DATE}-temp"
          fi
        fi
        echo "Creating temp tag: ${{ env.swr_temp_repo }}:$TAG"

        # Install skopeo if not present (image is Ubuntu-based).
        if ! command -v skopeo >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq skopeo
        fi
        CREDS="${{ secrets.SWR_USERNAME }}:${{ secrets.SWR_PASSWORD }}"
        skopeo copy \
          --src-creds "$CREDS" \
          --dest-creds "$CREDS" \
          "docker://${{ inputs.swr_temp_repo }}@${{ steps.build.outputs.digest }}" \
          "docker://${{ inputs.swr_temp_repo }}:$TAG"

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
        ls -al /tmp/digests

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-${{ matrix.runner_info.tag }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-image:
    runs-on: ubuntu-latest
    needs: build-push-digest
    if: ${{ inputs.should_push && !inputs.temp_only }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        if: ${{ github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag == '') }}
        with:
          submodules: recursive
          ref: ${{ inputs.branch_ref }}

      - name: Checkout tag
        uses: actions/checkout@v7
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag != '' }}
        with:
          submodules: recursive
          ref: ${{ inputs.workflow_dispatch_tag }}

      - name: Download arm64 digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-arm64
          merge-multiple: true

      - name: Download amd64 digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-amd64
          merge-multiple: true

      - name: Prepare suffix
        id: suffix
        run: |
          # Prepend '-' to suffix so Docker metadata action can append it directly
          # to the tag (e.g. suffix=310p-openeuler → SUFFIX=-310p-openeuler,
          # resulting in tags like main-310p-openeuler).
          # Leave SUFFIX empty when no suffix is provided (plain tags like main).
          if [ -n "${{ inputs.suffix }}" ]; then
            echo "SUFFIX=-${{ inputs.suffix }}" >> $GITHUB_ENV
          else
            echo "SUFFIX=" >> $GITHUB_ENV
          fi

      # ===== New: Generate custom tags for daily scenario =====
      - name: Generate daily tags
        id: daily_tags
        if: ${{ inputs.build_type == 'daily' }}
        run: |
          # Get current date in YYYYMMDD format
          DATE=$(date +'%Y%m%d')
          # Get CANN version and convert to lowercase (e.g., 2026.08.03 -> 2026.08.03)
          CANN_VERSION=$(echo "${{ inputs.cann_version }}" | tr '[:upper:]' '[:lower:]')
          # Get the base tag pattern (e.g., main)
          PATTERN="${{ inputs.schedule_tag_pattern }}"
          # Get the suffix
          SUFFIX="${{ inputs.suffix }}"
          
          # Construct the daily tag: nightly-{PATTERN}-{SUFFIX}-cann{VERSION}-{DATE}
          # Example: nightly-main-310p-openeuler-cann2026.08.03-20260729
          if [ -n "$SUFFIX" ]; then
            DAILY_TAG="nightly-${PATTERN}-${SUFFIX}-cann${CANN_VERSION}-${DATE}"
          else
            DAILY_TAG="nightly-${PATTERN}-cann${CANN_VERSION}-${DATE}"
          fi
          
          echo "Generated daily tag: $DAILY_TAG"
          echo "daily_tag=$DAILY_TAG" >> $GITHUB_OUTPUT
      # =========================================================

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # TODO(yikun): add more hub image and a note on release policy for container image
          images: |
            ${{ env.QUAY_REPO }}
          # Three trigger scenarios and resulting image tags:
          # https://github.com/marketplace/actions/docker-metadata-action#typeref
          #
          # 1. Push tag (on: push tags: v*) → type=pep440
          #    Only pep440-compliant tags are published:
          #    - v0.16.0rc1       --> vllm-ascend:v0.16.0rc1[-suffix]
          #    Non-pep440 tags are ignored.
          #
          # 2. Schedule (on: schedule) → type=schedule,pattern=main
          #    Triggered by cron, always produces a fixed tag:
          #    - (any schedule run) --> vllm-ascend:main[-suffix]
          #
          # 3. Manual (on: workflow_dispatch) → type=raw,value=inputs.workflow_dispatch_tag
          #    Tag is determined by the user-selected input at dispatch time:
          #    - inputs.tag=main       --> vllm-ascend:main[-suffix]
          #    - inputs.tag=v0.16.0rc1 --> vllm-ascend:v0.16.0rc1[-suffix]
          tags: |
            # In daily mode, only the CANN-versioned daily tag is published; the pep440,
            # schedule and workflow_dispatch_tag rules would emit bare/plain tags
            # (e.g. main-310p, nightly-main-310p) without date info, so they are disabled
            # for daily builds only.
            type=pep440,pattern={{raw}},suffix=${{ env.SUFFIX }},enable=${{ inputs.build_type != 'daily' }}
            type=schedule,pattern=${{ inputs.schedule_tag_pattern }},prefix=nightly-,suffix=${{ env.SUFFIX }},enable=${{ inputs.build_type != 'daily' }}
            type=raw,value=${{ inputs.workflow_dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag != '' && inputs.build_type != 'daily' }},suffix=${{ env.SUFFIX }}
            type=raw,value=${{ inputs.branch_ref }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.workflow_dispatch_tag == '' }},prefix=nightly-,suffix=${{ env.SUFFIX }}
            
            # ===== New: Daily scenario specific tags =====
            type=raw,value=${{ steps.daily_tags.outputs.daily_tag }},enable=${{ inputs.build_type == 'daily' }}
            # =============================================
          flavor:
            latest=false

      - name: Login to SWR
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.swr_registry }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ inputs.quay_username }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge and push multi-arch image
        env:
          # Source digests live in SWR (where build-push-digest pushed them);
          # destination tags come from $TAGS (metadata-action → QUAY_REPO).
          SOURCE_IMAGE: ${{ inputs.swr_temp_repo }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_TYPE: ${{ inputs.build_type }}
          SCHEDULE_TAG_PATTERN: ${{ inputs.schedule_tag_pattern }}
          SUFFIX: ${{ env.SUFFIX }}
        run: |
          DIGESTS=$(printf "$SOURCE_IMAGE@sha256:%s " $(ls ${{ runner.temp }}/digests))

          echo "Digests: $DIGESTS"
          echo "Current tags:"
          echo "$TAGS"

          # For daily builds, skip the plain schedule tag (e.g. nightly-main-310p-openeuler)
          # because it's redundant with the daily tag that includes CANN version + date
          UNWANTED_TAG="nightly-${SCHEDULE_TAG_PATTERN}${SUFFIX}"

          for tag in $TAGS; do
            if [ "$BUILD_TYPE" = "daily" ] && [ "$tag" = "${{ env.QUAY_REPO }}:${UNWANTED_TAG}" ]; then
              echo "Skipping unwanted schedule tag: $tag"
              continue
            fi
            echo "Creating tag $tag"
            docker buildx imagetools create \
              -t "$tag" \
              $DIGESTS
          done

      - name: Clean up temp tags
        if: ${{ inputs.build_type == 'daily' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          SUFFIX=""
          if [ -n "${{ inputs.suffix }}" ]; then
            SUFFIX="-${{ inputs.suffix }}"
          fi
          DATE=$(date +'%Y%m%d')
          # Temp tags were created in SWR by build-push-digest, so clean them up there.
          for arch in amd64 arm64; do
            TAG="nightly-${{ inputs.schedule_tag_pattern }}${SUFFIX}-${arch}-${DATE}-temp"
            skopeo delete --creds "${{ secrets.SWR_USERNAME }}:${{ secrets.SWR_PASSWORD }}" \
              "docker://${{ inputs.swr_temp_repo }}:${TAG}" || true
          done

  merge-image-temp:
    name: merge-image-temp
    runs-on: ubuntu-latest
    needs: build-push-digest
    if: ${{ inputs.should_push && inputs.temp_only }}
    steps:
      - name: Download arm64 digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-arm64
          merge-multiple: true

      - name: Download amd64 digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-amd64
          merge-multiple: true

      - name: Login to SWR
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.swr_registry }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Login to Quay Temp
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ inputs.quay_temp_username }}
          password: ${{ secrets.QUAY_TEMP_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge and push multi-arch manifest to QUAY_TEMP_REPO
        env:
          # IMAGE is the destination (Quay temp); SOURCE_IMAGE is where the
          # single-arch digests actually live (SWR, pushed by build-push-digest).
          IMAGE: ${{ env.QUAY_TEMP_REPO }}
          SOURCE_IMAGE: ${{ inputs.swr_temp_repo }}
        run: |
          set -euo pipefail
          SUFFIX=""
          if [ -n "${{ inputs.suffix }}" ]; then
            SUFFIX="-${{ inputs.suffix }}"
          fi
          VLLM_SHORT=$(echo "${{ inputs.vllm_commit }}" | cut -c1-7)
          ASCEND_SHORT=$(echo "${{ inputs.vllm_ascend_commit }}" | cut -c1-7)
          TAG="${IMAGE}:vllm-ascend-${VLLM_SHORT}-${ASCEND_SHORT}${SUFFIX}"
          DIGESTS=$(printf "$SOURCE_IMAGE@sha256:%s " $(ls ${{ runner.temp }}/digests))
          echo "Digests: $DIGESTS"
          echo "Creating multi-arch manifest tag: $TAG"
          docker buildx imagetools create \
            -t "$TAG" \
            $DIGESTS

          # ===== Daily scenario: also push daily tag =====
          if [ "${{ inputs.build_type }}" = "daily" ]; then
            DATE=$(date +'%Y%m%d')
            CANN_VERSION=$(echo "${{ inputs.cann_version }}" | tr '[:upper:]' '[:lower:]')
            PATTERN="${{ inputs.schedule_tag_pattern }}"
            if [ -n "${{ inputs.suffix }}" ]; then
              DAILY_TAG="${IMAGE}:nightly-${PATTERN}-${{ inputs.suffix }}-cann${CANN_VERSION}-${DATE}"
            else
              DAILY_TAG="${IMAGE}:nightly-${PATTERN}-cann${CANN_VERSION}-${DATE}"
            fi
            echo "Creating daily tag: $DAILY_TAG"
            docker buildx imagetools create \
              -t "$DAILY_TAG" \
              $DIGESTS
          fi

      - name: Clean up temp tags
        if: ${{ inputs.build_type == 'daily' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          SUFFIX=""
          if [ -n "${{ inputs.suffix }}" ]; then
            SUFFIX="-${{ inputs.suffix }}"
          fi
          VLLM_SHORT=$(echo "${{ inputs.vllm_commit }}" | cut -c1-7)
          ASCEND_SHORT=$(echo "${{ inputs.vllm_ascend_commit }}" | cut -c1-7)
          # Temp tags were created in SWR by build-push-digest, so clean them up there.
          for arch in amd64 arm64; do
            TAG="vllm-ascend-${VLLM_SHORT}-${ASCEND_SHORT}${SUFFIX}-${arch}-temp"
            skopeo delete --creds "${{ secrets.SWR_USERNAME }}:${{ secrets.SWR_PASSWORD }}" \
              "docker://${{ inputs.swr_temp_repo }}:${TAG}" || true
          done
