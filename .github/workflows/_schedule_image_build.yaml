name: Image_oncall
on:
  workflow_call:
    inputs:
      swr_repo:
        description: 'SWR repository for final multi-arch images (same name as the quay.io repo, sync tool mirrors it to quay.io)'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/vllm-ascend'
      swr_registry:
        description: 'SWR registry domain'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com'
      swr_temp_repo:
        description: 'SWR repository for single-arch temp images (mirrors quay.io/atlas-ci/vllm-atlas-temp)'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/atlas_ci/vllm-atlas-temp'
      suffix:
        description: 'The tag subfix to use'
        required: true
        type: string
      should_push:
        description: 'Whether to push the image'
        required: false
        type: boolean
        default: False
      dockerfile:
        description: 'The Dockerfile to use'
        required: false
        type: string
      branch_ref:
        description: 'Branch/ref to check out. Leave empty to use the event ref (e.g. a pushed tag or a PR merge ref).'
        required: false
        type: string
        default: 'main'
      schedule_tag_pattern:
        description: 'Pattern used for the schedule Docker tag'
        required: false
        type: string
        default: 'main'
      artifact_prefix:
        description: 'Prefix for digest artifact names'
        required: false
        type: string
        default: 'digests'
      cann_swr_url:
        description: 'SWR registry/repository for the CANN CI job container image'
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann'
      cann_image_version:
        description: 'CANN image version for the CI job container only. It is independent of the CANN version baked into the built image, which comes from the FROM line in the Dockerfile.'
        required: false
        type: string
        default: '9.1.0'
      soc:
        description: 'Ascend SoC type for the CANN base image (e.g. 910b, a3, 310p, 950)'
        required: false
        type: string
        default: '910b'
    secrets:
      SWR_USERNAME:
        description: 'SWR username for pushing images'
        required: false
      SWR_PASSWORD:
        description: 'SWR password for pushing images'
        required: false
      SYNC_TOOLS_TOKEN:
        description: 'GitHub token for dispatching quay.io sync workflow'
        required: false

defaults:
  run:
    shell: bash -el {0}

env:
  SWR_REPO: ${{ inputs.swr_repo }}

jobs:
  build-push-digest:
    name: build
    runs-on: ${{ matrix.runner_info.runner }}
    container:
      image: ${{ format('{0}:{1}-{2}-ubuntu22.04-py3.12', inputs.cann_swr_url, inputs.cann_image_version, inputs.soc) }}
      env:
        SOC: ${{ inputs.soc }}
    permissions:
      packages: write
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner_info:
          - {runner: linux-aarch64-cpu-4, tag: arm64}
          - {runner: linux-amd64-cpu-4, tag: amd64}

    steps:

    - name: Install zstd
      run: |
        apt-get update -y
        apt-get install -y zstd

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false
        # Empty on tag pushes and PR events, so the default event ref is used.
        ref: ${{ inputs.branch_ref }}

    - name: Compute cache tag
      id: cache-tag
      run: |
        if [ -n "${{ inputs.suffix }}" ]; then
          echo "value=buildcache-${{ inputs.suffix }}-${{ matrix.runner_info.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=buildcache-${{ matrix.runner_info.tag }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Get Dockerfile base image tag
      id: get_base_image_tag
      run: |
        DOCKERFILE="${{ inputs.dockerfile || 'Dockerfile' }}"
        BASE_IMAGE_TAG=$(grep -m1 '^FROM' "$DOCKERFILE" | awk -F: '{print $NF}')
        echo "BASE_IMAGE_TAG=$BASE_IMAGE_TAG" >> "$GITHUB_OUTPUT"

    - name: Get csrc hash
      id: get_csrc_hash
      run: |
        # Fail closed so a git error cannot silently produce sha256(empty).
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cd "$GITHUB_WORKSPACE"

        # Match the standalone cache producer's tracked csrc build inputs.
        CSRC_MANIFEST=$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)
        if [ -z "$CSRC_MANIFEST" ]; then
          echo "::error::No tracked csrc inputs found."
          exit 1
        fi

        CSRC_HASH=$(printf '%s\n' "$CSRC_MANIFEST" | sha256sum | awk '{print $1}')
        echo "CSRC_HASH=$CSRC_HASH" >> "$GITHUB_OUTPUT"

    - name: Get architecture
      id: get_arch
      run: |
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) echo "arch=X64" >> "$GITHUB_OUTPUT" ;;
          aarch64) echo "arch=ARM64" >> "$GITHUB_OUTPUT" ;;
          *) echo "arch=$ARCH" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Restore vllm-ascend csrc cache
      id: cache-csrc
      uses: runs-on/cache/restore@v5
      with:
        path: |
          vllm_ascend/_cann_ops_custom
          vllm_ascend/*.so
          vllm_ascend/lib
          vllm_ascend/include
        key: vllm-ascend-build-v2-${{ steps.get_arch.outputs.arch }}-${{ steps.get_base_image_tag.outputs.BASE_IMAGE_TAG }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

    - name: Login to SWR
      if: ${{ inputs.should_push }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.swr_registry }}
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    - name: Prepare tag pattern
      id: tag_pattern
      run: |
        PATTERN="${{ inputs.schedule_tag_pattern }}"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.branch_ref }}" ]; then
          PATTERN="${{ inputs.branch_ref }}"
          PATTERN="${PATTERN//\//-}"
        fi
        echo "pattern=${PATTERN}" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v7
      id: build
      with:
        # use the current repo path as the build context, ensure .git is contained
        context: .
        file: ${{ inputs.dockerfile || 'Dockerfile' }}
        # only trigger when tag, branch/main push
        push: ${{ inputs.should_push }}
        outputs: type=image,name=${{ inputs.swr_temp_repo }},push-by-digest=true,name-canonical=true,push=${{ inputs.should_push }},oci-mediatypes=false
        # Image builds can compile inside Docker and therefore keep a fallback;
        # NPU test jobs use fail-on-cache-miss instead.
        build-args: |
          COMPILE_CUSTOM_KERNELS=${{ steps.cache-csrc.outputs.cache-hit == 'true' && '0' || '1' }}
        provenance: false
        # To speed up the build, we use registry cache. The cache tag is determined by the suffix and architecture, and shared across different workflow runs.
        # For example, the cache tag for arm64 image with suffix "openeuler" will be "buildcache-openeuler-arm64".
        # When a new image is built and pushed, the cache will also be updated in the registry, so that next build can benefit from it.
        cache-from: type=registry,ref=${{ inputs.swr_temp_repo }}:${{ steps.cache-tag.outputs.value }}
        cache-to: ${{ inputs.should_push && format('type=registry,ref={0}:{1},mode=max', inputs.swr_temp_repo, steps.cache-tag.outputs.value) || '' }}

    # Quay.io/swr automatically cleans up untagged digests on a regular basis, with a cycle of approximately one hour. 
    # Add temporary tags to digests to prevent them from being removed.
    - name: Tag digest to prevent GC
      if: ${{ inputs.should_push }}
      run: |
        SUFFIX=""
        if [ -n "${{ inputs.suffix }}" ]; then
          SUFFIX="-${{ inputs.suffix }}"
        fi
        TAG="nightly-${{ steps.tag_pattern.outputs.pattern }}${SUFFIX}-${{ matrix.runner_info.tag }}-temp"
        echo "Creating temp tag: ${{ inputs.swr_temp_repo }}:$TAG"

        # Copy the digest to a temp tag to prevent GC. The build uses
        # oci-mediatypes=false so the image is Docker v2s2, and this produces
        # a Docker manifest list which SWR accepts (no skopeo/sudo needed).
        docker buildx imagetools create \
          -t "${{ inputs.swr_temp_repo }}:$TAG" \
          "${{ inputs.swr_temp_repo }}@${{ steps.build.outputs.digest }}"

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
        ls -al /tmp/digests

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-${{ matrix.runner_info.tag }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-image:
    runs-on: linux-amd64-cpu-4
    needs: build-push-digest
    if: ${{ inputs.should_push }}
    steps:
      - name: Download arm64 digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-arm64
          merge-multiple: true

      - name: Download amd64 digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ inputs.artifact_prefix }}-${{ inputs.suffix }}-amd64
          merge-multiple: true

      - name: Prepare suffix
        id: suffix
        run: |
          # Prepend '-' to suffix so Docker metadata action can append it directly
          # to the tag (e.g. suffix=310p-openeuler → SUFFIX=-310p-openeuler,
          # resulting in tags like main-310p-openeuler).
          # Leave SUFFIX empty when no suffix is provided (plain tags like main).
          if [ -n "${{ inputs.suffix }}" ]; then
            echo "SUFFIX=-${{ inputs.suffix }}" >> "$GITHUB_ENV"
          else
            echo "SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Prepare tag pattern
        id: tag_pattern
        run: |
          PATTERN="${{ inputs.schedule_tag_pattern }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.branch_ref }}" ]; then
            PATTERN="${{ inputs.branch_ref }}"
            PATTERN="${PATTERN//\//-}"
          fi
          echo "pattern=${PATTERN}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # TODO(yikun): add more hub image and a note on release policy for container image
          images: |
            ${{ env.SWR_REPO }}
          # Three trigger scenarios and resulting image tags:
          # https://github.com/marketplace/actions/docker-metadata-action#typeref
          #
          # 1. Push tag (on: push tags: v*) → type=pep440
          #    Only pep440-compliant tags are published:
          #    - v0.16.0rc1       --> vllm-ascend:v0.16.0rc1[-suffix]
          #    Non-pep440 tags are ignored.
          #
          # 2. Schedule (on: schedule) → type=schedule,pattern=main
          #    Triggered by cron, always produces a fixed tag:
          #    - (any schedule run) --> vllm-ascend:nightly-main[-suffix]
          #
          # 3. Manual (on: workflow_dispatch) → type=raw,value=<branch>
          #    Tag is determined by the selected branch:
          #    - inputs.docker_ref=main              --> vllm-ascend:nightly-main[-suffix]
          #    - inputs.docker_ref=releases/v0.30.0  --> vllm-ascend:nightly-releases-v0.30.0[-suffix]
          tags: |
            type=pep440,pattern={{raw}},suffix=${{ env.SUFFIX }}
            type=schedule,pattern=${{ steps.tag_pattern.outputs.pattern }},prefix=nightly-,suffix=${{ env.SUFFIX }}
            type=raw,value=${{ steps.tag_pattern.outputs.pattern }},enable=${{ github.event_name == 'workflow_dispatch' }},prefix=nightly-,suffix=${{ env.SUFFIX }}
          flavor:
            latest=false

      - name: Login to SWR
        if: ${{ inputs.should_push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.swr_registry }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Merge and push multi-arch image
        env:
          # Source digests live in SWR (where build-push-digest pushed them);
          # destination tags come from $TAGS (metadata-action → SWR_REPO, same name as
          # the quay.io repo; the sync tool then mirrors swr.cn-north-12 → quay.io).
          SOURCE_IMAGE: ${{ inputs.swr_temp_repo }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          DIGEST_DIR="${{ runner.temp }}/digests"

          echo "Digests:"
          ls -la "$DIGEST_DIR"
          echo "Current tags:"
          echo "$TAGS"

          for tag in $TAGS; do
            echo "Creating tag $tag"

            # The build step outputs Docker v2 schema2 images (oci-mediatypes=false),
            # so "docker buildx imagetools create" produces a Docker manifest list
            # (application/vnd.docker.distribution.manifest.list.v2+json) which SWR
            # accepts, instead of an OCI image index (application/vnd.oci.image.index.v1+json).
            DIGESTS=""
            for digest_file in "$DIGEST_DIR"/*; do
              digest=$(basename "$digest_file")
              DIGESTS="$DIGESTS $SOURCE_IMAGE@sha256:$digest"
            done

            # shellcheck disable=SC2086
            docker buildx imagetools create \
              -t "$tag" \
              $DIGESTS
          done

      - name: Dispatch quay.io sync
        if: ${{ inputs.should_push }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOOLS_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'ascend-gha-runners',
              repo: 'sync-tools',
              workflow_id: 'sync-vllm-ascend.yml',
              ref: 'main',
            });
