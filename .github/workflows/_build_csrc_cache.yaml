name: Build csrc Cache

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: 'One resolved target object from csrc_cache_targets.json.'
      csrc_hash:
        type: string
        required: true
        description: 'The csrc source hash used in the cache key.'
      source_ref:
        type: string
        required: true
        description: 'Immutable vllm-ascend source commit to build.'
      repository:
        type: string
        required: false
        default: ''
        description: 'Source repository. Defaults to the current repository.'
      base_ref:
        type: string
        required: false
        default: ''
        description: 'Base ref containing the fixed base commit.'
      base_repository:
        type: string
        required: false
        default: ''
        description: 'Base repository. Defaults to the source repository.'
      base_sha:
        type: string
        required: false
        default: ''
        description: 'Fixed base commit to rebase onto before building.'
      continue_on_error:
        type: boolean
        required: false
        default: false
        description: 'Allow callers in rollout mode to continue when this cache build fails.'
      snapshot-cache:
        type: boolean
        required: false
        default: false
        description: >-
          Restore the csrc build-tree snapshot cache before the compile and
          save a fresh snapshot afterwards, enabling per-op incremental
          rebuilds. The snapshot is stored in the GitHub cache under
          csrc-snapshot-v1-<target>-.

defaults:
  run:
    shell: bash -el {0}

env:
  UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
  UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
  UV_HTTP_TIMEOUT: 120
  UV_SYSTEM_PYTHON: 1
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  build:
    name: build-${{ fromJSON(inputs.target).id }}-cache
    # Keep standalone cache builds fail-closed by default. The ensure workflow
    # opts into tolerance only while NPU compilation remains the CI fallback.
    continue-on-error: ${{ inputs.continue_on_error }}
    runs-on: ${{ fromJSON(inputs.target).runner }}
    container:
      image: ${{ fromJSON(inputs.target).image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Config mirrors (ubuntu)
        if: fromJSON(inputs.target).os == 'ubuntu'
        run: |
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          apt-get install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Config mirrors (openeuler)
        if: fromJSON(inputs.target).os == 'openeuler'
        run: |
          sed -Ei 's@https?://[^/]+/(openeuler|centos|fedora)@http://cache-service.nginx-pypi-cache.svc.cluster.local:8081/\1@g' /etc/yum.repos.d/*.repo
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          yum install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rebase on ${{ inputs.base_ref }} snapshot
        if: inputs.base_sha != ''
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          BASE_REPOSITORY: ${{ inputs.base_repository || inputs.repository || github.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          # Build from the same rebased snapshot used to calculate the cache key
          # and later consumed by tests. This also includes csrc updates that
          # landed on the base branch after the source branch was created.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          if [ -z "$BASE_REF" ]; then
            echo "::error::base_ref is required when base_sha is set."
            exit 1
          fi

          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          # Fork builds need the fixed base commit from upstream rather than
          # assuming it exists in the source repository's origin.
          BASE_REMOTE=origin
          if [ "$BASE_REPOSITORY" != "$SOURCE_REPOSITORY" ]; then
            BASE_REMOTE=csrc-base
            git remote add "$BASE_REMOTE" "https://github.com/${BASE_REPOSITORY}.git"
          fi
          git fetch "$BASE_REMOTE" "$BASE_REF"
          git cat-file -e "${BASE_SHA}^{commit}"
          git rebase "$BASE_SHA"

      - name: Update submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # A rebase can change submodule pointers; refresh them so cached
          # artifacts are built from the complete rebased source snapshot.
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install system dependencies (ubuntu)
        if: fromJSON(inputs.target).os == 'ubuntu'
        run: |
          xargs apt-get -y install < packages.txt
          apt-get -y install gcc g++ cmake libnuma-dev clang-15
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 20
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 20
          pip install uv

      - name: Install system dependencies (openeuler)
        if: fromJSON(inputs.target).os == 'openeuler'
        run: |
          yum install -y python3-pip net-tools jemalloc numactl patch clang
          pip install uv

      - name: Restore csrc snapshot cache
        # Per-op incremental layer: the artifact cache above only helps when
        # csrc is unchanged; on a miss this snapshot lets the build recompile
        # only the ops whose sources changed (~4 min instead of ~19 min).
        # restore-keys picks the most recent snapshot for the target when the
        # exact csrc hash has never been snapshotted; the manifest
        # invalidation in build_aclnn.sh handles any staleness.
        if: ${{ inputs.snapshot-cache }}
        uses: runs-on/cache/restore@v5
        with:
          path: /tmp/csrc-snapshot-store
          key: csrc-snapshot-v1-${{ fromJSON(inputs.target).id }}-${{ inputs.csrc_hash }}
          restore-keys: |
            csrc-snapshot-v1-${{ fromJSON(inputs.target).id }}-

      - name: Restore uv wheel cache
        # requirements-dev.txt installs the full build toolchain (torch,
        # torch-npu, ...). Downloading ~2GB of wheels per build dominates the
        # job wall time, so keep the uv cache across builds for the same
        # dependency set and image.
        uses: runs-on/cache/restore@v5
        with:
          path: /tmp/uv-cache
          key: uv-wheels-${{ fromJSON(inputs.target).cache_arch }}-${{ fromJSON(inputs.target).image_tag }}-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            uv-wheels-${{ fromJSON(inputs.target).cache_arch }}-${{ fromJSON(inputs.target).image_tag }}-

      - name: Install vllm-ascend
        env:
          SOC_VERSION: ${{ fromJSON(inputs.target).soc_version }}
          MAX_JOBS: '16'
          # Snapshot cache is opt-in: an empty dir disables the hooks in
          # build_aclnn.sh entirely (cache_enabled checks the env var).
          VLLM_ASCEND_SNAPSHOT_CACHE_DIR: ${{ inputs.snapshot-cache && '/tmp/csrc-snapshot-store' || '' }}
          VLLM_ASCEND_CACHE_TARGET: ${{ fromJSON(inputs.target).id }}
          VLLM_ASCEND_CACHE_IMAGE_TAG: ${{ fromJSON(inputs.target).image_tag }}
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          arch=$(uname -i)
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/${arch}-linux/devlib

          if [ "${{ runner.arch }}" = "X64" ]; then
            export UV_EXTRA_INDEX_URL="${UV_EXTRA_INDEX_URL} https://download.pytorch.org/whl/cpu/"
          fi

          pip install uc-manager
          # Indexes for triton-ascend and the CPU PyTorch wheel come from
          # UV_EXTRA_INDEX_URL. Passing --extra-index-url here would replace it.
          uv pip install -r requirements-dev.txt
          uv pip install --force-reinstall --no-deps triton-ascend==3.2.2
          # --no-deps: requirements-dev.txt already provides every runtime
          # dependency. Resolving them again here re-walks the whole index tree
          # and costs 10-30 minutes against the remote mirrors for zero
          # effect on the compiled artifacts.
          #
          # uv hides PEP 517 build output on success, which makes build-time
          # analysis impossible (per-op compile times, parallel efficiency).
          # Stream it with -v into a timestamped log on disk instead of the
          # job console, and sample /proc/stat alongside it so CPU
          # utilization of the two serial compile chains can be measured
          # offline. Both files are uploaded as an artifact below.
          set -o pipefail
          (
            while :; do
              date +%s
              grep '^cpu ' /proc/stat
              sleep 5
            done
          ) > "$RUNNER_TEMP/vllm-ascend-cpu-samples.log" 2>/dev/null &
          sampler_pid=$!

          if uv pip install -e . --no-deps -v 2>&1 \
            | while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done \
            > "$RUNNER_TEMP/vllm-ascend-build.log"; then
            echo "vllm-ascend build finished; full log uploaded as an artifact"
          else
            build_status=$?
            echo "::error::uv build failed (exit ${build_status}); tail of the build log:"
            tail -n 200 "$RUNNER_TEMP/vllm-ascend-build.log"
            kill "$sampler_pid" 2>/dev/null || true
            exit 1
          fi
          kill "$sampler_pid" 2>/dev/null || true

      - name: Save uv wheel cache
        if: always()
        uses: runs-on/cache/save@v5
        with:
          path: /tmp/uv-cache
          key: uv-wheels-${{ fromJSON(inputs.target).cache_arch }}-${{ fromJSON(inputs.target).image_tag }}-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}

      - name: Verify csrc artifacts
        run: |
          if ! find vllm_ascend -maxdepth 1 -name '*.so' -type f 2>/dev/null | grep -q .; then
            echo "::error::The csrc build does not contain a top-level shared library."
            exit 1
          fi

      - name: Save csrc cache
        uses: runs-on/cache/save@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ fromJSON(inputs.target).cache_arch }}-${{ fromJSON(inputs.target).image_tag }}-${{ inputs.csrc_hash }}

      - name: Prune snapshot store to newest entry
        # GitHub cache entries are immutable, so every build saves the store
        # under a new key. Keep only the snapshot produced by THIS build in
        # the store before saving; otherwise restored snapshots accumulate
        # and each saved entry grows generation by generation. Cross-entry
        # eviction is delegated to the GitHub cache LRU.
        if: ${{ inputs.snapshot-cache }}
        id: prune-snapshots
        run: |
          set -euo pipefail
          store=/tmp/csrc-snapshot-store
          if ! ls "$store"/snapshot-*.tar.* >/dev/null 2>&1; then
            echo "saved=false" >> "$GITHUB_OUTPUT"
            echo "no snapshot produced; nothing to save"
            exit 0
          fi
          newest=$(ls -t "$store"/snapshot-*.tar.* | head -1)
          for f in "$store"/snapshot-*.tar.*; do
            [ "$f" = "$newest" ] || rm -f "$f"
          done
          echo "pruned snapshot store to newest entry: $(basename "$newest")"
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Save csrc snapshot cache
        if: ${{ inputs.snapshot-cache && steps.prune-snapshots.outputs.saved == 'true' }}
        uses: runs-on/cache/save@v5
        with:
          path: /tmp/csrc-snapshot-store
          key: csrc-snapshot-v1-${{ fromJSON(inputs.target).id }}-${{ inputs.csrc_hash }}

      - name: Upload build log
        # Full uv/setuptools/cmake/ccec output plus 5s CPU samples, for
        # build-time analysis (per-op compile times, parallel efficiency,
        # utilization of the serial AscendC and C++ chains).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vllm-ascend-build-log-${{ fromJSON(inputs.target).id }}
          path: ${{ runner.temp }}/vllm-ascend-*.log
          if-no-files-found: ignore
          retention-days: 7
