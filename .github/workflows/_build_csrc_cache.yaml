name: Build csrc Cache

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: 'One resolved target object from csrc_cache_targets.json.'
      csrc_hash:
        type: string
        required: true
        description: 'The csrc source hash used in the cache key.'
      source_ref:
        type: string
        required: true
        description: 'Immutable vllm-ascend source commit to build.'
      repository:
        type: string
        required: false
        default: ''
        description: 'Source repository. Defaults to the current repository.'
      base_ref:
        type: string
        required: false
        default: ''
        description: 'Base ref containing the fixed base commit.'
      base_repository:
        type: string
        required: false
        default: ''
        description: 'Base repository. Defaults to the source repository.'
      base_sha:
        type: string
        required: false
        default: ''
        description: 'Fixed base commit to rebase onto before building.'
      continue_on_error:
        type: boolean
        required: false
        default: false
        description: 'Allow callers in rollout mode to continue when this cache build fails.'

defaults:
  run:
    shell: bash -el {0}

env:
  UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
  UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
  UV_HTTP_TIMEOUT: 120
  UV_NO_CACHE: 1
  UV_SYSTEM_PYTHON: 1

  # L1: persistent fine-grained build cache. L0 remains the exact final-artifact
  # cache consumed by test jobs.
  INCREMENTAL_BUILD_CACHE_DIR: /tmp/vllm-ascend-incremental-build-cache
  INCREMENTAL_BUILD_CACHE_NAMESPACE: vllm-ascend-inc
  INCREMENTAL_BUILD_CACHE_TRANSPORT_EPOCH: v1

  VLLM_ASCEND_BUILD_CACHE_ENTRY_LOCK_TIMEOUT_SECONDS: "60"
  VLLM_ASCEND_BUILD_CACHE_ACTION_LOCK_TIMEOUT_SECONDS: "120"
  VLLM_ASCEND_BUILD_CACHE_PUBLISH_LOCK_TIMEOUT_SECONDS: "120"

jobs:
  build:
    name: build-${{ fromJSON(inputs.target).id }}-cache
    # Keep standalone cache builds fail-closed by default. The ensure workflow
    # opts into tolerance only while NPU compilation remains the CI fallback.
    continue-on-error: ${{ inputs.continue_on_error }}
    runs-on: ${{ fromJSON(inputs.target).runner }}
    container:
      image: ${{ fromJSON(inputs.target).image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Config mirrors (ubuntu)
        if: fromJSON(inputs.target).os == 'ubuntu'
        run: |
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          apt-get install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Config mirrors (openeuler)
        if: fromJSON(inputs.target).os == 'openeuler'
        run: |
          sed -Ei 's@https?://[^/]+/(openeuler|centos|fedora)@http://cache-service.nginx-pypi-cache.svc.cluster.local:8081/\1@g' /etc/yum.repos.d/*.repo
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          yum install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rebase on ${{ inputs.base_ref }} snapshot
        if: inputs.base_sha != ''
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          BASE_REPOSITORY: ${{ inputs.base_repository || inputs.repository || github.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          # Build from the same rebased snapshot used to calculate the cache key
          # and later consumed by tests. This also includes csrc updates that
          # landed on the base branch after the source branch was created.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          if [ -z "$BASE_REF" ]; then
            echo "::error::base_ref is required when base_sha is set."
            exit 1
          fi

          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          # Fork builds need the fixed base commit from upstream rather than
          # assuming it exists in the source repository's origin.
          BASE_REMOTE=origin
          if [ "$BASE_REPOSITORY" != "$SOURCE_REPOSITORY" ]; then
            BASE_REMOTE=csrc-base
            git remote add "$BASE_REMOTE" "https://github.com/${BASE_REPOSITORY}.git"
          fi
          git fetch "$BASE_REMOTE" "$BASE_REF"
          git cat-file -e "${BASE_SHA}^{commit}"
          git rebase "$BASE_SHA"

      - name: Update submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # A rebase can change submodule pointers; refresh them so cached
          # artifacts are built from the complete rebased source snapshot.
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install system dependencies (ubuntu)
        if: fromJSON(inputs.target).os == 'ubuntu'
        run: |
          xargs apt-get -y install < packages.txt
          apt-get -y install gcc g++ cmake libnuma-dev clang-15
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 20
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 20
          pip install uv

      - name: Install system dependencies (openeuler)
        if: fromJSON(inputs.target).os == 'openeuler'
        run: |
          yum install -y python3-pip net-tools jemalloc numactl patch clang
          pip install uv

      - name: Build incremental cache key
        id: incremental-cache-key
        if: fromJSON(inputs.target).incremental_cache == true
        env:
          CSRC_HASH: ${{ inputs.csrc_hash }}
          TARGET_ID: ${{ fromJSON(inputs.target).id }}
          IMAGE_TAG: ${{ fromJSON(inputs.target).image_tag }}
          TARGET_SOC_VERSION: ${{ fromJSON(inputs.target).soc_version }}
        run: |
          set -euo pipefail

          engine_schema="$(python3 - <<'PYCODE'
          import ast
          from pathlib import Path

          tree = ast.parse(
              Path("csrc/scripts/build_cache.py").read_text(encoding="utf-8")
          )
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if (
                          isinstance(target, ast.Name)
                          and target.id == "SCHEMA_VERSION"
                      ):
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)

          raise SystemExit("SCHEMA_VERSION not found")
          PYCODE
          )"

          compat_prefix="${INCREMENTAL_BUILD_CACHE_NAMESPACE}-${INCREMENTAL_BUILD_CACHE_TRANSPORT_EPOCH}-schema${engine_schema}-${TARGET_ID}-${IMAGE_TAG}-${TARGET_SOC_VERSION}-"
          same_csrc_prefix="${compat_prefix}${CSRC_HASH}-"
          primary_key="${same_csrc_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "engine_schema=${engine_schema}"
            echo "compat_prefix=${compat_prefix}"
            echo "same_csrc_prefix=${same_csrc_prefix}"
            echo "primary_key=${primary_key}"
          } >> "$GITHUB_OUTPUT"

          echo "================ L1 CACHE KEY ================"
          echo "target=${TARGET_ID}"
          echo "engine_schema=${engine_schema}"
          echo "primary_key=${primary_key}"
          echo "restore priority:"
          echo "  1. ${same_csrc_prefix}*"
          echo "  2. ${compat_prefix}*"
          echo "=============================================="

      - name: Prepare incremental build cache destination
        if: fromJSON(inputs.target).incremental_cache == true
        run: |
          set -euo pipefail
          rm -rf "$INCREMENTAL_BUILD_CACHE_DIR"
          mkdir -p "$INCREMENTAL_BUILD_CACHE_DIR"

      - name: Restore incremental build cache
        id: incremental-cache-restore
        if: fromJSON(inputs.target).incremental_cache == true
        continue-on-error: true
        uses: runs-on/cache/restore@v5
        with:
          path: ${{ env.INCREMENTAL_BUILD_CACHE_DIR }}
          key: ${{ steps.incremental-cache-key.outputs.primary_key }}
          restore-keys: |
            ${{ steps.incremental-cache-key.outputs.same_csrc_prefix }}
            ${{ steps.incremental-cache-key.outputs.compat_prefix }}

      - name: Install vllm-ascend
        env:
          SOC_VERSION: ${{ fromJSON(inputs.target).soc_version }}
          MAX_JOBS: '16'
          VLLM_ASCEND_BUILD_CACHE_DIR: ${{ env.INCREMENTAL_BUILD_CACHE_DIR }}
          VLLM_ASCEND_BUILD_CACHE_EVENT_LOG: ${{ runner.temp }}/incremental-build-cache.events.jsonl
        run: |
          mkdir -p "$VLLM_ASCEND_BUILD_CACHE_DIR"
          rm -f "$VLLM_ASCEND_BUILD_CACHE_EVENT_LOG"
          touch "$VLLM_ASCEND_BUILD_CACHE_EVENT_LOG"

          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          arch=$(uname -i)
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/${arch}-linux/devlib

          if [ "${{ runner.arch }}" = "X64" ]; then
            export UV_EXTRA_INDEX_URL="${UV_EXTRA_INDEX_URL} https://download.pytorch.org/whl/cpu/"
          fi

          pip install uc-manager
          # Indexes for triton-ascend and the CPU PyTorch wheel come from
          # UV_EXTRA_INDEX_URL. Passing --extra-index-url here would replace it.
          uv pip install -r requirements-dev.txt
          uv pip install --force-reinstall --no-deps triton-ascend==3.2.2
          uv pip install -e .

      - name: Verify csrc artifacts
        run: |
          if ! find vllm_ascend -maxdepth 1 -name '*.so' -type f 2>/dev/null | grep -q .; then
            echo "::error::The csrc build does not contain a top-level shared library."
            exit 1
          fi

      - name: Summarize incremental build cache
        if: always() && fromJSON(inputs.target).incremental_cache == true
        continue-on-error: true
        env:
          EVENT_LOG: ${{ runner.temp }}/incremental-build-cache.events.jsonl
          RESTORE_HIT: ${{ steps.incremental-cache-restore.outputs.cache-hit }}
          RESTORE_MATCHED_KEY: ${{ steps.incremental-cache-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import collections
          import json
          import os
          from pathlib import Path

          event_path = Path(os.environ["EVENT_LOG"])
          events = []
          if event_path.is_file():
              for line in event_path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      events.append(json.loads(line))

          starts = collections.Counter(
              e.get("domain")
              for e in events
              if e.get("event") == "action_start"
          )
          results = collections.Counter(
              (e.get("domain"), e.get("status"))
              for e in events
              if e.get("event") == "cache_result"
          )

          op_hit = results[("custom_operator", "HIT")]
          op_miss = results[("custom_operator", "MISS")]
          op_bypass = results[("custom_operator", "BYPASS")]
          tp_hit = results[("third_party", "HIT")]
          tp_miss = results[("third_party", "MISS")]
          tp_bypass = results[("third_party", "BYPASS")]
          lock_timeout = sum(
              e.get("event") == "lock_timeout" for e in events
          )
          index_skipped = sum(
              e.get("event") == "index_skipped" for e in events
          )

          lines = [
              "## Incremental csrc build cache",
              f"- restore exact hit: `{os.environ.get('RESTORE_HIT', '') or 'false'}`",
              f"- restore matched key: `{os.environ.get('RESTORE_MATCHED_KEY', '') or '<none>'}`",
              (
                  "- custom_operator: "
                  f"actions={starts['custom_operator']}, "
                  f"HIT={op_hit}, MISS={op_miss}, BYPASS={op_bypass}"
              ),
              (
                  "- third_party: "
                  f"actions={starts['third_party']}, "
                  f"HIT={tp_hit}, MISS={tp_miss}, BYPASS={tp_bypass}"
              ),
              f"- lock_timeout={lock_timeout}, index_skipped={index_skipped}",
          ]

          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("\n".join(lines) + "\n")
          PYCODE

          du -sh "$INCREMENTAL_BUILD_CACHE_DIR" || true

      # L1 transport failure is a performance degradation, not a correctness
      # failure. The verified final L0 artifact can still be published.
      - name: Save incremental build cache
        if: success() && fromJSON(inputs.target).incremental_cache == true
        continue-on-error: true
        uses: runs-on/cache/save@v5
        with:
          path: ${{ env.INCREMENTAL_BUILD_CACHE_DIR }}
          key: ${{ steps.incremental-cache-key.outputs.primary_key }}

      - name: Save csrc cache
        uses: runs-on/cache/save@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ fromJSON(inputs.target).cache_arch }}-${{ fromJSON(inputs.target).image_tag }}-${{ inputs.csrc_hash }}
