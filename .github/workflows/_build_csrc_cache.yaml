name: Build csrc Cache

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: 'One resolved target object from csrc_cache_targets.json.'
      csrc_hash:
        type: string
        required: true
        description: 'The csrc source hash used in the cache key.'
      source_ref:
        type: string
        required: true
        description: 'Immutable vllm-ascend source commit to build.'
      repository:
        type: string
        required: false
        default: ''
        description: 'Source repository. Defaults to the current repository.'
      base_ref:
        type: string
        required: false
        default: ''
        description: 'Base ref containing the fixed base commit.'
      base_repository:
        type: string
        required: false
        default: ''
        description: 'Base repository. Defaults to the source repository.'
      base_sha:
        type: string
        required: false
        default: ''
        description: 'Fixed base commit to rebase onto before building.'
      continue_on_error:
        type: boolean
        required: false
        default: false
        description: 'Allow callers in rollout mode to continue when this cache build fails.'
    secrets:
      HW_OBS_AK:
        required: false
      HW_OBS_SK:
        required: false

defaults:
  run:
    shell: bash -el {0}

env:
  UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi https://download.pytorch.org/whl/cpu/"
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_HTTP_TIMEOUT: 120
  UV_NO_CACHE: 1
  UV_SYSTEM_PYTHON: 1

  # L1: persistent fine-grained build cache. L0 remains the exact final-artifact
  # cache consumed by test jobs.
  # runs-on/cache includes the literal path in its remote namespace. Every
  # L1 caller must use this workspace-relative path, not runner.temp or /tmp.
  # Restore exports its absolute equivalent for compilation. Save must use
  # restore's original cache-dir output, not this subsequently updated env.
  VLLM_ASCEND_BUILD_CACHE_DIR: csrc/build_cache
  RUNS_ON_S3_BUCKET_CACHE: ascend-ci-cache-hk
  RUNS_ON_S3_BUCKET_ENDPOINT: https://obs.ap-southeast-1.myhuaweicloud.com
  RUNS_ON_S3_FORCE_PATH_STYLE: "false"
  AWS_S3_FORCE_PATH_STYLE: "false"
  AWS_REGION: ap-southeast-1
  RUNS_ON_RUNNER_NAME: ""

jobs:
  build:
    name: build-${{ fromJSON(inputs.target).id }}-cache
    # Keep standalone cache builds fail-closed by default. The ensure workflow
    # opts into tolerance only while NPU compilation remains the CI fallback.
    continue-on-error: ${{ inputs.continue_on_error }}
    runs-on: ${{ fromJSON(inputs.target).runner }}
    env:
      OBS_CACHE_WRITE_ACCESS_KEY_ID: ${{ secrets.HW_OBS_AK }}
      OBS_CACHE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.HW_OBS_SK }}
    container:
      image: ${{ fromJSON(inputs.target).image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install packages (ubuntu)
        if: fromJSON(inputs.target).os == 'ubuntu'
        run: |
          apt-get update -y
          apt-get install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install packages (openeuler)
        if: fromJSON(inputs.target).os == 'openeuler'
        run: |
          yum install -y git zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rebase on ${{ inputs.base_ref }} snapshot
        if: inputs.base_sha != ''
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository || github.repository }}
          BASE_REPOSITORY: ${{ inputs.base_repository || inputs.repository || github.repository }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          # Build from the same rebased snapshot used to calculate the cache key
          # and later consumed by tests. This also includes csrc updates that
          # landed on the base branch after the source branch was created.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          if [ -z "$BASE_REF" ]; then
            echo "::error::base_ref is required when base_sha is set."
            exit 1
          fi

          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          # Fork builds need the fixed base commit from upstream rather than
          # assuming it exists in the source repository's origin.
          BASE_REMOTE=origin
          if [ "$BASE_REPOSITORY" != "$SOURCE_REPOSITORY" ]; then
            BASE_REMOTE=csrc-base
            git remote add "$BASE_REMOTE" "https://github.com/${BASE_REPOSITORY}.git"
          fi
          git fetch "$BASE_REMOTE" "$BASE_REF"
          git cat-file -e "${BASE_SHA}^{commit}"
          git rebase "$BASE_SHA"

      - name: Update submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # A rebase can change submodule pointers; refresh them so cached
          # artifacts are built from the complete rebased source snapshot.
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Checkout nightly cache helpers
        if: fromJSON(inputs.target).nightly == true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .csrc-cache-workflow
          sparse-checkout: |
            .github/actions/nightly-csrc-l0-restore
            .github/workflows/scripts/nightly_csrc_l0.py
            .github/workflows/scripts/prepare_csrc_l1_restore.py

      - name: Restore nightly L0
        id: nightly-cache
        if: fromJSON(inputs.target).nightly == true
        uses: ./.csrc-cache-workflow/.github/actions/nightly-csrc-l0-restore
        with:
          architecture: ${{ fromJSON(inputs.target).cache_arch }}
          soc-version: ${{ fromJSON(inputs.target).soc_version }}

      - name: Install system dependencies (ubuntu)
        if: fromJSON(inputs.target).os == 'ubuntu' && fromJSON(inputs.target).nightly != true
        run: |
          xargs apt-get -y install < packages.txt
          apt-get -y install gcc g++ cmake libnuma-dev clang-15
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 20
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 20
          pip install uv

      - name: Install system dependencies (openeuler)
        if: fromJSON(inputs.target).os == 'openeuler' && fromJSON(inputs.target).nightly != true
        run: |
          yum install -y python3-pip net-tools numactl patch clang
          pip install uv

      - name: Restore incremental build cache
        if: steps.nightly-cache.outputs.cache-hit != 'true'
        id: incremental-cache-restore
        uses: $/.github/actions/csrc-l1-restore
        with:
          cache-dir: ${{ env.VLLM_ASCEND_BUILD_CACHE_DIR }}
          architecture: ${{ fromJSON(inputs.target).cache_arch }}
          soc-version: ${{ fromJSON(inputs.target).soc_version }}
          csrc-hash: ${{ inputs.csrc_hash }}

      - name: Install vllm-ascend
        if: steps.nightly-cache.outputs.cache-hit != 'true'
        env:
          SOC_VERSION: ${{ fromJSON(inputs.target).soc_version }}
          MAX_JOBS: '16'
          NIGHTLY: ${{ fromJSON(inputs.target).nightly == true }}
        run: |
          mkdir -p "$VLLM_ASCEND_BUILD_CACHE_DIR"
          rm -f "$VLLM_ASCEND_BUILD_CACHE_EVENT_LOG"
          touch "$VLLM_ASCEND_BUILD_CACHE_EVENT_LOG"

          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          arch=$(uname -i)
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/${arch}-linux/devlib

          pip install uc-manager
          # Indexes for triton-ascend and the CPU PyTorch wheel come from
          # UV_EXTRA_INDEX_URL. Passing --extra-index-url here would replace it.
          if [ "$NIGHTLY" = "true" ]; then
            pip uninstall -y vllm-ascend
            pip install uv
            uv pip install -r requirements-nightly.txt
            # Match PR nightly installs without replacing image-pinned packages.
            grep -vE '^(torch|torch-npu|torchvision|torchaudio|triton-ascend|memfabric_hybrid|memcache_hybrid)[=<>!]' \
              requirements.txt > /tmp/requirements-runtime.txt || true
            uv pip install -r /tmp/requirements-runtime.txt
            uv pip install -e . --no-deps
          else
            uv pip install -r requirements-dev.txt
            uv pip install --force-reinstall --no-deps triton-ascend==3.2.2
            uv pip install -e .
          fi

      - name: Verify csrc artifacts
        if: steps.nightly-cache.outputs.cache-hit != 'true'
        run: |
          if ! find vllm_ascend -maxdepth 1 -name '*.so' -type f 2>/dev/null | grep -q .; then
            echo "::error::The csrc build does not contain a top-level shared library."
            exit 1
          fi

      # L1 transport failure is a performance degradation, not a correctness
      # failure. The verified final L0 artifact can still be published.
      - name: Save incremental build cache
        if: steps.nightly-cache.outputs.cache-hit != 'true'
        uses: $/.github/actions/csrc-l1-save
        with:
          cache-dir: ${{ steps.incremental-cache-restore.outputs.cache-dir }}
          primary-key: ${{ steps.incremental-cache-restore.outputs.primary-key }}
          access-key-id: ${{ env.OBS_CACHE_WRITE_ACCESS_KEY_ID }}
          secret-access-key: ${{ env.OBS_CACHE_WRITE_SECRET_ACCESS_KEY }}

      - name: Record nightly L0 integrity
        if: fromJSON(inputs.target).nightly == true && steps.nightly-cache.outputs.cache-hit != 'true' && steps.nightly-cache.outputs.key != ''
        env:
          CACHE_KEY: ${{ steps.nightly-cache.outputs.key }}
        run: python3 .csrc-cache-workflow/.github/workflows/scripts/nightly_csrc_l0.py record --key "$CACHE_KEY"

      - name: Save nightly L0 to GitHub Cache
        if: fromJSON(inputs.target).nightly == true && steps.nightly-cache.outputs.cache-hit != 'true' && steps.nightly-cache.outputs.key != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
            .nightly-csrc-l0.json
          key: ${{ steps.nightly-cache.outputs.key }}

      - name: Save csrc cache
        if: >-
          ${{
            fromJSON(inputs.target).nightly != true &&
            env.OBS_CACHE_WRITE_ACCESS_KEY_ID != '' &&
            env.OBS_CACHE_WRITE_SECRET_ACCESS_KEY != ''
          }}
        uses: runs-on/cache/save@v5
        env:
          AWS_ACCESS_KEY_ID: ${{ env.OBS_CACHE_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.OBS_CACHE_WRITE_SECRET_ACCESS_KEY }}
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ fromJSON(inputs.target).cache_arch }}-${{ fromJSON(inputs.target).image_tag }}-${{ inputs.csrc_hash }}
