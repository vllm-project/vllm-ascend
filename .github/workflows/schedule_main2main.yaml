name: Main2Main

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Target vLLM commit hash (default: latest vLLM main HEAD)'
        required: false
        default: ''
      model:
        description: 'opencode model name (default: deepseek/deepseek-v4-flash)'
        required: false
        default: 'deepseek/deepseek-v4-flash'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

defaults:
  run:
    shell: bash -el {0}

env:
  UPSTREAM_REPO: vllm-project/vllm-ascend
  MAIN2MAIN_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'deepseek/deepseek-v4-flash' }}
  

jobs:
  resolve-source:
    runs-on: linux-amd64-cpu-4-hk
    outputs:
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      base_ref: ${{ steps.source.outputs.base_ref }}
      base_sha: ${{ steps.source.outputs.base_sha }}
    env:
      TARGET_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_commit || '' }}
      HEAD_FORK: vllm-ascend-ci/vllm-ascend
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout vllm-project/vllm repo
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm
          ref: ${{ env.TARGET_COMMIT != '' && env.TARGET_COMMIT || 'main' }}
          path: vllm-upstream
          fetch-depth: 0

      - name: Resolve fixed vllm-ascend source
        id: source
        run: |
          set -eu
          if [ -n "$TARGET_COMMIT" ] && ! echo "$TARGET_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Invalid target_commit format: $TARGET_COMMIT"
            exit 1
          fi

          git config user.name "main2main-bot"
          git config user.email "main2main-bot@users.noreply.github.com"
          git fetch origin main
          UPSTREAM_SHA=$(git rev-parse origin/main)
          USE_BASELINE=false

          # Attempt incremental mode: carry forward previous adaptation commits
          # by rebasing main2main_baseline onto this run's fixed upstream SHA.
          if git fetch "https://github.com/${HEAD_FORK}.git" \
            "refs/heads/main2main_baseline:refs/remotes/main2main/main2main_baseline" 2>/dev/null; then
            BASELINE_SHA=$(git rev-parse refs/remotes/main2main/main2main_baseline)
            BASELINE_VLLM=$(git show "${BASELINE_SHA}:.github/vllm-main-verified.commit" 2>/dev/null || true)
            TARGET_BEHIND=false
            if [ -n "$TARGET_COMMIT" ] && [ -n "$BASELINE_VLLM" ] && \
              git -C vllm-upstream merge-base --is-ancestor "$TARGET_COMMIT" "$BASELINE_VLLM" 2>/dev/null; then
              TARGET_BEHIND=true
            fi

            if [ "$TARGET_BEHIND" = false ]; then
              git checkout --detach "$BASELINE_SHA"
              if git rebase "$UPSTREAM_SHA"; then
                USE_BASELINE=true
              else
                git rebase --abort
              fi
            fi
          fi

          # Fresh mode starts directly from the fixed upstream SHA when no
          # baseline exists, the target vLLM commit predates the baseline's
          # verified vLLM commit, or the rebase conflicts.
          if [ "$USE_BASELINE" = true ]; then
            {
              echo "source_repository=$HEAD_FORK"
              echo "source_ref=$BASELINE_SHA"
              echo "base_ref=main"
              echo "base_sha=$UPSTREAM_SHA"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "source_repository=$UPSTREAM_REPO"
              echo "source_ref=$UPSTREAM_SHA"
              echo "base_ref="
              echo "base_sha="
            } >> "$GITHUB_OUTPUT"
          fi

  main2main:
    needs: resolve-source
    # All analysis/planning/adapter/QA/pre-CI/final-gate work runs on a pure
    # CPU runner; E2E runs on the A2/A3/310P NPU runners via the external
    # main2main-e2e workflows (dispatched by step 0 below).
    runs-on: linux-amd64-cpu-8-hk
    timeout-minutes: 1440
    concurrency:
      group: main2main
      cancel-in-progress: false
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HCCL_BUFFSIZE: 1024
        HF_HUB_OFFLINE: 1
        UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
        UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/"
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
        UV_HTTP_TIMEOUT: 120
        UV_NO_CACHE: 1
        UV_SYSTEM_PYTHON: 1
        PRE_COMMIT_HOME: /tmp/main2main-pre-commit
        # Use Huawei Cloud's domestic Go module proxy for pre-commit hooks
        # such as actionlint, whose golangenv otherwise accesses proxy.golang.org.
        GOPROXY: https://repo.huaweicloud.com/repository/goproxy/
        GONOSUMDB: '*'
    defaults:
      run:
        shell: bash -el {0}
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      TARGET_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_commit || '' }}
      PUSH_TO_GITHUB: 'true'
      GITHUB_REPO: vllm-project/vllm-ascend
      HEAD_FORK: vllm-ascend-ci/vllm-ascend
      MAIN2MAIN_KEEP_BRANCH: 'true'
      MAIN2MAIN_WORKSPACE: /tmp/main2main_flow/workspace
      # External E2E on the A2/A3/310P resident runners (select_tests.py
      # ready-all selection, identical to PR CI).  This workflow dispatches
      # main2main-e2e.yaml ONCE (below); the runners build their env and
      # then serve every E2E round in place from the flow's signal-branch
      # commands.  MAIN2MAIN_E2E_PREP_RUN_ID is filled by the "Pre-start
      # E2E runner envs" step so the flow reuses that run.
      MAIN2MAIN_E2E_REPO: vllm-ascend-ci/vllm-ascend
      MAIN2MAIN_E2E_BRANCH: main2main_e2e
      # Must mirror main2main-e2e.yaml's resident matrix (a3 temporarily
      # removed) — groups for chips outside it are dropped flow-side,
      # otherwise every round waits its full timeout for a chip that never
      # reports.
      MAIN2MAIN_E2E_CHIPS: 'a2,310p'
      # Fork carrying the signal branch (the adapted code + test_groups.json)
      # that the E2E workflow checks out per round — same fork the PR head
      # lives on, so the pushed history is already known there.
      MAIN2MAIN_E2E_SIGNAL_REPO: vllm-ascend-ci/vllm-ascend
      # Identifies this main run in the e2e workflow: the prep dispatch
      # inputs and the prepare-<chip>-<main_run_id> job names key on it,
      # and the resident loop probes it to detect main-run completion.
      MAIN2MAIN_E2E_MAIN_RUN_ID: ${{ github.run_id }}
      # Pin the flow revision the install step clones.  Kept on
      # feature/e2e-external while the 3-runner E2E change is under
      # validation (main2main_flow PR #3); remove once that PR merges.
      MAIN2MAIN_FLOW_REF: feature/e2e-external
      # npu-smi exists in the CANN container but there is no device on the
      # CPU runner — skip the mega_moe JIT warmup entirely.
      MAIN2MAIN_SKIP_NPU_WARMUP: 'true'
      MAIN2MAIN_LOG_HELPERS: |
        print_group() {
          local title="$1"
          local path="$2"
          echo "::group::${title}"
          cat "${path}" || true
          echo "::endgroup::"
        }
        print_group_if_nonempty() {
          local title="$1"
          local path="$2"
          [ -s "${path}" ] || return 0
          print_group "${title}" "${path}"
        }
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve-source.outputs.source_repository }}
          ref: ${{ needs.resolve-source.outputs.source_ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Exclude vllm dir from ascend git
        run: echo "vllm-upstream/" >> .git/info/exclude

      - name: Checkout vllm-project/vllm repo
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm
          ref: ${{ env.TARGET_COMMIT != '' && env.TARGET_COMMIT || 'main' }}
          path: vllm-upstream
          fetch-depth: 0

      - name: Validate target commit
        run: |
          TARGET="${TARGET_COMMIT}"
          if [ -n "${TARGET}" ]; then
            if ! echo "${TARGET}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Invalid target_commit format: ${TARGET}"
              exit 1
            fi
          fi

      - name: Install dependencies
        run: |
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          if [ -s "$GITHUB_WORKSPACE/packages.txt" ]; then
            xargs -r apt-get -y install < "$GITHUB_WORKSPACE/packages.txt"
          fi
          apt-get -y install git curl ca-certificates gcc g++ cmake libnuma-dev zstd clang-15 jq gh shellcheck
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 20
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 20
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/vllm-upstream"
          pip install uv pytest

      - name: Configure git identity
        working-directory: ${{ github.workspace }}
        run: |
          set -eu
          git config user.name "main2main-bot"
          git config user.email "main2main-bot@users.noreply.github.com"
          gh --version

      - name: Pre-start E2E runner envs
        run: |
          set -euo pipefail
          # Dispatch the A2/A3/310P environment prep NOW (in parallel with
          # the remaining CPU installs), then WAIT until each NPU
          # runner picks up its prepare job (machine resources
          # allocated, pod up, runner online) before the main flow
          # proceeds — fail fast if the machines cannot come up.  The flow
          # reuses this run id (MAIN2MAIN_E2E_PREP_RUN_ID) instead of
          # dispatching again.
          VLLM_COMMIT="${TARGET_COMMIT}"
          if [ -z "${VLLM_COMMIT}" ]; then
            VLLM_COMMIT=$(git -C vllm-upstream rev-parse HEAD)
          fi
          echo "Pre-starting main2main E2E env prep for vllm=${VLLM_COMMIT} (A2/A3/310P)..."
          # Every main run prepares its own env (run-name
          # Main2Main-E2E-<main_run_id>): the env belongs to this run's
          # fixed vllm commit, and each step's E2E rounds then reuse it
          # without re-installing or re-acquiring the csrc cache.  No
          # cross-run prep reuse — a stale reused run may have had its
          # runner workspace reaped, forcing re-install on the next round.
          gh workflow run main2main-e2e.yaml \
            --repo "${HEAD_FORK}" \
            --ref main \
            -f "vllm=${VLLM_COMMIT}" \
            -f "base_ref=main" \
            -f "signal_branch=${MAIN2MAIN_E2E_BRANCH}" \
            -f "signal_repo=${MAIN2MAIN_E2E_SIGNAL_REPO}" \
            -f "flow_ref=${MAIN2MAIN_FLOW_REF:-main}" \
            -f "main_run_id=${GITHUB_RUN_ID}" \
            -f "main_run_repo=${GITHUB_REPOSITORY}"
          # Phase 1: find our run id (list API indexing can lag ~1 min).
          # The run-name is unique to this main run
          # (Main2Main-E2E-<main_run_id>), so the newest matching run is
          # the one we just dispatched.
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh api "repos/${HEAD_FORK}/actions/runs?event=workflow_dispatch&branch=main&per_page=50" 2>/tmp/prep-poll.err \
              | python3 -c "
          import json, sys
          runs = json.load(sys.stdin).get('workflow_runs', [])
          main_run = sys.argv[1]
          want_name = 'Main2Main-E2E-' + main_run
          cands = [r['id'] for r in runs if r.get('name') == want_name]
          print(max(cands) if cands else '')
          " "${GITHUB_RUN_ID}" || true)
            if [ -n "${RUN_ID:-}" ]; then
              break
            fi
            echo "prep run not found (poll ${i}/30)"
            sleep 10
          done
          if [ -z "${RUN_ID:-}" ]; then
            echo "::error::prep run id not found after 30 polls — the NPU runners were never dispatched"
            exit 1
          fi
          echo "MAIN2MAIN_E2E_PREP_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "Prep run ${RUN_ID} started"
          # Phase 2: wait until each prepare job's "Check NPU availability"
          # step completed (npu-smi ok) — not merely until the job leaves
          # queued (which is right after the init container finishes, before
          # the NPU is confirmed usable).  Jobs are queried by the prep run
          # id itself, so prefix matching on prepare-<chip>- is unambiguous.
          # Use the local RUN_ID: MAIN2MAIN_E2E_PREP_RUN_ID was written to
          # GITHUB_ENV for later steps and is not bound in this shell
          # (set -u would abort on it).
          PREP_RUN_ID=${RUN_ID}
          WAIT_MIN=${MAIN2MAIN_E2E_READY_TIMEOUT_MIN:-120}
          echo "Waiting for the NPU runners to pass NPU availability check (prepare-a2/310p) — up to ${WAIT_MIN} min..."
          DEADLINE=$(( $(date +%s) + WAIT_MIN * 60 ))
          while :; do
            READY_STATE=$(gh api "repos/${HEAD_FORK}/actions/runs/${PREP_RUN_ID}/jobs" \
              | python3 -c "
          import json, sys
          jobs = json.load(sys.stdin).get('jobs', [])
          want = [f'prepare-{c}-' for c in ('a2', '310p')]
          NPU_STEP = 'Check NPU availability'
          state = {}
          for j in jobs:
              name = j.get('name') or ''
              for w in want:
                  if name.startswith(w):
                      step_st = step_con = 'missing'
                      for st in j.get('steps', []) or []:
                          if st.get('name') == NPU_STEP:
                              step_st = st.get('status') or 'missing'
                              step_con = (st.get('conclusion') or '') or 'missing'
                      state[w[:-1]] = (step_st, step_con, j.get('status'),
                                       j.get('conclusion') or 'missing')
          out = []
          for w in want:
              if w[:-1] in state:
                  step_st, step_con, job_st, job_con = state[w[:-1]]
                  out.append(f'{w[:-1]}|{step_st}|{step_con}|{job_st}|{job_con}')
              else:
                  out.append(f'{w[:-1]}|missing|missing|missing|missing')
          print(';'.join(out))
          ") || true
            if [ -z "${READY_STATE}" ]; then
              echo "  runners: <gh api failed — retrying>"
              sleep 30
              continue
            fi
            echo "  runners: ${READY_STATE}"
            ALL_READY=true
            for entry in $(echo "${READY_STATE}" | tr ';' '\n'); do
              IFS='|' read -r jname jstep jconclusion jstatus jjob_conclusion <<< "${entry}"
              case "${jstatus}" in
                completed)
                  # failed/skipped/cancelled/timed_out are CONCLUSION values,
                  # never job statuses — check the job conclusion once the
                  # job completed (the resident loop keeps it in_progress
                  # afterwards, so this only fires on an early death).
                  case "${jjob_conclusion}" in
                    failure|cancelled|timed_out|startup_failure|skipped)
                      echo "::error::${jname} job completed with ${jjob_conclusion} — cannot wait for it"
                      exit 1
                      ;;
                  esac
                  ;;
              esac
              case "${jstep}" in
                completed)
                  if [ "${jconclusion}" != "success" ]; then
                    echo "::error::${jname} 'Check NPU availability' failed (${jconclusion})"
                    exit 1
                  fi
                  ;;
                *) ALL_READY=false ;;
              esac
            done
            if [ "${ALL_READY}" = "true" ]; then
              echo "All NPU runners passed the NPU availability check (npu-smi ok)"
              break
            fi
            if [ "$(date +%s)" -gt "${DEADLINE}" ]; then
              echo "::error::timed out after ${WAIT_MIN} min waiting for the NPU availability check (last state: ${READY_STATE})"
              exit 1
            fi
            sleep 30
          done

      - name: Install opencode + main2main-flow
        env:
          NODE_VERSION: 24.18.0
        run: |
          set -euxo pipefail

          NODE_INSTALL_DIR="/opt/nodejs"
          NODE_ARCHIVE_NAME="node-v${NODE_VERSION}-linux-x64.tar.gz"
          NODE_ARCHIVE="/tmp/${NODE_ARCHIVE_NAME}"
          NODE_CHECKSUMS="/tmp/node-v${NODE_VERSION}-SHASUMS256.txt"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "${NODE_ARCHIVE}" \
            "https://repo.huaweicloud.com/nodejs/v${NODE_VERSION}/${NODE_ARCHIVE_NAME}"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "${NODE_CHECKSUMS}" \
            "https://repo.huaweicloud.com/nodejs/v${NODE_VERSION}/SHASUMS256.txt"
          (cd /tmp && grep " ${NODE_ARCHIVE_NAME}$" "${NODE_CHECKSUMS}" | sha256sum -c -)
          mkdir -p "${NODE_INSTALL_DIR}"
          tar -xzf "${NODE_ARCHIVE}" --strip-components=1 -C "${NODE_INSTALL_DIR}"
          export PATH="${NODE_INSTALL_DIR}/bin:${PATH}"
          node --version
          npm --version

          npm install --global \
            --prefix "$HOME/.opencode" \
            --registry https://repo.huaweicloud.com/repository/npm/ \
            opencode-ai
          # configure opencode auth
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json <<EOF
          {
            "deepseek": {
              "type": "api",
              "key": "${{ secrets.MAIN2MAIN_API_KEY }}"
            }
          }
          EOF

          # ensure opencode is on PATH within this step
          export PATH="$HOME/.opencode/bin:$PATH"

          # verify opencode works
          echo "Verifying opencode..."
          set +e
          opencode run --model "${MAIN2MAIN_MODEL}" "say hello and nothing else" > /tmp/opencode_verify.log 2>&1
          OCODE_EXIT=$?
          set -e
          cat /tmp/opencode_verify.log
          if [ "${OCODE_EXIT}" -ne 0 ]; then
            echo "::error::opencode verification failed (exit ${OCODE_EXIT})"
            exit 1
          fi
          echo "opencode verification passed"

          # ensure git push uses gh token
          git config --global credential.helper "!gh auth git-credential"

          # install main2main_flow; the pinned ref also re-applies on
          # self-hosted runners where /tmp persists between runs
          M2M_FLOW_DIR="/tmp/main2main_flow"
          FLOW_REF="${MAIN2MAIN_FLOW_REF:-main}"
          if [ ! -d "${M2M_FLOW_DIR}/.git" ]; then
            git clone --branch "${FLOW_REF}" \
              https://github.com/vllm-ascend/main2main_flow.git "${M2M_FLOW_DIR}"
          else
            git -C "${M2M_FLOW_DIR}" fetch origin "${FLOW_REF}"
            git -C "${M2M_FLOW_DIR}" checkout --detach FETCH_HEAD
          fi
          pip install -e "${M2M_FLOW_DIR}"

      - name: Create working branch
        id: branch
        working-directory: ${{ github.workspace }}
        env:
          # The ref identifies what to fetch; the SHA fixes the exact commit
          # used as the incremental-mode rebase base.
          UPSTREAM_FETCH_REF: ${{ needs.resolve-source.outputs.base_ref }}
          UPSTREAM_REBASE_SHA: ${{ needs.resolve-source.outputs.base_sha }}
          CHECKOUT_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_ref }}
        run: |
          set -eu
          BRANCH="main2main_auto_$(date +%Y-%m-%d_%H-%M)"
          UPSTREAM_BASE_SHA="${UPSTREAM_REBASE_SHA:-$CHECKOUT_SOURCE_SHA}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git checkout -B "$BRANCH"
          if [ -n "$UPSTREAM_REBASE_SHA" ]; then
            git fetch upstream "$UPSTREAM_FETCH_REF"
            git rebase "$UPSTREAM_REBASE_SHA"
          fi
          git cat-file -e "${UPSTREAM_BASE_SHA}^{commit}"
          # main2main_flow uses upstream/main as its squash baseline. Keep the
          # ref on the resolved snapshot instead of fetching a moving main.
          git update-ref refs/remotes/upstream/main "$UPSTREAM_BASE_SHA"
          BASE_SHA=$(git rev-parse HEAD)
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install vllm-project/vllm from source
        working-directory: vllm-upstream
        run: |
          VLLM_TARGET_DEVICE=empty uv pip install .
          pip uninstall -y triton

      # CPU-runner install: requirements-dev.txt plus an editable install of
      # the package itself with kernel compilation disabled (COMPILE_CUSTOM_
      # KERNELS=0 — the NPU runners own csrc builds via the main2main-e2e
      # workflow's prepare job).  Without the editable install the
      # vllm.platform_plugins entry point is absent and `import vllm` fails
      # device inference ("Failed to infer device type") — 162 UT failures
      # in run 32989253968.  The _build_info.py stub is generated first;
      # setup.py's develop regen overwrites it with identical content.
      #
      # uc-manager is excluded: it has no amd64 wheel and its sdist build
      # fetches vendor deps over git, which fails on this runner (run
      # 32985956048).  It is a device-side library — no CPU UT imports it.
      - name: Install vllm-ascend deps only (no csrc compile/install)
        working-directory: ${{ github.workspace }}
        env:
          SOC_VERSION: ascend910b1
        run: |
          # Keep the filtered copy in the repo root so the `-r
          # requirements-lint.txt` / `-r requirements.txt` includes inside
          # requirements-dev.txt still resolve relative to the checkout.
          grep -v '^uc-manager$' requirements-dev.txt > requirements-dev-nouc.txt
          uv pip install -r requirements-dev-nouc.txt
          rm -f requirements-dev-nouc.txt
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          # Reproduce setup.py's gen_build_info without installing the
          # package (hardware.py is stdlib-only by design for setup.py).
          spec = importlib.util.spec_from_file_location(
              "hardware", os.path.join(os.getcwd(), "vllm_ascend", "device", "hardware.py"))
          hardware = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(hardware)
          device_type = hardware.device_type_from_soc_version(os.environ["SOC_VERSION"]).name
          Path("vllm_ascend/_build_info.py").write_text(
              "# Auto-generated file\n"
              f"__device_type__ = '{device_type}'\n")
          PY
          COMPILE_CUSTOM_KERNELS=0 uv pip install --no-deps \
            --no-build-isolation -e .

      - name: Run main2main flow
        id: run-main2main
        working-directory: ${{ github.workspace }}
        env:
          RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES: True
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"
          eval "${MAIN2MAIN_LOG_HELPERS}"

          rm -rf /tmp/main2main
          mkdir -p /tmp/main2main

          cat > /tmp/main2main/heartbeat.sh <<'HEARTBEAT'
          trap "exit 0" TERM INT
          printf '\n::notice::main2main heartbeat %s\n' "$(date -Is)"
          while sleep 300; do
            printf '\n::notice::main2main heartbeat %s\n' "$(date -Is)"
          done
          HEARTBEAT
          setsid bash /tmp/main2main/heartbeat.sh &
          HEARTBEAT_PID="$!"
          cleanup_heartbeat() {
            if [ -n "${HEARTBEAT_PID:-}" ]; then
              kill -TERM -- "-${HEARTBEAT_PID}" 2>/dev/null || true
              wait "${HEARTBEAT_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup_heartbeat EXIT

          set +e
          kickoff \
            --vllm-path "$GITHUB_WORKSPACE/vllm-upstream" \
            --vllm-ascend-path "$GITHUB_WORKSPACE" \
            --target-commit "${TARGET_COMMIT}" \
            2> /tmp/main2main/kickoff.err \
            | tee /tmp/main2main/kickoff.log
          KICKOFF_STATUS="${PIPESTATUS[0]}"
          set -e
          cleanup_heartbeat
          trap - EXIT

          echo "::notice::after kickoff: $(date -Is)"
          echo "KICKOFF_STATUS=${KICKOFF_STATUS}"
          ls -la /tmp/main2main || true
          find /tmp/main2main -maxdepth 3 -type f -print || true

          print_group "main2main kickoff output" /tmp/main2main/kickoff.log
          print_group_if_nonempty "main2main kickoff stderr" /tmp/main2main/kickoff.err

          if [ "${KICKOFF_STATUS}" -ne 0 ]; then
            echo "::error::kickoff exited with status ${KICKOFF_STATUS}"
            exit "${KICKOFF_STATUS}"
          fi

          # Copy final summary from workspace
          FINAL_SUMMARY="${MAIN2MAIN_WORKSPACE}/final_summary.md"
          if [ -f "${FINAL_SUMMARY}" ]; then
            cp "${FINAL_SUMMARY}" /tmp/main2main/final-summary.md
          fi

          if [ -s /tmp/main2main/final-summary.md ]; then
            print_group "main2main final summary" /tmp/main2main/final-summary.md
          else
            echo "::warning::final-summary.md not found, generating stub"
            echo "Status: completed" > /tmp/main2main/final-summary.md
            echo "Steps: 0/0" >> /tmp/main2main/final-summary.md
          fi

      - name: Upload workspace
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: main2main-workspace
          path: /tmp/main2main_flow/workspace/
          retention-days: 7

      - name: Summarize final status
        id: final-status
        working-directory: ${{ github.workspace }}
        if: ${{ !cancelled() }}
        run: |
          set -eu
          eval "${MAIN2MAIN_LOG_HELPERS}"

          STATUS_JSON="${MAIN2MAIN_WORKSPACE}/final_status.json"
          BASE_SHA="${{ steps.branch.outputs.base_sha }}"

          # kickoff may exit 0 without writing final_status.json (e.g. flow short-circuits
          # on no new commits). Degrade gracefully instead of crashing on FileNotFoundError.
          if [ ! -f "${STATUS_JSON}" ]; then
            echo "::warning::final_status.json not found at ${STATUS_JSON}; kickoff produced no structured status"
            FINAL_STATUS="missing"
            OLD_COMMIT=""
            NEW_COMMIT=""
            REACHED_COMMIT=""
            STEPS_COMPLETED="0"
            STEPS_TOTAL="0"
          else
            OLD_COMMIT=$(python3 -c "import json; print(json.load(open('${STATUS_JSON}'))['old_commit'])")
            NEW_COMMIT=$(python3 -c "import json; print(json.load(open('${STATUS_JSON}'))['new_commit'])")
            FINAL_STATUS=$(python3 -c "import json; print(json.load(open('${STATUS_JSON}'))['status'])")
            REACHED_COMMIT=$(python3 -c "import json; print(json.load(open('${STATUS_JSON}'))['reached_commit'])")
            STEPS_COMPLETED=$(python3 -c "import json; print(json.load(open('${STATUS_JSON}'))['steps_completed'])")
            STEPS_TOTAL=$(python3 -c "import json; print(json.load(open('${STATUS_JSON}'))['steps_total'])")
          fi

          MANUAL_REVIEW_REQUIRED=false
          if [ "${FINAL_STATUS}" != "completed" ]; then
            MANUAL_REVIEW_REQUIRED=true
          fi

          # created-commits.md requires base_sha and a valid repo; guard earlier-step failures.
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify HEAD >/dev/null 2>&1; then
            git log --reverse --format="- \`%H\` %s" "${BASE_SHA}..HEAD" \
              > /tmp/main2main/created-commits.md || echo "(git log failed)" > /tmp/main2main/created-commits.md
            COMMIT_COUNT=$(git rev-list --count "${BASE_SHA}..HEAD" 2>/dev/null || echo 0)
          else
            echo "(base_sha unavailable or not a git repo)" > /tmp/main2main/created-commits.md
            COMMIT_COUNT=0
          fi

          {
            echo "status=${FINAL_STATUS}"
            echo "commit_count=${COMMIT_COUNT}"
            echo "steps_completed=${STEPS_COMPLETED}"
            echo "manual_review_required=${MANUAL_REVIEW_REQUIRED}"
            echo "old_commit=${OLD_COMMIT}"
            echo "new_commit=${NEW_COMMIT}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::final_status=${FINAL_STATUS}, reached_commit=${REACHED_COMMIT}, steps=${STEPS_COMPLETED}/${STEPS_TOTAL}, commit_count=${COMMIT_COUNT}"
          print_group_if_nonempty "main2main created commits" /tmp/main2main/created-commits.md

      - name: Create manual review issue
        if: steps.final-status.outputs.manual_review_required == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          eval "${MAIN2MAIN_LOG_HELPERS}"

          PR_URL=$(cat /tmp/main2main/pr_url.txt 2>/dev/null || echo "")
          OLD="${{ steps.final-status.outputs.old_commit }}"
          NEW="${{ steps.final-status.outputs.new_commit }}"
          SHORT_NEW=$(printf '%.8s' "${NEW}")

          cat > /tmp/main2main-manual-review.md <<EOF
          ## Summary

          main2main automation stopped before completing all planned steps.

          ## Context

          - Draft PR: ${PR_URL}
          - Commit range: \`${OLD}\`...\`${NEW}\`
          - Status: \`${{ steps.final-status.outputs.status }}\`

          ## Final Summary

          $(cat /tmp/main2main/final-summary.md 2>/dev/null || echo "(final summary unavailable)")
          EOF

          print_group "Manual review issue" /tmp/main2main-manual-review.md
          gh issue create \
            --repo "${UPSTREAM_REPO}" \
            --title "[main2main] main2main manual review required (${SHORT_NEW})" \
            --body-file /tmp/main2main-manual-review.md

      # Cancel the resident-runner run so the NPU runners are released
      # (pod reclaimed / runner freed for other CI).  The resident loop
      # also self-releases on main-run completion; cancelling here is the
      # prompt stop when the flow itself fails.  Placed before "Chain next
      # run": a chained run's fresh dispatch must not find this run's
      # residents still holding the runners.  Cancel is idempotent (409 on
      # an already-completed run is harmless).
      - name: Release E2E runners
        if: always()
        run: |
          if [ -n "${MAIN2MAIN_E2E_PREP_RUN_ID:-}" ]; then
            gh api -X POST "repos/${MAIN2MAIN_E2E_REPO}/actions/runs/${MAIN2MAIN_E2E_PREP_RUN_ID}/cancel" || true
            echo "Released E2E runners: cancelled resident-runner run ${MAIN2MAIN_E2E_PREP_RUN_ID}"
          fi

      - name: Chain next run
        if: steps.final-status.outputs.status == 'completed' && steps.final-status.outputs.steps_completed != '0'
        run: |
          echo "::notice::Chaining next main2main run..."
          gh workflow run Main2Main \
            --repo "${UPSTREAM_REPO}"
