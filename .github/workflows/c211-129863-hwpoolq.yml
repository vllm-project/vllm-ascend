          if [ -n "$UT" ]; then echo "UPGRADE_TOOL_PATH=$UT"; "$UT" --device_index -1 --system_info 2>&1 | head -150; echo "UPGRADE_RC=$?"; else echo "UPGRADE_TOOL_ABSENT"; fi
          echo "--- A5_SYSFS_DAVINCI ---"
          for d in /sys/class/davinci*; do
