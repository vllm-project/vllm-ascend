          done
          echo "--- A5_PCI_SERIAL ---"
          if command -v lspci >/dev/null 2>&1; then
            lspci -D -nn 2>/dev/null | grep -i '19e5' | head -20
            for bdf in $(lspci -D -nn 2>/dev/null | awk '/19e5/ {print $1}' | head -8); do
              echo "LSPCI_DEV $bdf"
              lspci -vvv -s "$bdf" 2>/dev/null | grep -iE 'Serial|Capabilities: \[[0-9a-f]+\] Device Serial|Kernel driver' | head -10
