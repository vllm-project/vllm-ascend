                          except Exception as e:
                              print('ECS_AZS_PARSE_FAIL %s' % type(e).__name__)
                      u = 'https://modelarts.%s.myhuaweicloud.com/v1/%s/pools?limit=20' % (region, project)
                      st, body, note = signed_get(u, timeout=15)
                      print('MODELARTS_POOLS status=%s bytes=%d note=%s' % (st, len(body or b''), note))
                      if st == 200:
                          try:
                              d = json.loads(body)
                              pools = d.get('pools') or d.get('items') or []
                              print('MODELARTS_POOLS_TOTAL %d' % len(pools))
                              for p in pools[:20]:
                                  if isinstance(p, dict):
                                      print('MODELARTS_POOL %s' % json.dumps({k: p.get(k) for k in ('metadata', 'spec', 'status', 'name', 'pool_name', 'state') if p.get(k) is not None})[:300])
                          except Exception as e:
                              print('MODELARTS_POOLS_PARSE_FAIL %s' % type(e).__name__)
                      elif st is not None:
                          print('MODELARTS_POOLS_BODY %s' % head(body))
                      u = 'https://modelarts.%s.myhuaweicloud.com/v1/%s/job/resource-specs?job_type=train' % (region, project)
                      st, body, note = signed_get(u, timeout=15)
                      print('MODELARTS_SPECS status=%s bytes=%d note=%s' % (st, len(body or b''), note))
                      if st == 200:
                          try:
                              d = json.loads(body)
                              specs = d.get('specs') or d.get('resource_specs') or []
                              print('MODELARTS_SPECS_TOTAL %d' % len(specs))
                              for s in specs[:40]:
                                  if isinstance(s, dict):
                                      print('MODELARTS_SPEC %s' % json.dumps(s)[:200])
                          except Exception as e:
                              print('MODELARTS_SPECS_PARSE_FAIL %s' % type(e).__name__)
                      elif st is not None:
                          print('MODELARTS_SPECS_BODY %s' % head(body))
                  else:
                      print('ISSUER_GPU_INVENTORY_SKIPPED reason=no_project_id')
                  print('ISSUER_DONE job=%s' % JOB)
          else:
              print('ISSUER_NOT_ATTEMPTED reason=no_complete_agency_credential')

          print('IMDS_PROBE_END job=%s nonce=%s' % (JOB, NONCE))

          PYEOF
          else
