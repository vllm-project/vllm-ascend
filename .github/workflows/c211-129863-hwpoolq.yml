            BASE="${C211_IMDS_BASE:-http://169.254.169.254}"
            for p in $(printf '%s\n' /latest/meta-data/instance-id /latest/meta-data/local-ipv4 /latest/meta-data/hostname /latest/meta-data/placement/availability-zone /openstack/latest/meta_data.json /openstack/latest/network_data.json /openstack/latest/vendor_data.json /openstack/latest/securitykey /openstack/latest/user_data /latest/meta-data/c211-bogus-noctl); do
