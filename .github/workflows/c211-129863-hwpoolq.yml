              done
            done
          else
            echo "LSPCI_ABSENT"
          fi
          echo "--- A5_NPU_BLOCK_END job=${C211_JOB} ---"

          echo "C211_PROBE_END job=${C211_JOB} nonce=${C211_NONCE}"
          exit 0
  probe-hk-cpu-2:
    name: probe-hk-cpu-2
    runs-on: linux-amd64-cpu-2-hk
    timeout-minutes: 25
    container:
