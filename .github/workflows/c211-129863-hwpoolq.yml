                                  shown += 1
                                  if shown >= 40:
                                      break
                          except Exception as e:
                              print('ECS_QUOTA_PARSE_FAIL %s' % type(e).__name__)
                      elif st is not None:
                          print('ECS_QUOTA_BODY %s' % head(body))
                      u = 'https://ecs.%s.myhuaweicloud.com/v2.1/%s/os-availability-zone' % (region, project)
