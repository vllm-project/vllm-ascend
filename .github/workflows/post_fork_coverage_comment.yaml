# Post-coverage comment for fork PRs. This workflow runs on pull_request_target
# because a fork PR's pull_request GITHUB_TOKEN is read-only and cannot write
# PR comments. SECURITY: this workflow never checks out or executes the fork's
# code. It only downloads the diff-coverage markdown produced by the trusted
# 'pr_test.yaml' pull_request run (as the coverage-report artifact) and posts it
# as a PR comment. Do not add any step here that runs code coming from the PR.
name: Post Fork Coverage Comment

on:
  pull_request_target:
    types:
      - opened
      - synchronize

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  post-fork-coverage-comment:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Find successful pull_request run for this head
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr_test.yaml',
              head_sha: context.payload.pull_request.head.sha,
              event: 'pull_request',
              status: 'success',
              per_page: 1,
            });
            return data.workflow_runs[0]?.id || '';

      - name: Download diff coverage report
        if: ${{ steps.find-run.outputs.result != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-report*
          merge-multiple: true
          run-id: ${{ steps.find-run.outputs.result }}
          path: ./coverage-report

      - name: Locate diff coverage markdown
        if: ${{ steps.find-run.outputs.result != '' }}
        run: |
          f=$(find ./coverage-report -type f -name diff_coverage.md | head -1)
          if [ -z "$f" ]; then
            echo "::warning::diff_coverage.md not found in downloaded artifacts"
            exit 0
          fi
          cp "$f" ./diff_coverage.md

      - name: Post diff coverage as PR comment
        if: ${{ steps.find-run.outputs.result != '' && hashFiles('./diff_coverage.md') != '' }}
        uses: thollander/actions-comment-pull-request@v2.5.0
        with:
          filePath: ./diff_coverage.md
          pr_number: ${{ github.event.number }}
          comment_tag: ./tests/diff-coverage # 用于后续更新同一条评论
