# Posts coverage-recommended tests as a PR comment.
# pull_request_target is required so GITHUB_TOKEN can write comments on fork
# PRs. The job only checks out the base SHA (not PR head) and runs scripts
# from that trusted ref.
name: Comment recommended tests

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment-recommended-tests:
    name: Comment recommended tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ready-all') }}
    runs-on: linux-amd64-cpu-8-hk
    steps:
      - name: Checkout base-branch scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false

      - name: Download test case map
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/test_case_map.json" \
            -o test_case_map.json
          test -s test_case_map.json

      - name: Download coverage package and extract covstub
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/coverage.tar" \
            -o coverage.tar
          test -s coverage.tar
          tar xf coverage.tar vllm-ascend/covstub
          test -d vllm-ascend/covstub

      - name: Recommend tests for current PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! python3 -c "import regex" >/dev/null 2>&1; then
            echo "regex not found for $(python3 -V); bootstrapping pip and installing regex"
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --break-system-packages
            python3 -m pip install --break-system-packages regex
          fi
          PR_SPEC="${{ github.repository }}#${{ github.event.pull_request.number }}"
          echo "Selecting tests for PR: ${PR_SPEC}"
          python3 .github/workflows/scripts/test_selector.py \
            --github-pr "${PR_SPEC}" \
            --source-dir ./vllm-ascend/covstub \
            --map-file test_case_map.json

      - name: Build recommended-tests comment
        id: comment-body
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILE="recommended_pytest_paths.txt"
          MARKER="<!-- coverage-recommended-tests -->"
          SHORT_SHA="${HEAD_SHA:0:12}"
          BODY_FILE="$(mktemp)"
          {
            echo "$MARKER"
            echo "## Coverage-based recommended tests"
            echo ""
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              COUNT=$(grep -cve '^[[:space:]]*$' "$FILE" || true)
              echo "Found **${COUNT}** recommended pytest path(s) for \`${SHORT_SHA}\`:"
              echo ""
              while IFS= read -r line || [ -n "$line" ]; do
                [ -z "${line// }" ] && continue
                echo "- \`${line}\`"
              done < "$FILE"
            else
              echo "No tests were recommended from coverage analysis for \`${SHORT_SHA}\`."
            fi
          } > "$BODY_FILE"
          python3 - "$BODY_FILE" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          body = path.read_text(encoding="utf-8")
          limit = 60000
          if len(body) > limit:
              body = body[:limit].rsplit("\n", 1)[0] + (
                  "\n\n... (truncated, too many recommended paths to list)\n"
              )
              path.write_text(body, encoding="utf-8")
          PY
          {
            echo "comment_body<<CMTEOF"
            cat "$BODY_FILE"
            echo "CMTEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing recommended-tests comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          token: ${{ github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: <!-- coverage-recommended-tests -->

      - name: Comment recommended tests on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: ${{ steps.comment-body.outputs.comment_body }}
          edit-mode: replace
          reactions: hooray
