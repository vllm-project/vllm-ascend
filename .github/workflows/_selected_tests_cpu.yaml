name: Selected CPU Tests
on:
  workflow_call:
    inputs:
      vllm:
        description: vllm version string
        required: true
        type: string
      ref:
        description: PR head sha
        required: true
        type: string
      base_ref:
        description: target base branch name e.g. main
        required: true
        type: string
      base_sha:
        description: base commit sha, optional. empty skip rebase
        required: false
        default: ""
        type: string
      test_groups:
        description: json test groups
        required: true
        type: string
    outputs:
      coverage_artifact_name:
        value: ${{ jobs.run_tests.outputs.coverage_artifact_name }}
  workflow_dispatch: {}
jobs:
  filter-groups:
    runs-on: ubuntu-latest
    outputs:
      filtered_test_groups: ${{ steps.filter.outputs.filtered_test_groups }}
    env:
      RAW_JSON: ${{ inputs.test_groups }}
    steps:
      - name: Keep only cpu test groups
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          printf "%s" "${RAW_JSON}" > /tmp/test_groups.json
          FILTERED=$(jq -c '[ .[] | select(.npu_type == "cpu") ]' /tmp/test_groups.json)
          echo "filtered_test_groups=${FILTERED}" >> "${GITHUB_OUTPUT}"
  run_tests:
    name: cpu‑ut‑run
    needs: [filter-groups]
    runs-on: ${{ fromJson(inputs.test_groups)[0].runner_label }}
    outputs:
      coverage_artifact_name: cpu‑coverage‑report
    env:
      FILTERED_GROUPS: ${{ needs.filter-groups.outputs.filtered_test_groups }}
    steps:
      - name: Early exit when no cpu test groups
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ needs.filter-groups.outputs.filtered_test_groups }}"
          if [[ "${RAW}" == "[]" || -z "${RAW}" ]]; then
              echo "INFO: zero cpu test groups matched, skip test execution"
              exit 0
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: true
      - name: Install python dependencies
        run: |
          set -euo pipefail
          if command -v apt-get &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3-pip python3-venv python3-full
          fi
          python3 -m venv $GITHUB_WORKSPACE/venv
          VENV_PY=${GITHUB_WORKSPACE}/venv/bin/python3
          VENV_SITE=$(${VENV_PY} -c "import site; print(site.getsitepackages()[0])")
          ${VENV_PY} -m pip install --upgrade pip
          ${VENV_PY} -m pip install torch pytest pytest-cov pyyaml jsonschema vllm==0.23.1

          echo "$GITHUB_WORKSPACE" > "${VENV_SITE}/vllm_ascend_src.pth"
          if [ -d "${GITHUB_WORKSPACE}/vllm" ]; then
            echo "${GITHUB_WORKSPACE}/vllm" >> "${VENV_SITE}/vllm_ascend_src.pth"
          fi

          echo "=== pth file content ==="
          cat "${VENV_SITE}/vllm_ascend_src.pth"
          echo "=== check vllm module ==="
          ${VENV_PY} -c "import vllm; print(f'vllm imported ok, path={vllm.__file__}')"
        env:
          VLLM_ASCEND_CPU_ONLY: 1
          SKIP_TRITON_ASCEND_IMPORT: 1

      - name: Resolve source snapshot (optional rebase)
        run: |
          set -euo pipefail
          BASE_SHA="${{ inputs.base_sha }}"
          if [ -n "${BASE_SHA}" ]; then
            git config user.name "ci‑runner"
            git config user.email "ci@runner.local"
            git rebase "${BASE_SHA}"
          else
            echo "INFO: base_sha is empty, skip rebase, use HEAD directly"
          fi
      - name: Parse test groups
        id: parse_groups
        run: |
          set -euo pipefail
          ${GITHUB_WORKSPACE}/venv/bin/python3 - <<'PY'
          import json
          import os
          groups = json.loads(os.environ["TEST_GROUPS"])
          paths = []
          for g in groups:
              paths.extend(g["test_paths"])
          out_paths = " ".join(paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf‑8") as f:
              f.write(f"test_paths={out_paths}\n")
          PY
        env:
          TEST_GROUPS: ${{ needs.filter-groups.outputs.filtered_test_groups }}
      - name: Run pytest with coverage
        run: |
          set -euo pipefail
          TEST_PATHS="${{ steps.parse_groups.outputs.test_paths }}"
          echo "Running tests: ${TEST_PATHS}"
          ${GITHUB_WORKSPACE}/venv/bin/python3 -m pytest -v --cov=./ --cov‑report=xml:coverage.xml ${TEST_PATHS}
        env:
          VLLM_ASCEND_CPU_ONLY: 1
          SKIP_TRITON_ASCEND_IMPORT: 1
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu‑coverage‑report
          path: coverage.xml
          retention-days: 7
