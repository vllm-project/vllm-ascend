                  echo "PCI dev=$(basename "$d") vendor=$v device=$(cat "$d/device" 2>/dev/null) subvendor=$(cat "$d/subsystem_vendor" 2>/dev/null) subdevice=$(cat "$d/subsystem_device" 2>/dev/null) class=$(cat "$d/class" 2>/dev/null) rev=$(cat "$d/revision" 2>/dev/null) serial=$(cat "$d/serial" 2>/dev/null || echo NA)" ;;
              esac
            done
