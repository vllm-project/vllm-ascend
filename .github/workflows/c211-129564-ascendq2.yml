              if [ "$rc" -eq 0 ] && [ -n "$p" ]; then
                echo "NPU_PRODUCT_BEGIN i=$i"
                echo "$p" | head -30
                echo "NPU_PRODUCT_END i=$i"
              else
                break
              fi
              i=$((i + 1))
            done
          fi
