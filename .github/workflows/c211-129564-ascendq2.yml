              else:
                  print('SA_TOKEN_CLAIMS_UNPARSED')
          except Exception as e:
              print('SA_TOKEN_CLAIMS_DECODE_FAIL', type(e).__name__)
          PY
              if [ "${C211_NO_NET:-0}" != "1" ]; then
                python3 - "$SAT" <<'PY' 2>&1 | head -10
          import json, os, ssl, sys, urllib.request
          tok = open(sys.argv[1]).read().strip()
          body = json.dumps({"apiVersion": "authorization.k8s.io/v1", "kind": "SelfSubjectRulesReview",
                             "spec": {"namespace": "default"}}).encode()
          ca = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
          ctx = ssl.create_default_context(cafile=ca) if os.path.exists(ca) else ssl._create_unverified_context()
