name: 'model downloader'

on:
  pull_request:
    paths:
      - '.github/workflows/misc/model_dataset_list.json'
      - '.github/workflows/labeled_download_model_dataset.yaml'
    types: [labeled, synchronize]

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ascend-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  download-models:
    if: contains(github.event.pull_request.labels.*.name, 'model-dataset-download')
    name: Download models from ModelScope
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: linux-aarch64-a2b3-0
            cluster: a2
          - runner: linux-aarch64-a3-800t-0
            cluster: a3
          # Accuracy E2E tests use the dedicated 560T runner. Populate its
          # cache as well; the 800T downloader does not run on this runner.
          - runner: linux-aarch64-a3-800i-2
            cluster: a3
          - runner: linux-aarch64-a5-0
            cluster: a5
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-cpu

    steps:
      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install git jq curl -y

      - name: Show Current Disk Usage
        run: |
          df -h /root/.cache | grep -v Filesystem | \
          awk '{print "Mount point: "$6, "Total: "$2, "Used: "$3, "Available: "$4, "Usage: "$5}'
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract new models and datasets from PR
        id: diff
        run: |
          set -euo pipefail

          git config --global --add safe.directory /__w/vllm-ascend/vllm-ascend
          JSON_PATH=".github/workflows/misc/model_dataset_list.json"

          git fetch origin main

          git show origin/main:$JSON_PATH > /tmp/models_main.json || \
            echo '{"models":{}, "datasets":[]}' > /tmp/models_main.json

          cp $JSON_PATH /tmp/models_pr.json

          # a3 and 310p share the same PVC (persistent volume claim).
          # 310p models are merged into a3's download list so they are
          # cached on the same volume the 310p tests use.
          jq -r --arg cluster "${{ matrix.cluster }}" '
            (if $cluster == "a3" then (.models["310p"] // []) else [] end) as $shared
            | ((.models[$cluster] // []) + $shared) as $pr
            | input
            | (if $cluster == "a3" then (.models["310p"] // []) else [] end) as $shared_main
            | ((.models[$cluster] // []) + $shared_main) as $main
            | ($pr - $main)[]
          ' /tmp/models_pr.json /tmp/models_main.json > /tmp/new_models.txt

          echo "New models:"
          cat /tmp/new_models.txt || true

          jq -r '
            (.datasets // []) as $pr
            | input
            | (.datasets // []) as $main
            | ($pr - $main)[]
          ' /tmp/models_pr.json /tmp/models_main.json > /tmp/new_datasets.txt

          echo "New datasets:"
          cat /tmp/new_datasets.txt || true

      # Downloads are delegated to ascend-gha-runners/sync-tools model-library
      # pipeline (repository_dispatch API): it routes runner_label to the right
      # cluster disks, downloads on dedicated sync machines / in-cluster O-card
      # runners (idempotent, serialized, xet-disabled, ledger-recorded).
      # This job no longer occupies NPU runners' bandwidth or runtime.
      - name: Delegate download to sync-tools API
        env:
          MODEL_SYNC_PAT: ${{ secrets.MODEL_SYNC_PAT }}
        run: |
          set -euo pipefail
          [ -n "${MODEL_SYNC_PAT:-}" ] || {
            echo "::error::MODEL_SYNC_PAT secret is empty: secrets are not exposed to fork PRs. Push this branch to vllm-project/vllm-ascend and re-open the PR (list changes always need maintainer review anyway)."; exit 1; }
          rid="${GITHUB_RUN_ID}-${{ strategy.job-index }}"
          echo "request_id=$rid" >> "$GITHUB_ENV"
          to_models()   { jq -R -c 'select(length>0) | split("/") | {platform:"modelscope",organization:.[0],model_name:(.[1:] | join("/"))}'; }
          to_datasets() { jq -R -c 'select(length>0) | split("/") | {platform:"modelscope",organization:.[0],dataset_name:(.[1:] | join("/"))}'; }
          m=""
          d=""
          if [ -s /tmp/new_models.txt ];   then m=$(to_models   < /tmp/new_models.txt);   fi
          if [ -s /tmp/new_datasets.txt ]; then d=$(to_datasets < /tmp/new_datasets.txt); fi
          if [ -z "${m}${d}" ]; then echo "no new items; nothing to request"; echo "SKIP_WAIT=1" >> "$GITHUB_ENV"; exit 0; fi
          payload=$(jq -n --arg rid "$rid" --arg lbl "${{ matrix.runner }}" \
            --argjson m "[${m//$'\n'/,}]" --argjson d "[${d//$'\n'/,}]" \
            '{event_type:"model-download-request", client_payload:{
               repo:"vllm-project/vllm-ascend", runner_label:$lbl, request_id:$rid,
               models:$m, datasets:$d}}')
          curl -sf -X POST -H "Authorization: Bearer $MODEL_SYNC_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ascend-gha-runners/sync-tools/dispatches \
            --data "$payload"
          echo "Requested sync-tools to route & download $(echo "$payload" | jq '.client_payload.models | length') models / $(echo "$payload" | jq '.client_payload.datasets | length') datasets."

      - name: Wait for sync-tools download to land
        if: env.SKIP_WAIT != '1'
        env:
          MODEL_SYNC_PAT: ${{ secrets.MODEL_SYNC_PAT }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/ascend-gha-runners/sync-tools
          auth=(-H "Authorization: Bearer $MODEL_SYNC_PAT" -H "Accept: application/vnd.github+json")
          deadline=$(( $(date +%s) + 10800 ))
          runid=""
          while :; do
            if [ -z "$runid" ]; then
              for r in $(curl -s "${auth[@]}" "$api/actions/runs?event=repository_dispatch&per_page=15" | jq -r '.workflow_runs[].id'); do
                if curl -s "${auth[@]}" "$api/actions/runs/$r/jobs" \
                     | jq -e --arg rid "$request_id" '[.jobs[].name | select(test(" <- api#" + $rid + "$"))] | length > 0' >/dev/null 2>&1; then
                  runid=$r; echo "matched sync-tools run $runid"; break
                fi
              done
            else
              st=$(curl -s "${auth[@]}" "$api/actions/runs/$runid" | jq -r '.status + ":" + (.conclusion // "")')
              case "$st" in
                completed:success) echo "All requested models/datasets landed on the routed cluster disks."; break ;;
                completed:*) echo "::error::sync-tools run $runid ended $st (check its log or open an issue in ascend-gha-runners/sync-tools)"; exit 1 ;;
              esac
            fi
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::timed out (3h) waiting sync-tools request $rid"; exit 1; }
            sleep 60
          done

      - name: Summary
        run: |
          echo "Downloaded models:"
          cat /tmp/new_models.txt || echo "No new models"
          echo "Downloaded datasets:"
          cat /tmp/new_datasets.txt || echo "No new datasets"
