name: Merge Conflict Labeler
on:
  push:
  pull_request_target:
    types: [synchronize]

concurrency:
  # PR-side debounce: a burst of synchronize events on the same PR (e.g. a
  # mass rebase) collapses into one run, only the newest checks the label.
  # The push event keeps its own group per branch on purpose - every main
  # push must re-check all PRs against the new base and must not cancel
  # unrelated in-flight checks on other branches.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: linux-amd64-cpu-2-hk
    steps:
      - name: check if prs are dirty
        uses: eps1lon/actions-label-merge-conflict@v3
        continue-on-error: true
        with:
          dirtyLabel: "merge-conflicts"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          retryAfter: 10
          retryMax: 3
          commentOnDirty: "This pull request has conflicts, please resolve those before we can evaluate the pull request."
