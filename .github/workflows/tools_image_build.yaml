name: Image Build Tools

on:
  pull_request:
    paths:
      - '.github/workflows/dockerfiles/dockerfile.tools'
      - '.github/workflows/tools_image_build.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dockerfiles/dockerfile.tools'
      - '.github/workflows/tools_image_build.yaml'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        type: string
        required: true
        default: lite-tools

permissions:
  contents: read

concurrency:
  group: tools-image-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: quay.io/atlas-ci/vllm-ascend-ci
  IMAGE_TAG: ${{ inputs.tag || 'lite-tools' }}

jobs:
  build:
    name: Build tools (amd64, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate image tag
        shell: bash
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || {
            echo '::error::Invalid image tag: use 1-128 letters, digits, underscores, periods or hyphens; start with a letter, digit or underscore.'
            exit 1
          }

      - name: Log in to Quay
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ASCEND_CI_USERNAME }}
          password: ${{ secrets.QUAY_ASCEND_CI_PASSWORD }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/dockerfiles/dockerfile.tools
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          provenance: false
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
