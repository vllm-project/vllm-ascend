# This file is a part of the vllm-ascend project.
#
# One round of the main2main external E2E on the three NPU runners
# (A2/A3/310P).  Merged prep + exec into a single workflow:
#
# - round=prep (dispatched by the flow at start): only the prepare-<chip>
#   jobs run.  They build the persistent environment (vllm +
#   vllm-ascend editable install + csrc cache restore/compile + deps)
#   under $GITHUB_WORKSPACE and write the .ready freshness marker, so the
#   first E2E round does not wait for setup.  Re-dispatching with
#   unchanged inputs is an idempotent no-op (marker match skips the build).
# - round=N (exec): prepare-<chip> re-runs as a fast no-op (marker match),
#   then the e2e-<chip> jobs (needs: prepare) check out the signal branch
#   (accumulated patch + test_groups.json), filter groups by chip, and run
#   the selected tests with main2main_flow's run_tests.py local mode
#   (--test-cases 'path@N' card overrides, --skip-setup — the signal
#   branch + editable install are already in place).  run_tests.py uses
#   the same classification pipeline as local runs, so fix-mode output
#   stays byte-identical.
# - Artifacts: main2main-e2e-round-<N>-<chip> with round-<N>-result.json +
#   per-test logs/summaries + expected_tests.json; the flow re-parses
#   them with parse_exec_artifacts (e2e_dispatch.py).
name: main2main E2E

# run-name identifies the main run (Main2Main-E2E-<main_run_id>): the
# prepared env belongs to one main run (one fixed vllm commit), and every
# prep/exec round of that run shares the name.  The runs API does not
# expose workflow_dispatch inputs, so the hold guards match exec rounds of
# this main run by this exact name; the vllm commit hash is deliberately
# NOT in the run title (it changes every main2main run).
run-name: Main2Main-E2E-${{ inputs.main_run_id || '-' }}

on:
  workflow_dispatch:
    inputs:
      vllm:
        type: string
        required: true
        description: 'The vllm commit hash or tag to test (TARGET_COMMIT).'
      base_ref:
        type: string
        required: false
        default: 'main'
        description: 'The vllm-ascend base ref (for csrc diff + env marker).'
      round:
        type: string
        required: false
        default: '1'
        description: "'prep' pre-starts the runner envs (prepare jobs only); a number runs that E2E round."
      signal_branch:
        type: string
        required: false
        default: 'main2main_e2e'
        description: 'Fork branch carrying the accumulated patch + test_groups.json.'
      signal_repo:
        type: string
        required: false
        default: ''
        description: 'Fork repo carrying the signal branch (the adapted code); empty = this repo.'
      timeout_minutes:
        type: number
        required: false
        default: 480
        description: 'Job timeout in minutes for the e2e jobs.'
      image_tag_a3:
        type: string
        required: false
        default: '9.1.0-a3-ubuntu22.04-py3.12'
        description: 'CANN image tag for the A3 (800i) runner container.'
      flow_ref:
        type: string
        required: false
        default: 'main'
        description: 'main2main_flow ref providing run_tests.py (installed in the e2e job).'
      main_run_id:
        type: string
        required: false
        default: ''
        description: 'run id of the dispatching main run; identifies the three prepare jobs and the hold guard.'
      main_run_repo:
        type: string
        required: false
        default: ''
        description: 'repo of the dispatching main run (for the hold guard stop probe; empty = this repo).'
      hold_minutes:
        type: number
        required: false
        default: 1440
        description: 'Max minutes the prep run holds the three runners (guard until main run ends).'

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    # The main_run_id suffix is the unique per-main-run identifier the
    # pre-start step matches on when waiting for all three runners.
    name: prepare-${{ matrix.chip }}-${{ inputs.main_run_id }}
    # round=prep runs the hold guard (prepare ends only on exec dispatch /
    # main-run stop / timeout), so the timeout follows hold_minutes then.
    timeout-minutes: ${{ inputs.round == 'prep' && fromJSON(inputs.hold_minutes) || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: a2
            runner: linux-aarch64-a2-1
            image_tag: 9.1.0-910b-ubuntu22.04-py3.12
            max_jobs: '184'
          - chip: 310p
            runner: linux-aarch64-310p-1
            image_tag: 9.1.0-310p-ubuntu22.04-py3.12
            max_jobs: '92'
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.image_tag }}
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HF_HUB_OFFLINE: 1
        MAX_JOBS: 4
        UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
        UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/"
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
        UV_HTTP_TIMEOUT: 120
        UV_NO_CACHE: 1
        UV_SYSTEM_PYTHON: 1
    steps:
      - name: Check NPU availability
        run: |
          npu-smi info

      - name: Check env freshness
        id: env-check
        run: |
          marker="$GITHUB_WORKSPACE/.ready"
          fresh=false
          if [ -f "$marker" ] \
            && grep -qx "vllm=${{ inputs.vllm }}" "$marker" \
            && grep -qx "base_ref=${{ inputs.base_ref }}" "$marker" \
            && grep -qx "image_tag=${{ matrix.image_tag }}" "$marker" \
            && [ -x "$GITHUB_WORKSPACE/.venv/bin/activate" ] \
            && [ -d "$GITHUB_WORKSPACE/vllm-empty/.git" ] \
            && [ -d "$GITHUB_WORKSPACE/.git" ]; then
            fresh=true
            echo "Reusing prepared env at $GITHUB_WORKSPACE (marker match)"
          else
            echo "Env missing or stale (vllm/base_ref/image_tag changed) - rebuilding"
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: Install system deps
        if: steps.env-check.outputs.fresh != 'true'
        run: |
          set -euxo pipefail
          # The ascend checkout below resets the workspace repo; wipe the
          # parts checkout never touches (venv + vllm checkout + marker).
          rm -rf "$GITHUB_WORKSPACE/vllm-empty" \
                 "$GITHUB_WORKSPACE/.venv" \
                 "$GITHUB_WORKSPACE/.ready" \
                 "$GITHUB_WORKSPACE"/main2main-e2e-round-*
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          apt-get update -y
          apt-get install -y python3-pip git vim wget net-tools gcc g++ cmake libnuma-dev curl gnupg2 zstd
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install uv

      # Checkout the ascend repo FIRST: actions/checkout deletes the
      # workspace contents when it finds no .git, so anything created before
      # this checkout (the .venv) would be wiped.  Pre-creating the repo with
      # git init was tried instead, but the k8s container implementation
      # drops the freshly created .git within the step (git config right
      # after git init: "fatal: not in a git directory") — the
      # checkout-created .git is reliable.
      - name: Checkout vllm-project/vllm-ascend repo
        if: steps.env-check.outputs.fresh != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          submodules: recursive
          # Keep untracked leftovers (main2main_flow, results dirs) across
          # rebuilds; tracked files are still reset to base_ref.
          clean: false

      - name: Checkout vllm-project/vllm repo
        if: steps.env-check.outputs.fresh != 'true'
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm
          ref: ${{ inputs.vllm }}
          path: ./vllm-empty

      - name: Create workspace venv
        if: steps.env-check.outputs.fresh != 'true'
        run: |
          set -euxo pipefail
          # --system-site-packages: the CANN container's system python holds
          # torch/torch_npu; the venv only layers the project deps on top.
          # Built after both checkouts so nothing can wipe it.
          uv venv --system-site-packages "$GITHUB_WORKSPACE/.venv" \
            || python3 -m venv --system-site-packages "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade uv || true

      - name: Install vllm-project/vllm from source
        if: steps.env-check.outputs.fresh != 'true'
        working-directory: ./vllm-empty
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          VLLM_TARGET_DEVICE=empty uv pip install .
          pip uninstall -y triton

      - name: Get csrc hash
        id: get_csrc_hash
        if: steps.env-check.outputs.fresh != 'true'
        run: |
          # Fail closed so a git error cannot be converted into sha256(empty)
          # and then appear to be a legitimate cache miss.
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          # Match the cache producer's tracked csrc build inputs exactly.
          CSRC_MANIFEST=$(git ls-files -s -- csrc setup.py CMakeLists.txt cmake)
          if [ -z "$CSRC_MANIFEST" ]; then
            echo "::error::No tracked csrc inputs found."
            exit 1
          fi

          CSRC_HASH=$(printf '%s\n' "$CSRC_MANIFEST" | sha256sum | awk '{print $1}')
          echo "CSRC_HASH=$CSRC_HASH" >> "$GITHUB_OUTPUT"

      - name: Get architecture
        id: get_arch
        if: steps.env-check.outputs.fresh != 'true'
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) echo "arch=X64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "arch=ARM64" >> "$GITHUB_OUTPUT" ;;
            *) echo "arch=$ARCH" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore vllm-ascend csrc cache
        id: cache-csrc
        if: steps.env-check.outputs.fresh != 'true'
        uses: runs-on/cache/restore@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ steps.get_arch.outputs.arch }}-${{ matrix.image_tag }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}
          # Same tolerance as PR CI: a miss compiles on the NPU runner once,
          # after which the artifacts persist in the workspace.
          fail-on-cache-miss: false

      - name: Install Mooncake wheel
        if: steps.env-check.outputs.fresh != 'true'
        run: |
          set -euxo pipefail

          apt-get install -y --no-install-recommends \
            libibverbs1 \
            ibverbs-providers \
            librdmacm1 \
            libnuma1
          ldconfig

          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip install --no-cache-dir --no-deps \
            -i https://mirrors.aliyun.com/pypi/simple/ \
            mooncake-transfer-engine-npu==0.3.11.post1

          pip show mooncake-transfer-engine-npu || true

      - name: Install vllm-project/vllm-ascend with device
        if: steps.env-check.outputs.fresh != 'true'
        env:
          CSRC_CACHE_HIT: ${{ steps.cache-csrc.outputs.cache-hit }}
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          # Same as vllm-ascend CI (_e2e_nightly_single_node.yaml "Set
          # MAX_JOBS based on runner"): MAX_JOBS = cards x 23.  The CPU
          # cache-builder parallelism (matrix.max_jobs=184) OOM-killed all
          # 54 opc compiles on the a2 runner; a2-1/310p-1 give 23.
          CARDS=$(echo "${{ matrix.runner }}" | grep -oE '[0-9]+$')
          export MAX_JOBS=$((CARDS * 23))
          pip install uc-manager
          uv pip install -r requirements-dev.txt
          uv pip install --force-reinstall --no-deps triton-ascend==3.2.2
          # Preserve CI availability during the transition by compiling on the
          # NPU only when the new CPU-produced cache is unavailable.
          if [ "$CSRC_CACHE_HIT" = "true" ]; then
            echo "csrc cache hit: skip kernel compilation"
            COMPILE_CUSTOM_KERNELS=0 uv pip install -e .
          else
            echo "csrc cache miss: compile kernels on the NPU runner"
            uv pip install -e . --no-build-isolation
          fi

      - name: Save vllm-ascend csrc cache
        # Same as vllm-ascend CI's cache pipeline: restore -> (miss) build
        # -> save, so the next run with the same csrc state hits instead of
        # recompiling on the NPU runner.  Save only what we compiled here
        # (a restored cache must not be re-uploaded).
        if: ${{ steps.env-check.outputs.fresh != 'true' && steps.cache-csrc.outputs.cache-hit != 'true' }}
        uses: runs-on/cache/save@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v2-${{ steps.get_arch.outputs.arch }}-${{ matrix.image_tag }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

      - name: Verify required AscendC custom ops are registered (310p)
        if: ${{ steps.env-check.outputs.fresh != 'true' && matrix.image_tag == '9.1.0-310p-ubuntu22.04-py3.12' }}
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          python - <<'PY'
          import sys, torch
          import vllm_ascend.vllm_ascend_C  # noqa: F401
          ops = torch.ops._C_ascend
          missing = [n for n in ("chunk_gated_delta_rule_fwd_h", "chunk_fwd_o") if not hasattr(ops, n)]
          if missing:
              print(f"::error::Missing AscendC ops after install: {missing}. "
                      f"Cache contents are stale or build skipped registration.", file=sys.stderr)
              sys.exit(1)
          print("AscendC chunk-gdr ops registered:",
                [n for n in ("chunk_gated_delta_rule_fwd_h", "chunk_fwd_o") if hasattr(ops, n)])
          PY

      - name: Uninstall Triton for 310P tests
        if: ${{ steps.env-check.outputs.fresh != 'true' && matrix.image_tag == '9.1.0-310p-ubuntu22.04-py3.12' }}
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip uninstall -y triton-ascend triton

      - name: Write freshness marker
        if: steps.env-check.outputs.fresh != 'true'
        run: |
          cat > "$GITHUB_WORKSPACE/.ready" <<EOF
          vllm=${{ inputs.vllm }}
          base_ref=${{ inputs.base_ref }}
          image_tag=${{ matrix.image_tag }}
          ready=true
          EOF
          echo "Prepared main2main E2E env:"
          cat "$GITHUB_WORKSPACE/.ready"

      - name: Report
        run: |
          if [ "${{ steps.env-check.outputs.fresh }}" = "true" ]; then
            echo "main2main E2E env already prepared and fresh - no-op"
          else
            echo "main2main E2E env prepared"
            ls -la "$GITHUB_WORKSPACE/.ready"
          fi

      # Prep-round guard: keep this runner occupied (pod not reclaimed by
      # ARC) until the main run dispatches its E2E exec round, the main run
      # itself ends, or the hold budget is exhausted.  The env built above
      # is otherwise lost — the machine gets released and the exec round
      # must re-queue for NPU resources.  Releases on:
      #   a) an exec run dispatched by our main run (run-name segment match)
      #   b) the main run reaching completed (incl. cancelled) — fallback
      #      when the main run is manually cancelled and never dispatches
      #   c) inputs.hold_minutes elapsed
      - name: Hold runner (prep guard)
        if: ${{ inputs.round == 'prep' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          def gh_get(url):
              token = os.environ.get("GH_TOKEN") or \
                  os.environ.get("GITHUB_TOKEN", "")
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          repo = os.environ["GITHUB_REPOSITORY"]
          self_id = int(os.environ["GITHUB_RUN_ID"])
          main_run_id = "${{ inputs.main_run_id }}"
          main_run_repo = "${{ inputs.main_run_repo }}" or repo
          deadline = time.time() + int("${{ inputs.hold_minutes }}") * 60
          warn_404 = False
          while time.time() < deadline:
              if main_run_id:
                  # a) the next exec round of this main run.  Run ids are
                  # globally monotonic, so id > self_id rejects runs created
                  # before this one; the name Main2Main-E2E-<main_run_id>
                  # is shared by every round of this main run (created_at
                  # is second-truncated and unsafe for same-second runs).
                  try:
                      runs = gh_get(
                          f"https://api.github.com/repos/{repo}/actions/runs"
                          "?event=workflow_dispatch&branch=main&per_page=50") \
                          .get("workflow_runs", [])
                      want_name = f"Main2Main-E2E-{main_run_id}"
                      for r in runs:
                          if (r.get("name") or "") == want_name \
                                  and int(r["id"]) > self_id:
                              print(f"[hold] exec run {r['id']} dispatched "
                                    f"by main run {main_run_id} — releasing "
                                    "runner")
                              sys.exit(0)
                  except Exception as exc:
                      print(f"[hold] exec probe failed: {exc}",
                            file=sys.stderr)
                  # b) main run reached a terminal state (stop fallback).
                  try:
                      r = gh_get(f"https://api.github.com/repos/"
                                 f"{main_run_repo}/actions/runs/"
                                 f"{main_run_id}")
                      if r.get("status") == "completed":
                          print(f"[hold] main run {main_run_id} completed "
                                f"({r.get('conclusion')}) — releasing "
                                "runner")
                          sys.exit(0)
                  except Exception as exc:
                      if "404" in str(exc):
                          if not warn_404:
                              print("[hold] cannot read main run "
                                    f"{main_run_id} (cross-repo 404?) — "
                                    "relying on exec probe + timeout",
                                    file=sys.stderr)
                              warn_404 = True
                      else:
                          print(f"[hold] main-run probe failed: {exc}",
                                file=sys.stderr)
              time.sleep(30)
          print(f"[hold] hold budget "
                f"{int('${{ inputs.hold_minutes }}') * 60}s exhausted — "
                "releasing runner")
          sys.exit(0)
          PY

  e2e:
    name: e2e-${{ matrix.chip }}
    if: ${{ inputs.round != 'prep' }}
    needs: prepare
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: a2
            runner: linux-aarch64-a2-1
            image_tag: 9.1.0-910b-ubuntu22.04-py3.12
            max_jobs: '184'
            # Dual-die package: dies 0-1, 2-3, ... must be used as whole
            # pairs — run_tests.py enforces pair-aligned device assignment.
            pair_aligned: 'true'
          - chip: 310p
            runner: linux-aarch64-310p-1
            image_tag: 9.1.0-310p-ubuntu22.04-py3.12
            max_jobs: '92'
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.image_tag }}
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HF_HUB_OFFLINE: 1
        MAX_JOBS: 4
        UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
        UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/"
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
        UV_HTTP_TIMEOUT: 120
        UV_NO_CACHE: 1
        UV_SYSTEM_PYTHON: 1
    steps:
      - name: Check NPU availability
        run: |
          npu-smi info

      - name: Verify prepared env
        run: |
          marker="$GITHUB_WORKSPACE/.ready"
          if [ -f "$marker" ] \
            && grep -qx "vllm=${{ inputs.vllm }}" "$marker" \
            && grep -qx "base_ref=${{ inputs.base_ref }}" "$marker" \
            && grep -qx "image_tag=${{ matrix.image_tag }}" "$marker" \
            && [ -x "$GITHUB_WORKSPACE/.venv/bin/activate" ] \
            && [ -d "$GITHUB_WORKSPACE/vllm-empty/.git" ]; then
            echo "Prepared env verified at $GITHUB_WORKSPACE"
          else
            echo "::error::prepared env missing or stale for vllm=${{ inputs.vllm }} / base_ref=${{ inputs.base_ref }} / image_tag=${{ matrix.image_tag }}. The prepare job should have built it — marker mismatch, or the runner workspace was reset."
            exit 1
          fi

      - name: Checkout signal branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # The signal branch (adapted code) lives on the PR fork
          # (signal_repo) — GITHUB_TOKEN is scoped to this repo, so use
          # the PAT (GH_TOKEN) for the cross-repo fetch.  Always fetch
          # with an explicit token URL (the prep checkout's stored
          # credential is dead).
          SIGNAL_REPO="${{ inputs.signal_repo || github.repository }}"
          TOKEN="${GH_TOKEN:-${GITHUB_TOKEN}}"
          git fetch --force --no-tags \
            "https://x-access-token:${TOKEN}@github.com/${SIGNAL_REPO}" \
            "${{ inputs.signal_branch }}"
          git checkout --force --detach FETCH_HEAD
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "--- signal HEAD ---"
          git log -1 --oneline
          ls -la test_groups.json

      - name: Rebuild kernels if csrc inputs changed
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Refresh the local base_ref ref (prep-time origin/main may predate
          # the accumulated patch; diff against the base the patch built on).
          # The signal branch comes from signal_repo, so refresh base there too.
          SIGNAL_REPO="${{ inputs.signal_repo || github.repository }}"
          TOKEN="${GH_TOKEN:-${GITHUB_TOKEN}}"
          git fetch --force --no-tags \
            "https://x-access-token:${TOKEN}@github.com/${SIGNAL_REPO}" \
            "${{ inputs.base_ref }}"
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- csrc setup.py CMakeLists.txt cmake)
          if [ -n "$CHANGED" ]; then
            echo "csrc inputs changed vs ${{ inputs.base_ref }} ($BASE_SHA):"
            echo "$CHANGED"
            echo "Rebuilding kernels (one-time per csrc change)"
            source "$GITHUB_WORKSPACE/.venv/bin/activate"
            # CI formula: MAX_JOBS = cards x 23 (see prepare job).
            CARDS=$(echo "${{ matrix.runner }}" | grep -oE '[0-9]+$')
            export MAX_JOBS=$((CARDS * 23))
            uv pip install -e . --no-build-isolation
          else
            echo "csrc unchanged - reusing built kernels"
          fi

      - name: Sync main2main_flow (run_tests.py source)
        run: |
          set -euxo pipefail
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          FLOW_DIR="$GITHUB_WORKSPACE/main2main_flow"
          if [ ! -d "$FLOW_DIR/.git" ]; then
            git clone --branch "${{ inputs.flow_ref }}" \
              https://github.com/vllm-ascend/main2main_flow.git "$FLOW_DIR"
          else
            git -C "$FLOW_DIR" fetch origin "${{ inputs.flow_ref }}"
            git -C "$FLOW_DIR" checkout --detach FETCH_HEAD
          fi
          pip install -e "$FLOW_DIR"

      - name: Prepare results dir and filter test groups
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          RESULTS_DIR="$GITHUB_WORKSPACE/main2main-e2e-results"
          rm -rf "$RESULTS_DIR"
          mkdir -p "$RESULTS_DIR/0/tests"
          echo "RESULTS_DIR=$RESULTS_DIR" >> "$GITHUB_ENV"
          python3 - "${{ matrix.chip }}" "$RESULTS_DIR" <<'PY'
          import json, os, sys
          chip, results_dir = sys.argv[1], sys.argv[2]
          groups = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "test_groups.json")))
          mine = [g for g in groups if g.get("npu_type") == chip]
          tests_dir = os.path.join(results_dir, "0", "tests")
          expected = []
          cases = []
          for g in mine:
              cards = int(g.get("num_npus", 1))
              for t in g.get("tests", "").split():
                  expected.append({"test": t, "cards_required": cards})
                  cases.append(f"{t}@{cards}")
          json.dump(expected, open(f"{tests_dir}/expected_tests.json", "w"), indent=2)
          open(os.path.join(results_dir, "test_cases.txt"), "w").write("\n".join(cases))
          print(f"chip={chip} groups={len(mine)} tests={len(cases)}")
          PY

      - name: Run E2E tests
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          . /usr/local/Ascend/ascend-toolkit/set_env.sh
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          SIGNAL_SHA=$(git rev-parse HEAD)
          CASES=()
          while IFS= read -r t; do
          [ -n "$t" ] && CASES+=("$t")
          done < "$RESULTS_DIR/test_cases.txt"
          if [ ${#CASES[@]} -eq 0 ]; then
          echo "no test groups for this chip - writing empty result"
          python3 - "${{ inputs.round }}" "$RESULTS_DIR" <<'PY'
          import json, os, sys
          round_slug, results_dir = sys.argv[1], sys.argv[2]
          out = {"can_commit": True, "ci_result": "passed", "suite_results": {},
                 "rounds": [{"round": int(round_slug), "tests": [], "cards_used": 0,
                             "total_cards": 0, "elapsed_s": 0.0}], "elapsed_s": 0.0}
          json.dump(out, open(f"{results_dir}/0/tests/"
                              f"round-{round_slug}-result.json", "w"), indent=2)
          PY
          exit 0
          fi
          EXTRA_ARGS=()
          if [ "${{ matrix.pair_aligned }}" = "true" ]; then
            EXTRA_ARGS+=(--pair-aligned-devices)
            echo "Dual-die A3: enforcing pair-aligned device assignment"
          fi
          python3 "$GITHUB_WORKSPACE/main2main_flow/main2main_flow/scripts/utils/run_tests.py" \
            --vllm-path "$GITHUB_WORKSPACE/vllm-empty" \
            --vllm-commit "${{ inputs.vllm }}" \
            --ascend-path "$GITHUB_WORKSPACE" \
            --ascend-commit "${SIGNAL_SHA}" \
            --step-id 0 \
            --round "${{ inputs.round }}" \
            --skip-setup \
            --log-dir "$RESULTS_DIR" \
            "${EXTRA_ARGS[@]}" \
            --test-cases "${CASES[@]}"

      - name: Upload E2E results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: main2main-e2e-round-${{ inputs.round }}-${{ matrix.chip }}
          path: ${{ github.workspace }}/main2main-e2e-results/0/tests/*
          if-no-files-found: ignore
          retention-days: 14

      # Exec-round guard: keep the runner occupied between rounds.  The
      # process is multi-step — the main run chains round 1, 2, ... — so
      # the machines must stay held beyond this round, not just until the
      # first exec dispatch (the prep guard hands off here).  Releases on:
      #   a) the NEXT exec run dispatched by our main run (run-name match)
      #   b) the main run reaching completed (incl. cancelled) — fallback
      #   c) inputs.hold_minutes elapsed
      # The main flow waits for this round's results (uploaded above) via
      # the jobs API instead of the run completing, so the chain never
      # deadlocks: it parses the results, then dispatches the next round,
      # which releases this guard.
      - name: Hold runner (exec guard)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          def gh_get(url):
              token = os.environ.get("GH_TOKEN") or \
                  os.environ.get("GITHUB_TOKEN", "")
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          repo = os.environ["GITHUB_REPOSITORY"]
          self_id = int(os.environ["GITHUB_RUN_ID"])
          main_run_id = "${{ inputs.main_run_id }}"
          main_run_repo = "${{ inputs.main_run_repo }}" or repo
          deadline = time.time() + int("${{ inputs.hold_minutes }}") * 60
          warn_404 = False
          while time.time() < deadline:
              if main_run_id:
                  # a) the next exec round of this main run (run-name
                  # Main2Main-E2E-<main_run_id>, id > self_id).
                  try:
                      runs = gh_get(
                          f"https://api.github.com/repos/{repo}/actions/runs"
                          "?event=workflow_dispatch&branch=main&per_page=50") \
                          .get("workflow_runs", [])
                      want_name = f"Main2Main-E2E-{main_run_id}"
                      for r in runs:
                          if (r.get("name") or "") == want_name \
                                  and int(r["id"]) > self_id:
                              print(f"[hold] next exec run {r['id']} "
                                    f"dispatched by main run {main_run_id} — "
                                    "releasing runner for the next round")
                              sys.exit(0)
                  except Exception as exc:
                      print(f"[hold] exec probe failed: {exc}",
                            file=sys.stderr)
                  # b) main run reached a terminal state (stop fallback).
                  try:
                      r = gh_get(f"https://api.github.com/repos/"
                                 f"{main_run_repo}/actions/runs/"
                                 f"{main_run_id}")
                      if r.get("status") == "completed":
                          print(f"[hold] main run {main_run_id} completed "
                                f"({r.get('conclusion')}) — releasing "
                                "runner")
                          sys.exit(0)
                  except Exception as exc:
                      if "404" in str(exc):
                          if not warn_404:
                              print("[hold] cannot read main run "
                                    f"{main_run_id} (cross-repo 404?) — "
                                    "relying on exec probe + timeout",
                                    file=sys.stderr)
                              warn_404 = True
                      else:
                          print(f"[hold] main-run probe failed: {exc}",
                                file=sys.stderr)
              time.sleep(30)
          print(f"[hold] hold budget "
                f"{int('${{ inputs.hold_minutes }}') * 60}s exhausted — "
                "releasing runner")
          sys.exit(0)
          PY
