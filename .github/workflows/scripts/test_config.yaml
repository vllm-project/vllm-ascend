# Selective test scope configuration.
#
# This file is consumed by select_tests.py (test routing/grouper) and
# coverage.py (config validation). It no longer maintains a module -> test
# mapping; tests are selected by directory scan (see select_tests.py
# --run-all-modules / --test-list-file / --run-a5). The sections below are:
#
#   skip_tests:      pytest targets to explicitly skip (file or ::nodeid).
#                    Applied globally to every test selection.
#   runner_mapping:  regex patterns mapping test paths to runner types.
#   partition:       parallel split counts per runner key.
#   estimated_times: per-test timing (seconds) used for load-balanced
#                    partitioning and by the estimate-times workflow.
#
# Runner routing conventions:
#   tests/e2e/pull_request/{one,four}_card          -> a2/a3 (with _310p override)
#   tests/e2e/pull_request/{two,eight}_card         -> a3
#   tests/ut/<module>/a2|a2_2|a3_2|a3_4|a3_8|310p/  -> corresponding NPU runner
#   tests/ut/... (others)                           -> CPU runner (default)
#
skip_tests:
  # Unstable precision check in test_graph_mode.py; re-enable once fixed.
  - tests/e2e/pull_request/four_card/test_graph_mode.py

# Per-test estimated execution time in seconds.
