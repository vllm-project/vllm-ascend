# Selective test routing configuration.
#
# This file no longer maps source code paths to test modules. Test
# recommendation is produced by the coverage/AST based precision testing
# pipeline (``test_selector.py``) and consumed by ``select_tests.py`` through
# ``--test-list-file``. Slash-command flows use ``--explicit-e2e-tests``,
# full-suite runs use ``--all-tests``, and curated suites use ``--curated``.
#
# This file only holds routing metadata consumed by ``select_tests.py``:
#
# - ``curated_tests:``   named lists of test paths (e.g. ``a5``) selected via
#                        ``select_tests.py --curated <name>``.
# - ``skip_tests:``      test files that are removed after test collection,
#                        regardless of how they were selected.
# - ``accuracy_tests:``  the accuracy test files. When at least one of them
#                        is selected (or the full suite runs via
#                        ``--all-tests``), ``select_tests.py`` reroutes the
#                        generic A3 partitions to the dedicated 560T labels
#                        (see the A3 scheduling policy below).
# - ``runner_mapping:``  regex patterns mapping test paths to logical
#                        partitions (patterns are evaluated longest first,
#                        most specific wins). Each entry has a ``default``
#                        partition and an optional ``310p`` override for
#                        files whose name contains ``_310p``.
# - ``estimated_times:`` per-file estimated execution time in seconds, used
#                        for load-balanced partitioning. Updated periodically
#                        by the schedule_e2e_test workflow. Unlisted tests
#                        default to 600s (10 minutes). File-level only:
#                        bucketing and precision testing both work on files,
#                        so ``::nodeid`` (method-level) entries are not
#                        supported.
# - ``partition:``       maps logical test buckets to exact labels from
#                        runner_label.json and controls how many
#                        load-balanced groups are created for each bucket.
#
# A3 scheduling policy: the generic ``linux-aarch64-a3-N-`` labels are mixed
# pools of 560T and 752T machines, i.e. scheduling on them picks a machine
# class at random. When the selection contains at least one accuracy test
# (any file listed in ``accuracy_tests``), or when the full suite runs via
# ``--all-tests`` (ready-all), ``select_tests.py`` reroutes those generic
# partitions to the dedicated 560T labels (``linux-aarch64-a3-800i-N``) so no
# 752T machine is started just for accuracy coverage.

# === Curated Test Suites ===
# Named test lists selected via ``select_tests.py --curated <name>``.
curated_tests:
  # A5 (Ascend 950) curated test suite
  a5:
    - tests/e2e/pull_request/four_card/test_data_parallel_tp2.py

# === Skipped Tests ===
# Removed from any selection after directory scanning, so they are never
# scheduled to a runner. Only whole-file skips belong here: when every test
# function in the file is unconditionally skipped, register the file instead
# of paying for a runner slot that executes nothing. Move the file back into
# rotation once the underlying issue is fixed, and remove it from this list.
skip_tests:
