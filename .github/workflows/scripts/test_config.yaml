# === Runner Mapping ===
# Maps test paths to logical partitions using regex patterns.
# Each entry has a ``default`` partition and an optional ``310p`` override
# for files whose name contains ``_310p``.
# Patterns are evaluated longest first (most specific wins).
runner_mapping:
  tests/e2e/pull_request/one_card:
    default: a2-1
    310p: 310p-1
  tests/e2e/pull_request/two_card:
    default: a3-2
    310p: 310p-2
  tests/e2e/pull_request/four_card:
    default: a3-4
    310p: 310p-4

# === Partition Configuration ===
# Maps logical test buckets to exact labels from runner_label.json and controls
# how many load-balanced groups are created for each bucket.
partition:
  310p-1:
    runner_label: linux-aarch64-310p-1
    count: 1
  310p-2:
    runner_label: linux-aarch64-310p-2
    count: 1
  310p-4:
    runner_label: linux-aarch64-310p-4
    count: 1
  a2-1:
    runner_label: linux-aarch64-a2b3-1
    count: 7
  a5-4:
    runner_label: linux-aarch64-a5-4
    count: 6
  a3-2:
    runner_label: linux-aarch64-a3-2
    count: 5
  a3-4:
    runner_label: linux-aarch64-a3-4
    count: 5
  cpu-0:
    runner_label: linux-amd64-cpu-8-hk
    count: 1
