# Composes the runtime image build and presmoke smoke test into
# a single reusable pipeline for one (chip, OS) pair:
#   build-base -> build-nightly -> run-presmoke-tests
# Only run presmoke smoke test here. Full nightly selected tests are triggered by other workflow.
name: 'Nightly image build with base + Presmoke Only'
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Nightly target / chip: 'a2', 'a3', '310p' or 'a5'"
      os:
        required: true
        type: string
        description: "Operating system variant to build: 'ubuntu' or 'openeuler'"
      soc:
        required: true
        type: string
        description: "Ascend SoC type (e.g. 910b, a3, 310p, 950)"
      dockerfile:
        required: true
        type: string
        description: "Base image Dockerfile (e.g. Dockerfile, Dockerfile.a3, Dockerfile.openEuler)"
      suffix:
        required: true
        type: string
        description: "Base image tag suffix (e.g. '', 'a3', 'openeuler', 'a3-openeuler')"
      vllm_ascend_branch:
        required: false
        type: string
        default: 'main'
        description: "Branch/ref to checkout"
      base_image_branch:
        required: false
        type: string
        default: ''
        description: "Branch used to resolve the base image tag. Defaults to vllm_ascend_branch."
      build_type:
        required: false
        type: string
        default: 'full'
        description: "Matrix shape for the nightly test image: 'full' builds both architectures; 'release' builds ubuntu arm64 only. Dependency versions always come from the Dockerfiles."
      should_push:
        required: false
        type: boolean
        default: false
        description: "If true, login to SWR and push built images."
      skip_base:
        required: false
        type: boolean
        default: false
        description: "If true, skip the base image build and only build the nightly image (base image must already exist)."
      swr_registry:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com'
        description: 'SWR registry domain'
      # 保留旧输入，兼容上层调用，当前不再使用
      run_nightly_test:
        required: false
        type: boolean
        default: true
        description: "【Deprecated, no effect】Whether to trigger nightly selected tests after image build success"
      # 新增：presmoke冒烟开关
      run_presmoke:
        required: false
        type: boolean
        default: true
        description: "Whether to trigger presmoke smoke tests after image build success"
      # 新增：vllm版本/sha传给presmoke测试
      vllm_ref_for_test:
        required: false
        type: string
        default: ""
        description: "Optional vllm commit/tag override. Empty resolves .github/vllm-main-verified.commit from vllm_ascend_branch."
      build_from_raw_base:
        type: boolean
        required: false
        default: false
        description: Whether build from raw cann base image instead of nightly layered image
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false
      SYNC_TOOLS_TOKEN:
        required: false
      OBS_ACCESS_KEY_PRECISION:
        required: false
      OBS_SECRET_ACCESS_KEY_PRECISION:
        required: false

jobs:
  build-base:
    name: Build base image (${{ inputs.suffix || 'a2' }}-${{ inputs.os }})
    if: ${{ !inputs.skip_base && github.repository == 'vllm-project/vllm-ascend' }}
    uses: ./.github/workflows/_schedule_image_build.yaml
    with:
      dockerfile: ${{ inputs.dockerfile }}
      suffix: ${{ inputs.suffix }}
      soc: ${{ inputs.soc }}
      should_push: ${{ inputs.should_push }}
      schedule_tag_pattern: 'main'
      branch_ref: ${{ inputs.vllm_ascend_branch || 'main' }}
      swr_registry: ${{ inputs.swr_registry }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}

  build-nightly:
    name: Build nightly-${{ inputs.target }} (${{ inputs.os }})
    needs: build-base
    if: ${{ always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') }}
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: ${{ inputs.target }}
      os_filter: ${{ inputs.os }}
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch }}
      base_image_branch: ${{ inputs.base_image_branch || inputs.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      should_push: ${{ inputs.should_push }}
      soc: ${{ inputs.soc }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}

  # ========== 解析已验证的vLLM commit，避免浮动main与vllm-ascend代码不匹配 ==========
  resolve-vllm-ref:
    name: Resolve verified vLLM commit
    if: ${{ inputs.run_presmoke }}
    runs-on: ubuntu-latest
    outputs:
      vllm_ref: ${{ steps.verified.outputs.ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.vllm_ascend_branch }}
      - name: Read verified vLLM commit
        id: verified
        run: |
          vllm_ref="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          if ! [[ "${vllm_ref}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error file=.github/vllm-main-verified.commit::invalid vLLM main commit: ${vllm_ref}"
            exit 1
          fi
          echo "ref=${vllm_ref}" >> "$GITHUB_OUTPUT"

  # ========== 生成presmoke分组，调用 _selected_tests.yaml 冒烟 ==========
  gen-presmoke-groups:
    name: Generate presmoke test groups for ${{ inputs.target }}
    needs: build-nightly
    if: ${{ inputs.run_presmoke && needs.build-nightly.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      presmoke_groups_json: ${{ steps.gen_groups.outputs.test_groups }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.vllm_ascend_branch }}
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps for select_tests
        run: |
          pip install pyyaml regex
      - name: Run select_tests.py to generate presmoke groups
        id: gen_groups
        run: |
          python3 .github/workflows/scripts/select_tests.py \
            --explicit-e2e-tests \
            tests/e2e/pull_request/one_card/test_mla_prolog_head_padding.py

  run-presmoke-tests:
    name: Run Presmoke Smoke Tests ${{ inputs.target }}-${{ inputs.os }}
    needs: [gen-presmoke-groups, resolve-vllm-ref]
    if: >-
      ${{ inputs.run_presmoke &&
          needs.gen-presmoke-groups.result == 'success' &&
          needs.resolve-vllm-ref.result == 'success' }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ inputs.vllm_ref_for_test || needs.resolve-vllm-ref.outputs.vllm_ref }}
      test_groups: ${{ needs.gen-presmoke-groups.outputs.presmoke_groups_json }}
      ref: ${{ inputs.vllm_ascend_branch }}
      base_ref: ${{ inputs.base_image_branch || 'main' }}
      continue_on_error: false
      timeout-minutes: 60
    secrets:
      OBS_ACCESS_KEY_PRECISION: ${{ secrets.OBS_ACCESS_KEY_PRECISION }}
      OBS_SECRET_ACCESS_KEY_PRECISION: ${{ secrets.OBS_SECRET_ACCESS_KEY_PRECISION }}
