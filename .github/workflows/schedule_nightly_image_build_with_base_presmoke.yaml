# 👇 删除这一段！！
# on:
#   pull_request_target:
#       types: [labeled]
# 保留 workflow_call 这一段，其他jobs逻辑完全不动
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: "Nightly target / chip: 'a2', 'a3', '310p' or 'a5'"
      os:
        required: true
        type: string
        description: "Operating system variant to build: 'ubuntu' or 'openeuler'"
      soc:
        required: true
        type: string
        description: "Ascend SoC type (e.g. 910b, a3, 310p, 950)"
      dockerfile:
        required: true
        type: string
        description: "Base image Dockerfile (e.g. Dockerfile, Dockerfile.a3, Dockerfile.openEuler)"
      suffix:
        required: true
        type: string
        description: "Base image tag suffix (e.g. '', 'a3', 'openeuler', 'a3-openeuler')"
      vllm_ascend_branch:
        required: false
        type: string
        default: 'main'
        description: "Branch/ref to checkout"
      base_image_branch:
        required: false
        type: string
        default: ''
        description: "Branch used to resolve the base image tag. Defaults to vllm_ascend_branch."
      build_type:
        required: false
        type: string
        default: 'full'
        description: "Matrix shape for the nightly test image: 'full' builds both architectures; 'release' builds ubuntu arm64 only. Dependency versions always come from the Dockerfiles."
      should_push:
        required: false
        type: boolean
        default: false
        description: "If true, login to SWR and push built images."
      skip_base:
        required: false
        type: boolean
        default: false
        description: "If true, skip the base image build and only build the nightly image (base image must already exist)."
      swr_registry:
        required: false
        type: string
        default: 'swr.cn-north-12.myhuaweicloud.com'
        description: 'SWR registry domain'
      # 保留旧输入，兼容上层调用，当前不再使用
      run_nightly_test:
        required: false
        type: boolean
        default: true
        description: "【Deprecated, no effect】Whether to trigger nightly selected tests after image build success"
      # 新增：presmoke冒烟开关
      run_presmoke:
        required: false
        type: boolean
        default: true
        description: "Whether to trigger presmoke smoke tests after image build success"
      # 新增：vllm版本/sha传给presmoke测试
      vllm_ref_for_test:
        required: false
        type: string
        default: "main"
        description: "vllm commit/tag for _presmoke_tests"
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false
      SYNC_TOOLS_TOKEN:
        required: false
      OBS_ACCESS_KEY_PRECISION:
        required: false
      OBS_SECRET_ACCESS_KEY_PRECISION:
        required: false
