# This workflow builds nightly images as a layer-cache warm-up at 20:00 Beijing time.
# The nightly test workflows (Nightly-A2, Nightly-A3) each rebuild the image fresh
# before running tests, so this schedule only serves to pre-populate the build cache.
#
# The scheduled run (12:00 UTC = 20:00 Beijing) also acts as the Daily Regression
# pipeline's build/compile gate: a successful build produces fresh
# nightly-ci-main-{a2,a3,310p} images that schedule_daily_regression.yaml reuses
# for high-frequency PR E2E + nightly high-freq testing (no inline rebuild).
name: Nightly Image Build Schedule

on:
  schedule:
    # 12:00 UTC = 20:00 Beijing time. Build finishes ~14:00 UTC (22:00 Beijing).
    # The fresh nightly-ci image is then available for the next morning's Daily
    # Regression slot (01:00 UTC = 09:00 Beijing). A failed build here surfaces
    # as a broken compile on main within the day.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch to nightly test'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - releases/v0.26.0rc
          - releases/v0.25.1rc
          - releases/v0.24.0rc
          - releases/v0.23.0
          - releases/v0.22.1rc
          - releases/v0.18.0
      build_type:
        description: 'Build type: daily or release'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - daily
      base_image_tag:
        description: 'Base image tag params. Default auto-picks latest image; set a date (YYYYMMDD) to pin it.'
        required: false
        default: '{"cann_version":"2026.08.03","base_image_date":"auto"}'
        type: string

jobs:
  build-a2:
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: a2
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      quay_daily_username: ${{ vars.QUAY_DAILY_USERNAME }}
      cann_version: ${{ fromJSON(inputs.base_image_tag).cann_version }}
      base_image_date: ${{ fromJSON(inputs.base_image_tag).base_image_date }}
    secrets:
      HW_USERNAME: ${{ secrets.HW_USERNAME }}
      HW_TOKEN: ${{ secrets.HW_TOKEN }}
      HW_USERNAME_DAILY: ${{ secrets.HW_USERNAME_DAILY }}
      HW_TOKEN_DAILY: ${{ secrets.HW_TOKEN_DAILY }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      QUAY_DAILY_PASSWORD: ${{ secrets.QUAY_DAILY_PASSWORD }}

  build-a3:
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: a3
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      quay_daily_username: ${{ vars.QUAY_DAILY_USERNAME }}
      cann_version: ${{ fromJSON(inputs.base_image_tag).cann_version }}
      base_image_date: ${{ fromJSON(inputs.base_image_tag).base_image_date }}
    secrets:
      HW_USERNAME: ${{ secrets.HW_USERNAME }}
      HW_TOKEN: ${{ secrets.HW_TOKEN }}
      HW_USERNAME_DAILY: ${{ secrets.HW_USERNAME_DAILY }}
      HW_TOKEN_DAILY: ${{ secrets.HW_TOKEN_DAILY }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      QUAY_DAILY_PASSWORD: ${{ secrets.QUAY_DAILY_PASSWORD }}

  build-310p:
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: 310p
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      quay_daily_username: ${{ vars.QUAY_DAILY_USERNAME }}
      cann_version: ${{ fromJSON(inputs.base_image_tag).cann_version }}
      base_image_date: ${{ fromJSON(inputs.base_image_tag).base_image_date }}
    secrets:
      HW_USERNAME: ${{ secrets.HW_USERNAME }}
      HW_TOKEN: ${{ secrets.HW_TOKEN }}
      HW_USERNAME_DAILY: ${{ secrets.HW_USERNAME_DAILY }}
      HW_TOKEN_DAILY: ${{ secrets.HW_TOKEN_DAILY }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      QUAY_DAILY_PASSWORD: ${{ secrets.QUAY_DAILY_PASSWORD }}
  build-a5:
    uses: ./.github/workflows/_nightly_image_build.yaml
    with:
      target: a5
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch }}
      build_type: ${{ inputs.build_type }}
      quay_daily_username: ${{ vars.QUAY_DAILY_USERNAME }}
      cann_version: ${{ fromJSON(inputs.base_image_tag).cann_version }}
      base_image_date: ${{ fromJSON(inputs.base_image_tag).base_image_date }}
    secrets:
      HW_USERNAME: ${{ secrets.HW_USERNAME }}
      HW_TOKEN: ${{ secrets.HW_TOKEN }}
      HW_USERNAME_DAILY: ${{ secrets.HW_USERNAME_DAILY }}
      HW_TOKEN_DAILY: ${{ secrets.HW_TOKEN_DAILY }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      QUAY_DAILY_PASSWORD: ${{ secrets.QUAY_DAILY_PASSWORD }}