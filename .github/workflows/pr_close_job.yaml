name: Cancel runs on PR close
on:
  pull_request:
    types: [closed]
  pull_request_target:
    types: [closed]

jobs:
  cancel:
    if: github.event_name == 'pull_request'
    permissions:
      actions: write
      contents: read
    runs-on: linux-amd64-cpu-1-hk
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            // Use head SHA, not head.ref: a fork PR named "main" would otherwise
            // cancel origin/main Nightly, Coverage, and E2E runs.
            const headSha = context.payload.pull_request.head.sha;

            const statuses = ["in_progress", "queued", "waiting", "pending", "requested"];
            for (const status of statuses) {
              let page = 1;
              while (true) {
                const resp = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, head_sha: headSha, status, per_page: 100, page
                });

                const runs = resp.data.workflow_runs;
                if (!runs.length) break;

                for (const run of runs) {
                  if (run.id === context.runId) continue; // don't cancel this workflow
                  try {
                    await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                    core.info(`Cancel requested: ${run.html_url}`);
                  } catch (e) {
                    // common reasons: already completed (409) or insufficient permissions (403)
                    core.warning(`Failed to cancel ${run.html_url}: ${e.message}`);
                  }
                }

                if (runs.length < 100) break;
                page++;
              }
            }

  clear-ready-labels:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == false
    permissions:
      pull-requests: write
    runs-on: linux-amd64-cpu-1-hk
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number, labels } = context.payload.pull_request;

            for (const { name } of labels) {
              if (name !== "ready" && !name.startsWith("ready-")) continue;

              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
                core.info(`Removed ${name} from PR #${number}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
