name: Cancel runs on PR close
# pull_request_target is required so OBS secrets are available for fork PRs.
# The upload job only checks out the merge commit on the base repository.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: linux-amd64-cpu-2-hk
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;

            const statuses = ["in_progress", "queued", "waiting", "pending", "requested"];
            for (const status of statuses) {
              let page = 1;
              while (true) {
                const resp = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, branch, status, per_page: 100, page
                });

                const runs = resp.data.workflow_runs;
                if (!runs.length) break;

                for (const run of runs) {
                  if (run.id === context.runId) continue; // don't cancel this workflow
                  try {
                    await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                    core.info(`Cancel requested: ${run.html_url}`);
                  } catch (e) {
                    // common reasons: already completed (409) or insufficient permissions (403)
                    core.warning(`Failed to cancel ${run.html_url}: ${e.message}`);
                  }
                }

                if (runs.length < 100) break;
                page++;
              }
            }

  upload-merged-new-tests:
    name: Upload merged new tests to OBS
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
    runs-on: linux-amd64-cpu-8-hk
    env:
      OBS_ACCESS_KEY: ${{ secrets.OBS_ACCESS_KEY_PRECISION }}
      OBS_SECRET_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY_PRECISION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect new or moved tests
        id: collect
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # GitHub keeps refs/pull/<n>/head on the base repo. Three-dot
          # PR_BASE...PR_HEAD is the Files changed tab, even if PR_BASE is stale.
          git fetch origin "pull/${PR_NUMBER}/head" --no-tags
          PR_HEAD=$(git rev-parse FETCH_HEAD)
          echo "pr-number=${PR_NUMBER}"
          echo "pr-base=${PR_BASE}"
          echo "pr-head=${PR_HEAD}"
          echo "merge=${MERGE_SHA}"
          python3 .github/workflows/scripts/collect_merged_new_tests.py \
            --pr-base "${PR_BASE}" \
            --pr-head "${PR_HEAD}" \
            --output merged_new_tests.yaml \
            --pr-number "${PR_NUMBER}" \
            --merge-sha "${MERGE_SHA}"
          if [ -s merged_new_tests.yaml ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Collected tests:"
            cat merged_new_tests.yaml
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No new or moved tests to upload"
          fi

      - name: Upload collected tests as artifact
        if: ${{ steps.collect.outputs.has_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: merged-new-tests-pr-${{ github.event.pull_request.number }}
          path: merged_new_tests.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Merge into OBS extra_recommended_tests.yaml
        id: merge
        if: ${{ steps.collect.outputs.has_tests == 'true' }}
        run: |
          set -euo pipefail
          OBS_URL="https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/extra_recommended_tests.yaml"
          python3 -m pip install pyyaml --quiet
          http_code=$(curl -sSL --retry 3 -o extra_recommended_tests.yaml -w "%{http_code}" "${OBS_URL}" || echo "000")
          if [ "${http_code}" = "200" ] && [ -s extra_recommended_tests.yaml ]; then
            echo "Downloaded existing extra_recommended_tests.yaml from OBS"
          elif [ "${http_code}" = "404" ]; then
            echo "No extra_recommended_tests.yaml on OBS yet; starting a new file"
            : > extra_recommended_tests.yaml
          else
            echo "::error::Failed to download extra_recommended_tests.yaml from OBS (HTTP ${http_code})"
            exit 1
          fi
          python3 .github/workflows/scripts/merge_extra_recommended_tests.py \
            --extra-yaml extra_recommended_tests.yaml \
            --incoming-yaml merged_new_tests.yaml \
            --output-yaml extra_recommended_tests.yaml \
            | tee merge.out
          if grep -q "^Appended " merge.out; then
            echo "has_new_paths=true" >> "$GITHUB_OUTPUT"
            echo "Merged extra yaml:"
            cat extra_recommended_tests.yaml
          else
            echo "has_new_paths=false" >> "$GITHUB_OUTPUT"
            echo "No new paths to upload"
          fi

      # TODO: restore OBS upload after artifact verification.
