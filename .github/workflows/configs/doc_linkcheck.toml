# These are measured/tunable client budgets, not provider quota guarantees.
[check]
global_concurrency = 32
max_rounds = 3
request_timeout = 20
connect_timeout = 5
total_timeout = 1200
retry_delay = 5
cooldown = 60
growth_window = 30
excludes = ["docs/source/zh"]

[default_host]
concurrency = 4
max_concurrency = 8
requests_per_second = 4
max_requests_per_second = 8

[hosts."github.com"]
concurrency = 12
max_concurrency = 24
requests_per_second = 8
max_requests_per_second = 16

[hosts."docs.vllm.ai"]
concurrency = 8
max_concurrency = 16
requests_per_second = 8
max_requests_per_second = 16

[[exceptions]]
pattern = '^https://github\.com/[^/?#]+/?$'
files = '(^|/)docs/source/community/contributors\.md$'
action = "skip"
reason = "Historical contributor attribution; account renames/deletions do not invalidate the document."

[[exceptions]]
pattern = '^https://support\.huaweicloud\.com/intl/en-us/usermanual-cce/cce_10_0239\.html$'
action = "allow_restricted"
reason = "This public help page rejects automated requests from the CI network."
