# Single source of truth for the Weekly-A2 / Weekly-A3 test matrix.
# Mirrors nightly_config.yaml's layout but only contains the sections
# exercised by schedule_weekly_test_a2.yaml and schedule_weekly_test_a3.yaml.
# Adding a new weekly test case is just appending a `- name: ...` entry
# under the matching section.
# Every A2/A3 multi-node case must set `config_base_path` to its internal_dp/config
# or external_dp/config directory.

a2:
  accuracy:
    # Content migrated from
    nightly:
      - name: accuracy-group-2
        os: linux-aarch64-a2b3-1
        model_list:
          - ERNIE-4.5-21B-A3B-PT
          - Molmo-7B-D-0924
          - Llama-3.2-3B-Instruct

a3:
  multi_node:
    test_config:
      - name: GLM-5.1-W8A8C8-128k-1k-90-50-PD
        config_file_path: GLM-5.1-W8A8C8-128k-1k-90-50-PD.yaml
        config_base_path: tests/e2e/weekly/multi_node/external_dp/config
        size: 4
      - name: DeepSeek-V4-Pro-w4a8-prefix-cache-PD
        config_file_path: DeepSeek-V4-Pro-w4a8-prefix-cache-PD.yaml
        config_base_path: tests/e2e/weekly/multi_node/external_dp/config
        size: 4
      - name: GLM-5.1-W8A8C8-64k-1k-90-50-PD
        config_file_path: GLM-5.1-W8A8C8-64k-1k-90-50-PD.yaml
        config_base_path: tests/e2e/weekly/multi_node/external_dp/config
        size: 4
  double_node:
    test_config:
      - name: multi-node-GLM-5.1-W8A8C8-A3_64k_128k_90_50
        config_file_path: GLM-5.1-W8A8C8-A3_64k_128k_90_50.yaml
        config_base_path: tests/e2e/weekly/multi_node/internal_dp/config
        size: 2
  single_node:
    test_config:
      # pytest-driven tests
      - name: engine-func-tests
        os: linux-aarch64-a3-4
        tests: tests/e2e/weekly/single_node/engine_func_test_robot
      - name: Kimi-K2.6-w4a8-A3
        os: linux-aarch64-a3-16
        config_file_path: Kimi-K2.6-w4a8-A3.yaml
      - name: Minimax_m2.7_w8a8_A3
        os: linux-aarch64-a3-16
        config_file_path: Minimax_m2.7_w8a8_A3.yaml

310p:
  single_node:
    test_config:
      - name: Qwen3-8B-w8a8sc-310p
        os: linux-aarch64-310p-4
        config_file_path: Qwen3-8B-w8a8sc-310p.yaml
      - name: Qwen3-14B-w8a8sc-310p
        os: linux-aarch64-310p-4
        config_file_path: Qwen3-14B-w8a8sc-310p.yaml
      - name: Qwen3-32B-w8a8sc-310p
        os: linux-aarch64-310p-4
        config_file_path: Qwen3-32B-w8a8sc-310p.yaml
