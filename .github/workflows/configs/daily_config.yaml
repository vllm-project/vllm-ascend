# Daily high-frequency nightly subset for daytime regression detection.
# Every `name` below MUST match a test case in nightly_config.yaml.
# Add/remove entries to tune the subset; the schedule_e2e_test.yaml workflow
# dispatches them via the schedule_nightly_test_<soc>.yaml workflows.

a2:
  multi_node:
    - name: multi-node-qwen3-235b-dp
  single_node:
    - name: qwen3-32b-int8
a3:
  multi_node:
    - name: multi-node-deepseek-v3.2-W8A8-EP
  double_node:
    - name: multi-node-qwen3-dp
  single_node:
    - name: deepseek-r1-0528-w8a8
  multi_card:
    - name: qwen3-30b-acc
a5:
  multi_node:
    # Currently disabled in nightly_config.yaml; resolve_daily_tests.py skips
    # it with a warning until the A5 multi-node case is enabled.
    - name: Qwen3-235B-W8A8-EPLB
  single_node:
    - name: Qwen3_32b_w8a8_A5
