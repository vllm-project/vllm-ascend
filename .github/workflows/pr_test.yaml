# TEMPORARY (fork-only validation, do not merge): this file mirrors the upstream
# PR E2E pipeline but drops the pre-commit / CPU UT / recommendation / label
# gate prerequisites so a push runs the suite directly, and keeps only the A2
# test groups produced by select_tests.py. The reusable test job
# (./.github/workflows/_selected_tests.yaml) and the selection/routing configs
# are untouched, so runner labels and card counts still come from the
# repository's own routing tables.
name: E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'main'

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-tests:
    # Single producer of test_groups / base_sha / has_tests. In the upstream
    # pipeline this job is gated on run-enabling labels and a successful
    # pre-commit run; both are removed here so every push selects tests.
    runs-on: linux-amd64-cpu-2-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      has_tests: ${{ steps.scope-all.outputs.has_tests }}
      test_groups: ${{ steps.scope-all.outputs.test_groups }}
      matched_modules: ${{ steps.scope-all.outputs.matched_modules }}
      csrc_cache_target_ids: ${{ steps.cache-targets.outputs.target_ids }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
      vllm_versions: ${{ steps.vllm.outputs.vllm_versions }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve the moving base branch once so test selection, cache
          # production, and cache consumption all receive one immutable SHA.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          # The workflow graph was loaded when the event was created. If its
          # cache control files changed on the base branch since then, pairing
          # the old graph with the new helpers could produce incompatible keys.
          # A rerun reloads the workflow and helpers from a consistent revision.
          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read verified vLLM main commit
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error::Invalid verified vLLM main commit: ${main_commit}"
            exit 1
          }
          # The pre-commit job normally derives this matrix; without it the
          # pipeline always tests the verified main commit.
          echo "vllm_versions=[\"${main_commit}\"]" >> "$GITHUB_OUTPUT"
          echo "Testing vLLM main commit: ${main_commit}"

      - name: Validate test coverage config
        run: |
          pip install pyyaml
          python3 .github/workflows/scripts/coverage.py

      - name: Select A2 tests from the full PR suite
        id: scope-all
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install regex pyyaml -q
          GITHUB_OUTPUT="$RUNNER_TEMP/all-test-groups.txt" \
            python3 .github/workflows/scripts/select_tests.py \
            --all-tests \
            --skip-cpu-ut \
            --skip-a5
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outputs = dict(
              line.split("=", 1)
              for line in Path(os.environ["RUNNER_TEMP"], "all-test-groups.txt")
              .read_text()
              .splitlines()
              if "=" in line
          )
          groups = json.loads(outputs["test_groups"])
          # TEMPORARY (fork-only validation, do not merge): the full PR suite
          # also allocates A3 / 310P runners; keep only the A2 groups so this
          # run exercises the A2 pool end to end.
          a2_groups = [group for group in groups if group.get("npu_type") == "a2"]
          target_ids = sorted({group["csrc_cache_target"] for group in a2_groups})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"has_tests={'true' if a2_groups else 'false'}", file=output)
              print(
                  "test_groups=" + json.dumps(a2_groups, separators=(",", ":")),
                  file=output,
              )
              print(
                  "csrc_cache_target_ids="
                  + json.dumps(target_ids, separators=(",", ":")),
                  file=output,
              )
          print(f"A2 groups: {len(groups)} selected in total, {len(a2_groups)} kept")
          for group in a2_groups:
              files = group.get("tests", "").split()
              print(
                  f"  {group['runner']} ({group.get('num_npus')} card)"
                  f" [{group.get('partition_name')}] {len(files)} files"
              )
          PY

      - name: Add upstream test cache target
        id: cache-targets
        env:
          SELECTED_TARGET_IDS: ${{ steps.scope-all.outputs.csrc_cache_target_ids }}
        run: |
          python3 - <<'PY'
          import json
          import os

          target_ids = json.loads(os.environ["SELECTED_TARGET_IDS"])
          target_ids = sorted(set(target_ids) | {"a2-arm64-ubuntu"})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("target_ids=" + json.dumps(target_ids, separators=(",", ":")), file=output)
          PY

  prepare-csrc-cache:
    needs:
      - select-tests
    if: >-
      ${{
        !cancelled() &&
        needs.select-tests.result == 'success' &&
        needs.select-tests.outputs.has_tests == 'true'
      }}
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}

  run-selected-tests:
    needs:
      - select-tests
      - prepare-csrc-cache
    # The upstream version also requires pre-commit, both CPU UT versions and a
    # run-enabling label. Those prerequisites are intentionally dropped for this
    # temporary validation run; the job body is unchanged.
    if: >-
      ${{
        !cancelled() &&
        needs.select-tests.result == 'success' &&
        needs.prepare-csrc-cache.result == 'success' &&
        needs.select-tests.outputs.has_tests == 'true'
      }}
    name: run-selected-tests (vllm@${{ matrix.vllm_version }})
    strategy:
      fail-fast: false
      matrix:
        vllm_version: ${{ fromJSON(needs.select-tests.outputs.vllm_versions) }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ matrix.vllm_version }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.test_groups }}
