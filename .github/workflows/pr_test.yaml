name: karc hook cpFromPod probe

# TEMPORARY (fork-only experiment, do not merge): grow $RUNNER_TEMP
# (= /__w/_temp inside the job pod) step by step. Every step boundary makes the
# container hook copy the whole directory back to the runner (execCpFromPod), so
# this measures at which size the tar stream gets cut:
#   Error: Unexpected end of data  at Extract._final
#
# The first attempt ran without a `container:` block, so the runner executed
# every step inside the runner pod itself and the container hook never engaged.
# This version keeps the same container image/env as _selected_tests.yaml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: karc-hook-probe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

jobs:
  probe:
    runs-on: [linux-aarch64-a3-800i-karc-fed-2]
    timeout-minutes: 90
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.2.1-a3-ubuntu22.04-py3.12
      env:
        VLLM_LOGGING_LEVEL: ERROR
        HF_HUB_OFFLINE: 1
    steps:
      - name: show container identity
        run: |
          hostname
          whoami
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          df -h "$RUNNER_TEMP" || true

      - name: grow temp to 512 MiB
        run: |
          date -u +"start %T"
          dd if=/dev/urandom of="$RUNNER_TEMP/probe-512m.bin" bs=1M count=512 status=none
          du -sh "$RUNNER_TEMP"
          date -u +"end   %T"

      - name: grow temp to 3 GiB
        run: |
          date -u +"start %T"
          dd if=/dev/urandom of="$RUNNER_TEMP/probe-2g.bin" bs=1M count=2560 status=none
          du -sh "$RUNNER_TEMP"
          date -u +"end   %T"

      - name: grow temp to 6 GiB
        run: |
          date -u +"start %T"
          dd if=/dev/urandom of="$RUNNER_TEMP/probe-3g.bin" bs=1M count=3072 status=none
          du -sh "$RUNNER_TEMP"
          date -u +"end   %T"

      - name: grow temp to 9 GiB
        run: |
          date -u +"start %T"
          dd if=/dev/urandom of="$RUNNER_TEMP/probe-6g.bin" bs=1M count=3072 status=none
          du -sh "$RUNNER_TEMP"
          date -u +"end   %T"

      - name: final inventory
        run: ls -lh "$RUNNER_TEMP" && du -sh "$RUNNER_TEMP"
