name: karc hook cpFromPod probe

# TEMPORARY (fork-only experiment, do not merge): compare the container hook's
# step-boundary file sync between the offline karc cluster and a cloud A3 pool.
#
# Every step boundary makes the container hook tar the whole $RUNNER_TEMP back
# to the runner pod (execCpFromPod) and copy it into the next step pod
# (execCpToPod). On karc that channel measured ~0.13 MiB/s, which turns a
# 512 MiB temp directory into a >1 h stall and ends in
#   Error: Unexpected end of data  at Extract._final
#
# This run does the same single 512 MiB step on the cloud 2-card A3 pool so the
# two throughput numbers are directly comparable.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: karc-hook-probe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

jobs:
  probe:
    runs-on: [linux-aarch64-a3-800i-fed-2]
    timeout-minutes: 90
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.2.1-a3-ubuntu22.04-py3.12
      env:
        VLLM_LOGGING_LEVEL: ERROR
        HF_HUB_OFFLINE: 1
    steps:
      - name: show container identity
        run: |
          hostname
          whoami
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          df -h "$RUNNER_TEMP" || true
          ip -o link show eth0 || true
          ip -br addr show eth0 || true

      - name: grow temp to 512 MiB
        run: |
          date -u +"start %T"
          dd if=/dev/urandom of="$RUNNER_TEMP/probe-512m.bin" bs=1M count=512 status=none
          du -sh "$RUNNER_TEMP"
          date -u +"end   %T"

      - name: final inventory
        run: ls -lh "$RUNNER_TEMP" && du -sh "$RUNNER_TEMP"
