name: E2E

# Temporary runner validation only. Do not merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-smoke-tests:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Read verified vLLM ref
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error::Invalid verified vLLM main commit: ${main_commit}"
            exit 1
          }
          echo "main_commit=${main_commit}" >> "$GITHUB_OUTPUT"

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve the moving base branch once so test selection, cache
          # production, and cache consumption all receive one immutable SHA.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          # The workflow graph was loaded when the event was created. If its
          # cache control files changed on the base branch since then, pairing
          # the old graph with the new helpers could produce incompatible keys.
          # A rerun reloads the workflow and helpers from a consistent revision.
          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

  # Keep the normal csrc cache preparation and selected-test execution intact.
  prepare-csrc-cache:
    needs: prepare-smoke-tests
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: '["a3-arm64-ubuntu","310p-arm64-ubuntu"]'
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.prepare-smoke-tests.outputs.base_sha }}

  run-selected-tests:
    needs: [prepare-smoke-tests, prepare-csrc-cache]
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.prepare-smoke-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.prepare-smoke-tests.outputs.base_sha }}
      # Select one existing pytest case per exact runner label. Distinct
      # partitions also keep log artifact names unique across the A3 runners.
      test_groups: >-
        [
          {
            "partition_name": "a3-gy005-smoke",
            "partition": "gy005",
            "runner": "linux-aarch64-a3-test-16-gy005",
            "npu_type": "a3",
            "num_npus": 1,
            "image_tag": "9.2.0_20260928212200-a3-ubuntu22.04-py3.12",
            "csrc_cache_target": "a3-arm64-ubuntu",
            "tests": "tests/e2e/pull_request/one_card/test_qwen3_0_6b.py::test_dense_default_full_and_piecewise_graph"
          },
          {
            "partition_name": "310p-smoke",
            "partition": "310p",
            "runner": "linux-aarch64-310p-test-8",
            "npu_type": "310p",
            "num_npus": 1,
            "image_tag": "9.2.0_20260928212200-310p-ubuntu22.04-py3.12",
            "csrc_cache_target": "310p-arm64-ubuntu",
            "tests": "tests/e2e/pull_request/one_card/_310p/test_dense_model_310p.py::test_qwen3_dense_tp1_w8a8_aclgraph"
          },
          {
            "partition_name": "a3-sh001-smoke",
            "partition": "sh001",
            "runner": "linux-aarch64-a3-test-16-sh-001",
            "npu_type": "a3",
            "num_npus": 1,
            "image_tag": "9.2.0_20260928212200-a3-ubuntu22.04-py3.12",
            "csrc_cache_target": "a3-arm64-ubuntu",
            "tests": "tests/e2e/pull_request/one_card/test_qwen3_0_6b.py::test_dense_default_full_and_piecewise_graph"
          },
          {
            "partition_name": "a3-800i-cn12-smoke",
            "partition": "800i-cn12",
            "runner": "linux-aarch64-a3-800i-test-16-cn12-001",
            "npu_type": "a3",
            "num_npus": 1,
            "image_tag": "9.2.0_20260928212200-a3-ubuntu22.04-py3.12",
            "csrc_cache_target": "a3-arm64-ubuntu",
            "tests": "tests/e2e/pull_request/one_card/test_qwen3_0_6b.py::test_dense_default_full_and_piecewise_graph"
          }
        ]
