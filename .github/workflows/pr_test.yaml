# TEMPORARY: validate A2/A3 infrastructure smoke tests on FED runners. Do not merge.
name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, CPU UTs, precision recommendations, other NPU tests, and the label
  # gate are intentionally omitted for this temporary runner validation.
  select-tests:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      a2_b1: ${{ steps.scope.outputs.a2_b1 }}
      a2_b1b3: ${{ steps.scope.outputs.a2_b1b3 }}
      a2_b3: ${{ steps.scope.outputs.a2_b3 }}
      a2_b4: ${{ steps.scope.outputs.a2_b4 }}
      a3: ${{ steps.scope.outputs.a3 }}
      csrc_cache_target_ids: ${{ steps.scope.outputs.csrc_cache_target_ids }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve the moving base branch once so test selection, cache
          # production, and cache consumption all receive one immutable SHA.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          # The workflow graph was loaded when the event was created. If its
          # cache control files changed on the base branch since then, pairing
          # the old graph with the new helpers could produce incompatible keys.
          # A rerun reloads the workflow and helpers from a consistent revision.
          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read verified vLLM main commit
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error::Invalid verified vLLM main commit: ${main_commit}"
            exit 1
          }
          echo "main_commit=${main_commit}" >> "$GITHUB_OUTPUT"

      - name: Select model smoke tests for FED runners
        id: scope
        run: |
          pip install regex pyyaml
          GITHUB_OUTPUT="$RUNNER_TEMP/all-test-groups.txt" \
            python3 .github/workflows/scripts/select_tests.py --all-tests --skip-cpu-ut --skip-a5
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outputs = dict(
              line.split("=", 1)
              for line in Path(os.environ["RUNNER_TEMP"], "all-test-groups.txt").read_text().splitlines()
          )
          all_groups = json.loads(outputs["test_groups"])
          a2_template = next(group for group in all_groups if group["npu_type"] == "a2")
          a3_template = next(
              group for group in all_groups if group["npu_type"] == "a3" and group["num_npus"] == 2
          )
          a2_tests = [
              "tests/e2e/pull_request/one_card/test_minicpm.py",
              "tests/e2e/pull_request/two_card/test_prefix_caching.py",
          ]
          a3_tests = [
              "tests/e2e/pull_request/two_card/test_activation.py",
              "tests/e2e/pull_request/two_card/test_prefix_caching.py",
              "tests/e2e/pull_request/two_card/model_runner_v2/test_data_parallel.py",
          ]
          available = {test for group in all_groups for test in group["tests"].split()}
          if missing := set(a2_tests + a3_tests) - available:
              raise SystemExit(f"Smoke tests missing or skipped: {sorted(missing)}")
          groups = {}
          for chip in ("b1", "b1b3", "b3", "b4"):
              groups[f"a2_{chip}"] = dict(
                  a2_template,
                  runner=f"linux-aarch64-a2{chip}-fed-2",
                  num_npus=2,
                  partition_name=f"a2{chip}-smoke",
                  partition=f"{chip}-1-1",
                  tests=" ".join(a2_tests),
              )
          groups["a3"] = dict(
              a3_template,
              runner="linux-aarch64-a3-vllm-ascend-fed-2",
              partition_name="a3-smoke",
              partition="1-1",
              tests=" ".join(a3_tests),
          )
          target_ids = sorted({group["csrc_cache_target"] for group in groups.values()})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, group in groups.items():
                  print(f"{group['runner']}: {group['tests']}")
                  print(name + "=" + json.dumps([group], separators=(",", ":")), file=output)
              print("csrc_cache_target_ids=" + json.dumps(target_ids), file=output)
          PY

  prepare-csrc-cache:
    needs: select-tests
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}

  run-a2-b1:
    needs: [select-tests, prepare-csrc-cache]
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.a2_b1 }}

  run-a2-b1b3:
    # Continue with the next runner after failure, but stop on cancellation.
    needs: [select-tests, prepare-csrc-cache, run-a2-b1]
    if: ${{ !cancelled() && needs.select-tests.result == 'success' && needs.prepare-csrc-cache.result == 'success' }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.a2_b1b3 }}

  run-a2-b3:
    # Continue with the next runner after failure, but stop on cancellation.
    needs: [select-tests, prepare-csrc-cache, run-a2-b1b3]
    if: ${{ !cancelled() && needs.select-tests.result == 'success' && needs.prepare-csrc-cache.result == 'success' }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.a2_b3 }}

  run-a2-b4:
    # Continue with the next runner after failure, but stop on cancellation.
    needs: [select-tests, prepare-csrc-cache, run-a2-b3]
    if: ${{ !cancelled() && needs.select-tests.result == 'success' && needs.prepare-csrc-cache.result == 'success' }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.a2_b4 }}

  run-a3:
    needs: [select-tests, prepare-csrc-cache]
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.a3 }}

