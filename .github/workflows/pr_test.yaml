# TEMPORARY (fork-only validation): offline karc full-suite validation of the
# direct-sync hook. Runs the complete a2 + a3 PR E2E matrix (all tests, no a5,
# no 310p, no CPU UT) plus the upstream vllm suite on the karc-only federated
# scale sets:
#   a2-1 -> linux-aarch64-a2b3-karc-fed-1
#   a3-2 -> linux-aarch64-a3-800i-karc-fed-2
#   a3-4 -> linux-aarch64-a3-800i-karc-fed-4
# Card counts, partitions and sharding still come from the repository routing
# tables (test_config.yaml), so every case keeps its intended runner size.
# Lint, CPU UT, precision recommendations, a5/310p, and the label/CODEOWNERS
# gate are intentionally omitted. Do not merge.
name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-tests:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      test_groups: ${{ steps.scope.outputs.test_groups }}
      csrc_cache_target_ids: ${{ steps.scope.outputs.csrc_cache_target_ids }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read verified vLLM main commit
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error::Invalid verified vLLM main commit: ${main_commit}"
            exit 1
          }
          echo "main_commit=${main_commit}" >> "$GITHUB_OUTPUT"

      - name: Select minimal hook-probe groups (fast direct-hook validation)
        id: scope
        run: |
          python3 - <<'PY'
          import json
          import os

          # Hook-only fast validation, no business suite. Four probe jobs whose
          # models are pre-cached on the offline pool (see prod-member-a2-cache /
          # prod-member-a3-800i-cache comments): the federated karc-fed labels
          # spread these jobs across the cloud members (ascend-hk-001 /
          # wlcb-001 / cn12-001 / mind-third-ci) and the offline member (karc)
          # automatically, which is exactly what we want to verify.
          groups = [
              {
                  "num_npus": 1,
                  "npu_type": "a2",
                  "runner": "linux-aarch64-a2b3-karc-fed-1",
                  "tests": "tests/e2e/pull_request/one_card/test_ec_cpu_offload.py",
                  "partition_name": "a2-1",
                  "partition": "1-2",
                  "image_tag": "9.3.0_20261113161300-910b-ubuntu22.04-py3.12",
                  "csrc_cache_target": "a2-arm64-ubuntu",
              },
              {
                  "num_npus": 1,
                  "npu_type": "a2",
                  "runner": "linux-aarch64-a2b3-karc-fed-1",
                  "tests": "tests/e2e/pull_request/one_card/test_sampler.py",
                  "partition_name": "a2-1",
                  "partition": "2-2",
                  "image_tag": "9.3.0_20261113161300-910b-ubuntu22.04-py3.12",
                  "csrc_cache_target": "a2-arm64-ubuntu",
              },
              {
                  "num_npus": 2,
                  "npu_type": "a3",
                  "runner": "linux-aarch64-a3-800i-karc-fed-2",
                  "tests": "tests/e2e/pull_request/two_card/test_prefix_caching.py",
                  "partition_name": "a3-2",
                  "partition": "1-2",
                  "image_tag": "9.3.0_20261113161300-a3-ubuntu22.04-py3.12",
                  "csrc_cache_target": "a3-arm64-ubuntu",
              },
              {
                  "num_npus": 2,
                  "npu_type": "a3",
                  "runner": "linux-aarch64-a3-800i-karc-fed-2",
                  "tests": "tests/e2e/pull_request/two_card/test_cpu_offloading.py",
                  "partition_name": "a3-2",
                  "partition": "2-2",
                  "image_tag": "9.3.0_20261113161300-a3-ubuntu22.04-py3.12",
                  "csrc_cache_target": "a3-arm64-ubuntu",
              },
          ]
          target_ids = sorted({group["csrc_cache_target"] for group in groups})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("test_groups=" + json.dumps(groups, separators=(",", ":")), file=output)
              print("csrc_cache_target_ids=" + json.dumps(target_ids), file=output)
          PY

  prepare-csrc-cache:
    needs: select-tests
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}

  run-selected-tests:
    # prepare-csrc-cache is observational (continue-on-error in the reusable
    # workflow) and must not gate the NPU tests; the csrc cache is looked up by
    # the test jobs themselves.
    needs: select-tests
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.test_groups }}

  # Upstream vllm suite intentionally omitted: this PR only probes the
  # direct-sync hook quickly; the upstream suite needs HF datasets that the
  # offline pool does not cache yet (see vllm-project/self_cognition_Alice).
