name: E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - 'main'
      - '*-dev'
      - 'releases/v*'

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      # Short hash used only for job-name display.
      main_commit_short: ${{ steps.vllm.outputs.main_commit_short }}
      src: ${{ steps.filter.outputs.src }}
      ci_pipeline: ${{ steps.filter.outputs.ci_pipeline }}
    steps:
      - name: Validate PR title prefix
        run: |
          PR_TITLE=$(curl -sSf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['title'])") || {
              echo "::error::Failed to fetch PR title from GitHub API"
              exit 1
            }

          if [ -z "$PR_TITLE" ]; then
            echo "::error::PR title cannot be empty"
            exit 1
          fi

          echo "Checking PR title: $PR_TITLE"

          VALID_PREFIXES='\[(BugFix|Performance|Test|CI|Feature|Doc|Misc|Community|Refactor)\]'

          if ! echo "$PR_TITLE" | grep -iqE "$VALID_PREFIXES"; then
            echo "::error::PR title must contain one of the following prefixes: [BugFix], [Performance], [Test], [CI], [Feature], [Doc], [Misc], [Community], [Refactor]"
            echo "::error::Example: '[Feature] Add new optimization pass' or 'Add new feature [Feature]'"
            exit 1
          fi

          echo "✓ PR title prefix is valid"

      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read verified vLLM refs
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error file=.github/vllm-main-verified.commit::invalid vLLM main commit: ${main_commit}"
            exit 1
          }
          echo "main_commit=${main_commit}" >> "$GITHUB_OUTPUT"
          # Short form is for display only (job names); main_commit keeps the
          # full hash for checkout refs and artifact names.
          echo "main_commit_short=${main_commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: cp problem matchers
        run: |
          cp .github/workflows/matchers/actionlint.json "$RUNNER_TEMP/actionlint.json"
          cp .github/workflows/matchers/markdownlint.json "$RUNNER_TEMP/markdownlint.json"
          cp .github/workflows/matchers/mypy.json "$RUNNER_TEMP/mypy.json"

      - run: echo "::add-matcher::$RUNNER_TEMP/actionlint.json"
      - run: echo "::add-matcher::$RUNNER_TEMP/markdownlint.json"
      - run: echo "::add-matcher::$RUNNER_TEMP/mypy.json"

      - name: Checkout vllm-project/vllm repo
        uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm
          path: ./vllm-empty
          ref: ${{ steps.vllm.outputs.main_commit }}

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lint_tracker:
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'requirements-lint.txt'
            # Source paths that require precision/full test execution. This
            # category is the single source of truth for "does this PR need
            # NPU tests" and is consumed by every downstream job.
            src:
              - 'vllm_ascend/**'
              - 'setup.py'
              - 'csrc/**'
              - 'packages.txt'
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'pyproject.toml'
              - 'cmake/**'
              - 'tests/ut/**'
              - 'tests/e2e/pull_request/**'
              - 'tests/e2e/*.py'
              - 'tests/e2e/*.sh'
              - 'tools/**'
              - 'CMakeLists.txt'
              # CI pipeline files: a PR that touches the test selection or
              # execution pipeline itself must run the full suite, because
              # the precise-selection result can no longer be trusted.
            ci_pipeline:
              - '.github/workflows/pr_test.yaml'
              - '.github/workflows/_selected_tests.yaml'
              - '.github/workflows/_selected_tests_upstream.yaml'
              - '.github/workflows/_ensure_csrc_cache.yaml'
              - '.github/workflows/_build_csrc_cache.yaml'
              - '.github/workflows/scripts/csrc_cache_targets.json'
              - '.github/workflows/scripts/resolve_csrc_cache_targets.py'
              - '.github/workflows/scripts/select_tests.py'
              - '.github/workflows/scripts/test_selector.py'
              - '.github/workflows/scripts/run_selected_tests.sh'
              - '.github/workflows/scripts/test_config.yaml'
              - '.github/workflows/scripts/runner_label.json'
              - '.github/workflows/scripts/coverage.py'

      - name: Install vllm-ascend dev (conditional)
        if: steps.filter.outputs.lint_tracker == 'true'
        env:
          UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi https://download.pytorch.org/whl/cpu"
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_NO_CACHE: 1
          UV_SYSTEM_PYTHON: 1
        run: |
          pip install uv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install uc-manager
          uv pip install -r requirements-dev.txt

      - name: Install and run Gitleaks Secret Scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x .github/workflows/scripts/gitleaks.sh
          .github/workflows/scripts/gitleaks.sh

      - name: Get pre-commit config hash
        id: get_hash
        run: |
          PRE_COMMIT_HASH=$(sha256sum .pre-commit-config.yaml | awk '{print $1}')
          echo "PRE_COMMIT_HASH=$PRE_COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Restore pre-commit cache
        uses: runs-on/cache/restore@v5
        env:
          RUNS_ON_S3_BUCKET_CACHE: ascend-ci-cache-hk
          RUNS_ON_S3_BUCKET_ENDPOINT: https://obs.ap-southeast-1.myhuaweicloud.com
          RUNS_ON_S3_FORCE_PATH_STYLE: "false"
          AWS_S3_FORCE_PATH_STYLE: "false"
          AWS_REGION: ap-southeast-1
        with:
          path: /tmp/pre-commit-cache
          key: pre-commit-${{ steps.get_hash.outputs.PRE_COMMIT_HASH }}

      - name: Run pre-commit
        env:
          PRE_COMMIT_HOME: /tmp/pre-commit-cache
          PRE_COMMIT_COLOR: always
          FORCE_COLOR: "1"
          TERM: xterm-256color
          SHELLCHECK_OPTS: "--exclude=SC2046,SC2006,SC2086"
          # Keep golang-based pre-commit hooks on a domestic module proxy.
          GOPROXY: https://repo.huaweicloud.com/repository/goproxy/
          GONOSUMDB: '*'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pre-commit run --all-files --hook-stage manual --show-diff-on-failure

      - name: Run mypy
        run: |
          PYTHONPATH="$PYTHONPATH:$(pwd)/vllm-empty"
          export PYTHONPATH
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for python_version in "3.10" "3.11" "3.12"; do
            echo "============================"
            tools/mypy.sh 1 "$python_version"
            echo "============================"
          done

  cpu-ut:
    needs: pre-commit
    if: ${{ needs.pre-commit.result == 'success' }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.pre-commit.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      test_groups: >-
        [{"partition_name":"cpu-ut","runner":"linux-amd64-cpu-8-hk","image_tag":"9.1.0-910b-ubuntu22.04-py3.12","npu_type":"cpu","num_npus":0,"tests":"tests/ut"}]
      enable-coverage: false

  recommend-tests:
    name: Recommend tests
    needs: [pre-commit, cpu-ut]
    # The recommendation only runs under the ready-precise label: that is the
    # only mode whose result depends on it. ready-all runs --all-tests and
    # unlabeled runs select nothing, so both skip this job. The pre-commit +
    # cpu-ut checks are explicit so the job can never be made to run after a
    # failed upstream by adding !cancelled().
    if: >-
      ${{
        needs.pre-commit.result == 'success' &&
        needs.cpu-ut.result == 'success' &&
        contains(github.event.pull_request.labels.*.name, 'ready-precise')
      }}
    runs-on: linux-amd64-cpu-8-hk
    outputs:
      coverage_paths: ${{ steps.export-paths.outputs.coverage_paths }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout vllm-ascend scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false

      - name: Download test case map and coverage package
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/test_case_map.json" \
            -o test_case_map.json
          echo "Downloaded test_case_map.json"
          du -h test_case_map.json
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/coverage.tar" \
            -o coverage.tar
          echo "Downloaded coverage.tar"
          du -h coverage.tar
          tar xf coverage.tar vllm-ascend/covstub
          test -d vllm-ascend/covstub
          echo "Extracted vllm-ascend/covstub"
          find vllm-ascend/covstub -maxdepth 2 -type d | head -20 || true

      - name: Recommend tests for current PR
        run: |
          set -euo pipefail
          if ! python3 -c "import regex" >/dev/null 2>&1; then
            echo "regex not found for $(python3 -V); bootstrapping pip and installing regex"
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --break-system-packages
            python3 -m pip install --break-system-packages regex
          fi
          python3 -c "import regex; print('regex ok:', regex.__file__)"
          PR_SPEC="${{ github.repository }}#${{ github.event.pull_request.number }}"
          echo "Selecting tests for PR: ${PR_SPEC}"
          python3 .github/workflows/scripts/test_selector.py \
            --github-pr "${PR_SPEC}" \
            --source-dir ./vllm-ascend/covstub \
            --map-file test_case_map.json

      - name: Merge extra tests from YAML
        run: |
          set -euo pipefail
          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            echo "yaml not found for $(python3 -V); bootstrapping pip and installing pyyaml"
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --break-system-packages
            python3 -m pip install --break-system-packages pyyaml
          fi
          OBS_EXTRA_URL="https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/ci/precision-test/extra_recommended_tests.yaml"
          http_code=$(curl -sSL --retry 3 --retry-delay 5 -o extra_recommended_tests.obs.yaml -w "%{http_code}" "${OBS_EXTRA_URL}" || echo "000")
          if [ "${http_code}" = "200" ] && [ -s extra_recommended_tests.obs.yaml ]; then
            echo "Downloaded extra_recommended_tests.yaml from OBS"
            python3 .github/workflows/scripts/merge_extra_recommended_tests.py \
              --list-file recommended_pytest_paths.txt \
              --extra-yaml extra_recommended_tests.obs.yaml
          else
            echo "No extra_recommended_tests.yaml on OBS (HTTP ${http_code}); skipped"
            rm -f extra_recommended_tests.obs.yaml
          fi

      - name: Export coverage paths output
        id: export-paths
        if: ${{ !cancelled() }}
        run: |
          FILE="recommended_pytest_paths.txt"
          if [ -f "$FILE" ]; then
            {
              echo "coverage_paths<<EOF"
              cat "$FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Exported $(wc -l < "$FILE") recommended paths"
          else
            echo "coverage_paths=" >> "$GITHUB_OUTPUT"
            echo "::notice::recommended_pytest_paths.txt not found"
          fi

  select-tests:
    needs:
      - pre-commit
      - cpu-ut
      - recommend-tests
    # select-tests is the single producer of test_groups / base_sha / has_tests.
    # It runs only when a ready label asks for test execution; unlabeled runs
    # skip it and ci-gate decides whether that is allowed (no src paths) or
    # requires a label (src or ci_pipeline paths present). !cancelled() keeps
    # it out of the graph only when the workflow itself is cancelled; the
    # explicit pre-commit + cpu-ut success check stops it from running when
    # either failed (!cancelled() alone would override the transitive skip).
    # The src/ci_pipeline path categories are computed by the paths-filter step
    # in pre-commit. Modes:
    #   recommended - recommend job succeeded with coverage paths (ready-precise)
    #   all         - ready-all forced, or the PR touches the CI pipeline itself
    #   none        - ready-precise on a PR whose diff recommends no tests
    if: >-
      ${{
        !cancelled() &&
        needs.pre-commit.result == 'success' &&
        needs.cpu-ut.result == 'success' &&
        (
          contains(github.event.pull_request.labels.*.name, 'ready-precise') ||
          contains(github.event.pull_request.labels.*.name, 'ready-all')
        )
      }}
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      has_tests: ${{ steps.scope-rec.outputs.has_tests || steps.scope-all.outputs.has_tests || steps.noop.outputs.has_tests }}
      test_groups: ${{ steps.scope-rec.outputs.test_groups || steps.scope-all.outputs.test_groups || steps.noop.outputs.test_groups }}
      matched_modules: ${{ steps.scope-rec.outputs.matched_modules || steps.scope-all.outputs.matched_modules || steps.noop.outputs.matched_modules }}
      csrc_cache_target_ids: ${{ steps.cache-targets.outputs.target_ids }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
      # source reports which path produced the tests: "recommended", "all", or "none".
      source: ${{ steps.decide.outputs.mode }}
      has_tests_a5: ${{ steps.scope-a5.outputs.has_tests || steps.noop-a5.outputs.has_tests }}
      test_groups_a5: ${{ steps.scope-a5.outputs.test_groups || steps.noop-a5.outputs.test_groups }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve the moving base branch once so test selection, cache
          # production, and cache consumption all receive one immutable SHA.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          # The workflow graph was loaded when the event was created. If its
          # cache control files changed on the base branch since then, pairing
          # the old graph with the new helpers could produce incompatible keys.
          # A rerun reloads the workflow and helpers from a consistent revision.
          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate test coverage config
        run: |
          pip install pyyaml
          python3 .github/workflows/scripts/coverage.py

      - name: Decide test selection mode
        id: decide
        env:
          HAS_READY_PRECISE: ${{ contains(github.event.pull_request.labels.*.name, 'ready-precise') }}
          HAS_READY_ALL: ${{ contains(github.event.pull_request.labels.*.name, 'ready-all') }}
          # Reported by the paths-filter step in the pre-commit job; this job
          # does not run its own filter. Both are diagnostic only here (they
          # decide which modes are *allowed* in ci-gate), the labels above
          # decide which mode *runs*.
          SRC: ${{ needs.pre-commit.outputs.src }}
          CI_PIPELINE: ${{ needs.pre-commit.outputs.ci_pipeline }}
          RECOMMEND_RESULT: ${{ needs.recommend-tests.result }}
          COVERAGE_PATHS: ${{ needs.recommend-tests.outputs.coverage_paths }}
        run: |
          set -euo pipefail
          if [ "${HAS_READY_ALL}" = "true" ]; then
            MODE="all"
          elif [ "${CI_PIPELINE}" = "true" ]; then
            # The PR changes the test selection/execution pipeline itself,
            # so the precise recommendation can no longer be trusted even
            # though ready-precise was set. Escalate to the full suite.
            MODE="all"
          elif [ "${HAS_READY_PRECISE}" = "true" ]; then
            if [ "${RECOMMEND_RESULT}" != "success" ]; then
              echo "::error::Coverage test recommendation did not succeed (result: ${RECOMMEND_RESULT}); not falling back to all tests"
              exit 1
            fi
            if [ -n "${COVERAGE_PATHS// /}" ]; then
              MODE="recommended"
            else
              MODE="none"
            fi
          else
            echo "::error::select-tests ran without a ready label; this is a workflow bug"
            exit 1
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Selection mode: ${MODE} (src=${SRC:-unknown} ci_pipeline=${CI_PIPELINE:-unknown})"

      - name: Select tests from coverage recommendations
        id: scope-rec
        if: steps.decide.outputs.mode == 'recommended'
        env:
          COVERAGE_PATHS: ${{ needs.recommend-tests.outputs.coverage_paths }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install regex pyyaml -q
          LIST_FILE="$RUNNER_TEMP/recommended_from_coverage.txt"
          printf '%s\n' "${COVERAGE_PATHS}" > "$LIST_FILE"
          echo "Recommended paths from coverage:"
          cat "$LIST_FILE"
          python3 .github/workflows/scripts/select_tests.py \
            --test-list-file "$LIST_FILE" \
            --skip-cpu-ut

      - name: Select all tests
        id: scope-all
        if: steps.decide.outputs.mode == 'all'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install regex
          python3 .github/workflows/scripts/select_tests.py \
            --all-tests \
            --skip-cpu-ut

      - name: Set no-tests output when no tests selected
        id: noop
        if: steps.decide.outputs.mode == 'none'
        run: |
          {
            echo "has_tests=false"
            echo "test_groups=[]"
            echo "matched_modules="
            echo "csrc_cache_target_ids=[]"
          } >> "$GITHUB_OUTPUT"

      - name: Select A5 tests
        id: scope-a5
        if: needs.pre-commit.outputs.src == 'true'
        run: |
          git config --global --add safe.directory /__w/vllm-ascend/vllm-ascend
          pip install regex
          python3 .github/workflows/scripts/select_tests.py \
            --curated a5 \
            --runner-label-override linux-aarch64-a5-4

      - name: Set no-tests output for A5 when source paths unchanged
        id: noop-a5
        if: needs.pre-commit.outputs.src != 'true'
        run: |
          {
            echo "has_tests=false"
            echo "test_groups=[]"
          } >> "$GITHUB_OUTPUT"

      - name: Add upstream test cache target
        id: cache-targets
        env:
          SELECTED_TARGET_IDS: ${{ steps.scope-rec.outputs.csrc_cache_target_ids || steps.scope-all.outputs.csrc_cache_target_ids || steps.noop.outputs.csrc_cache_target_ids }}
        run: |
          python3 - <<'PY'
          import json
          import os

          target_ids = json.loads(os.environ["SELECTED_TARGET_IDS"])
          target_ids = sorted(set(target_ids) | {"a2-arm64-ubuntu"})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("target_ids=" + json.dumps(target_ids, separators=(",", ":")), file=output)
          PY

  prepare-csrc-cache:
    needs:
      - select-tests
    # !cancelled() is required: select-tests depends on recommend-tests,
    # which is skipped under ready-all. Without a status check function, the skipped
    # need propagates transitively and skips this job even when select-tests succeeded.
    if: >-
      ${{
        !cancelled() &&
        needs.select-tests.result == 'success' &&
        (
          contains(github.event.pull_request.labels.*.name, 'ready-precise') ||
          contains(github.event.pull_request.labels.*.name, 'ready-a5') ||
          contains(github.event.pull_request.labels.*.name, 'ready-all')
        )
      }}
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}

  run-selected-tests:
    needs:
      - pre-commit
      - select-tests
      - prepare-csrc-cache
    # !cancelled() overrides transitive skip-propagation from recommend-tests
    # (skipped under ready-all) through select-tests, without running after workflow cancel.
    if: >-
      ${{
        !cancelled() &&
        needs.pre-commit.result == 'success' &&
        needs.prepare-csrc-cache.result == 'success' &&
        (
          contains(github.event.pull_request.labels.*.name, 'ready-precise') ||
          contains(github.event.pull_request.labels.*.name, 'ready-all')
        ) &&
        needs.select-tests.outputs.has_tests == 'true'
      }}
    name: run-selected-tests (vllm@${{ matrix.vllm_version_short }})
    strategy:
      fail-fast: false
      matrix:
        # vllm_version keeps the full hash (it becomes the checkout ref in
        # _selected_tests.yaml); only the job name shows the short form.
        # TEMP(main2main): run only the upgraded main lane while collecting
        # all failures. Restore the release lane before merging this PR.
        vllm_version:
          - ${{ needs.pre-commit.outputs.main_commit }}
        vllm_version_short:
          - ${{ needs.pre-commit.outputs.main_commit_short }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ matrix.vllm_version }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.test_groups }}

  run-selected-tests-upstream:
    needs:
      - pre-commit
      - select-tests
      - prepare-csrc-cache
    # !cancelled() overrides transitive skip-propagation from recommend-tests
    # (skipped under ready-all) through select-tests, without running after workflow cancel.
    if: >-
      ${{
        !cancelled() &&
        needs.pre-commit.result == 'success' &&
        needs.prepare-csrc-cache.result == 'success' &&
        contains(github.event.pull_request.labels.*.name, 'ready-precise') &&
        needs.select-tests.outputs.has_tests == 'true'
      }}
    name: run-selected-tests-upstream (vllm@${{ matrix.vllm_version_short }})
    strategy:
      matrix:
        vllm_version:
          - ${{ needs.pre-commit.outputs.main_commit }}
        vllm_version_short:
          - ${{ needs.pre-commit.outputs.main_commit_short }}
    uses: ./.github/workflows/_selected_tests_upstream.yaml
    with:
      vllm: ${{ matrix.vllm_version }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.test_groups }}

  run-selected-tests-a5:
    needs: [pre-commit, select-tests]
    # !cancelled() overrides transitive skip-propagation from recommend-tests
    # (skipped under ready-all) through select-tests, without running after workflow cancel.
    if: >-
      ${{
        !cancelled() &&
        needs.pre-commit.result == 'success' &&
        needs.select-tests.result == 'success' &&
        needs.select-tests.outputs.has_tests_a5 == 'true' &&
        contains(github.event.pull_request.labels.*.name, 'ready-a5')
      }}
    name: run-selected-tests-a5 (vllm@${{ matrix.vllm_version_short }})
    strategy:
      matrix:
        vllm_version:
          - ${{ needs.pre-commit.outputs.main_commit }}
        vllm_version_short:
          - ${{ needs.pre-commit.outputs.main_commit_short }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ matrix.vllm_version }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      test_groups: ${{ needs.select-tests.outputs.test_groups_a5 }}

  # Summary gate job — use this single, stable name as the required status check
  # in GitHub branch protection rules instead of tracking individual matrix job names.
  ci-gate:
    needs: [pre-commit, cpu-ut, select-tests, run-selected-tests, run-selected-tests-a5]
    if: ${{ !cancelled() }}
    runs-on: linux-amd64-cpu-2-hk
    steps:
      - name: Check all required jobs
        env:
          HAS_READY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ready-precise') }}
          HAS_READY_ALL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ready-all') }}
          HAS_READY_A5_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ready-a5') }}
          SELECTION_SOURCE: ${{ needs.select-tests.outputs.source }}
          MATCHED_MODULES: ${{ needs.select-tests.outputs.matched_modules }}
        run: |
          set -euo pipefail

          PRE_COMMIT_RESULT="${{ needs.pre-commit.result }}"
          CPU_UT_RESULT="${{ needs.cpu-ut.result }}"
          SELECT_TESTS_RESULT="${{ needs.select-tests.result }}"
          HAS_TESTS="${{ needs.select-tests.outputs.has_tests == 'true' }}"
          HAS_TESTS_A5="${{ needs.select-tests.outputs.has_tests_a5 }}"

          echo "=== CI Gate Summary ==="
          echo "pre-commit: ${PRE_COMMIT_RESULT}"
          echo "cpu-ut: ${CPU_UT_RESULT}"
          echo "src filter: ${{ needs.pre-commit.outputs.src }}"
          echo "ci_pipeline filter: ${{ needs.pre-commit.outputs.ci_pipeline }}"
          echo "select-tests: ${SELECT_TESTS_RESULT} (source: ${SELECTION_SOURCE:-unknown})"
          echo "has_tests: ${HAS_TESTS}"
          echo "has_tests_a5: ${HAS_TESTS_A5}"
          echo "labels: ready-precise=${HAS_READY_LABEL} ready-all=${HAS_READY_ALL_LABEL} ready-a5=${HAS_READY_A5_LABEL}"
          if [ "${SELECT_TESTS_RESULT}" = "success" ] && [ -n "${MATCHED_MODULES// /}" ]; then
            echo "matched_modules: ${MATCHED_MODULES}"
          fi

          if [ "${PRE_COMMIT_RESULT}" != "success" ]; then
            echo "::error::pre-commit did not succeed (result: ${PRE_COMMIT_RESULT})."
            echo "::error::This job runs lint / markdownlint / mypy / gitleaks on all files. Open the failed 'pre-commit' job above, fix the reported issues in your PR, and push again. No test label is needed for this failure."
            exit 1
          fi

          if [ "${CPU_UT_RESULT}" != "success" ]; then
            echo "::error::cpu-ut did not succeed (result: ${CPU_UT_RESULT})."
            echo "::error::Open the failed 'cpu-ut' job above, fix the failing test(s) and push again."
            exit 1
          fi

          if [ "${SELECT_TESTS_RESULT}" = "skipped" ]; then
            # select-tests only runs under a ready label. An unlabeled run
            # passes the gate when (and only when) the paths-filter in
            # pre-commit found no src or ci_pipeline paths in the diff.
            SRC_FILTER="${{ needs.pre-commit.outputs.src }}"
            CI_PIPELINE_FILTER="${{ needs.pre-commit.outputs.ci_pipeline }}"
            if [ "${SRC_FILTER}" != "true" ] && [ "${CI_PIPELINE_FILTER}" != "true" ]; then
              echo "::notice::No source paths changed; precision tests are not required for this PR."
              echo "=== CI Gate: PASSED ==="
              exit 0
            fi
            echo "::error::This PR touches source code (src=${SRC_FILTER}, ci_pipeline=${CI_PIPELINE_FILTER}), so precision/full tests are required before merge."
            echo "::error::How to fix: a maintainer adds exactly one label to this PR - 'ready-precise' to run the selected tests (recommended), or 'ready-all' to run the full suite. The workflow reruns automatically once the label is added."
            exit 1
          fi

          if [ "${SELECT_TESTS_RESULT}" != "success" ]; then
            echo "::error::select-tests did not succeed (result: ${SELECT_TESTS_RESULT})."
            echo "::error::Open the failed 'select-tests' job above to see which step failed (checkout/rebase, coverage config validation, or test selection). Fix the reported issue and push again."
            exit 1
          fi

          # Even after successful test selection, only explicit true/false
          # values are valid. A missing output must not mean no tests.
          if [ "${HAS_TESTS}" != "true" ] && [ "${HAS_TESTS}" != "false" ]; then
            echo "::error::Invalid or missing has_tests output: '${HAS_TESTS}'"
            exit 1
          fi

          if [ "${HAS_TESTS_A5}" != "true" ] && [ "${HAS_TESTS_A5}" != "false" ]; then
            echo "::error::Invalid or missing has_tests_a5 output: '${HAS_TESTS_A5}'"
            exit 1
          fi

          if [ "${HAS_TESTS}" = "true" ]; then
            TESTS_RESULT="${{ needs.run-selected-tests.result }}"
            echo "run-selected-tests: ${TESTS_RESULT}"
            if [ "${HAS_READY_LABEL}" != "true" ] && [ "${HAS_READY_ALL_LABEL}" != "true" ]; then
              echo "::error::This PR touches source code (test selection source: ${SELECTION_SOURCE:-unknown}), so precision/full tests are required before merge."
              if [ -n "${MATCHED_MODULES// /}" ]; then
                echo "::error::Affected modules: ${MATCHED_MODULES}"
              fi
              echo "::error::How to fix: a maintainer adds exactly one label to this PR - 'ready-precise' to run the selected tests (recommended), or 'ready-all' to run the full suite. The workflow reruns automatically once the label is added."
              exit 1
            fi
            if [ "${TESTS_RESULT}" != "success" ]; then
              echo "::error::run-selected-tests did not succeed (result: ${TESTS_RESULT})."
              if [ "${HAS_READY_ALL_LABEL}" = "true" ]; then
                echo "::error::The 'ready-all' suite failed. Open the failed job(s) inside the run-selected-tests matrix above and fix the failing test(s) or the code change that broke them."
              else
                echo "::error::The 'ready-precise' selected tests failed. Open the failed job(s) inside the run-selected-tests matrix above. If you believe the failures are unrelated to your change, you may ask a maintainer to switch to 'ready-all' for a broader comparison."
              fi
              exit 1
            fi
          fi

          if [ "${HAS_TESTS_A5}" = "true" ]; then
            TESTS_A5_RESULT="${{ needs.run-selected-tests-a5.result }}"
            echo "run-selected-tests-a5: ${TESTS_A5_RESULT}"
            if [ "${TESTS_A5_RESULT}" = "skipped" ] && [ "${HAS_READY_A5_LABEL}" != "true" ]; then
              echo "::notice::run-selected-tests-a5 was skipped because ready-a5 is not set"
            elif [ "${TESTS_A5_RESULT}" != "success" ]; then
              echo "::error::run-selected-tests-a5 did not succeed (result: ${TESTS_A5_RESULT})."
              echo "::error::The A5 test suite failed. Open the failed run-selected-tests-a5 job above for details."
              exit 1
            fi
          fi

          echo "=== CI Gate: PASSED ==="

