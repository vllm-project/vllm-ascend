# TEMPORARY (fork-only validation, do not merge): re-run the a3 PR E2E suite
# (a3-2 and a3-4 partitions) on the offline karc federated scale sets to
# reproduce/diagnose the four_card deepseek w4a8_tp4_basic_greedy mooncake
# TransferEngine init failure:
#   a3-2 -> linux-aarch64-a3-800i-karc-fed-2
#   a3-4 -> linux-aarch64-a3-800i-karc-fed-4
# Card counts, partitions and sharding still come from the repository routing
# tables (test_config.yaml). pre-commit, CPU UT, recommend-tests, precision
# recommendations, upstream vllm suite, a5/310p and the label/ci-gate are
# intentionally omitted so the NPU jobs trigger directly on PR open.
name: E2E

on:
  pull_request:
    types: [opened, reopened, labeled]
    branches: [main]

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-tests:
    runs-on: linux-amd64-cpu-2-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      test_groups: ${{ steps.scope.outputs.test_groups }}
      csrc_cache_target_ids: ${{ steps.scope.outputs.csrc_cache_target_ids }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read verified vLLM main commit
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error::Invalid verified vLLM main commit: ${main_commit}"
            exit 1
          }
          echo "main_commit=${main_commit}" >> "$GITHUB_OUTPUT"

      - name: Select the a3 suite for the karc runners
        id: scope
        run: |
          pip install regex pyyaml
          GITHUB_OUTPUT="$RUNNER_TEMP/all-test-groups.txt" \
            python3 .github/workflows/scripts/select_tests.py --all-tests --skip-cpu-ut --skip-a5
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Keep only the a3 groups (a3-2 / a3-4); CPU UT and a5 are dropped by
          # the flags above, a2/310p are filtered here because this validation
          # targets the a3-800i karc federated scale sets only.
          outputs = dict(
              line.split("=", 1)
              for line in Path(os.environ["RUNNER_TEMP"], "all-test-groups.txt").read_text().splitlines()
          )
          all_groups = json.loads(outputs["test_groups"])
          groups = [group for group in all_groups if group.get("npu_type") == "a3"]
          if not groups:
              raise SystemExit("No a3 test groups selected")

          for group in groups:
              files = str(group["tests"]).split()
              print(
                  f"{group['runner']} ({group.get('num_npus')} card)"
                  f" [part {group.get('partition')}] {len(files)} files"
              )

          target_ids = sorted({group["csrc_cache_target"] for group in groups})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("test_groups=" + json.dumps(groups, separators=(",", ":")), file=output)
              print("csrc_cache_target_ids=" + json.dumps(target_ids), file=output)
          PY

  prepare-csrc-cache:
    needs: select-tests
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}

  run-selected-tests:
    # prepare-csrc-cache is observational (continue-on-error in the reusable
    # workflow) and must not gate the NPU tests; the csrc cache is looked up by
    # the test jobs themselves.
    needs: select-tests
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.test_groups }}
