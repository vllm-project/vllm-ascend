# TEMPORARY: run a few A3 cases on the FED runners to check the
# linux-aarch64-a3-800i-fed-2 / -fed-4 runner pods. Do not merge.
name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, CPU UTs, precision recommendations, other NPU tests, and the label
  # gate are intentionally omitted for this temporary runner validation.
  select-tests:
    runs-on: linux-amd64-cpu-8-hk
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    outputs:
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      test_groups: ${{ steps.scope.outputs.test_groups }}
      csrc_cache_target_ids: ${{ steps.scope.outputs.csrc_cache_target_ids }}
      base_sha: ${{ steps.source-snapshot.outputs.base_sha }}
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve source snapshot
        id: source-snapshot
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Resolve the moving base branch once so test selection, cache
          # production, and cache consumption all receive one immutable SHA.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)

          # The workflow graph was loaded when the event was created. If its
          # cache control files changed on the base branch since then, pairing
          # the old graph with the new helpers could produce incompatible keys.
          # A rerun reloads the workflow and helpers from a consistent revision.
          if ! git diff --quiet "$EVENT_BASE_SHA" "$BASE_SHA" -- \
            .github/workflows/_ensure_csrc_cache.yaml \
            .github/workflows/_build_csrc_cache.yaml \
            .github/workflows/scripts/csrc_cache_targets.json \
            .github/workflows/scripts/resolve_csrc_cache_targets.py; then
            echo "::error::CSRC build workflows changed on $BASE_REF, please rebase the code."
            echo "::error::Trigger a new PR workflow run."
            exit 1
          fi

          git rebase "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read verified vLLM main commit
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${main_commit}" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "::error::Invalid verified vLLM main commit: ${main_commit}"
            exit 1
          }
          echo "main_commit=${main_commit}" >> "$GITHUB_OUTPUT"

      - name: Select a few A3 cases for the 2/4-card FED runners
        id: scope
        run: |
          pip install regex pyyaml
          GITHUB_OUTPUT="$RUNNER_TEMP/all-test-groups.txt" \
            python3 .github/workflows/scripts/select_tests.py --all-tests --skip-cpu-ut --skip-a5
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Smoke settings: one partition per card count, only a few cases.
          KEEP_TESTS = 3
          NPU_COUNTS = (2, 4)

          outputs = dict(
              line.split("=", 1)
              for line in Path(os.environ["RUNNER_TEMP"], "all-test-groups.txt").read_text().splitlines()
          )
          all_groups = json.loads(outputs["test_groups"])
          a3_groups = [group for group in all_groups if group["npu_type"] == "a3"]
          candidates = [
              group
              for group in a3_groups
              if group["num_npus"] in NPU_COUNTS and group.get("partition") in (1, None)
          ]
          # Keep one partition per card count, preferring partition 1.
          candidates.sort(
              key=lambda group: (
                  group["num_npus"],
                  0 if group.get("partition") == 1 else 1,
              )
          )
          picked = {}
          for group in candidates:
              picked.setdefault(group["num_npus"], group)
          if sorted(picked) != sorted(NPU_COUNTS):
              raise SystemExit(f"Expected A3 partitions for {NPU_COUNTS}, got {sorted(picked)}")

          prefix = "linux-aarch64-a3-800i-fed-"
          groups = [picked[count] for count in sorted(picked)]
          for group in groups:
              tests = group["tests"]
              if isinstance(tests, list):
                  group["tests"] = tests[:KEEP_TESTS]
              else:
                  group["tests"] = " ".join(str(tests).split()[:KEEP_TESTS])
              if not group["tests"]:
                  raise SystemExit(f"Empty test selection for {group['num_npus']} cards")
              group["runner"] = prefix + str(group["num_npus"])
              print(f"{group['runner']} / part {group.get('partition')}: {group['tests']}")

          target_ids = sorted({group["csrc_cache_target"] for group in groups})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("test_groups=" + json.dumps(groups, separators=(",", ":")), file=output)
              print("csrc_cache_target_ids=" + json.dumps(target_ids), file=output)
          PY

  prepare-csrc-cache:
    needs: select-tests
    uses: ./.github/workflows/_ensure_csrc_cache.yaml
    with:
      target_ids: ${{ needs.select-tests.outputs.csrc_cache_target_ids }}
      source_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}

  run-selected-tests:
    needs: [select-tests, prepare-csrc-cache]
    # The reusable workflow runs every selected partition in parallel.
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.select-tests.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      base_sha: ${{ needs.select-tests.outputs.base_sha }}
      test_groups: ${{ needs.select-tests.outputs.test_groups }}
