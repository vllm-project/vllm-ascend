name: Revert CI Waiver Label Changed
run-name: >-
  ${{ github.event.label.name == 'skip_ci' &&
      format('{0} skip_ci for PR {1}', github.event.action == 'labeled' && 'Check' || 'Revoke',
             github.event.pull_request.number) ||
      'Ignore unrelated label change' }}

on:
  pull_request:
    types: [labeled, unlabeled]
    branches:
      - main
      - '*-dev'
      - 'releases/v*'

permissions: {}

jobs:
  signal-skip-ci-change:
    if: github.event.label.name == 'skip_ci'
    runs-on: linux-amd64-cpu-1-hk
    steps:
      - run: echo 'The waiver bot will verify the skip_ci label change.'
