# Real CPU-only package verification.  This workflow deliberately uses a
# clean Docker image rather than the CANN-based image used by NPU tests.
name: CPU-only build verification

on:
  pull_request:
    branches:
      - main
      - '*-dev'
      - 'releases/v*'
    paths:
      - 'Dockerfile.cpu'
      - 'tools/cpu_only_build.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'csrc/**'
      - 'vllm_ascend/envs.py'
      - 'vllm_ascend/device/hardware.py'
      - '.github/workflows/cpu_only_build.yaml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.cpu'
      - 'tools/cpu_only_build.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'csrc/**'
      - 'vllm_ascend/envs.py'
      - 'vllm_ascend/device/hardware.py'
      - '.github/workflows/cpu_only_build.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test CPU image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout vllm-ascend
        uses: actions/checkout@v7

      - name: Build CPU-only image
        run: |
          docker build --progress=plain \
            --file Dockerfile.cpu \
            --tag vllm-ascend-cpu-ci:${{ github.sha }} \
            .

      - name: Run CPU-only smoke verification
        run: |
          docker run --rm vllm-ascend-cpu-ci:${{ github.sha }}
