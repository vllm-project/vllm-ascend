name: Presmoke Trigger On Label
on:
  pull_request:
    types: [labeled]
jobs:
  run-presmoke-pipeline:
    if: ${{ github.event.label.name == 'presmoke' }}
    uses: ./.github/workflows/schedule_nightly_image_build_with_base_presmoke.yaml
    with:
      # 对齐上游workflow注释：os 只允许 ubuntu / openeuler
      os: "ubuntu"
      soc: "910b"
      target: "a2"
      dockerfile: "Dockerfile"
      suffix: "presmoke"
      # ⚠️ PR presmoke场景：不从nightly镜像链继承，这个字段不再作为镜像tag
      vllm_ascend_branch: ${{ github.event.pull_request.base.ref }}
      # base.ref 给 nightly Dockerfile FROM 和 rebase 目标（需要分支名）
      base_image_branch: ${{ github.event.pull_request.base.ref }}
      # head.sha 只给 checkout、冒烟测试拉取本次PR代码
      vllm_ref_for_test: ${{ github.event.pull_request.head.sha }}
      should_push: false
      run_presmoke: true
      # 新增标记：presmoke走原始CANN基础镜像从头构建，不依赖nightly预构建镜像
      build_from_raw_base: true
    secrets: inherit
