name: Presmoke Trigger On Label
on:
  pull_request:
    types: [labeled]

jobs:
  run-presmoke-pipeline:
    if: ${{ github.event.label.name == 'presmoke' }}
    uses: ./.github/workflows/schedule_nightly_image_build_with_base_presmoke.yaml
    with:
      # 对齐上游workflow注释：os 只允许 ubuntu / openeuler
      os: "ubuntu"
      soc: "910b"
      target: "a2"
      dockerfile: "Dockerfile"
      suffix: "presmoke"
      # ========== 核心修改：head.ref → head.sha ==========
      vllm_ascend_branch: ${{ github.event.pull_request.head.sha }}
      # ==================================================
      base_image_branch: ${{ github.event.pull_request.base.ref }}
      vllm_ref_for_test: ${{ github.event.pull_request.head.sha }}
      should_push: false
      run_presmoke: true
    secrets: inherit
