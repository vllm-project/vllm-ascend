name: Presmoke Trigger
# pull_request_target is required so fork PRs can obtain the SWR credentials
# (the pull_request event exposes no secret to forks). The workflow file itself
# is read from the base branch, so this only takes effect once merged into main.
# Security note: only a maintainer applying the presmoke label can enter the
# pipeline, and the build uses the PR head code -- applying the label is
# therefore equivalent to granting that commit access to the SWR write
# credentials.
on:
  pull_request_target:
    types: [labeled]
  # Same-repository branches can also be triggered manually, for builds that do
  # not come with a PR.
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        type: choice
        options: ['a2', 'a3', 'a5', '310p']
        default: 'a2'
      dockerfile:
        description: 'Root Dockerfile used to build the runtime image'
        type: string
        default: 'Dockerfile'
      soc:
        description: 'Ascend SoC type'
        type: string
        default: '910b'

permissions:
  contents: read

jobs:
  run-presmoke-pipeline:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'presmoke' }}
    uses: ./.github/workflows/schedule_nightly_image_build_with_base_presmoke.yaml
    with:
      os: "ubuntu"
      soc: ${{ github.event.inputs.soc || '910b' }}
      target: ${{ github.event.inputs.target || 'a2' }}
      dockerfile: ${{ github.event.inputs.dockerfile || 'Dockerfile' }}
      suffix: "presmoke"
      vllm_ascend_branch: ${{ github.event.pull_request.head.sha || github.ref_name }}
      base_image_branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
      should_push: true
      run_presmoke: true
      build_from_raw_base: true
    secrets: inherit
