# This workflow related to the resources atlas 800 A5
# **Please note**: current A5 resource pool's maximum allowed concurrency is 5*16 NPUs
# We will limit the concurrency of jobs on A5 to avoid the risk of insufficient resources
name: Nightly-A5

on:
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch to test'
        required: true
        default: 'main'
        type: string
      test_cases:
        description: 'Test cases to run (comma-separated, e.g., "test_custom_op,qwen3-32b,accuracy-group" or "all" for all tests)'
        required: false
        default: 'all'
        type: string
      request_id:
        description: 'Unique request ID from the triggering workflow for run identification'
        required: false
        default: ''
        type: string
      skip_build_image:
        description: 'Skip build-image job (used when triggered by /nightly command)'
        required: false
        default: 'false'
        type: string
      vllm_ascend_ref:
        description: 'PR commit SHA for PR-triggered tests'
        required: false
        default: ''
        type: string
      aop_enabled:
        description: 'Enable AOP hooks (capture / classify / skip-or-process)'
        required: false
        default: false
        type: boolean
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read

defaults:
  run:
    shell: bash -el {0}

concurrency:
  group: ascend-nightly-${{ github.ref }}-a5${{ inputs.request_id && format('-{0}', inputs.request_id) || '' }}
  cancel-in-progress: true

env:
  ASCEND_LOG_PREFIX: '/root/.cache/ascend-logs'

jobs:
  parse-trigger:
    name: Parse trigger and determine test scope
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'nightly-test'))
    runs-on: linux-aarch64-a5-8
    outputs:
      run: ${{ steps.set.outputs.run }}
      filter: ${{ steps.set.outputs.filter }}
      ref: ${{ steps.set.outputs.ref }}
      request_id: ${{ steps.set.outputs.request_id }}
      vllm_ascend_branch: ${{ steps.set.outputs.vllm_ascend_branch }}
      is_pr_event: ${{ steps.set.outputs.is_pr_event }}
    steps:
      - name: Set trigger outputs
        id: set
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName;
            let testFilter = 'all';
            let runFlag = 'false';
            let prRef = '';
            let branch = 'main';
            if (eventName === 'pull_request') {
              const labels = context.payload.pull_request.labels.map(l => l.name);
              if (labels.includes('nightly-test')) {
                runFlag = 'true';
                prRef = context.payload.pull_request.head.sha;
              }
            } else if (eventName === 'workflow_dispatch') {
              testFilter = core.getInput('test_cases') || 'all';
              branch = core.getInput('vllm_ascend_branch') || 'main';
              runFlag = 'true';
            }
            core.setOutput('run', runFlag);
            core.setOutput('filter', testFilter);
            core.setOutput('ref', prRef);
            core.setOutput('request_id', core.getInput('request_id'));
            core.setOutput('vllm_ascend_branch', branch);
            core.setOutput('is_pr_event', eventName === 'pull_request' ? 'true' : 'false');

  setup-vars:
    name: Export global env vars as job outputs
    needs: parse-trigger
    runs-on: linux-amd64-cpu-8-hk
    outputs:
      ascend_log_prefix: ${{ steps.export.outputs.ascend_log_prefix }}
      vllm_ascend_branches: ${{ steps.export.outputs.vllm_ascend_branches }}
      multi_node: ${{ steps.set-matrix.outputs.multi_node }}
      double_node: ${{ steps.set-matrix.outputs.double_node }}
      single_node: ${{ steps.set-matrix.outputs.single_node }}
      multi_card: ${{ steps.set-matrix.outputs.multi_card }}
    steps:
      - id: export
        run: |
          {
            echo "ascend_log_prefix=${{ env.ASCEND_LOG_PREFIX }}"
            input_branch="${{ needs['parse-trigger'].outputs.vllm_ascend_branch }}"
            normalized=$(echo "$input_branch" | tr '/' '-')
            echo "vllm_ascend_branches=[\"${normalized}\"]"
          } >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{ github.event_name == 'pull_request' && needs['parse-trigger'].outputs.ref || '' }}

      - name: Checkout PR code
        if: github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.vllm_ascend_ref }}
          sparse-checkout: .github/workflows/configs/
          path: ./pr

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read A5 test matrix config
        id: set-matrix
        env:
          MATRIX_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_ascend_ref != '' && './pr/.github/workflows/configs/nightly_config.yaml' || '.github/workflows/configs/nightly_config.yaml' }}
          MATRIX_OUTPUTS: '{"multi_node":"a5.multi_node.test_config","double_node":"a5.double_node.test_config","single_node":"a5.single_node.test_config","multi_card":"a5.multi_card.test_config"}'
        run: |
          python3 -m pip install pyyaml -q
          python3 .github/workflows/scripts/resolve_nightly_tests.py --mode=matrix

      - name: Print matrix value debug
        run: |
          echo "::notice title=single_node::${{ steps.set-matrix.outputs.single_node }}"
          echo "::notice title=multi_node::${{ steps.set-matrix.outputs.multi_node }}"
          echo "::notice title=double_node::${{ steps.set-matrix.outputs.double_node }}"
          echo "::notice title=multi_card::${{ steps.set-matrix.outputs.multi_card }}"
          echo "::notice title=RUN_FLAG::${{ needs['parse-trigger'].outputs.run }}"

