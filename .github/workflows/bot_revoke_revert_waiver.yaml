name: Revoke Revert CI Waiver

on:
  workflow_run:
    workflows: [Revert CI Waiver Removed]
    types: [completed]

jobs:
  revoke-revert-waiver:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.display_title, 'Revoke skip_ci for PR ')
    runs-on: linux-amd64-cpu-2-hk
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: revert-ci-waiver-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      # The relay's title is untrusted. Only the default branch script runs
      # with write access, and it verifies the change against GitHub's API.
      - name: Checkout this repository's default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
          fetch-depth: 1

      - name: Revoke the waiver and start regular CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python3 .github/workflows/scripts/revoke_revert_waiver.py
