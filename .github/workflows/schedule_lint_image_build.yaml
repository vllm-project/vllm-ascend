name: 'Image build lint'
on:
  schedule:
    # Runs daily at 20:00 UTC
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'releases/v*'
    paths:
      - '.github/workflows/schedule_lint_image_build.yaml'
      - '.github/vllm-main-verified.commit'
      - '.github/workflows/dockerfiles/Dockerfile.lint'
      - 'requirements-lint.txt'
      - 'requirements-dev.txt'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: quay.io/atlas-ci/vllm-ascend-ci

jobs:
  build:
    # Only maintained branches may publish; manual runs follow the same rule.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/v')
    name: vllm-ascend lint image build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image tag
        id: image
        env:
          LINT_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          tag=lint-main
          if [[ "$LINT_REF" != main ]]; then
            [[ "$LINT_REF" =~ ^releases/v[0-9][0-9A-Za-z._-]*$ ]] || {
              echo "::error::Unsupported release branch: $LINT_REF"
              exit 1
            }
            tag="lint-${LINT_REF//\//-}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ASCEND_CI_USERNAME }}
          password: ${{ secrets.QUAY_ASCEND_CI_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - name: Read verified vLLM commit
        id: vllm
        run: |
          commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]] || { echo '::error::Invalid vLLM commit'; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Build and push lint image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/dockerfiles/Dockerfile.lint
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.tag }}
          push: true
          provenance: false
          build-args: |
            VLLM_COMMIT=${{ steps.vllm.outputs.commit }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
