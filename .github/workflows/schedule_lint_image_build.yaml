name: 'Image build lint'
on:
  schedule:
    # Runs at 00:00 UTC+8 every day
    - cron: '0 20 * * *' 
  workflow_dispatch:
  push:
    paths:
      - '.github/vllm-main-verified.commit'
      - '.github/workflows/dockerfiles/Dockerfile.lint'
      - 'requirements-lint.txt'
      - 'requirements-dev.txt'
      - 'requirements.txt'

# only cancel in-progress runs of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: vllm-ascend lint image build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Print
      run: |
        lscpu
    - name: Resolve Quay image
      id: quay
      env:
        FORK_QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE || secrets.QUAY_NAMESPACE }}
        FORK_QUAY_USERNAME: ${{ vars.QUAY_USERNAME || secrets.QUAY_USERNAME }}
      run: |
        if [ "${GITHUB_REPOSITORY}" = "vllm-project/vllm-ascend" ]; then
          echo "image=quay.io/ascend-ci/vllm-ascend" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        quay_namespace="${FORK_QUAY_NAMESPACE:-$FORK_QUAY_USERNAME}"
        if [ -z "$quay_namespace" ]; then
          echo "::error::Set QUAY_NAMESPACE or QUAY_USERNAME as a repository variable or secret for fork image pushes."
          exit 1
        fi

        if ! echo "$quay_namespace" | grep -qE '^[a-z0-9._-]+$'; then
          echo "::error::Quay namespace must be lowercase and contain only letters, digits, '.', '_' or '-'."
          exit 1
        fi

        echo "image=quay.io/${quay_namespace}/vllm-ascend" >> "$GITHUB_OUTPUT"

    - name: Validate Quay credentials
      env:
        QUAY_USERNAME: ${{ github.repository == 'vllm-project/vllm-ascend' && vars.QUAY_CI_USERNAME || vars.QUAY_USERNAME || secrets.QUAY_USERNAME }}
        QUAY_PASSWORD: ${{ github.repository == 'vllm-project/vllm-ascend' && secrets.QUAY_CI_PASSWORD || secrets.QUAY_PASSWORD }}
      run: |
        if [ -z "$QUAY_USERNAME" ]; then
          echo "::error::Quay username is not configured."
          exit 1
        fi
        if [ -z "$QUAY_PASSWORD" ]; then
          echo "::error::Quay password is not configured."
          exit 1
        fi

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ steps.quay.outputs.image }}
        tags: lint
        flavor:
          latest=false

    - name: Read verified vLLM commit
      id: vllm
      run: |
        vllm_commit="$(cat .github/vllm-main-verified.commit)"
        [ -n "$vllm_commit" ] || { echo "::error::vLLM commit is empty"; exit 1; }
        echo "main_commit=$vllm_commit" >> "$GITHUB_OUTPUT"

    - name: Build - Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Build - Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Publish - Login to Quay Container Registry
      uses: docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ github.repository == 'vllm-project/vllm-ascend' && vars.QUAY_CI_USERNAME || vars.QUAY_USERNAME || secrets.QUAY_USERNAME }}
        password: ${{ github.repository == 'vllm-project/vllm-ascend' && secrets.QUAY_CI_PASSWORD || secrets.QUAY_PASSWORD }}

    - name: Build and push
      if: ${{ github.event_name != 'workflow_dispatch' }}
      uses: docker/build-push-action@v7
      with:
        # For now, we only build amd64 lint image
        platforms: 'linux/amd64'
        context: .
        file: .github/workflows/dockerfiles/Dockerfile.lint
        push: true
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.meta.outputs.tags }}
        build-args: |
          VLLM_COMMIT=${{ steps.vllm.outputs.main_commit }}
        provenance: false

    - name: Build and push
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v7
      with:
        # For now, we only build amd64 lint image
        platforms: 'linux/amd64'
        context: .
        file: .github/workflows/dockerfiles/Dockerfile.lint
        push: true
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.meta.outputs.tags }}
        build-args: |
          VLLM_COMMIT=${{ steps.vllm.outputs.main_commit }}
        provenance: false
