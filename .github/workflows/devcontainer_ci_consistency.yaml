#
# 验证目标：门禁 CI 执行环境 与 开发环境 devcontainer 的一致性。
#
# 原理：devcontainers/ci 会读取 .devcontainer/{cpu,a3}/devcontainer.json，
# 在其 up 阶段自动执行 devcontainer.json 里声明的 postCreateCommand——这正是
# 本仓库开发容器「首次创建时」运行的编译 + 测试脚本。因此只要这个 workflow
# 能跑通，就说明同一套 devcontainer 配置在「本地 VS Code Dev Container」与
# 「GitHub Actions CI」两种环境下产出一致。
#
# cpu  job：nightly-main 镜像（amd64），跑 cpu-ut（门禁 pr_test.yaml 的
#           cpu-ut 阶段，即 tests/ut without-device）。GitHub 托管
#           ubuntu-latest 即可，无需 NPU。
# npu  job：nightly-main-a3 镜像（arm64），跑 two_card with-device
#           （门禁 run-selected-tests 的 a3-2 分区）。需要带昇腾卡的
#           self-hosted runner（GitHub 不提供 NPU），label 通过手动触发参数传入。
name: Devcontainer CI Consistency

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - 'main'
      - '*-dev'
      - 'releases/v*'
  workflow_dispatch:
    inputs:
      target:
        description: '要验证的目标（cpu / npu / all）'
        type: choice
        required: true
        default: 'cpu'
        options:
          - cpu
          - npu
          - all
      npu_runner:
        description: 'NPU self-hosted runner 的 label（仅 npu/all 需要）'
        type: string
        required: false
        default: 'linux-aarch64-a3-2'

permissions:
  contents: read

jobs:
  cpu:
    if: ${{ github.event_name == 'pull_request' || inputs.target == 'cpu' || inputs.target == 'all' }}
    name: cpu-ut (devcontainer/cpu, nightly-main)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # devcontainer.json 里 mount 了 ${localEnv:HOME}/.cache（本地开发时共享
      # 宿主机 pip 缓存）。GitHub runner 上 /home/runner/.cache 不存在，导致
      # docker bind mount 失败，需先创建该目录。
      - name: Ensure host cache dir exists
        run: mkdir -p "${HOME}/.cache"

      # devcontainers/ci 在 up 阶段自动执行 .devcontainer/cpu/devcontainer.json
      # 的 postCreateCommand（= 门禁 cpu-ut 的编译 + 测试脚本）。
      # runCmd 只是容器起来后的占位命令，真正的验证发生在 postCreateCommand。
      - name: Build & run cpu devcontainer (postCreateCommand = cpu-ut)
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cpu/devcontainer.json
          push: never
          runCmd: echo "devcontainer cpu postCreateCommand (cpu-ut) completed"

  npu:
    if: ${{ github.event_name == 'pull_request' || inputs.target == 'npu' || inputs.target == 'all' }}
    name: a3 two-card device tests (devcontainer/a3, nightly-main-a3)
    runs-on: ${{ github.event_name == 'pull_request' && 'linux-aarch64-a3-2' || inputs.npu_runner }}
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure host cache dir exists
        run: mkdir -p "${HOME}/.cache"

      # self-hosted runner 不自带 node/npm，而 devcontainers/ci 内部用
      # `npm install -g @devcontainers/cli` 安装 CLI，缺 npm 会直接失败。
      # 内网 runner 访问不了 nodejs.org / GitHub releases，不能走 setup-node
      # （会卡在下载）；改为从华为云镜像拉取，与 schedule_main2main.yaml 一致。
      - name: Install Node.js from HuaweiCloud mirror
        env:
          NODE_VERSION: 24.18.0
        run: |
          set -euxo pipefail
          NODE_INSTALL_DIR="/opt/nodejs"
          NODE_ARCHIVE_NAME="node-v${NODE_VERSION}-linux-arm64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "/tmp/${NODE_ARCHIVE_NAME}" \
            "https://repo.huaweicloud.com/nodejs/v${NODE_VERSION}/${NODE_ARCHIVE_NAME}"
          mkdir -p "${NODE_INSTALL_DIR}"
          tar -xzf "/tmp/${NODE_ARCHIVE_NAME}" --strip-components=1 -C "${NODE_INSTALL_DIR}"
          echo "${NODE_INSTALL_DIR}/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      # 同上，up 阶段自动执行 .devcontainer/a3/devcontainer.json 的
      # postCreateCommand（= 门禁 a3-2 with-device 的编译 + 测试脚本）。
      - name: Build & run npu devcontainer (postCreateCommand = a3 device tests)
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/a3/devcontainer.json
          push: never
          runCmd: echo "devcontainer npu postCreateCommand (a3 two-card) completed"