name: Selected Tests
on:
  workflow_call:
    inputs:
      base_ref:
        required: false
        type: string
      base_sha:
        required: false
        type: string
      ref:
        required: false
        type: string
      test_groups:
        required: false
        type: string
      vllm:
        required: false
        type: boolean
      # ========== 新增下面3个，把参数加回来 ==========
      upload_timing:
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 60
      enable-coverage:
        required: false
        type: boolean
        default: false
    secrets:
      OBS_ACCESS_KEY_PRECISION:
        required: false
      OBS_SECRET_ACCESS_KEY_PRECISION:
        required: false
    outputs:
      coverage_artifact_name:
        value: ${{ jobs.dispatch.outputs.coverage_artifact_name }}

jobs:
  dispatch:
    name: dispatch-groups
    runs-on: ubuntu-latest
    outputs:
      coverage_artifact_name: npu-coverage-report
      matrix_json: ${{ steps.gen_matrix.outputs.matrix_json }}
    steps:
      - name: Generate matrix from test_groups
        id: gen_matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          groups = json.loads(os.environ["TEST_GROUPS"])
          matrix_entries = []
          for g in groups:
              matrix_entries.append({
                  "runner_label": g["runner_label"],
                  "npu_type": g["npu_type"],
                  "test_paths": g["test_paths"]
              })
          out = json.dumps(matrix_entries)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix_json={out}\n")
          PY
        env:
          TEST_GROUPS: ${{ inputs.test_groups }}

  run_shards:
    name: test-shard-${{ matrix.entry.npu_type }}
    needs: dispatch
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.dispatch.outputs.matrix_json) }}
    runs-on: ${{ matrix.entry.runner_label }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Rebase to base_sha (NPU mandatory)
        run: |
          set -euo pipefail
          git config user.name "ci-runner"
          git config user.email "ci@runner.local"
          git rebase "${BASE_SHA}"
        env:
          BASE_SHA: ${{ inputs.base_sha }}

      - name: Setup CANN & build environment
        run: |
          set -euo pipefail
          echo "ASCEND_TOOLKIT_PATH=/usr/local/Ascend/ascend-toolkit" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
          key: ccache-${{ inputs.base_sha }}-${{ matrix.entry.npu_type }}

      - name: Install python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-cov

      - name: Show npu-smi device status
        run: |
          npu-smi info || true

      - name: Run pytest with coverage
        run: |
          set -euo pipefail
          TEST_PATHS="${{ join(matrix.entry.test_paths, ' ') }}"
          echo "test paths: ${TEST_PATHS}"
          python3 -m pytest -v --cov=./ --cov-report=xml:coverage.xml ${TEST_PATHS}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: npu-coverage-report-${{ matrix.entry.npu_type }}
          path: coverage.xml
          retention-days: 7
