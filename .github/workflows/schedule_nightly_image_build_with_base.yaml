# This workflow chains the runtime image build and the nightly test image build into
# a single run, with one independent pipeline per (chip, OS) pair so a slow runtime
# image only blocks its own nightly image:
#   for each (chip, os): build-base-<chip>-<os> -> build-nightly-<chip>-<os>
# Each pair is a separate invocation of _schedule_nightly_pair_image_build.yaml, which
# builds the runtime image (via _schedule_image_build.yaml) and then the matching
# nightly test image (via _nightly_image_build.yaml) on top of it.
#
# All dependency versions (CANN, torch-npu, triton-ascend, memcache, memfabric,
# vLLM) are pinned in the root Dockerfiles, so this workflow only selects the
# source branch and, optionally, the chips to build.
name: Nightly Image Build (with base)

on:
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch to nightly test'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - releases/v0.30.0
          - releases/v0.29.0rc
          - releases/v0.28.0rc
          - releases/v0.27.1rc
          - releases/v0.26.0rc
          - releases/v0.25.1rc
          - releases/v0.24.0rc
          - releases/v0.23.0
          - releases/v0.22.1rc
          - releases/v0.21.0rc
          - releases/v0.20.2rc
          - releases/v0.18.0
      chips:
        description: 'Chips to build (JSON array: ["a2","a3","310p","a5"]). Default builds all.'
        required: false
        default: '["a2","a3","310p","a5"]'
        type: string
      skip_base:
        description: 'If true, skip the base image build and only build the nightly image (base image must already exist).'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  setup-matrix:
    runs-on: linux-amd64-cpu-2-hk
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
    steps:
      - name: Filter build matrix by chips
        id: matrix
        run: |
          CHIPS='${{ inputs.chips || '["a2","a3","310p","a5"]' }}'
          ALL=$(jq -nc '[
            {target:"a2",   os:"ubuntu",    soc:"910b", dockerfile:"Dockerfile",               suffix:""},
            {target:"a3",   os:"ubuntu",    soc:"a3",   dockerfile:"Dockerfile.a3",             suffix:"a3"},
            {target:"310p", os:"ubuntu",    soc:"310p", dockerfile:"Dockerfile.310p",           suffix:"310p"},
            {target:"a5",   os:"ubuntu",    soc:"950",  dockerfile:"Dockerfile.a5",             suffix:"a5"},
            {target:"a2",   os:"openeuler", soc:"910b", dockerfile:"Dockerfile.openEuler",      suffix:"openeuler"},
            {target:"a3",   os:"openeuler", soc:"a3",   dockerfile:"Dockerfile.a3.openEuler",   suffix:"a3-openeuler"},
            {target:"310p", os:"openeuler", soc:"310p", dockerfile:"Dockerfile.310p.openEuler", suffix:"310p-openeuler"},
            {target:"a5",   os:"openeuler", soc:"950",  dockerfile:"Dockerfile.a5.openEuler",   suffix:"a5-openeuler"}
          ]')
          FILTERED=$(echo "$ALL" | jq -c --argjson chips "$CHIPS" \
            '[.[] | select(.target as $t | $chips | index($t))]')
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"
          if [ "$FILTERED" = "[]" ]; then
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build nightly-${{ matrix.target }} (${{ matrix.os }})
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.has_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_schedule_nightly_pair_image_build.yaml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      soc: ${{ matrix.soc }}
      dockerfile: ${{ matrix.dockerfile }}
      suffix: ${{ matrix.suffix }}
      vllm_ascend_branch: ${{ inputs.vllm_ascend_branch || 'main' }}
      base_image_branch: ${{ inputs.vllm_ascend_branch || 'main' }}
      # Build both architectures for every OS, keeping the fixed runner mapping
      # (and therefore the build cache) used by the nightly pipeline.
      build_type: 'full'
      should_push: ${{ github.repository == 'vllm-project/vllm-ascend' }}
      skip_base: ${{ inputs.skip_base || false }}
      swr_registry: 'swr.cn-north-12.myhuaweicloud.com'
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}
