# This workflow chains the runtime image build and the nightly test image build into
# a single run, with one independent pipeline per (chip, OS) pair so a slow runtime
# image only blocks its own nightly image:
#   for each (chip, os): build-base-<chip>-<os> -> build-nightly-<chip>-<os>
# Each pair is a separate invocation of _schedule_nightly_pair_image_build.yaml, which
# builds the runtime image (via _schedule_image_build.yaml) and then the matching
# nightly test image (via _nightly_image_build.yaml) on top of it.
#
# All dependency versions (CANN, torch-npu, triton-ascend, memcache, memfabric,
# vLLM, mooncake) are pinned in requirements.txt and the root Dockerfiles, so
# this workflow only selects the source branch and, optionally, the chips to build.
name: Nightly Image Build (with base)

on:
  workflow_dispatch:
    inputs:
      vllm_ascend_branch:
        description: 'Branch to nightly test'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - releases/v0.32.0rc
          - releases/v0.30.0
          - releases/v0.29.0rc
          - releases/v0.28.0rc
          - releases/v0.27.1rc
          - releases/v0.26.0rc
          - releases/v0.25.1rc
          - releases/v0.24.0rc
          - releases/v0.23.0
          - releases/v0.22.1rc
          - releases/v0.21.0rc
          - releases/v0.20.2rc
          - releases/v0.18.0
      chips:
        description: 'Chips to build (JSON array: ["a2","a3","310p","a5"]). Default builds all.'
        required: false
        default: '["a2","a3","310p","a5"]'
        type: string
      skip_base:
        description: 'If true, skip the base image build and only build the nightly image (base image must already exist).'
        required: false
        default: false
        type: boolean
      isolated_build:
        description: "If true, publish an isolated build (/presmoke) instead of the standard nightly artifacts. Everything isolation-related is derived from this single flag: both layers are built full-scale (amd64+arm64 for ubuntu and openEuler), the tags are unchanged and only the '-presmoke' CI repositories differ (ascend/vllm-ascend-presmoke, base_image/ascend-ci/vllm-ascend-presmoke), images are never pushed to atlas_inference and never synced to quay.io or swr.cn-north-4. Default false keeps the standard nightly behaviour untouched."
        required: false
        default: false
        type: boolean
      source_ref:
        description: "Optional git ref the whole source tree is built from (e.g. refs/pull/<n>/head). /presmoke passes the triggering PR so both layers are built from the code and Dockerfiles under review ('pre-merge'), while vllm_ascend_branch still decides the branch and the published tag. Empty builds vllm_ascend_branch."
        required: false
        default: ''
        type: string
      pr_number:
        description: "Build a pull request instead of a branch. The PR is merged into its base branch (or checked out as head when pr_ref_mode=head) and both image layers are built from it. PR builds are published only to the isolated '-presmoke' repositories with a per-PR tag suffix, so they never overwrite the standard nightly artifacts. Takes precedence over source_ref and vllm_ascend_branch."
        required: false
        default: ''
        type: string
      pr_ref_mode:
        description: "Which PR ref to build: merge = the PR merged into its base branch (recommended); head = the PR head commit only."
        required: false
        default: 'merge'
        type: choice
        options:
          - merge
          - head

permissions:
  actions: read
  packages: write
  contents: read
  pull-requests: read

jobs:
  setup-matrix:
    runs-on: linux-amd64-cpu-1-hk
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_matrix: ${{ steps.matrix.outputs.has_matrix }}
      pr_source_ref: ${{ steps.resolve_pr.outputs.source_ref }}
      pr_base_ref: ${{ steps.resolve_pr.outputs.base_ref }}
    steps:
      # Needed only to run resolve_pr_ref.sh; always check out the ref this
      # workflow file came from, never the PR under review.
      - uses: actions/checkout@v7
        if: ${{ inputs.pr_number != '' }}
        with:
          fetch-depth: 1

      - name: Resolve PR ref
        id: resolve_pr
        if: ${{ inputs.pr_number != '' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_REF_MODE: ${{ inputs.pr_ref_mode }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/resolve_pr_ref.sh

      - name: Validate PR build options
        if: ${{ inputs.pr_number != '' }}
        run: |
          if [ "${{ inputs.skip_base }}" = "true" ]; then
            echo "::error::skip_base cannot be combined with pr_number: the base image carries a per-PR tag and must be built in the same run"
            exit 1
          fi

      - name: Filter build matrix by chips
        id: matrix
        run: |
          CHIPS='${{ inputs.chips || '["a2","a3","310p","a5"]' }}'
          ALL=$(jq -nc '[
            {target:"a2",   os:"ubuntu",    soc:"910b", dockerfile:"Dockerfile",               suffix:""},
            {target:"a3",   os:"ubuntu",    soc:"a3",   dockerfile:"Dockerfile.a3",             suffix:"a3"},
            {target:"310p", os:"ubuntu",    soc:"310p", dockerfile:"Dockerfile.310p",           suffix:"310p"},
            {target:"a5",   os:"ubuntu",    soc:"950",  dockerfile:"Dockerfile.a5",             suffix:"a5"},
            {target:"a2",   os:"openeuler", soc:"910b", dockerfile:"Dockerfile.openEuler",      suffix:"openeuler"},
            {target:"a3",   os:"openeuler", soc:"a3",   dockerfile:"Dockerfile.a3.openEuler",   suffix:"a3-openeuler"},
            {target:"310p", os:"openeuler", soc:"310p", dockerfile:"Dockerfile.310p.openEuler", suffix:"310p-openeuler"},
            {target:"a5",   os:"openeuler", soc:"950",  dockerfile:"Dockerfile.a5.openEuler",   suffix:"a5-openeuler"}
          ]')
          FILTERED=$(echo "$ALL" | jq -c --argjson chips "$CHIPS" \
            '[.[] | select(.target as $t | $chips | index($t))]')
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"
          if [ "$FILTERED" = "[]" ]; then
            echo "has_matrix=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_matrix=true" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build nightly-${{ matrix.target }} (${{ matrix.os }})
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.has_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    uses: ./.github/workflows/_schedule_nightly_pair_image_build.yaml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      soc: ${{ matrix.soc }}
      dockerfile: ${{ matrix.dockerfile }}
      # A PR build appends a per-PR suffix so its images never overwrite a
      # concurrent PR build or the standard nightly tags. The suffix input has
      # no leading '-' (it joins '-a3' + '-pr7' into 'a3-pr7'), while
      # tag_suffix is used verbatim after the Dockerfile OS mark ('-pr7').
      suffix: ${{ matrix.suffix }}${{ inputs.pr_number != '' && matrix.suffix != '' && format('-pr{0}', inputs.pr_number) || inputs.pr_number != '' && format('pr{0}', inputs.pr_number) || '' }}
      tag_suffix: ${{ inputs.pr_number != '' && format('-pr{0}', inputs.pr_number) || '' }}
      vllm_ascend_branch: ${{ needs.setup-matrix.outputs.pr_base_ref || inputs.vllm_ascend_branch || 'main' }}
      base_image_branch: ${{ needs.setup-matrix.outputs.pr_base_ref || inputs.vllm_ascend_branch || 'main' }}
      source_ref: ${{ needs.setup-matrix.outputs.pr_source_ref || inputs.source_ref }}
      # The standard nightly pipeline builds both architectures for every OS,
      # keeping the fixed runner mapping (and therefore the build cache).
      # PR builds reuse the isolated repositories so they cannot touch the
      # standard nightly images (see the per-PR suffix above for tag isolation).
      isolated_build: ${{ inputs.isolated_build || inputs.pr_number != '' }}
      should_push: ${{ github.repository == 'vllm-project/vllm-ascend' }}
      skip_base: ${{ inputs.skip_base || false }}
      swr_registry: 'swr.cn-north-12.myhuaweicloud.com'
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
      SYNC_TOOLS_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}

  collect-build-info:
    needs: [setup-matrix, build-image]
    permissions:
      actions: write
      contents: read
    # An intentionally skipped base is excluded from expected_types_json;
    # missing nightly reports still make the collector fail.
    # Isolated builds (published to the '-presmoke' repositories) are not part of
    # the standard nightly artifacts and must not be collected.
    if: ${{ always() && needs.setup-matrix.result == 'success' && needs.setup-matrix.outputs.has_matrix == 'true' && github.repository == 'vllm-project/vllm-ascend' && !inputs.isolated_build && inputs.pr_number == '' }}
    uses: ./.github/workflows/_collect_build_info.yaml
    with:
      branch: ${{ inputs.vllm_ascend_branch }}
      targets_json: ${{ needs.setup-matrix.outputs.matrix }}
      expected_types_json: ${{ inputs.skip_base && '["nightly"]' || '["base","nightly"]' }}
      obs_bucket: vllm-ascend
      obs_endpoint: https://obs.cn-north-4.myhuaweicloud.com
      obs_region: cn-north-4
      obs_prefix: ci/build-info
    secrets:
      BUILD_INFO_OBS_AK: ${{ secrets.OBS_ACCESS_KEY_PRECISION }}
      BUILD_INFO_OBS_SK: ${{ secrets.OBS_SECRET_ACCESS_KEY_PRECISION }}
