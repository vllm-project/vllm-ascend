# TEMPORARY VERIFICATION WORKFLOW -- DELETE BEFORE MERGING.
#
# Secret-free self-check for the /presmoke wiring. It must be a `pull_request`
# trigger (not `pull_request_target`, `issue_comment` or `repository_dispatch`),
# because only `pull_request` resolves the workflow definition from the PR head,
# which is what makes it usable before this work reaches the default branch.
#
# It reads no repository secrets and dispatches nothing, so it also runs on fork
# PRs. The previous dispatch-based version could not: GitHub withholds repository
# secrets from fork pull requests (so PAT_TOKEN is empty) and the fork's
# branches are not resolvable as `--ref` / checkout refs in the base repository.
#
# Usage: add the `presmoke` label to a PR targeting main.
name: 'PR presmoke wiring check (temporary)'

run-name: presmoke wiring check on PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - 'main'
    types: [ labeled ]

permissions:
  contents: read

jobs:
  check:
    if: github.event.label.name == 'presmoke'
    runs-on: linux-amd64-cpu-2-hk
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:nightly-cpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check presmoke wiring
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          ok = True


          def check(name, cond, detail=""):
              global ok
              if cond:
                  print("PASS  " + name)
              else:
                  ok = False
                  print("FAIL  " + name + ("  [" + detail + "]" if detail else ""))


          # Avoids emitting a literal GitHub expression delimiter in this file.
          DOLLAR = "$" + "{{"


          def expr(body):
              return DOLLAR + " " + body + " }}"


          WF = Path(".github/workflows")
          CMD = "needs.authorize.outputs.command"
          INPUT_SUF = expr("inputs.image_tag_suffix")
          INPUT_SKIP_BASE = expr("inputs.skip_base != 'false'")
          INPUT_TAG_SUFFIX = expr("inputs.tag_suffix")

          # 1. the slash command is registered
          slash = (WF / "slash_command_dispatch.yml").read_text()
          check("slash_command_dispatch registers the presmoke command",
                re.search(r"^ {12}presmoke$", slash, re.M) is not None)
          check("slash_command_dispatch config lists the presmoke command",
                '"command": "presmoke"' in slash)

          # 2. the command handler routes presmoke
          handler = (WF / "pr_nightly_command.yml").read_text()
          check("pr_nightly_command listens for presmoke-command",
                "presmoke-command" in handler)
          check("pr_nightly_command routes presmoke to nightly_config.yaml",
                re.search(r"nightly\|presmoke\)", handler) is not None)
          gate = CMD + " == 'presmoke'"
          gated = sum(1 for line in handler.splitlines()
                      if line.lstrip().startswith("if:") and gate in line)
          check("pr_nightly_command gates the 5 nightly jobs on presmoke",
                gated == 5, "count=" + str(gated))
          for flag, body in (
              ("skip_build_image", CMD + " != 'presmoke'"),
              ("skip_base", CMD + " != 'presmoke'"),
              ("image_tag_suffix", CMD + " == 'presmoke' && '-presmoke' || ''"),
          ):
              literal = flag + "='" + expr(body) + "'"
              check("pr_nightly_command passes " + flag + " for presmoke",
                    handler.count(literal) == 5,
                    "count=" + str(handler.count(literal)))

          # 3. the pair builder forwards one suffix to both layers
          pair = (WF / "_schedule_nightly_pair_image_build.yaml").read_text()
          check("pair builder declares skip_base / tag_suffix inputs",
                re.search(r"^ {6}skip_base:", pair, re.M) is not None
                and re.search(r"^ {6}tag_suffix:", pair, re.M) is not None)
          check("pair builder forwards tag_suffix to the runtime base build",
                re.search(r"^ +tag_suffix: " + re.escape(INPUT_TAG_SUFFIX),
                          pair, re.M) is not None)
          check("pair builder forwards the suffix to the nightly layer",
                re.search(r"^ +base_tag_suffix: " + re.escape(INPUT_TAG_SUFFIX),
                          pair, re.M) is not None
                and re.search(r"^ +image_tag_suffix: " + re.escape(INPUT_TAG_SUFFIX),
                              pair, re.M) is not None)

          # 4. per chip wiring and base image tag alignment
          chips = {
              "a2": ("schedule_nightly_test_a2.yaml", "Dockerfile.nightly.a2"),
              "a3": ("schedule_nightly_test_a3.yaml", "Dockerfile.nightly.a3"),
              "a3_560t": ("schedule_nightly_test_a3_560t.yaml", "Dockerfile.nightly.a3"),
              "a5": ("schedule_nightly_test_a5.yaml", "Dockerfile.nightly.a5"),
              "310p": ("schedule_nightly_test_310p.yaml", "Dockerfile.nightly.310p"),
          }
          for chip, (wf_name, df_name) in chips.items():
              text = (WF / wf_name).read_text()
              for key in ("skip_build_image", "skip_base", "image_tag_suffix"):
                  check(chip + ": declares the " + key + " input",
                        re.search(r"^ {6}" + key + ":", text, re.M) is not None)

              match = re.search(
                  r"uses: \./\.github/workflows/_schedule_nightly_pair_image_build\.yaml\n"
                  r"(.*?)(?=^  \S)", text, re.M | re.S)
              check(chip + ": build-image uses the pair builder", match is not None)
              block = match.group(1) if match else ""
              check(chip + ": build-image uses the release nightly shape",
                    "build_type: 'release'" in block)
              check(chip + ": build-image forwards skip_base from the input",
                    "skip_base: " + INPUT_SKIP_BASE in block)
              check(chip + ": build-image forwards image_tag_suffix as tag_suffix",
                    re.search(r"^ +tag_suffix: " + re.escape(INPUT_SUF),
                              block, re.M) is not None)
              check(chip + ": preset images are not mirrored to quay.io",
                    re.search(r"^ +skip_sync: true", block, re.M) is not None)

              refs = [line.strip() for line in text.splitlines()
                      if "nightly-ci-" in line and "swr." in line]
              missing = [line for line in refs if INPUT_SUF not in line]
              check(chip + ": all " + str(len(refs))
                    + " nightly image refs carry image_tag_suffix",
                    bool(refs) and not missing, str(missing[:2]))

              dockerfile = (WF / "dockerfiles" / df_name).read_text()
              from_match = re.search(r"^FROM (.*)$", dockerfile, re.M)
              from_line = from_match.group(1).strip() if from_match else ""
              check(chip + ": " + df_name + " declares ARG TAG_SUFFIX",
                    re.search(r'^ARG TAG_SUFFIX=""', dockerfile, re.M) is not None)
              check(chip + ": " + df_name + " FROM consumes TAG_SUFFIX",
                    "${VLLM_ASCEND_BRANCH}" in from_line
                    and "${OS_MARK}${TAG_SUFFIX}" in from_line, from_line)

              suffix_match = re.search(r"^ +suffix: '?(.*?)'?\s*$", block, re.M)
              suffix = (suffix_match.group(1) if suffix_match else "").strip()
              expected = ("nightly-${VLLM_ASCEND_BRANCH}"
                          + ("-" + suffix if suffix else "")
                          + "${OS_MARK}${TAG_SUFFIX}")
              consumed = from_line.rsplit(":", 1)[-1]
              check(chip + ": base image tag matches suffix '" + suffix + "'",
                    consumed == expected, "from=" + consumed + " expected=" + expected)

          print()
          print("RESULT: " + ("PASS" if ok else "FAIL"))
          sys.exit(0 if ok else 1)
          PY
