test_cases:
  - name: DeepSeek-V4.1-Flash-W4A8-A3-MRV2
    model: Eco-Tech/DeepSeek-V4.1-Flash-1017-w4a8
    envs:
      VLLM_USE_V2_MODEL_RUNNER: '1'
      OMP_PROC_BIND: 'false'
      OMP_NUM_THREADS: '1'
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      HCCL_BUFFSIZE: '1024'
      ASCEND_LAUNCH_BLOCKING: '0'
      SERVER_PORT: DEFAULT_PORT
      VLLM_ENGINE_READY_TIMEOUT_S: '36000'
      HCCL_OP_EXPANSION_MODE: AIV
    server_cmd:
      - --host
      - 0.0.0.0
      - --port
      - $SERVER_PORT
      - --max-model-len
      - '150000'
      - --max-num-batched-tokens
      - '8192'
      - --gpu-memory-utilization
      - '0.9'
      - --max-num-seqs
      - '32'
      - --data-parallel-size
      - '4'
      - --tensor-parallel-size
      - '4'
      - --enable-expert-parallel
      - --tokenizer-mode
      - deepseek_v41
      - --reasoning-parser
      - deepseek_v41
      - --tool-call-parser
      - deepseek_v41
      - --enable-auto-tool-choice
      - --safetensors-load-strategy
      - lazy
      - --quantization
      - ascend
      - --block-size
      - '128'
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - --async-scheduling
      - --swa-bounded-replay
      - --engram-config
      - '{"cpu_offload": true, "dp_shared_memory": true}'
      - --additional-config
      - '{"ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false}, "enable_cpu_binding": true, "enable_fused_mc2": 1, "enable_flashcomm1": false, "enable_shared_expert_dp": true}'
    benchmarks:
      acc-gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 131072
        batch_size: 32
        baseline: 89.9
        threshold: 5
        temperature: 1.0
        top_p: 1.0
        thinking: true
      # Establish a W4A8 throughput baseline before enabling performance thresholds.
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in32768_bs1000_deepseek
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 64
        max_out_len: 1024
        batch_size: 16
        request_rate: 0
