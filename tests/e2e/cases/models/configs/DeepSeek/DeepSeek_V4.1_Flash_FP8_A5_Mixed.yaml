# Single A5 node: prefill and decode share eight NPUs (DP8/TP1/EP8).
# Confirm that the model is available at this path in the nightly container.
test_cases:
  - name: DeepSeek_V41_Flash_FP8_A5_Mixed
    model: /root/.cache/modelscope/hub/models/deepseek-ai/DeepSeek-V4.1-Flash-1017
    envs:
      SERVER_PORT: DEFAULT_PORT
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      HCCL_OP_EXPANSION_MODE: CCU_SCHED
      HCCL_BUFFSIZE: "1600"
      HCCL_CONNECT_TIMEOUT: "1200"
      HCCL_EXEC_TIMEOUT: "2040"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "10"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    server_cmd:
      - --host
      - 0.0.0.0
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - "8"
      - --tensor-parallel-size
      - "1"
      - --enable-expert-parallel
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "64"
      - --gpu-memory-utilization
      - "0.90"
      - --block-size
      - "128"
      - --quantization
      - deepseek_v4_fp8
      - --engram-config
      - '{"cpu_offload":true,"dp_shared_memory":true}'
      - --tokenizer-mode
      - deepseek_v41
      - --tool-call-parser
      - deepseek_v41
      - --reasoning-parser
      - deepseek_v41
      - --enable-auto-tool-choice
      - --trust-remote-code
      - --swa-bounded-replay
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":5,"enforce_eager":false}'
      - --additional-config
      - '{"enable_cpu_binding":true,"multistream_engram_overlap":true,"multistream_overlap_shared_expert":true,"multistream_dsv4_dsa_overlap":true,"combine_quant_mode":4}'
    test_content:
      - chat_completion
    # GPQA gate requested for this case; validate against A5 FP8 measurements.
    # Performance gate is provisional from #20225 (A3 W8A8).
    benchmarks:
      acc-gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 65536
        batch_size: 32
        baseline: 92
        threshold: 4
        temperature: 1
        thinking: true
        reasoning_effort: low
      perf_TPOT50_16k_1:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs1200_deepseek
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 256
        max_out_len: 1024
        batch_size: 64
        request_rate: 2.7
        baseline: 1800
        threshold: 0.95
        tpot_threshold: 50
