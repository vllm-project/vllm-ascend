_envs: &envs
  SERVER_PORT: "DEFAULT_PORT"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "1024"
  PYTHONHASHSEED: "0"
  ASCEND_ENABLE_USE_FABRIC_MEM: "1"
  ACL_OP_INIT_MODE: "1"

_kv_pool: &kv_pool
  type: "mooncake"
  master_port: 50088
  metrics_port: 50089
  config:
    metadata_server: "P2PHANDSHAKE"
    protocol: "ascend"
    device_name: ""
    # The proven A3 TP8 non-layerwise configuration uses a 32 GiB segment.
    global_segment_size: "32GB"
    preferred_segment: false
    prefer_alloc_in_same_node: true

_server_cmd: &server_cmd
  # Keep the external pool as the only prefix-hit path. The warmup below
  # populates Mooncake, then the measured run loads the shared prefix from it.
  - "--no-enable-prefix-caching"
  - "--max_model_len"
  - "135000"
  - "--safetensors-load-strategy"
  - "prefetch"
  - "--max-num-batched-tokens"
  - "4096"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--enable-expert-parallel"
  - "--async-scheduling"
  - "--max-num-seqs"
  - "32"
  - "--port"
  - "$SERVER_PORT"
  - "--block-size"
  - "128"
  - "--data-parallel-size"
  - "1"
  - "--tensor-parallel-size"
  - "8"
  - "--tokenizer-mode"
  - "deepseek_v4"
  - "--tool-call-parser"
  - "deepseek_v4"
  - "--enable-auto-tool-choice"
  - "--reasoning-parser"
  - "deepseek_v4"
  - "--api_server_count"
  - "1"
  - "--attention_config.indexer_kv_dtype" 
  - "int8"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--speculative-config"
  - '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": true}'
  - "--kv-transfer-config"
  - '{"kv_connector": "AscendStoreConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"backend": "mooncake", "lookup_rpc_port": "0", "use_layerwise": false}}'

_benchmarks_perf: &benchmarks_perf
  pool_warmup:
    case_type: performance
    # Populate the pool before measuring MTP3 pool-hit performance. All
    # samples share the same long prefix, so any one sample warms it.
    dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_qwen
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1
    batch_size: 1
    request_rate: 0
    baseline: 0
    threshold: 0.97
  perf:
    case_type: performance
    # Exercise whole-block Mooncake load-back together with MTP3 draft/verify
    # from the first measured request. Recalibrate after valid pool-hit runs.
    dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_qwen
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1024
    batch_size: 16
    request_rate: 0
    baseline: 1
    threshold: 0.1

# ==========================================
# ACTUAL TEST CASES
# ==========================================

# =======dsv4-flash: Enable open,MTP=3 test.===============
test_cases:
  - name: "deepseekv4-flash-w8a8-enable-open"
    model: "Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp"
    envs:
      <<: *envs
    kv_pool: *kv_pool
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--additional-config"
      - '{"ascend_compilation_config":
            {
              "enable_npugraph_ex":true,
              "enable_static_kernel": false
            },
            "enable_cpu_binding": "true",
            "enable_shared_expert_dp": true,
            "multistream_overlap_shared_expert":true,
            "rejection_sampler_config": {
              "enable_block_verify": true,
              "enable_entropy_verify": true,
              "posterior_threshold": 0.95,
              "posterior_alpha": 0.4
            }
         }'
    benchmarks:
      <<: *benchmarks_perf
    test_content:
      - spec_decode_acceptance
    acceptance_rate:
      baseline: 0.925
      tolerance: 0.05

# =======dsv4-flash: Enable close,MTP=3 test..===============
  - name: "deepseekv4-flash-w8a8-enable-close"
    model: "Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp"
    envs:
      <<: *envs
    kv_pool: *kv_pool
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--additional-config"
      - '{"ascend_compilation_config":
            {
              "enable_npugraph_ex":true,
              "enable_static_kernel": false
            },
            "enable_cpu_binding": "false",
            "enable_shared_expert_dp": true,
            "multistream_overlap_shared_expert":true,
            "rejection_sampler_config": {
                "enable_block_verify": false,
                "enable_entropy_verify": false,
                "posterior_threshold": 0.95,
                "posterior_alpha": 0.4
              }
          }'
    benchmarks:
      <<: *benchmarks_perf
    test_content:
      - spec_decode_acceptance
    acceptance_rate:
      baseline: 0.925
      tolerance: 0.05
