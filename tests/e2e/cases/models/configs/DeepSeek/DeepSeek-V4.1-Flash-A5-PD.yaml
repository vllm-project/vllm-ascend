test_name: "DeepSeek-V4.1-Flash-A5-PD"
model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
num_nodes: 2
npu_per_node: 8
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "2040"
  HCCL_CONNECT_TIMEOUT: "1200"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_VERSION: "0.30.0"
  ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1024"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1600"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "5120"
      - --gpu-memory-utilization
      - "0.9"
      - --enable-expert-parallel
      - --max-num-seqs
      - "16"
      - --block-size
      - "128"
      - --engram-config
      - '{"cpu_offload":true,"dp_shared_memory":true}'
      - --quantization
      - deepseek_v4_fp8
      - --tokenizer-mode
      - deepseek_v41
      - --tool-call-parser
      - deepseek_v41
      - --enable-auto-tool-choice
      - --reasoning-parser
      - deepseek_v41
      - --enable-prefix-caching
      - --trust-remote-code
      - --enforce-eager
      - --speculative-config
      - '{"num_speculative_tokens":5,"method":"dspark"}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_producer","kv_port":"36010","engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":8,"tp_size":1},"decode":{"dp_size":8,"tp_size":1}}}'
      - --additional-config
      - '{"multistream_engram_overlap":false,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"multistream_dsv4_dsa_overlap":true}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "1024"
      - --gpu-memory-utilization
      - "0.92"
      - --enable-expert-parallel
      - --async-scheduling
      - --max-num-seqs
      - "64"
      - --block-size
      - "128"
      - --engram-config
      - '{"cpu_offload":true,"dp_shared_memory":true}'
      - --quantization
      - deepseek_v4_fp8
      - --tokenizer-mode
      - deepseek_v41
      - --tool-call-parser
      - deepseek_v41
      - --enable-auto-tool-choice
      - --reasoning-parser
      - deepseek_v41
      - --enable-prefix-caching
      - --trust-remote-code
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --speculative-config
      - '{"num_speculative_tokens":5,"method":"dspark","enforce_eager":false}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_consumer","kv_port":"36010","engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":8,"tp_size":1},"decode":{"dp_size":8,"tp_size":1}}}'
      - --additional-config
      - '{"multistream_engram_overlap":true,"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"multistream_dsv4_dsa_overlap":true,"enable_fused_mc2":0,"enable_force_eplb":false,"combine_quant_mode":4,"scheduler_config":{"recompute_scheduler_enable":true}}'

benchmarks:
  perf:
    case_type: performance
    dataset_path: GSM8K_prefix100_in1047500_DeepSeek-V4_1_Flash_1017
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    temperature: 1.0
    num_prompts: 32
    max_out_len: 1024
    batch_size: 8
    request_rate: 0
    baseline: 1
    threshold: 0.95
    ignore_eos: True