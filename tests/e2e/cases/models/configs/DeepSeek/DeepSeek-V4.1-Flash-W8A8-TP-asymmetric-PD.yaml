test_name: "DeepSeek-V4.1-Flash-W8A8-TP-asymmetric-PD"
model: "Eco-Tech/DeepSeek-V4.1-Flash-w8a8"
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  VLLM_SERVER_DEV_MODE: "1"
  SERVER_PORT: "${PORT}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1800"

templates:
  # ==================== P node (kv_producer) ====================
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "8192"
      - --max-num-seqs
      - "16"
      - --speculative-config
      - '{"num_speculative_tokens": 5,"method": "dspark"}'
      - --trust-remote-code
      - --block-size
      - "128"
      - --tokenizer-mode
      - "deepseek_v41"
      - --reasoning-parser
      - "deepseek_v41"
      - --tool-call-parser
      - "deepseek_v41"
      - --enable-auto-tool-choice
      - --model-loader-extra-config
      - '{"enable_multithread_load":true,"num_threads":128}'
      - --safetensors-load-strategy
      - "lazy"
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --enforce-eager
      - --enable-prefix-caching
      - --engram-config
      - '{"cpu_offload": true, "dp_shared_memory": true}'
      - --additional-config
      - '{"enable_cpu_binding": true, "enable_fused_mc2":1, "enable_dsa_cp": true, "enable_flashcomm1":true, "enable_shared_expert_dp":true}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeHybridConnector","kv_role": "kv_producer","kv_port": "30000","engine_id": "0","kv_connector_extra_config": {"prefill": {"dp_size": 4,"tp_size": 4},"decode": {"dp_size": 8,"tp_size": 2}}}'

  # ==================== D node (kv_consumer) ====================
  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "512"
      - --max-num-seqs
      - "72"
      - --async-scheduling
      - --block-size
      - "128"
      - --no-enable-prefix-caching
      - --trust-remote-code
      - --tokenizer-mode
      - "deepseek_v41"
      - --reasoning-parser
      - "deepseek_v41"
      - --tool-call-parser
      - "deepseek_v41"
      - --enable-auto-tool-choice
      - --model-loader-extra-config
      - '{"enable_multithread_load":true,"num_threads":128}'
      - --safetensors-load-strategy
      - "lazy"
      - --gpu-memory-utilization
      - "0.95"
      - --quantization
      - "ascend"
      - --speculative-config
      - '{"num_speculative_tokens": 5,"method": "dspark", "enforce_eager":true}'
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeHybridConnector","kv_role": "kv_consumer","kv_port": "30100","engine_id": "1","kv_connector_extra_config": {"prefill": {"dp_size": 4,"tp_size": 4},"decode": {"dp_size": 8,"tp_size": 2}}}'
      - --engram-config
      - '{"cpu_offload": true, "dp_shared_memory": true}'
      - --additional-config
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"recompute_scheduler_enable":true}'

benchmarks:
  perf:
    case_type: performance
    dataset_path: GSM8K_prefix100_in1047500_DeepSeek-V4_1_Flash_1017
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 256
    max_out_len: 1024
    batch_size: 64
    request_rate: 0
    baseline: 1
    threshold: 0.95
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    batch_size: 32
    baseline: 88
    threshold: 5
    temperature: 1