# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "DeepSeek-V4-Flash-W8A8-A3"
    model: "Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp"
    envs:
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_BUFFSIZE: "1024"
      ASCEND_LAUNCH_BLOCKING: "0"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
    # KV pooling (memcache backend): runner starts/stops pool services per case
    # (meta 5000 / config-store 6000), same shape as the MTP3 nightly kv_pool.
    kv_pool:
      type: "memcache"
      meta_service_port: 5000
      config_store_port: 6000
      config:
        meta:
          ock.mmc.log_level: "info"
        local:
          ock.mmc.log_level: "info"
          ock.mmc.local_service.world_size: 256
          ock.mmc.local_service.protocol: "device_sdma"
          ock.mmc.local_service.dram.size: "10GB"
    server_cmd:
      # prefix caching OFF: forces the pool to be the only KV hit path (read-path sentinel)
      - "--no-enable-prefix-caching"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "10240"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-num-seqs"
      - "64"
      - "--data-parallel-size"
      - "4"
      - "--tensor-parallel-size"
      - "4"
      - "--enable-expert-parallel"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--safetensors-load-strategy"
      - "prefetch"
      - "--quantization"
      - "ascend"
      - "--api-server-count"
      - "1"
      - "--speculative-config"
      - '{"num_speculative_tokens": 1,"method": "mtp","enforce_eager": true}'
      - "--port"
      - "$SERVER_PORT"
      - "--block-size"
      - "128"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--async-scheduling"
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":"true","enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"enable_fused_mc2":0}'
      - "--kv-transfer-config"
      - '{"kv_connector": "AscendStoreConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"backend": "memcache", "lookup_rpc_port": "0", "use_layerwise": true}}'
    benchmarks:
      acc-gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 65536
        batch_size: 32
        baseline: 86.36
        threshold: 5
        thinking: true
        reasoning_effort: low
      pool_warmup:
        case_type: performance
        # Populate the pool before the measured run. All samples in this
        # dataset share the same long prefix, so any one sample warms it.
        dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_qwen
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 1
        max_out_len: 1
        batch_size: 1
        request_rate: 0
        baseline: 0
        threshold: 0.97
      perf:
        case_type: performance
        # The preceding warmup writes the shared prefix, so this measured run
        # exercises pool lookup/load-back from its first request.
        # In use on this runner pool by qwen_3_6_27b_w8a8_A3 nightly (dataset proven cached);
        # qwen-tokenizer calibrated — token count drifts under the deepseek_v4 tokenizer,
        # acceptable for a perf-only sentinel.
        dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_qwen
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 64
        max_out_len: 1024
        batch_size: 16
        request_rate: 0
        # Recording placeholder: new load + pooling, old prefix0 baseline invalid.
        # Backfill measured throughput and restore threshold 0.97 after first green run
        # (same placeholder pattern as qwen_3_6_27b_w8a8_A3 perf_prefix_90).
        baseline: 1
        threshold: 0.1
