# ==========================================
# Single-Node PD Disaggregation: DeepSeek-V4-Flash-0731 on A5 (1P1D, 8 NPUs)
# ==========================================
# One Atlas A5 machine (8 NPUs):
#   Prefill engine: kv_producer, TP1 x PCP4, devices auto-assigned by RemotePDServer (0-3)
#   Decode  engine: kv_consumer, DP4 x TP1,  devices auto-assigned by RemotePDServer (4-7)
#   PD proxy: examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
# Converted from the multi-node external-DP config:
#   - decode runs as ONE `vllm serve` with --data-parallel-size 4 (internal DP
#     load balancing) instead of 4 rank processes with external LB:
#     RemotePDServer splits devices per instance (TP x PP x PCP x DP), so the
#     per-rank-process style would be counted as 4 devices each (16 total).
#   - kv ports stay distinct: prefill 30000, decode 30002 (engine_id 0/1).
# ==========================================

_envs: &envs
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
  PREFILL_PORT: "DEFAULT_PORT"
  DECODE_PORT: "DEFAULT_PORT"
  PROXY_PORT: "DEFAULT_PORT"

test_cases:
  - name: "DeepSeek-V4-Flash-0731-A5-PD-single-node"
    model: "deepseek-ai/DeepSeek-V4-Flash-0731"
    service_mode: "pd"
    envs:
      <<: *envs
    pd_server_cmds:
      # -------- Prefill engine (kv_producer, TP1 x PCP4 = 4 NPUs) --------
      - - "deepseek-ai/DeepSeek-V4-Flash-0731"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "$PREFILL_PORT"
        - "--tensor-parallel-size"
        - "1"
        - "--prefill-context-parallel-size"
        - "4"
        - "--enable-expert-parallel"
        - "--enable-prefix-caching"
        - "--seed"
        - "1024"
        - "--max-model-len"
        - "1048576"
        - "--max-num-batched-tokens"
        - "8192"
        - "--max-num-seqs"
        - "16"
        - "--no-disable-hybrid-kv-cache-manager"
        - "--model-loader-extra-config"
        - '{"enable_multithread_load":true,"num_threads":128}'
        - "--speculative-config"
        - '{"num_speculative_tokens":5,"method":"dspark","enforce_eager":true}'
        - "--trust-remote-code"
        - "--block-size"
        - "32"
        - "--kv-cache-dtype"
        - "fp8"
        - "--attention_config.indexer_kv_dtype"
        - "fp8"
        - "--tokenizer-mode"
        - "deepseek_v4"
        - "--tool-call-parser"
        - "deepseek_v4"
        - "--enable-auto-tool-choice"
        - "--reasoning-parser"
        - "deepseek_v4"
        - "--gpu-memory-utilization"
        - "0.9"
        - "--enforce-eager"
        - "--additional-config"
        - '{"enable_cpu_binding":true,"enable_fused_mc2":0,"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true}'
        - "--kv-transfer-config"
        - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":"30000","engine_id":"0","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":1},"decode":{"dp_size":4,"tp_size":1}}}'
      # -------- Decode engine (kv_consumer, DP4 x TP1 = 4 NPUs) --------
      - - "deepseek-ai/DeepSeek-V4-Flash-0731"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "$DECODE_PORT"
        - "--data-parallel-size"
        - "4"
        - "--tensor-parallel-size"
        - "1"
        - "--enable-expert-parallel"
        - "--seed"
        - "1024"
        - "--max-model-len"
        - "1048576"
        - "--max-num-batched-tokens"
        - "1024"
        - "--max-num-seqs"
        - "56"
        - "--async-scheduling"
        - "--block-size"
        - "32"
        - "--kv-cache-dtype"
        - "fp8"
        - "--attention_config.indexer_kv_dtype"
        - "fp8"
        - "--no-enable-prefix-caching"
        - "--no-disable-hybrid-kv-cache-manager"
        - "--model-loader-extra-config"
        - '{"enable_multithread_load":true,"num_threads":128}'
        - "--trust-remote-code"
        - "--tokenizer-mode"
        - "deepseek_v4"
        - "--tool-call-parser"
        - "deepseek_v4"
        - "--enable-auto-tool-choice"
        - "--reasoning-parser"
        - "deepseek_v4"
        - "--gpu-memory-utilization"
        - "0.95"
        - "--speculative-config"
        - '{"num_speculative_tokens":5,"method":"dspark","enforce_eager":false}'
        - "--compilation-config"
        - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        - "--kv-transfer-config"
        - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":"30002","engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":1},"decode":{"dp_size":4,"tp_size":1}}}'
        - "--additional-config"
        - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"recompute_scheduler_enable":true,"enable_shared_expert_dp":true,"combine_quant_mode":4}'
    benchmarks:
      perf_128:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in131072-bs500-prefix90-glm51
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 256
        max_out_len: 1024
        batch_size: 64
        request_rate: 0
        baseline: 1395.70
        threshold: 0.95
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix100_in1047400_DeepSeek-V4-Flash-0731
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 4
        max_out_len: 1024
        batch_size: 1
        request_rate: 0
        baseline: 57.46
        threshold: 0.95
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 393216
        batch_size: 200
        baseline: 90.1
        threshold: 5
        temperature: 1.0
        top_p: 1.0
        thinking: true
        reasoning_effort: "max"
