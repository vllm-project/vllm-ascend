test_name: "DeepSeek-V4-Flash-0731_A5_PD"
model: "deepseek-ai/DeepSeek-V4-Flash-0731"
num_nodes: 2
npu_per_node: 8
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"

env_decode: &env_decode
  <<: *env_common

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --prefill-context-parallel-size
      - "4"
      - --enable-expert-parallel
      - --enable-prefix-caching
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "8192"
      - --max-num-seqs
      - "16"
      - --no-disable-hybrid-kv-cache-manager
      - --model-loader-extra-config
      - '{"enable_multithread_load":true,"num_threads":128}'
      - --speculative-config
      - '{"num_speculative_tokens":5,"method":"dspark","enforce_eager":true}'
      - --trust-remote-code
      - --block-size
      - "32"
      - --kv-cache-dtype
      - fp8
      - --attention_config.indexer_kv_dtype
      - fp8
      - --tokenizer-mode
      - deepseek_v4
      - --tool-call-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --reasoning-parser
      - deepseek_v4
      - --gpu-memory-utilization
      - "0.9"
      - --enforce-eager
      - --additional-config
      - '{"enable_cpu_binding":true,"enable_fused_mc2":0,"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":"30000","engine_id":"0","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":1},"decode":{"dp_size":4,"tp_size":1}}}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "1024"
      - --max-num-seqs
      - "56"
      - --async-scheduling
      - --block-size
      - "32"
      - --kv-cache-dtype
      - fp8
      - --attention_config.indexer_kv_dtype
      - fp8
      - --no-enable-prefix-caching
      - --no-disable-hybrid-kv-cache-manager
      - --model-loader-extra-config
      - '{"enable_multithread_load":true,"num_threads":128}'
      - --trust-remote-code
      - --tokenizer-mode
      - deepseek_v4
      - --tool-call-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --reasoning-parser
      - deepseek_v4
      - --gpu-memory-utilization
      - "0.95"
      - --speculative-config
      - '{"num_speculative_tokens":5,"method":"dspark","enforce_eager":false}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":"30002","engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":1},"decode":{"dp_size":4,"tp_size":1}}}'
      - --additional-config
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"recompute_scheduler_enable":true,"enable_shared_expert_dp":true,"combine_quant_mode":4}'

benchmarks:
  perf:
    case_type: performance
    dataset_path: GSM8K_prefix100_in1047400_DeepSeek-V4-Flash-0731
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 4
    max_out_len: 1024
    batch_size: 1
    request_rate: 0
    baseline: 57.4647
    threshold: 0.95