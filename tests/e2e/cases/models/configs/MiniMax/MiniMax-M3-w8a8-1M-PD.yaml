benchmarks:
  perf_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix100_in1047500_bs5_MiniMax_w8a8_0626
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1024
    batch_size: 1
    request_rate: 0
    baseline: 0
    threshold: 0.97
