      - "--no-async-scheduling"
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--gpu-memory-utilization"
      - "0.99"
      - "--kv-cache-memory-bytes"
      - "47620449894"
      - "--kv-cache-dtype"
      - "auto"
      - "--language-model-only"
