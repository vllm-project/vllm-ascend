test_name: "MiniMax-M3-w8a8-1M-PD"
model: "Eco-Tech/MiniMax-M3-w8a8-0626"
num_nodes: 3
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1, 2 ]

config:
  # Prefill: 1节点, DP=1, TP=8, PP=2 (8×2=16卡)
  - node_index: 0
    port_start: 31050
    dp_rpc_port: 6884
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 8
    pp_size: 2
    dp_address: "${NODE_0_IP}"

  # Decode node 1: DP=4, 本地2个rank (0,1), TP=8, PP=1 (8×2=16卡)
  - node_index: 1
    port_start: 31260
    dp_rpc_port: 31422
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 8
    pp_size: 1
    dp_address: "${NODE_1_IP}"

  # Decode node 2: DP=4, 本地2个rank (2,3), TP=8, PP=1 (8×2=16卡)
  - node_index: 2
    port_start: 31260
    dp_rpc_port: 31422
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 2
    tp_size: 8
    pp_size: 1
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "7200"
  VLLM_ENGINE_READY_TIMEOUT_S: "7200"
  HCCL_OP_EXPANSION_MODE: "AIV"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  ACL_OP_INIT_MODE: "1"
  ASCEND_ENABLE_USE_FABRIC_MEM: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SERVER_PORT: "${PORT}"
  VLLM_USE_MODELSCOPE: "true"

env_prefill: &env_prefill
  <<: *env_common
  VLLM_PP_LAYER_PARTITION: "30,30"
  HCCL_BUFFSIZE: "256"
  HCCL_IF_BASE_PORT: "51000"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "64"
  HCCL_IF_BASE_PORT: "50${DP_RANK}00"

templates:
  # ============ Prefill (node 0) ============
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - "--enforce-eager"
      - "--compilation-config"
      - '{"cudagraph_mode":"NONE"}'
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--pipeline-parallel-size"
      - "${PP_SIZE}"
      - "--distributed-executor-backend"
      - "mp"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1049600"
      - "--max-num-seqs"
      - "1"
      - "--max-num-batched-tokens"
      - "8192"
      - "--long-prefill-token-threshold"
      - "8192"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--no-async-scheduling"
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--kv-cache-dtype"
      - "auto"
      - "--language-model-only"
      - "--reasoning-parser"
      - "minimax_m3"
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_static_kernel":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"weight_nz_mode":2,"enable_shared_expert_dp":false,"enable_flashcomm1":true}'
      - "--kv-transfer-config"
      - '{
        "kv_connector": "MooncakeConnectorV1",
        "kv_buffer_device": "npu",
        "kv_role": "kv_producer",
        "kv_port": "36000",
        "engine_id": "0",
        "kv_connector_extra_config": {
            "use_ascend_direct": true,
            "prefill": {
                "dp_size": 1,
                "tp_size": 8,
                "pp_size": 2,
                "pp_layer_partition": "30,30"
            },
            "decode": {
                "dp_size": 4,
                "tp_size": 8,
                "pp_size": 1
            }
        }}'

  # ============ Decode node 1 (DP rank 0,1) ============
  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - "--data-parallel-rank"
      - "${DP_RANK}"
