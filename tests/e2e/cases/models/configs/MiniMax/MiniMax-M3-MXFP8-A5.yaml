# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "MiniMax-M3-MXFP8-A5"
    model: "MiniMax/MiniMax-M3-MXFP8"
    envs:
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "1800"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--trust-remote-code"
      - "--distributed-executor-backend"
      - "mp"
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "2"
      - "--enable-expert-parallel"
      - "--dtype"
      - "bfloat16"
      - "--quantization"
      - "mxfp8"
      - "--max-model-len"
      - "140000"
      - "--max-num-batched-tokens"
      - "16384"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-num-seqs"
      - "500"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--async-scheduling"
      - "--reasoning-parser"
      - "minimax_m3"
      - "--limit-mm-per-prompt"
      - '{"image":1,"video":0}'
      - "--safetensors-load-strategy"
      - "prefetch"
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_qknorm_rope":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true}'
    test_content:
      - chat_completion
    api_keyword_args:
      max_tokens: 10
      chat_template_kwargs:
        thinking_mode: disabled
    benchmarks:
      acc_gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 65536
        batch_size: 64
        baseline: 92
        threshold: 2
        temperature: 1.0
        top_p: 0.95
        ignore_eos: false
      acc_textvqa:
        case_type: accuracy
        dataset_path: vllm-ascend/textvqa-lite
        request_conf: vllm_api_general_chat
        dataset_conf: textvqa/textvqa_gen_base64
        num_prompts: 1000
        max_out_len: 512
        batch_size: 64
        baseline: 72
        temperature: 1.0
        top_p: 0.95
        threshold: 2
