benchmarks:
  acc_gpqa_60:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    num_prompts: 60
    max_out_len: 8192
    batch_size: 8
    thinking: true
    temperature: 0.0
    seed: 1024
    baseline: 90
    # Percentage points around the GPQA baseline, matching MRV1 coverage.
    threshold: 5
  perf_8k:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs8000-qwen3
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 320
    max_out_len: 1500
    batch_size: 80
    request_rate: 0
    # Replace this placeholder with the calibrated 8K throughput before
    # enabling a non-trivial performance gate.
    baseline: 0
    threshold: 0.97
