benchmarks:
  acc_gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    batch_size: 32
    work_dir: /root/.cache/benchmark_results/${BENCHMARK_JOB_NAME}/aisbench
    thinking: true
    temperature: 1.0
    top_p: 1.0
    baseline: 90
    threshold: 5
  perf_16k_prefix0:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs200_kimi
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 1024
    batch_size: 4
    request_rate: 0
    # Reuse the MRV1 nightly performance baseline until MRV2 is recalibrated.
    baseline: 40
    threshold: 0.95
    tpot_threshold: 90
