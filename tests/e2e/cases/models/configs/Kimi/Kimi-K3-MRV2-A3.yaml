        --speculative-config '{"method":"dspark","model":"/root/.cache/modelscope/hub/models/Eco-Tech/Kimi-K3-DSpark-MLA-NPU","num_speculative_tokens":7,"draft_tensor_parallel_size":16,"draft_sample_method":"greedy","enforce_eager":false}'
        --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
        --mm-processor-cache-gb 0
        --mm-encoder-tp-mode data
        --limit-mm-per-prompt '{"vision_chunk":2}'
        --enable-auto-tool-choice
