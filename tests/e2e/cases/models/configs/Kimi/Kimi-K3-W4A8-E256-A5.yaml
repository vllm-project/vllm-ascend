test_cases:
- name: Kimi-K3-W4A8-E256-A5-GSM8K-First100
  test_rounds: 1
  model: /root/.cache/modelscope/hub/models/CuiZ2007/Kimi-K3-w4a8-mxfp-QuaRot-experts256
  envs:
    SERVER_PORT: "8080"
    VLLM_USE_V2_MODEL_RUNNER: '1'
    HCCL_BUFFSIZE: '800'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    OMP_NUM_THREADS: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
  server_cmd:
  - --host
  - 0.0.0.0
  - --trust-remote-code
  - --tokenizer-mode
  - kimi_k3
  - --quantization
  - ascend
  - --generation-config
  - vllm
  - --reasoning-parser
  - kimi_k3
  - --tensor-parallel-size
  - '8'
  - --enable-expert-parallel
  - --dtype
  - bfloat16
  - --enforce-eager
  - --max-model-len
  - '4096'
  - --max-num-seqs
  - '100'
  - --max-num-batched-tokens
  - '2048'
  - --enable-chunked-prefill
  - --gpu-memory-utilization
  - '0.85'
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"vision_chunk":0}'
  - --additional-config
  - '{"enable_flashcomm1":true}'
  - --seed
  - '42'
  - --port
  - $SERVER_PORT
  - --default-chat-template-kwargs
  - '{"thinking_effort":"low"}'
  test_content: []
  benchmarks:
    accuracy:
      case_type: accuracy
      dataset_path: /root/.cache/modelscope/hub/datasets/CuiZ2007/gsm8k
      dataset_path_local: /root/.cache/modelscope/hub/datasets/CuiZ2007/gsm8k
      request_conf: vllm_api_general_chat
      dataset_conf: gsm8k/gsm8k_gen_4_shot_cot_str
      num_prompts: 20
      max_out_len: 1024
      batch_size: 1
      temperature: 0
      top_p: 1.0
      seed: 42
      baseline: 50.0
      threshold: 50.0
