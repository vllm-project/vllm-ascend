# DRAFT: native AISBench accuracy case; no custom runner or dataset Python file.
# Scope: one A5 node, 8 NPUs, pre-pruned Kimi-K3 W4A8 with 256 routed experts.
# Source checkpoint: Kimi-K3-w4a8-mxfp-QuaRot. Pruning is a separate prerequisite.
# References: vllm-project/vllm-ascend#20101 and Qwen3_6_27b_A5.yaml.
# Requires the model and GSM8K train.jsonl/test.jsonl at the paths below.
# Unset HCCL_OP_EXPANSION_MODE before launching the test harness.
# Requires a vLLM build supporting Kimi-K3 and --default-chat-template-kwargs.
# Uses the stock flat 4-shot CoT preset and stock GSM8K answer scoring.
# num_prompts=500: verify selected IDs are exactly 0..499 in target AISBench.
# Previous strict-scoring results are not the acceptance baseline for this case.
# REQUIRED before regression execution: replace baseline/threshold null values
# with calibrated numeric accuracy percentage / tolerance in percentage points.
# This draft does not register a nightly job or download private checkpoints.
test_cases:
- name: Kimi-K3-W4A8-EP256-A5-GSM8K-First500-Native
  model: /mnt/share/weights/Kimi-K3-w4a8-mxfp-QuaRot-slim_ep_256xps
  envs:
    VLLM_USE_V2_MODEL_RUNNER: '1'
    HCCL_BUFFSIZE: '800'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    OMP_NUM_THREADS: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '7200'
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '3000'
  server_cmd:
  - --host
  - 127.0.0.1
  - --trust-remote-code
  - --tokenizer-mode
  - kimi_k3
  - --quantization
  - ascend
  - --generation-config
  - vllm
  - --reasoning-parser
  - kimi_k3
  - --tensor-parallel-size
  - '8'
  - --enable-expert-parallel
  - --dtype
  - bfloat16
  - --enforce-eager
  - --max-model-len
  - '6144'
  - --max-num-seqs
  - '100'
  - --max-num-batched-tokens
  - '2048'
  - --enable-chunked-prefill
  - --gpu-memory-utilization
  - '0.85'
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  - --limit-mm-per-prompt
  - '{"vision_chunk":0}'
  - --additional-config
  - '{"enable_flashcomm1":true}'
  - --seed
  - '42'
  - --port
  - $SERVER_PORT
  - --default-chat-template-kwargs
  - '{"thinking_effort":"low"}'
  test_content: []
  benchmarks:
    accuracy:
      case_type: accuracy
      dataset_path: /mnt/share/c30087248/datasets/gsm8k
      dataset_path_local: /mnt/share/c30087248/datasets/gsm8k
      request_conf: vllm_api_general_chat
      dataset_conf: gsm8k/gsm8k_gen_4_shot_cot_str
      num_prompts: 500
      max_out_len: 1024
      batch_size: 60
      temperature: 0
      top_p: 1.0
      seed: 42
      baseline: null
      threshold: null
