# PR E2E Kimi K3 MRV2 external-DP 2P2D: nodes 0/1 are prefiller ranks and
# nodes 2/3 are decoder ranks. The four-node allocation is intentional:
# each rank owns one 16-NPU node, matching the validated K3 2P2D topology.
#
# Precision is a 60-sample GPQA evaluation. AISBench reads the answer key from
# the dataset and computes the score; no model response is hard-coded here.
# The score uses the same GPQA acceptance rule as the existing Kimi K3 A3
# coverage: 90 percent baseline with a five-point tolerance. Performance uses
# the shared 8K AISBench workload only. Its baseline remains a placeholder
# until the first full-model calibration; the existing lower-bound check then
# accepts optimizations above the baseline.
# The chat_completion entry performs a real proxy request and checks that the
# response contains generated text before AISBench starts.
#
# After the external proxy is ready, run the curl output check with:
# SERVICE_URL=http://<proxy-node>:1999 \
# MODEL_NAME=Eco-Tech/Kimi-K3-w4a8 \
# tests/e2e/cases/models/kimi_k3_mrv2_2p2d_curl_smoke.sh

test_name: "Kimi-K3-MRV2-2P2D-PR"
model: "Eco-Tech/Kimi-K3-w4a8"
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [0, 1]
    decoder: [2, 3]

config:
  - node_index: 0
    port_start: 13700
    dp_rpc_port: 13400
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 13700
    dp_rpc_port: 13400
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 1
    tp_size: 16
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 13701
    dp_rpc_port: 13410
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 13701
    dp_rpc_port: 13410
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 1
    tp_size: 16
    dp_address: "${NODE_2_IP}"

