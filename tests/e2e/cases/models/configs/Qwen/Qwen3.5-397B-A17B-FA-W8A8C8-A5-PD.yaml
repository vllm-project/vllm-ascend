      - "/"
      - --gpu-memory-utilization
      - "0.90"
      - --quantization
      - "ascend"
      - --kv-cache-dtype
      - "mxfp8"
      - --enable-prefix-caching
      - --async-scheduling
      - --mm-processor-cache-gb
      - "0"
      - --mm-encoder-tp-mode
      - "data"
      - --distributed-executor-backend
      - "mp"
      - --no-disable-hybrid-kv-cache-manager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "qwen3_coder"
      - --reasoning-parser
      - "qwen3"
      - --speculative-config
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --additional-config
      - '{"enable_flashcomm1":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"weight_nz_mode":1,"mega_moe_max_tokens":65536,"enable_cpu_binding":true,"enable_fused_mc2":2,"enable_prefill_mc2":false,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":false,"scheduler_config":{"recompute_scheduler_enable":true}}'
