    # Sources are recorded per workload below; all reference files are in this directory.
    # Workloads are preserved; PCP/DCP and tuned Qwen3.5 server overrides are NOT inherited.
    # The helper sets ignore_eos by case type; a YAML ignore_eos field is not consumed.
