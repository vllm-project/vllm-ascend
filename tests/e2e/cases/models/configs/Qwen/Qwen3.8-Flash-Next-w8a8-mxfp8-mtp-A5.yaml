# Runtime reference: PR #16981, commit 4ecd1efdb243123865e95807aa247b03e94afda5.
# A5 serving topology comes from the supplied TP4 MXFP8 command, not A3 validation.
# Requires compatible A5 CANN/ATB and custom_transformer operators in the CI image.
# Source their environment before pytest; do not hardcode a developer's build path here.
# The current PR removed the legacy QSA environment switches. Do not mix versions.
# Only chat smoke runs; A5 startup and all benchmark baselines still require NPU runs.
test_cases:
  - name: "Qwen3.8-Flash-Next-w8a8-mxfp8-mtp-A5"
    model: "Eco-Tech/Qwen3.8-Flash-Next-w8a8-mxfp8-mtp"
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
      HCCL_NPU_SOCKET_PORT_RANGE: "16700-16799"
      SOC_VERSION: "ascend950dt_9582"
      SERVER_PORT: "DEFAULT_PORT"
      # Startup/RPC timeouts inherited from the Qwen3.5 A3 nightly reference.
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
      VLLM_RPC_TIMEOUT: "6000"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "1"
      - "--max-model-len"
      - "98304"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--no-enable-prefix-caching"
      - "--async-scheduling"
      - "--enable-expert-parallel"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes":[1,2,4,8],"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
      - "--speculative-config"
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
    test_content:
      - "chat_completion"
    prompts:
      - "Who are you?"
    api_keyword_args:
      max_tokens: 1024
      temperature: 0
      top_p: 1
      chat_template_kwargs:
        enable_thinking: false
    benchmarks: {}
