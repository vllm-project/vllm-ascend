# Runtime reference: PR #16981, commit 4ecd1efdb243123865e95807aa247b03e94afda5.
# A5 serving settings follow /mnt/share/z00946941/script/serve_qwen38.sh
# on 141.61.141.62 (z00946941_qwen38_a5), checked 2026-10-24.
# CI supplies its own model location, port, and allocated NPU IDs.
# Requires compatible A5 CANN/ATB and custom_transformer operators in the CI image.
# Source their environment before pytest; do not hardcode a developer's build path here.
# The 128K baseline was measured on the local A5 service; validate the Nightly
# image and ModelScope model artifact in CI.
test_cases:
  - name: "Qwen3.8-Flash-Next-w8a8-mxfp8-mtp-A5"
    model: "Eco-Tech/Qwen3.8-Flash-Next-w8a8-mxfp8-mtp"
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
      HCCL_NPU_SOCKET_PORT_RANGE: "16700-16799"
      SOC_VERSION: "ascend950dt_9582"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
      VLLM_RPC_TIMEOUT: "6000"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "1"
      - "--max-model-len"
      - "141312"
      - "--max-num-seqs"
      - "32"
      - "--max-num-batched-tokens"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--no-enable-prefix-caching"
      - "--async-scheduling"
      - "--enable-expert-parallel"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes":[1,2,4,8,12,16,20,24,28,32],"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
      - "--speculative-config"
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
    test_content:
      - "chat_completion"
    prompts:
      - "Who are you?"
    api_keyword_args:
      max_tokens: 1024
      temperature: 0
      top_p: 1
      chat_template_kwargs:
        enable_thinking: false
    benchmarks:
      acc_aime2026:
        case_type: accuracy
        dataset_path: evalscope/aime26
        request_conf: vllm_api_stream_chat
        dataset_conf: aime2026/aime2026_gen_0_shot_chat_prompt
        max_out_len: 65536
        batch_size: 32
        baseline: 94.44
        threshold: 10
        temperature: 1.0
        top_k: 20
        top_p: 0.95
        repetition_penalty: 1.0
        trust_remote_code: false
      perf_128k:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in131072-bs100-qwen3
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        max_out_len: 1024
        batch_size: 4
        request_rate: 0
        baseline: 43.8566
        threshold: 0.97
        temperature: 0
      perf_3_5k:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs8000-qwen3
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 140
        max_out_len: 1500
        batch_size: 32
        request_rate: 0
        baseline: 155.1464
        threshold: 0.97
        temperature: 0
