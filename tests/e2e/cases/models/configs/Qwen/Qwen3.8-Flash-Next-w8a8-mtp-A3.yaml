# A3 serving settings follow the user-provided Qwen3.8-Flash-Next-w8a8
# startup command. CI supplies its own model location, port, and NPU IDs.
# The CI image must provide the CANN/ATB environment used by that command.
# Requires matching vLLM, vllm-ascend and compiled operators; CI runtime
# behavior has not been validated on NPU by this configuration review.
test_cases:
  - name: "Qwen3.8-Flash-Next-w8a8-mtp-A3"
    model: "Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp"
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      VLLM_ASCEND_ENABLE_QSA_E3V: "0"
      VLLM_ASCEND_ENABLE_QSA_MAIN_FUSED_NORM_ROPE: "1"
      VLLM_ASCEND_FORCE_QSA_REFERENCE: "0"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
      VLLM_RPC_TIMEOUT: "6000"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--tensor-parallel-size"
      - "8"
      - "--data-parallel-size"
      - "1"
      - "--max-model-len"
      - "141312"
      - "--max-num-seqs"
      - "32"
      - "--max-num-batched-tokens"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--no-enable-prefix-caching"
      - "--async-scheduling"
      - "--enable-expert-parallel"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes":[1,2,4,8,12,16,20,24,28,32],"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_norm_quant":false}}'
    test_content:
      - "chat_completion"
    prompts:
      - "Who are you?"
    api_keyword_args:
      max_tokens: 1024
      temperature: 0
      top_p: 1
      chat_template_kwargs:
        enable_thinking: false
    benchmarks:
      acc_gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 120000
        batch_size: 32
        baseline: 90.91
        threshold: 10
        temperature: 0
      perf_3_5k:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs8000-qwen3
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 128
        max_out_len: 1500
        batch_size: 35
        request_rate: 0
        baseline: 108.0658
        threshold: 0.97
      perf_128k:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in131072-bs100-qwen3
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 8
        max_out_len: 1024
        batch_size: 2
        request_rate: 0
        baseline: 16.8597
        threshold: 0.97
