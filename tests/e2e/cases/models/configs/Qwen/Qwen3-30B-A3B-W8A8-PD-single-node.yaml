# ==========================================
# Single-Node PD Disaggregation: Qwen3-30B-A3B W8A8 (1P1D)
# ==========================================
# One Atlas 800I A3 machine (8 NPUs):
#   Prefill engine: kv_producer, TP4, devices auto-assigned by RemotePDServer (0-3)
#   Decode  engine: kv_consumer, TP4, devices auto-assigned by RemotePDServer (4-7)
#   PD proxy: examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
# KV transfer: MooncakeConnectorV2 with use_ascend_direct
# NOTE: baseline=0 means "record only" — calibrate after the first stable run.
# NOTE: envs are shared by both engines (per-instance envs are a follow-up).
# ==========================================

_envs: &envs
  VLLM_USE_MODELSCOPE: "true"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  PREFILL_PORT: "DEFAULT_PORT"
  DECODE_PORT: "DEFAULT_PORT"
  PROXY_PORT: "DEFAULT_PORT"
  VLLM_MOONCAKE_CONNECTOR_TIMEOUT: "1800"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"

test_cases:
  - name: "Qwen3-30B-A3B-W8A8-PD-single-node"
    model: "vllm-ascend/Qwen3-30B-A3B-W8A8"
    service_mode: "pd"
    envs:
      <<: *envs
    pd_server_cmds:
      # -------- Prefill engine (kv_producer) --------
      - - "vllm-ascend/Qwen3-30B-A3B-W8A8"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "$PREFILL_PORT"
        - "--tensor-parallel-size"
        - "4"
        - "--enable-expert-parallel"
        - "--seed"
        - "1024"
        - "--max-model-len"
        - "32768"
        - "--max-num-batched-tokens"
        - "16384"
        - "--max-num-seqs"
        - "64"
        - "--trust-remote-code"
        - "--no-enable-prefix-caching"
        - "--gpu-memory-utilization"
        - "0.9"
        - "--kv-transfer-config"
        - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 1, "tp_size": 4}, "decode": {"dp_size": 1, "tp_size": 4}}}'
      # -------- Decode engine (kv_consumer) --------
      - - "vllm-ascend/Qwen3-30B-A3B-W8A8"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "$DECODE_PORT"
        - "--tensor-parallel-size"
        - "4"
        - "--enable-expert-parallel"
        - "--seed"
        - "1024"
        - "--max-model-len"
        - "32768"
        - "--max-num-batched-tokens"
        - "256"
        - "--max-num-seqs"
        - "32"
        - "--trust-remote-code"
        - "--no-enable-prefix-caching"
        - "--gpu-memory-utilization"
        - "0.9"
        - "--compilation-config"
        - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
        - "--kv-transfer-config"
        - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_consumer", "kv_port": "30100", "engine_id": "1", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 1, "tp_size": 4}, "decode": {"dp_size": 1, "tp_size": 4}}}'
    benchmarks:
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs400
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 64
        max_out_len: 1024
        batch_size: 16
        request_rate: 0
        baseline: 0
        threshold: 0.97