test_name: "QWEN3_235B_PD_3_5K_1_5k"
model: "vllm-ascend/Qwen3-235B-A22B-W8A8"
num_nodes: 3
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1, 2 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 2
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 32
    dp_size_local: 16
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 32
    dp_size_local: 16
    dp_rank_start: 16
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  VLLM_USE_MODELSCOPE: "true"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH"
  LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "${PORT}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "256"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1024"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "36864"
      - --max-num-batched-tokens
      - "16384"
      - --max-num-seqs
      - "16"
      - --enforce-eager
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --no-enable-prefix-caching
      # #4623 removed Ascend Scheduler; use the vLLM scheduler CLI instead.
      - --enable-chunked-prefill
      - --additional-config
      - '{"enable_flashcomm1": true,"ascend_compilation_config":{"enable_npugraph_ex":true, "enable_static_kernel":true}}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"use_ascend_direct": true,"prefill": {"dp_size": 2, "tp_size": 8}, "decode": {"dp_size": 32, "tp_size": 1}}}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "36864"
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "15"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --no-enable-prefix-caching
      - --enable-eplb
      - --eplb-config
      - '{"window_size":4000,"step_interval":200,"num_redundant_experts":0,"use_async":true}'
      - --additional-config
      - '{"finegrained_tp_config": {"lmhead_tensor_parallel_size":8},"enable_flashcomm1": true,"ascend_compilation_config":{"enable_npugraph_ex":true, "enable_static_kernel":true}}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30200", "engine_id": "2", "kv_connector_extra_config": {"use_ascend_direct": true,"prefill": {"dp_size": 2, "tp_size": 8}, "decode": {"dp_size": 32, "tp_size": 1}}}'

  - node_index: 2
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "36864"
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "15"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --no-enable-prefix-caching
      - --enable-eplb
      - --eplb-config
      - '{"window_size":4000,"step_interval":200,"num_redundant_experts":0,"use_async":true}'
      - --additional-config
      - '{"finegrained_tp_config": {"lmhead_tensor_parallel_size":8},"enable_flashcomm1": true,"ascend_compilation_config":{"enable_npugraph_ex":true, "enable_static_kernel":true}}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30200", "engine_id": "2", "kv_connector_extra_config": {"use_ascend_direct": true,"prefill": {"dp_size": 2, "tp_size": 8}, "decode": {"dp_size": 32, "tp_size": 1}}}'

benchmarks:
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 32768
    batch_size: 64
    baseline: 96.74
    threshold: 2
    temperature: 0.6
    top_p: 0.95
    ignore_eos: false
    thinking: true
  perf_1:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs8000-qwen3
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 760
    max_out_len: 1500
    batch_size: 190
    request_rate: 0
    baseline: 3583.8747
    threshold: 0.97
