# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  HCCL_IF_IP: "127.0.0.1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  SERVER_PORT: "DEFAULT_PORT"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--host"
  - "0.0.0.0"
  - "--data-parallel-size"
  - "1"
  - "--tensor-parallel-size"
  - "2"
  - "--max-num-seqs"
  - "32"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--trust-remote-code"
  - "--async-scheduling"
  - "--allowed-local-media-path"
  - "/"
  - "--quantization"
  - "ascend"
  - "--mm-processor-cache-gb"
  - "0"
  - "--mm-encoder-tp-mode"
  - "data"
  - "--mm-processor-cache-type"
  - "shm"
  - "--additional-config"
  - '{"enable_cpu_binding": true}'
  - "--api-server-count"
  - "4"

_benchmarks_acc: &benchmarks_acc
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 32768
    batch_size: 32
    baseline: 84.34
    threshold: 5
    temperature: 0.6
    top_p: 0.95
    ignore_eos: false
    thinking: true

_benchmarks_3500_50: &benchmarks_3500_50
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs8000-qwen3
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 60
    max_out_len: 1500
    batch_size: 15
    request_rate: 0
    baseline: 701.55
    threshold: 0.97

_benchmarks_3500_20: &benchmarks_3500_20
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs8000-qwen3
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 48
    max_out_len: 1500
    batch_size: 12
    request_rate: 0
    baseline: 115.03
    threshold: 0.97

_benchmarks_prefix_64k_50: &benchmarks_prefix_64k_50
  perf_prefix_90:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_qwen
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1024
    batch_size: 1
    request_rate: 0
    baseline: 1
    threshold: 0.1
  perf_64k:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_qwen
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 72
    max_out_len: 1024
    batch_size: 18
    request_rate: 0
    baseline: 284.9
    threshold: 0.97

_benchmarks_prefix_128k_50: &benchmarks_prefix_128k_50
  perf_prefix_90:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs100_qwen
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1024
    batch_size: 1
    request_rate: 0
    baseline: 1
    threshold: 0.1
  perf_128k:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs100_qwen
    request_conf: vllm_api_stream_chat
