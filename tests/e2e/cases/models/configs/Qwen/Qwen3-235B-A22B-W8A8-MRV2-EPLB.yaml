# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  OMP_NUM_THREADS: "10"
  OMP_PROC_BIND: "false"
  HCCL_BUFFSIZE: "1024"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "DEFAULT_PORT"
  VLLM_USE_V2_MODEL_RUNNER: "1"

_server_cmd: &server_cmd
  - "--quantization"
  - "ascend"
  - "--data-parallel-size"
  - "4"
  - "--tensor-parallel-size"
  - "4"
  - "--enable-expert-parallel"
  - "--enable-eplb"
  - "--eplb-config"
  - '{"window_size": 600, "step_interval": 50, "num_redundant_experts": 16, "use_async": true, "log_balancedness": true, "log_balancedness_interval": 1}'
  - "--port"
  - "$SERVER_PORT"
  - "--max-model-len"
  - "40960"
  - "--max-num-batched-tokens"
  - "8192"
  - "--max-num-seqs"
  - "12"
  - "--trust-remote-code"
  - "--gpu-memory-utilization"
  - "0.9"

_benchmarks: &benchmarks
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 32768
    batch_size: 32
    top_k: 20
    baseline: 95
    threshold: 10

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3-235B-A22B-W8A8-MRV2-EPLB"
    model: "vllm-ascend/Qwen3-235B-A22B-W8A8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--additional-config"
      - '{"eplb_config": {"load_collection_phase": "all"}}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    benchmarks:
      <<: *benchmarks
