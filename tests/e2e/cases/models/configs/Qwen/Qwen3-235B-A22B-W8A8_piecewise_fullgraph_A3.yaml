# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  HCCL_BUFFSIZE: "1024"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "DEFAULT_PORT"

_server_cmd: &server_cmd
  - "--async-scheduling"
  - "--tensor-parallel-size"
  - "4"
  - "--data-parallel-size"
  - "4"
  - "--data-parallel-size-local"
  - "4"
  - "--data-parallel-start-rank"
  - "0"
  - "--data-parallel-rpc-port"
  - "2345"
  - "--max-num-seqs"
  - "120"
  - "--max-model-len"
  - "40960"
  - "--max-num-batched-tokens"
  - "16384"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--enable-expert-parallel"
  - "--port"
  - "$SERVER_PORT"
  - "--quantization"
  - "ascend"
  - "--trust-remote-code"
  - "--host"
  - "0.0.0.0"
  - "--data-parallel-address"
  - "0.0.0.0"

_benchmarks: &benchmarks
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 38912
    num_prompts: 32
    batch_size: 32
    baseline: 100
    threshold: 4

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3_235B_Accuracy_PIECEWISE_gsm8k_lite"
    model: "Eco-Tech/Qwen3-235B-A22B-w8a8-QuaRot"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--compilation-config"
      - '{"cudagraph_mode": "PIECEWISE"}'
      - "--hf-overrides"
      - '{"rope_parameters": {"rope_type":"yarn","rope_theta": 1000000.0,"factor":4.3,"original_max_position_embeddings":32768}}'
      - "--additional-config"
      - '{"pa_shape_list": [4,8,16,32,48,64,96,128,160,192],"enable_flashcomm1": true,"ascend_compilation_config":{"enable_npugraph_ex":true, "enable_static_kernel":true}}'
    benchmarks:
      <<: *benchmarks

  - name: "Qwen3_235B_Accuracy_FULL_Graph_gsm8k_lite"
    model: "Eco-Tech/Qwen3-235B-A22B-w8a8-QuaRot"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--hf-overrides"
      - '{"rope_parameters": {"rope_type":"yarn","rope_theta": 1000000.0,"factor":4.3,"original_max_position_embeddings":32768}}'
      - "--additional-config"
      - '{"pa_shape_list": [4,8,16,32,48,64,96,128,160,192],"enable_flashcomm1": true,"ascend_compilation_config":{"enable_npugraph_ex":true, "enable_static_kernel":true}}'
    benchmarks:
      <<: *benchmarks

