#混部
test_name: "Eco-Tech/Qwen3.6-35B-A3B-w4a8-mxfp-A5"
model: "Eco-Tech/Qwen3.6-35B-A3B-w4a8-mxfp"
num_nodes: 2
npu_per_node: 8
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  - node_index: 0
    port_start: 8872
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 8872
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
  VLLM_ENGINE_READY_TIMEOUT_S: "2400"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"

env_prefill: &env_prefill
  <<: *env_common

env_decode: &env_decode
  <<: *env_common

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --served-model-name
      - qwen3.6-35b
      - --tokenizer
      - /mnt/share/w00804037/qwen3_6_35b_a3b_w4a8_linear_attn_all
      - --trust-remote-code
      - --allowed-local-media-path
      - /mnt/share/w60043782/MMMU_pro/MMMU_Pro_options10_images
      - --quantization
      - ascend
      - --safetensors-load-strategy
      - lazy
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --max-model-len
      - "135168"
      - --max-num-seqs
      - "128"
      - --max-num-batched-tokens
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --seed
      - "1024"
      - --no-enable-prefix-caching
      - --speculative-config
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128]}'
      - --additional-config
      - '{"enable_cpu_binding":true,"enable_fused_mc2":0,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
      - --profiler-config
      - '{"profiler":"torch","torch_profiler_dir":"/mnt/share/c00913619/profiling","torch_profiler_with_stack":false}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_producer","kv_port":"30000","engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":1},"decode":{"dp_size":1,"tp_size":1}}}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --served-model-name
      - qwen3.6-35b
      - --tokenizer
      - /mnt/share/w00804037/qwen3_6_35b_a3b_w4a8_linear_attn_all
      - --trust-remote-code
      - --allowed-local-media-path
      - /mnt/share/w60043782/MMMU_pro/MMMU_Pro_options10_images
      - --quantization
      - ascend
      - --safetensors-load-strategy
      - lazy
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --max-model-len
      - "135168"
      - --max-num-seqs
      - "128"
      - --max-num-batched-tokens
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --seed
      - "1024"
      - --no-enable-prefix-caching
      - --speculative-config
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128]}'
      - --additional-config
      - '{"enable_cpu_binding":true,"enable_fused_mc2":0,"multistream_overlap_shared_expert":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}'
      - --profiler-config
      - '{"profiler":"torch","torch_profiler_dir":"/mnt/share/c00913619/profiling","torch_profiler_with_stack":false}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_consumer","kv_port":"30002","engine_id":"1","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":1},"decode":{"dp_size":1,"tp_size":1}}}'

benchmarks:
  per_TPOT50_128k_1_prefie_warmup:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/GSM8K-in3500-bs128-dsv4-flash
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    temperature: 1.0
    num_prompts: 512
    max_out_len: 128
    batch_size: 128
    request_rate: 0
    baseline: 1
    threshold: 0.95
    ignore_eos: True