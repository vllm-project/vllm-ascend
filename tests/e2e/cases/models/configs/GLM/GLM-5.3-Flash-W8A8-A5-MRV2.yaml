# GLM-5.3-Flash single-node MRV2 accuracy coverage.
# CI uses shared checkpoints and dynamic service ports.
# GSM8K-lite baseline 90 / threshold 10 is an initial gate, pending MRV2 calibration.
test_cases:
- name: GLM-5.3-Flash-W8A8-A5-MRV2
  model: /root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.3-Flash-w8a8-mxfp8
  envs:
    VLLM_USE_V2_MODEL_RUNNER: '1'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    HCCL_BUFFSIZE: '1024'
    HCCL_EXEC_TIMEOUT: '3600'
    HCCL_CONNECT_TIMEOUT: '3600'
    ASCEND_RT_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
    SERVER_PORT: DEFAULT_PORT
  server_cmd:
  - --host
  - 0.0.0.0
  - --port
  - $SERVER_PORT
  - --max-model-len
  - '1048576'
  - --data-parallel-size
  - '1'
  - --tensor-parallel-size
  - '8'
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --quantization
  - ascend
  - --safetensors-load-strategy
  - prefetch
  - --max-num-seqs
  - '8'
  - --max-num-batched-tokens
  - '16384'
  - --trust-remote-code
  - --gpu-memory-utilization
  - '0.94'
  - --limit-mm-per-prompt
  - '{"image": 1, "video": 0}'
  - --kv-cache-dtype
  - auto
  - --attention-config
  - '{"indexer_kv_dtype": "bf16"}'
  - --compilation-config
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - --speculative-config
  - '{"num_speculative_tokens": 5, "method": "deepseek_mtp"}'
  - --additional-config
  - '{"multistream_overlap_shared_expert": true, "enable_shared_expert_dp": true, "enable_flashcomm1": true, "enable_cpu_binding":
    true, "enable_dsa_cp": true, "enable_fused_mc2": 0}'
  prompts:
  - Reply with one short sentence confirming the service is healthy.
  test_content:
  - chat_completion
  api_keyword_args:
    max_tokens: 16
    temperature: 0.0
  benchmarks:
    accuracy_placeholder_gsm8k:
      case_type: accuracy
      dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gsm8k-lite
      request_conf: vllm_api_general_chat
      dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
      max_out_len: 4096
      batch_size: 4
      temperature: 0
      baseline: 90
      threshold: 10
