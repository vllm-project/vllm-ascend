  dp_size: 8
  dp_size_local: 4
  dp_rank_start: 0
  tp_size: 2
  dp_address: ${NODE_2_IP}
- node_index: 3
  port_start: 7100
  dp_rpc_port: 12321
  dp_size: 8
  dp_size_local: 4
  dp_rank_start: 4
  tp_size: 2
  dp_address: ${NODE_2_IP}
