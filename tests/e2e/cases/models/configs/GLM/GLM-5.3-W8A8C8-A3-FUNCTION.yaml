# GLM-5.3 W8A8C8 RP3 PD coverage.
# 16 physical A3 cards (32 logical NPUs); combined RP3 feature smoke with a nonempty completion.
# Bound prefill/decode batches to 256/128 tokens and eight concurrent sequences.
# Full-weight services retain a 0.92 memory budget, MTP and 16K context.
test_name: GLM-5.3-W8A8C8-A3-FUNCTION
model: Eco-Tech/GLM-5.3-w8a8c8
num_nodes: 4
npu_per_node: 8
dp_load_balancing: external
routing:
  type: disaggregated_prefill
  groups:
    prefiller:
    - 0
    - 1
    decoder:
    - 2
    - 3
config:
- node_index: 0
  port_start: 7100
  dp_rpc_port: 12321
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 1
  cp_size: 8
  pp_size: 2
  nnodes: 2
  node_rank: 0
  master_addr: ${NODE_0_IP}
  master_port: 7060
  is_headless: false
  dp_address: ${NODE_0_IP}
- node_index: 1
  port_start: 7100
  dp_rpc_port: 12321
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 1
  cp_size: 8
  pp_size: 2
  nnodes: 2
  node_rank: 1
  master_addr: ${NODE_0_IP}
