# Fixed ordinary-PD deployment; see the Flash weekly README for cache/ReplaySSM scope.
test_name: GLM-5.3-Flash-W8A8-A3-PD-ReplaySSM
model: Eco-Tech/GLM-5.3-Flash-w8a8
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external
routing:
  type: disaggregated_prefill
  groups:
    prefiller:
    - 0
    decoder:
    - 1
config:
- node_index: 0
  port_start: 9081
  dp_rpc_port: 12325
  dp_size: 2
  dp_size_local: 2
  dp_rank_start: 0
  tp_size: 1
  cp_size: 8
  dp_address: ${NODE_0_IP}
- node_index: 1
  port_start: 9900
  dp_rpc_port: 12325
  dp_size: 8
  dp_size_local: 8
  dp_rank_start: 0
  tp_size: 2
  dp_address: ${NODE_1_IP}
templates:
- node_index: 0
  envs:
    VLLM_USE_V2_MODEL_RUNNER: '1'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    HCCL_OP_EXPANSION_MODE: AIV
    SERVER_PORT: ${PORT}
    ASCEND_RT_VISIBLE_DEVICES: ${VISIBLE_DEVICES}
    HCCL_IF_IP: ${LOCAL_IP}
    GLOO_SOCKET_IFNAME: eth0
    TP_SOCKET_IFNAME: eth0
    HCCL_SOCKET_IFNAME: eth0
    ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc": ["hccs:device"]}'
    HCCL_BUFFSIZE: '1024'
  server_cmd_template:
  - ${MODEL}
  - --host
  - 0.0.0.0
  - --port
  - $SERVER_PORT
  - --data-parallel-size
  - ${DP_SIZE}
  - --data-parallel-rank
  - ${DP_RANK}
  - --data-parallel-address
  - ${DP_ADDRESS}
  - --data-parallel-rpc-port
  - ${DP_RPC_PORT}
  - --tensor-parallel-size
  - ${TP_SIZE}
  - --prefill-context-parallel-size
  - ${CP_SIZE}
  - --enable-expert-parallel
  - --enable-eplb
  - --eplb-config
  - '{"window_size":3000,"step_interval":3000,"num_redundant_experts":0,"use_async":true,"policy":"stair","communicator":"hixl"}'
  - --seed
  - '1024'
  - --safetensors-load-strategy
  - prefetch
  - --max-num-seqs
  - '32'
  - --max-model-len
  - '1048576'
  - --max-num-batched-tokens
  - '16384'
  - --trust-remote-code
  - --quantization
  - ascend
  - --limit-mm-per-prompt
  - '{"image":1}'
  - --gpu-memory-utilization
  - '0.92'
  - --tool-call-parser
  - glm47
  - --reasoning-parser
  - glm47
  - --enable-auto-tool-choice
  - --kv-cache-dtype
  - int8
  - --attention-config.indexer_kv_dtype
  - int8
  - --prefix-cache-retention-interval
  - None
  - --enforce-eager
  - --mamba-ssm-cache-dtype
  - bfloat16
  - --speculative-config
  - '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": false}'
  - --additional-config
  - '{"enable_shared_expert_dp": true,"enable_fused_mc2":2}'
  - --kv-transfer-config
  - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "engine_id": "0", "kv_port": "36680", "kv_connector_extra_config": {"prefill": {"dp_size":
    2, "tp_size": 1, "pcp_size": 8}, "decode": {"dp_size": 8, "tp_size": 2, "pcp_size": 1}}}'
  - --no-enable-prefix-caching
  - --use-replayssm
- node_index: 1
  envs:
    VLLM_USE_V2_MODEL_RUNNER: '1'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    HCCL_OP_EXPANSION_MODE: AIV
    SERVER_PORT: ${PORT}
    ASCEND_RT_VISIBLE_DEVICES: ${VISIBLE_DEVICES}
    HCCL_IF_IP: ${LOCAL_IP}
    GLOO_SOCKET_IFNAME: eth0
    TP_SOCKET_IFNAME: eth0
    HCCL_SOCKET_IFNAME: eth0
    ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc": ["hccs:device"]}'
    HCCL_BUFFSIZE: '1024'
  server_cmd_template:
  - ${MODEL}
  - --host
  - 0.0.0.0
  - --port
  - $SERVER_PORT
  - --data-parallel-size
  - ${DP_SIZE}
  - --data-parallel-rank
  - ${DP_RANK}
  - --data-parallel-address
  - ${DP_ADDRESS}
  - --data-parallel-rpc-port
  - ${DP_RPC_PORT}
  - --tensor-parallel-size
  - ${TP_SIZE}
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --safetensors-load-strategy
  - prefetch
  - --max-num-seqs
  - '40'
  - --max-model-len
  - '1048576'
  - --max-num-batched-tokens
  - '240'
  - --trust-remote-code
  - --quantization
  - ascend
  - --limit-mm-per-prompt
  - '{"image":1}'
  - --gpu-memory-utilization
  - '0.92'
  - --tool-call-parser
  - glm47
  - --reasoning-parser
  - glm47
  - --enable-auto-tool-choice
  - --kv-cache-dtype
  - int8
  - --attention-config.indexer_kv_dtype
  - int8
  - --mamba-ssm-cache-dtype
  - bfloat16
  - --compilation-config
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - --speculative-config
  - '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": false}'
  - --additional-config
  - "{\n        \"multistream_overlap_shared_expert\": true,\n        \"scheduler_config\": {\"recompute_scheduler_enable\": true},\n        \"enable_shared_expert_dp\"\
    : true,\n        \"enable_flashcomm1\": true\n      }"
  - --kv-transfer-config
  - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_consumer", "engine_id": "1", "kv_port": "36580", "kv_connector_extra_config": {"prefill": {"dp_size":
    2, "tp_size": 1, "pcp_size": 8}, "decode": {"dp_size": 8, "tp_size": 2, "pcp_size": 1}}}'
  - --no-enable-prefix-caching
  - --use-replayssm
