# Full checkpoint: no layer overrides or dummy weights.
# See README.md for resource assumptions and calibration requirements.
# GPQA acceptance floor = existing A3 reference 91.92 - 5; not a measured A5 baseline.
test_name: "GLM-5.3-W8A8C8-A3-ACCURACY"
model: "Eco-Tech/GLM-5.3-w8a8c8"
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0, 1 ]
    decoder: [ 2, 3 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    cp_size: 16
    pp_size: 2
    nnodes: 2
    node_rank: 0
    master_addr: "${NODE_0_IP}"
    master_port: 7060
    is_headless: false
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    cp_size: 16
    pp_size: 2
    nnodes: 2
    node_rank: 1
    master_addr: "${NODE_0_IP}"
    master_port: 7060
    is_headless: true
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 8
    tp_size: 2
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["hccs:device"]}'
  ASCEND_LOCAL_COMM_RES: '{"version":"1.2"}'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "1800"
  HCCL_CONNECT_TIMEOUT: "1800"
  ASCEND_TRANSFER_TIMEOUT: "10000"
  VLLM_USE_MODELSCOPE: true
env_prefill: &env_prefill
  <<: *env_common
  # DispatchFFNCombine needs 1162 MiB for 8192 tokens per TP rank.
  HCCL_BUFFSIZE: "2560"
  VLLM_USE_FASTOKENS: "1"
  VLLM_PP_LAYER_PARTITION: "42,36"

env_decode: &env_decode
  <<: *env_common
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--prefill-context-parallel-size"
      - "${CP_SIZE}"
      - "--pipeline-parallel-size"
      - "${PP_SIZE}"
      - "--distributed-executor-backend"
      - "mp"
      - "--master-addr"
      - "${MASTER_ADDR}"
      - "--master-port"
      - "${MASTER_PORT}"
      - "--nnodes"
      - "2"
      - "--node-rank"
      - "${NODE_RANK}"
      - "--enable-expert-parallel"
      - "--enable-chunked-prefill"
      - "--no-enable-prefix-caching"
      - "--async-scheduling"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "200000"
      - "--max-num-batched-tokens"
      - "16384"
      - "--trust-remote-code"
      - "--max-num-seqs"
      - "64"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--quantization"
      - "ascend"
      - "--safetensors-load-strategy"
      - "prefetch"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm47"
      - "--enforce-eager"
      - "--kv-cache-dtype"
      - "int8"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--additional-config"
      - '{"enable_fused_mc2": 1, "enable_flashcomm1": true}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 1, "method": "deepseek_mtp", "enforce_eager": true}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 1, "pp_layer_partition": "42,36"}, "decode": {"dp_size": 16, "tp_size": 2}}}'

