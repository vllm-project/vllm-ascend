# Deployment parameters: docs/source/tutorials/models/GLM5.3-Flash.md section 5.3.
# CI adaptations: shared checkpoint path, dynamic ports/network, default served name.
# Public checkpoint replaces the self-test's local requantized copy; revalidate results.
test_name: "GLM-5.3-Flash-W8A8-A5-PD-smoke"
model: "/root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.3-Flash-w8a8-mxfp8"
dp_load_balancing: external
num_nodes: 2
npu_per_node: 8
routing:
  type: disaggregated_prefill
  groups:
    prefiller: [0]
    decoder: [1]
config:
  - {"node_index":0,"port_start":9081,"dp_rpc_port":12325,"dp_size":1,"dp_size_local":1,"dp_rank_start":0,"tp_size":8,"dp_address":"${NODE_0_IP}"}
  - {"node_index":1,"port_start":9900,"dp_rpc_port":12325,"dp_size":8,"dp_size_local":8,"dp_rank_start":0,"tp_size":1,"dp_address":"${NODE_1_IP}"}
templates:
  - node_index: 0
    envs:
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_BUFFSIZE: "1024"
      HCCL_OP_EXPANSION_MODE: "AIV"
      ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "8"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--max-num-seqs"
      - "32"
      - "--max-model-len"
      - "133120"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--limit-mm-per-prompt"
      - "{\"image\":1,\"video\":0}"
      - "--speculative-config"
      - "{\"num_speculative_tokens\":5,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"
      - "--kv-transfer-config"
      - "{\"kv_connector\":\"MooncakeConnectorV2\",\"kv_role\":\"kv_producer\",\"kv_port\":\"28000\"}"
  - node_index: 1
    envs:
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_BUFFSIZE: "1024"
      HCCL_OP_EXPANSION_MODE: "AIV"
      ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--max-num-seqs"
      - "10"
      - "--max-model-len"
      - "133120"
      - "--max-num-batched-tokens"
      - "60"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--limit-mm-per-prompt"
      - "{\"image\":1,\"video\":0}"
      - "--compilation-config"
      - "{\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}"
      - "--speculative-config"
      - "{\"num_speculative_tokens\":5,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"
      - "--kv-transfer-config"
      - "{\"kv_connector\":\"MooncakeConnectorV2\",\"kv_role\":\"kv_consumer\",\"kv_port\":\"28100\"}"
test_content:
  - chat_completion
chat_prompts:
  - "Reply with one short sentence confirming the P/D service is healthy."
api_keyword_args:
  max_tokens: 16
  temperature: 0.0
# PLACEHOLDER ONLY: invented values for initial community-resource runs.
# These are NOT measured accuracy/performance baselines. Replace per case after
# calibration; initial gate failures must not be classified as regressions.
# Provision these datasets on the shared A5 volume before running offline CI.
benchmarks:
  accuracy_placeholder_gsm8k:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 4096
    batch_size: 4
    temperature: 0
    baseline: 90
    threshold: 10
  performance_placeholder_3_5k_1k:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/GSM8K-in3500-bs400
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 1024
    batch_size: 4
    request_rate: 0
    baseline: 1000
    threshold: 0.97
