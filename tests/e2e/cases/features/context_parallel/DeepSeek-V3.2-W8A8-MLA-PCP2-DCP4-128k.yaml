# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "DeepSeek-V3.2-W8A8-MLA-PCP2-DCP4-128k"
    model: "vllm-ascend/DeepSeek-V3.2-W8A8-Pruning"
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "10"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "1024"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--seed"
      - "1024"
      - "--tensor-parallel-size"
      - "2"
      - "--prefill-context-parallel-size"
      - "2"
      - "--decode-context-parallel-size"
      - "4"
      - "--enable-expert-parallel"
      - "--quantization"
      - "ascend"
      - "--cp-kv-cache-interleave-size"
      - "128"
      - "--block-size"
      - "128"
      - "--max-model-len"
      - "133120"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "8"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    benchmarks:
      # The CI checkpoint is pruned, so accuracy is a smoke guard only:
      # record it and recalibrate after switching to the release checkpoint.
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 10240
        batch_size: 16
        baseline: 0
        threshold: 100
      perf:
        # Long-input (128k) throughput: record it first, then set the baseline.
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs1000_deepseek
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 8
        max_out_len: 128
        batch_size: 8
        request_rate: 0
        baseline: 0
        threshold: 0.95
