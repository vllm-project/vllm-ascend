# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3-30B-A3B-VWN-eagle3-PCP"
    model: "Qwen/Qwen3-30B-A3B"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "768"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--data-parallel-size"
      - "2"
      - "--tensor-parallel-size"
      - "2"
      - "--prefill-context-parallel-size"
      - "2"
      - "--port"
      - "$SERVER_PORT"
      - "--max-model-len"
      - "40960"
      - "--max-num-batched-tokens"
      - "4096"
      - "--max-num-seqs"
      - "16"
      - "--block-size"
      - "128"
      - "--trust-remote-code"
      - "--enable-expert-parallel"
      - "--distributed-executor-backend"
      - "mp"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--async-scheduling"
      - "--speculative-config"
      - '{"method": "eagle3", "model": "vllm-ascend/Qwen3-30B-A3B-vwn-eagle-model", "num_speculative_tokens": 3}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    benchmarks:
      # Initial GSM8K-lite reference from test_qwen3_30b_acc.py.
      # Recalibrate this BF16 + VWN combination in CI.
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 32768
        batch_size: 32
        baseline: 95
        threshold: 5
