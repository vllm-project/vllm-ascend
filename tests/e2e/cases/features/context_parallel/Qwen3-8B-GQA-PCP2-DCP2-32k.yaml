# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3-8B-GQA-PCP2-DCP2-32k"
    model: "Qwen/Qwen3-8B"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "768"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--tensor-parallel-size"
      - "2"
      - "--prefill-context-parallel-size"
      - "2"
      - "--decode-context-parallel-size"
      - "2"
      - "--cp-kv-cache-interleave-size"
      - "128"
      - "--block-size"
      - "128"
      - "--max-model-len"
      - "33792"
      - "--max-num-batched-tokens"
      - "4096"
      - "--max-num-seqs"
      - "16"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    benchmarks:
      # Initial values for BF16 Qwen3-8B on the four-card A3 runner;
      # recalibrate baseline/threshold from the first nightly result.
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 10240
        batch_size: 32
        baseline: 93.3
        threshold: 5
        temperature: 0
        top_p: 0.95
      perf:
        # Long-input (32k) throughput: record it first, then set the baseline.
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix90_in32768_bs100_qwen
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 32
        max_out_len: 128
        batch_size: 8
        request_rate: 0
        baseline: 0
        threshold: 0.95
