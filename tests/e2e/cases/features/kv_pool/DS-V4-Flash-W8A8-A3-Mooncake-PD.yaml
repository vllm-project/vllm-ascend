# Based on the official A3 DSpark PD deployment: P DP4 x TP4, D DP16 x TP1.
# https://docs.vllm.ai/projects/ascend/zh-cn/latest/tutorials/models/DeepSeek-V4-Flash.html
# MooncakeHybridConnector transfers P-to-D KV; AscendStoreConnector provides pooling.
# The framework manages mooncake_master and MOONCAKE_CONFIG_PATH.
# Keep the model ID as the served name for AISBench; disable P's local prefix
# cache to exercise pool reads during replay instead of local cache reuse.
test_name: "DS-V4-Flash-W8A8-A3-Mooncake-PD"
model: "Eco-Tech/DeepSeek-V4-Flash-0731-w8a8"
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  ACL_OP_INIT_MODE: "1"
  ASCEND_ENABLE_USE_FABRIC_MEM: "1"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages:$LD_LIBRARY_PATH"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  PYTHONHASHSEED: "0"

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

kv_pool:
  type: mooncake
  master_port: 50088
  metrics_port: 50089
  config:
    metadata_server: "P2PHANDSHAKE"
    protocol: "ascend"
    device_name: ""
    global_segment_size: "1GB"
    preferred_segment: false
    prefer_alloc_in_same_node: true
    enable_ssd_offload: false

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 16
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1800"
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "2400"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - $SERVER_PORT
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--no-enable-prefix-caching"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 5,"method": "dspark","enforce_eager": true}'
      - "--trust-remote-code"
      - "--block-size"
      - "32"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--quantization"
      - "ascend"
      - "--enforce-eager"
      - "--additional-config"
      - '{"enable_cpu_binding": true, "enable_dsa_cp": true, "enable_flashcomm1":true}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 4, "tp_size": 4}, "decode": {"dp_size": 16, "tp_size": 1}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "mooncake", "use_layerwise": false, "lookup_rpc_port": "0"}}]}, "engine_id": "0"}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - $SERVER_PORT
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "480"
      - "--max-num-seqs"
      - "60"
      - "--async-scheduling"
      - "--block-size"
      - "32"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--no-enable-prefix-caching"
      - "--trust-remote-code"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [12, 24, 48, 96, 192, 256, 288, 360]}'
      - "--quantization"
      - "ascend"
      - "--speculative-config"
      - '{"num_speculative_tokens": 5,"method": "dspark","enforce_eager": true}'
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false}, "enable_cpu_binding":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable":true}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_consumer", "kv_port": "30100", "kv_connector_extra_config": {"prefill": {"dp_size": 4, "tp_size": 4}, "decode": {"dp_size": 16, "tp_size": 1}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"backend": "mooncake", "use_layerwise": false, "lookup_rpc_port": "0"}}]}, "engine_id": "1"}'

benchmarks:
  # Run the same 32K-input workload twice: populate, then replay the pool.
  # These are smoke-test throughput floors, not measured model baselines.
  # Calibrate regression thresholds after the first successful A3 run.
  perf_populate: &perf_pool
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in32768_bs1000_deepseek
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 128
    batch_size: 8
    request_rate: 0
    temperature: 0.0
    seed: 1024
    baseline: 1
    threshold: 1
    input_throughput_baseline: 100
    input_throughput_threshold: 1
  perf_replay:
    <<: *perf_pool
  acc_gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    batch_size: 32
    # Reuse the existing 0731 MRV2 case's accuracy reference.
    baseline: 88.89
    threshold: 5
    thinking: true
