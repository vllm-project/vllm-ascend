# Basic non-layerwise Mooncake pooling accuracy and performance coverage.
# A3 HCCS uses Fabric Memory; internal DP keeps all 16 NPUs visible.
# The framework starts mooncake_master and injects MOONCAKE_CONFIG_PATH.
test_cases:
  - name: "DS-V4-Flash-W8A8-A3-Mooncake"
    model: "Eco-Tech/DeepSeek-V4-Flash-0731-w8a8"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_MODELSCOPE: "true"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_BUFFSIZE: "1024"
      ASCEND_LAUNCH_BLOCKING: "0"
      ACL_OP_INIT_MODE: "1"
      ASCEND_ENABLE_USE_FABRIC_MEM: "1"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      PYTHONHASHSEED: "0"
    kv_pool:
      type: "mooncake"
      master_port: 50088
      metrics_port: 50089
      config:
        metadata_server: "P2PHANDSHAKE"
        protocol: "ascend"
        device_name: ""
        global_segment_size: "1GB"
        local_buffer_size: "1GB"
        preferred_segment: false
        prefer_alloc_in_same_node: true
        enable_ssd_offload: false
    server_cmd:
      # Disable the local prefix cache so repeated prompts exercise the pool.
      - "--no-enable-prefix-caching"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "10240"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-num-seqs"
      - "64"
      - "--data-parallel-size"
      - "4"
      - "--tensor-parallel-size"
      - "4"
      - "--enable-expert-parallel"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--safetensors-load-strategy"
      - "prefetch"
      - "--quantization"
      - "ascend"
      - "--api-server-count"
      - "1"
      - "--speculative-config"
      - '{"num_speculative_tokens": 5, "method": "dspark", "enforce_eager": true}'
      - "--port"
      - "$SERVER_PORT"
      - "--block-size"
      - "128"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--async-scheduling"
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false}, "enable_cpu_binding": true, "enable_shared_expert_dp": true, "multistream_overlap_shared_expert": true, "enable_fused_mc2": 1}'
      - "--kv-transfer-config"
      - '{"kv_connector": "AscendStoreConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"backend": "mooncake", "use_layerwise": false, "lookup_rpc_port": "0"}}'
    benchmarks:
      perf_1:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in65536_bs400_deepseek
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 32
        max_out_len: 1024
        batch_size: 8
        request_rate: 0
        temperature: 0.0
        baseline: 167.1799
        threshold: 5
      perf_2:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in65536_bs400_deepseek
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 32
        max_out_len: 1024
        batch_size: 8
        request_rate: 0
        temperature: 0.0
        baseline: 174.2725
        threshold: 5
      acc_gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 65536
        batch_size: 64
        temperature: 1.0
        top_p: 1.0
        baseline: 88.89
        threshold: 3
        thinking: true
