      - "glm47"
      - --kv-cache-dtype
      - "int8"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --additional-config
      - '{"recompute_scheduler_enable": true, "enable_fused_mc2": 1, "ascend_compilation_config": {"enable_static_kernel": false}}'
      - --speculative-config
