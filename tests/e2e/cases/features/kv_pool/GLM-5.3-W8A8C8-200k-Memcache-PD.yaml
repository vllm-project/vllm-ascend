      - --enable-prefix-caching
      - --seed
      - "1024"
      - --max-model-len
      - "200000"
      - --max-num-batched-tokens
      - "8192"
      - --trust-remote-code
      - --max-num-seqs
      - "64"
      - --gpu-memory-utilization
      - "0.92"
      - --async-scheduling
      - --quantization
      - "ascend"
      - --safetensors-load-strategy
      - "prefetch"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "glm47"
      - --reasoning-parser
      - "glm47"
      - --enforce-eager
      - --api-server-count
      - "8"
      - --kv-cache-dtype
      - "int8"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --additional-config
      - '{"enable_dsa_cp": true, "enable_fused_mc2": 1, "enable_flashcomm1": true}'
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method": "deepseek_mtp", "enforce_eager": true}'
      - --kv-transfer-config
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 4, "tp_size": 8}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"lookup_rpc_port": "0", "backend": "memcache", "use_layerwise": true}}]}}'

  - node_index: 2
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
