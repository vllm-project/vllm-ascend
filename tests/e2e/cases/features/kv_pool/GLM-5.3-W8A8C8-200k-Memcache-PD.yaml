# GLM-5.3-0day W8A8C8 A3 MultiConnector memcache pool PD separation testing
test_name: "GLM-5.3-0day-W8A8C8-A3-200k-MultiConnector-Memcache-PD"
model: "Eco-Tech/GLM-5.3-w8a8c8"
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0, 1 ]
    decoder: [ 2, 3 ]

kv_pool:
  type: memcache
  meta_service_port: 5000
  config_store_port: 6000
  config:
    meta:
      ock.mmc.log_level: error
    local:
      ock.mmc.log_level: error
      ock.mmc.local_service.world_size: 16
      ock.mmc.local_service.protocol: device_sdma
      ock.mmc.local_service.dram.size: 5GB

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 2
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 8
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 8
    dp_size_local: 4
    dp_rank_start: 4
    tp_size: 4
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_V2_MODEL_RUNNER: "0"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  PYTHONHASHSEED: "0"
  ACL_OP_INIT_MODE: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "1800"
  HCCL_CONNECT_TIMEOUT: "1800"
  LD_LIBRARY_PATH: "/usr/local/python3.11.10/lib/python3.11/site-packages/memcache_hybrid/lib:/usr/local/python3.11.10/lib:/usr/local/lib:$LD_LIBRARY_PATH"

env_prefill: &env_prefill
  <<: *env_common
  VLLM_USE_FASTOKENS: "1"

env_decode: &env_decode
  <<: *env_common
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --seed
      - "1024"
      - --max-model-len
      - "200000"
      - --max-num-batched-tokens
      - "8192"
      - --trust-remote-code
      - --max-num-seqs
      - "64"
      - --gpu-memory-utilization
      - "0.92"
      - --async-scheduling
      - --quantization
      - "ascend"
      - --safetensors-load-strategy
      - "prefetch"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "glm47"
      - --reasoning-parser
      - "glm47"
      - --enforce-eager
      - --api-server-count
      - "8"
      - --kv-cache-dtype
      - "int8"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --additional-config
      - '{"enable_dsa_cp": true, "enable_fused_mc2": 1, "enable_flashcomm1": true}'
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method": "deepseek_mtp", "enforce_eager": true}'
      - --kv-transfer-config
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 4, "tp_size": 8}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"lookup_rpc_port": "0", "backend": "memcache", "use_layerwise": true}}]}}'
  - node_index: 1
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
