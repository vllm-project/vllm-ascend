# A3 1P1D DSpark deployment based on the official DeepSeek-V4-Flash tutorial.
# https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/DeepSeek-V4-Flash.html#52-multi-node-pd-separation-deployment
# Requires a DSpark-capable vLLM/Ascend build and the 0731 W8A8 checkpoint.
# Mooncake must support the range/session API used by hybrid layerwise pooling.
# The framework starts mooncake_master and injects MOONCAKE_CONFIG_PATH on each node.
test_name: "DeepSeek-V4-Flash-DSpark-Mooncake-PD-acc"
model: "Eco-Tech/DeepSeek-V4-Flash-0731-w8a8"
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD"
  LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages:$LD_LIBRARY_PATH"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  PYTHONHASHSEED: "0"
  # A3 HCCS pool transport, matching the external-DP Mooncake template.
  ACL_OP_INIT_MODE: "1"
  ASCEND_ENABLE_USE_FABRIC_MEM: "1"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

# Pool addresses are derived from the runtime cluster IPs.
kv_pool:
  type: mooncake
  master_port: 50088
  metrics_port: 50089
  config:
    metadata_server: "P2PHANDSHAKE"
    protocol: "ascend"
    device_name: ""
    global_segment_size: "1GB"
    preferred_segment: false
    prefer_alloc_in_same_node: true
    enable_ssd_offload: false

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12332
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12332
    dp_size: 16
    dp_size_local: 16
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1800"
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "2400"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - $SERVER_PORT
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 5,"method": "dspark","enforce_eager": true}'
      - "--trust-remote-code"
      - "--block-size"
      - "32"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--quantization"
      - "ascend"
      - "--enforce-eager"
      - "--additional-config"
      - '{"enable_cpu_binding": true, "enable_dsa_cp": true, "enable_flashcomm1":true}'
      - "--kv-transfer-config"
      - >-
        {
          "kv_connector": "MultiConnector",
          "kv_role": "kv_producer",
          "engine_id": "0",
          "kv_connector_extra_config": {
            "connectors": [
              {
                "kv_connector": "MooncakeHybridConnector",
                "kv_role": "kv_producer",
                "kv_port": "30000",
                "kv_connector_extra_config": {
                  "prefill": {
                    "dp_size": 4,
                    "tp_size": 4
                  },
                  "decode": {
                    "dp_size": 16,
                    "tp_size": 1
                  }
                }
              },
              {
                "kv_connector": "AscendStoreConnector",
                "kv_role": "kv_producer",
                "kv_connector_extra_config": {
                  "backend": "mooncake",
                  "use_layerwise": true,
                  "lookup_rpc_port": "0"
                }
              }
            ]
          }
        }

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - $SERVER_PORT
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "480"
      - "--max-num-seqs"
      - "60"
      - "--async-scheduling"
      - "--block-size"
      - "32"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--no-enable-prefix-caching"
      - "--trust-remote-code"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [12, 24, 48, 96, 192, 256, 288, 360]}'
      - "--quantization"
      - "ascend"
      - "--speculative-config"
      - '{"num_speculative_tokens": 5,"method": "dspark","enforce_eager": true}'
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false}, "enable_cpu_binding":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable":true}'
      - "--kv-transfer-config"
      - >-
        {
          "kv_connector": "MultiConnector",
          "kv_role": "kv_consumer",
          "engine_id": "1",
          "kv_connector_extra_config": {
            "connectors": [
              {
                "kv_connector": "MooncakeHybridConnector",
                "kv_role": "kv_consumer",
                "kv_port": "30100",
                "kv_connector_extra_config": {
                  "prefill": {
                    "dp_size": 4,
                    "tp_size": 4
                  },
                  "decode": {
                    "dp_size": 16,
                    "tp_size": 1
                  }
                }
              },
              {
                "kv_connector": "AscendStoreConnector",
                "kv_role": "kv_consumer",
                "kv_connector_extra_config": {
                  "backend": "mooncake",
                  "use_layerwise": false,
                  "lookup_rpc_port": "0"
                }
              }
            ]
          }
        }

# Reuse the existing PD accuracy workload; confirm its baseline on DSpark hardware.
benchmarks:
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    temperature: 1.0
    top_p: 1.0
    thinking: "true"
    max_out_len: 65536
    batch_size: 32
    baseline: 90
    threshold: 10
