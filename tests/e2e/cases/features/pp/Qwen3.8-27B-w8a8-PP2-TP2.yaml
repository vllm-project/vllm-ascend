test_cases:
  - name: Qwen3.8-27B-w8a8-PP2-TP2-AIME2025
    model: Eco-Tech/Qwen3.8-27B-w8a8
    envs:
      SERVER_PORT: "DEFAULT_PORT"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "1"
      HCCL_BUFFSIZE: "1024"
      OMP_NUM_THREADS: "1"
      OMP_PROC_BIND: "false"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      ASCEND_LOCAL_COMM_RES: '{"version":"1.2"}'
      VLLM_USE_V2_MODEL_RUNNER: "1"
    server_cmd:
      - --port
      - "$SERVER_PORT"
      - --quantization
      - ascend
      - --kv-cache-dtype
      - auto
      - --max-model-len
      - "81920"
      - --block-size
      - "128"
      - --max-num-batched-tokens
      - "8192"
      - --max-num-seqs
      - "8"
      - --gpu-memory-utilization
      - "0.85"
      - --pipeline-parallel-size
      - "2"
      - --tensor-parallel-size
      - "2"
      - --distributed-executor-backend
      - mp
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --async-scheduling
      - --speculative-config
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
    benchmarks:
      acc_aime2025:
        case_type: accuracy
        dataset_path: vllm-ascend/aime2025
        request_conf: vllm_api_general_chat
        dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
        max_out_len: 65536
        batch_size: 32
        temperature: 1.0
        top_p: 0.95
        baseline: 93.33
        threshold: 10