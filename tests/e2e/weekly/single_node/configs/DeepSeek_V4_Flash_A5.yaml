# ==========================================
# Shared Configurations
# ==========================================
_envs: &envs
  OMP_PROC_BIND: "False"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "512"
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--safetensors-load-strategy"
  - "prefetch"
  - "--max-num-batched-tokens"
  - "4095"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--enable-expert-parallel"
  - "--async-scheduling"
  - "--max-num-seqs"
  - "32"
  - "--block-size"
  - "128"
  - "--data-parallel-size"
  - "8"
  - "--tensor-parallel-size"
  - "1"
  - "--tokenizer-mode"
  - "deepseek_v4"
  - "--tool-call-parser"
  - "deepseek_v4"
  - "--api_server_count"
  - "1"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
_benchmarks_per1: &benchmarks_acc
  acc:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 131072
    batch_size: 32
    baseline: 87.4
    threshold: 5
    temperature: 1.0
    ignore_eos: false
    top_p: 1.0
    chat_template_kwargs: {"thinking":True}
_benchmarks_per2: &benchmarks_per
  perf:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/DeekSeek-V4-Flash_input_3500_lines_128
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 128
    max_out_len: 1500
    batch_size: 32
    request_rate: 0
    baseline: 83.50106007067137
    threshold: 0.95
    temperature: 0
    ignore_eos: True
# ==========================================
# ACTUAL TEST CASES
# ==========================================
test_cases:
  - name: "DeepSeekV4_Flash_A5_Signle_GPQA_Accuracy_Test_01"
    model: "/root/.cache/modelscope/hub/models/models--deepseek-ai--DeepSeek-V4-Flash"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--max-model-len"
      - "135000"
      - "--speculative-config"
      - '{"num_speculative_tokens": 1, "method":"deepseek_mtp","enforce_eager":"true"}'
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":true,"enable_shared_expert_dp":true,"multistream_overlap_shared_expert":true,"enable_reduce_sample":false,"rejection_sampler_config":{"enable_block_verify":false,"enable_entropy_verify":false,"posterior_threshold":0.95,"posterior_alpha":0.4}}'
    benchmarks:
      <<: *benchmarks_acc
