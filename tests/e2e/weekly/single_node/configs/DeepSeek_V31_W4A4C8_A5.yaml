# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
#  HCCL_CONNECT_TIMEOUT: "600"
  HCCL_EXEC_TIMEOUT: "600"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
#  TASK_QUEUE_ENABLE: "1"
  VLLM_ASCEND_ENABLE_MLAPO: "1"


_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--max-num-batched-tokens"
  - "16384"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--async-scheduling"
  - "--enable-expert-parallel"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--speculative_config"
  - '{"method": "deepseek_mtp", "num_speculative_tokens": 3}'
  - "--quantization"
  - "ascend"
  - "--trust-remote-code"

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "DeepSeekV31_A5_Single_Maximum_Context_Test_01"
    model: "/root/.cache/modelscope/hub/models/Eco-Tech/DeepSeek-V3.1-w4a4c8-mxfp4"
    envs:
      HCCL_BUFFSIZE: "512"
      OMP_PROC_BIND: "False"
      OMP_NUM_THREADS: "10"
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--max-model-len"
      - "163840"
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "8"
      - "--max-num-seqs"
      - "96"
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"enable_mlapo":true,"enable_balance_scheduling":true}'