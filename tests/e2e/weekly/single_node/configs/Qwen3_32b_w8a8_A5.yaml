


# Shared Configurations
# ==========================================

_envs: &envs
  TASK_QUEUE_ENABLE: "1"
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
  VLLM_USE_V1: "1"
  VLLM_ASCEND_ENABLE_DENSE_OPTIMIZE: "1"
  VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--distributed-executor-backend"
  - "mp"
  - "--async-scheduling"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--quantization"
  - "ascend"
  - "--trust-remote-code"
  - "--block-size"
  - "128"

_benchmarks_acc: &benchmarks_acc
  acc:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/aime2024
    request_conf: vllm_api_general_chat
    dataset_conf: aime/aime2024_gen_0_shot_chat_prompt
    max_out_len: 38912
    batch_size: 64
    baseline: 83.33
    threshold: 7
    temperature: 0.6
    ignore_eos: false
