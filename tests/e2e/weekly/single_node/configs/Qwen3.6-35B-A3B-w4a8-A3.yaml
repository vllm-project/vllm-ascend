test_cases:
  - name: "Qwen3.6-35B-A3B-in16k-out1k-0-128-32"
    model: "Eco-Tech/Qwen3.6-35B-A3B-w4a8"
    envs:
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      HCCL_BUFFSIZE: "1024"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"
      VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--quantization"
      - "ascend"
      - "--allowed-local-media-path"
      - "/"
      - "--trust-remote-code"
      - "--tensor-parallel-size"
      - "2"
      - "--enable-expert-parallel"
      - "--port"
      - "$SERVER_PORT"
      - "--max-num-seqs"
      - "36"
      - "--max-model-len"
      - "20000"
      - "--max-num-batched-tokens"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--seed"
      - "1024"
      - "--no-enable-prefix-caching"
      - "--async-scheduling"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes":[1,4,8,12,16,20,24,28,40,48,64,76,80,88,96,100,104,108,112,116,120,136,140,144],"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"method": "qwen3_5_mtp","num_speculative_tokens": 3}'
      - "--additional-config"
      - '{"enable_cpu_binding":true}'
      - "--profiler-config"
      - '{"profiler": "torch","torch_profiler_dir": "./profiling","torch_profiler_with_stack": false}'
      - "--mm-processor-cache-gb"
      - "0"
      - "--mm-encoder-tp-mode"
      - "data"
    benchmarks:
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs200_qwen
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 128
        max_out_len: 1024
        batch_size: 32
        request_rate: 0.6
        baseline: 548.2128
        threshold: 0.97
