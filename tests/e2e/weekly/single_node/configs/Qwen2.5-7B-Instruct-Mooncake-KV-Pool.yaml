# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  SERVER_PORT: "DEFAULT_PORT"
  LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages"
  PYTHONHASHSEED: "0"
  ACL_OP_INIT_MODE: "1"
  ASCEND_ENABLE_USE_FABRIC_MEM: "1"
  HCCL_RDMA_TIMEOUT: "17"
  ASCEND_CONNECT_TIMEOUT: "10000"
  ASCEND_TRANSFER_TIMEOUT: "10000"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--trust-remote-code"
  - "--enforce-eager"
  - "--no-enable-prefix-caching"
  - "--tensor-parallel-size"
  - "1"
  - "--data-parallel-size"
  - "1"
  - "--max-model-len"
  - "32768"
  - "--block-size"
  - "128"
  - "--max-num-batched-tokens"
  - "16384"
  - "--kv-transfer-config"
  - >-
    {
      "kv_connector": "AscendStoreConnector",
      "kv_role": "kv_both",
      "kv_load_failure_policy": "recompute",
      "kv_connector_extra_config": {
        "lookup_rpc_port": "0",
        "backend": "mooncake"
      }
    }

_benchmarks: &benchmarks
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 48
    batch_size: 4
    baseline: 0
    threshold: 100

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen2.5-7B-Instruct-Mooncake-KV-Pool"
    model: "/mnt/share/weights/Qwen2.5-7B-Instruct/Qwen2.5-7B-Instruct"
    envs:
      <<: *envs
    kv_pool:
      type: "mooncake"
      master_port: 50088
      metrics_port: 50089
      config:
        metadata_server: "P2PHANDSHAKE"
        protocol: "ascend"
        device_name: ""
        global_segment_size: "1GB"
        preferred_segment: false
        prefer_alloc_in_same_node: true
    server_cmd: *server_cmd
    benchmarks:
      <<: *benchmarks
