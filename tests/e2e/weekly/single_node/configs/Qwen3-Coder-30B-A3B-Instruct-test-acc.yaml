# Qwen3-Coder Single Node Performance/Accuracy Testing
test_cases:
  - name: "Qwen3-Coder-30B-A3B-Instruct-test-acc"
    model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    envs:
      PYTHONHASHSEED: "0"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "1024"
      SERVER_PORT: "8011"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
    server_cmd:
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "4"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--port"
      - "$SERVER_PORT"
      - "--max-num-seqs"
      - "100"
      - "--max-model-len"
      - "40960"
      - "--max-num-batched-tokens"
      - "16384"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--no-enable-prefix-caching"
      - "--distributed-executor-backend"
      - "mp"
      - "--speculative-config"
      - '{"method": "eagle3", "model": "vllm-ascend/Qwen3-a3B_eagle3", "num_speculative_tokens": 3}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"weight_nz_mode": 2}'
    benchmarks:
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 32768
        batch_size: 32
        baseline: 100
        threshold: 20
