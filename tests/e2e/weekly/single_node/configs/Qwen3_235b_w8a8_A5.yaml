# Shared Configurations
# ==========================================

_envs: &envs
  HCCL_BUFFSIZE: "1024"
  OMP_PROC_BIND: "false"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_V1: "1"


_server_cmd: &server_cmd
  - "--async-scheduling"
  - "--enable-expert-parallel"
  - "--port"
  - "$SERVER_PORT"
  - "--quantization"
  - "ascend"
  - "--trust-remote-code"

_benchmarks_gpqa: &benchmarks_gpqa
  acc:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 32768
    batch_size: 64
    baseline: 72.12
    threshold: 5
    temperature: 0.6
    ignore_eos: false
_benchmarks_perf1: &benchmarks_perf1
  acc:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/GSM8K-in131072-bs100-qwen3
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 4
    max_out_len: 1024
    batch_size: 1
    request_rate: 0
    baseline: 22.5957 #原基线是和关闭pcp/dcp启动服务化后启动服务话做对比的
    threshold: 0.95
    temperature: 0
    ignore_eos: True

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "vllm_Qwen3_235B_Accuracy_FULL_Graph_GPQA"
    model: "/root/.cache/modelscope/hub/models/vllm-ascend/Qwen3-235B-A22B-w8a8-mxfp8"
    envs:
      TASK_QUEUE_ENABLE: "1"
      HCCL_OP_EXPANSION_MODE: "AIV"
      OMP_NUM_THREADS: "1"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--host"
      - "0.0.0.0"
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "2"
      - "--data-parallel-size-local"
      - "2"
      - "--data-parallel-start-rank"
      - "0"
      - "--data-parallel-address"
      - "0.0.0.0"
      - "--data-parallel-rpc-port"
      - "2345"
      - "--max-num-seqs"
      - "40"
      - "--max-model-len"
      - "40960"
      - "--max-num-batched-tokens"
      - "16384"
      - "--enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    benchmarks:
      <<: *benchmarks_gpqa
  - name: "longSeq_pcpdcp_performance_0004"
    model: "/root/.cache/modelscope/hub/models/vllm-ascend/Qwen3-235B-A22B-w8a8-mxfp8"
    envs:
      ASCEND_LAUNCH_BLOCKING: "0"
      OMP_NUM_THREADS: "100"
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "1"
      - "--prefill_context_parallel-size"
      - "2"
      - "--decode_context_parallel-size"
      - "1"
      - "--max-num-seqs"
      - "8"
      - "--max-model-len"
      - "134000"
      - "--async-scheduling"
      - "--max-num-batched-tokens"
      - "40960"
      - "--no-enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.75"
      - "--additional-config"
      - '{"ascend_scheduler_config":{"enabled":false}}'
      - "--hf-overrides"
      - '{"rope_parameters":{"rope_type":"yarn","rope_theta":1000000,"factor":4.1,"original_max_position_embeddings":32768}}'
    benchmarks:
      <<: *benchmarks_perf1