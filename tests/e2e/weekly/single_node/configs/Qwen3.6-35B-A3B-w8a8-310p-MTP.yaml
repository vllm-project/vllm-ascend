test_cases:
  - name: "Qwen3.6-35B-A3B-w8a8-310p-MTP"
    model: "Eco-Tech/Qwen3.6-35B-A3B-w8a8"
    envs:
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--tensor-parallel-size"
      - "4"
      - "--trust-remote-code"
      - "--max_num_seqs"
      - "32"
      - "--max-model-len"
      - "67584"
      - "--gpu_memory_utilization"
      - "0.90"
      - "--dtype"
      - "float16"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [8,32]}'
      - "--allowed-local-media-path"
      - "/"
      - "--mamba-ssm-cache-dtype"
      - "float16"
      - "--enable-prefix-caching"
      - "--mamba-cache-mode"
      - "align"
      - "--enable-chunked-prefill"
      - "--enable-prompt-tokens-details"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":false}}'
      - "--speculative_config"
      - '{"method": "mtp","num_speculative_tokens":1}'
      - "--default-chat-template-kwargs"
      - '{"enable_thinking":false}'
    benchmarks:
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/textvqa-lite
        request_conf: vllm_api_stream_chat
        dataset_conf: textvqa/textvqa_gen_base64
        max_out_len: 10240
        batch_size: 32
        baseline: 82
        threshold: 1
        enable_thinking: "false"
        temperature: 0
        top_p:
        top_k:
        min_p:
        presence_penalty:
        repetition_penalty:
      perf_accept_rate:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs2800
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        max_out_len: 1536
        batch_size: 4
        request_rate: 0
        baseline: 113
        threshold: 0.97
      perf_PrefixCache_warm_up:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in65536-bs16-prefix70-qwen35
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 8
        max_out_len: 512
        batch_size: 2
        request_rate: 0
        baseline: 1
        threshold: 0.97
      perf_PrefixCache:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in65536-bs16-prefix70-qwen35
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 4
        max_out_len: 512
        batch_size: 1
        request_rate: 0
        baseline: 12
        threshold: 0.97