# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3-0.6B-static-kernel"
    model: "Qwen/Qwen3-0.6B"
    envs:
      TASK_QUEUE_ENABLE: "1"
      OMP_PROC_BIND: "false"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PAGED_ATTENTION_MASK_LEN: "5500"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--no-enable-prefix-caching"
      - "--port"
      - "$SERVER_PORT"
      - "--max-model-len"
      - "40960"
      - "--max-num-batched-tokens"
      - "25600"
      - "--block-size"
      - "128"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes": [32], "cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"enable_cpu_binding":true, "ascend_compilation_config":{"enable_static_kernel":true}, "weight_nz_mode": 1}'
      benchmarks:
        acc:
          case_type: accuracy
          dataset_path: vllm-ascend/gsm8k
          request_conf: vllm_api_general_chat
          dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
          max_out_len: 512
          num_prompts: 32
          batch_size: 32
          baseline: 55
          threshold: 5
        perf:
          case_type: performance
          dataset_path: vllm-ascend/GSM8K-in3500-bs400
          request_conf: vllm_api_stream_chat
          dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
          num_prompts: 80
          max_out_len: 512
          batch_size: 32
          request_rate: 0
          baseline: 1
          threshold: 0.97
