test_cases:
  - name: "Qwen3.6-27B-W8A8"
    model: "Eco-Tech/Qwen3.6-27B-w8a8"
    envs:
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--trust-remote-code"
      - "--max_num_seqs"
      - "16"
      - "--max-model-len"
      - "20480"
      - "--gpu_memory_utilization"
      - "0.80"
      - "--additional-config"
      - '{"ascend_compilation_config":{"enable_npugraph_ex":false}}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [8,16]}'
      - "--mamba-ssm-cache-dtype"
      - "float16"
      - "--tensor-parallel-size"
      - "2"
      - "--quantization"
      - "ascend"
      - "--allowed-local-media-path"
      - "/"
    benchmarks:
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/textvqa-lite
        request_conf: vllm_api-general_chat
        dataset_conf: textvga/textvqa-gen_base64
        max_out_len: 4096
        batch_size: 8
        baseline: 80
        threshold: 20
        temperature: 0
      #  top_p: 0.95
      #  top_k: 40
      #  min_p:
      #  presence_penalty:
      #  repetition_penalty:
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in1024-bs210
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 32
        max_out_len: 1024
        batch_size: 8
        request_rate: 0
        baseline: 1
        threshold: 0.97