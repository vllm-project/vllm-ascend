# GLM-5.3-Flash W8A8 on one Atlas 800 A3 node (16 logical NPUs).
_envs: &envs
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "400"
  VLLM_USE_MODELSCOPE: "true"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "DEFAULT_PORT"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"

_server_cmd: &server_cmd
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$SERVER_PORT"
  - "--max-model-len"
  - "133120"
  - "--data-parallel-size"
  - "1"
  - "--tensor-parallel-size"
  - "16"
  - "--enable-expert-parallel"
  - "--seed"
  - "1024"
  - "--safetensors-load-strategy"
  - "prefetch"
  - "--max-num-seqs"
  - "32"
  - "--max-num-batched-tokens"
  - "8192"
  - "--trust-remote-code"
  - "--quantization"
  - "ascend"
  - "--limit-mm-per-prompt"
  - '{"image":1,"video":0}'
  - "--gpu-memory-utilization"
  - "0.85"
  - "--speculative-config"
  - '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'
  - "--compilation-config"
  - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,32,64,96,128]}'
  - "--api-server-count"
  - "1"

_benchmarks: &benchmarks
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs100_glm
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 20
    max_out_len: 1024
    batch_size: 5
    request_rate: 0
    baseline: 1
    threshold: 0.97
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    max_out_len: 65536
    temperature: 1.0
    top_p: 0.95
    batch_size: 32
    baseline: 93.33
    threshold: 10

test_cases:
  - name: "GLM-5.3-Flash-W8A8-A3-TP16-DP1"
    model: "Eco-Tech/GLM-5.3-Flash-w8a8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    benchmarks:
      <<: *benchmarks
