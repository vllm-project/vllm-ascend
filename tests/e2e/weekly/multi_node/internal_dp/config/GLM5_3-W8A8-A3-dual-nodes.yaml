test_name: "double-node-GLM-5.3-w8a8c8-A3"
model: "Eco-Tech/GLM-5.3-w8a8c8"
num_nodes: 2
npu_per_node: 16
env_common: &env_common
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_TRANSFER_TIMEOUT: "600"
  HCCL_EXEC_TIMEOUT: "3600"
  HCCL_CONNECT_TIMEOUT: "3600"
  OMP_PROC_BIND: false
  VLLM_USE_MODELSCOPE: true
  OMP_NUM_THREADS: 1
  HCCL_BUFFSIZE: 400
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  VLLM_ASCEND_ENABLE_MLAPO: 1
  VLLM_ENGINE_READY_TIMEOUT_S: "3000"
  VLLM_RPC_TIMEOUT: "600"
  SERVER_PORT: 8077

deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/GLM-5.3-w8a8c8
      --host 0.0.0.0
      --port $SERVER_PORT
      --safetensors-load-strategy prefetch
      --api-server-count 1
      --data-parallel-size 8
      --data-parallel-start-rank 0
      --data-parallel-size-local 4
      --data-parallel-address $LOCAL_IP
      --data-parallel-rpc-port 12980
      --tensor-parallel-size 4
      --enable-expert-parallel
      --seed 1024
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --max-num-seqs 6
      --max-model-len 202752
      --max-num-batched-tokens 4096
      --trust-remote-code
      --gpu-memory-utilization 0.90
      --quantization ascend
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      --additional-config '{"enable_dsa_cp": true, "enable_sparse_sfa_c8": true, "enable_sparse_li_c8": true, "enable_balance_scheduling": true, "enable_fused_mc2": 1, "enable_flashcomm1": true}'
      --speculative-config '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": true}'
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/GLM-5.3-w8a8c8
      --host 0.0.0.0
      --port $SERVER_PORT
      --headless
      --data-parallel-size 8
      --data-parallel-start-rank 4
      --data-parallel-size-local 4
      --data-parallel-address $MASTER_IP
      --data-parallel-rpc-port 12980
      --tensor-parallel-size 4
      --enable-expert-parallel
      --seed 1024
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --max-num-seqs 6
      --max-model-len 202752
      --max-num-batched-tokens 4096
      --trust-remote-code
      --gpu-memory-utilization 0.92
      --quantization ascend
      --enable-chunked-prefill
      --enable-prefix-caching
      --async-scheduling
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      --additional-config '{"enable_dsa_cp": true, "enable_sparse_sfa_c8": true, "enable_sparse_li_c8": true, "enable_balance_scheduling": true, "enable_fused_mc2": 1, "enable_flashcomm1": true}'
      --speculative-config '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": true}'

benchmarks:
  acc_GPQA:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    temperature: 1.0
    top_p: 0.95
    batch_size: 32
    baseline: 87.6
    threshold: 5

  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs100_glm
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 12
    max_out_len: 1024
    batch_size: 3
    request_rate: 0
    baseline: 34.49
    threshold: 0.97
