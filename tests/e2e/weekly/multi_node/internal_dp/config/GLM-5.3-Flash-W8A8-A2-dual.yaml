test_name: "test GLM-5.3-Flash-W8A8 dual-node on A2"
model: "Eco-Tech/GLM-5.3-Flash-w8a8"
num_nodes: 2
npu_per_node: 8

env_common: &env_common
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  HCCL_EXEC_TIMEOUT: "3600"
  HCCL_CONNECT_TIMEOUT: "1200"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  VLLM_USE_MODELSCOPE: "true"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "8077"

deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/GLM-5.3-Flash-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --max-model-len 133120
      --data-parallel-size 2
      --data-parallel-size-local 1
      --data-parallel-start-rank 0
      --data-parallel-address $LOCAL_IP
      --data-parallel-rpc-port 12321
      --tensor-parallel-size 8
      --enable-expert-parallel
      --seed 1024
      --safetensors-load-strategy prefetch
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --trust-remote-code
      --quantization ascend
      --limit-mm-per-prompt '{"image":1,"video":0}'
      --gpu-memory-utilization 0.85
      --speculative-config '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,16,32,64,96,128]}'
      --api-server-count 1

  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/GLM-5.3-Flash-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --headless
      --max-model-len 133120
      --data-parallel-size 2
      --data-parallel-size-local 1
      --data-parallel-start-rank 1
      --data-parallel-address $MASTER_IP
      --data-parallel-rpc-port 12321
      --tensor-parallel-size 8
      --enable-expert-parallel
      --seed 1024
      --safetensors-load-strategy prefetch
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --trust-remote-code
      --quantization ascend
      --limit-mm-per-prompt '{"image":1,"video":0}'
      --gpu-memory-utilization 0.85
      --speculative-config '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,16,32,64,96,128]}'

benchmarks:
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 8192
    batch_size: 32
    baseline: 95
    threshold: 10
