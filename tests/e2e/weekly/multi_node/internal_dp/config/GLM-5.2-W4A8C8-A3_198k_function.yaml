#198k长序列只验证功能
test_name: "multi-node-GLM-5.2-W4A8C8-MTP-A3_198k_function"
model: "Eco-Tech/GLM-5.2-w4a8c8"
num_nodes: 2
npu_per_node: 16
env_common: &env_common
  HCCL_OP_EXPANSION_MODE: "AIV"
  OMP_PROC_BIND: "false"
  VLLM_USE_MODELSCOPE: "true"
  OMP_NUM_THREADS: "1"
  HCCL_BUFFSIZE: "400"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  VLLM_ASCEND_ENABLE_MLAPO: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3000"
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  SERVER_PORT: 8077

deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/GLM-5.2-w4a8c8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size 8
      --data-parallel-size-local 4
      --data-parallel-start-rank 0
      --data-parallel-address $LOCAL_IP
      --enable-expert-parallel
      --data-parallel-rpc-port 12980
      --tensor-parallel-size 4
      --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}'
      --seed 1024
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --max-num-seqs 6
      --max-model-len 202752
      --max-num-batched-tokens 4096
      --trust-remote-code
      --gpu-memory-utilization 0.92
      --quantization ascend
      --enable-chunked-prefill
      --enable-prefix-caching
      --async-scheduling
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      --additional-config '{"enable_dsa_cp": true, "enable_sparse_sfa_c8": true, "enable_sparse_li_c8": true, "enable_balance_scheduling": true, "fuse_muls_add": true, "multistream_overlap_shared_expert": true}' 
      --speculative-config '{"num_speculative_tokens": 3, "method": "deepseek_mtp","enforce_eager":true}'
  -
    envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/GLM-5.2-w4a8c8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size 8
      --data-parallel-size-local 4
      --data-parallel-start-rank 4
      --headless
      --data-parallel-address $MASTER_IP
      --enable-expert-parallel
      --data-parallel-rpc-port 12980
      --tensor-parallel-size 4
      --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}'
      --seed 1024
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --max-num-seqs 6
      --max-model-len 202752
      --max-num-batched-tokens 4096
      --trust-remote-code
      --gpu-memory-utilization 0.9
      --quantization ascend
      --enable-chunked-prefill
      --enable-prefix-caching
      --async-scheduling
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      --additional-config '{"enable_dsa_cp": true, "enable_sparse_sfa_c8": true, "enable_sparse_li_c8": true, "enable_balance_scheduling": true, "fuse_muls_add": true, "multistream_overlap_shared_expert": true}'  
      --speculative-config '{"num_speculative_tokens": 3, "method": "deepseek_mtp","enforce_eager":true}'
benchmarks:
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs2800
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 8
    max_out_len: 1500
    batch_size: 2
    request_rate: 0
    baseline: 1
    threshold: 0.97
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    max_out_len: 129024
    batch_size: 32
    baseline: 93.33
    threshold: 10
    temperature: 1.0
    top_p: 0.95