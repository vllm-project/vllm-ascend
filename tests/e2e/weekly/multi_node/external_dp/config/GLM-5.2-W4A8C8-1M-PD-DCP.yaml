test_name: "GLM-5.2-W4A8C8-1M-PD-DCP"
model: "Eco-Tech/GLM-5.2-w4a8c8"
num_nodes: 4
npu_per_node: 16

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0, 1 ]
    decoder: [ 2, 3 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 16591
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 16591
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 2
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 16600
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 16600
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 2
    tp_size: 8
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  VLLM_ASCEND_ENABLE_NZ: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "20"
  HCCL_BUFFSIZE: "768"
  HCCL_TRANSFER_TIMEOUT: "600"
  HCCL_EXEC_TIMEOUT: "3600"
  HCCL_CONNECT_TIMEOUT: "3600"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  TASK_QUEUE_ENABLE: "1"
  VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT: "480"
  ASCEND_A3_ENABLE: "1"

env_prefill: &env_prefill
  <<: *env_common

env_decode: &env_decode
  <<: *env_common

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --seed
      - "1024"
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --max-model-len
      - "1024000"
      - --max-num-batched-tokens
      - "16384"
      - --gpu-memory-utilization
      - "0.75"
      - --max-num-seqs
      - "8"
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --pipeline-parallel-size
      - "1"
      - --prefill-context-parallel-size
      - "1"
      - --decode-context-parallel-size
      - "8"
      - --cp-kv-cache-interleave-size
      - "128"
      - --enforce-eager
      - --additional-config
      - '{"enable_flashcomm1": true, "enable_dsa_cp": true, "ascend_compilation_config": {"enable_npugraph_ex": true}, "multistream_overlap_shared_expert": true, "enable_sparse_li_c8": true, "enable_cpu_binding": true, "recompute_scheduler_enable": true}'
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method": "deepseek_mtp", "enforce_eager": true}'
      - --quantization
      - "ascend"
      - --enable-expert-parallel
      - --safetensors-load-strategy
      - "prefetch"
      - --trust-remote-code
      - --no-enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "glm47"
      - --reasoning-parser
      - "glm45"
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 4, "tp_size": 8}, "decode": {"dp_size": 4, "tp_size": 8}}}'

  - node_index: 1
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --seed
      - "1024"
      - --host
      - "0.0.0.0"
      - --port
