test_name: "DeepSeek_v31_nofeature_mtp_A5_pd_perf_001"
model: "/root/.cache/modelscope/hub/models/Eco-Tech/DeepSeek-V3.1-w4a4c8-mxfp4"
num_nodes: 2
npu_per_node: 8

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 2
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  #VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "${PORT}"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "600"
  TASK_QUEUE_ENABLE: "1"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_V1: "1"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "512"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1100"
  HCCL_ENTRY_LOG_ENABLE: "1"
  VLLM_ASCEND_ENABLE_MLAPO: "1"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "65536"
      - --max-num-batched-tokens
      - "16384"
      - --trust-remote-code
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.9"
      - --enable-prefix-caching
      - --async-scheduling
      - --quantization
      - "ascend"
      - --enforce-eager
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method":"deepseek_mtp"}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --additional-config
      - '{"recompute_scheduler_enable":true,"enable_shared_expert_dp":true}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 4}, "decode": {"dp_size": 8, "tp_size": 1},"ascend_local_comm_res_path": "/etc/hixlep"}}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "65536"
      - --max-num-batched-tokens
      - "256"
      - --trust-remote-code
      - --max-num-seqs
      - "24"
      - --no-enable-prefix-caching
      - --gpu-memory-utilization
      - "0.94"
      - --async-scheduling
      - --quantization
      - "ascend"
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method":"deepseek_mtp"}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --additional-config
      - '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert":false,"finegrained_tp_config": {"lmhead_tensor_parallel_size":4}}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30100", "engine_id": "2", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 4}, "decode": {"dp_size": 8, "tp_size": 1},"ascend_local_comm_res_path": "/etc/hixlep"}}'

benchmarks:
  perf_3.5k:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/GSM8K_in3500_bs400_dsv3.1_w4a8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 180
    max_out_len: 1500
    batch_size: 45
    temperature: 0
    ignore_eos: true
    request_rate: 0
    baseline: 31.1
    threshold: 0.97