      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --hf-overrides
      - '{"use_index_cache": true, "index_topk_freq": 4}'
      - --seed
      - "1024"
      - --max-model-len
      - "133120"
      - --max-num-batched-tokens
      - "164"
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --speculative-config
      - '{"num_speculative_tokens": 3,  "method":"deepseek_mtp","enforce_eager":true}'
      - --additional-config
      - '{"ascend_compilation_config": {"fuse_muls_add": true},"recompute_scheduler_enable":true,"multistream_overlap_shared_expert":true,"enable_sparse_sfa_c8": false, "enable_sparse_li_c8": true,"enable_fused_mc2":0,"enable_mlapo":true}'
      - --trust-remote-code
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.92"
      - --async-scheduling
      - --quantization
      - "ascend"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "glm47"
      - --reasoning-parser
      - "glm45"
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1",
        "kv_role": "kv_consumer",
        "kv_port": "30200",
        "kv_connector_extra_config": {
                    "use_ascend_direct": true,
                    "prefill": {
                            "dp_size": 4,
                            "tp_size": 8
                    },
                    "decode": {
                            "dp_size": 8,
                            "tp_size": 4
                    }
            }
        }'


benchmarks:
    perf_warmup:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in65536-bs1500-prefix90-glm51
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        max_out_len: 1024
        batch_size: 4
        request_rate: 0
        baseline: 0
        threshold: 0.97
    perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in65536-bs1500-prefix90-glm51
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 512
        max_out_len: 1024
        batch_size: 128
        request_rate: 3.15
        baseline: 2722.60
        threshold: 0.97
