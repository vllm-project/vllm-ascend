test_name: "GLM-5.1-Memcache-no-Layerwise-PD-perf"
model: "Eco-Tech/GLM-5.1-w8a8"
num_nodes: 4
npu_per_node: 16

env_common: &env_common
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ASCEND_AGGREGATE_ENABLE: "1"
  ASCEND_TRANSPORT_PRINT: "1"
  ACL_OP_INIT_MODE: "1"
  ASCEND_A3_ENABLE: "1"
  VLLM_NIXL_ABORT_REQUEST_TIMEOUT: "300000"
  PYTHONHASHSEED: "0"
  VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "DEFAULT_PORT"

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [0, 1]
    decoder: [2, 3]

kv_pool:
  type: memcache
  meta_service_port: 5000
  config_store_port: 6000
  config:
    meta:
      ock.mmc.log_level: error
    local:
      ock.mmc.log_level: error
      ock.mmc.local_service.world_size: 256
      ock.mmc.local_service.protocol: device_sdma
      ock.mmc.local_service.dram.size: 10GB

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12331
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12331
    dp_size: 4
    dp_size_local: 1
    dp_rank_start: 4
    tp_size: 8
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12331
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 12331
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 1
    tp_size: 4
    dp_address: "${NODE_2_IP}"

templates:
  - node_index: 0
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "256"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--profiler-config"
      - '{"profiler": "torch","torch_profiler_dir": "./vllm_profile","torch_profiler_with_stack": false}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager":true}'
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "131072"
      - "--additional-config"
      - '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable": true, "layer_sharding": ["q_b_proj", "o_proj"]}'
      - "--max-num-batched-tokens"
      - "16384"
      - "--trust-remote-code"
      - "--max-num-seqs"
      - "64"
      - "--quantization"
      - "ascend"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--enforce-eager"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm45"
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16,"pp_layer_partition":"41,37"}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "memcache"}}]}}'

  - node_index: 1
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "256"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--profiler-config"
