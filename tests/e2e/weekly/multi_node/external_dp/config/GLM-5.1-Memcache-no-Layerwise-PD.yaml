      - "--speculative-config"
      - '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager":true}'
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "131072"
      - "--additional-config"
      - '{"enable_npugraph_ex": true, "fuse_muls_add":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable": true, "layer_sharding": ["q_b_proj", "o_proj"]}'
      - "--max-num-batched-tokens"
      - "16384"
      - "--trust-remote-code"
      - "--max-num-seqs"
      - "64"
      - "--quantization"
      - "ascend"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--enforce-eager"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm45"
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_load_failure_policy": "recompute", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 16,"pp_layer_partition":"41,37"}, "decode": {"dp_size": 8, "tp_size": 4}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "memcache"}}]}}'
  - node_index: 2
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "900"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ASCEND_ENABLE_MLAPO: "1"
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
