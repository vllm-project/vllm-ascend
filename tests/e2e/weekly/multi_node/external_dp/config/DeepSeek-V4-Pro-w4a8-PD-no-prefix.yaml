benchmarks:
  perf_TPOT50_3_5_1_5:
    case_type: performance
    dataset_path_local: vllm-ascend/GSM8K-in3500-bs4096-prefix0-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1024
    max_out_len: 1500
    batch_size: 256
    request_rate: 3
    baseline: 3822.66
    threshold: 0.95
  perf_TPOT20_3_5_1_5:
    case_type: performance
    dataset_path_local: vllm-ascend/GSM8K-in3500-bs4096-prefix0-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 1500
    batch_size: 4
    request_rate: 0
    baseline: 170.83
    threshold: 0.95
  perf_TPOT50_64_1:
    case_type: performance
    dataset_path_local: GSM8K_prefix0_in65536_bs400_deepseek
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1024
    batch_size: 16
    request_rate: 0.25
    baseline: 223.8
    threshold: 0.95
