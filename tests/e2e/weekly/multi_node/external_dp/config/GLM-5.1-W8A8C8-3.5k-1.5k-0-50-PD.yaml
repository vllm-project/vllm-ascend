      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --hf-overrides
      - '{"use_index_cache": true, "index_topk_freq": 4}'
      - --seed
      - "1024"
      - --max-model-len
      - "18432"
      - --max-num-batched-tokens
      - "164"
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --speculative-config
      - '{"num_speculative_tokens": 3,  "method":"deepseek_mtp","enforce_eager":true}'
      - --additional-config
      - '{"ascend_compilation_config": {"fuse_muls_add": true},"recompute_scheduler_enable":true,"multistream_overlap_shared_expert":true, "enable_sparse_sfa_c8": false, "enable_sparse_li_c8": false, "finegrained_tp_config": {"lmhead_tensor_parallel_size":16},"enable_fused_mc2":0,"enable_mlapo":true}'
      - --trust-remote-code
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.92"
      - --async-scheduling
      - --quantization
      - "ascend"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "glm47"
      - --reasoning-parser
      - "glm45"
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1",
        "kv_role": "kv_consumer",
