
# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  ASCEND_RT_VISIBLE_DEVICES: "0"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_DISABLE_COMPILE_CACHE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
#  OMP_NUM_THREADS: "1"
#  TASK_QUEUE_ENABLE: "1"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--tensor-parallel-size"
  - "1"
  - "--data-parallel-size"
  - "1"
  - "--async-scheduling"
  - "--max-num-seqs"
  - "32"
  - "--max-num-batched-tokens"
  - "16384"
  - "--max-model-len"
  - "133120"
  - "--quantization"
  - "ascend"
  - "--allowed-local-media-path"
  - "/"
  - "--gpu-memory-utilization"
  - "0.95"
  - "--mm-processor-cache-gb"
  - "0"
  - "--mm-encoder-tp-mode data"
  - "--mm-processor-cache-type shm"
  - "--compilation-config"
  - '{"cudagraph_capture_sizes":[1,6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168,174,180,186,192],"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--speculative-config"
  - '{"method":"qwen3_5_mtp","num_speculative_tokens":5}'
  - "--trust-remote-code"
  - "--additional-config"
  - '{"enable_cpu_binding":true}'


# ==========================================
# ACTUAL TEST CASES
# ==========================================
_benchmarks_perf1: &benchmarks_perf1
  perf:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/Qwen3-27B_input_3500_lines_128
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 80
    max_out_len: 1500
    batch_size: 20
    request_rate: 1
    baseline: 1064
    threshold: 0.95
    temperature: 0
    ignore_eos: True
_benchmarks_perf2: &benchmarks_perf2
  perf:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/Qwen3_27B_input_131072_lines_400_prefix_cache
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 36
    max_out_len: 1024
    batch_size: 9
    request_rate: 0
    baseline: 124
    threshold: 0.95
    temperature: 0
    ignore_eos: True

test_cases:
  - name: "Qwen36_27B_Mix_35k15k_A5_Performance_Test_01"
    model: "/root/.cache/modelscope/hub/models/Eco-Tech/Qwen3.6-27B-w8a8-mxfp8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--api-server-count"
      - "4"
    benchmarks:
      <<: *benchmarks_perf1
  - name: "Qwen36_27B_Mix_128K1K_PC90_A5_Performance_Test_01"
    model: "/root/.cache/modelscope/hub/models/Eco-Tech/Qwen3.6-27B-w8a8-mxfp8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--enable-prefix-caching"
    benchmarks:
      <<: *benchmarks_perf2
