# Qwen3-30B-A3B W8A8 A2 x4 throughput and latency baseline collection.
#
# Baselines are intentionally omitted until this FULL_DECODE_ONLY scenario has
# five stable measurements. AISBench still records throughput, TPOT, and TTFT
# in the nightly benchmark Artifact.

test_cases:
  - name: "Qwen3-30B-A3B-W8A8-A2-TP4"
    model: "Eco-Tech/Qwen3-30B-A3B-w8a8"
    envs:
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
      HCCL_BUFFSIZE: "512"
      HCCL_OP_EXPANSION_MODE: "AIV"
      LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2"
      NPU_MEMORY_FRACTION: "0.95"
      OMP_NUM_THREADS: "1"
      OMP_PROC_BIND: "false"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      SERVER_PORT: "DEFAULT_PORT"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ASCEND_ENABLE_NZ: "2"
      VLLM_USE_V1: "1"
    server_cmd:
      - "--async-scheduling"
      - "--tensor-parallel-size"
      - "4"
      - "--port"
      - "$SERVER_PORT"
      - "--max-num-seqs"
      - "16"
      - "--max-model-len"
      - "16384"
      - "--max-num-batched-tokens"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--trust-remote-code"
      - "--additional-config"
      - '{"enable_cpu_binding":true}'
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16]}'
    server_cmd_extra:
      - "--quantization"
      - "ascend"
    benchmarks:
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs400
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 180
        max_out_len: 1500
        batch_size: 45
        request_rate: 0
