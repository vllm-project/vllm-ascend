test_cases:
  - name: "Qwen3-8B-DFlash-A3"
    model: "Qwen/Qwen3-8B"
    envs:
      MP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_TRANSFER_TIMEOUT: "600"
      HCCL_EXEC_TIMEOUT: "3600"
      HCCL_CONNECT_TIMEOUT: "3600"
      HCCL_BUFFSIZE: "512"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--tensor-parallel-size"
      - "1"
      - "--data-parallel-size"
      - "1"
      - "--port"
      - "$SERVER_PORT"
      - "--max-model-len"
      - "16384"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--trust-remote-code"
      - "--no-enable-prefix-caching"
      - "--compilation_config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"method":"dflash", "model": "z-lab/Qwen3-8B-Dflash-b16", "num_speculative_tokens":8, "enforce_eager": true}'
    benchmarks:
      spec_decode:
        case_type: spec_decode
        dataset_path: vllm-ascend/gsm8k
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 8192
        batch_size: 16
        temperature: 0
        baseline: [0.86, 0.73, 0.61, 0.52, 0.45, 0.38, 0.33, 0.28]
        threshold: 0.05