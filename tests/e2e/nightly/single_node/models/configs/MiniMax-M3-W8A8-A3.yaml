# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "MiniMax-M3-W8A8-A3"
    model: "Eco-Tech/MiniMax-M3-w8a8-0626"
    envs:
      VLLM_NIXL_ABORT_REQUEST_TIMEOUT: "30000"
      VLLM_USE_V1: "1"
      HCCL_EXEC_TIMEOUT: "60"
      HCCL_CONNECT_TIMEOUT: "120"
      HCCL_BUFFSIZE: "2048"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "1"
      LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2"
      VLLM_LOGGING_LEVEL: "info"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "1800"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--enable-expert-parallel"
      - "--data-parallel-size"
      - "4"
      - "--tensor-parallel-size"
      - "4"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--max-model-len"
      - "67560"
      - "--max-num-batched-tokens"
      - "32768"
      - "--long-prefill-token-threshold"
      - "2048"
      - "--max-num-seqs"
      - "64"
      - "--distributed-executor-backend"
      - "mp"
      - "--reasoning-parser"
      - "minimax_m3"
      - "--limit-mm-per-prompt"
      - '{"image":1}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"model": "Inferact/MiniMax-M3-EAGLE3-GQA", "method": "eagle3", "num_speculative_tokens": 3}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_static_kernel":true,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"weight_nz_mode":2,"enable_shared_expert_dp": true,"enable_reduce_sample": true}'
    benchmarks:
      acc_gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 65536
        batch_size: 64
        baseline: 92
        threshold: 2
        temperature: 1.0
        top_p: 0.95
        ignore_eos: false
      acc_textvqa:
        case_type: accuracy
        dataset_path: vllm-ascend/textvqa-lite
        request_conf: vllm_api_general_chat
        dataset_conf: textvqa/textvqa_gen_base64
        num_prompts: 1000
        max_out_len: 512
        batch_size: 64
        baseline: 72
        temperature: 1.0
        top_p: 0.95
        threshold: 2
