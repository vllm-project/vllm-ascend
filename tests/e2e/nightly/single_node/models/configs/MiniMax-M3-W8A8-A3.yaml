# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "MiniMax-M3-W8A8-A3"
    model: "Eco-Tech/MiniMax-M3-w8a8-0626"
    envs:
      VLLM_NIXL_ABORT_REQUEST_TIMEOUT: "30000"
      VLLM_USE_V1: "1"
      HCCL_EXEC_TIMEOUT: "60"
      HCCL_CONNECT_TIMEOUT: "120"
      HCCL_BUFFSIZE: "2048"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "1"
      LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2"
      VLLM_LOGGING_LEVEL: "info"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "1800"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--enable-expert-parallel"
      - "--data-parallel-size"
      - "4"
      - "--tensor-parallel-size"
      - "4"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--max-model-len"
      - "69632"
      - "--max-num-batched-tokens"
      - "32768"
      - "--long-prefill-token-threshold"
      - "2048"
      - "--max-num-seqs"
      - "16"
      - "--distributed-executor-backend"
      - "mp"
      - "--reasoning-parser"
      - "minimax_m3"
      - "--limit-mm-per-prompt"
      - '{"image":1}'
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_static_kernel":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"weight_nz_mode":2,"enable_shared_expert_dp": true,"enable_reduce_sample": true}'
    test_content:
      - chat_completion
    api_keyword_args:
      max_tokens: 10
      chat_template_kwargs:
        thinking_mode: disabled
    benchmarks:
      acc_gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 65536
        batch_size: 64
        baseline: 92
        threshold: 2
        temperature: 1.0
        top_p: 0.95
        ignore_eos: false
      acc_textvqa:
        case_type: accuracy
        dataset_path: vllm-ascend/textvqa-lite
        request_conf: vllm_api_general_chat
        dataset_conf: textvqa/textvqa_gen_base64
        num_prompts: 1000
        max_out_len: 512
        batch_size: 64
        baseline: 72
        temperature: 1.0
        top_p: 0.95
        threshold: 2

  - name: "MiniMax-M3-W8A8-EAGLE3"
    model: "Eco-Tech/MiniMax-M3-w8a8-0626"
    envs:
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      VLLM_LOGGING_LEVEL: "INFO"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      LCCL_DETERMINISTI: "1"
      HCCL_DETERMINISTIC: "true"
      ATB_MATMUL_SHUFFLE_K_ENABLE: "0"
      CLOSE_MATMUL_K_SHIFT: "1"
      HCCL_BUFFSIZE: "1024"
      VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
      ASCEND_LAUNCH_BLOCKING: "1"
      SERVER_PORT: "DEFAULT_PORT"

    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--tensor-parallel-size"
      - "8"
      - "--max-num-seqs"
      - "32"
      - "--max-model-len"
      - "10240"
      - "--enforce-eager"
      - "--speculative-config"
      - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "enforce_eager": true, "attention_backend": "FLASH_ATTN"}'
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
    benchmarks:
      spec_decode:
        case_type: spec_decode
        dataset_path: vllm-ascend/gsm8k
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 8192
        batch_size: 32
        temperature: 0
        baseline: [0.88, 0.77, 0.66]
        threshold: 0.05