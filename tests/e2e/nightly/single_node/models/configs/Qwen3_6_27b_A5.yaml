# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  TASK_QUEUE_ENABLE: "1"
  OMP_NUM_THREADS: "1"


_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--tensor-parallel-size"
  - "4"
  - "--data-parallel-size"
  - "1"
  - "--async-scheduling"
  - "--max-num-seqs"
  - "128"
  - "--max-model-len"
  - "70000"
  - "--max-num-batched-tokens"
  - "16384"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--kv-cache-memory"
  - "8758775808"
  - "--allowed-local-media-path"
  - "/"
  - "--mm-processor-cache-gb"
  - "0"
  - "--trust-remote-code"

_benchmarks_perf1: &benchmarks_perf1
  perf:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/Qwen3-27B_input_3500_lines_128
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 128
    max_out_len: 1500
    batch_size: 32
    request_rate: 0
    baseline: 342
    threshold: 0.95
    temperature: 0
    ignore_eos: True
