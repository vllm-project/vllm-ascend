# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen36_27B_Eagle3_A5_Acceptance_Rate_02"
    model: "/root/.cache/modelscope/hub/models/Eco-Tech/Qwen3.6-27B"
    envs:
      HCCL_BUFFSIZE: "1024"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--speculative_config"
      - '{"method":"eagle3","model":"/root/.cache/modelscope/hub/models/Ex0bit/Qwen3.6-27B-PRISM-EAGLE3/full","enforce_eager":true,"num_speculative_tokens":3}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"enable_npugraph_ex":true,"enable_static_kernel":true}'
    benchmarks:
      <<: *benchmarks_perf1
