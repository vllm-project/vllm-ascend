# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "MTPX-DeepSeek-R1-0528-W8A8-mtp3-PCP"
    model: "vllm-ascend/DeepSeek-R1-0528-W8A8"
    envs:
      OMP_NUM_THREADS: "100"
      OMP_PROC_BIND: "false"
      HCCL_BUFFSIZE: "1024"
      HCCL_OP_EXPANSION_MODE: "AIV"
      VLLM_RPC_TIMEOUT: "3600000"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3600000"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
    server_cmd:
      - "--quantization"
      - "ascend"
      - "--seed"
      - "1024"
      - "--no-enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--tensor-parallel-size"
      - "8"
      - "--prefill-context-parallel-size"
      - "2"
      - "--enable-expert-parallel"
      - "--port"
      - "$SERVER_PORT"
      - "--max-model-len"
      - "40960"
      - "--max-num-seqs"
      - "14"
      - "--max-num-batched-tokens"
      - "2048"
      - "--trust-remote-code"
      - "--speculative-config"
      - '{"num_speculative_tokens": 3, "method": "mtp"}'
      - "--gpu-memory-utilization"
      - "0.9"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes": [56], "cudagraph_mode": "FULL_DECODE_ONLY"}'
    benchmarks:
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/aime2024
        request_conf: vllm_api_general_chat
        dataset_conf: aime2024/aime2024_gen_0_shot_chat_prompt
        max_out_len: 32768
        batch_size: 32
        baseline: 86.67
        threshold: 10
