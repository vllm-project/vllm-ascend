# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  SERVER_PORT: "DEFAULT_PORT"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1200"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_NUM_THREADS: "1"
  LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD"
  TASK_QUEUE_ENABLE: "1"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--host"
  - "0.0.0.0"
  - "--tensor-parallel-size"
  - "8"
  - "--data-parallel-size"
  - "2"
  - "--enable-expert-parallel"
  - "--async-scheduling"
  - "--max-num-seqs"
  - "128"
  - "--safetensors-load-strategy"
  - 'prefetch'
  - "--max-num-batched-tokens"
  - "16384"
  - "--trust-remote-code"
  - "--quantization"
  - "ascend"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "minimax_m2"
  - "--speculative_config"
  - '{"method":"eagle3","model":"Eco-Tech/MiniMax-M2.7-eagle-model-short","num_speculative_tokens":3}'
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--additional-config"
  - '{"enable_cpu_binding": true, "enable_fused_mc2": true, "weight_nz_mode": 1, "enable_flashcomm1": true}'

_benchmarks_3500: &benchmarks_3500
  perf_50:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_in3500_bs4000_minimax
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 760
    max_out_len: 1500
    batch_size: 190
    request_rate: 0
    baseline: 4573.02
    threshold: 0.97
  perf_20:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_in3500_bs4000_minimax
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 192
    max_out_len: 1500
    batch_size: 48
    request_rate: 0
    baseline: 2229.147
    threshold: 0.97

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "MiniMax-M2.7-3500"
    model: "vllm-ascend/MiniMax-M2.7-w8a8-QuaRot"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--max-model-len"
      - "70000"
      - "--gpu-memory-utilization"
      - "0.8"
      - "--no-enable-prefix-caching"
    benchmarks:
      <<: *benchmarks_3500
