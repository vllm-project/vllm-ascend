# ==========================================
# Shared configurations
# ==========================================
_envs: &envs
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_DFS_CONFIG: "task_exception:off,inconsistent_check:off"
  HCCL_BUFFSIZE: "400"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_INTRA_PCIE_ENABLE: "1"
  HCCL_INTRA_ROCE_ENABLE: "0"
  ASCEND_LAUNCH_BLOCKING: "0"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
  VLLM_USE_FASTOKENS: "1"
  DYNAMIC_EPLB: "true"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "100"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--api-server-count"
  - "1"
  - "--distributed-executor-backend"
  - "mp"
  - "--tensor-parallel-size"
  - "8"
  - "--pipeline-parallel-size"
  - "1"
  - "--data-parallel-size"
  - "1"
  - "--max-model-len"
  - "135000"
  - "--max-num-batched-tokens"
  - "16384"
  - "--max-num-seqs"
  - "20"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--enable-expert-parallel"
  - "--no-async-scheduling"
  - "--enable-prefix-caching"
  - "--trust-remote-code"
  - "--enforce-eager"
  - "--quantization"
  - "ascend"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "glm47"
  - "--reasoning-parser"
  - "glm45"
  - "--additional-config"
  - '{"enable_flashcomm1":true,"enable_cpu_binding":"True","multistream_overlap_shared_expert":"True","enable_sparse_sfa_c8":true,"enable_sparse_li_c8":true,"enable_dsa_cp":true}'

_benchmarks: &benchmarks
  perf_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs400
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 8
    max_out_len: 32
    batch_size: 8
    request_rate: 0
    baseline: 0
    threshold: 0.97
    temperature: 0
    ignore_eos: true
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs400
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1500
    batch_size: 20
    request_rate: 0
    baseline: 76.5866
    threshold: 0.97
    temperature: 0
    ignore_eos: true
  acc_gsm8k:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 8192
    batch_size: 32
    baseline: 95.75
    threshold: 5
    temperature: 0
    ignore_eos: false

# ==========================================
# Actual test case
# ==========================================
test_cases:
  - name: "GLM-5.2-W4A4C8-A5-nightly"
    model: "/mnt/share/w00936111/GLM-5.2-W4A4C8-mxfp4-A5-0731"
    envs:
      <<: *envs
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd: *server_cmd
    test_content: []
    benchmarks:
      <<: *benchmarks
