# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  TASK_QUEUE_ENABLE: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_OP_EXPANSION_MODE: "AIV"
  SERVER_PORT: "DEFAULT_PORT"

_server_cmd: &server_cmd
  - "--quantization"
  - "ascend"
  - "--no-enable-prefix-caching"
  - "--tensor-parallel-size"
  - "4"
  - "--max-num-seqs"
  - "80"
  - "--port"
  - "$SERVER_PORT"
  - "--max-model-len"
  - "40960"
  - "--max-num-batched-tokens"
  - "40960"
  - "--block-size"
  - "128"
  - "--trust-remote-code"
  - "--gpu-memory-utilization"
  - "0.9"

_benchmarks: &benchmarks
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_noncot_chat_prompt
    max_out_len: 10240
    batch_size: 32
    baseline: 96
    threshold: 10

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3-32B-W8A8C8-aclgraph-a3"
    model: "Eco-Tech/Qwen3-32B-w8a8c8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,12,16,20,24,32,48,60,64,68,72,76,80]}'
    benchmarks:
      <<: *benchmarks

  - name: "Qwen3-32B-W8A8C8-single-a3"
    model: "Eco-Tech/Qwen3-32B-w8a8c8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--enforce-eager"
    benchmarks:
