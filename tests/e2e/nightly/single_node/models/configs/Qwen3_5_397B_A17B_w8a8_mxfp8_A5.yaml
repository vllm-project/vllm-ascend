# ==========================================
# Shared Configurations
# ==========================================
_envs: &envs
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  HCCL_BUFFSIZE: "2048"
  OMP_NUM_THREADS: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  TASK_QUEUE_ENABLE: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--data-parallel-size"
  - "1"
  - "--tensor-parallel-size"
  - "4"
  - "--prefill-context-parallel-size"
  - "2"
  - "--enable-expert-parallel"
  - "--max-model-len"
  - "133120"
  - "--enable-chunked-prefill"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--trust-remote-code"
  - "--allowed-local-media-path"
  - "/"
  - "--no-async-scheduling"
  - "--quantization"
  - "ascend"
  - "--mm-processor-cache-gb"
  - "0"
  - "--no-enforce-eager"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "qwen3_coder"
  - "--enable-prefix-caching"
  - "--speculative-config"
  - '{"method":"qwen3_5_mtp","num_speculative_tokens": 3, "enforce_eager":"true"}'
  - "--compilation-config"
  - '{"cudagraph_capture_sizes":[1,4,8,16,32,64],"cudagraph_mode":"FULL_DECODE_ONLY"}'
_benchmarks_per1: &benchmarks_per
  perf:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/Qwen3.5-397B-A17B-w8a8-mxfp8_input_130172_lines_200
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 1024
    batch_size: 4
    request_rate: 0
    baseline: 21.1495
    threshold: 0.95
    temperature: 0
    ignore_eos: True
_benchmarks_per3: &benchmarks_acc
  acc:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    batch_size: 16
    baseline: 86.36
    threshold: 5
    temperature: 0
    ignore_eos: false
# ==========================================
# ACTUAL TEST CASES
# ==========================================
test_cases:
  - name: "Qwen35_397B_PCP_MTP_A5_perf_01"
    model: "/root/.cache/modelscope/hub/models/Eco-Tech/Qwen3.5-397B-A17B-w8a8-mxfp8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--decode-context-parallel-size"
      - "2"
      - "--max-num-batched-tokens"
      - "32000"
      - "--max-num-seqs"
      - "16"
    benchmarks:
      <<: *benchmarks_per
  - name: "pcp_qwen3_5_acc_001"
    model: "/root/.cache/modelscope/hub/models/Eco-Tech/Qwen3.5-397B-A17B-w8a8-mxfp8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--max-num-batched-tokens"
      - "4096"
      - "--max-num-seqs"
      - "32"
    benchmarks:
      <<: *benchmarks_acc







