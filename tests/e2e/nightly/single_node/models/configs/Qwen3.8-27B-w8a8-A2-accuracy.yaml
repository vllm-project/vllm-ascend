# ==========================================
# ACTUAL TEST CASES
# ==========================================
_envs: &envs
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "DEFAULT_PORT"
test_cases:
  - name: "Qwen3.8-27B-w8a8-in128k-TPOT50-prefix90-24-6"
    model: "Eco-Tech/Qwen3.8-27B-w8a8"
    envs:
      <<: *envs
    server_cmd:
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "2"
      - "--port"
      - "$SERVER_PORT"
      - "--max-model-len"
      - "133120"
      - "--enable-prefix-caching"
      - "--max-num-batched-tokens"
      - "16384"
      - "--max-num-seqs"
      - "32"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--compilation-config"
      - '{"cudagraph_capture_sizes":[1,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128], "cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative_config"
      - '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}'
      - "--trust-remote-code"
      - "--async-scheduling"
      - "--allowed-local-media-path"
      - "/"
      - "--quantization"
      - "ascend"
      - "--mm-processor-cache-gb"
      - "0"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--mm-processor-cache-type"
      - "shm"
      - "--additional-config"
      - '{"enable_cpu_binding":true}'
      - "--api-server-count"
      - "4"
    benchmarks:
      acc_GPQA:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 32768
        batch_size: 32
        baseline: 85.0166
        threshold: 5
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0