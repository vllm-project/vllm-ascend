# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  HCCL_OP_EXPANSION_MODE: "AIV"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  SERVER_PORT: "DEFAULT_PORT"

_server_cmd: &server_cmd
  - "--quantization"
  - "ascend"
  - "--tensor-parallel-size"
  - "4"
  - "--max-num-seqs"
  - "80"
  - "--port"
  - "$SERVER_PORT"
  - "--max-model-len"
  - "40960"
  - "--max-num-batched-tokens"
  - "40960"
  - "--block-size"
  - "128"
  - "--trust-remote-code"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--additional-config"
  - '{"enable_flashcomm1": true, "ascend_compilation_config":{"enable_npugraph_ex": true, "enable_static_kernel": true}}'

_benchmarks: &benchmarks
  acc:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k-lite
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_noncot_chat_prompt
    max_out_len: 10240
    batch_size: 32
    baseline: 96
    threshold: 2
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in3500-bs400
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 304
    max_out_len: 1500
    batch_size: 76
    baseline: 1147.8159
    threshold: 0.97

# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "Qwen3-32B-W8A8-aclgraph-a3"
    model: "vllm-ascend/Qwen3-32B-W8A8-QuaRot"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    benchmarks:
      <<: *benchmarks

  - name: "Qwen3-32B-W8A8-eager-a3"
    model: "vllm-ascend/Qwen3-32B-W8A8-QuaRot"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--enforce-eager"
    benchmarks:
