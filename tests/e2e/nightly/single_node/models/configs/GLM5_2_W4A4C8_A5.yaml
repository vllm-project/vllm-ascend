# GLM5.2.md section 5.1: locally quantized W4A4C8 checkpoint.
# CI prerequisite: preload this checkpoint at the model path below.
test_cases:
  - name: "GLM-5.2-W4A4C8-A5-nightly"
    model: "/root/.cache/modelscope/hub/models/vllm-ascend/GLM-5.2-W4A4C8-mxfp4"
    envs:
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "400"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "1"
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
      VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--api-server-count"
      - "1"
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "8"
      - "--enable-expert-parallel"
      - "--max-model-len"
      - "135000"
      - "--max-num-batched-tokens"
      - "16384"
      - "--max-num-seqs"
      - "20"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--enable-prefix-caching"
      - "--trust-remote-code"
      - "--enforce-eager"
      - "--quantization"
      - "ascend"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm45"
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config.indexer_kv_dtype"
      - "fp8"
      - "--additional-config"
      - "{\"enable_flashcomm1\":true,\"enable_cpu_binding\":true,\"multistream_overlap_shared_expert\":true,\"enable_dsa_cp\":true}"
    prompts:
      - "Reply with one short sentence confirming the service is healthy."
    test_content:
      - chat_completion
    api_keyword_args:
      max_tokens: 16
      temperature: 0.0
    # PLACEHOLDER ONLY: invented values for initial community-resource runs.
    # These are NOT measured accuracy/performance baselines. Replace per case after
    # calibration; initial gate failures must not be classified as regressions.
    benchmarks:
      accuracy_placeholder_gsm8k:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 4096
        batch_size: 4
        temperature: 0
        baseline: 90
        threshold: 10
      performance_placeholder_3_5k_1k:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs400
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        max_out_len: 1024
        batch_size: 4
        request_rate: 0
        baseline: 1000
        threshold: 0.97
