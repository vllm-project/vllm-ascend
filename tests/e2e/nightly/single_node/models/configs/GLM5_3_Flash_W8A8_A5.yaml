test_cases:
  - name: "GLM-5.3-Flash-W8A8-A5-nightly"
    model: "/root/.cache/modelscope/hub/models/vllm-ascend/GLM-5.3-Flash-w8a8-mxfp8"
    envs:
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "1024"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--data-parallel-size"
      - "8"
      - "--tensor-parallel-size"
      - "1"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--quantization"
      - "ascend"
      - "--async-scheduling"
      - "--max-num-seqs"
      - "128"
      - "--max-model-len"
      - "131092"
      - "--enable-prefix-caching"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--limit-mm-per-prompt"
      - "{\"image\":1,\"video\":0}"
      - "--compilation-config"
      - "{\"cudagraph_mode\":\"FULL_DECODE_ONLY\",\"cudagraph_capture_sizes\":[1,2,4,8,16,32,64,96,128]}"
      - "--speculative-config"
      - "{\"num_speculative_tokens\":5,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"
    prompts:
      - "Reply with one short sentence confirming the service is healthy."
    test_content:
      - chat_completion
    api_keyword_args:
      max_tokens: 16
      temperature: 0.0
    # PLACEHOLDER ONLY: invented values for initial community-resource runs.
    # These are NOT measured accuracy/performance baselines. Replace per case after
    # calibration; initial gate failures must not be classified as regressions.
    benchmarks:
      accuracy_placeholder_gsm8k:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 4096
        batch_size: 4
        temperature: 0
        baseline: 90
        threshold: 10
      performance_placeholder_3_5k_1k:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in3500-bs400
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        max_out_len: 1024
        batch_size: 4
        request_rate: 0
        baseline: 1000
        threshold: 0.97
