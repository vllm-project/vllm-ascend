# ==========================================
# Shared Configurations
# ==========================================

_envs: &envs
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_DFS_CONFIG: "task_exception:off,inconsistent_check:off"
  HCCL_BUFFSIZE: "400"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_INTRA_PCIE_ENABLE: "1"
  HCCL_INTRA_ROCE_ENABLE: "0"
  ASCEND_LAUNCH_BLOCKING: "0"
  VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
  SERVER_PORT: "DEFAULT_PORT"

_server_cmd: &server_cmd
  - "--port"
  - "$SERVER_PORT"
  - "--distributed-executor-backend"
  - "mp"
  - "--data-parallel-size"
  - "1"
  - "--tensor-parallel-size"
  - "8"
  - "--seed"
  - "1024"
  - "--served-model-name"
  - "glm"
  - "--enable-expert-parallel"
  - "--max-num-seqs"
  - "128"
  - "--max-model-len"
  - "202752"
  - "--max-num-batched-tokens"
  - "8192"
  - "--trust-remote-code"
  - "--no-enable-prefix-caching"
  - "--gpu-memory-utilization"
  - "0.95"
  - "--quantization"
  - "ascend"
  - "--async-scheduling"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "glm47"
  - "--reasoning-parser"
  - "glm45"
  - "--compilation-config"
  - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
  - "--speculative-config"
  - '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'
  - "--additional-config"
  - '{"enable_cpu_binding":"True","multistream_overlap_shared_expert":"True","enable_sparse_sfa_c8":true,"enable_sparse_li_c8":true,"enable_dsa_cp":true}'

# ==========================================
# Actual Test Case
# ==========================================

test_cases:
  - name: "GLM-5.2-W4A8C8-A5-128k"
    model: "Eco-Tech/GLM-5.2-w4a8c8"
    envs:
      <<: *envs
    server_cmd: *server_cmd
    test_content: []
    benchmarks:
      acc_gsm8k:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 1024
        batch_size: 8
        baseline: 80.47
        threshold: 5
      perf_128k_prefix90:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in131072-bs500-prefix90-glm51
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 8
        max_out_len: 1
        batch_size: 8
        request_rate: 0
        baseline: 3543.18
        threshold: 0.97
