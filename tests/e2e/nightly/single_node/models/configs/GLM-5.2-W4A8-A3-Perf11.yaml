# Offline single-round performance gate for the 11-layer non-Flash GLM5.x checkpoint.
# The baseline is host-scoped (linux-x86_64-a3-800i-8-167): a runner whose hardware tag
# or engine settings differ fails closed until it has its own calibration.
# Output throughput must stay >= 95% and TTFT/TPOT/whole-workload latency <= 110%.
test_cases:
  - name: GLM-5.2-W4A8-A3-Perf11
    model: Eco-Tech/GLM-5.2-w4a8
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "0"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_BUFFSIZE: "256"
      HCCL_TRANSFER_TIMEOUT: "600"
      HCCL_EXEC_TIMEOUT: "3600"
      HCCL_CONNECT_TIMEOUT: "3600"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      LCCL_DETERMINISTIC: "1"
      HCCL_DETERMINISTIC: "true"
      ATB_MATMUL_SHUFFLE_K_ENABLE: "0"
      ATB_LLM_LCOC_ENABLE: "0"
    # The dedicated offline runner owns the fixed engine settings; no server.
    server_cmd: []
    glm5x_perf_gate:
      baseline: tools/glm_reduced/data/glm52/perf/baseline-167-eager.json
      hardware: linux-x86_64-a3-800i-8-167
      min_throughput_fraction: 0.90
      max_latency_fraction: 1.20
