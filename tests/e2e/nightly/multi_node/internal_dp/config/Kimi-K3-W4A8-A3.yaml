test_name: "test Kimi-K3-W4A8 A3 four-node mixed deployment"
model: "Eco-Tech/Kimi-K3-w4a8"
num_nodes: 4
npu_per_node: 16

env_common: &env_common
  VLLM_USE_MODELSCOPE: true
  HCCL_BUFFSIZE: 800
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  OMP_PROC_BIND: false
  OMP_NUM_THREADS: 1
  TASK_QUEUE_ENABLE: 1
  VLLM_ENGINE_READY_TIMEOUT_S: 7200
  SERVER_PORT: 8080

deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      env -u HCCL_OP_EXPANSION_MODE vllm serve Eco-Tech/Kimi-K3-w4a8
        --host 0.0.0.0
        --port $SERVER_PORT
        --quantization ascend
        --allowed-local-media-path /
        --trust-remote-code
        --tokenizer-mode kimi_k3
        --tensor-parallel-size 16
        --data-parallel-size 4
        --data-parallel-size-local 1
        --data-parallel-start-rank 0
        --data-parallel-address $LOCAL_IP
        --data-parallel-rpc-port 13389
        --enable-expert-parallel
        --enable-prefix-caching
        --max-num-seqs 16
        --max-model-len 131027
        --max-num-batched-tokens 8192
        --gpu-memory-utilization 0.9
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
        --mm-processor-cache-gb 0
        --mm-encoder-tp-mode data
        --limit-mm-per-prompt '{"vision_chunk":2}'
        --enable-auto-tool-choice
        --reasoning-parser kimi_k3
        --tool-call-parser kimi_k3

  - envs:
      <<: *env_common
    server_cmd: >
      env -u HCCL_OP_EXPANSION_MODE vllm serve Eco-Tech/Kimi-K3-w4a8
        --host 0.0.0.0
        --headless
        --port $SERVER_PORT
        --quantization ascend
        --allowed-local-media-path /
        --trust-remote-code
        --tokenizer-mode kimi_k3
        --tensor-parallel-size 16
        --data-parallel-size 4
        --data-parallel-size-local 1
        --data-parallel-start-rank 1
        --data-parallel-address $MASTER_IP
        --data-parallel-rpc-port 13389
        --enable-expert-parallel
        --enable-prefix-caching
        --max-num-seqs 16
        --max-model-len 131027
        --max-num-batched-tokens 8192
        --gpu-memory-utilization 0.9
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
        --mm-processor-cache-gb 0
        --mm-encoder-tp-mode data
        --limit-mm-per-prompt '{"vision_chunk":2}'
        --enable-auto-tool-choice
        --reasoning-parser kimi_k3
        --tool-call-parser kimi_k3

  - envs:
      <<: *env_common
    server_cmd: >
      env -u HCCL_OP_EXPANSION_MODE vllm serve Eco-Tech/Kimi-K3-w4a8
        --host 0.0.0.0
        --headless
        --port $SERVER_PORT
        --quantization ascend
        --allowed-local-media-path /
        --trust-remote-code
        --tokenizer-mode kimi_k3
        --tensor-parallel-size 16
        --data-parallel-size 4
        --data-parallel-size-local 1
        --data-parallel-start-rank 2
        --data-parallel-address $MASTER_IP
        --data-parallel-rpc-port 13389
        --enable-expert-parallel
        --enable-prefix-caching
        --max-num-seqs 16
        --max-model-len 131027
        --max-num-batched-tokens 8192
        --gpu-memory-utilization 0.9
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
        --mm-processor-cache-gb 0
        --mm-encoder-tp-mode data
        --limit-mm-per-prompt '{"vision_chunk":2}'
        --enable-auto-tool-choice
        --reasoning-parser kimi_k3
        --tool-call-parser kimi_k3

  - envs:
      <<: *env_common
    server_cmd: >
      env -u HCCL_OP_EXPANSION_MODE vllm serve Eco-Tech/Kimi-K3-w4a8
        --host 0.0.0.0
        --headless
        --port $SERVER_PORT
        --quantization ascend
        --allowed-local-media-path /
        --trust-remote-code
        --tokenizer-mode kimi_k3
        --tensor-parallel-size 16
        --data-parallel-size 4
        --data-parallel-size-local 1
        --data-parallel-start-rank 3
        --data-parallel-address $MASTER_IP
        --data-parallel-rpc-port 13389
        --enable-expert-parallel
        --enable-prefix-caching
        --max-num-seqs 16
        --max-model-len 131027
        --max-num-batched-tokens 8192
        --gpu-memory-utilization 0.9
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
        --mm-processor-cache-gb 0
        --mm-encoder-tp-mode data
        --limit-mm-per-prompt '{"vision_chunk":2}'
        --enable-auto-tool-choice
