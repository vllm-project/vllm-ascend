test_name: "DSV4_Flash_PD_35k15k_A5_Performance_Test_01"
model: "/root/.cache/modelscope/hub/models/models--deepseek-ai--DeepSeek-V4-Flash"
num_nodes: 1
npu_per_node: 8
env_common: &env_common
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "2040"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_MODELSCOPE: "true"

disaggregated_prefill:
  enabled: true
  prefiller_host_index: [0]
  decoder_host_index: [0]

deployment:
  -
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "512"
    server_cmd: >
      vllm serve /root/.cache/modelscope/hub/models/models--deepseek-ai--DeepSeek-V4-Flash
          --host 0.0.0.0
          --port 9000
          --data-parallel-size 4
          --data-parallel-address $LOCAL_IP
          --data-parallel-rpc-port 12321
          --tensor-parallel-size 1
          --max-model-len 1048576
          --max-num-batched-tokens 3072
          --gpu-memory-utilization 0.85
          --enable-expert-parallel
          --async-scheduling
          --max-num-seqs 8
          --block-size 32
          --no-enable-prefix-caching
          --api_server_count 1
          --tokenizer-mode deepseek_v4
          --tool-call-parser deepseek_v4
          --enable-auto-tool-choice
          --reasoning-parser deepseek_v4
          --trust-remote-code
          --enforce-eager
          --no-disable-hybrid-kv-cache-manager
          --speculative-config '{"num_speculative_tokens": 1, "method":"mtp"}'
          --profiler-config '{"profiler": "torch", "torch_profiler_dir": "./profiling", "torch_profiler_with_stack": false}'
          --kv-transfer-config
          '{"kv_connector": "MooncakeHybridConnector",
          "kv_role": "kv_producer",
          "kv_port": "36010",
          "engine_id": "1",
          "kv_connector_extra_config": {
                    "prefill": {
                            "dp_size": 4,
                            "tp_size": 1
                    },
                    "decode": {
                            "dp_size": 4,
                            "tp_size": 1
                    }
              }
          }'
          --additional-config '{"enable_cpu_binding": true, "multistream_overlap_shared_expert": true}'
  -
    envs:
      <<: *env_common
      HCCL_BUFFSIZE: "1024"
    server_cmd: >
      vllm serve /root/.cache/modelscope/hub/models/models--deepseek-ai--DeepSeek-V4-Flash
          --host 0.0.0.0
          --port 9001
          --data-parallel-size 4
          --data-parallel-address $LOCAL_IP
          --data-parallel-rpc-port 12325
          --tensor-parallel-size 1
          --max-model-len 1048576
          --max-num-batched-tokens 256
          --gpu-memory-utilization 0.92
          --enable-expert-parallel
          --async-scheduling
          --max-num-seqs 56
          --block-size 32
          --no-enable-prefix-caching
          --api_server_count 1
          --tokenizer-mode deepseek_v4
          --tool-call-parser deepseek_v4
          --enable-auto-tool-choice
          --reasoning-parser deepseek_v4
          --trust-remote-code
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
          --no-disable-hybrid-kv-cache-manager
          --speculative-config '{"num_speculative_tokens": 1,"method": "mtp", "enforce_eager": false}'
          --profiler-config '{"profiler": "torch", "torch_profiler_dir": "./profiling", "torch_profiler_with_stack": false}'
          --kv-transfer-config
          '{"kv_connector": "MooncakeHybridConnector",
          "kv_role": "kv_consumer",
          "kv_port": "36010",
          "engine_id": "1",
          "kv_connector_extra_config": {
                    "prefill": {
                            "dp_size": 4,
                            "tp_size": 1
                    },
                    "decode": {
                            "dp_size": 4,
                            "tp_size": 1
                    }
              }
          }'
          --additional-config '{"enable_cpu_binding": true, "recompute_scheduler_enable":true, "multistream_overlap_shared_expert": true}'
benchmarks:
  perf_3500_1500_num1200_pc0:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/DeekSeek-V4-Flash_input_3500_lines_128
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1200
    max_out_len: 1500
    batch_size: 300
    request_rate: 6.5
    baseline: 8537.6707
    threshold: 0.97