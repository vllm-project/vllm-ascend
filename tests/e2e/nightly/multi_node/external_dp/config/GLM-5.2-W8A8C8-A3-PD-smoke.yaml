# Deployment parameters: docs/source/tutorials/models/GLM5.2.md section 5.3.
# CI adaptations: shared checkpoint path, dynamic ports/network, default served name.
# Document's retired fuse_muls_add key omitted for current-main compatibility.
# Prefill keeps default attention cache dtype; only its indexer is INT8 in the reference.
test_name: "GLM-5.2-W8A8C8-A3-PD-smoke"
model: "/root/.cache/modelscope/hub/models/vllm-ascend/GLM-5.2-W8A8C8"
num_nodes: 4
npu_per_node: 16
routing:
  type: disaggregated_prefill
  groups:
    prefiller: [0, 1]
    decoder: [2, 3]
config:
  - {"node_index":0,"port_start":9081,"dp_rpc_port":12321,"dp_size":1,"dp_size_local":1,"dp_rank_start":0,"tp_size":16,"dp_address":"${NODE_0_IP}"}
  - {"node_index":1,"port_start":9081,"dp_rpc_port":12321,"dp_size":1,"dp_size_local":1,"dp_rank_start":0,"tp_size":16,"dp_address":"${NODE_0_IP}","headless":true}
