benchmarks:
  perf_1M_1k_prefix99_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in1M-bs4-prefix99-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1
    batch_size: 1
    request_rate: 0
    baseline: 0
    threshold: 0.95
  perf_1M_1k_prefix99:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in1M-bs4-prefix99-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 4
    max_out_len: 1024
    batch_size: 1
    request_rate: 0
    baseline: 11.93
    threshold: 0.95
