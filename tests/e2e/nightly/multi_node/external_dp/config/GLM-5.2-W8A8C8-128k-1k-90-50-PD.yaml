        }'



benchmarks:
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    max_out_len: 65536
    batch_size: 32
    baseline: 93.33
    threshold: 10
    temperature: 1.0
    top_p: 0.95
  perf_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in131072-bs500-prefix90-glm51
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 1024
    batch_size: 4
    request_rate: 0
    baseline: 0
    threshold: 0.97
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in131072-bs500-prefix90-glm51
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 256
    max_out_len: 1024
    batch_size: 64
    request_rate: 1.52
    baseline: 1226.2755
    threshold: 0.97
