benchmarks:
  perf_TPOT50_128k_1_prefix_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 4
    max_out_len: 1
    batch_size: 4
    request_rate: 0
    baseline: 0
    threshold: 0.95
  perf_TPOT50_128k_1_prefix90:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 192
    max_out_len: 1024
    batch_size: 48
    request_rate: 1
    baseline: 868.86
    threshold: 0.95
  acc_aime2025:
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    temperature: 1.0
    top_p: 1.0
    thinking: "true"
    max_out_len: 32768
    batch_size: 32
    baseline: 93.33
    threshold: 10
