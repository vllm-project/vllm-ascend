test_name: "DeepSeek-V4-Pro-w4a8-dspark-PD-MRV2"
model: "Eco-Tech/DeepSeek-V4-Pro-0813-w4a8"
num_nodes: 4
npu_per_node: 16

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [0, 1]
    decoder: [2, 3]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 4
    cp_size: 2
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 2
    tp_size: 4
    cp_size: 2
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 8
    tp_size: 2
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_MODELSCOPE: "true"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_OP_EXPANSION_MODE: "AIV"

env_prefill: &env_prefill
  <<: *env_common
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
  HCCL_BUFFSIZE: "1024"
  HCCL_CONNECT_TIMEOUT: "6000"
  HCCL_EXEC_TIMEOUT: "204"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1800"
  HCCL_CONNECT_TIMEOUT: "1200"
  HCCL_EXEC_TIMEOUT: "2000"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --prefill-context-parallel-size
      - "2"
      - --decode-context-parallel-size
      - "1"
      - --enable-expert-parallel
      - --max-model-len
      - "204800"
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "16"
      - --block-size
      - "32"
      - --gpu-memory-utilization
      - "0.94"
      - --enable-chunked-prefill
      - --no-disable-hybrid-kv-cache-manager
      - --enable-prefix-caching
      - --enforce-eager
      - --quantization
      - ascend
      - --tokenizer-mode
      - deepseek_v4
      - --attention_config.indexer_kv_dtype
      - int8
      - --tool-call-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --reasoning-parser
      - deepseek_v4
      - --trust-remote-code
      - --seed
      - "1024"
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":5,"enforce_eager":true}'
      - --additional-config
      - '{"enable_cpu_binding":true,"enable_flashcomm1":true,"enable_fused_mc2":1}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeHybridConnector","kv_role":"kv_producer","kv_connector_extra_config":{"prefill":{"dp_size":4,"tp_size":4},"decode":{"dp_size":16,"tp_size":2}}}'

  - node_index: 1
