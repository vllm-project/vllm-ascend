test_name: "MiniMax-M3-W8A8-A3-PD-64K"
model: "Eco-Tech/MiniMax-M3-w8a8-0626"
num_nodes: 2
npu_per_node: 16

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [0]
    decoder: [1]

config:
  # single_p.sh: DP2 x TP4 x PP2 = 16 NPUs.
  - node_index: 0
    port_start: 30050
    dp_rpc_port: 6884
    dp_size: 2
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 4
    pp_size: 2
    dp_address: "${NODE_0_IP}"

  # single_d.sh: DP4 x TP4 = 16 NPUs.
  - node_index: 1
    port_start: 30060
    dp_rpc_port: 5964
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_1_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V1: "1"
  VLLM_NIXL_ABORT_REQUEST_TIMEOUT: "30000"
  HCCL_EXEC_TIMEOUT: "60"
  HCCL_CONNECT_TIMEOUT: "120"
  HCCL_DETERMINISTIC: "true"
  HCCL_OP_EXPANSION_MODE: "AIV"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  VLLM_LOGGING_LEVEL: "info"
  VLLM_DISABLE_COMPILE_CACHE: "0"
  LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  SERVER_PORT: "${PORT}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1024"
  VLLM_PP_LAYER_PARTITION: "30,30"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "2048"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --pipeline-parallel-size
      - ${PP_SIZE}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "67560"
      - --max-num-batched-tokens
      - "32768"
      - --long-prefill-token-threshold
      - "2048"
      - --max-num-seqs
      - "32"
      - --trust-remote-code
      - --quantization
      - ascend
      - --gpu-memory-utilization
      - "0.95"
      - --reasoning-parser
      - minimax_m3
      - --speculative-config
      - '{"model": "Inferact/MiniMax-M3-EAGLE3-GQA", "method": "eagle3", "num_speculative_tokens": 3}'
      - --enable-prefix-caching
      - --enforce-eager
      - --additional-config
      - '{"enable_cpu_binding": true, "ascend_compilation_config": {"fuse_norm_quant": false}, "multistream_overlap_shared_expert": true, "weight_nz_mode": 2, "enable_shared_expert_dp": true, "enable_flashcomm1": true}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "31000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 4, "pp_size": 2, "pp_layer_partition": "30,30"}, "decode": {"dp_size": 4, "tp_size": 4}}}'

  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "67560"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "32"
      - --distributed-executor-backend
      - mp
      - --trust-remote-code
      - --quantization
      - ascend
      - --gpu-memory-utilization
      - "0.95"
      - --reasoning-parser
      - minimax_m3
      - --enable-prefix-caching
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - --speculative-config
      - '{"model": "Inferact/MiniMax-M3-EAGLE3-GQA", "method": "eagle3", "num_speculative_tokens": 3}'
      - --additional-config
      - '{"enable_cpu_binding": true, "ascend_compilation_config": {"fuse_norm_quant": false}, "multistream_overlap_shared_expert": true, "weight_nz_mode": 2, "enable_shared_expert_dp": true, "enable_flashcomm1": true}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "23010", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 4, "pp_size": 2, "pp_layer_partition": "30,30"}, "decode": {"dp_size": 4, "tp_size": 4}}}'

benchmarks:
  prefill_64k_1_prefix_cache_0:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in65536_bs100_qwen
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 12
    max_out_len: 1
    batch_size: 4
    request_rate: 0
    baseline: 1
    threshold: 0.97
    input_throughput_threshold: 0

  # Warm 48 prompts used by the high-hit decode measurement. Replaying
  # the same prompts makes the measured cache-hit target at least 0.999; the
  # source dataset's nominal cross-prompt prefix ratio does not affect replay.
  decode_64k_prefix_cache_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_Minimax
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 48
    max_out_len: 1
    batch_size: 12
    request_rate: 0
    baseline: 0
    threshold: 0.97

  decode_64k_1k_prefix_cache_0_999:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in65536_bs1000_Minimax
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 48
    max_out_len: 1024
    batch_size: 12
    request_rate: 0
    baseline: 40
    threshold: 0.97
    tpot_threshold: 40
