model_name: "LLM-Research/Phi-4-mini-instruct"
model_type: "vllm"
hardware: "Atlas A2 Series"

serve:
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 4096
  gpu_memory_utilization: 0.8
  enforce_eager: true
  trust_remote_code: false

tasks:
- name: "gsm8k"
  metrics:
  - name: "exact_match,strict-match"
    value: 0.80
  - name: "exact_match,flexible-extract"
    value: 0.84
- name: "ceval-valid"
  metrics:
  - name: "acc,none"
    value: 0.60

# gsm8k / ceval-valid values above are preliminary (see issue #10677):
# finalized by nightly RTOL=0.05 calibration.
# ceval-valid is a non-mandatory Chinese-coverage bonus task, capped by
# limit: 200 below; it auto-drops out of scope if the dataset fetch fails.
limit: 200
num_fewshot: 5
apply_chat_template: true
fewshot_as_multiturn: true
batch_size: "auto"
