# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "glm-5.2-W4A8C8-DSpark-PCP"
    model: "Eco-Tech/GLM-5.2-w4a8c8"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_TRANSFER_TIMEOUT: "600"
      HCCL_EXEC_TIMEOUT: "3600"
      HCCL_CONNECT_TIMEOUT: "3600"
      HCCL_BUFFSIZE: "256"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_ENGINE_READY_TIMEOUT_S: "3000"
    server_cmd:
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "2"
      - "--prefill-context-parallel-size"
      - "2"
      - "--port"
      - "$SERVER_PORT"
      - "--safetensors-load-strategy"
      - "prefetch"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "16384"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "16"
      - "--block-size"
      - "128"
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--enable-expert-parallel"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--async-scheduling"
      # Match the W4A8C8 accuracy case: int8 indexer cache, default SFA KV dtype.
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"method":"dspark","model":"RedHatAI/GLM-5.2-speculator.dspark","num_speculative_tokens":7,"enforce_eager":true}'
      - "--additional-config"
      - '{"multistream_overlap_shared_expert":true,"enable_fused_mc2":0}'
    test_content: []
    benchmarks:
      # Same checkpoint and accuracy settings as GLM-5.2-W4A8C8-SFA-DCP.yaml.
      acc_gsm8k:
        case_type: accuracy
        dataset_path: vllm-ascend/gsm8k-lite
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 4096
        batch_size: 32
        baseline: 95
        threshold: 5
