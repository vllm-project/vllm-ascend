# Two-node Memcache pooling with DSpark
test_name: DSv4-Flash-Memcache-PD-dspark
model: Eco-Tech/DeepSeek-V4-Flash-0731-w8a8
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: AIV
  PYTHONHASHSEED: "0"

routing:
  type: disaggregated_prefill
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

# The framework starts MetaService on node0 and injects MMC_LOCAL_CONFIG_PATH.
kv_pool:
  type: memcache
  meta_service_port: 5000
  config_store_port: 6000
  config:
    meta:
      ock.mmc.log_level: info
      ock.mmc.meta_service.metrics_url: "http://${NODE_0_IP}:8100"
    local:
      ock.mmc.log_level: info
      ock.mmc.local_service.world_size: 256
      ock.mmc.local_service.protocol: device_sdma
      ock.mmc.local_service.dram.size: 10GB

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12332
    dp_size: 2
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 1
    cp_size: 8
    dp_address: "${NODE_0_IP}"
  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12332
    dp_size: 16
    dp_size_local: 16
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${NODE_1_IP}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1800"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "2400"

# Both model names are accepted so benchmark requests can use the model path.
templates:
  - node_index: 0
    envs: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--prefill-context-parallel-size"
      - "${CP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "512000"
      - "--max-num-batched-tokens"
      - "16384"
      - "--max-num-seqs"
      - "16"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--speculative-config"
      - '{"num_speculative_tokens": 5, "method": "dspark", "enforce_eager": true}'
      - "--trust-remote-code"
      - "--block-size"
      - "32"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.94"
      - "--quantization"
      - "ascend"
      - "--enforce-eager"
      - "--additional-config"
      - '{"enable_cpu_binding": true, "enable_fused_mc2": 1}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_port": "30000", "kv_load_failure_policy": "fail", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1, "pcp_size": 8}, "decode": {"dp_size": 16, "tp_size": 1}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"lookup_rpc_port": "0", "backend": "memcache", "use_layerwise": false}}]}}'
      - "--no-enable-prefix-caching"
  - node_index: 1
    envs: *env_decode
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "512000"
      - "--max-num-batched-tokens"
      - "480"
      - "--max-num-seqs"
      - "60"
      - "--block-size"
      - "32"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--no-disable-hybrid-kv-cache-manager"
      - "--no-enable-prefix-caching"
      - "--trust-remote-code"
      - "--tokenizer-mode"
      - "deepseek_v4"
      - "--model-loader-extra-config"
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - "--tool-call-parser"
      - "deepseek_v4"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "deepseek_v4"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - "--quantization"
      - "ascend"
      - "--speculative-config"
      - '{"num_speculative_tokens": 5, "method": "dspark"}'
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false}, "enable_cpu_binding": true, "multistream_overlap_shared_expert": true, "recompute_scheduler_enable": true}'
      - "--kv-transfer-config"
      - '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_port": "30100", "kv_load_failure_policy": "fail", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_consumer", "kv_port": "30100", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1, "pcp_size": 8}, "decode": {"dp_size": 16, "tp_size": 1}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_consumer", "kv_connector_extra_config": {"lookup_rpc_port": "0", "backend": "memcache", "use_layerwise": false}}]}}'
      - "--async-scheduling"

# Accuracy coverage and baseline reused from the existing Memcache PD case.
benchmarks:
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 128
    max_out_len: 1
    batch_size: 32
    request_rate: 0
    input_throughput_baseline: 0
    input_throughput_threshold: 0.92
