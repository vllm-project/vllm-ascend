test_name: "DeepSeek-V4.1-Flash-W8A8-Mooncake-PD"
model: "Eco-Tech/DeepSeek-V4.1-Flash-w8a8"
#model: "/mnt/sfs-local/ascend-ci-share/modelscope/hub/models/Eco-Tech/DeepSeek-V4.1-Flash-w8a8"
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [0]
    decoder: [1]

kv_pool:
  type: "mooncake"
  master_port: 50088
  metrics_port: 50089
  config:
    metadata_server: "P2PHANDSHAKE"
    protocol: "ascend"
    global_segment_size: "1GB"
    local_buffer_size: "1GB"
    preferred_segment: false
    prefer_alloc_in_same_node: true
    enable_ssd_offload: false


config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 13389
    dp_size: 4
    dp_size_local: 4
    dp_rank_start: 0
    tp_size: 4
    dp_address: "${NODE_0_IP}"
  - node_index: 1
    port_start: 7200
    dp_rpc_port: 13390
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_1_IP}"


env_common: &env_common
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  ASCEND_ENABLE_USE_FABRIC_MEM: "1"
  ACL_OP_INIT_MODE: "1"
  VLLM_SERVER_DEV_MODE: "1"
  PYTHONHASHSEED: "0"
  SERVER_PORT: "${PORT}"
  VLLM_USE_MODELSCOPE: "true"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1800"

prefill_server_cmd: &prefill_server_cmd
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$SERVER_PORT"
  - "--data-parallel-size"
  - "${DP_SIZE}"
  - "--data-parallel-rank"
  - "${DP_RANK}"
  - "--data-parallel-address"
  - "${DP_ADDRESS}"
  - "--data-parallel-rpc-port"
  - "${DP_RPC_PORT}"
  - "--tensor-parallel-size"
  - "${TP_SIZE}"
  - "--enable-expert-parallel"
  - "--seed"
  - "1024"
  - "--max-model-len"
  - "1048576"
  - "--max-num-batched-tokens"
  - "8192"
  - "--max-num-seqs"
  - "16"
  - "--speculative-config"
  - '{"num_speculative_tokens": 5, "method": "dspark"}'
  - "--trust-remote-code"
  - "--block-size"
  - "128"
  - "--tokenizer-mode"
  - "deepseek_v41"
  - "--reasoning-parser"
  - "deepseek_v41"
  - "--tool-call-parser"
  - "deepseek_v41"
  - "--enable-auto-tool-choice"
  - "--model-loader-extra-config"
  - '{"enable_multithread_load": true, "num_threads": 128}'
  - "--safetensors-load-strategy"
  - "lazy"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--quantization"
  - "ascend"
  - "--enforce-eager"
  - "--no-enable-prefix-caching"
  - "--engram-config"
  - '{"cpu_offload": true, "dp_shared_memory": true}'
  - "--additional-config"
  - '{"enable_cpu_binding": true, "enable_fused_mc2": 0, "enable_dsa_cp": true, "enable_flashcomm1": true, "enable_shared_expert_dp": true}'
  - "--kv-transfer-config"
  - '{"kv_connector": "MultiConnector", "kv_role": "kv_producer", "kv_port": "30000", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "kv_connector_extra_config": {"prefill": {"dp_size": 4, "tp_size": 4}, "decode": {"dp_size": 8, "tp_size": 2}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "mooncake", "use_layerwise": true}}]}}'

decode_server_cmd: &decode_server_cmd
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$SERVER_PORT"
  - "--data-parallel-size"
  - "${DP_SIZE}"
  - "--data-parallel-rank"
  - "${DP_RANK}"
  - "--data-parallel-address"
  - "${DP_ADDRESS}"
  - "--data-parallel-rpc-port"
  - "${DP_RPC_PORT}"
  - "--tensor-parallel-size"
  - "${TP_SIZE}"
  - "--enable-expert-parallel"
  - "--seed"
  - "1024"
  - "--max-model-len"
  - "1048576"
  - "--max-num-batched-tokens"
  - "512"
  - "--max-num-seqs"
  - "72"
  - "--async-scheduling"
  - "--block-size"
  - "128"
  - "--no-enable-prefix-caching"
  - "--trust-remote-code"
  - "--tokenizer-mode"
  - "deepseek_v41"
  - "--reasoning-parser"
  - "deepseek_v41"
  - "--tool-call-parser"
  - "deepseek_v41"
  - "--enable-auto-tool-choice"
  - "--model-loader-extra-config"
  - '{"enable_multithread_load": true, "num_threads": 128}'
  - "--safetensors-load-strategy"
  - "lazy"
  - "--gpu-memory-utilization"
  - "0.95"
  - "--quantization"
  - "ascend"
  - "--speculative-config"
  - '{"num_speculative_tokens": 5, "method": "dspark", "enforce_eager": true}'
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--engram-config"
  - '{"cpu_offload": true, "dp_shared_memory": true}'
  - "--additional-config"
  - '{"ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false}, "enable_cpu_binding": true, "multistream_overlap_shared_expert": true, "recompute_scheduler_enable": true}'
  - "--kv-transfer-config"
  - '{"kv_connector": "MultiConnector", "kv_role": "kv_consumer", "kv_port": "30100", "kv_connector_extra_config": {"connectors": [{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_consumer", "kv_connector_extra_config": {"prefill": {"dp_size": 4, "tp_size": 4}, "decode": {"dp_size": 8, "tp_size": 2}}}, {"kv_connector": "AscendStoreConnector", "kv_role": "kv_producer", "kv_connector_extra_config": {"backend": "mooncake"}}]}}'

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template: *prefill_server_cmd
  - node_index: 1
    envs:
      <<: *env_decode
    server_cmd_template: *decode_server_cmd

benchmarks:
  perf_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 16
    max_out_len: 1024
    batch_size: 4
    request_rate: 0
    baseline: 0
    threshold: 0.97
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1024
    batch_size: 16
    request_rate: 0
    input_throughput_baseline: 0
    input_throughput_threshold: 0.97

