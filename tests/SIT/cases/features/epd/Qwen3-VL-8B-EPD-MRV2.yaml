# Weekly EPD (MRV2) case for Qwen3-VL-8B-Instruct, mirroring
# tests/SIT/cases/models/configs/Qwen/Qwen2.5-VL-7B-Instruct-EPD.yaml.
# The reference proxy only exposes /v1/chat/completions, so chat_completion is
# used instead of the legacy /v1/completions handler.

test_cases:
  - name: "Qwen3-VL-8B-Instruct-epd-mrv2"
    model: "Qwen/Qwen3-VL-8B-Instruct"
    service_mode: "epd"
    envs:
      ENCODE_PORT: "DEFAULT_PORT"
      PD_PORT: "DEFAULT_PORT"
      PROXY_PORT: "DEFAULT_PORT"
      VLLM_USE_V2_MODEL_RUNNER: "1"
    epd_server_cmds:
      - - "--port"
        - "$ENCODE_PORT"
        - "--model"
        - "Qwen/Qwen3-VL-8B-Instruct"
        - "--trust-remote-code"
        - "--gpu-memory-utilization"
        - "0.01"
        - "--enforce-eager"
        - "--no-enable-prefix-caching"
        - "--max-model-len"
        - "10000"
        - "--max-num-batched-tokens"
        - "10000"
        - "--max-num-seqs"
        - "1"
        - "--limit-mm-per-prompt"
        - '{"image": 1, "video": 0}'
        - "--ec-transfer-config"
        - '{"ec_connector_extra_config":{"shared_storage_path":"/dev/shm/epd/qwen3_vl_8b_storage"},"ec_connector":"ECExampleConnector","ec_role": "ec_producer"}'
      - - "--port"
        - "$PD_PORT"
        - "--model"
        - "Qwen/Qwen3-VL-8B-Instruct"
        - "--trust-remote-code"
        - "--gpu-memory-utilization"
        - "0.95"
        - "--enforce-eager"
        - "--max-model-len"
        - "10000"
        - "--max-num-batched-tokens"
        - "10000"
        - "--max-num-seqs"
        - "128"
        - "--limit-mm-per-prompt"
        - '{"image": 1, "video": 0}'
        - "--ec-transfer-config"
        - '{"ec_connector_extra_config":{"shared_storage_path":"/dev/shm/epd/qwen3_vl_8b_storage"},"ec_connector":"ECExampleConnector","ec_role": "ec_consumer"}'
    epd_proxy_args:
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "$PROXY_PORT"
      - "--encode-servers-urls"
      - "http://localhost:$ENCODE_PORT"
      - "--decode-servers-urls"
      - "http://localhost:$PD_PORT"
      - "--prefill-servers-urls"
      - "disable"
    test_content:
      - "chat_completion"
      - "image"
    benchmarks:
      warm_up:
        case_type: performance
        dataset_path: vllm-ascend/textvqa-perf-1080p
        request_conf: vllm_api_stream_chat
        dataset_conf: textvqa/textvqa_gen_base64
        num_prompts: 50
        max_out_len: 20
        batch_size: 32
        request_rate: 0
        baseline: 1
        threshold: 0.97
      acc:
        case_type: accuracy
        dataset_path: vllm-ascend/textvqa-lite
        request_conf: vllm_api_stream_chat
        dataset_conf: textvqa/textvqa_gen_base64
        max_out_len: 2048
        batch_size: 128
        # Inherited from tests/SIT/cases/models/configs/Qwen/Qwen3VL-8B-310p.yaml;
        # re-baseline this value after the first A3 BF16 run.
        baseline: 79.98
        threshold: 1
      perf:
        case_type: performance
        dataset_path: vllm-ascend/textvqa-perf-1080p
        request_conf: vllm_api_stream_chat
        dataset_conf: textvqa/textvqa_gen_base64
        num_prompts: 512
        max_out_len: 256
        batch_size: 128
        request_rate: 0
        # Relative gate, same convention as the existing Qwen2.5-VL EPD YAML.
        baseline: 1
        threshold: 0.97
