# ==========================================
# ACTUAL TEST CASES
# ==========================================

test_cases:
  - name: "DeepSeek-V4.1-Flash-A5-SingleNode"
    model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
    envs:
      VLLM_USE_V2_MODEL_RUNNER: "1"
      HCCL_OP_EXPANSION_MODE: "CCU_SCHED"
      HCCL_BUFFSIZE: "1600"
      HCCL_CONNECT_TIMEOUT: "1200"
      HCCL_EXEC_TIMEOUT: "3600"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "10"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    server_cmd:
      - "--data-parallel-size"
      - "8"
      - "--tensor-parallel-size"
      - "1"
      - "--enable-expert-parallel"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "4096"
      - "--max-num-seqs"
      - "64"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--block-size"
      - "128"
      - "--quantization"
      - "deepseek_v4_fp8"
      - "--engram-config"
      - '{"cpu_offload":true,"dp_shared_memory":true}'
      - "--tokenizer-mode"
      - "deepseek_v41"
      - "--tool-call-parser"
      - "deepseek_v41"
      - "--reasoning-parser"
      - "deepseek_v41"
      - "--enable-auto-tool-choice"
      - "--trust-remote-code"
      - "--no-swa-bounded-replay"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"method":"dspark","num_speculative_tokens":5}'
      - "--additional-config"
      - '{"multistream_overlap_shared_expert": true,"combine_quant_mode": 4}'
    benchmarks:
      acc-gpqa:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 131072
        batch_size: 32
        baseline: 90.91
        threshold: 5
        thinking: true
        reasoning_effort: 100
        temperature: 1.0
        top_p: 1.0
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs1200_deepseek
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 64
        max_out_len: 1024
        batch_size: 30
        request_rate: 0
        baseline: 4000
        threshold: 0.97
