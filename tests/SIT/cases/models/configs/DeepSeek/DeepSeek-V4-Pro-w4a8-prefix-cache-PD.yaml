test_name: "DeepSeek-V4-Pro-w4a8-prefix-cache-PD"
model: "Eco-Tech/DeepSeek-V4-Pro-0813-w4a8"
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0, 1 ]
    decoder: [ 2, 3 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 2
    pp_size: 2
    cp_size: 8
    nnodes: 2
    node_rank: 0
    master_addr: "${NODE_0_IP}"
    master_port: 7060
    is_headless: false
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 2
    pp_size: 2
    cp_size: 8
    nnodes: 2
    node_rank: 1
    master_addr: "${NODE_0_IP}"
    master_port: 7060
    is_headless: true
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 8
    tp_size: 2
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["hccs:device"]}'
  ASCEND_LOCAL_COMM_RES: '{"version":"1.2"}'

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1024"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
  HCCL_CONNECT_TIMEOUT: "6000"
  HCCL_EXEC_TIMEOUT: "204"
  VLLM_PP_LAYER_PARTITION: "32,29"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "2200"
  HCCL_CONNECT_TIMEOUT: "1200"
  HCCL_EXEC_TIMEOUT: "2000"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --prefill-context-parallel-size
      - ${CP_SIZE}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --nnodes
      - ${NNODES}
      - --node-rank
      - ${NODE_RANK}
      - --master-addr
      - ${MASTER_ADDR}
      - --master-port
      - ${MASTER_PORT}
      - --data-parallel-size
      - ${DP_SIZE}
      - --pipeline-parallel-size
      - ${PP_SIZE}
      - --decode-context-parallel-size
      - "1"
      - --enable-expert-parallel
      - --max-model-len
      - "150000"
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "16"
      - --block-size
      - "32"
      - --gpu-memory-utilization
      - "0.92"
      - --enable-chunked-prefill
      - --no-disable-hybrid-kv-cache-manager
      - --enable-prefix-caching
      - --enforce-eager
      - --quantization
      - "ascend"
      - --tokenizer-mode
      - "deepseek_v4"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --tool-call-parser
      - "deepseek_v4"
      - --enable-auto-tool-choice
      - --reasoning-parser
      - "deepseek_v4"
      - --model-loader-extra-config
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - --trust-remote-code
      - --seed
      - "1024"
      - --speculative-config
      - '{"method": "dspark", "num_speculative_tokens": 5, "enforce_eager": true}'
      - --additional-config
      - '{"enable_cpu_binding": true, "enable_flashcomm1": true, "enable_fused_mc2": 1}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "kv_port": 14579, "kv_connector_extra_config": {"prefill": {"dp_size": 1, "pp_size": 2, "tp_size": 2, "pcp_size": 8}, "decode": {"dp_size": 16, "tp_size": 2, "pp_size": 1, "pcp_size": 1}}}'

  - node_index: 1
    envs:
      <<: *env_prefill
    server_cmd_template:
