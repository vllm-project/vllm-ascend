# Single-node PD disaggregation on one A3 node (16 NPUs).
# The prefiller owns NPUs 0-7 and the decoder owns NPUs 8-15; both instances run
# in the same pod, so the nightly caller must pass size=1.
test_name: "DeepSeek-V4-Flash-W8A8-A3-PD-Single"
model: "Eco-Tech/DeepSeek-V4-Flash-w8a8-mtp"
num_nodes: 1
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]

config:
  # Prefiller: 2 DP ranks x (TP1 x CP4) = 8 NPUs (device_start 0).
  - node_index: 0
    device_start: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 2
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 1
    cp_size: 4
    dp_address: "${LOCAL_IP}"

  # Decoder: 8 DP ranks x TP1 = 8 NPUs (device_start 8).
  - node_index: 0
    device_start: 8
    port_start: 7200
    dp_rpc_port: 12322
    dp_size: 8
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 1
    dp_address: "${LOCAL_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  VLLM_RPC_TIMEOUT: "3600"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "120"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "1024"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1500"

templates:
  # Prefiller (config entry 0).
  - envs:
      <<: *env_prefill
    server_cmd_template:
      - "--prefix-cache-retention-interval"
      - "4096"
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --prefill-context-parallel-size
      - ${CP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "8192"
      - --max-num-seqs
      - "16"
      - --no-disable-hybrid-kv-cache-manager
      - --model-loader-extra-config
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - --speculative-config
      - '{"num_speculative_tokens": 1,"method": "mtp"}'
      - --trust-remote-code
      - --block-size
      - "32"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --tokenizer-mode
      - "deepseek_v4"
      - --tool-call-parser
      - "deepseek_v4"
      - --enable-auto-tool-choice
      - --reasoning-parser
      - "deepseek_v4"
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --enforce-eager
      - --additional-config
      - '{"enable_cpu_binding": true,"enable_fused_mc2":1}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1}, "decode": {"dp_size": 8, "tp_size": 1}}}'

  # Decoder (config entry 1).
  - envs:
      <<: *env_decode
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --max-num-batched-tokens
      - "240"
      - --max-num-seqs
      - "60"
      - --async-scheduling
      - --block-size
      - "32"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --no-enable-prefix-caching
      - --no-disable-hybrid-kv-cache-manager
      - --model-loader-extra-config
      - '{"enable_multithread_load": true, "num_threads": 128}'
      - --trust-remote-code
      - --tokenizer-mode
      - "deepseek_v4"
      - --tool-call-parser
      - "deepseek_v4"
      - --enable-auto-tool-choice
      - --reasoning-parser
      - "deepseek_v4"
      - --gpu-memory-utilization
      - "0.95"
      - --quantization
      - "ascend"
      - --speculative-config
      - '{"num_speculative_tokens": 3,"method": "mtp"}'
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_consumer", "kv_port": "30100", "engine_id": "1", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1}, "decode": {"dp_size": 8, "tp_size": 1}}}'
      - --additional-config
      - '{"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":false},"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"recompute_scheduler_enable":true}'

benchmarks:
  acc-gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    batch_size: 32
    baseline: 86.36
    threshold: 5
    thinking: true
    reasoning_effort: low
  # No baseline yet: the 8P+8D split has no historical data. The case records
  # throughput first; add baseline/threshold once a stable run is available.
  perf:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in32768_bs1000_deepseek
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1024
    batch_size: 16
    request_rate: 0
