# ==========================================
# DeepSeek-V4-Flash K15 DSpark A5 单机 + Mooncake KV 池化
# 由 DeepSeek_V4_Flash_K15_dspark_A5.yaml 改写, 适配单节点池化框架:
#   kv_pool 段由框架接管 —— mooncake_master 自动拉起并注入
#   MOONCAKE_CONFIG_PATH / MOONCAKE_MASTER, 无需手工配置。
#
# A5 (950PR&950DT) 环境前置（YAML 管不到, 部署时确认）:
#   1. HDK >= 25.6 且 mooncake >= 0.3.11; CANN >= 9.1.0; glibc >= 2.35
#   2. 容器/主机需挂载: /dev/ummu /dev/uburma /usr/bin/urma_admin
#      /lib/route.conf /etc/hccl_rootinfo.json /etc/hccn.conf
#   3. 服务启动前清理残留巨页（残留巨页会显著降低 Mooncake 性能）:
#      for n in 0 1 2 3; do
#        echo 0 > /sys/devices/system/node/node${n}/hugepages/hugepages-1048576kB/nr_hugepages
#        echo 0 > /sys/devices/system/node/node${n}/hugepages/hugepages-2048kB/nr_hugepages
#      done
#   4. 传输协议二选一（按实际硬件形态）: UBOE 用 ASCEND_GLOBAL_RESOURCE_CONFIG
#      (下方默认), UB 则改用 ASCEND_LOCAL_COMM_RES='{"version":"1.3"}'
# ==========================================

_envs: &envs
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "2048"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  SERVER_PORT: "DEFAULT_PORT"
  # ---- 池化必加 ----
  PYTHONHASHSEED: "0"   # 池化哈希一致性要求, 全实例统一
  # 950PR&950DT Products UBOE 传输协议（UB 硬件则删此行, 改用下方 ASCEND_LOCAL_COMM_RES）
  ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["uboe:device"]}'
  # 950PR&950DT Products UB:
  # ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'

_kv_pool: &kv_pool
  type: "mooncake"
  master_port: 50088
  metrics_port: 50089
  config:
    metadata_server: "P2PHANDSHAKE"
    protocol: "ascend"
    device_name: ""
    # 每卡注册到 KV 池的内存, 必须 1GB 对齐; 8 DP rank x 1GB = 8GB 主机 DRAM
    global_segment_size: "1GB"
    preferred_segment: false
    prefer_alloc_in_same_node: true
    enable_ssd_offload: false

# 池化连接器(单机 PD-Mixed): AscendStoreConnector + kv_both。
# 注意: DeepSeek-V4 为混合注意力模型, kv_load_failure_policy 必须为 "fail"
# (recompute 暂不支持 DS-V4/Qwen3.5 等混合注意力模型)。
# server_cmd_extra 必须是扁平字符串列表（框架直接拼接）, 因此池化参数
# 在下方两个 test_case 中各自内联, 不使用嵌套列表锚点。

server_cmd: &server_cmd
  - "--prefix-cache-retention-interval"
  - "4096"
  - "--max-model-len"
  - "1048576"
  - "--max-num-batched-tokens"
  - "10240"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--max-num-seqs"
  - "64"
  - "--data-parallel-size"
  - "8"
  - "--tensor-parallel-size"
  - "1"
  - "--enable-expert-parallel"
  - "--tokenizer-mode"
  - "deepseek_v4"
  - "--tool-call-parser"
  - "deepseek_v4"
  - "--enable-auto-tool-choice"
  - "--reasoning-parser"
  - "deepseek_v4"
  - "--model-loader-extra-config"
  - '{"enable_multithread_load": true, "num_threads": 128}'
  - "--quantization"
  - "ascend"
  - "--port"
  - "$SERVER_PORT"
  - "--block-size"
  - "32"
  - "--attention_config.indexer_kv_dtype"
  - "fp8"
  - "--kv-cache-dtype"
  - "fp8"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--additional-config"
  - '{ "ascend_compilation_config": { "enable_npugraph_ex": true, "enable_static_kernel": false }, "enable_cpu_binding": true, "multistream_overlap_shared_expert": true}'

test_cases:
  - name: "DeepSeek-V4-Flash-DSpark-Static-Mooncake"
    model: "/root/.cache/modelscope/hub/models/deepseek-ai/DeepSeek-V4-Flash-0731"
    envs:
      <<: *envs
    kv_pool: *kv_pool
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--speculative-config"
      - '{"method":"dspark","num_speculative_tokens":15,"enforce_eager":false}'
      - "--no-enable-prefix-caching"   # 关闭本地前缀缓存, 强制请求走 KV 池（对齐官方 A3 Mooncake 用例）
      - "--kv-transfer-config"
      - '{"kv_connector": "AscendStoreConnector", "kv_role": "kv_both",
        "kv_load_failure_policy": "fail",
        "kv_connector_extra_config": {"backend": "mooncake", "lookup_rpc_port": "0"}}'
#    test_content:
#      - chat_completion
#    prompts:
#      - seed: "x "
#        target_tokens: 200
#    api_keyword_args:
#      max_tokens: 200
#      temperature: 0.0
#    expected_response:
#      completion_tokens: 200
    benchmarks:
      perf:
        case_type: performance
        dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/DeepSeek-V4-Flash_input_3500_lines_128
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 128
        max_out_len: 1500
        batch_size: 32
        request_rate: 0
        # 注意: 原基线为无池化数据; 开启池化(+关闭本地前缀缓存)后吞吐特性改变,
        # 首跑后需回填新基线
        baseline: 0
        threshold: 0.95
        temperature: 0
        ignore_eos: True

