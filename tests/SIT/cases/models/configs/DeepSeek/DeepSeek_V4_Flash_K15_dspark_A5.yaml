  - name: "DeepSeek-V4-Flash-DSpark-AdaptiveVerification-Memcache"
    model: "/root/.cache/modelscope/hub/models/deepseek-ai/DeepSeek-V4-Flash-0731"
    envs:
      <<: *envs
    kv_pool: *kv_pool
    server_cmd: *server_cmd
    server_cmd_extra:
      - "--speculative-config"
      - '{"method":"dspark","num_speculative_tokens":15,"enforce_eager":false,"enable_adaptive_verification": true}'
      - "--no-enable-prefix-caching"
      - "--kv-transfer-config"
      - '{"kv_connector": "AscendStoreConnector", "kv_role": "kv_both",
        "kv_load_failure_policy": "fail",
        "kv_connector_extra_config": {"backend": "memcache", "lookup_rpc_port": "0", "use_layerwise": false}}'
#    test_content:
#      - chat_completion
