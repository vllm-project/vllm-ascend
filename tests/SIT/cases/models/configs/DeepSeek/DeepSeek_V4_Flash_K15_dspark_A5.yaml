_envs: &envs
  OMP_NUM_THREADS: "10"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_BUFFSIZE: "2048"
  HCCL_OP_EXPANSION_MODE: "AIV"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  SERVER_PORT: "DEFAULT_PORT"
  PYTHONHASHSEED: "0"   # 池化哈希一致性要求, 全实例统一
  VLLM_ENGINE_READY_TIMEOUT_S: "36000"

_kv_pool: &kv_pool
  type: "memcache"
  meta_service_port: 5000
  config_store_port: 6000
  config:
    meta:
      ock.mmc.log_level: "info"
    local:
      ock.mmc.log_level: "info"
      # 每 DP rank 占用数; 8 DP rank 时建议 8 以上, 参考官方用例取 256
      ock.mmc.local_service.world_size: 256
      # 950PR&950DT 协议二选一: UB 用 device_urma（默认）; UBOE 改 device_uboe
      # (A2 推荐 device_rdma, A3 HCCS 推荐 device_sdma —— 均不适用于 950)
      ock.mmc.local_service.protocol: "device_urma"
      # 本地 DRAM 池容量; 单机 8 rank 场景 10GB 起步, 按主机内存余量调整
      ock.mmc.local_service.dram.size: "10GB"

# 池化连接器(单机 PD-Mixed): AscendStoreConnector + kv_both。
# 注意: DeepSeek-V4 为混合注意力模型, kv_load_failure_policy 必须为 "fail"
# (recompute 暂不支持 DS-V4/Qwen3.5 等混合注意力模型)。
# server_cmd_extra 必须是扁平字符串列表（框架直接拼接）, 因此池化参数
# 在下方两个 test_case 中各自内联。
server_cmd: &server_cmd
  - "--prefix-cache-retention-interval"
  - "4096"
  - "--max-model-len"
  - "1048576"
  - "--max-num-batched-tokens"
  - "10240"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--max-num-seqs"
  - "64"
  - "--data-parallel-size"
  - "8"
  - "--tensor-parallel-size"
  - "1"
  - "--enable-expert-parallel"
  - "--tokenizer-mode"
  - "deepseek_v4"
  - "--tool-call-parser"
  - "deepseek_v4"
  - "--enable-auto-tool-choice"
  - "--reasoning-parser"
  - "deepseek_v4"
  - "--model-loader-extra-config"
  - '{"enable_multithread_load": true, "num_threads": 128}'
  - "--quantization"
  - "ascend"
  - "--port"
  - "$SERVER_PORT"
  - "--block-size"
  - "32"
  - "--attention_config.indexer_kv_dtype"
  - "fp8"
  - "--kv-cache-dtype"
  - "fp8"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - "--additional-config"
  - '{ "ascend_compilation_config": { "enable_npugraph_ex": true, "enable_static_kernel": false }, "enable_cpu_binding": true, "multistream_overlap_shared_expert": true}'

