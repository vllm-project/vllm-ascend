  - "$SERVER_PORT"
  - "--safetensors-load-strategy"
  - "prefetch"
  - "--max-num-batched-tokens"
  - "4095"
  - "--gpu-memory-utilization"
  - "0.9"
  - "--enable-expert-parallel"
  - "--async-scheduling"
  - "--max-num-seqs"
  - "32"
  - "--block-size"
  - "128"
  - "--data-parallel-size"
  - "8"
  - "--tensor-parallel-size"
  - "1"
  - "--tokenizer-mode"
  - "deepseek_v4"
  - "--tool-call-parser"
  - "deepseek_v4"
  - "--kv-cache-dtype" 
  - "fp8"
  - "--attention_config.indexer_kv_dtype" 
  - "fp8"
  - "--api_server_count"
  - "1"
  - "--compilation-config"
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
_benchmarks_per1: &benchmarks_acc
  acc:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 131072
    batch_size: 32
    baseline: 87.4
    threshold: 5
    temperature: 1.0
    ignore_eos: false
    top_p: 1.0
    thinking: True
_benchmarks_per2: &benchmarks_per
  perf:
    case_type: performance
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/DeepSeek-V4-Flash_input_3500_lines_128
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 128
    max_out_len: 1500
    batch_size: 32
    request_rate: 0
    baseline: 83.50106007067137
    threshold: 0.95
    temperature: 0
    ignore_eos: True
