test_cases:
  - name: "MiniMax-M3-MXFP8-950DT-128K-singlenode"
    model: "MiniMax/MiniMax-M3-MXFP8"
    envs:
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SERVER_PORT: "DEFAULT_PORT"
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      HCCL_BUFFSIZE: "512"
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--trust-remote-code"
      - "--distributed-executor-backend"
      - "mp"
      - "--tensor-parallel-size"
      - "4"
      - "--data-parallel-size"
      - "2"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--dtype"
      - "bfloat16"
      - "--quantization"
      - "mxfp8"
      - "--max-model-len"
      - "133000"
      - "--max-num-batched-tokens"
      - "16384"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-num-seqs"
      - "500"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--async-scheduling"
      - "--reasoning-parser"
      - "minimax_m3"
      - "--limit-mm-per-prompt"
      - '{"image":1,"video":0}'
      - "--gpu-memory-utilization"
      - "0.92"
      - "--additional-config"
      - '{"enable_cpu_binding":true,"ascend_compilation_config":{"fuse_qknorm_rope":false,"fuse_norm_quant":false},"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":true,"enable_flashcomm1":true}'
      - "--speculative-config"
      - '{"model":"Inferact/MiniMax-M3-EAGLE3-GQA","method":"eagle3","num_speculative_tokens":3,"kv_cache_dtype":"bfloat16"}'
      - "--safetensors-load-strategy"
      - "prefetch"

    benchmarks:
      P_prefix0:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix0_in131072_bs500_MiniMax_w8a8_0626
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 12
        max_out_len: 1
        batch_size: 3
        request_rate: 0
        baseline: 0
        threshold: 0.97

      D_prefix99_warmup:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix99_in131072_bs500_MiniMax_w8a8_0626
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        max_out_len: 1024
        batch_size: 8
        request_rate: 0
        baseline: 0
        threshold: 0.97

      D_prefix99:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix99_in131072_bs500_MiniMax_w8a8_0626
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 240
        max_out_len: 1024
        batch_size: 60
        request_rate: 0
        baseline: 0
        threshold: 0.97
