test_name: "multi-node-Step-5-Preview-w8a8-mxfp8-Co-located"
model: "/root/.cache/modelscope/hub/models/Eco-Tech/Step-5-Preview-w8a8-mxfp8"
num_nodes: 2
npu_per_node: 8
dp_load_balancing: internal

env_common: &env_common
  VLLM_USE_FASTOKENS: "1"
  HCCL_BUFFSIZE: "1024"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  HCCL_OP_EXPANSION_MODE: "CCU_MS"
  SERVER_PORT: "8080"
  ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"

deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve /root/.cache/modelscope/hub/models/Eco-Tech/Step-5-Preview-w8a8-mxfp8
      --host 0.0.0.0
      --port $SERVER_PORT
      --trust-remote-code
      --quantization ascend
      --max-num-seqs 256
      --max-num-batched-tokens 16384
      --max-model-len 1048576
      --tensor-parallel-size 4
      --data-parallel-size 4
      --data-parallel-size-local 2
      --data-parallel-address $LOCAL_IP
      --data-parallel-rpc-port 13389
      --enable-expert-parallel
      --gpu-memory-utilization 0.9
      --prefix-cache-retention-interval 2048
      --distributed-executor-backend mp
      --allowed-local-media-path /
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      --additional-config '{"enable_flashcomm1": true, "enable_shared_expert_dp": true, "multistream_overlap_shared_expert": true}'
      --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}'
      --enable-auto-tool-choice
      --tool-call-parser step5
      --reasoning-parser step5
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve /root/.cache/modelscope/hub/models/Eco-Tech/Step-5-Preview-w8a8-mxfp8
      --host 0.0.0.0
      --port $SERVER_PORT
      --trust-remote-code
      --quantization ascend
      --max-num-seqs 256
      --max-num-batched-tokens 16384
      --max-model-len 1048576
      --tensor-parallel-size 4
      --data-parallel-size 4
      --data-parallel-size-local 2
      --data-parallel-address $MASTER_IP
      --headless
      --data-parallel-start-rank 2
      --data-parallel-rpc-port 13389
      --enable-expert-parallel
      --gpu-memory-utilization 0.9
      --prefix-cache-retention-interval 2048
      --distributed-executor-backend mp
      --allowed-local-media-path /
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      --additional-config '{"enable_flashcomm1": true, "enable_shared_expert_dp": true, "multistream_overlap_shared_expert": true}'
      --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}'
      --enable-auto-tool-choice
      --tool-call-parser step5
      --reasoning-parser step5

benchmarks:
  acc_gpqa:
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 55000
    batch_size: 16
    baseline: 0
    threshold: 5
    verify_mode: ge
    temperature: 1.0
    top_p: 0.95
    top_k: 0
    ignore_eos: false

