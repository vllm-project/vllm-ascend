test_name: "Kimi-K3-W4A8-A3-1M-PD"
model: "Eco-Tech/Kimi-K3-w4a8"
num_nodes: 8
npu_per_node: 16

dp_load_balancing: external

routing:
  type: disaggregated_prefill
  groups:
    prefiller: [ 0, 1, 2, 3 ]
    decoder: [ 4, 5, 6, 7 ]

config:
  - node_index: 0
    port_start: 8080
    dp_rpc_port: 13389
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_0_IP}"
    pp_size: 4
    pp_layer_partition: "25,25,24,19"
    nnodes: 4
    node_rank: 0
    master_addr: "${NODE_0_IP}"
    master_port: 41000
    distributed_executor_backend: mp
    is_headless: false

  - node_index: 1
    port_start: 8080
    dp_rpc_port: 13389
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_0_IP}"
    pp_size: 4
    pp_layer_partition: "25,25,24,19"
    nnodes: 4
    node_rank: 1
    master_addr: "${NODE_0_IP}"
    master_port: 41000
    distributed_executor_backend: mp
    is_headless: true

  - node_index: 2
    port_start: 8080
    dp_rpc_port: 13389
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_0_IP}"
    pp_size: 4
    pp_layer_partition: "25,25,24,19"
    nnodes: 4
    node_rank: 2
    master_addr: "${NODE_0_IP}"
    master_port: 41000
    distributed_executor_backend: mp
    is_headless: true

  - node_index: 3
    port_start: 8080
    dp_rpc_port: 13389
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_0_IP}"
    pp_size: 4
    pp_layer_partition: "25,25,24,19"
    nnodes: 4
    node_rank: 3
    master_addr: "${NODE_0_IP}"
    master_port: 41000
    distributed_executor_backend: mp
    is_headless: true

  - node_index: 4
    port_start: 8080
    dp_rpc_port: 13390
    dp_size: 4
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_4_IP}"

  - node_index: 5
    port_start: 8080
    dp_rpc_port: 13390
    dp_size: 4
    dp_size_local: 1
    dp_rank_start: 1
    tp_size: 16
    dp_address: "${NODE_4_IP}"

  - node_index: 6
    port_start: 8080
    dp_rpc_port: 13390
    dp_size: 4
    dp_size_local: 1
    dp_rank_start: 2
    tp_size: 16
    dp_address: "${NODE_4_IP}"

  - node_index: 7
    port_start: 8080
    dp_rpc_port: 13390
    dp_size: 4
    dp_size_local: 1
    dp_rank_start: 3
    tp_size: 16
    dp_address: "${NODE_4_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_BUFFSIZE: "1024"
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH"
  TORCH_EXTENSIONS_DIR: "/tmp/kimi_k3_torch_extensions/node-${NODE_INDEX}/dp-${DP_RANK}"

env_prefill: &env_prefill
  <<: *env_common
  # Leave HCCL_OP_EXPANSION_MODE unset for the default AICPU mode.
  PYTHONHASHSEED: "0"
  VLLM_HOST_IP: "${LOCAL_IP}"
  VLLM_PP_LAYER_PARTITION: "25,25,24,19"

env_decode: &env_decode
  <<: *env_common
  HCCL_OP_EXPANSION_MODE: AIV

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "kimi_k3"
      - "--tool-call-parser"
      - "kimi_k3"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--pipeline-parallel-size"
      - "${PP_SIZE}"
      - "--nnodes"
      - "${NNODES}"
      - "--node-rank"
      - "${NODE_RANK}"
      - "--distributed-executor-backend"
      - "mp"
      - "--master-addr"
      - "${MASTER_ADDR}"
      - "--master-port"
      - "${MASTER_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "32"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--enforce-eager"
      - "--speculative-config"
      - '{"method":"dspark","model":"/root/.cache/modelscope/hub/models/Eco-Tech/Kimi-K3-DSpark-MLA-NPU","num_speculative_tokens":7,"draft_tensor_parallel_size":16,"draft_sample_method":"greedy","enforce_eager":true}'
      - "--mm-encoder-tp-mode"
      - "data"
      - "--mm-processor-cache-gb"
      - "1"
      - "--skip-mm-profiling"
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"enable_flashcomm1":true,"multistream_overlap_shared_expert":false,"enable_fused_mc2":2,"enable_shared_expert_dp":true}'
      - "--limit-mm-per-prompt"
      - '{"vision_chunk":2}'
      - "--kv-transfer-config"
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":"30000","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":16,"pp_size":4,"pp_layer_partition":"25,25,24,19"},"decode":{"dp_size":4,"tp_size":16}}}'

  - node_index: 1
    envs:
      <<: *env_prefill
    server_cmd_template: &prefill_worker_args
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "kimi_k3"
      - "--tool-call-parser"
      - "kimi_k3"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--pipeline-parallel-size"
      - "${PP_SIZE}"
      - "--nnodes"
      - "${NNODES}"
      - "--node-rank"
      - "${NODE_RANK}"
      - "--distributed-executor-backend"
      - "mp"
      - "--master-addr"
      - "${MASTER_ADDR}"
      - "--master-port"
      - "${MASTER_PORT}"
      - "--headless"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "32"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--enforce-eager"
      - "--speculative-config"
      - '{"method":"dspark","model":"/root/.cache/modelscope/hub/models/Eco-Tech/Kimi-K3-DSpark-MLA-NPU","num_speculative_tokens":7,"draft_tensor_parallel_size":16,"draft_sample_method":"greedy","enforce_eager":true}'
      - "--mm-encoder-tp-mode"
      - "data"
      - "--mm-processor-cache-gb"
      - "1"
      - "--skip-mm-profiling"
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"enable_flashcomm1":true,"multistream_overlap_shared_expert":false,"enable_fused_mc2":2,"enable_shared_expert_dp":true}'
      - "--limit-mm-per-prompt"
      - '{"vision_chunk":2}'
      - "--kv-transfer-config"
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":"30000","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":16,"pp_size":4,"pp_layer_partition":"25,25,24,19"},"decode":{"dp_size":4,"tp_size":16}}}'

  - node_index: 2
    envs:
      <<: *env_prefill
    server_cmd_template: *prefill_worker_args

  - node_index: 3
    envs:
      <<: *env_prefill
    server_cmd_template: *prefill_worker_args

  - node_index: 4
    envs:
      <<: *env_decode
    server_cmd_template: &decode_args
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "kimi_k3"
      - "--tool-call-parser"
      - "kimi_k3"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--decode-context-parallel-size"
      - "16"
      - "--cp-kv-cache-interleave-size"
      - "384"
      - "--block-size"
      - "384"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "32"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--speculative-config"
      - '{"method":"dspark","model":"/root/.cache/modelscope/hub/models/Eco-Tech/Kimi-K3-DSpark-MLA-NPU","num_speculative_tokens":7,"draft_tensor_parallel_size":16,"draft_sample_method":"greedy","enforce_eager":false}'
      - "--mm-encoder-tp-mode"
      - "data"
      - "--mm-processor-cache-gb"
      - "1"
      - "--skip-mm-profiling"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"multistream_overlap_shared_expert":true,"enable_mlapo":true,"scheduler_config":{"recompute_scheduler_enable":true}}'
