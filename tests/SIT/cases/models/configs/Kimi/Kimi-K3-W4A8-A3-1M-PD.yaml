      - '{"vision_chunk":2}'
      - "--kv-transfer-config"
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":"30100","kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":16,"pp_size":4,"pp_layer_partition":"25,25,24,19"},"decode":{"dp_size":4,"tp_size":16}}}'

  - node_index: 5
    envs:
      <<: *env_decode
    server_cmd_template: *decode_args

  - node_index: 6
    envs:
      <<: *env_decode
    server_cmd_template: *decode_args

  - node_index: 7
    envs:
      <<: *env_decode
    server_cmd_template: *decode_args

benchmarks:
  acc_gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 81920
    batch_size: 64
    thinking: true
    temperature: 1.0
    top_p: 0.95
    baseline: 93.5
    threshold: 3
  perf_128k_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs1000_kimi
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1
    batch_size: 1
    request_rate: 0
    baseline: 0
    threshold: 0.97
  perf_128k_prefix90:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs1000_kimi
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 128
    max_out_len: 1024
    batch_size: 32
    request_rate: 0
    baseline: 608.891
    threshold: 0.95
