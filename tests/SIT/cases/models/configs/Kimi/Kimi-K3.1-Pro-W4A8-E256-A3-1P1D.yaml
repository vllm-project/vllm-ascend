test_name: Kimi-K3.1-Pro-W4A8-E256-A3-1P1D
model: /root/.cache/modelscope/hub/models/Ares8364/Kimi-K3.1-Pro-w4a8-e256
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external
routing:
  type: disaggregated_prefill
  groups:
    prefiller:
    - 0
    decoder:
    - 1
config:
- node_index: 0
  port_start: 8080
  dp_rpc_port: 13389
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 16
  cp_size: 1
  dp_address: ${NODE_0_IP}
  pp_size: 1
  distributed_executor_backend: mp
- node_index: 1
  port_start: 8080
  dp_rpc_port: 13390
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 16
  dp_address: ${NODE_1_IP}
env_common: &env_common
  VLLM_USE_MODELSCOPE: 'true'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
  VLLM_HOST_IP: ${LOCAL_IP}
  HCCL_BUFFSIZE: '1024'
  HCCL_CONNECT_TIMEOUT: '1200'
  HCCL_NPU_SOCKET_PORT_RANGE: auto
  ASCEND_RT_VISIBLE_DEVICES: ${VISIBLE_DEVICES}
  LD_LIBRARY_PATH: /usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OMP_PROC_BIND: 'false'
  FLA_STABLE_DEBUG_DESC: '0'
  TORCH_EXTENSIONS_DIR: /tmp/kimi_k31_torch_extensions/node-${NODE_INDEX}/dp-${DP_RANK}
env_prefill: &id001
  <<: *env_common
  HCCL_IF_BASE_PORT: '51000'
  HCCL_HOST_SOCKET_PORT_RANGE: 51000-51063
env_decode: &id002
  <<: *env_common
  HCCL_IF_BASE_PORT: '50000'
  HCCL_HOST_SOCKET_PORT_RANGE: 50000-50063
  HCCL_OP_EXPANSION_MODE: AIV
  HCCL_DETERMINISTIC: 'true'
templates:
- node_index: 0
  envs: *id001
  server_cmd_template:
  - --host
  - 0.0.0.0
  - --port
  - ${PORT}
  - --quantization
  - ascend
  - --enable-auto-tool-choice
  - --reasoning-parser
  - kimi_k3
  - --tool-call-parser
  - kimi_k3
  - --tokenizer-mode
  - kimi_k3
  - --data-parallel-size
  - '1'
  - --pipeline-parallel-size
  - '1'
  - --prefill-context-parallel-size
  - '1'
  - --decode-context-parallel-size
  - '1'
  - --distributed-executor-backend
  - mp
  - --data-parallel-backend
  - mp
  - --tensor-parallel-size
  - '16'
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --max-model-len
  - '147456'
  - --max-num-batched-tokens
  - '8192'
  - --max-num-seqs
  - '60'
  - --enforce-eager
  - --trust-remote-code
  - --gpu-memory-utilization
  - '0.90'
  - --block-size
  - '768'
  - --kv-cache-dtype
  - int8
  - --attention_config.indexer_kv_dtype
  - int8
  - --mm-encoder-tp-mode
  - data
  - --no-mm-device-do-normalize
  - --mm-processor-cache-gb
  - '1'
  - --skip-mm-profiling
  - --enable-prefix-caching
  - --additional-config
  - '{"enable_flashcomm1":false,"multistream_overlap_shared_expert":false,"enable_fused_mc2":0,"enable_shared_expert_dp":false}'
  - --limit-mm-per-prompt
  - '{"vision_chunk":2}'
  - --kv-transfer-config
  - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":30000,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":1},"decode":{"dp_size":1,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":16}}}'
- node_index: 1
  envs: *id002
  server_cmd_template:
  - --host
  - 0.0.0.0
  - --port
  - ${PORT}
  - --quantization
  - ascend
  - --enable-auto-tool-choice
  - --reasoning-parser
  - kimi_k3
  - --tool-call-parser
  - kimi_k3
  - --tokenizer-mode
  - kimi_k3
  - --data-parallel-size
  - ${DP_SIZE}
  - --distributed-executor-backend
  - mp
  - --tensor-parallel-size
  - ${TP_SIZE}
  - --pipeline-parallel-size
  - '1'
  - --prefill-context-parallel-size
  - '1'
  - --decode-context-parallel-size
  - '16'
  - --cp-kv-cache-interleave-size
  - '768'
  - --block-size
  - '768'
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --max-model-len
  - '147456'
  - --max-num-batched-tokens
  - '8192'
  - --max-num-seqs
  - '60'
  - --trust-remote-code
  - --gpu-memory-utilization
  - '0.80'
  - --kv-cache-dtype
  - int8
  - --attention_config.indexer_kv_dtype
  - int8
  - --mm-encoder-tp-mode
  - data
  - --no-mm-device-do-normalize
  - --mm-processor-cache-gb
  - '1'
  - --skip-mm-profiling
  - --compilation-config
  - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
  - --enable-prefix-caching
  - --additional-config
  - '{"enable_fused_mc2":0,"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":false,"enable_mlapo":true,"scheduler_config":{"recompute_scheduler_enable":true}}'
  - --limit-mm-per-prompt
  - '{"vision_chunk":2}'
  - --kv-transfer-config
  - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":30100,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":1},"decode":{"dp_size":1,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":16}}}'
benchmarks:
  acc_gsm8k: &gsm8k_accuracy
    case_type: accuracy
    dataset_path: /root/.cache/modelscope/hub/datasets/Ares8364/gsm8k
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 4096
    batch_size: 60
    thinking: true
    temperature: 0
    top_p: 0.95
    baseline: 60
    threshold: 10
    num_prompts: 300
  acc_gsm8k_r02: *gsm8k_accuracy
  acc_gsm8k_r03: *gsm8k_accuracy
