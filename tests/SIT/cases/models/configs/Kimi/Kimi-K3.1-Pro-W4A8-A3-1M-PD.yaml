test_name: "Kimi-K3.1-Pro-W4A8-A3-1M-PD"
model: "Eco-Tech/Kimi-K3.1-Pro-w4a8"
num_nodes: 8
npu_per_node: 16

dp_load_balancing: external

routing:
  type: disaggregated_prefill
  groups:
    prefiller: [ 0, 1, 2, 3 ]
    decoder: [ 4, 5, 6, 7 ]

config:
  - &prefill_node
    node_index: 0
    port_start: 8080
    dp_rpc_port: 13389
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 4
    cp_size: 4
    dp_address: "${NODE_0_IP}"
    pp_size: 4
    pp_layer_partition: "25,25,24,19"
    nnodes: 4
    node_rank: 0
    master_addr: "${NODE_0_IP}"
    master_port: 41000
    distributed_executor_backend: mp
    is_headless: false

  - <<: *prefill_node
    node_index: 1
    node_rank: 1
    is_headless: true

  - <<: *prefill_node
    node_index: 2
    node_rank: 2
    is_headless: true

  - <<: *prefill_node
    node_index: 3
    node_rank: 3
    is_headless: true

  - &decode_node
    node_index: 4
    port_start: 8080
    dp_rpc_port: 13390
    dp_size: 4
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: "${NODE_4_IP}"

  - <<: *decode_node
    node_index: 5
    dp_rank_start: 1

  - <<: *decode_node
    node_index: 6
    dp_rank_start: 2

  - <<: *decode_node
    node_index: 7
    dp_rank_start: 3

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  VLLM_HOST_IP: "${LOCAL_IP}"
  HCCL_BUFFSIZE: "1024"
  HCCL_CONNECT_TIMEOUT: "1200"
  HCCL_NPU_SOCKET_PORT_RANGE: auto
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH"
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OMP_PROC_BIND: "false"
  FLA_STABLE_DEBUG_DESC: "0"
  TORCH_EXTENSIONS_DIR: "/tmp/kimi_k31_torch_extensions/node-${NODE_INDEX}/dp-${DP_RANK}"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_IF_BASE_PORT: "51000"
  HCCL_HOST_SOCKET_PORT_RANGE: "51000-51063"
  VLLM_PP_LAYER_PARTITION: "25,25,24,19"

env_decode: &env_decode
  <<: *env_common
  HCCL_IF_BASE_PORT: "50000"
  HCCL_HOST_SOCKET_PORT_RANGE: "50000-50063"
  HCCL_OP_EXPANSION_MODE: AIV

templates:
  - node_index: 0
    envs: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--quantization"
      - "ascend"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "kimi_k3"
      - "--tool-call-parser"
      - "kimi_k3"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--data-parallel-size"
      - "1"
      - "--pipeline-parallel-size"
      - "4"
      - "--prefill-context-parallel-size"
      - "4"
      - "--decode-context-parallel-size"
      - "1"
      - "--nnodes"
      - "4"
      - "--node-rank"
      - "${NODE_RANK}"
      - "--distributed-executor-backend"
      - "mp"
      - "--data-parallel-backend"
      - "mp"
      - "--master-addr"
      - "${MASTER_ADDR}"
      - "--master-port"
      - "${MASTER_PORT}"
      - "--tensor-parallel-size"
      - "4"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "12"
      - "--enforce-eager"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--block-size"
      - "768"
      - "--kv-cache-dtype"
      - "int8"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--no-mm-device-do-normalize"
      - "--mm-processor-cache-gb"
      - "1"
      - "--skip-mm-profiling"
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"enable_flashcomm1":false,"multistream_overlap_shared_expert":false,"enable_fused_mc2":0,"enable_shared_expert_dp":false}'
      - "--limit-mm-per-prompt"
      - '{"vision_chunk":2}'
      - "--kv-transfer-config"
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":30000,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":4,"pp_size":4,"pcp_size":4,"dcp_size":1},"decode":{"dp_size":4,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":16}}}'

  - &prefill_worker
    node_index: 1
    envs: *env_prefill
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--quantization"
      - "ascend"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "kimi_k3"
      - "--tool-call-parser"
      - "kimi_k3"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--data-parallel-size"
      - "1"
      - "--pipeline-parallel-size"
      - "4"
      - "--prefill-context-parallel-size"
      - "4"
      - "--decode-context-parallel-size"
      - "1"
      - "--nnodes"
      - "4"
      - "--node-rank"
      - "${NODE_RANK}"
      - "--headless"
      - "--distributed-executor-backend"
      - "mp"
      - "--data-parallel-backend"
      - "mp"
      - "--master-addr"
      - "${MASTER_ADDR}"
      - "--master-port"
      - "${MASTER_PORT}"
      - "--tensor-parallel-size"
      - "4"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "12"
      - "--enforce-eager"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--block-size"
      - "768"
      - "--kv-cache-dtype"
      - "int8"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--no-mm-device-do-normalize"
      - "--mm-processor-cache-gb"
      - "1"
      - "--skip-mm-profiling"
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"enable_flashcomm1":false,"multistream_overlap_shared_expert":false,"enable_fused_mc2":0,"enable_shared_expert_dp":false}'
      - "--limit-mm-per-prompt"
      - '{"vision_chunk":2}'
      - "--kv-transfer-config"
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_producer","kv_port":30000,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":4,"pp_size":4,"pcp_size":4,"dcp_size":1},"decode":{"dp_size":4,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":16}}}'

  - <<: *prefill_worker
    node_index: 2

  - <<: *prefill_worker
    node_index: 3

  - &decode_template
    node_index: 4
    envs: *env_decode
    server_cmd_template:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${PORT}"
      - "--quantization"
      - "ascend"
      - "--enable-auto-tool-choice"
      - "--reasoning-parser"
      - "kimi_k3"
      - "--tool-call-parser"
      - "kimi_k3"
      - "--tokenizer-mode"
      - "kimi_k3"
      - "--data-parallel-size"
      - "${DP_SIZE}"
      - "--data-parallel-size-local"
      - "1"
      - "--data-parallel-rank"
      - "${DP_RANK}"
      - "--data-parallel-address"
      - "${DP_ADDRESS}"
      - "--data-parallel-rpc-port"
      - "${DP_RPC_PORT}"
      - "--distributed-executor-backend"
      - "mp"
      - "--tensor-parallel-size"
      - "${TP_SIZE}"
      - "--pipeline-parallel-size"
      - "1"
      - "--prefill-context-parallel-size"
      - "1"
      - "--decode-context-parallel-size"
      - "16"
      - "--cp-kv-cache-interleave-size"
      - "768"
      - "--block-size"
      - "768"
      - "--enable-expert-parallel"
      - "--seed"
      - "1024"
      - "--max-model-len"
      - "1048576"
      - "--max-num-batched-tokens"
      - "8192"
      - "--max-num-seqs"
      - "12"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--kv-cache-dtype"
      - "int8"
      - "--attention_config.indexer_kv_dtype"
      - "int8"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--no-mm-device-do-normalize"
      - "--mm-processor-cache-gb"
      - "1"
      - "--skip-mm-profiling"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--enable-prefix-caching"
      - "--additional-config"
      - '{"enable_fused_mc2":0,"multistream_overlap_shared_expert":true,"enable_shared_expert_dp":false,"enable_mlapo":true,"scheduler_config":{"recompute_scheduler_enable":true}}'
      - "--limit-mm-per-prompt"
      - '{"vision_chunk":2}'
      - "--kv-transfer-config"
      - '{"kv_connector":"MooncakeConnectorV2","kv_role":"kv_consumer","kv_port":30100,"kv_connector_extra_config":{"prefill":{"dp_size":1,"tp_size":4,"pp_size":4,"pcp_size":4,"dcp_size":1},"decode":{"dp_size":4,"tp_size":16,"pp_size":1,"pcp_size":1,"dcp_size":16}}}'

  - <<: *decode_template
    node_index: 5

  - <<: *decode_template
    node_index: 6

  - <<: *decode_template
    node_index: 7

benchmarks:
  # https://github.com/vllm-project/vllm-ascend/actions/runs/43008094175/job/130483618860
  acc_gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 81920
    batch_size: 64
    thinking: true
    temperature: 1.0
    top_p: 0.95
    baseline: 92.42
    threshold: 1
  perf_128k_warnup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs1000_kimi
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 1
    max_out_len: 1
    batch_size: 32
    request_rate: 0
    baseline: 0
    threshold: 0.95
  perf_128k:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs1000_kimi
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 128
    max_out_len: 1024
    batch_size: 32
    request_rate: 0
    baseline: 371.0334
    threshold: 0.95
