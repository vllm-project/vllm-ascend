# Flash Next basic PD topology from the model guide, section 5.2.
test_cases:
  - name: Qwen3.8-Flash-Next-w4a8-PD-Decode-A3
    model: &model Eco-Tech/Qwen3.8-Flash-Next-w4a8
    service_mode: pd
    special_dependencies:
      fastokens: "0.3.5"
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "2400"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
    pd_server_envs:
      - HCCL_NPU_SOCKET_PORT_RANGE: "61400-61499"
        VLLM_USE_FASTOKENS: "1"
        HCCL_BUFFSIZE: "8192"
      - HCCL_NPU_SOCKET_PORT_RANGE: "61500-61599"
        HCCL_BUFFSIZE: "512"
    pd_server_cmds:
      # Prefill
      - - *model
        - --host
        - "0.0.0.0"
        - --port
        - $PREFILL_PORT
        - --served-model-name
        - *model
        - --trust-remote-code
        - --quantization
        - ascend
        - --tensor-parallel-size
        - "2"
        - --pipeline-parallel-size
        - "4"
        - --data-parallel-size
        - "1"
        - --max-model-len
        - "143360"
        - --max-num-seqs
        - "32"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --enable-prefix-caching
        - --async-scheduling
        - --enable-expert-parallel
        - --mamba-cache-mode
        - align
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --engram-config
        - '{"cpu_offload":true,"dp_shared_memory":false}'
        - --enforce-eager
        - --additional-config
        - >-
          {"enable_shared_expert_dp": true,
           "enable_flashcomm1": true,
           "enable_prefill_mc2": true,
           "enable_fused_mc2": 0,
           "enable_cpu_binding": true,
           "multistream_overlap_shared_expert": true,
           "ascend_compilation_config": {"fuse_norm_quant":false,"enable_static_kernel":false,"enable_super_kernel":false}}
        - --speculative-config
        - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
        - --kv-transfer-config
        - >-
          {"kv_connector": "MooncakeConnectorV2",
           "kv_role": "kv_producer",
           "kv_port": 32600,
           "kv_connector_extra_config": {"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
      # Decode (local prefix caching disabled; reuse happens on P)
      - - *model
        - --host
        - "0.0.0.0"
        - --port
        - $DECODE_PORT
        - --served-model-name
        - *model
        - --trust-remote-code
        - --enable-force-include-usage
        - --quantization
        - ascend
        - --tensor-parallel-size
        - "2"
        - --data-parallel-size
        - "4"
        - --max-model-len
        - "143360"
        - --max-num-seqs
        - "32"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --no-enable-prefix-caching
        - --async-scheduling
        - --enable-expert-parallel
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --engram-config
        - '{"cpu_offload":true,"dp_shared_memory":true}'
        - --compilation-config
        - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,12,16,32,40,44,48,64,96,128]}'
        - --additional-config
        - >-
          {"enable_flashcomm1": true,
           "enable_cpu_binding": true,
           "enable_shared_expert_dp": true,
           "multistream_overlap_shared_expert": true,
           "scheduler_config": {"recompute_scheduler_enable":true},
           "ascend_compilation_config": {"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":false,"enable_super_kernel":false}}
        - --speculative-config
        - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
        - --kv-transfer-config
        - >-
          {"kv_connector": "MooncakeConnectorV2",
           "kv_role": "kv_consumer",
           "kv_port": 32700,
           "kv_connector_extra_config": {"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
    test_content: []
    # Measured references: https://github.com/zsponly/vllm-ascend/pull/4
    # Evidence revision: c48249d30613a5fc1b2ef448a537086e316c030b. Throughputs are aggregate tokens/s.
    # Reference: A3 r136 / CANN 9.3.0, custom Union GBSA ops and PR overlays.
    # Static kernel and SuperKernel are disabled for the nightly startup budget.
    # Reported D throughput/TPOT use steady-stage samples; the runner checks total.
    # Calibrate total output throughput with static kernel disabled on CI.
    # Enable the Qwen3.x 0.97 gate only with that matching full-run baseline.
    benchmarks:
      prepare_decode_prompts:
        case_type: curl_cmd
        cmds:
          - |
            python - <<'PY'
            from pathlib import Path
            from ais_bench.benchmark.datasets.utils.datasets import get_data_path
            from tools.aisbench import maybe_download_from_modelscope

            for source, name, count in (
                ("vllm-ascend/GSM8K-in131072-bs100-qwen3", "128k", 512),
                ("vllm-ascend/GSM8K_prefix0_in16384_bs200_qwen", "16k", 440),
            ):
                src = Path(maybe_download_from_modelscope(source, repo_type="dataset"))
                with (src / "test.jsonl").open("rb") as data:
                    prompt = next(data).rstrip(b"\r\n") + b"\n"
                out = Path(get_data_path(".")) / "qwen38_a3_decode" / name
                out.mkdir(parents=True, exist_ok=True)
                (out / "train.jsonl").write_bytes(b"")
                # Warm and measure the same native Qwen prompt (100% shared input).
                (out / "test.jsonl").write_bytes(prompt * count)
            PY
      warmup_d_128k: &warmup_d_128k
        case_type: performance
        dataset_path_local: qwen38_a3_decode/128k
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        batch_size: 16
        max_out_len: 1
        request_rate: 0
      pure_d_128k:
        <<: *warmup_d_128k
        num_prompts: 512
        batch_size: 128
        max_out_len: 1024
        # Steady-stage reference (384 requests): output 3687.79 tokens/s; TPOT 18.6 ms.
        # Full-run reference: 3276.9468 tokens/s, but mean output was 1019.4141.
        # Recalibrate with 1024 output tokens before enabling the total gate.
        # TODO: set baseline from static-kernel-off CI output throughput (total).
        # threshold: 0.97
      warmup_d_16k: &warmup_d_16k
        case_type: performance
        dataset_path_local: qwen38_a3_decode/16k
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        batch_size: 16
        max_out_len: 1
        request_rate: 0
      pure_d_16k:
        <<: *warmup_d_16k
        num_prompts: 440
        batch_size: 110
        max_out_len: 1024
        # Steady-stage reference: output 6461.38 tokens/s; TPOT 19.5 ms.
        # TODO: set baseline from static-kernel-off CI output throughput (total).
        # threshold: 0.97
