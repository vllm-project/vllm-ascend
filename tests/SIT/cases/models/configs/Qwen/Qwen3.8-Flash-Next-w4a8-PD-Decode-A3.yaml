# Flash Next basic PD topology from the model guide, section 5.2.
test_cases:
  - name: Qwen3.8-Flash-Next-w4a8-PD-Decode-A3
    model: &model Eco-Tech/Qwen3.8-Flash-Next-w4a8
    service_mode: pd
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "4800"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
    pd_server_envs:
      - HCCL_NPU_SOCKET_PORT_RANGE: "61400-61499"
        HCCL_BUFFSIZE: "8192"
      - HCCL_NPU_SOCKET_PORT_RANGE: "61500-61599"
        HCCL_BUFFSIZE: "512"
    pd_server_cmds:
      # Prefill
      - - *model
        - --host
        - "0.0.0.0"
        - --port
        - $PREFILL_PORT
        - --served-model-name
        - *model
        - --trust-remote-code
        - --quantization
        - ascend
        - --tensor-parallel-size
        - "2"
        - --pipeline-parallel-size
        - "4"
        - --data-parallel-size
        - "1"
        - --max-model-len
        - "262144"
        - --max-num-seqs
        - "32"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --enable-prefix-caching
        - --async-scheduling
        - --enable-expert-parallel
        - --mamba-cache-mode
        - align
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --engram-config
        - '{"cpu_offload":true,"dp_shared_memory":false}'
        - --enforce-eager
        - --additional-config
        - >-
          {"enable_shared_expert_dp": true,
           "enable_flashcomm1": true,
           "enable_prefill_mc2": true,
           "enable_fused_mc2": 0,
           "enable_cpu_binding": true,
           "multistream_overlap_shared_expert": true,
           "ascend_compilation_config": {"fuse_norm_quant":false}}
        - --speculative-config
        - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
        - --kv-transfer-config
        - >-
          {"kv_connector": "MooncakeConnectorV2",
           "kv_role": "kv_producer",
           "kv_port": 32600,
           "kv_connector_extra_config": {"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
      # Decode
      - - *model
        - --host
        - "0.0.0.0"
        - --port
        - $DECODE_PORT
        - --served-model-name
        - *model
        - --trust-remote-code
        - --enable-force-include-usage
        - --quantization
        - ascend
        - --tensor-parallel-size
        - "2"
        - --data-parallel-size
        - "4"
        - --max-model-len
        - "262144"
        - --max-num-seqs
        - "32"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --enable-prefix-caching
        - --async-scheduling
        - --enable-expert-parallel
        - --mamba-cache-mode
        - align
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --engram-config
        - '{"cpu_offload":true,"dp_shared_memory":true}'
        - --compilation-config
        - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
        - --additional-config
        - >-
          {"enable_flashcomm1": true,
           "enable_cpu_binding": true,
           "enable_shared_expert_dp": true,
           "multistream_overlap_shared_expert": true,
           "scheduler_config": {"recompute_scheduler_enable":true},
           "ascend_compilation_config": {"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}
        - --speculative-config
        - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
        - --kv-transfer-config
        - >-
          {"kv_connector": "MooncakeConnectorV2",
           "kv_role": "kv_consumer",
           "kv_port": 32700,
           "kv_connector_extra_config": {"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
    test_content: []
    benchmarks:
      # Repeat one native Qwen prompt per length to construct a 100% shared prefix.
      prepare_prefix100:
        case_type: curl_cmd
        cmds:
          - |
            python - <<'PY'
            from pathlib import Path
            from ais_bench.benchmark.datasets.utils.datasets import get_data_path
            from tools.aisbench import maybe_download_from_modelscope

            for source, name, count in (
                ("vllm-ascend/GSM8K_prefix0_in16384_bs200_qwen", "16k", 128),
                ("vllm-ascend/GSM8K-in131072-bs100-qwen3", "128k", 8),
            ):
                src = Path(maybe_download_from_modelscope(source, repo_type="dataset"))
                with (src / "test.jsonl").open("rb") as data:
                    prompt = next(data).rstrip(b"\r\n") + b"\n"
                out = Path(get_data_path(".")) / "qwen38_prefix100_a3" / name
                out.mkdir(parents=True, exist_ok=True)
                (out / "train.jsonl").write_bytes(b"")
                (out / "test.jsonl").write_bytes(prompt * count)
            PY
      warmup_d_16k: &warmup_16k
        case_type: performance
        dataset_path_local: qwen38_prefix100_a3/16k
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 32
        batch_size: 32
        max_out_len: 1
        request_rate: 0
      pure_d_16k:
        <<: *warmup_16k
        num_prompts: 128
        max_out_len: 1024
      warmup_d_128k: &warmup_128k
        case_type: performance
        dataset_path_local: qwen38_prefix100_a3/128k
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 2
        batch_size: 2
        max_out_len: 1
        request_rate: 0
      pure_d_128k:
        <<: *warmup_128k
        num_prompts: 8
        max_out_len: 1024
