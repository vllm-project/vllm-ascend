# TEMPORARY local smoke config: spec-decode acceptance window on the internal
# DP harness, single machine (num_nodes: 1, DP=2 local ranks).
# - Replace the placeholder cluster_hosts IP with this host's NIC IP.
# - First run uses a zeroed baseline; read the measured per-position rates from
#   the log, then re-run with a tightened baseline for the negative path.
# - DELETE this file after verification; do not include it in any PR.
test_name: "int-dp-smoke-qwen38"
model: "Eco-Tech/Qwen3.8-27B-w8a8"
num_nodes: 1
npu_per_node: 4  # TP2 x DP2; on a 2-card machine use npu_per_node: 2 and tp 1
dp_load_balancing: internal
cluster_hosts:
  - "192.168.1.100"  # TODO: replace with this host's NIC IP (not 127.0.0.1)
test_content:
  - spec_decode_acceptance
acceptance_rate:
  benchmark: acc_gsm8k
  # Smoke baseline zeroed to pass; replace with measured [r0, r1, r2].
  baseline: [0.0, 0.0, 0.0]
  tolerance: 0.05
env_common: &env_common
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "1024"
  VLLM_USE_MODELSCOPE: "true"
  VLLM_ENGINE_READY_TIMEOUT_S: "3000"
  VLLM_RPC_TIMEOUT: "600"
  SERVER_PORT: "8080"
deployment:
  - envs:
      <<: *env_common
    server_cmd: >
      vllm serve Eco-Tech/Qwen3.8-27B-w8a8
      --host 0.0.0.0
      --port $SERVER_PORT
      --data-parallel-size 2
      --data-parallel-size-local 2
      --data-parallel-address $LOCAL_IP
      --data-parallel-rpc-port 13389
      --tensor-parallel-size 2
      --max-model-len 8192
      --max-num-batched-tokens 4096
      --max-num-seqs 16
      --gpu-memory-utilization 0.9
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}'
      --trust-remote-code
      --async-scheduling
      --quantization ascend
benchmarks:
  acc_gsm8k:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 2048
    batch_size: 16
    temperature: 0
    baseline: 80
    threshold: 20
