# ==========================================
# ACTUAL TEST CASES
# ==========================================
_envs: &envs
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  OMP_NUM_THREADS: "1"
  TASK_QUEUE_ENABLE: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  SERVER_PORT: "DEFAULT_PORT"
test_cases:
  - name: "Qwen3.8-27B-w8a8-in128k"
    model: "Eco-Tech/Qwen3.8-27B-w8a8"
    envs:
      <<: *envs
    server_cmd:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "$SERVER_PORT"
      - "--data-parallel-size"
      - "1"
      - "--tensor-parallel-size"
      - "2"
      - "--max-model-len"
      - "131072"
      - "--max-num-batched-tokens"
      - "16384"
      - "--max-num-seqs"
      - "500"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--speculative_config"
      - '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}'
      - "--compilation-config"
      - '{"cudagraph_capture_sizes":[1,4,8,10,12,16,24,28,32,48,56,64,66,80,84,88,96,112,128,144,160,172,196,200,212,232,256], "cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--trust-remote-code"
      - "--quantization"
      - "ascend"
      - "--async-scheduling"
      - "--allowed-local-media-path"
      - "/"
      - "--dtype"
      - "bfloat16"
      - "--reasoning-parser"
      - "qwen3"
      - "--mm-processor-cache-gb"
      - "0"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--mm-processor-cache-type"
      - "shm"
      - "--additional-config"
      - '{"enable_cpu_binding":true}'

    benchmarks:
      perf_warmup:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs100_qwen
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 3
        max_out_len: 1024
        batch_size: 3
        request_rate: 0
        baseline: 0
        threshold: 0.97
      perf:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K_prefix90_in131072_bs100_qwen
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 12
        max_out_len: 1024
        batch_size: 3
        request_rate: 0
        baseline: 107.93
        threshold: 0.97
      acc_GPQA:
        case_type: accuracy
        dataset_path: vllm-ascend/gpqa
        request_conf: vllm_api_general_chat
        dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
        max_out_len: 32768
        batch_size: 32
        baseline: 85.1
        threshold: 5
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0