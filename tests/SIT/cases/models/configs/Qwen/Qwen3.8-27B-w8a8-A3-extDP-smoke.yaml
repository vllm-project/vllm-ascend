# TEMPORARY local smoke config: spec-decode acceptance window on the external
# DP harness, single machine emulating two nodes (node 0 = prefiller + proxy,
# node 1 = decoder). Two pytest terminals are required, one per LWS_WORKER_INDEX.
# - Replace the placeholder cluster_hosts IPs with this host's NIC IP (both
#   entries are the same address).
# - ASCEND_RT_VISIBLE_DEVICES is pinned per template on purpose: automatic
#   per-node device numbering starts at 0 on every node, so the decoder must
#   be pinned to different cards instead of using ${VISIBLE_DEVICES}.
# - The prefiller sets num_speculative_tokens: 1 while the decoder sets 3:
#   the reported position count must be 3 (decode side). If it reports 1, the
#   harness picked the wrong command.
# - First run uses a zeroed baseline; read the measured per-position rates from
#   the node-0 log, then re-run with a tightened baseline for the negative path.
# - DELETE this file after verification; do not include it in any PR.
test_name: "ext-dp-smoke-qwen38"
model: "Eco-Tech/Qwen3.8-27B-w8a8"
num_nodes: 2
npu_per_node: 2  # TP2 per node (4 cards total); on a 2-card machine use tp 1
dp_load_balancing: external
cluster_hosts:
  - "192.168.1.100"  # TODO: replace with this host's NIC IP
  - "192.168.1.100"  # TODO: same host, second node entry
test_content:
  - spec_decode_acceptance
acceptance_rate:
  benchmark: acc_gsm8k
  # Smoke baseline zeroed to pass; replace with measured [r0, r1, r2].
  baseline: [0.0, 0.0, 0.0]
  tolerance: 0.05
routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0 ]
    decoder: [ 1 ]
config:
  - node_index: 0
    port_start: 7100  # prefiller API port
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_0_IP}"
  - node_index: 1
    port_start: 7200  # decoder API port (metrics source for acceptance)
    dp_rpc_port: 12322
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_1_IP}"
env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  VLLM_ENGINE_READY_TIMEOUT_S: "3000"
  VLLM_RPC_TIMEOUT: "3600000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  OMP_PROC_BIND: "false"
  OMP_NUM_THREADS: "1"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  TASK_QUEUE_ENABLE: "1"
  HCCL_OP_EXPANSION_MODE: "AIV"
  SERVER_PORT: "${PORT}"
templates:
  - node_index: 0
    envs:
      <<: *env_common
      ASCEND_RT_VISIBLE_DEVICES: "0,1"  # pinned: prefiller cards
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --seed
      - "1024"
      - --max-model-len
      - "8192"
      - --max-num-batched-tokens
      - "4096"
      - --max-num-seqs
      - "16"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --enforce-eager
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method": "qwen3_5_mtp"}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_producer", "kv_port": "30100", "engine_id": "1", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "tp_size": 2}, "decode": {"dp_size": 1, "tp_size": 2}}}'
  - node_index: 1
    envs:
      <<: *env_common
      ASCEND_RT_VISIBLE_DEVICES: "2,3"  # pinned: decoder cards (avoid overlap with node 0)
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - $SERVER_PORT
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --seed
      - "1024"
      - --max-model-len
      - "8192"
      - --max-num-batched-tokens
      - "512"
      - --max-num-seqs
      - "16"
      - --trust-remote-code
      - --async-scheduling
      - --gpu-memory-utilization
      - "0.9"
      - --quantization
      - "ascend"
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - --speculative-config
      - '{"num_speculative_tokens": 3, "method": "qwen3_5_mtp"}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_consumer", "kv_port": "30800", "engine_id": "2", "kv_connector_extra_config": {"prefill": {"dp_size": 1, "tp_size": 2}, "decode": {"dp_size": 1, "tp_size": 2}}}'
benchmarks:
  acc_gsm8k:
    case_type: accuracy
    dataset_path: vllm-ascend/gsm8k
    request_conf: vllm_api_general_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
    max_out_len: 2048
    batch_size: 16
    temperature: 0
    baseline: 80
    threshold: 20
