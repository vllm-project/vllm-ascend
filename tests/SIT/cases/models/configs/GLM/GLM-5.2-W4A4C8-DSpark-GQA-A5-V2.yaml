test_cases:
  - name: "GLM-5.2-W4A4C8-DSpark-GQA-A5-V2"
    model: "Eco-Tech/GLM-5.2-w4a4c8-mxfp4"
    envs:
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      ASCEND_GLOBAL_LOG_LEVEL: "3"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "1"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "100"
      HCCL_DFS_CONFIG: "task_exception:off,inconsistent_check:off"
      HCCL_BUFFSIZE: "400"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_INTRA_PCIE_ENABLE: "1"
      HCCL_INTRA_ROCE_ENABLE: "0"
      HCCL_ASYNC_ERROR_HANDLING: "0"
      ASCEND_LAUNCH_BLOCKING: "0"
      VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--distributed-executor-backend"
      - "mp"
      - "--data-parallel-size"
      - "1"
      - "--data-parallel-size-local"
      - "1"
      - "--tensor-parallel-size"
      - "8"
      - "--seed"
      - "1024"
      - "--enable-expert-parallel"
      - "--max-num-seqs"
      - "128"
      - "--max-model-len"
      - "202752"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--no-enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--quantization"
      - "ascend"
      - "--async-scheduling"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm47"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"num_speculative_tokens":5,"method":"dspark","model":"/root/.cache/modelscope/hub/models/Eco-Tech/GLM-5.2-DSpark-NPU-0805","enforce_eager":true,"kv_cache_dtype":"auto"}'
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config"
      - '{"indexer_kv_dtype":"fp8"}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"enable_flashcomm1":true}'
    benchmarks:
      acc_gsm8k:
        case_type: accuracy
        dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gsm8k
        request_conf: vllm_api_general_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
        max_out_len: 10240
        batch_size: 32
        temperature: 0
        baseline: 95
        threshold: 5
    test_content:
      - spec_decode_acceptance
    acceptance_rate:
      # Per-position acceptance baselines for five speculative tokens.
      baseline: [0.9058, 0.8123, 0.7317, 0.6623, 0.6040]
      tolerance: 0.08
