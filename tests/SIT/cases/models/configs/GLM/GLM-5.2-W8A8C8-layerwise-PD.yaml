benchmarks:
  acc_aime2025:
    # https://github.com/vllm-project/vllm-ascend/actions/runs/41621987657/job/125872039948
    case_type: accuracy
    dataset_path: vllm-ascend/aime2025
    request_conf: vllm_api_general_chat
    dataset_conf: aime2025/aime2025_gen_0_shot_chat_prompt
    max_out_len: 81920
    batch_size: 32
    baseline: 90
    threshold: 10
    temperature: 1.0
    top_p: 0.95
