      - --quantization
      - ascend
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm47
      - --enforce-eager
      - --kv-cache-dtype
      - int8
      - --attention_config.indexer_kv_dtype
      - int8
      - --additional-config
      - '{"enable_flashcomm1":true,"enable_shared_expert_dp":true}'
      - --speculative-config
      - '{"num_speculative_tokens": 1,  "method":"deepseek_mtp","enforce_eager":true}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeLayerwiseConnector","kv_role":"kv_producer","engine_id":"1","kv_port":"30000","kv_connector_extra_config":{"use_ascend_direct":true,"prefill":{"dp_size":2,"tp_size":16},"decode":{"dp_size":16,"tp_size":2}}}'
  - node_index: 2
