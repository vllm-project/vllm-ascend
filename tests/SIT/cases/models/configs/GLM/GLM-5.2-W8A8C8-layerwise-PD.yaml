test_name: GLM-5.2-W8A8C8-layerwise-PD
model: Eco-Tech/GLM-5.2-w8a8c8
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external
routing:
  type: disaggregated_prefill
  groups:
    prefiller: [ 0, 1 ]
    decoder: [ 2, 3 ]
  proxy_script: examples/disaggregated_prefill_v1/load_balance_proxy_layerwise_server_example.py
config:
  - node_index: 0
    port_start: 8000
    dp_rpc_port: 16600
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    dp_address: ${NODE_0_IP}
    pp_size: 1
  - node_index: 1
    port_start: 8000
    dp_rpc_port: 16600
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 1
    tp_size: 16
    dp_address: ${NODE_0_IP}
    pp_size: 1
  - node_index: 2
    port_start: 8000
    dp_rpc_port: 16600
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: ${NODE_2_IP}
  - node_index: 3
    port_start: 8000
    dp_rpc_port: 16600
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 8
    tp_size: 2
    dp_address: ${NODE_2_IP}
env_common: &env_common
  VLLM_USE_MODELSCOPE: 'true'
  VLLM_HOST_IP: ${LOCAL_IP}
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
  HCCL_EXEC_TIMEOUT: '1800'
  HCCL_CONNECT_TIMEOUT: '1800'
  ASCEND_TRANSFER_TIMEOUT: '10000'
  LD_LIBRARY_PATH: $PYTHON_LIB_DIR:/usr/local/lib:$LD_LIBRARY_PATH
  HCCL_BUFFSIZE: '1024'
  HCCL_OP_EXPANSION_MODE: AIV
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  TASK_QUEUE_ENABLE: '1'
  VLLM_USE_V2_MODEL_RUNNER: '0'
  ASCEND_RT_VISIBLE_DEVICES: ${VISIBLE_DEVICES}
  ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["hccs:device"]}'
  ASCEND_LOCAL_COMM_RES: '{"version":"1.2"}'

env_prefill: &env_prefill
  <<: *env_common
  VLLM_USE_FASTOKENS: '1'

env_decode: &env_decode
  <<: *env_common
  OMP_PROC_BIND: 'false'
  OMP_NUM_THREADS: '10'
  LOCAL_WORLD_SIZE: '16'

templates:
  - node_index: 0
    envs: *env_prefill
    server_cmd_template:
      - --host
      - 0.0.0.0
      - --port
      - ${PORT}
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - '16'
      - --enable-expert-parallel
      - --distributed-executor-backend
      - mp
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --seed
      - '1024'
      - --max-model-len
      - '200000'
      - --max-num-batched-tokens
      - '16384'
      - --trust-remote-code
      - --max-num-seqs
      - '64'
      - --gpu-memory-utilization
      - '0.92'
      - --async-scheduling
      - --quantization
      - ascend
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm47
      - --enforce-eager
      - --kv-cache-dtype
      - int8
      - --attention_config.indexer_kv_dtype
      - int8
      - --additional-config
      - '{"enable_flashcomm1":true,"enable_shared_expert_dp":true}'
      - --speculative-config
      - '{"num_speculative_tokens": 1,  "method":"deepseek_mtp","enforce_eager":true}'
      - --kv-transfer-config
      - '{"kv_connector":"MooncakeLayerwiseConnector","kv_role":"kv_producer","engine_id":"0","kv_port":"30000","kv_connector_extra_config":{"use_ascend_direct":true,"prefill":{"dp_size":2,"tp_size":16},"decode":{"dp_size":16,"tp_size":2}}}'
  - node_index: 1
    envs: *env_prefill
    server_cmd_template:
      - --host
      - 0.0.0.0
      - --port
      - ${PORT}
      - --data-parallel-size
