      # Headless PP workers must not receive --api-server-count.
      - --headless

# P/PD/decode performance and GPQA share this service lifecycle.
# Performance gates check throughput; TPOT remains a reported metric.
# Throughput baselines use two local r138 runs on 2026-11-22.
benchmarks:
  prefill_perf_16k_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs500_GLM5_3_w8a8c8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 14
    max_out_len: 1
    batch_size: 7
    request_rate: 0
  reset_before_prefill_perf_16k:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json; from urllib.request import Request, urlopen;
      from tests.e2e.common.multi_node.utils import get_cluster_ips;
      host = get_cluster_ips(4)[2];
      response = urlopen(Request('http://' + host + ':7100/reset_prefix_cache', method='POST'), timeout=120);
      assert json.load(response).get('success') is True, 'prefix cache reset failed'"
  prefill_perf_16k:
    case_type: performance
    # Minimum of two local r138 runs on 2026-11-22, with a service restart.
    input_throughput_baseline: 35956.1058
    input_throughput_threshold: 0.95
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs500_GLM5_3_w8a8c8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 28
    max_out_len: 1
    batch_size: 7
    request_rate: 0
  pd_perf_16k_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs500_GLM5_3_w8a8c8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 80
    max_out_len: 1024
    batch_size: 40
    request_rate: 1.8
  reset_before_pd_perf_16k:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json; from urllib.request import Request, urlopen;
      from tests.e2e.common.multi_node.utils import get_cluster_ips;
      host = get_cluster_ips(4)[2];
      response = urlopen(Request('http://' + host + ':7100/reset_prefix_cache', method='POST'), timeout=120);
      assert json.load(response).get('success') is True, 'prefix cache reset failed'"
  pd_perf_16k:
    case_type: performance
    # Minimum of two local r138 runs on 2026-11-22, with a service restart.
    baseline: 1538.8764
    threshold: 0.95
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs500_GLM5_3_w8a8c8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 160
    max_out_len: 1024
    batch_size: 40
    request_rate: 1.8
  # Reset once before decode warmup, with no reset before formal measurement.
  reset_before_decode_perf_16k_20ms:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json; from urllib.request import Request, urlopen;
      from tests.e2e.common.multi_node.utils import get_cluster_ips;
      host = get_cluster_ips(4)[2];
      response = urlopen(Request('http://' + host + ':7100/reset_prefix_cache', method='POST'), timeout=120);
      assert json.load(response).get('success') is True, 'prefix cache reset failed'"
  decode_perf_16k_20ms_warmup:
    case_type: performance
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 64
    max_out_len: 1024
    batch_size: 32
    request_rate: 0
    dataset_path: vllm-ascend/GSM8K_prefix100_in16384_bs500_GLM5_3_flash_w8a8
  decode_perf_16k_20ms:
    case_type: performance
    # Minimum of two local r138 runs on 2026-11-22, with a service restart.
    baseline: 3241.2664
    threshold: 0.95
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 320
    max_out_len: 1024
    batch_size: 80
    request_rate: 0
    dataset_path: vllm-ascend/GSM8K_prefix100_in16384_bs500_GLM5_3_flash_w8a8
  reset_before_gpqa:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json; from urllib.request import Request, urlopen;
      from tests.e2e.common.multi_node.utils import get_cluster_ips;
      host = get_cluster_ips(4)[2];
      response = urlopen(Request('http://' + host + ':7100/reset_prefix_cache', method='POST'), timeout=120);
      assert json.load(response).get('success') is True, 'prefix cache reset failed'"
  acc_gpqa:
    case_type: accuracy
    dataset_path: vllm-ascend/gpqa
    request_conf: vllm_api_general_chat
    dataset_conf: gpqa/gpqa_gen_0_shot_cot_chat_prompt
    max_out_len: 65536
    temperature: 1.0
    top_p: 0.95
    batch_size: 32
    baseline: 86.92
    verify_mode: ge
