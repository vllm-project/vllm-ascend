      - '48'
      - --quantization
      - ascend
      - --safetensors-load-strategy
      - prefetch
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm47
      - --kv-cache-dtype
      - int8
      - --attention_config.indexer_kv_dtype
      - int8
      - --max-num-batched-tokens
      - '288'
      - --gpu-memory-utilization
      - '0.92'
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - --additional-config
      - '{"scheduler_config": {"recompute_scheduler_enable": true}, "enable_fused_mc2": 2, "enable_shared_expert_dp": true}'
      - --speculative-config
      - '{"num_speculative_tokens": 5, "method": "mtp", "enforce_eager": true}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_consumer", "kv_port": "30200", "kv_connector_extra_config": {"use_ascend_direct": true}}'

