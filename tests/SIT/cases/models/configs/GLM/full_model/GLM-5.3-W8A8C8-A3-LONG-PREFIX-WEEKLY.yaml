# Reuse the current full-model nightly service topology and P cache reset.
# Nominal dataset prefix ratios are not measured runtime cache-hit ratios.
# P/PD: warm up, then reset P before formal measurement so repeated
# warmup prompts do not turn the formal workload into full-prefix hits.
# D: reset before warmup only; retain that cache for formal measurement.
# New workload baselines must be measured on this topology and revision.
# Throughput, TTFT and TPOT are recorded, without a regression/SLO gate.
# Each phase checks complete requests, zero failures and token counts.
# No GLM5.1 or RP3 throughput numbers are reused as GLM5.3 baselines.
benchmarks:
  reset_before_prefill_64k_prefix90_warmup:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json; from urllib.request import Request, urlopen; from tests.e2e.common.multi_node.utils import get_cluster_ips; host = get_cluster_ips(4)[2]; response = urlopen(Request('http://' + host + ':7100/reset_prefix_cache', method='POST'), timeout=120); assert json.load(response).get('success') is True, 'prefix cache reset failed'"
  prepare_prefill_64k_prefix90_warmup:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "from pathlib import Path; Path('output_performance.txt').unlink(missing_ok=True)"
  prefill_64k_prefix90_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K-in65536-bs1500-prefix90-glm51
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 8
    max_out_len: 1
    batch_size: 24
    request_rate: 0
  verify_prefill_64k_prefix90_warmup:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json, re; from pathlib import Path; text = Path('output_performance.txt').read_text(); paths = re.findall(r'Performance Result files located in ([^\r\n]+)', text); assert paths, 'missing performance result'; result = json.loads((Path(paths[-1].rstrip('.')) / 'gsm8k.json').read_text()); metric = lambda key: float(result[key]['total']); assert metric('Total Requests') == 8, result; assert metric('Success Requests') == 8, result; assert metric('Failed Requests') == 0, result; assert metric('Total Generated Tokens') == 8, result; assert 62259.2 <= metric('Total Input Tokens') / 8 <= 68812.8, result; print('prefill_64k_prefix90_warmup: complete, zero failed requests, input/output shape verified')"
  reset_before_prefill_64k_prefix90:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "import json; from urllib.request import Request, urlopen; from tests.e2e.common.multi_node.utils import get_cluster_ips; host = get_cluster_ips(4)[2]; response = urlopen(Request('http://' + host + ':7100/reset_prefix_cache', method='POST'), timeout=120); assert json.load(response).get('success') is True, 'prefix cache reset failed'"
