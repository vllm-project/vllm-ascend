# A3: four hosts, 16 logical NPU devices per host; full checkpoint.
# Full checkpoint: no layer overrides or dummy weights.
test_name: "GLM-5.3-W8A8C8-A3-LONG-PREFIX-WEEKLY"
model: "Eco-Tech/GLM-5.3-w8a8c8"
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 2, 3 ]
    decoder: [ 0, 1 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 0
    tp_size: 2
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 16
    dp_size_local: 8
    dp_rank_start: 8
    tp_size: 2
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    cp_size: 16
    pp_size: 2
    nnodes: 2
    node_rank: 0
    master_addr: "${NODE_2_IP}"
    master_port: 7060
    is_headless: false
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 12321
    dp_size: 1
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 1
    cp_size: 16
    pp_size: 2
    nnodes: 2
    node_rank: 1
    master_addr: "${NODE_2_IP}"
    master_port: 7060
    is_headless: true
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  # Keep CANN/Torch JIT builds off the shared /root/.cache PVC.
  TORCH_EXTENSIONS_DIR: "/tmp/torch_extensions/glm53"
  SERVER_PORT: "${PORT}"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  VLLM_USE_MODELSCOPE: "true"
  VLLM_KV_CACHE_LAYOUT: "HND"
  VLLM_ENGINE_READY_TIMEOUT_S: "1800"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  HCCL_EXEC_TIMEOUT: "1800"
  HCCL_CONNECT_TIMEOUT: "1800"
  ASCEND_TRANSFER_TIMEOUT: "10000"
  MC_TRANSFER_TIMEOUT: "120"
  VLLM_HOST_IP: "${LOCAL_IP}"
  HCCL_OP_EXPANSION_MODE: "AIV"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  PYTHONHASHSEED: "0"
  ACL_OP_INIT_MODE: "1"

env_prefill: &env_prefill
  <<: *env_common
  HCCL_BUFFSIZE: "512"
  VLLM_PP_LAYER_PARTITION: "41,37"
  VLLM_USE_FASTOKENS: "1"
  # Required for the benchmark cache reset API.
  VLLM_SERVER_DEV_MODE: "1"

env_decode: &env_decode
  <<: *env_common
  HCCL_BUFFSIZE: "1024"

templates:
  - node_index: 0
    envs:
      <<: *env_decode
    server_cmd_template:
      - --tensor-parallel-size
      - '2'
      - --data-parallel-size
      - '16'
      - --host
      - 0.0.0.0
      - --port
      - $SERVER_PORT
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --enable-expert-parallel
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --async-scheduling
      - --seed
      - '1024'
      - --served-model-name
      - ${MODEL}
      - --max-model-len
      - '135000'
      - --trust-remote-code
      - --max-num-seqs
      - '48'
      - --quantization
      - ascend
      - --safetensors-load-strategy
      - prefetch
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm47
      - --kv-cache-dtype
      - int8
      - --attention_config.indexer_kv_dtype
      - int8
      - --max-num-batched-tokens
      - '288'
      - --gpu-memory-utilization
      - '0.92'
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      - --additional-config
      - '{"scheduler_config": {"recompute_scheduler_enable": true}, "enable_fused_mc2": 2, "enable_shared_expert_dp": true}'
      - --speculative-config
      - '{"num_speculative_tokens": 5, "method": "mtp", "enforce_eager": true}'
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_consumer", "kv_port": "30200", "kv_connector_extra_config": {"use_ascend_direct": true}}'

