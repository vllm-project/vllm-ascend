# Serving: GLM5.3-Flash.md ordinary A3 PD, PR #23368 at 5fa7ec2b9f83.
# Two A3 hosts (16 logical devices each): P DP1/TP1/PCP16, D DP16/TP1.
# Each throughput baseline is the lower full-run measurement for that phase
# from Nightly runs 45960404038 and 46093654568. The pass threshold is 95%.
# P/out1 and warmed-prefix D/out1024 both still use the PD proxy.
# Reuse public datasets and the standard AISBench streaming request config.
# Resolve the node-0 proxy through the same LWS DNS as external DP routing.
# Reset both proxy backends before P/PD measurement and each decode warmup;
# keep the warmed prefix between each decode warmup and its measurement.
# Public data is approximately 16K content tokens, not exact RP3 input bytes.
# The prefix0 dataset has 500 unique rows; prefix100 has 1000 identical rows.
# Cap PD/high-load D requests at those counts; AISBench does not extend slices.
# Retain existing Flash AIME2025 accuracy settings (not an RP3 accuracy claim).
test_name: GLM-5.3-Flash-W8A8-A3-ALL-COMBINED
model: Eco-Tech/GLM-5.3-Flash-w8a8
num_nodes: 2
npu_per_node: 16
dp_load_balancing: external
routing:
  type: disaggregated_prefill
  groups:
    prefiller:
    - 0
    decoder:
    - 1
config:
- node_index: 0
  port_start: 9081
  dp_rpc_port: 12325
  dp_size: 1
  dp_size_local: 1
  dp_rank_start: 0
  tp_size: 1
  cp_size: 16
  dp_address: ${NODE_0_IP}
- node_index: 1
  port_start: 9900
  dp_rpc_port: 12325
  dp_size: 16
  dp_size_local: 16
  dp_rank_start: 0
  tp_size: 1
  dp_address: ${NODE_1_IP}
  cp_size: 1
env_common: &env_common
  TORCH_EXTENSIONS_DIR: /tmp/torch_extensions/glm53flash
  VLLM_USE_MODELSCOPE: 'true'
  VLLM_USE_FASTOKENS: '1'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  # Enable the backend /reset_prefix_cache endpoint used by the PD proxy.
  VLLM_SERVER_DEV_MODE: '1'
  SERVER_PORT: ${PORT}
  ASCEND_RT_VISIBLE_DEVICES: ${VISIBLE_DEVICES}
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  HCCL_OP_EXPANSION_MODE: AIV
  HCCL_BUFFSIZE: '1024'
  ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["hccs:device"]}'
  PYTHONHASHSEED: '0'
  ACL_OP_INIT_MODE: '1'
  VLLM_HOST_IP: ${LOCAL_IP}

templates:
- node_index: 0
  envs:
    <<: *env_common
  server_cmd_template:
  - --host
  - 0.0.0.0
  - --port
  - $SERVER_PORT
  - --data-parallel-size
  - ${DP_SIZE}
  - --data-parallel-address
  - ${DP_ADDRESS}
  - --data-parallel-rpc-port
  - ${DP_RPC_PORT}
  - --tensor-parallel-size
  - ${TP_SIZE}
  - --api-server-count
  - '1'
  - --prefill-context-parallel-size
  - ${CP_SIZE}
  - --enable-expert-parallel
  - --enable-eplb
  - --eplb-config
  - '{"window_size":300,"step_interval":300,"num_redundant_experts":0,"use_async":true,"policy":"stair","communicator":"hixl"}'
  - --seed
  - '1024'
  - --served-model-name
  - ${MODEL}
  - --safetensors-load-strategy
  - prefetch
  - --max-num-seqs
  - '64'
  - --max-model-len
  - '1048576'
  - --max-num-batched-tokens
  - '16384'
  - --trust-remote-code
  - --quantization
  - ascend
  - --limit-mm-per-prompt
  - '{"image":7,"video":0}'
  - --gpu-memory-utilization
  - '0.92'
  - --tool-call-parser
  - glm47
  - --reasoning-parser
  - glm47
  - --enable-auto-tool-choice
  - --kv-cache-dtype
  - int8
  - --prefix-cache-retention-interval
  - None
  - --enforce-eager
  - --use-replayssm
  - --enable-prefix-caching
  - --mamba-ssm-cache-dtype
  - bfloat16
  - --speculative-config
  - '{"num_speculative_tokens": 5, "method": "deepseek_mtp", "enforce_eager": false}'
  - --additional-config
  - '{"enable_shared_expert_dp": true,"enable_fused_mc2":2}'
  - --kv-transfer-config
  - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_producer", "engine_id": "0", "kv_port": "36680"}'
- node_index: 1
  envs:
    <<: *env_common
  server_cmd_template:
  - --host
  - 0.0.0.0
  - --port
  - $SERVER_PORT
  - --data-parallel-size
  - ${DP_SIZE}
  - --data-parallel-rank
  - ${DP_RANK}
  - --data-parallel-address
  - ${DP_ADDRESS}
  - --data-parallel-rpc-port
  - ${DP_RPC_PORT}
  - --tensor-parallel-size
  - ${TP_SIZE}
  - --enable-expert-parallel
  - --seed
  - '1024'
  - --served-model-name
  - ${MODEL}
  - --safetensors-load-strategy
  - prefetch
  - --max-num-seqs
  - '40'
  - --max-model-len
  - '1048576'
  - --max-num-batched-tokens
  - '240'
  - --trust-remote-code
  - --quantization
  - ascend
  - --limit-mm-per-prompt
  - '{"image":7,"video":0}'
  - --gpu-memory-utilization
  - '0.92'
  - --tool-call-parser
  - glm47
  - --reasoning-parser
  - glm47
  - --enable-auto-tool-choice
  - --kv-cache-dtype
  - int8
  - --use-replayssm
  - --enable-prefix-caching
  - --mamba-ssm-cache-dtype
  - bfloat16
  - --compilation-config
  - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
  - --speculative-config
  - '{"num_speculative_tokens": 5, "method": "deepseek_mtp", "enforce_eager": false}'
  - --additional-config
  - |-
    {
      "multistream_overlap_shared_expert": false,
      "scheduler_config": {
        "recompute_scheduler_enable": true
      },
      "enable_shared_expert_dp": true,
      "enable_flashcomm1": false,
      "enable_fused_mc2": 2,
      "finegrained_tp_config": {
        "qkv_iproj_tensor_parallel_size": 8,
        "oproj_tensor_parallel_size": 1
      },
      "ascend_compilation_config": {
        "enable_npugraph_ex": true,
        "enable_static_kernel": false,
        "enable_super_kernel": false
      }
    }
  - --kv-transfer-config
  - '{"kv_connector": "MooncakeConnectorV2", "kv_role": "kv_consumer", "engine_id": "1", "kv_port": "36580"}'
benchmarks:
  reset_before_prefill_16k_warmup:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "from urllib.request import Request, urlopen;
      from tests.e2e.common.multi_node.utils import get_cluster_ips;
      host = get_cluster_ips(2)[0];
      response = urlopen(Request('http://' + host + ':$SERVER_PORT/reset_prefix_cache', method='POST'), timeout=120);
      assert response.status == 200, 'prefix cache reset failed'; response.close()"
  prefill_16k_warmup:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs500_GLM5_3_w8a8c8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 8
    max_out_len: 1
    batch_size: 56
    request_rate: 0.8
  reset_before_prefill_16k:
    case_type: curl_cmd
    cmds:
    - >-
      python3 -c "from urllib.request import Request, urlopen;
      from tests.e2e.common.multi_node.utils import get_cluster_ips;
      host = get_cluster_ips(2)[0];
      response = urlopen(Request('http://' + host + ':$SERVER_PORT/reset_prefix_cache', method='POST'), timeout=120);
      assert response.status == 200, 'prefix cache reset failed'; response.close()"
  prefill_16k:
    case_type: performance
    dataset_path: vllm-ascend/GSM8K_prefix0_in16384_bs500_GLM5_3_w8a8c8
    request_conf: vllm_api_stream_chat
    dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
    num_prompts: 280
    max_out_len: 1
    batch_size: 56
    request_rate: 0.8
    input_throughput_baseline: 13061.6992
    input_throughput_threshold: 0.95
  reset_before_pd_16k_warmup:
    case_type: curl_cmd
