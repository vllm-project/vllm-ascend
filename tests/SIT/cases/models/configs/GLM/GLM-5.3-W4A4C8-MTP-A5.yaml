test_cases:
  - &base_case
    name: "GLM-5.3-W4A4C8-MTP-A5"
    model: "Eco-Tech/GLM-5.3-w4a4c8-mxfp4"
    envs: &base_envs
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      ASCEND_GLOBAL_LOG_LEVEL: "3"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      TASK_QUEUE_ENABLE: "1"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "100"
      HCCL_DFS_CONFIG: "task_exception:off,inconsistent_check:off"
      HCCL_BUFFSIZE: "400"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_INTRA_PCIE_ENABLE: "1"
      HCCL_INTRA_ROCE_ENABLE: "0"
      HCCL_ASYNC_ERROR_HANDLING: "0"
      ASCEND_LAUNCH_BLOCKING: "0"
      VLLM_ASCEND_ENABLE_PREFETCH_MLP: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_MODELSCOPE: "true"
      SERVER_PORT: "DEFAULT_PORT"
    server_cmd:
      - "--port"
      - "$SERVER_PORT"
      - "--distributed-executor-backend"
      - "mp"
      - "--data-parallel-size"
      - "1"
      - "--data-parallel-size-local"
      - "1"
      - "--tensor-parallel-size"
      - "8"
      - "--seed"
      - "1024"
      - "--enable-expert-parallel"
      - "--max-num-seqs"
      - "128"
      - "--max-model-len"
      - "202752"
      - "--max-num-batched-tokens"
      - "8192"
      - "--trust-remote-code"
      - "--no-enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--quantization"
      - "ascend"
      - "--async-scheduling"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm45"
      - "--compilation-config"
      - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      - "--speculative-config"
      - '{"num_speculative_tokens":5,"method":"deepseek_mtp","enforce_eager":true}'
      - "--kv-cache-dtype"
      - "fp8"
      - "--attention-config"
      - '{"indexer_kv_dtype":"fp8"}'
      - "--additional-config"
      - '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true,"enable_flashcomm1":true}'
    benchmarks: &base_benchmarks
      perf_128k_1k_prefix90_warmup:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 1
        max_out_len: 1
        batch_size: 1
        request_rate: 0
      perf_128k_1k_prefix90:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 128
        max_out_len: 1
        batch_size: 32
        request_rate: 0
  #      acc_gsm8k: &acc_gsm8k
  #        case_type: accuracy
  #        dataset_path: /root/.cache/modelscope/hub/datasets/vllm-ascend/gsm8k
  #        request_conf: vllm_api_general_chat
  #        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_chat_prompt
  #        max_out_len: 10240
  #        batch_size: 32
  #        temperature: 0
  #        baseline: 95
  #        threshold: 5

  - <<: *base_case
    name: "GLM-5.3-W4A4C8-MTP-A5-Mooncake"
    envs:
      <<: *base_envs
      PYTHONHASHSEED: "0"
      ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
    kv_pool:
      type: mooncake
      master_port: 50088
      metrics_port: 50089
      config:
        metadata_server: P2PHANDSHAKE
        protocol: ascend
        device_name: ""
        global_segment_size: 1GB
        local_buffer_size: 1GB
        preferred_segment: false
        prefer_alloc_in_same_node: true
        enable_ssd_offload: false
    server_cmd_extra:
      - "--kv-transfer-config"
      - '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"backend":"mooncake","lookup_rpc_port":"0","use_layerwise":false}}'
    # Repeat the dataset after populating the pool, with local prefix reuse disabled.
    benchmarks:
      perf_128k_1k_prefix90:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 128
        max_out_len: 1
        batch_size: 32
        request_rate: 0

  - <<: *base_case
    name: "GLM-5.3-W4A4C8-MTP-A5-Memcache"
    envs:
      <<: *base_envs
      PYTHONHASHSEED: "0"
      ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
    kv_pool:
      type: memcache
      meta_service_port: 5000
      config_store_port: 6000
      config:
        meta:
          ock.mmc.log_level: info
        local:
          ock.mmc.log_level: info
          ock.mmc.local_service.world_size: 256
          ock.mmc.local_service.protocol: device_urma
          ock.mmc.local_service.dram.size: 10GB
    server_cmd_extra:
      - "--kv-transfer-config"
      - '{"kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_connector_extra_config":{"backend":"memcache","lookup_rpc_port":"0","use_layerwise":false}}'
    benchmarks:
      perf_128k_1k_prefix90:
        case_type: performance
        dataset_path: vllm-ascend/GSM8K-in128k-bs512-prefix90-ds
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 128
        max_out_len: 1
        batch_size: 32
        request_rate: 0
