test_name: "GLM-5.3-W8A8C8-1M-PD"
model: "Eco-Tech/GLM-5.3-w8a8c8"
num_nodes: 4
npu_per_node: 16
dp_load_balancing: external

routing:
  type: "disaggregated_prefill"
  groups:
    prefiller: [ 0, 1 ]
    decoder: [ 2, 3 ]

config:
  - node_index: 0
    port_start: 7100
    dp_rpc_port: 16591
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 0
    tp_size: 16
    cp_size: 1
    dp_address: "${NODE_0_IP}"

  - node_index: 1
    port_start: 7100
    dp_rpc_port: 16591
    dp_size: 2
    dp_size_local: 1
    dp_rank_start: 1
    tp_size: 16
    cp_size: 1
    dp_address: "${NODE_0_IP}"

  - node_index: 2
    port_start: 7100
    dp_rpc_port: 16600
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 0
    tp_size: 8
    cp_size: 1
    dp_address: "${NODE_2_IP}"

  - node_index: 3
    port_start: 7100
    dp_rpc_port: 16600
    dp_size: 4
    dp_size_local: 2
    dp_rank_start: 2
    tp_size: 8
    cp_size: 1
    dp_address: "${NODE_2_IP}"

env_common: &env_common
  VLLM_USE_MODELSCOPE: "true"
  ASCEND_RT_VISIBLE_DEVICES: "${VISIBLE_DEVICES}"
  HCCL_OP_EXPANSION_MODE: "AIV"
  HCCL_BUFFSIZE: "400"
  HCCL_EXEC_TIMEOUT: "204"
  HCCL_CONNECT_TIMEOUT: "7200"
  VLLM_ENGINE_READY_TIMEOUT_S: "100000"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
  ASCEND_CONNECT_TIMEOUT: "10000"
  ASCEND_TRANSFER_TIMEOUT: "10000"
  MF_GROUP_JOIN_MAX_TIMEOUT: "1200"
  PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  ACL_OP_INIT_MODE: "1"
  ASCEND_A3_ENABLE: "1"
  ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["hccs:device"]}'
  ASCEND_LOCAL_COMM_RES: '{"version":"1.2"}'

env_prefill: &env_prefill
  <<: *env_common

env_decode: &env_decode
  <<: *env_common
  TASK_QUEUE_ENABLE: "1"
  VLLM_ASCEND_ENABLE_MLAPO: "1"

templates:
  - node_index: 0
    envs:
      <<: *env_prefill
    server_cmd_template:
      - --host
      - "0.0.0.0"
      - --port
      - ${PORT}
      - --data-parallel-size
      - ${DP_SIZE}
      - --data-parallel-rank
      - ${DP_RANK}
      - --data-parallel-address
      - ${DP_ADDRESS}
      - --data-parallel-rpc-port
      - ${DP_RPC_PORT}
      - --tensor-parallel-size
      - ${TP_SIZE}
      - --enable-expert-parallel
      - --prefill-context-parallel-size
      - ${CP_SIZE}
      - --decode-context-parallel-size
      - "16"
      - --cp-kv-cache-interleave-size
      - "128"
      - --speculative-config
      - '{"num_speculative_tokens": 1, "method":"deepseek_mtp","enforce_eager":true}'
      - --seed
      - "1024"
      - --max-model-len
      - "1048576"
      - --safetensors-load-strategy
      - "prefetch"
      - --additional-config
      - '{"enable_fused_mc2": 1, "enable_flashcomm1": true}'
      - --max-num-batched-tokens
      - "8192"
      - --trust-remote-code
      - --enable-prefix-caching
      - --max-num-seqs
      - "64"
      - --quantization
      - "ascend"
      - --gpu-memory-utilization
      - "0.85"
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "glm47"
      - --reasoning-parser
      - "glm45"
      - --kv-cache-dtype
      - "int8"
      - --attention_config.indexer_kv_dtype
      - "int8"
      - --kv-transfer-config
      - '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"use_ascend_direct": true, "prefill": {"dp_size": 2, "tp_size":  16}, "decode": {"dp_size": 4, "tp_size": 8}}}'

  - node_index: 1
