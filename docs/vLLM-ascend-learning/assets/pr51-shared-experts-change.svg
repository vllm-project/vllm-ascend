<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='750' viewBox='0 0 1200 750'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0 0L8 4L0 8Z' fill='#526175'/></marker></defs><rect width='1200' height='750' fill='white'/><g font-family='Microsoft YaHei, sans-serif' font-size='17' fill='#233247'>
<text x='30' y='37'>PR51：满足接口、量化和布局条件时，共享专家也交给 MegaMoE</text>
<text x='30' y='84'>修改前：两条路径独立计算</text>
<rect x='30' y='110' width='210' height='65' rx='8' fill='#f1f5fa' stroke='#8896a8'/>
<text x='46' y='143'>MoE 输入 x</text>
<rect x='320' y='100' width='470' height='65' rx='8' fill='#fff0d6' stroke='#8896a8'/>
<text x='336' y='133'>路由专家：MegaMoE → 路由输出</text>
<rect x='320' y='205' width='470' height='65' rx='8' fill='#f1f5fa' stroke='#8896a8'/>
<text x='336' y='238'>共享专家：独立 MLP → 共享输出</text>
<rect x='900' y='150' width='270' height='85' rx='8' fill='#f1f5fa' stroke='#8896a8'/>
<text x='916' y='183'>按模型语义合并</text>
<text x='916' y='210'>得到 MoE 输出</text>
<path d='M240 142 L320 132' fill='none' stroke='#526175' stroke-width='2' marker-end='url(#a)'/>
<path d='M240 142 L320 237' fill='none' stroke='#526175' stroke-width='2' marker-end='url(#a)'/>
<path d='M790 132 L900 177' fill='none' stroke='#526175' stroke-width='2' marker-end='url(#a)'/>
<path d='M790 237 L900 207' fill='none' stroke='#526175' stroke-width='2' marker-end='url(#a)'/>
<text x='30' y='334'>修改后：先检查能否融合；支持时使用同一次融合调用</text>
<rect x='30' y='360' width='245' height='90' rx='8' fill='#e9f5ec' stroke='#8896a8'/>
<text x='46' y='393'>MoE 输入</text>
<text x='46' y='420'>路由专家权重</text>
<text x='46' y='447'>共享专家权重 / scale</text>
<rect x='345' y='360' width='470' height='90' rx='8' fill='#e9f5ec' stroke='#8896a8'/>
<text x='361' y='393'>MegaMoE 融合调用</text>
<text x='361' y='420'>计算路由专家 + 共享专家</text>
<text x='361' y='447'>返回已包含两部分贡献的总输出</text>
<rect x='890' y='360' width='280' height='90' rx='8' fill='#f1f5fa' stroke='#8896a8'/>
<text x='906' y='393'>MoE 总输出</text>
<text x='906' y='420'>不再重复计算共享 MLP</text>
<text x='906' y='447'>不再重复叠加共享输出</text>
<path d='M275 405 L345 405' fill='none' stroke='#526175' stroke-width='2' marker-end='url(#a)'/>
<path d='M815 405 L890 405' fill='none' stroke='#526175' stroke-width='2' marker-end='url(#a)'/>
<rect x='30' y='495' width='1140' height='80' rx='8' fill='#f1f5fa' stroke='#8896a8'/>
<text x='46' y='528'>不能融合时：保留独立共享专家路径。检查项包括外部算子参数、量化、权重 shape、连续性等。</text>
<text x='46' y='555'>这不是删除共享专家，而是改变共享专家由谁执行。</text>
<rect x='30' y='615' width='1140' height='95' rx='8' fill='#eaf2ff' stroke='#8896a8'/>
<text x='46' y='648'>v0.30 RFC 适配：共享权重沿 Runner / 量化接口传入，融合状态接入 RoutedMoEMilestones。</text>
<text x='46' y='675'>接口衔接时把融合总输出放在共享输出槽，路由输出槽置零，避免重复相加。</text>
<text x='46' y='702'>这里的“输出槽”是框架传递结果的位置，不表示总输出只包含共享专家。</text>
</g></svg>