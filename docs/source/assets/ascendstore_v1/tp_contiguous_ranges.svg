<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="744" viewBox="0 0 1120 744" role="img" aria-labelledby="tp-contiguous-ranges-title tp-contiguous-ranges-desc">
<title id="tp-contiguous-ranges-title">同一份 head 分片在生产者与消费者的连续性不同</title>
<desc id="tp-contiguous-ranges-desc">以NHD单层单entry的四个token为例，TP=1生产者的heads0到3在各token间被heads4到7隔开，而TP=2消费者rank0只持有heads0到3，完整本地块连续，v1可将生产实现的逐token范围替换为一个连续范围，传输字节不变。</desc>
<defs>
<marker id="tp-contiguous-ranges-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#526a76"/></marker>
<marker id="tp-contiguous-ranges-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a52be"/></marker>
<marker id="tp-contiguous-ranges-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a52be"/></marker>
</defs>
<style>text{font-family:Geist,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#223036}.muted{fill:#526a76}</style>
<rect width="1120" height="744" fill="#ffffff"/>
<text x="32" y="44" font-size="28" font-weight="600">连续的是本地字节，不是两端相同的 token 分组</text>
<text x="32" y="80" font-size="18" class="muted">NHD · 单层、单个 K 或 V entry · 为看清排列，仅画 4 个 token · 目标分片为 heads 0–3</text>

<text x="32" y="140" font-size="22" font-weight="600">TP=1 生产者：每个 token 持有全部 8 个 heads</text>
<line x1="248" y1="180" x2="1016" y2="180" stroke="#526a76" marker-end="url(#tp-contiguous-ranges-arrow)"/>
<text x="32" y="186" font-size="18" class="muted">地址递增</text>
<text x="344" y="216" text-anchor="middle" font-size="18">token 0</text>
<text x="536" y="216" text-anchor="middle" font-size="18">token 1</text>
<text x="728" y="216" text-anchor="middle" font-size="18">token 2</text>
<text x="920" y="216" text-anchor="middle" font-size="18">token 3</text>
<rect x="248" y="232" width="768" height="64" fill="#f4f7f7" stroke="#c8d4d9"/>
<g fill="#2a9cbe" fill-opacity="0.09" stroke="#2a9cbe">
<rect x="248" y="232" width="96" height="64"/><rect x="440" y="232" width="96" height="64"/>
<rect x="632" y="232" width="96" height="64"/><rect x="824" y="232" width="96" height="64"/>
</g>
<g font-size="18" text-anchor="middle">
<text x="296" y="270">0–3</text><text x="392" y="270">4–7</text>
<text x="488" y="270">0–3</text><text x="584" y="270">4–7</text>
<text x="680" y="270">0–3</text><text x="776" y="270">4–7</text>
<text x="872" y="270">0–3</text><text x="968" y="270">4–7</text>
</g>
<g fill="none" stroke="#526a76" stroke-width="2">
<path d="M248,312 V324 H344 V312"/><path d="M440,312 V324 H536 V312"/>
<path d="M632,312 V324 H728 V312"/><path d="M824,312 V324 H920 V312"/>
</g>
<text x="32" y="326" font-size="18" class="muted">保存该分片</text>
<text x="248" y="360" font-size="18" class="muted">4 个不相邻范围；仍要跳过各 token 的另一半 heads</text>

<line x1="32" y1="388" x2="1088" y2="388" stroke="#c8d4d9"/>
<text x="32" y="432" font-size="22" font-weight="600">TP=2 消费者 rank 0：本地只持有 heads 0–3</text>
<text x="32" y="476" font-size="18" class="muted">恢复整个本地块</text>
<rect x="248" y="452" width="768" height="80" fill="#2a52be" fill-opacity="0.10" stroke="#2a52be" stroke-width="2"/>
<g stroke="#c8d4d9"><line x1="440" y1="452" x2="440" y2="532"/><line x1="632" y1="452" x2="632" y2="532"/><line x1="824" y1="452" x2="824" y2="532"/></g>
<g font-size="18" text-anchor="middle">
<text x="344" y="482">token 0</text><text x="536" y="482">token 1</text><text x="728" y="482">token 2</text><text x="920" y="482">token 3</text>
<text x="344" y="514">heads 0–3</text><text x="536" y="514">heads 0–3</text><text x="728" y="514">heads 0–3</text><text x="920" y="514">heads 0–3</text>
</g>
<path d="M248,548 V560 H1016 V548" fill="none" stroke="#2a52be" stroke-width="2"/>
<text x="248" y="596" font-size="20" font-weight="600">生产：4 个相邻范围　→　v1：1 个连续范围</text>
<text x="248" y="628" font-size="18" class="muted">仅当实际 stride 与字节顺序满足整行连续条件；无需重排 Tensor</text>
<line x1="32" y1="668" x2="1088" y2="668" stroke="#c8d4d9"/>
<text x="32" y="700" font-size="18" class="muted">方格内数字是 head 编号；两行宽度分别归一化，不表示相同字节容量。</text>
<text x="32" y="728" font-size="18" class="muted">减少的是范围描述，不是 KV 字节数；块与块之间仍按各自物理 block ID 定位。</text>
</svg>
