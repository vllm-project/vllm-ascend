<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="tp-head-slices-title tp-head-slices-desc"><title id="tp-head-slices-title">TP 切片的本地片段与对象载荷</title><desc id="tp-head-slices-desc">两个 token 的 NHD 内存中，slice 0 占本地零到八及十六到二十四字节；同一个外部对象将这两个片段紧凑保存为十六字节，消费者可以具有对应的连续本地块。</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526a76"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a52be"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9cbe"/></marker>
<style>text{font-family:'Geist','PingFang SC','Noto Sans SC',sans-serif;font-size:16px;fill:#223036}.title{font-size:28px;font-weight:600}.name{font-weight:600}.muted{font-size:14px;fill:#526a76}.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;fill:#526a76}.selected{fill:#edf1fa;stroke:#2a52be}.other{fill:#f4f7f7;stroke:#c8d4d9}</style></defs><rect width="960" height="600" fill="#fff"/>
<text x="40" y="68" class="title">TP 切片的本地片段与对象载荷</text><text x="40" y="94" class="muted">2 tokens × 4 heads × 4 字节；一个 group block；NHD；无 padding</text>
<text x="40" y="118" class="name">生产者本地块</text><text x="304" y="146" text-anchor="middle" class="muted">token 0</text><text x="688" y="146" text-anchor="middle" class="muted">token 1</text>
<rect x="112" y="164" width="96" height="64" class="selected"/><rect x="208" y="164" width="96" height="64" class="selected"/><rect x="304" y="164" width="96" height="64" class="other"/><rect x="400" y="164" width="96" height="64" class="other"/><rect x="496" y="164" width="96" height="64" class="selected"/><rect x="592" y="164" width="96" height="64" class="selected"/><rect x="688" y="164" width="96" height="64" class="other"/><rect x="784" y="164" width="96" height="64" class="other"/>
<text x="160" y="201" text-anchor="middle">h0</text><text x="256" y="201" text-anchor="middle">h1</text><text x="352" y="201" text-anchor="middle">h2</text><text x="448" y="201" text-anchor="middle">h3</text><text x="544" y="201" text-anchor="middle">h0</text><text x="640" y="201" text-anchor="middle">h1</text><text x="736" y="201" text-anchor="middle">h2</text><text x="832" y="201" text-anchor="middle">h3</text>
<text x="112" y="250" text-anchor="middle" class="mono">0</text><text x="208" y="250" text-anchor="middle" class="mono">4</text><text x="304" y="250" text-anchor="middle" class="mono">8</text><text x="400" y="250" text-anchor="middle" class="mono">12</text><text x="496" y="250" text-anchor="middle" class="mono">16</text><text x="592" y="250" text-anchor="middle" class="mono">20</text><text x="688" y="250" text-anchor="middle" class="mono">24</text><text x="784" y="250" text-anchor="middle" class="mono">28</text><text x="880" y="250" text-anchor="middle" class="mono">32 B</text>
<text x="40" y="302" class="name">slice 0 的完整对象</text><rect x="112" y="320" width="192" height="56" class="selected"/><rect x="304" y="320" width="192" height="56" class="selected"/>
<text x="208" y="354" text-anchor="middle">t0: h0、h1</text><text x="400" y="354" text-anchor="middle">t1: h0、h1</text>
<text x="112" y="398" text-anchor="middle" class="mono">0</text><text x="304" y="398" text-anchor="middle" class="mono">8</text><text x="496" y="398" text-anchor="middle" class="mono">16 B</text>
<text x="552" y="341" class="muted">本地片段：[0,8) 与 [16,24)</text><text x="552" y="369" class="muted">对象载荷：[0,8) 与 [8,16)</text>
<text x="40" y="442" class="name">消费者本地块</text><rect x="112" y="460" width="384" height="56" fill="#edf6f9" stroke="#2a9cbe"/><text x="304" y="494" text-anchor="middle">t0: h0、h1  |  t1: h0、h1</text>
<text x="552" y="481" class="muted">仅持有这两个 head 且布局连续时</text><text x="552" y="509" class="muted">可用 1 个范围恢复同样的 16 字节</text>
<line x1="40" y1="532" x2="920" y2="532" stroke="#c8d4d9"/><text x="40" y="556" class="muted">蓝色为 slice 0，灰色为 slice 1；各字节条使用同一比例。范围数减少，载荷字节数不变。</text>
</svg>
