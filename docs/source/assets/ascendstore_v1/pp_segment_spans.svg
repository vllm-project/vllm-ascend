<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="pp-segment-spans-title pp-segment-spans-desc"><title id="pp-segment-spans-title">PP 层区间与段区间</title><desc id="pp-segment-spans-desc">本地物理层四和五分别属于目标 PP0 和 PP1，通过层到 Entry 及 Entry 到 segment 的边界数组，PP1 的本地层区间一到二对应 Entry 二到四和 segment 五到十。</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526a76"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a52be"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9cbe"/></marker>
<style>text{font-family:'Geist','PingFang SC','Noto Sans SC',sans-serif;font-size:16px;fill:#223036}.title{font-size:28px;font-weight:600}.name{font-weight:600}.muted{fill:#526a76;font-size:14px}.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;fill:#526a76}.pp0{fill:#edf1fa;stroke:#2a52be}.pp1{fill:#edf6f9;stroke:#2a9cbe}</style></defs><rect width="960" height="600" fill="#fff"/>
<text x="40" y="68" class="title">PP 层区间与段区间</text><text x="40" y="94" class="muted">本地物理层为 4、5；目标 PP 层数为 (5,1)；各区间使用对应数组的下标</text>
<text x="400" y="124" text-anchor="middle" class="name">PP0：目标物理层 0–4</text><text x="720" y="124" text-anchor="middle" class="name">PP1：目标物理层 5</text>
<text x="40" y="185" class="name">本地层数组</text><text x="40" y="211" class="muted">下标与物理 ID 分开</text>
<rect x="240" y="152" width="320" height="64" class="pp0"/><rect x="560" y="152" width="320" height="64" class="pp1"/><text x="400" y="190" text-anchor="middle">下标 0 · 物理层 L4</text><text x="720" y="190" text-anchor="middle">下标 1 · 物理层 L5</text>
<text x="240" y="239" text-anchor="middle" class="mono">0</text><text x="560" y="239" text-anchor="middle" class="mono">1</text><text x="880" y="239" text-anchor="middle" class="mono">2</text>
<text x="40" y="313" class="name">Entry 数组</text><text x="40" y="339" class="muted">层边界 [0,2,4]</text>
<rect x="240" y="280" width="160" height="64" class="pp0"/><rect x="400" y="280" width="160" height="64" class="pp0"/><rect x="560" y="280" width="160" height="64" class="pp1"/><rect x="720" y="280" width="160" height="64" class="pp1"/><text x="320" y="318" text-anchor="middle">K4</text><text x="480" y="318" text-anchor="middle">V4</text><text x="640" y="318" text-anchor="middle">K5</text><text x="800" y="318" text-anchor="middle">V5</text>
<text x="240" y="367" text-anchor="middle" class="mono">0</text><text x="400" y="367" text-anchor="middle" class="mono">1</text><text x="560" y="367" text-anchor="middle" class="mono">2</text><text x="720" y="367" text-anchor="middle" class="mono">3</text><text x="880" y="367" text-anchor="middle" class="mono">4</text>
<text x="40" y="439" class="name">segment 数组</text><text x="40" y="465" class="muted">Entry 边界</text><text x="40" y="489" class="mono">[0,3,5,8,10]</text>
<rect x="240" y="408" width="192" height="64" class="pp0"/><rect x="432" y="408" width="128" height="64" class="pp0"/><rect x="560" y="408" width="192" height="64" class="pp1"/><rect x="752" y="408" width="128" height="64" class="pp1"/><text x="336" y="446" text-anchor="middle">K4 · 3 段</text><text x="496" y="446" text-anchor="middle">V4 · 2 段</text><text x="656" y="446" text-anchor="middle">K5 · 3 段</text><text x="816" y="446" text-anchor="middle">V5 · 2 段</text>
<text x="240" y="495" text-anchor="middle" class="mono">0</text><text x="432" y="495" text-anchor="middle" class="mono">3</text><text x="560" y="495" text-anchor="middle" class="mono">5</text><text x="752" y="495" text-anchor="middle" class="mono">8</text><text x="880" y="495" text-anchor="middle" class="mono">10</text>
<line x1="40" y1="516" x2="920" y2="516" stroke="#c8d4d9"/><text x="40" y="536" class="muted">蓝色为 PP0，青色为 PP1；颜色对应同一目标分区，各行按自身索引绘制。</text><text x="40" y="556" class="muted">PP1：本地层 [1,2) → Entry [2,4) → segment [5,10)；已有 TP 段只选列，不重新绑定。</text>
</svg>
