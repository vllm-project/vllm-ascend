<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="store-overlap-title store-overlap-desc">
<title id="store-overlap-title">CPU准备可以与NPU写入重叠，读源和复用仍有先决条件</title>
<desc id="store-overlap-desc">一个普通Bulk Store的示意时序：后台CPU准备key与地址时NPU可以继续写KV，Backend只有在参数准备和来源event均完成后才能读源，后续覆盖或复用还要确认读源结束；条长不表示实测耗时，生产与v1都采用这一顺序。</desc>
<defs>
<marker id="store-overlap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#526a76"/></marker>
<marker id="store-overlap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a52be"/></marker>
<marker id="store-overlap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a52be"/></marker>
</defs>
<style>text{font-family:Geist,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#223036}.muted{fill:#526a76}</style>
<rect width="1120" height="696" fill="#ffffff"/>
<text x="32" y="44" font-size="28" font-weight="600">先准备描述，真正读 KV 时再等待</text>
<text x="32" y="80" font-size="18" class="muted">普通 Bulk Store · 生产已有、v1 保留的重叠方式 · 示意先后与重叠，条长不是实测耗时</text>
<line x1="224" y1="128" x2="1056" y2="128" stroke="#526a76" marker-end="url(#store-overlap-arrow)"/>
<text x="32" y="134" font-size="18" class="muted">时间向右</text>
<path d="M648,240 V464 Q648,472 656,472 H672" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#store-overlap-arrow)"/>
<path d="M624,360 H704 Q712,360 712,368 V448" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#store-overlap-arrow)"/>
<path d="M856,496 V520 Q856,528 864,528 H976 Q984,528 984,536 V552" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#store-overlap-arrow)"/>

<text x="32" y="212" font-size="20" font-weight="600">NPU</text>
<rect x="224" y="176" width="424" height="64" rx="6" fill="#4c2abe" fill-opacity="0.08" stroke="#4c2abe"/>
<text x="248" y="204" font-size="20" font-weight="600">模型写入 KV</text>
<text x="248" y="228" font-size="18" class="muted">主机已记录 event，不代表设备已完成</text>
<rect x="660" y="256" width="272" height="28" fill="#ffffff"/>
<text x="668" y="277" font-size="18" class="muted">event 完成：来源才可读取</text>

<text x="32" y="340" font-size="20" font-weight="600">后台 CPU</text>
<rect x="304" y="304" width="320" height="80" rx="6" fill="#2a52be" fill-opacity="0.10" stroke="#2a52be"/>
<text x="328" y="336" font-size="20" font-weight="600">筛选 key、组批、生成地址</text>
<text x="328" y="364" font-size="18" class="muted">只使用位置描述，不读取 KV</text>
<rect x="628" y="320" width="128" height="28" fill="#ffffff"/>
<text x="636" y="341" font-size="18" class="muted">参数已准备好</text>

<text x="32" y="480" font-size="20" font-weight="600">Backend</text>
<rect x="672" y="448" width="184" height="48" rx="6" fill="#2a9cbe" fill-opacity="0.09" stroke="#2a9cbe"/>
<text x="764" y="478" text-anchor="middle" font-size="20" font-weight="600">读源并执行 Store</text>
<text x="224" y="442" font-size="18" class="muted">两项前提都满足，才能开始读源</text>

<text x="32" y="582" font-size="20" font-weight="600">后续模型使用</text>
<rect x="880" y="552" width="208" height="64" rx="6" fill="#f4f7f7" stroke="#c8d4d9"/>
<text x="984" y="578" text-anchor="middle" font-size="18">确认读源结束后</text>
<text x="984" y="602" text-anchor="middle" font-size="18">才允许覆盖或复用</text>
<text x="224" y="582" font-size="18" class="muted">只在涉及该来源时等待</text>

<line x1="32" y1="632" x2="1088" y2="632" stroke="#c8d4d9"/>
<text x="32" y="662" font-size="18" class="muted">箭头表示先决条件；CPU 准备与 NPU 写入谁先结束都可以，不保证总能隐藏全部准备时间。</text>
<text x="32" y="688" font-size="18" class="muted">普通 Step 不排空全部 Store；显式排空、关闭和来源安全未知的处理另有约束。</text>
</svg>
