<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-labelledby="worker_composition-title worker_composition-desc">
<title id="worker_composition-title">Worker 的业务组合</title>
<desc id="worker_composition-desc">实线表示调用 / 组合；底部数据区标明所有者。Load = write，Store = read。</desc>
<defs>
<marker id="worker_composition-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526a76"/></marker>
<marker id="worker_composition-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a52be"/></marker>
<marker id="worker_composition-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9cbe"/></marker>
<style>text{font-family:'Geist','PingFang SC','Noto Sans SC',sans-serif;font-size:16px;fill:#223036}.title{font-size:28px;font-weight:600}.name{font-weight:600}.muted{fill:#526a76;font-size:14px}.band{fill:#fff;stroke:#c8d4d9;stroke-width:1.2}</style>
</defs><rect width="1280" height="850" fill="#fff"/>
<text x="48" y="60" class="title">Worker 的业务组合</text>
<text x="48" y="88" class="muted">实线表示调用 / 组合；底部数据区标明所有者。Load = write，Store = read。</text>
<path d="M 222,176 V 224" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<path d="M 640,176 V 224" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<path d="M 1032,176 V 224" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<path d="M 640,324 V 378" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<path d="M 1032,324 V 378" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<path d="M 614,476 V 524" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<path d="M 1030,476 V 524" fill="none" stroke="#526a76" stroke-width="1.5" marker-end="url(#worker_composition-arrow)"/>
<g data-node="worker">
<rect x="48" y="112" width="1184" height="64" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="64" y="139" class="name">Worker</text>
<text x="64" y="163" class="muted">KV 绑定 · 模型钩子适配 · 同步回退时本轮保存失效的交接 · 开始、结束、中止与关闭</text>
</g>
<g data-node="lookup">
<rect x="48" y="224" width="348" height="100" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="64" y="251" class="name">LookupService</text>
<text x="64" y="275" class="muted">命名 + Coordinator + Backend</text>
<text x="64" y="298" class="muted">独立查询；不需要本地 KV 地址</text>
</g>
<g data-node="load">
<rect x="420" y="224" width="372" height="100" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="436" y="251" class="name">LoadService</text>
<text x="436" y="275" class="muted">选块、Key 与全部目标归属</text>
<text x="436" y="298" class="muted">登记 LoadBatch · 解释失败与完成</text>
</g>
<g data-node="store">
<rect x="816" y="224" width="416" height="100" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="832" y="251" class="name">StoreService</text>
<text x="832" y="275" class="muted">候选、writer、存在性与来源归属</text>
<text x="832" y="298" class="muted">登记 StoreBatch · 决定发布与来源释放</text>
</g>
<text x="420" y="358" class="muted">Load / Store 共用实例</text>
<g data-node="transfer">
<rect x="420" y="378" width="812" height="98" rx="6" fill="#edf1fa" stroke="#2a52be" stroke-width="1.2"/>
<text x="436" y="405" class="name">Transfer · 装配时选择 BulkTransfer 或 LayerwiseTransfer</text>
<text x="436" y="429" class="muted">Backend 参数与调用 · 对象 Session · 复制证据</text>
<text x="436" y="452" class="muted">Bulk：整对象传输；Layerwise：KeyRange / GVA 逐层传输</text>
</g>
<g data-node="bulkexecutor">
<rect x="420" y="524" width="388" height="96" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="436" y="551" class="name">BulkExecutor</text>
<text x="436" y="575" class="muted">组合 Executor 队列</text>
<text x="436" y="598" class="muted">提交整体操作 · 源就绪交接</text>
</g>
<g data-node="layerexecutor">
<rect x="832" y="524" width="400" height="96" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="848" y="551" class="name">LayerwiseExecutor</text>
<text x="848" y="575" class="muted">组合 Executor 队列</text>
<text x="848" y="598" class="muted">逐层调度 · Gate · Future · 封口与收尾</text>
</g>
<text x="48" y="414" class="name">Lookup 的输出</text>
<text x="48" y="443" class="muted">可恢复终点 + 尾部 Key 边界</text>
<text x="48" y="478" class="muted">不经过 Transfer 或传输 Batch</text>
<text x="48" y="572" class="name">基础设施所有权</text>
<text x="48" y="601" class="muted">Resources 持有底层队列与 Backend 资源</text>
<text x="48" y="667" class="name">worker/data · 稳定绑定与两个业务状态</text>
<g data-node="context">
<rect x="48" y="690" width="348" height="104" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="64" y="717" class="name">TransferContext</text>
<text x="64" y="741" class="muted">一次 KV 绑定期间复用</text>
<text x="64" y="764" class="muted">拓扑 · BlockHashMapping · 数值布局</text>
</g>
<g data-node="loadbatch">
<rect x="420" y="690" width="372" height="104" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="436" y="717" class="name">LoadBatch · LoadService 持有</text>
<text x="436" y="741" class="muted">对象与全部本地目标 · 结果槽位</text>
<text x="436" y="764" class="muted">失败位置、写入安全与完成；可跨步保留</text>
</g>
<g data-node="storebatch">
<rect x="816" y="690" width="416" height="104" rx="6" fill="#fff" stroke="#c8d4d9" stroke-width="1.2"/>
<text x="832" y="717" class="name">StoreBatch · StoreService 持有</text>
<text x="832" y="741" class="muted">命令与选中来源 · 来源有效性与发布证据</text>
<text x="832" y="764" class="muted">读源安全与释放；可跨步保留</text>
</g>
<text x="48" y="828" class="muted">Backend Session 保护远端对象；LayerwiseExecutor 控制层推进，两者不共用生命周期。</text>
</svg>
