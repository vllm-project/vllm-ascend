<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="724" viewBox="0 0 1120 724" role="img" aria-labelledby="ascendstore-v1-resource-lifetimes-title ascendstore-v1-resource-lifetimes-desc">
<title id="ascendstore-v1-resource-lifetimes-title">请求、读源、额外引用与本地注册的不同寿命</title>
<desc id="ascendstore-v1-resource-lifetimes-desc">单 Worker job17 的一种合法时序，从Store规划开始截取。请求被取消、进度清理后，Store仍在读源；Backend按同步约定返回后读源结束，Worker处理fence并返回计数，Scheduler收齐回执后归还job引用。本地buffer注册继续供后续操作使用，到所有相关操作和线程的关闭条件成立后才注销。阶段等距表示先后，不表示实际耗时。</desc>
<defs><marker id="ascendstore-v1-resource-lifetimes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#526a76"/></marker></defs>
<style>text{font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif;fill:#223036}</style>
<rect width="1120" height="724" fill="white"/>
<text x="32" y="44" font-size="28" font-weight="600" text-anchor="start" style="fill:#223036">请求结束以后，哪些责任还在</text>
<text x="32" y="80" font-size="18" font-weight="400" text-anchor="start" style="fill:#526a76">job17 · 单 Worker 例子 · 从 Store 规划开始截取 · 阶段先后，不按耗时绘制</text>
<text x="32" y="112" font-size="18" font-weight="400" text-anchor="start" style="fill:#526a76">本例请求取消后，Store 仍在读源；正常返回分支以 Backend 同步约定成立为条件。</text>
<line x1="264" y1="236" x2="952" y2="236" stroke="#c8d4d9"/>
<line x1="976" y1="236" x2="1060" y2="236" stroke="#c8d4d9"/>
<path d="M956,242 L964,230 M966,242 L974,230" stroke="#526a76" fill="none"/>
<text x="32" y="266" font-size="18" font-weight="400" text-anchor="start" style="fill:#526a76">阶段</text>
<text x="296" y="170" font-size="18" font-weight="600" text-anchor="middle" style="fill:#223036">规划 Store</text>
<text x="296" y="200" font-size="18" font-weight="400" text-anchor="middle" style="fill:#223036">取得 job 引用</text>
<circle cx="296" cy="236" r="4" fill="#526a76"/>
<text x="296" y="266" font-size="16" font-weight="400" text-anchor="middle" style="fill:#526a76">1</text>
<line x1="296" y1="280" x2="296" y2="612" stroke="#c8d4d9" stroke-dasharray="4,4"/>
<text x="444" y="170" font-size="18" font-weight="600" text-anchor="middle" style="fill:#223036">请求取消</text>
<text x="444" y="200" font-size="18" font-weight="400" text-anchor="middle" style="fill:#223036">清理请求进度</text>
<circle cx="444" cy="236" r="4" fill="#526a76"/>
<text x="444" y="266" font-size="16" font-weight="400" text-anchor="middle" style="fill:#526a76">2</text>
<line x1="444" y1="280" x2="444" y2="612" stroke="#c8d4d9" stroke-dasharray="4,4"/>
<text x="592" y="170" font-size="18" font-weight="600" text-anchor="middle" style="fill:#223036">Backend 返回</text>
<text x="592" y="200" font-size="18" font-weight="400" text-anchor="middle" style="fill:#223036">读源结束</text>
<circle cx="592" cy="236" r="4" fill="#526a76"/>
<text x="592" y="266" font-size="16" font-weight="400" text-anchor="middle" style="fill:#526a76">3</text>
<line x1="592" y1="280" x2="592" y2="612" stroke="#c8d4d9" stroke-dasharray="4,4"/>
<text x="740" y="170" font-size="18" font-weight="600" text-anchor="middle" style="fill:#223036">Worker 领结果</text>
<text x="740" y="200" font-size="18" font-weight="400" text-anchor="middle" style="fill:#223036">发释放回执</text>
<circle cx="740" cy="236" r="4" fill="#526a76"/>
<text x="740" y="266" font-size="16" font-weight="400" text-anchor="middle" style="fill:#526a76">4</text>
<line x1="740" y1="280" x2="740" y2="612" stroke="#c8d4d9" stroke-dasharray="4,4"/>
<text x="888" y="170" font-size="18" font-weight="600" text-anchor="middle" style="fill:#223036">Scheduler 收齐</text>
<text x="888" y="200" font-size="18" font-weight="400" text-anchor="middle" style="fill:#223036">归还 job 引用</text>
<circle cx="888" cy="236" r="4" fill="#2a52be"/>
<text x="888" y="266" font-size="16" font-weight="400" text-anchor="middle" style="fill:#526a76">5</text>
<line x1="888" y1="280" x2="888" y2="612" stroke="#c8d4d9" stroke-dasharray="4,4"/>
<text x="1036" y="170" font-size="18" font-weight="600" text-anchor="middle" style="fill:#223036">关闭条件成立</text>
<text x="1036" y="200" font-size="18" font-weight="400" text-anchor="middle" style="fill:#223036">注销本地注册</text>
<circle cx="1036" cy="236" r="4" fill="#526a76"/>
<text x="1036" y="266" font-size="16" font-weight="400" text-anchor="middle" style="fill:#526a76">6</text>
<line x1="1036" y1="280" x2="1036" y2="612" stroke="#c8d4d9" stroke-dasharray="4,4"/>
<text x="32" y="337" font-size="20" font-weight="600" text-anchor="start" style="fill:#223036">请求进度（截取）</text>
<rect x="264" y="312" width="180" height="36" rx="4" fill="#eaf0f2" stroke="#526a76"/>
<text x="354.0" y="337" font-size="18" font-weight="600" text-anchor="middle" style="fill:#526a76">运行中</text>
<text x="32" y="421" font-size="20" font-weight="600" text-anchor="start" style="fill:#223036">本次来源读取</text>
<rect x="380" y="396" width="212" height="36" rx="4" fill="#eef8fb" stroke="#2a9cbe"/>
<text x="486.0" y="421" font-size="18" font-weight="600" text-anchor="middle" style="fill:#2a9cbe">读源中</text>
<text x="32" y="505" font-size="20" font-weight="600" text-anchor="start" style="fill:#223036">job17 额外引用</text>
<rect x="296" y="480" width="592" height="36" rx="4" fill="#eef2fc" stroke="#2a52be"/>
<text x="592.0" y="505" font-size="18" font-weight="600" text-anchor="middle" style="fill:#2a52be">读源结束后，还要等回执收齐</text>
<text x="32" y="589" font-size="20" font-weight="600" text-anchor="start" style="fill:#223036">本地 buffer 注册</text>
<rect x="264" y="564" width="772" height="36" rx="4" fill="#f4f7f7" stroke="#526a76"/>
<text x="650.0" y="589" font-size="18" font-weight="600" text-anchor="middle" style="fill:#526a76">继续供后续操作使用</text>
<line x1="240" y1="330" x2="264" y2="330" stroke="#526a76" stroke-dasharray="4,4"/>
<line x1="240" y1="582" x2="264" y2="582" stroke="#526a76" stroke-dasharray="4,4"/>
<rect x="952" y="564" width="24" height="36" fill="white"/>
<path d="M956,588 L964,576 M966,588 L974,576" stroke="#526a76" fill="none"/>
<text x="380" y="378" font-size="17" font-weight="400" text-anchor="start" style="fill:#2a9cbe">来源写好后才开始读源</text>
<text x="32" y="646" font-size="18" font-weight="400" text-anchor="start" style="fill:#526a76">左端虚线省略此前阶段；轴上的断点省略后续操作。关闭还要确认其他相关操作和线程结束。</text>
<line x1="32" y1="672" x2="1088" y2="672" stroke="#c8d4d9"/>
<text x="32" y="704" font-size="18" font-weight="400" text-anchor="start" style="fill:#526a76">归还 job 引用不代表物理块立即可复用；本地注册不会随某个请求或 job 一起注销。</text>
</svg>
