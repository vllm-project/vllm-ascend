<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-layers-title architecture-layers-desc">
<title id="architecture-layers-title">AscendStore v1 分层架构</title>
<desc id="architecture-layers-desc">接入与装配、业务层、基础设施层、Backend 适配层和第三方传输后端构成职责分层，业务组合基础设施能力，图中不表示消息流或执行顺序。</desc>
<defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526a76"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a52be"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9cbe"/></marker>
<style>text{font-family:'Geist','PingFang SC','Noto Sans SC',sans-serif;font-size:16px;fill:#223036}.title{font-size:28px;font-weight:600}.name{font-weight:600}.muted{fill:#526a76;font-size:14px}.code{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;fill:#526a76}.band{fill:#fff;stroke:#c8d4d9;stroke-width:1.2}.module{fill:#fff;stroke:#c8d4d9}</style>
</defs><rect width="1280" height="720" fill="#fff"/>
<text x="48" y="68" class="title">AscendStore v1 分层架构</text><text x="48" y="94" class="muted">业务层组合基础设施能力；Backend 适配原生访问；第三方系统负责实际传输与存储</text><text x="1232" y="68" class="code" text-anchor="end">1e3d0a705</text>

<g data-node="integration"><rect x="48" y="112" width="1184" height="64" rx="6" class="band"/>
<text x="64" y="139" class="name">接入与装配</text><text x="64" y="160" class="code">connector / factory</text>
<text x="240" y="139" class="name">vLLM / AscendStoreV1Connector</text><text x="240" y="160" class="muted">框架钩子与角色适配</text>
<text x="816" y="139" class="name">factory</text><text x="816" y="160" class="muted">依据已校验的配置装配 Scheduler、Worker、Backend</text></g>

<rect x="48" y="192" width="1184" height="96" rx="6" class="band"/>
<text x="64" y="228" class="name">业务层</text><text x="64" y="253" class="muted">请求决策与结果归属</text>
<g data-node="scheduler"><rect x="224" y="204" width="352" height="72" rx="4" class="module"/>
<text x="240" y="231" class="name">Scheduler</text><text x="240" y="256" class="muted">命中采用 · 分配确认 · 命令规划 · 来源引用</text></g>
<g data-node="worker"><rect x="592" y="204" width="624" height="72" rx="4" class="module"/>
<text x="608" y="231" class="name">Worker</text><text x="736" y="231" class="muted">Bulk / Layerwise（KeyRange · GVA）</text><text x="608" y="256" class="muted">对象选择与组批 · 参数组织 · 结果解释 · 对象完整性与来源安全</text></g>

<rect x="48" y="304" width="1184" height="168" rx="6" fill="#edf1fa" stroke="#2a52be" stroke-width="1.5"/>
<text x="64" y="370" class="name">基础设施层</text><text x="64" y="395" class="muted">稳定规则与执行能力</text><text x="64" y="420" class="code">infrastructure/</text>
<g data-node="configuration"><rect x="224" y="320" width="320" height="60" rx="4" class="module"/><text x="240" y="344" class="name">configuration</text><text x="240" y="367" class="muted">配置准入 · 缓存组与并行拓扑</text></g>
<g data-node="coordinator"><rect x="560" y="320" width="320" height="60" rx="4" class="module"/><text x="576" y="344" class="name">Coordinator</text><text x="576" y="367" class="muted">恢复条件 · 共同前缀 · 选择掩码</text></g>
<g data-node="mapping"><rect x="896" y="320" width="320" height="60" rx="4" class="module"/><text x="912" y="344" class="name">Mapping</text><text x="912" y="367" class="muted">对象身份 · 静态布局 · 字节位置</text></g>
<g data-node="protocol"><rect x="224" y="396" width="320" height="60" rx="4" class="module"/><text x="240" y="420" class="name">protocol</text><text x="240" y="443" class="muted">消息契约 · Lookup 编解码与 RPC</text></g>
<g data-node="execution"><rect x="560" y="396" width="320" height="60" rx="4" class="module"/><text x="576" y="420" class="name">Execution</text><text x="576" y="443" class="muted">Executor / Session · 排队、预取、同步</text></g>
<g data-node="resources"><rect x="896" y="396" width="320" height="60" rx="4" class="module"/><text x="912" y="420" class="name">Resources</text><text x="912" y="443" class="muted">资源持有 · 注册 · 安全关闭</text></g>

<g data-node="backend"><rect x="48" y="488" width="1184" height="80" rx="6" class="band"/><text x="64" y="521" class="name">Backend 适配层</text><text x="64" y="547" class="code">backend/</text>
<text x="240" y="519" class="name">访问契约</text><text x="360" y="519">整对象 / KeyRange / GVA</text><text x="240" y="545" class="muted">注册句柄 · 原生结果校验 · 对象会话</text>
<text x="816" y="519" class="name">MooncakeBackend / MemcacheBackend</text><text x="816" y="545" class="muted">本地适配代码，负责兑现访问与完成约定</text></g>

<g data-node="external"><rect x="48" y="584" width="1184" height="64" rx="6" fill="#f4f7f7" stroke="#c8d4d9"/><text x="64" y="611" class="name">第三方传输后端</text><text x="64" y="633" class="muted">原生客户端与外部服务</text>
<text x="240" y="611" class="name">Mooncake</text><text x="240" y="633" class="muted">原生 Store / 传输能力与外部存储</text>
<text x="816" y="611" class="name">Memcache</text><text x="816" y="633" class="muted">原生客户端 / 全局地址访问与外部存储</text></g>
<line x1="48" y1="652" x2="1232" y2="652" stroke="#c8d4d9"/><text x="48" y="676" class="muted">按职责组织各层；业务路径按需组合基础设施，并通过 Backend 完成实际访问。</text>
</svg>
