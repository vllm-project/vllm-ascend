<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="layerwise-object-offsets-title layerwise-object-offsets-desc"><title id="layerwise-object-offsets-title">本地地址与完整对象内偏移</title><desc id="layerwise-object-offsets-desc">L0 和 L1 的本地 block 三地址分别为一一九二和二三八四，映射到同一个四十八字节对象的零到三十二及三十二到四十八字节；单独访问 L1 不会将对象偏移归零。</desc><defs><style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap");</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#526a76"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a52be"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a9cbe"/></marker>
<style>text{font-family:'Geist','PingFang SC','Noto Sans SC',sans-serif;font-size:16px;fill:#223036}.title{font-size:28px;font-weight:600}.name{font-weight:600}.muted{fill:#526a76;font-size:14px}.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;fill:#526a76}</style></defs><rect width="960" height="600" fill="#fff"/>
<text x="40" y="68" class="title">本地地址与完整对象内偏移</text><text x="40" y="94" class="muted">独立示例：一个 key、两层、每层一个 segment；本次选择物理 block 3</text>
<text x="48" y="126" class="name">本地内存：每层有自己的基址与 stride</text><text x="584" y="126" class="name">完整对象：48 字节</text>
<path d="M408 208 H584" fill="none" stroke="#2a52be" stroke-width="1.4"/><path d="M408 356 H584" fill="none" stroke="#2a9cbe" stroke-width="1.4"/>
<rect x="440" y="180" width="112" height="20" fill="#fff"/><text x="496" y="195" text-anchor="middle" class="muted">object offset 0</text><rect x="432" y="328" width="128" height="20" fill="#fff"/><text x="496" y="343" text-anchor="middle" class="muted">object offset 32</text>
<g data-node="local-l0"><rect x="48" y="152" width="360" height="112" rx="6" fill="#edf1fa" stroke="#2a52be"/><text x="64" y="181" class="name">L0 · 32 字节</text><text x="64" y="213" class="muted">block 0 起点 1000；stride 64</text><text x="64" y="243">block 3 地址 = 1000 + 3 × 64 = 1192</text></g>
<g data-node="local-l1"><rect x="48" y="292" width="360" height="112" rx="6" fill="#edf6f9" stroke="#2a9cbe"/><text x="64" y="321" class="name">L1 · 16 字节</text><text x="64" y="353" class="muted">block 0 起点 2000；stride 128</text><text x="64" y="383">block 3 地址 = 2000 + 3 × 128 = 2384</text></g>
<g data-node="object-l0"><rect x="584" y="152" width="312" height="168" fill="#edf1fa" stroke="#2a52be"/><text x="604" y="180" class="mono">offset 0</text><text x="740" y="235" text-anchor="middle" class="name">L0: [0,32)</text><text x="740" y="264" text-anchor="middle" class="muted">32 字节</text></g>
<g data-node="object-l1"><rect x="584" y="320" width="312" height="84" fill="#edf6f9" stroke="#2a9cbe"/><text x="604" y="345" class="mono">offset 32</text><text x="740" y="377" text-anchor="middle" class="name">L1: [32,48) · 16 字节</text></g><text x="896" y="427" text-anchor="end" class="mono">object size 48</text>
<rect x="48" y="460" width="848" height="64" rx="6" fill="#f4f7f7" stroke="#c8d4d9"/><text x="64" y="486" class="name">只访问 L1，偏移仍为 32；归零会覆盖对象中 L0 的位置。</text><text x="64" y="511" class="muted">KeyRange 使用对象偏移；GVA 使用本次受保护的对象基址 G + 32。</text>
<line x1="40" y1="532" x2="920" y2="532" stroke="#c8d4d9"/><text x="40" y="556" class="muted">横线连接本地段与对象位置；颜色区分两层。左右分别使用本地地址与对象偏移。</text>
</svg>
